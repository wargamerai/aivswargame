<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../nobrowserback.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patton's Best</title>
<script data-goatcounter="https://shigerusuzuki.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
:root { --bg:#191a14; --panel:#23251b; --line:#4a4d38; --txt:#e4e2cc; --mute:#a3a488; --acc:#d9b34a; --good:#8fce6e; --bad:#e8705a; --warn:#e9b35a; --olive:#5f6a38; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:var(--fs,17px)/1.55 'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif; }
body { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
button,select,input { font:inherit; font-size:.92em; line-height:1.2; color:var(--txt); background:#33361f; border:1px solid var(--line); border-radius:3px; padding:0 8px; height:2.05em; }
button { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
input[type=checkbox] { height:auto; }
button { cursor:pointer; } button:hover:not(:disabled) { background:#4b4f2c; } button:disabled { opacity:.45; cursor:default; }
button.go { background:#6a5a1c; border-color:var(--acc); font-weight:bold; }
#bar { flex:0 0 2.5em; height:2.5em; overflow:hidden; display:flex; flex-wrap:nowrap; white-space:nowrap; gap:4px 12px; align-items:center; padding:4px 10px; background:#2a2c1d; border-bottom:1px solid var(--line); }
#bar b { color:var(--acc); } #bar .s { color:var(--mute); font-size:.9em; }
#main { flex:1 1 auto; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(340px,30vw); grid-template-rows:minmax(0,1fr); }
#left { min-width:0; min-height:0; overflow:hidden; display:flex; flex-direction:column; border-right:1px solid var(--line); }
#tabs { flex:0 0 2.6em; height:2.6em; overflow:hidden; display:flex; gap:4px; padding:4px 8px; align-items:center; white-space:nowrap; }
#tabs button.on { background:var(--olive); border-color:var(--acc); }
#board { flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:2px; }
#board svg { max-width:100%; max-height:100%; width:100%; height:100%; }
#ops { flex:0 0 8.6em; height:8.6em; padding:6px 8px; background:var(--panel); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; align-content:start; overflow:hidden; }
#ops .wide { grid-column:1/-1; }
#ops button { width:100%; }
#ops label { display:flex; align-items:center; gap:4px; }
#right { min-height:0; display:flex; flex-direction:column; background:#14150e; }
#logh { flex:0 0 2.6em; height:2.6em; overflow:hidden; white-space:nowrap; display:flex; flex-wrap:nowrap; gap:4px 8px; align-items:center; padding:5px 10px; background:#2a2c1d; border-bottom:1px solid var(--line); }
#logh b { color:var(--acc); }
.chips { display:flex; flex-wrap:wrap; gap:3px 5px; font-size:.92em; align-items:center; }
.small { font-size:.85em; color:var(--mute); }
.acc { color:var(--acc); } .bad { color:var(--bad); }
#tank { flex:0 0 11.6em; height:11.6em; overflow:auto; padding:5px 8px; background:var(--panel); border-top:1px solid var(--line); line-height:1.25; }
.thead { color:var(--mute); margin-bottom:4px; } .thead b { color:var(--acc); }
.crewgrid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5px; }
.cc { border:1px solid var(--line); border-radius:4px; padding:4px 5px; background:#1b1c13; min-width:0; }
.cc.hurt { border-color:var(--bad); }
.cc.click { cursor:pointer; } .cc.click:hover { background:#2a2c1d; } .cc.sel { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); }
.ccact { min-height:1.3em; color:#fff; font-size:.92em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px; }
#left { position:relative; }
#pop { display:none; position:absolute; left:10px; right:10px; bottom:12.2em; z-index:20; background:#2b2d1f; border:2px solid var(--acc); border-radius:6px; padding:8px 12px; box-shadow:0 6px 18px rgba(0,0,0,.7); max-height:60%; overflow:auto; }
#pop h3 { margin:0 0 6px; color:var(--acc); font-size:1em; }
button.fix { border:2px solid var(--bad); background:#5a2a1f; color:#ffe0d6; font-weight:bold; }
.fixb { display:inline-block; background:var(--bad); color:#fff; border-radius:8px; padding:0 6px; margin-left:4px; font-weight:bold; }
#ctip { display:none; position:fixed; z-index:60; pointer-events:none; max-width:min(360px,calc(100vw - 16px)); background:#26291c; border:2px solid var(--acc); border-radius:6px; padding:6px 9px; font-size:.86em; line-height:1.45; box-shadow:0 6px 18px rgba(0,0,0,.7); }
#utip { display:none; position:fixed; z-index:61; pointer-events:none; background:#111; border:2px solid var(--acc); border-radius:6px; padding:6px; text-align:center; color:#eee; font-size:.9em; box-shadow:0 6px 18px rgba(0,0,0,.7); } #utip img { display:block; width:200px; height:200px; image-rendering:auto; margin:0 auto 4px; }
#ctip b { color:var(--acc); } #ctip .g { color:var(--good); } #ctip .r { color:var(--bad); }
.minis { display:flex; flex-wrap:wrap; gap:10px; margin:4px 0; } .mini { text-align:center; font-size:.85em; color:var(--mute); }
.mini svg { display:block; width:min(280px,80vw); height:auto; border:1px solid var(--line); border-radius:4px; background:#111; }
.popx { float:right; } .popx2 { margin:6px 0; } .popx2 select { min-width:12em; }
.opts.big { margin:4px 0; }
.cct { margin-bottom:3px; } .cct b { color:var(--acc); } .rt { color:#fff; background:var(--olive); border-radius:3px; padding:0 4px; font-weight:bold; }
.hbtn { display:block; width:100%; margin-bottom:4px; } .hbtn.open { background:#8a5a12; border-color:var(--warn); color:#fff; }
.opts { display:flex; flex-wrap:wrap; gap:3px; }
.opts button { flex:0 0 auto; }
.opts.inl { display:inline-flex; align-items:center; } .opts.inl button { flex:0 0 auto; }
button.on { background:#7a6a1c !important; border-color:var(--acc) !important; color:#fff; font-weight:bold; }
.cc select { width:100%; margin-top:3px; font-size:.86em; padding:1px 2px; }
.tammo { margin-top:5px; }
.grid { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; margin:6px 0; }
body.hit #board { animation:hitflash .5s; }
@keyframes hitflash { 0% { box-shadow:inset 0 0 0 0 #f00; } 30% { box-shadow:inset 0 0 90px 30px rgba(255,0,0,.75); } 100% { box-shadow:inset 0 0 0 0 rgba(255,0,0,0); } }
.chip { border:1px solid var(--line); border-radius:3px; padding:0 5px; background:#1b1c13; }
.chip.bad { color:var(--bad); border-color:var(--bad); } .chip.good { color:var(--good); }
#log { flex:1 1 auto; min-height:0; overflow-y:auto; padding:6px 10px; line-height:1.5; }
#log div { margin:3px 0; }
#log .judge { color:#9c9d86; font-family:ui-monospace,Menlo,monospace; font-size:.8em; border-left:2px solid #4a4d38; padding-left:6px; margin:1px 0; } #log .good { color:var(--good); } #log .bad { color:var(--bad); font-weight:bold; } #log .warn { color:var(--warn); }
#log .head { color:var(--acc); font-weight:bold; margin-top:10px; padding-top:4px; border-top:1px solid var(--line); }
.logbox { margin:8px 0; padding:8px 10px; border:2px solid var(--acc); border-radius:5px; background:#23251b; }
.logbox h2 { margin:0 0 6px; color:var(--acc); font-size:1.05em; } .logbox h3 { margin:6px 0 2px; color:var(--acc); font-size:.95em; } .logbox p { margin:5px 0; }
#lbplay button.go { min-width:9em; }
#log .read { opacity:.42; }
#log .evening { color:var(--acc); font-weight:bold; margin-top:8px; }
#log .date { color:#fff; background:#33361f; font-weight:bold; padding:2px 6px; margin-top:12px; border-radius:3px; }
#over { position:fixed; inset:0; background:rgba(0,0,0,.84); display:flex; align-items:center; justify-content:center; z-index:50; padding:14px; }
#over .box { background:var(--panel); border:1px solid var(--acc); border-radius:6px; max-width:680px; width:100%; max-height:92vh; overflow:auto; padding:16px 20px; }
#over h2 { color:var(--acc); margin:0 0 8px; }
#over p { margin:6px 0; }
.tankimg { display:block; margin:0 auto; }
@media (max-width:860px) { #main { grid-template-columns:1fr; grid-template-rows:minmax(340px,60vh) 40vh; overflow:auto; } #left { overflow:auto; } .crewgrid { grid-template-columns:repeat(2,minmax(0,1fr)); } #tank { flex:none; height:auto; } #pop { position:fixed; bottom:8px; } #board { min-height:240px; } }
</style>
</head>
<body>
<div id="bar"></div>
<div id="main">
  <div id="left">
    <div id="tabs"></div>
    <div id="board"></div>
    <div id="tank"></div>
    <div id="pop"></div>
    <div id="ctip"></div>
    <div id="utip"></div>
  </div>
  <div id="right"><div id="logh"></div><div id="log"></div><div id="ops"></div></div>
</div>
<div id="over"></div>
<script src="pb_tables.js"></script>
<script src="pb_lang.js"></script>
<script src="pb_engine.js"></script>
<script src="pb_ui.js"></script>
</body>
</html>
