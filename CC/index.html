<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コルベット・コマンド</title>
<script data-goatcounter="https://shigerusuzuki.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
  :root { --bg:#0d1620; --panel:#14212e; --line:#2a3b4d; --txt:#d8e2ec; --mute:#8aa0b5; --acc:#ffcc66; --good:#7ee08a; --bad:#ff8a7a; --dice:#9ec9ff; }
  * { box-sizing: border-box; }
  html { font-size: var(--fs, 15px); }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font: 1rem/1.6 'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif; }
  body { display:flex; flex-direction:column; height:100vh; }
  #bar { flex:0 0 auto; display:flex; gap:6px; align-items:center; padding:4px 10px; background:#0a1118; border-bottom:1px solid var(--line); font-size:0.87rem; flex-wrap:wrap; }
  #bar .t { color:var(--acc); font-weight:bold; margin-right:auto; }
  #bar button { background:#1e2f40; color:var(--txt); border:1px solid var(--line); border-radius:3px; padding:2px 10px; cursor:pointer; font-size:0.80rem; }
  #bar button:hover { background:#2a4560; }
  /* 上半分: 船のステータス */
  #status { flex:0 0 var(--top, 46vh); overflow:auto; padding:8px 10px; background:var(--panel); border-bottom:2px solid var(--line); display:flex; gap:14px; flex-wrap:wrap; align-content:flex-start; font-size:0.87rem; }
  #status .col { min-width:15em; }
  #status .col.ship { min-width:18em; }
  #status .col.ub { flex:0 1 19em; }
  .map { max-width:100%; overflow-x:auto; }
  #status .info { flex:1; min-width:16em; }
  #status .title { color:var(--acc); font-weight:bold; font-size:1.00rem; margin-bottom:4px; }
  .chips { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:3px; margin:2px 0 4px; }
  .chip { border:1px solid #2f4a63; border-radius:3px; padding:0 5px; background:#182634; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip b { color:#fff; } .chip.na { color:#56687a; border-color:#223344; }
  .shipline { white-space:nowrap; }
  table.sec { border-collapse:collapse; margin-bottom:4px; }
  table.sec td { padding:1px 8px 1px 0; border-bottom:1px solid #1e2c3a; white-space:nowrap; }
  table.sec tr.na td { color:#56687a; }
  .df { color:var(--bad); margin-right:4px; } .dm { background:#7a2a20; color:#fff; padding:0 3px; border-radius:2px; font-size:0.73rem; margin-right:4px; } .tr { color:var(--good); }
  .hb { display:inline-block; width:14px; height:14px; border:1px solid var(--mute); margin-right:2px; vertical-align:middle; } .hb.on { background:var(--bad); border-color:var(--bad); }
  .tok { color:var(--acc); margin-top:2px; }
  .vp { margin-top:4px; color:var(--mute); }
  .ub { border:1px solid #6a3030; border-radius:4px; padding:4px 8px; background:#2a1717; }
  .ub .title { color:#ff9f8f; }
  .good { color:var(--good); }
  /* 航路の小さな地図 */
  .map { margin-top:6px; display:inline-block; }
  .mr { display:flex; }
  .mc { width:2.0rem; height:1.9rem; margin:1px; display:inline-flex; flex-direction:column; align-items:center; justify-content:center; font-size:0.73rem; border-radius:2px; line-height:1; }
  .mc .co { font-size:0.55rem; color:#9fb3c6; font-weight:normal; }
  .mc.here .co { color:#3a2a00; } .mc.opt .co { color:#d8ffe0; }
  .mc b { font-weight:inherit; min-height:0.8em; }
  .mc.none { visibility:hidden; }
  .mc.sC { background:#33475c; } .mc.sA { background:#24313f; } .mc.sW { background:#4a3a3a; }
  .mc.route { box-shadow: inset 0 0 0 2px #c79a4a; }
  .mc.port { background:#20406a; color:#fff; font-weight:bold; font-size:0.60rem; }
  .mc.dest { outline:2px solid var(--good); }
  .mc.here { background:var(--acc) !important; color:#000; font-weight:bold; }
  .mc.opt { background:#2f7a3f !important; color:#fff; font-weight:bold; font-size:0.87rem; cursor:pointer; outline:2px solid #9dffb0; }
  /* 距離の図（コルベット ← 近 中 長 圏外） */
  .rng { display:flex; flex-direction:column; gap:2px; margin-top:6px; align-items:stretch; }
  .rc { border:1px solid #3a5068; border-radius:3px; padding:1px 6px; font-size:0.80rem; background:#1a2836; display:flex; flex-direction:row; align-items:center; gap:8px; min-height:1.6em; }
  .rc small { color:var(--mute); font-size:0.73rem; min-width:3.5em; }
  .rc.corv { background:#20406a; color:#fff; font-weight:bold; justify-content:center; }
  .rc.ubh { background:#5a2424; border-color:#ff8a7a; color:#fff; }
  .rc.tph { background:#5a4a14; border-color:var(--acc); color:var(--acc); }
  .rc i { font-style:normal; color:var(--mute); font-size:0.67rem; }
  .rrule { color:var(--mute); font-size:0.73rem; margin-top:2px; }
  .mc.opt:hover { background:#3fa055 !important; }
  /* 上と下の境目（つまんで動かす） */
  #split { flex:0 0 10px; cursor:row-resize; background:#0a1118; display:flex; align-items:center; justify-content:center; touch-action:none; }
  #split span { width:48px; height:4px; border-radius:2px; background:#3a5068; }
  #split:hover span, body.dragging #split span { background:var(--acc); }
  body.dragging { user-select:none; cursor:row-resize; }
  /* 下半分: 文字のやり取り */
  #bottom { flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
  #log { flex:1 1 auto; overflow-y:auto; padding:8px 12px; }
  .ln { margin:1px 0; }
  .ln.head { color:var(--acc); font-weight:bold; margin-top:8px; }
  .ln.dice { color:var(--dice); font-size:0.87rem; }
  .ln.good { color:var(--good); } .ln.bad { color:var(--bad); }
  .you { color:#c8b6ff; }
  #choices { flex:0 0 auto; padding:6px 10px 10px; border-top:1px solid var(--line); background:#0f1a24; max-height:40%; overflow-y:auto; }
  #choices .prompt { color:var(--acc); margin-bottom:4px; }
  .askrow { display:flex; gap:6px; }
  .askrow input { flex:1; font-size:1rem; padding:6px 8px; background:#0b141d; color:var(--txt); border:1px solid #2f4a63; border-radius:4px; }
  .askrow button { padding:6px 16px; background:#27445f; color:var(--txt); border:1px solid #2f4a63; border-radius:4px; cursor:pointer; font-size:0.93rem; }
  .cap { color:var(--mute); font-weight:normal; }
  #choices button { display:block; width:100%; text-align:left; margin:3px 0; padding:6px 10px; background:#1b2d3f; color:var(--txt); border:1px solid #2f4a63; border-radius:4px; cursor:pointer; font-size:0.93rem; }
  #choices button:hover { background:#27445f; }
  #choices .k { display:inline-block; min-width:20px; color:var(--acc); font-weight:bold; }
  #choices .hint { color:var(--mute); font-size:0.80rem; margin-left:8px; }
  /* 物語で報告 */
  .ln.story { color:#f0e6d0; font-size:1.00rem; margin:6px 0; line-height:1.75; font-family:'Hiragino Mincho ProN','Yu Mincho',serif; }
  .ln.big { margin:8px 0; padding:8px 12px; border-left:4px solid var(--acc); background:#1b2633; font-weight:bold; font-size:1.00rem; line-height:1.7; }
  .ln.big.bad { border-color:#ff6b5a; background:#2c1717; color:#ffd2cb; }
  .ln.big.good { border-color:#5fd27a; background:#15291b; color:#d4f7dc; }
  body:not(.story-mode) .ln.story, body:not(.story-mode) .ln.big { display:none; }
  body.story-mode .ln:not(.story):not(.big):not(.head):not(.you) { display:none !important; }
  body.story-mode .ln.head { font-size:0.87rem; }
  /* オプション: 隠す行 */
  body.hide-dice .ln.dice { display:none; }
  body.hide-routine .ln.routine { display:none !important; }
  .ln.ubdmg-alt, .ln.badev-alt, .ln.ubinfo-alt { display:none; }
  body.hide-enemy .ln.ubdmg, body.hide-enemy .ln.ubinfo { display:none; } body.hide-enemy .ln.ubdmg-alt, body.hide-enemy .ln.ubinfo-alt { display:block; }
  body.hide-routine .ln.routine.ubinfo-alt, body.hide-routine .ln.routine.ubinfo { display:none; }
  body.hide-bad .ln.badev { display:none; } body.hide-bad .ln.badev-alt { display:block; }
  body.story-mode .ln.ubdmg-alt:not(.story):not(.big), body.story-mode .ln.ubdmg:not(.story):not(.big) { display:none; }
  #optOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:50; }
  .optbox { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px 18px; max-width:420px; width:92%; }
  .optbox .title { color:var(--acc); font-weight:bold; margin-bottom:8px; }
  .optbox label { display:block; margin:8px 0; cursor:pointer; }
  .optbox small { color:var(--mute); }
  .optbox button { margin-top:10px; width:100%; padding:6px; background:#1e2f40; color:var(--txt); border:1px solid var(--line); border-radius:4px; cursor:pointer; }
  @media (max-width: 600px) { #status { flex-basis:44%; } .col { min-width:0 !important; width:100%; } }
</style>
</head>
<body>
<div id="bar">
  <span class="t" data-en="Corvette Command">コルベット・コマンド</span>
  <button onclick="fontSize(-1)" title="文字を小さく" data-en="A−" data-en-title="Smaller text">文字−</button>
  <button onclick="fontSize(1)" title="文字を大きく" data-en="A＋" data-en-title="Larger text">文字＋</button>
  <button id="stepBtn" onclick="toggleStep()" data-en="Step by step: ON">1手ずつ: ON</button>
  <button onclick="openOptions()" data-en="Options">オプション</button>
  <button onclick="downloadLog()" data-en="Logbook">航海日誌</button>
  <button onclick="saveFile()">Save</button>
  <button onclick="loadFile()">Load</button>
  <button onclick="restart()" data-en="New game">最初から</button>
  <button onclick="setLang(LANG === 'en' ? 'ja' : 'en')" title="言語 / Language">日本語 / English</button>
</div>
<div id="status"></div>
<div id="split" title="つまんで上下に動かすと、上の画面の高さを変えられます（ダブルクリックで元に戻す）"><span></span></div>
<div id="bottom">
  <div id="log"></div>
  <div id="choices"></div>
</div>
<script src="cc_lang.js"></script>
<script src="cc_data.js"></script>
<script src="cc_story.js"></script>
<script src="cc_story_en.js"></script>
<script src="cc_game.js"></script>
<script>
  // 英語の時は、上のボタンなどの文字を英語にする
  if (LANG === 'en') {
    document.title = 'Corvette Command';
    document.querySelectorAll('[data-en]').forEach(e => { e.textContent = e.dataset.en; });
    document.querySelectorAll('[data-en-title]').forEach(e => { e.title = e.dataset.enTitle; });
  }
</script>
</body>
</html>
