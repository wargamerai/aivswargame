<!DOCTYPE html>
<html lang="ja">
<head>
<script defer src="../board-zoom.js"></script>
<meta charset="UTF-8">
<title>装甲擲弾兵 — Panzer Grenadier</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--pg-panel); color:var(--pg-ink); font-family:'Segoe UI',sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column; }

/* --- トップバー --- */
#topbar {
  background:var(--pg-panel); padding:6px 12px; display:flex; align-items:center; gap:12px;
  border-bottom:1px solid var(--pg-line); flex:0 0 auto; font-size:0.9em;
}
#topbar .title { font-weight:bold; font-size:1.1em; color:var(--pg-accent); }
#topbar .info { color:var(--pg-muted); }
#phaseBar { display:flex; gap:2px; }
#phaseBar .ph {
  padding:3px 8px; background:var(--pg-shade); border-radius:3px; font-size:0.8em; color:var(--pg-muted); cursor:pointer;
}
#phaseBar .ph.active { background:var(--pg-gold); color:var(--pg-ink); font-weight:bold; }
#phaseBar .ph.done { background:var(--pg-shade); color:var(--pg-muted); }
button.top-btn {
  background:var(--pg-blue-bg); color:var(--pg-ink); border:1px solid var(--pg-line); padding:4px 12px;
  border-radius:3px; cursor:pointer; font-size:0.85em;
}
button.top-btn:hover { background:var(--pg-shade); }

/* --- メインエリア --- */
#main { display:flex; flex:1; overflow:hidden; }

/* --- マップエリア --- */
#mapArea { flex:1; position:relative; overflow:hidden; background:var(--pg-map); margin:0; padding:0; }
#mapCanvas { position:absolute; top:0; left:0; cursor:grab; margin:0; padding:0; }

/* --- 右パネル --- */
#rightPanel {
  width:320px; background:var(--pg-panel); border-left:1px solid var(--pg-line);
  display:flex; flex-direction:column; flex:0 0 320px; overflow-y:auto;
}
#rightPanel .phase-title {
  padding:8px 12px; background:var(--pg-card); color:var(--pg-accent); font-weight:bold;
  font-size:0.95em; border-bottom:1px solid var(--pg-line);
}
#phaseContent { padding:10px; flex:1; }

/* --- イニシアチブ・チャート --- */
#initChart { margin:10px 0; }
#initChart table { border-collapse:collapse; width:100%; font-size:0.8em; }
#initChart th, #initChart td {
  border:1px solid var(--pg-line); padding:3px 6px; text-align:center; min-width:24px;
}
#initChart th { background:var(--pg-shade); color:var(--pg-muted); }
#initChart td.a { background:var(--pg-blue-bg); color:var(--pg-blue); }
#initChart td.g { background:var(--pg-red-bg); color:var(--pg-red); }
#initChart td.marker { outline:3px solid #ff0; outline-offset:-2px; }

/* マーカー位置表示 */
#markerRow { display:flex; gap:2px; margin:8px 0; }
#markerRow .slot {
  flex:1; height:24px; background:var(--pg-shade); border:1px solid var(--pg-line); border-radius:2px;
  display:flex; align-items:center; justify-content:center; font-size:0.7em; color:var(--pg-muted);
}
#markerRow .slot.current { background:var(--pg-gold); color:var(--pg-ink); font-weight:bold; }

/* ダイス */
#diceArea { text-align:center; margin:8px 0; }
#diceResult {
  display:inline-block; width:80px; height:80px; line-height:80px;
  background:var(--pg-card); border:3px solid var(--pg-accent); border-radius:10px;
  font-size:3em; font-weight:bold; color:var(--pg-accent); margin:6px;
}
#diceResult.rolling { animation:shake 0.08s infinite; border-color:var(--pg-red); }
@keyframes shake {
  0%,100% { transform:rotate(0deg) scale(1); }
  25% { transform:rotate(-8deg) scale(1.05); }
  75% { transform:rotate(8deg) scale(1.05); }
}
button.dice-btn {
  background:var(--pg-gold); color:var(--pg-ink); border:none; padding:10px 28px;
  border-radius:4px; font-size:1.1em; font-weight:bold; cursor:pointer;
}
button.dice-btn:hover { background:var(--pg-gold); }
button.dice-btn:disabled { background:var(--pg-shade); color:var(--pg-muted); cursor:default; }
.btn-sm { background:var(--pg-shade); color:var(--pg-ink); border:1px solid var(--pg-line); padding:4px 12px; border-radius:3px; cursor:pointer; font-size:0.85em; }
.btn-sm:hover { background:var(--pg-shade); }

/* 結果表示 — 大きく */
#initResult {
  text-align:center; padding:12px; margin:8px 0;
  border-radius:6px; font-weight:bold; font-size:1.3em; display:none;
  border:2px solid;
}
#initResult.allied { background:var(--pg-blue-bg); color:var(--pg-blue); border-color:var(--pg-blue); }
#initResult.german { background:var(--pg-red-bg); color:var(--pg-red); border-color:var(--pg-red); }

/* ダイス結果オーバーレイ */
#diceOverlay {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(241,236,220,0.84); z-index:500;
  justify-content:center; align-items:center; flex-direction:column;
}
#diceOverlay.show { display:flex; }
#diceOverlay .big-result {
  font-size:4em; font-weight:bold; padding:20px 40px;
  border-radius:12px; margin:10px; border:3px solid;
}
#diceOverlay .big-die {
  font-size:6em; font-weight:bold; color:var(--pg-accent);
  background:var(--pg-card); border:4px solid var(--pg-accent); border-radius:14px;
  width:120px; height:120px; line-height:120px; text-align:center; margin:10px;
}
#diceOverlay .big-result.allied { background:var(--pg-blue-bg); color:var(--pg-blue); border-color:var(--pg-blue); }
#diceOverlay .big-result.german { background:var(--pg-red-bg); color:var(--pg-red); border-color:var(--pg-red); }

/* --- 砲撃結果オーバーレイ --- */
#fireOverlay {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(241,236,220,0.9); z-index:600;
  justify-content:center; align-items:center; flex-direction:column;
}
#fireOverlay.show { display:flex; }
#fireOverlay .fire-title {
  font-size:2em; font-weight:bold; color:var(--pg-red); margin-bottom:12px;
}
#fireOverlay .fire-target {
  font-size:1.2em; color:var(--pg-accent); margin-bottom:16px;
}
#fireOverlay .fire-results {
  max-width:600px; width:90%;
}
#fireOverlay .fire-row {
  display:flex; align-items:center; gap:12px; padding:10px 16px; margin:4px 0;
  background:var(--pg-card); border-radius:8px; border-left:4px solid var(--pg-line);
  animation: fireRowIn 0.3s ease-out forwards;
  opacity:0; transform:translateX(-20px);
}
@keyframes fireRowIn {
  to { opacity:1; transform:translateX(0); }
}
#fireOverlay .fire-row.hit-d { border-left-color:#fd8; }
#fireOverlay .fire-row.hit-dd { border-left-color:var(--pg-red); }
#fireOverlay .fire-row.hit-elim { border-left-color:#f22; }
#fireOverlay .fire-row.hit-none { border-left-color:var(--pg-line); }
#fireOverlay .fire-unit-name {
  flex:1; font-weight:bold; font-size:1.1em; color:var(--pg-ink);
}
#fireOverlay .fire-dice {
  display:inline-block; width:48px; height:48px; line-height:48px; text-align:center;
  background:var(--pg-card); border:3px solid var(--pg-accent); border-radius:8px;
  font-size:1.8em; font-weight:bold; color:var(--pg-accent);
}
#fireOverlay .fire-dice.rolling { animation:shake 0.08s infinite; border-color:var(--pg-red); }
#fireOverlay .fire-detail {
  font-size:0.85em; color:var(--pg-muted);
}
#fireOverlay .fire-damage {
  font-size:1.3em; font-weight:bold; padding:4px 12px; border-radius:4px;
  min-width:60px; text-align:center;
}
#fireOverlay .fire-damage.none { background:var(--pg-shade); color:var(--pg-muted); }
#fireOverlay .fire-damage.d { background:var(--pg-gold); color:var(--pg-accent); }
#fireOverlay .fire-damage.dd { background:var(--pg-red-bg); color:var(--pg-red); }
#fireOverlay .fire-damage.eliminated, #fireOverlay .fire-damage.elim { background:var(--pg-red-bg); color:var(--pg-ink); }
#fireOverlay .fire-close {
  color:var(--pg-muted); font-size:0.9em; margin-top:16px; cursor:pointer;
}

/* フェイズ情報 */
.phase-info { color:var(--pg-muted); font-size:0.85em; line-height:1.6; margin:8px 0; }
.phase-btn-row { display:flex; gap:8px; margin:8px 0; }

/* 回復フェイズ */
.recovery-section { margin:8px 0; }
.recovery-section h3 { color:var(--pg-accent); font-size:0.9em; margin:8px 0 4px; border-bottom:1px solid var(--pg-line); padding-bottom:2px; }
.recovery-unit {
  display:flex; align-items:center; gap:6px; padding:4px 6px; margin:2px 0;
  background:var(--pg-card); border-radius:3px; font-size:0.82em;
}
.recovery-unit .u-name { flex:1; font-weight:bold; }
.recovery-unit .u-status { padding:1px 6px; border-radius:2px; font-size:0.9em; font-weight:bold; }
.recovery-unit .u-status.ok { background:var(--pg-green-bg); color:var(--pg-green); }
.recovery-unit .u-status.d { background:var(--pg-gold); color:var(--pg-accent); }
.recovery-unit .u-status.dd { background:var(--pg-red-bg); color:var(--pg-red); }
.recovery-unit .u-status.eliminated { background:var(--pg-red-bg); color:var(--pg-red); }
.recovery-unit .u-morale { color:var(--pg-muted); font-size:0.85em; }
.recovery-unit .u-blocked { color:var(--pg-red); font-size:0.8em; }
.recovery-unit .u-result { font-size:0.85em; padding:1px 4px; border-radius:2px; }
.recovery-unit .u-result.success { background:var(--pg-green-bg); color:var(--pg-green); }
.recovery-unit .u-result.fail { background:var(--pg-shade); color:var(--pg-muted); }
.recovery-unit .u-result.critical { background:var(--pg-red-bg); color:var(--pg-red); }
.recovery-unit button {
  background:var(--pg-shade); color:var(--pg-ink); border:none; padding:2px 8px; border-radius:3px;
  cursor:pointer; font-size:0.85em;
}
.recovery-unit button:hover { background:var(--pg-shade); }
.recovery-unit button:disabled { background:var(--pg-shade); color:var(--pg-muted); cursor:default; }
.recovery-all-btn {
  background:var(--pg-gold); color:var(--pg-ink); border:none; padding:6px 16px; border-radius:4px;
  font-size:0.9em; font-weight:bold; cursor:pointer; margin:6px 0;
}
.recovery-all-btn:hover { background:var(--pg-gold); }
.recovery-all-btn:disabled { background:var(--pg-shade); color:var(--pg-muted); cursor:default; }

/* --- ログ --- */
#gameLog {
  flex:0 0 auto; max-height:140px; overflow-y:auto;
  background:var(--pg-panel); color:var(--pg-ink); font-size:0.8em; font-family:monospace;
  padding:4px 8px; border-top:1px solid var(--pg-line); line-height:1.5;
}
#gameLog .log-turn { color:var(--pg-accent); font-weight:bold; }
#gameLog .log-init { color:var(--pg-blue); }

/* --- スタック吹き出し --- */
#stackPopup {
  display:none; position:fixed; z-index:400;
  background:var(--pg-panel); border:2px solid var(--pg-accent); border-radius:8px;
  padding:8px; min-width:120px; max-width:360px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  pointer-events:auto;
}
#stackPopup .popup-arrow {
  position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
  width:0; height:0; border-left:8px solid transparent; border-right:8px solid transparent;
  border-top:8px solid var(--pg-accent);
}
#stackPopup .popup-title {
  color:var(--pg-accent); font-size:0.8em; font-weight:bold; margin-bottom:6px;
  border-bottom:1px solid var(--pg-line); padding-bottom:4px;
}
#stackPopup .popup-unit {
  display:flex; align-items:center; gap:8px; padding:4px 2px;
  border-bottom:1px solid var(--pg-line);
}
#stackPopup .popup-unit:last-child { border-bottom:none; }
#stackPopup .popup-unit img {
  width:106px; height:106px; object-fit:contain; border:1px solid var(--pg-line); border-radius:2px;
}
#stackPopup .popup-unit .pu-info { font-size:0.8em; }
#stackPopup .popup-unit .pu-name { font-weight:bold; color:var(--pg-ink); }
#stackPopup .popup-unit .pu-status {
  display:inline-block; padding:1px 6px; border-radius:2px; font-size:0.85em; font-weight:bold; margin-top:2px;
}
#stackPopup .popup-unit .pu-status.ok { background:var(--pg-green-bg); color:var(--pg-green); }
#stackPopup .popup-unit .pu-status.d { background:var(--pg-gold); color:var(--pg-accent); }
#stackPopup .popup-unit .pu-status.dd { background:var(--pg-red-bg); color:var(--pg-red); }
.pg-order-picker,.pg-stack-checks{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.pg-order-picker .is-selected{outline:1px solid var(--pg-accent)}
</style>

<!-- タイトル画面オーバーレイ -->
<div id="titleOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:var(--pg-panel);z-index:9999;display:flex;flex-direction:column;align-items:center;overflow-y:auto;">
  <div style="text-align:center;padding:40px 20px 20px;">
    <h1 style="font-size:2.8em;color:var(--pg-accent);letter-spacing:0.15em;text-shadow:2px 2px 8px rgba(0,0,0,0.8);">装甲擲弾兵</h1>

  <div style="max-width:900px;width:100%;padding:20px;" id="titleContent"></div>

<!-- トップバー -->
<div id="topbar">

  <button class="top-btn" id="btnSplit" onclick="toggleStackSplit()" style="margin-left:4px;">スタック解除</button>
  <span id="losInfo" style="color:var(--pg-muted);font-size:0.8em;display:none;"></span>
  <span id="hexCursor" style="color:var(--pg-accent);font-size:0.85em;font-weight:bold;margin-left:8px;">--</span>
</div>

<!-- メイン -->
<div id="main">
  <!-- マップ -->
  <div id="mapArea">

  </div>

  <!-- 右パネル -->
  <div id="rightPanel">

<!-- ゲーム終了オーバーレイ -->
<div id="gameOverOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(241,236,220,0.92);z-index:9999;justify-content:center;align-items:center;flex-direction:column;cursor:pointer;" onclick="this.style.display='none'">
  <div id="gameOverTitle" style="font-size:3em;font-weight:bold;text-shadow:0 0 20px currentColor;"></div>
  <div id="gameOverDetail" style="font-size:1.5em;color:var(--pg-ink);margin-top:20px;"></div>
  <div style="color:var(--pg-muted);font-size:0.9em;margin-top:30px;">クリックで閉じる</div>
</div>

<!-- ダイス結果オーバーレイ -->
<div id="diceOverlay" onclick="closeDiceOverlay()">
  <div class="big-die" id="overlayDie">-</div>
  <div class="big-result" id="overlayResult"></div>
  <div style="color:var(--pg-muted);font-size:0.9em;margin-top:10px;">クリックで閉じる</div>
</div>

<!-- 砲撃結果オーバーレイ -->
<div id="fireOverlay">
  <div class="fire-title" id="fireOverlayTitle">砲撃！</div>
  <div class="fire-target" id="fireOverlayTarget"></div>
  <div class="fire-results" id="fireOverlayResults"></div>
  <div class="fire-close" onclick="closeFireOverlay()">クリックで閉じる</div>
</div>

<!-- AI配置完了オーバーレイ -->
<div id="aiPlacementOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(241,236,220,0.9);z-index:9999;display:none;justify-content:center;align-items:center;">
  <div style="background:var(--pg-panel);border:2px solid var(--pg-accent);border-radius:12px;padding:30px 50px;text-align:center;max-width:500px;">
    <div style="font-size:1.5em;color:var(--pg-accent);font-weight:bold;margin-bottom:15px;" id="aiPlacementTitle">AI配置完了</div>
    <div style="color:var(--pg-ink);font-size:1.1em;margin-bottom:20px;" id="aiPlacementInfo"></div>
    <button onclick="closeAIPlacementOverlay()" style="background:var(--pg-gold);color:var(--pg-ink);border:none;padding:10px 30px;border-radius:6px;font-size:1.1em;font-weight:bold;cursor:pointer;">ゲーム開始</button>
  </div>
</div>

<!-- スタック吹き出し -->
<div id="stackPopup">
  <div class="popup-arrow"></div>
  <div id="stackPopupContent"></div>
</div>

<!-- 下部バー -->
<div id="bottomBar" style="background:var(--pg-panel);border-top:1px solid var(--pg-line);padding:4px 10px;font-size:0.85em;display:flex;align-items:center;gap:8px;">
  <span id="visionDisplay" style="color:var(--pg-accent);font-weight:bold;">--</span>
  <span style="color:var(--pg-muted);">|</span>
  <button class="top-btn" onclick="zoomFit()">全体</button>
  <button class="top-btn" onclick="zoomStep(-10)">−</button>
  <input type="range" id="zoomSlider" min="10" max="300" value="100" style="width:120px;vertical-align:middle;">
  <button class="top-btn" onclick="zoomStep(10)">＋</button>
  <span id="zoomLabel" style="color:var(--pg-muted);font-size:0.8em;">100%</span>
  <button class="top-btn" id="btnLOS" onclick="toggleLOSMode()" style="margin-left:8px;">視認</button>
  <button class="top-btn" id="btnLOSCheck" onclick="toggleLOSCheckMode()" style="margin-left:4px;">LOS確認</button>
  <span id="losCheckInfo" style="color:var(--pg-muted);font-size:0.8em;margin-left:4px;"></span>
  <span style="color:var(--pg-muted);margin-left:8px;">|</span>
  <span id="breakthroughScore" style="color:var(--pg-red);font-weight:bold;margin-left:4px;">突破: 0 / 7</span>
  <span style="color:var(--pg-muted);margin-left:8px;">|</span>
  <button class="top-btn" id="btnAIStep" onclick="toggleAIStepMode()" style="margin-left:4px;">確認:ON</button>
</div>

<!-- ログ（非表示） -->
<div id="gameLog" style="display:none;"></div>

<script>

(function() {
  var sid = parseInt(new URLSearchParams(window.location.search).get('scenario')) || 2;

<script>
// ===== ゲーム状態 =====
// URLパラメータからシナリオと陣営を取得
const _urlParams = new URLSearchParams(window.location.search);
const _scenarioId = parseInt(_urlParams.get('scenario')) || 2;
const _playerSide = _urlParams.get('side') || 'allied';

// シナリオ選択
const scenarioDefinitions = {
  2: () => SCENARIO_2,
  3: () => SCENARIO_3,
  7: () => SCENARIO_7,
  8: () => SCENARIO_8,
  9: () => SCENARIO_9,
};
const SCENARIO = window['SCENARIO_' + _scenarioId] || (scenarioDefinitions[_scenarioId] ?? scenarioDefinitions[2])();

const G = {
  turn: 1,
  maxTurn: SCENARIO.maxTurn,
  phase: 0, // 0-6
  markerPos: SCENARIO.initiative.start,
  initiative: null,
  markerShift: SCENARIO.initiative.shift,
  diceRolled: false,
  visionRange: SCENARIO.visionRange,
  playerSide: _playerSide,
  ammoCheck: SCENARIO.ammoCheck,
  breakthroughCount: 0, // 突破ユニット数
};

const PHASES = [
  { id:'initiative', name:'イニシアチブ', short:'主導権' },
  { id:'recovery',   name:'回復',         short:'回復' },
  { id:'supportAtk', name:'先攻支援射撃',  short:'先攻支援' },
  { id:'supportDef', name:'後攻支援射撃',  short:'後攻支援' },
  { id:'moveFire',   name:'先攻移動・射撃', short:'移動射撃' },
  { id:'assault',    name:'突撃',         short:'突撃' },
  { id:'defMove',    name:'後攻移動',     short:'後攻移動' },
  { id:'turnEnd',    name:'ターン終了',   short:'終了' },
];

// ===== ユニットデータ =====
// morale: ユニット固有のモラルレベル（数値）
// status: 'ok', 'd', 'dd', 'eliminated'
// side: 'german' or 'allied'
// type: 'T','AC','AT','A','I' (戦車/装甲車/対戦車砲/砲兵/歩兵)
// hexId: 配置ヘクス
// adjacentEnemy: 敵隣接フラグ（マップから計算）
// inEnemyRange: 敵射程内フラグ
// inCover: 遮蔽物内フラグ（森/林/町/市街地）
// leaderM: M能力リーダーがスタックにいるか

// 仮ユニット（テスト用）
let units = [
  // シナリオデータから読み込む — testUnits生成後に代入される
];

// ===== ダミーと偵察 (ルール7) =====
// ダミーは独立したユニット駒として testUnits に type='dummy' で存在する
// 旧dummyMapは互換用に残す（空オブジェクト）
const dummyMap = {};

// 国籍別ダミー画像
const DUMMY_IMAGES = {
  'イギリス軍': 'images/ge表1cut46000020.jpg',
  'アメリカ軍': 'images/us表03cut28000014.jpg',
  'ドイツ軍':   'images/ドイツcut47000021.jpg',
};

// ダミーを配置（ユニットとして生成）
function placeDummy(hexId, side, count, nation) {
  if (!count || count <= 0) return;
  // nationが指定されなければ同ヘクスのユニットから推定
  if (!nation) {
    const mate = testUnits.find(u => u.hexId === hexId && u.side === side && u.nation);
    nation = mate ? mate.nation : (side === 'german' ? 'ドイツ軍' : 'イギリス軍');
  }
  const existing = getDummyCount(hexId);
  const toAdd = Math.min(count, 4 - existing); // 7-1-(7) 4枚まで
  const pos = fromHexId(hexId);
  for (let i = 0; i < toAdd; i++) {
    const center = getHexCenter(pos.col, pos.row);
    const dummy = {
      id: `dummy_${side}_${hexId}_${Date.now()}_${i}`,
      name: `ダミー`,
      unitName: 'Dummy',
      type: 'dummy',
      side: side,
      nation: nation,
      col: pos.col, row: pos.row,
      x: center.x, y: center.y,
      hexId: hexId,
      status: 'ok',
      range: 0, fpAT: 0, fpSoft: 0, def: 0, morale: 0,
      closeAtk: 0, closeDef: 0, move: 0,
      src: DUMMY_IMAGES[nation] || '',
    };
    testUnits.push(dummy);
  }
}

// ダミー枚数を取得
function getDummyCount(hexId) {
  return testUnits.filter(u =>
    u.type === 'dummy' && u.hexId === hexId && u.status !== 'eliminated'
  ).length;
}

// ダミーを除去（指定枚数）
function removeDummy(hexId, count) {
  const dummies = testUnits.filter(u =>
    u.type === 'dummy' && u.hexId === hexId && u.status !== 'eliminated'
  );
  const toRemove = Math.min(dummies.length, count);
  for (let i = 0; i < toRemove; i++) {
    dummies[i].status = 'eliminated';
  }
  return toRemove;
}

// ダミーを全除去
function removeAllDummies(hexId) {
  const dummies = testUnits.filter(u =>
    u.type === 'dummy' && u.hexId === hexId && u.status !== 'eliminated'
  );
  dummies.forEach(d => { d.status = 'eliminated'; });
  return dummies.length;
}

// 7-1-(5): ダミーによる視認保護判定
function isDummyProtected(hexId) {
  if (getDummyCount(hexId) === 0) return false;
  const terrain = getHexTerrain(hexId);
  if (terrain === 'p' || terrain === 'r') return false;
  return true;
}

// 7-1-(5): 平地・荒地で敵に視認された場合ダミー除去
function checkDummyOnSpotted(hexId, spottingSide) {
  if (getDummyCount(hexId) === 0) return false;
  // そのヘクスのダミーが視認側の敵のものか
  const dummies = testUnits.filter(u => u.type === 'dummy' && u.hexId === hexId && u.status !== 'eliminated');
  if (dummies.length === 0) return false;
  if (dummies[0].side === spottingSide) return false; // 自軍のダミーには影響なし
  const terrain = getHexTerrain(hexId);
  if (terrain === 'p' || terrain === 'r') {
    const removed = removeAllDummies(hexId);
    addLog('dummy', `ダミー除去: ${hexId} (平地/荒地で視認) ${removed}枚`);
    return true;
  }
  return false;
}

// ユニット移動時のダミー視認チェック
// 移動したユニットの視認範囲内にある敵の平地/荒地ダミーを除去
// また、移動したユニット自身が平地/荒地にいて敵から視認される場合もダミー除去
function checkDummyVisibility(movedUnit) {
  const side = movedUnit.side;
  const enemySide = side === 'german' ? 'allied' : 'german';

  // 1. 移動ユニットが敵のダミーを視認
  const visionRange = G.visionPoints || 12;
  testUnits.forEach(u => {
    if (u.type !== 'dummy' || u.side === side || u.status === 'eliminated') return;
    const dist = hexDistance(movedUnit.col, movedUnit.row, u.col, u.row);
    if (dist > 0 && dist <= visionRange) {
      if (hasLOS(movedUnit.col, movedUnit.row, u.col, u.row)) {
        checkDummyOnSpotted(u.hexId, side);
      }
    }
  });

  // 2. 移動ユニット自身が平地/荒地にいて、敵から視認される→自分のダミー除去
  const myHexId = toHexId(movedUnit.col, movedUnit.row);
  if (getDummyCount(myHexId) > 0) {
    const myDummies = testUnits.filter(u => u.type === 'dummy' && u.hexId === myHexId && u.status !== 'eliminated');
    if (myDummies.length > 0 && myDummies[0].side === side) {
      const terrain = getHexTerrain(myHexId);
      if (terrain === 'p' || terrain === 'r') {
        // 敵の視認範囲内か
        const spotted = testUnits.some(e =>
          e.side === enemySide && e.status !== 'eliminated' && e.type !== 'dummy' &&
          hexDistance(e.col, e.row, movedUnit.col, movedUnit.row) <= visionRange &&
          hasLOS(e.col, e.row, movedUnit.col, movedUnit.row)
        );
        if (spotted) {
          checkDummyOnSpotted(myHexId, enemySide);
        }
      }
    }
  }
}

// 7-2: ダミー増加判定（ターン終了時）
// 条件: 攻撃を受けず、行動せず、視認されず、D/DDでない
function checkDummyIncrease(hexId, side) {
  // 1ヘクスにつき1枚
  if (getDummyCount(hexId) >= 4) return false; // 上限

  // 同ヘクスのユニットを確認
  const hexUnits = units.filter(u =>
    u.hexId === hexId && u.side === side &&
    u.status !== 'eliminated' &&
    u.type !== 'leader' && u.type !== 'dummy'
  );
  if (hexUnits.length === 0) return false;

  // D/DD状態のユニットがいたら不可 7-2-(4)
  if (hexUnits.some(u => u.status === 'd' || u.status === 'dd')) return false;

  // 行動フラグ・被攻撃フラグ・被視認フラグのチェック（実装時にフラグ追加）
  if (hexUnits.some(u => u.actedThisTurn || u.attackedThisTurn || u.spottedThisTurn)) return false;

  placeDummy(hexId, side, 1);
  addLog('init', `ダミー増加: ${hexId} (+1枚, 計${getDummyCount(hexId)}枚)`);
  return true;
}

// 7-3: ダミー除去（行動時）
// 行動しようとしたユニットのヘクスからダミーを即除去
// 同ヘクスに未行動ユニットがいればダミー1枚残す
function onUnitAction(unit, batchUnits) {
  if (!unit.hexId || unit.status === 'eliminated') return;
  const hexId = unit.hexId;
  if (getDummyCount(hexId) === 0) return;

  // 同ヘクスの同陣営ダミーがあるか
  const sideDummies = testUnits.filter(u =>
    u.hexId === hexId && u.type === 'dummy' && u.side === unit.side && u.status !== 'eliminated'
  );
  if (sideDummies.length === 0) return;

  // 同ヘクスの同陣営実ユニット
  const hexMates = testUnits.filter(u =>
    u.hexId === hexId && u.side === unit.side && u.status !== 'eliminated' &&
    u.type !== 'dummy' && u.type !== 'leader'
  );
  // 同時行動ユニット（スタック一括移動等）を除外して未行動を判定
  const batchSet = batchUnits ? new Set(batchUnits) : new Set([unit]);
  const unactedMates = hexMates.filter(u =>
    !batchSet.has(u) && !u.firedThisTurn && !u.moveComplete && !u.assaultedThisTurn
  );

  if (unactedMates.length > 0) {
    // 未行動ユニットあり → ダミー1枚残して残り除去
    const toRemove = sideDummies.length - 1;
    if (toRemove > 0) {
      for (let i = 0; i < toRemove; i++) sideDummies[i].status = 'eliminated';
      addLog('dummy', `ダミー減少: ${hexId} ${unit.name}行動 (1枚残し)`);
    }
  } else {
    // 全員行動済み → ダミー全除去
    sideDummies.forEach(d => { d.status = 'eliminated'; });
    addLog('dummy', `ダミー全除去: ${hexId} 行動により発見`);
  }
}

// ===== 偵察 (ルール7-4) =====

// 偵察チャート
const RECON_CHART = [
  1, 1, 2, 2, 3, 3, 4, 4, 0, 0  // index=ダイス目, 値=除去枚数(0=失敗)
];

// 偵察可能か判定
function canRecon(unit) {
  // 歩兵(I)と装甲車(AC)のみ 7-4-(1)
  if (unit.type !== 'I' && unit.type !== 'AC') return { can: false, reason: '歩兵・装甲車のみ偵察可能' };
  if (unit.status !== 'ok') return { can: false, reason: '正常状態でない' };
  if (unit.reconDone) return { can: false, reason: '今ターン偵察済み' };
  if (unit.movingFormation) return { can: false, reason: '移動隊形では偵察不可' }; // 7-4-(8)
  return { can: true, reason: '' };
}

// 偵察実行（移動完了後に隣接ヘクスを指定）
function executeRecon(unit, targetHexId) {
  const check = canRecon(unit);
  if (!check.can) return { success: false, reason: check.reason };

  // 隣接チェック 7-4-(3)
  const uPos = fromHexId(unit.hexId);
  const tPos = fromHexId(targetHexId);
  const dist = hexDistance(uPos.col, uPos.row, tPos.col, tPos.row);
  if (dist !== 1) return { success: false, reason: '隣接ヘクスのみ偵察可能' };

  // ダミーがあるか
  if (getDummyCount(targetHexId) === 0) return { success: false, reason: 'ダミーなし' };

  // ターンに1回制限チェック 7-4-(4)
  // (同ヘクスに対しても1ターン1回)
  if (dummyMap[targetHexId] && dummyMap[targetHexId].reconedThisTurn) {
    return { success: false, reason: '今ターンこのヘクスは偵察済み' };
  }

  // ダイスロール
  const roll = Math.floor(Math.random() * 10);
  const removedCount = RECON_CHART[roll];

  unit.reconDone = true; // 7-4-(4) このユニットは今ターン偵察済み
  unit.firedThisTurn = true; // 7-4-(5) 偵察ターンは射撃不可
  if (dummyMap[targetHexId]) dummyMap[targetHexId].reconedThisTurn = true;

  if (removedCount === 0) {
    addLog('init', `偵察失敗: ${unit.name} → ${targetHexId} (ダイス: ${roll})`);
    return { success: false, roll, removed: 0, reason: '偵察失敗' };
  }

  const actualRemoved = removeDummy(targetHexId, removedCount);
  addLog('init', `偵察成功: ${unit.name} → ${targetHexId} (ダイス: ${roll}) ダミー${actualRemoved}枚除去 (残${getDummyCount(targetHexId)}枚)`);
  return { success: true, roll, removed: actualRemoved, remaining: getDummyCount(targetHexId) };
}

// ターン開始時に偵察フラグリセット
function resetReconFlags() {
  units.forEach(u => {
    u.reconDone = false;
    u.firedThisTurn = false;
    u.actedThisTurn = false;
    u.attackedThisTurn = false;
    u.spottedThisTurn = false;
  });
  // ヘクスの偵察済みフラグもリセット
  for (const hexId of Object.keys(dummyMap)) {
    dummyMap[hexId].reconedThisTurn = false;
  }
}

// ===== ヘクスID変換 =====
// col,row(0-indexed) → hexId("CCRR")
function toHexId(col, row) {
  return String(col + 1).padStart(2, '0') + String(row + 1).padStart(2, '0');
}
// hexId("CCRR") → {col, row} (0-indexed)
function fromHexId(hexId) {
  return { col: parseInt(hexId.substring(0, 2)) - 1, row: parseInt(hexId.substring(2, 4)) - 1 };
}

// ヘクスの地形を取得（施設込み）
function getHexTerrain(hexId) {
  const facility = FACILITY_MAP[hexId];
  if (facility) return facility; // 町(t)・都市(c)は施設優先
  return TERRAIN_MAP[hexId] || 'x';
}

// ヘクスの高度レベル（斜面データから計算）
// slope1境界の低い側=0, 高い側=1, slope2の高い側=2
function getHexElevation(col, row) {
  const hid = toHexId(col, row);
  const level = ELEVATION_MAP[hid];
  // シナリオ2の地図は平地を1とする番号で登録されている。
  return level == null ? 0 : level - (_scenarioId === 2 ? 1 : 0);
}

// ===== 視認システム (ルール6) =====
let losMode = false;       // 視認モードON/OFF
let losSourceUnit = null;  // 視認元ユニット
let losVisibleHexes = {};  // { hexId: true/false }

// 視線(LOS)障害判定: 森林・林・町・市街地・高地
function isLOSBlocker(hexId) {
  const t = getHexTerrain(hexId);
  // 森林(f)・林(w)・町(t)・市街地(c) は障害
  return t === 'f' || t === 'w' || t === 't' || t === 'c';
}

// ヘクス中心を整数座標に変換し、線分が内部または辺を通るヘクスを取得する。
function getHexesOnLine(col1, row1, col2, row2) {
  const x1 = 3 * col1;
  const y1 = 2 * row1 + (col1 % 2);
  const dx = 3 * col2 - x1;
  const dy = 2 * row2 + (col2 % 2) - y1;
  const hexes = [];
  const faces = [[0, 1, 1], [0, -1, 1], [1, 1, 2], [1, -1, 2], [-1, 1, 2], [-1, -1, 2]];

  for (let col = Math.min(col1, col2); col <= Math.max(col1, col2); col++) {
    for (let row = Math.max(0, Math.min(row1, row2) - 1); row <= Math.min(MAP_CONFIG.rows - 1, Math.max(row1, row2) + 1); row++) {
      if ((col === col1 && row === row1) || (col === col2 && row === row2)) continue;
      const x = 3 * col;
      const y = 2 * row + (col % 2);
      let enter = 0;
      let exit = 1;
      let edgeSide = 0;
      for (const [a, b, limit] of faces) {
        const room = limit - a * (x1 - x) - b * (y1 - y);
        const speed = a * dx + b * dy;
        if (speed > 0) exit = Math.min(exit, room / speed);
        else if (speed < 0) enter = Math.max(enter, room / speed);
        else if (room < 0) { exit = 0; break; }
        else if (room === 0) edgeSide = Math.sign(dx * (y - y1) - dy * (x - x1));
      }
      if (exit - enter > 1e-9) hexes.push({col, row, edgeSide});
    }
  }
  return hexes;
}

function getClearSightHexes(col1, row1, col2, row2) {
  const fromLevel = getHexElevation(col1, row1);
  const toLevel = getHexElevation(col2, row2);
  const high = Math.max(fromLevel, toLevel);
  const sameLevel = fromLevel === toLevel;
  const clear = [];
  const blockedSides = new Set();
  for (const hex of getHexesOnLine(col1, row1, col2, row2)) {
    const height = getHexElevation(hex.col, hex.row) + Number(isLOSBlocker(toHexId(hex.col, hex.row)));
    if (height < high || (sameLevel && height === high)) {
      clear.push(hex);
    } else if (!hex.edgeSide) {
      return null;
    } else {
      blockedSides.add(hex.edgeSide);
      if (blockedSides.size === 2) return null;
    }
  }
  return clear;
}

function hasLOS(col1, row1, col2, row2) {
  return getClearSightHexes(col1, row1, col2, row2) !== null;
}

// 視認コスト（地形チャートより）
// hasElevDiff: 観測者と対象に高度差がある場合true
function getVisionCost(hexId, hasElevDiff) {
  const t = getHexTerrain(hexId);
  switch (t) {
    case 'p': return 1;
    case 'w': return 2;  // 林
    case 'f': return 3;  // 森林 — 障害だが、中にいる敵は見えない場合も
    case 'r': return hasElevDiff ? 1 : 4;  // 荒地（高度差ありなら1、なしなら4）
    case 't': return 2;  // 町
    case 'c': return 3;  // 市街地
    case 'lake': return 1;
    default: return 1;
  }
}

// 最短の通過ヘクス数で数える。辺を通る箇所は見やすい側、ほかは見えにくい経路を使う。
function pgSightCostBeforeTarget(col, row, targetCol, targetRow, hexes) {
  const distance = hexDistance(col, row, targetCol, targetRow);
  const elevationDiff = getHexElevation(col, row) !== getHexElevation(targetCol, targetRow);
  const steps = Array.from({length: distance}, () => []);
  for (const hex of hexes) {
    const step = hexDistance(col, row, hex.col, hex.row);
    if (step + hexDistance(hex.col, hex.row, targetCol, targetRow) === distance) {
      steps[step].push(hex);
    }
  }

  let prev = [{col, row, cost: 0}];
  for (let i = 1; i < distance; i++) {
    const curr = steps[i].flatMap(hex => {
      const predecessors = prev.filter(p => hexDistance(p.col, p.row, hex.col, hex.row) === 1);
      if (!predecessors.length) return [];
      const costs = predecessors.map(p => p.cost);
      const cost = predecessors.some(p => p.edgeSide) ? Math.min(...costs) : Math.max(...costs);
      return [{...hex, cost: cost + getVisionCost(toHexId(hex.col, hex.row), elevationDiff)}];
    });
    prev = curr;
  }
  const lastCosts = prev.map(hex => hex.cost);
  return prev.some(hex => hex.edgeSide) ? Math.min(...lastCosts) : Math.max(...lastCosts);
}

function pgSightStatus(col, row, targetCol, targetRow, visionPoints = G.visionRange || 12) {
  if (col === targetCol && row === targetRow) return 'visible';
  if (hexDistance(col, row, targetCol, targetRow) > visionPoints) return 'out-of-vision';
  const hexes = getClearSightHexes(col, row, targetCol, targetRow);
  if (!hexes) return 'blocked';
  // 目標の一つ手前までで視認ポイントが残っていれば、目標ヘクスは見える。
  return pgSightCostBeforeTarget(col, row, targetCol, targetRow, hexes) < visionPoints
    ? 'visible' : 'out-of-vision';
}

function calculateVisionRange(col, row, visionPoints) {
  const result = {};
  for (let r = 0; r < MAP_CONFIG.rows; r++) {
    for (let c = 0; c < MAP_CONFIG.cols; c++) {
      if (pgSightStatus(col, row, c, r, visionPoints) === 'visible') result[`${c},${r}`] = true;
    }
  }
  return result;
}

// ヘクスの6方向隣接（flat-top: 奇数列が下にずれる）
function getHexNeighbors(col, row) {
  const odd = col % 2 === 1;
  if (odd) {
    return [
      { col: col - 1, row: row     }, // 左上
      { col: col - 1, row: row + 1 }, // 左下
      { col: col,     row: row - 1 }, // 上
      { col: col,     row: row + 1 }, // 下
      { col: col + 1, row: row     }, // 右上
      { col: col + 1, row: row + 1 }, // 右下
    ];
  } else {
    return [
      { col: col - 1, row: row - 1 }, // 左上
      { col: col - 1, row: row     }, // 左下
      { col: col,     row: row - 1 }, // 上
      { col: col,     row: row + 1 }, // 下
      { col: col + 1, row: row - 1 }, // 右上
      { col: col + 1, row: row     }, // 右下
    ];
  }
}

// 視認モード切り替え
function toggleLOSMode() {
  losMode = !losMode;
  const btn = document.getElementById('btnLOS');
  const info = document.getElementById('losInfo');
  if (losMode) {
    btn.setAttribute('aria-pressed', 'true');
    btn.style.fontWeight = 'bold';
    info.style.display = 'inline';
    info.textContent = '← ユニットをクリックして視認範囲を表示';
    losSourceUnit = null;
    losVisibleHexes = {};
  } else {
    btn.setAttribute('aria-pressed', 'false');
    btn.style.fontWeight = '';
    info.style.display = 'none';
    losSourceUnit = null;
    losVisibleHexes = {};
  }
  drawMap();
}

function toggleStackSplit() {
  stackSplitMode = !stackSplitMode;
  const btn = document.getElementById('btnSplit');
  if (stackSplitMode) {
    btn.setAttribute('aria-pressed', 'true');
    btn.style.fontWeight = 'bold';
  } else {
    btn.setAttribute('aria-pressed', 'false');
    btn.style.fontWeight = '';
  }
}

// 視認モードでユニットを選択
function selectLOSUnit(unit) {
  losSourceUnit = unit;
  const visionPoints = G.visionRange; // 天候により変動
  losVisibleHexes = calculateVisionRange(unit.col, unit.row, visionPoints);
  const info = document.getElementById('losInfo');
  info.textContent = `${unit.name || unit.src.split('/').pop()} : 視認ポイント${visionPoints}`;
  drawMap();
}

// ===== LOS確認モード =====
let losCheckMode = false;
let losCheckStart = null; // { col, row }
let losCheckEnd = null;   // { col, row }
let losCheckResult = null; // true/false

function toggleLOSCheckMode() {
  losCheckMode = !losCheckMode;
  losCheckStart = null;
  losCheckEnd = null;
  losCheckResult = null;
  const btn = document.getElementById('btnLOSCheck');
  const info = document.getElementById('losCheckInfo');
  if (losCheckMode) {
    // 他のモードを解除

function onLOSCheckClick(col, row) {

// ===== スタッキング制限 (ルール8) =====
const STACK_LIMIT = 4;
// スタック制限から除外する型（ダミー・指揮官・陣地・I.P.）
const STACK_EXEMPT_TYPES = ['dummy', 'leader', 'fortification', 'ip'];

// ヘクスごとのスタック数を取得（制限除外ユニットを除く）
function getStackCount(hexId) {
  return units.filter(u =>
    u.hexId === hexId &&
    u.status !== 'eliminated' &&
    !STACK_EXEMPT_TYPES.includes(u.type)
  ).length;
}

// 組織間スタック禁止チェック: 移動ユニットがそのヘクスに入れるか
function canStackWithOrg(movingUnit, hexId) {
  if (!movingUnit.org) return true;
  const existing = units.filter(u =>
    u.hexId === hexId && u.status !== 'eliminated' && u.org && u.id !== movingUnit.id
  );
  for (const u of existing) {
    // SS/国防軍スタック禁止
    if (SCENARIO.noSSHeerStack) {
      if ((movingUnit.org === 'ss' && u.org === 'heer') ||
          (movingUnit.org === 'heer' && u.org === 'ss')) return false;
    }
    // 米英スタック禁止
    if (SCENARIO.noUSUKStack) {
      if ((movingUnit.org === 'us' && u.org === 'uk') ||
          (movingUnit.org === 'uk' && u.org === 'us')) return false;
    }
  }
  return true;
}

// 超過ヘクス一覧を返す { hexId: [units] }
function getOverstackedHexes() {
  const hexUnits = {};
  units.forEach(u => {
    if (u.status === 'eliminated' || STACK_EXEMPT_TYPES.includes(u.type)) return;
    if (!hexUnits[u.hexId]) hexUnits[u.hexId] = [];
    hexUnits[u.hexId].push(u);
  });
  const result = {};
  for (const [hexId, uList] of Object.entries(hexUnits)) {
    if (uList.length > STACK_LIMIT) result[hexId] = uList;
  }
  return result;
}

// スタック超過チェック＋確認 → DD強制適用
function checkAndApplyOverstackPenalty() {
  const overstacked = getOverstackedHexes();
  const hexIds = Object.keys(overstacked);
  if (hexIds.length === 0) return;

  // 確認ダイアログ
  const msgs = hexIds.map(hid => {
    const uList = overstacked[hid];
    const names = uList.map(u => u.name).join(', ');
    return `ヘクス${hid}: ${uList.length}個 (${names})`;
  });
  const ok = confirm(
    `⚠ スタック超過！（上限${STACK_LIMIT}個）\n\n` +
    msgs.join('\n') +
    '\n\n全ユニットがDD状態になります。よろしいですか？'
  );
  if (!ok) return;

  // DD適用
  hexIds.forEach(hid => {
    overstacked[hid].forEach(u => {
      if (u.status !== 'dd') {
        const prev = u.status;
        u.status = 'dd';
        addLog('init', `スタック超過: ${u.name} (${hid}) ${prev.toUpperCase()} → DD`);
      }
    });
  });
  // マップ再描画
  drawMap();
}

// ヘクスがスタック超過中か判定
function isOverstacked(hexId) {
  return getStackCount(hexId) > STACK_LIMIT;
}

// ===== 指揮官システム (ルール16) =====

// 指揮官の能力定義
// Leader A: 3能力 (A.M.R / F.A.R / F.M.R からランダム選択)
// Leader B: 2能力 (F.R / A.R / M.R からランダム選択)
// Leader C: 1能力 (F / A / M or R or R からランダム選択)
const LEADER_ABILITY_POOL = {
  leader_a: [
    ['A','M','R'], ['F','A','R'], ['F','M','R']
  ],
  leader_b: [
    ['F','R'], ['A','R'], ['M','R']
  ],
  leader_c: [
    ['F'], ['A'], ['M'], ['R'], ['R']
  ],
};

// 指揮官ユニットに能力をランダム割り当て（シナリオ開始時、以後固定）
function assignLeaderAbilities(unit) {
  if (unit.type !== 'leader') return;
  const rank = unit.leaderRank || 'leader_c';
  const pool = LEADER_ABILITY_POOL[rank];
  unit.abilities = pool[Math.floor(Math.random() * pool.length)];
}

// 指揮官が同ヘクスのユニットを指揮できるか判定
// 国防軍(ge)とSS(ss)は互いに指揮不可
function canCommandUnit(leader, target) {
  if (leader.type !== 'leader') return false;
  if (leader.status === 'eliminated') return false;
  if (target.type === 'leader' || target.type === 'dummy') return false;
  // 同じ陣営チェック
  if (leader.side !== target.side) return false;
  // 国防軍/SS別軍制限
  const leaderNation = leader.nation || (leader.ss ? 'ss' : 'ge');
  const targetNation = target.nation || (target.ss ? 'ss' : 'ge');
  if (leader.side === 'german' && leaderNation !== targetNation) return false;
  return true;
}

// ヘクスにいる指揮官を取得
function getLeaderInHex(hexId, side) {
  return units.find(u =>
    u.hexId === hexId &&
    u.type === 'leader' &&
    u.side === side &&
    u.status !== 'eliminated'
  );
}

// 指揮官の能力が有効か判定（同ヘクス、R持ちなら隣接も）
function getActiveLeaderForUnit(unit, abilityType) {
  // 同ヘクスの指揮官
  const leader = getLeaderInHex(unit.hexId, unit.side);
  if (leader && canCommandUnit(leader, unit)) {
    if (leader.abilities && leader.abilities.includes(abilityType)) return leader;
  }
  // R能力を持つ隣接ヘクスの指揮官（指定能力も持っている場合）
  const pos = fromHexId(unit.hexId);
  const neighbors = getHexNeighbors(pos.col, pos.row);
  for (const n of neighbors) {
    if (n.col < 0 || n.col >= MAP_CONFIG.cols || n.row < 0 || n.row >= MAP_CONFIG.rows) continue;
    const nHexId = toHexId(n.col, n.row);
    const nLeader = getLeaderInHex(nHexId, unit.side);
    if (nLeader && canCommandUnit(nLeader, unit)) {
      if (nLeader.abilities && nLeader.abilities.includes('R') && nLeader.abilities.includes(abilityType)) {
        return nLeader;
      }
    }
  }
  return null;
}

// 指揮官負傷チェック — 16-3-(1): スタック内ユニットが損害を受けた時（1回の攻撃につき1回）
// ダイス0 → 除去
function checkLeaderCasualty(hexId, side) {
  const leader = getLeaderInHex(hexId, side);
  if (!leader) return null;
  const roll = Math.floor(Math.random() * 10);
  if (roll === 0) {
    leader.status = 'eliminated';
    addLog('init', `⚠ ${leader.name} 負傷！（ダイス: ${roll}）→ 除去`);
    return { leader, roll, wounded: true };
  }
  return { leader, roll, wounded: false };
}

// 16-3-(3): スタック壊滅時の指揮官チェック
// ダイス0-4 → 指揮官も除去、5-9 → 最寄り味方へワープ（味方なし→援軍と再登場）
function checkLeaderOnStackEliminated(hexId, side) {
  const leader = getLeaderInHex(hexId, side);
  if (!leader) return null;
  // 同ヘクスに生存ユニット（指揮官以外）がいるか
  const aliveUnits = units.filter(u =>
    u.hexId === hexId && u.side === side &&
    u.type !== 'leader' && u.type !== 'dummy' &&
    u.status !== 'eliminated'
  );
  if (aliveUnits.length > 0) return null; // まだ壊滅してない

  const roll = Math.floor(Math.random() * 10);
  if (roll <= 4) {
    leader.status = 'eliminated';
    addLog('init', `⚠ ${leader.name}: 部隊壊滅（ダイス: ${roll}）→ 指揮官も除去`);
    return { leader, roll, eliminated: true };
  } else {
    // 最寄りの味方ユニットのヘクスへワープ
    const nearest = findNearestFriendlyHex(hexId, side);
    if (nearest) {
      leader.hexId = nearest;
      const pos = fromHexId(nearest);
      leader.col = pos.col;
      leader.row = pos.row;
      const center = getHexCenter(pos.col, pos.row);
      leader.x = center.x;
      leader.y = center.y;
      addLog('init', `${leader.name}: 部隊壊滅（ダイス: ${roll}）→ ${nearest}の味方へ合流`);
    } else {
      // 味方なし → 援軍待ち（マップから一時退場）
      leader.hexId = 'reinforcement';
      addLog('init', `${leader.name}: 部隊壊滅（ダイス: ${roll}）→ 援軍と再登場`);
    }
    return { leader, roll, eliminated: false, movedTo: leader.hexId };
  }
}

// 最寄りの味方ユニットがいるヘクスを探す
function findNearestFriendlyHex(srcHexId, side) {
  const srcPos = fromHexId(srcHexId);
  const srcCenter = getHexCenter(srcPos.col, srcPos.row);
  let bestHex = null, bestDist = Infinity;
  const seen = new Set();
  units.forEach(u => {
    if (u.side !== side || u.type === 'leader' || u.type === 'dummy' ||
        u.status === 'eliminated' || u.hexId === srcHexId || !u.hexId || u.hexId === 'reinforcement') return;
    if (seen.has(u.hexId)) return;
    seen.add(u.hexId);
    const pos = fromHexId(u.hexId);
    const c = getHexCenter(pos.col, pos.row);
    const dist = (c.x - srcCenter.x) ** 2 + (c.y - srcCenter.y) ** 2;
    if (dist < bestDist) { bestDist = dist; bestHex = u.hexId; }
  });
  return bestHex;
}

// 16-3-(4): 指揮官単独で敵射程内にいる場合、敵ユニットごとに負傷チェック
// ダイス0-4 → 死亡
function checkLoneLeaderDanger(leader) {
  if (!leader || leader.type !== 'leader' || leader.status === 'eliminated') return [];
  if (!leader.hexId || leader.hexId === 'reinforcement') return [];
  // 同ヘクスに味方ユニットがいるか
  const friendlies = units.filter(u =>
    u.hexId === leader.hexId && u.side === leader.side &&
    u.type !== 'leader' && u.type !== 'dummy' &&
    u.status !== 'eliminated'
  );
  if (friendlies.length > 0) return []; // 単独ではない

  // 射程内の敵ユニットを列挙
  const results = [];
  const leaderPos = fromHexId(leader.hexId);
  units.forEach(enemy => {
    if (enemy.side === leader.side || enemy.status === 'eliminated') return;
    if (enemy.type === 'leader' || enemy.type === 'dummy') return;
    if (!enemy.hexId || enemy.hexId === 'reinforcement') return;
    const enemyPos = fromHexId(enemy.hexId);
    // 射程内か（ヘクス距離で判定）
    const dist = hexDistance(leaderPos.col, leaderPos.row, enemyPos.col, enemyPos.row);
    if (dist <= (enemy.range || 1)) {
      const roll = Math.floor(Math.random() * 10);
      if (roll <= 4) {
        leader.status = 'eliminated';
        addLog('init', `⚠ ${leader.name}: 単独で${enemy.name}の射程内（ダイス: ${roll}）→ 死亡`);
        results.push({ enemy, roll, killed: true });
        return; // 死んだら終了
      } else {
        addLog('init', `${leader.name}: 単独で${enemy.name}の射程内（ダイス: ${roll}）→ 無事`);
        results.push({ enemy, roll, killed: false });
      }
    }
  });
  return results;
}

// ヘクス距離計算（flat-top offset座標）
function hexDistance(c1, r1, c2, r2) {
  // offset座標 → cube座標に変換して距離計算
  function toCube(col, row) {
    const x = col;
    const z = row - (col - (col & 1)) / 2;
    const y = -x - z;
    return { x, y, z };
  }
  const a = toCube(c1, r1);
  const b = toCube(c2, r2);
  return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y), Math.abs(a.z - b.z));
}

// M能力による回復修正があるか判定
function hasLeaderMoraleBonus(unit) {
  const leader = getActiveLeaderForUnit(unit, 'M');
  return !!leader;
}

// ===== AI側のフェイズか判定 =====
function isAIPhase() {
  if (G.gameMode !== 'pvai') return false;
  const aiSide = G.playerSide === 'german' ? 'allied' : 'german';
  const phase = PHASES[G.phase];
  if (phase.id === 'supportAtk' || phase.id === 'supportDef') {
    if (G.initiative && currentSupportSide() === aiSide) return true;
  }
  // 先攻移動・射撃と突撃は先攻プレイヤーのフェイズ
  if (phase.id === 'moveFire' || phase.id === 'assault') {
    return G.initiative === aiSide;
  }
  // 後攻移動は後攻プレイヤーのフェイズ
  if (phase.id === 'defMove') {
    return G.initiative !== aiSide;
  }
  return false;
}

// ===== 他のフェイズ =====

function renderPhase() {
  updatePhaseBar();
  const c = document.getElementById('phaseContent');
  const phase = PHASES[G.phase];

  // pvaiモードでAI側のフェイズなら自動実行
  if (isAIPhase()) {
    if (phase.id === 'supportDef') {
      renderAISupportPhase();
      return;
    }
    if (phase.id === 'supportAtk' && (!SCENARIO.diceAirSupport || G._airSupportRolled ||
       G.turn < SCENARIO.diceAirSupport.startTurn)) {
      renderAISupportPhase();
      return;
    }
    addLog('ai', `AI自動実行: ${phase.name}フェイズ`);
    if (phase.id === 'moveFire') {
      pgStartAIReview(G.initiative, showReview => aiAutoMove(showReview));
      return;
    }
    if (phase.id === 'assault') {
      aiAutoAssault();
      drawMap();
      setTimeout(() => nextPhase(), 1500);
      return;
    }
    if (phase.id === 'defMove') {
      const defender = G.initiative === 'german' ? 'allied' : 'german';
      pgStartAIReview(defender, async showReview => {
        await aiAutoDefMove();
        await showReview();
      });
      return;
    }
  }

  if (phase.id === 'initiative') {
    // 第1ターンはシナリオで決まっているのでスキップ
    if (G.turn === 1 && SCENARIO.initiative.side) {
      G.initiative = SCENARIO.initiative.side;
      G.diceRolled = true;
      addLog('init', `第1ターン: ${G.initiative === 'german' ? 'ドイツ軍' : '連合軍'}がイニシアチブ（シナリオ指定）`);
      updatePhaseBar();
      nextPhase();
      return;
    }
    renderInitiativePhase();
    return;
  }
  if (phase.id === 'recovery') {
    const recoverUnits = testUnits.filter(u => pgOnMap(u) && ['d', 'dd'].includes(u.status) &&
      !STACK_EXEMPT_TYPES.includes(u.type) && !recoveryResults[u.id])
      .sort((a, b) => Number(b.side === G.initiative) - Number(a.side === G.initiative));
    const _recoveryOverlayRows = [];
    recoverUnits.forEach(u => {
      const enemies = testUnits.filter(e => e.side !== u.side && pgOnMap(e) && e.status === 'ok' &&
        !STACK_EXEMPT_TYPES.includes(e.type));
      u.adjacentEnemy = enemies.some(e => hexDistance(e.col, e.row, u.col, u.row) === 1);
      u.inEnemyRange = enemies.some(e => e.type !== 'A' && !e.marchMode && !e.outOfAmmo &&
        hexDistance(e.col, e.row, u.col, u.row) <= e.range && hasLOS(e.col, e.row, u.col, u.row));
      u.inCover = ['f', 'w', 't', 'c'].includes(getHexTerrain(u.hexId));
      const check = canAttemptRecovery(u);
      if (!check.can) {
        recoveryResults[u.id] = { roll: -1, success: false, effect: check.reason, effectiveMorale: 0 };
        return;
      }
      const result = resolveRecovery(u);
      recoveryResults[u.id] = result;
      addLog('recovery', `${u.name} 回復判定: ${result.effect} (ダイス${result.roll}, ML${result.effectiveMorale})`);
      const rc = result.critical ? 'hit-elim' : result.success ? 'hit-d' : 'hit-none';
      const sideLabel = u.side === 'german' ? '[独]' : '[連]';
      _recoveryOverlayRows.push({

        resultText: result.effect,

      });
    });
    drawMap();
    if (_recoveryOverlayRows.length > 0 && G.gameMode !== 'aivai') {
      showDiceOverlay('回復チェック', '両軍自動判定', _recoveryOverlayRows, function() {
        renderRecoveryPhase();
      });
    } else {
      renderRecoveryPhase();
    }

  }
  if (phase.id === 'supportAtk') {

    if (SCENARIO.diceAirSupport && G.turn >= SCENARIO.diceAirSupport.startTurn && !G._airSupportRolled) {

            id: 'air_t' + G.turn + '_' + i,

            fp: 6,
            fpAT: 6,
            fpSoft: 6,
            uses: 1,
            usedCount: 0,
            usedThisTurn: false,
            _tempAir: true,
          });
        }
        addLog('support', `空軍支援判定: ダイス${roll} → 空軍支援${count}回到着！(装甲6/非装甲6)`);
      } else {
        addLog('support', `空軍支援判定: ダイス${roll} → 空軍支援なし`);
      }
      const resultText = count > 0 ? `空軍支援${count}回到着！(6/6)` : '空軍支援なし';
      const resultClass = count > 0 ? 'hit-d' : 'hit-none';
      showDiceOverlay('空軍支援判定', `ターン${G.turn} (8-9で到着)`, [{
        label: das.side === 'allied' ? '連合軍' : 'ドイツ軍',
        roll: roll,
        resultText: resultText,

      }], function() {
        if (isAIPhase()) renderAISupportPhase();
        else renderSupportPhase(G.initiative);
      });
      return;
    }
    renderSupportPhase(G.initiative);
    return;
  }
  if (phase.id === 'supportDef') {
    const defender = G.initiative === 'german' ? 'allied' : 'german';
    renderSupportPhase(defender);

  }

  if (phase.id === 'moveFire') {
