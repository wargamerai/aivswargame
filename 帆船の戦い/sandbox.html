<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../nobrowserback.js"></script>
<meta charset="UTF-8">
<title>帆船の戦い - シナリオ選択</title>
<script data-goatcounter="https://shigerusuzuki.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
  body { background:#0a1a2a; color:#fff; font-family:sans-serif; padding:20px; }
  .panel { background:#13243a; border:1px solid #234; border-radius:6px; padding:14px; margin-bottom:14px; }
  h1 { color:#88ccff; margin-top:0; }
  button.back { background:#555; color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; font-weight:bold; margin-bottom:12px; }
  .scen-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:10px; }
  .scen-btn { background:#2266cc; color:#fff; border:none; padding:14px 16px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:1em; text-align:left; }
  .scen-btn:hover { background:#3377dd; }
  .scen-btn .n { color:#88ccff; font-size:1.1em; display:block; margin-bottom:3px; }
  .scen-btn .t { font-weight:normal; font-size:0.92em; color:#fff; }
  .scen-btn .s { font-weight:normal; font-size:0.85em; color:#bcd; margin-top:4px; display:block; }
  .scen-btn { cursor:default; }
  .scen-btn:hover { background:#2266cc; }
  .scen-btn .sides { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .side-btn { background:#13243a; color:#fff; border:1px solid #88ccff; padding:6px 10px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:0.85em; }
  .side-btn:hover { background:#3377dd; }
  /* 画面全体を 80%（ブラウザで2段階縮小した大きさ）で表示する */
  html { zoom: 0.8; }
</style>
</head>
<body>
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
  <a href="../en/index.html"><button class="back">← トップへ</button></a>
  <h1 style="margin:0;flex:1;">⚓ 帆船の戦い - シナリオ選択</h1>
</div>

<!-- 言語の切り替え（ここで選んだ言語で戦闘画面も表示する） -->
<div class="panel no-lang" id="wsimLangSlot"></div>

<div class="panel">
  <h3 style="color:#ffcc88;margin:0 0 8px 0;">ゲームモード</h3>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <label style="cursor:pointer;"><input type="radio" name="gameMode" value="human-vs-ai" checked> 人間対AI（自軍=人間、敵軍=AI）</label>
    <label style="cursor:pointer;"><input type="radio" name="gameMode" value="ai-vs-ai-step"> AI対AI ステップ確認（フェイズ毎に停止）</label>
    <label style="cursor:pointer;"><input type="radio" name="gameMode" value="ai-vs-ai-auto"> AI対AI オート観戦（自動進行）</label>
  </div>
</div>

<div class="panel">
  <h3 style="color:#88ffcc;margin:0 0 8px 0;">💾 セーブから再開</h3>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <input type="file" id="resumeFile" accept=".json,application/json" style="color:#fff;">
    <button id="resumeBtn" onclick="resumeFromFile()" style="background:#2a8;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-weight:bold;">続きから再開</button>
    <span id="resumeStatus" style="color:#bcd;font-size:0.9em;"></span>
  </div>
</div>

<div class="panel">
  <div class="scen-grid" id="scenGrid"></div>
</div>

<script src="shipdata.js"></script>
<script src="hittables.js"></script>
<script src="criticaldata.js"></script>
<script src="chartsdata.js"></script>
<script src="wsm_ai.js"></script>
<script src="wsm_ai_ui.js"></script>
<script>
// wsm_hub.html の SCENARIOS と同一の一覧を定義（艦名表示のみに使用）
// 実際のゲームデータは wsm_hub.html 内 SCENARIOS を参照
const SCENARIO_LIST = [
  { n:2,  title:'Ranger vs Drake (1778)',             sides:'米:Ranger / 英:Drake' },
  { n:4,  title:'Bonhomme-Richard vs Serapis (1779)', sides:'米:Bonhomme-Richard / 英:Serapis' },
  { n:9,  title:'Nymphe vs Cleopatre (1793)',         sides:'英:Nymphe / 仏:Cleopatre' },
  { n:10, title:'Mars vs Hercule (1798)',             sides:'英:Mars / 仏:Hercule' },
  { n:12, title:'Ambuscade vs Baionnaise (1798)',     sides:'英:Ambuscade / 仏:Baionnaise' },
  { n:13, title:'Constellation vs Insurgent (1799)',  sides:'米:Constellation / 仏:Insurgent' },
  { n:14, title:'Constellation vs Vengeance (1800)',  sides:'米:Constellation / 仏:Vengeance' },
  { n:16, title:'Lissa (1811)',                       sides:'英4隻 / 仏+伊6隻' },
  { n:17, title:'Constitution vs Guerriere (1812)',   sides:'米:Constitution / 英:Guerriere' },
  { n:18, title:'United States vs Macedonian (1812)', sides:'米:United States / 英:Macedonian' },
  { n:19, title:'Constitution vs Java (1812)',        sides:'米:Constitution / 英:Java' },
  { n:20, title:'Chesapeake vs Shannon (1813)',       sides:'米:Chesapeake / 英:Shannon' },
  { n:21, title:'Lake Erie (1813)',                   sides:'米2隻 / 英3隻' },
  { n:22, title:'Wasp vs Reindeer (1814)',            sides:'米:Wasp / 英:Reindeer' },
  { n:23, title:'Constitution vs Cyane+Levant (1815)',sides:'米:Constitution / 英:Cyane, Levant' },
  { n:25, title:'Trafalgar (1805)',                   sides:'英27隻 / 仏18隻+西15隻' },
  // ボライソー・シナリオ（The GENERAL 誌「A King's Officer」）
  { n:101, label:'B-1', title:'No More Pretense (1777)',       sides:'英:Trojan / 仏:Argonaute' },
  { n:108, label:'B-8', title:'A Tradition of Victory (1782)', sides:'英3隻 / 仏4隻' },
  { n:109, label:'B-9', title:"In the King's Name (1784)",     sides:'英:Undine / 仏:Argus' },
  { n:112, label:'B-12', title:'The French Are Out! (1793)',   sides:'英4隻 / 仏6隻' },
  { n:118, label:'B-18', title:'A Ship of War (1797)',         sides:'英5隻 / 仏8隻+西2隻' },
];

function renderScenarios() {
  const grid = document.getElementById('scenGrid');
  // 陣営ごとのボタン: 押した陣営を人間（自軍）が指揮し、もう片方を AI が指揮する
  grid.innerHTML = SCENARIO_LIST.map(sc => {
    const sides = sc.sides.split(' / ');
    return `
    <div class="scen-btn">
      <span class="n">${sc.label ? 'ボライソー ' + sc.label : 'シナリオ ' + sc.n}</span>
      <span class="t">${sc.title}</span>
      <span class="sides">${sides.map((sd, i) => `<button class="side-btn" onclick="startScenario(${sc.n}, ${i})">指揮: ${sd}</button>`).join('')}</span>
    </div>`;
  }).join('');
}

function startScenario(n, sideIdx) {
  const mode = document.querySelector('input[name="gameMode"]:checked')?.value || 'human-vs-ai';
  localStorage.setItem('wsmHumanSide', String(sideIdx || 0)); // 0=シナリオの1番目の陣営、1=2番目の陣営を人間（自軍）が指揮
  localStorage.removeItem('wsmHubState');
  localStorage.removeItem('wsmResumeSave');
  localStorage.setItem('wsmPendingScenario', String(n));
  localStorage.setItem('wsmGameMode', mode);
  localStorage.setItem('campaignReady', 'true');
  localStorage.setItem('scenarioMode', 'scenario');
  localStorage.setItem('scenarioRules', JSON.stringify({ jpHandicap: 0 }));
  localStorage.setItem('jpAutoAI', mode === 'human-vs-ai' ? '0' : '1');
  localStorage.setItem('fullAutoAI', mode === 'ai-vs-ai-auto' ? '1' : '0');
  window.location.href = 'wsm_hub.html';
}

function resumeFromFile() {
  const fileInput = document.getElementById('resumeFile');
  const status = document.getElementById('resumeStatus');
  const f = fileInput.files && fileInput.files[0];
  if (!f) { status.textContent = 'JSONファイルを選択してください'; status.style.color = '#f88'; return; }
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const text = ev.target.result;
      const payload = JSON.parse(text);
      if (!payload || !payload._wsmSave || !payload.state) throw new Error('帆船の戦いのセーブファイルではありません');
      const mode = payload.gameMode || document.querySelector('input[name="gameMode"]:checked')?.value || 'human-vs-ai';
      localStorage.removeItem('wsmHubState');
      localStorage.removeItem('wsmPendingScenario');
      localStorage.setItem('wsmResumeSave', text);
      localStorage.setItem('wsmGameMode', mode);
      localStorage.setItem('campaignReady', 'true');
      localStorage.setItem('scenarioMode', 'scenario');
      localStorage.setItem('scenarioRules', JSON.stringify({ jpHandicap: 0 }));
      localStorage.setItem('jpAutoAI', mode === 'human-vs-ai' ? '0' : '1');
      localStorage.setItem('fullAutoAI', mode === 'ai-vs-ai-auto' ? '1' : '0');
      status.textContent = `読込OK (T${payload.state.turn}/${payload.state.phase}) → 遷移します`;
      status.style.color = '#8f8';
      setTimeout(() => { window.location.href = 'wsm_hub.html'; }, 300);
    } catch (e) {
      console.error(e);
      status.textContent = '読込失敗: ' + e.message;
      status.style.color = '#f88';
    }
  };
  reader.onerror = () => { status.textContent = 'ファイル読込エラー'; status.style.color = '#f88'; };
  reader.readAsText(f);
}

renderScenarios();
</script>
<script src="lang.js"></script>
</body>
</html>
