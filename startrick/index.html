<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR TRICK</title>
<!-- アクセス解析（GoatCounter） -->
<style>
  :root { --g:#33ff33; --gd:#1f9f1f; --gl:#aaffaa; --r:#ff5555; --y:#ffe066; --bg:#000; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--g);
    font-family: 'Courier New', 'Menlo', 'MS Gothic', monospace; font-size: 14px; }
  button { font: inherit; color: var(--g); background: #031; border: 1px solid var(--gd); padding: 4px 10px; cursor: pointer; }
  button:hover { background: #063; color: var(--gl); }
  button.on { background: #1a5a1a; color: #fff; border-color: var(--g); }
  input[type=text], input[type=number] { font: inherit; color: var(--g); background: #000; border: 1px solid var(--gd); padding: 2px 6px; }
  a { color: var(--g); }
  .hide { display: none !important; }

  /* タイトル */
  #title { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #titleBox { width: 100%; max-width: 640px; border: 1px solid var(--gd); padding: 20px; }
  #titleBox h1 { margin: 0; font-size: 36px; letter-spacing: 4px; text-align: center; text-shadow: 0 0 6px var(--g); }
  #titleBox .sub { text-align: center; margin: 4px 0 16px; color: var(--gd); }
  .row { margin: 12px 0; }
  .row .lab { display: block; margin-bottom: 4px; color: var(--gl); }
  .desc { margin-top: 4px; min-height: 40px; color: var(--gd); }
  #btnStart { display: block; width: 100%; font-size: 20px; padding: 10px; margin-top: 16px; }
  #toTop { display: block; text-align: center; margin-top: 12px; }

  /* 冒頭の文字送り */
  #crawl { height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; cursor: pointer; }
  #crawlBox { width: min(640px, calc(100vw - 32px)); height: 300px; overflow: hidden; position: relative; }
  #crawlText { position: absolute; left: 0; right: 0; top: 100%; font-size: 20px; line-height: 1.8; text-align: center;
    text-shadow: 0 0 4px var(--g); animation: crawlUp 26s linear forwards; }
  @keyframes crawlUp { from { transform: translateY(0); } to { transform: translateY(calc(-300px - 100%)); } }
  #crawlSkip { margin-top: 12px; color: var(--gd); font-size: 12px; }

  /* ゲーム画面: 上が地図とヘルプ、下がコマンドと結果 */
  #game { height: 100%; display: grid; grid-template-rows: minmax(0, 54fr) minmax(0, 46fr); }
  #top { display: flex; gap: 8px; padding: 6px 8px; border-bottom: 2px solid var(--gd); min-height: 0; overflow: auto; }
  .pane { border: 1px solid #165c16; padding: 4px 8px; min-height: 0; flex: none; }
  .pane h3 { margin: 0 0 4px; font-size: 12px; font-weight: normal; color: var(--gl); border-bottom: 1px dotted var(--gd); white-space: nowrap; }
  pre { margin: 0; font: inherit; line-height: 1.3; }
  #paneHelp { flex: 1 1 320px; min-width: 300px; display: flex; flex-direction: column; }
  #helpTabs button { padding: 1px 6px; font-size: 12px; margin: 0 2px 4px 0; }
  #helpBody { flex: 1; overflow: auto; white-space: pre-wrap; font-size: 13px; line-height: 1.35; min-height: 0; }
  .note { font-size: 11px; color: var(--gd); margin-top: 3px; }
  #srs td, #gal td { padding: 0; text-align: center; white-space: pre; line-height: 1.25; }
  #srs table, #gal table { border-collapse: collapse; }
  #srs td.c { width: 26px; }
  #srs td.path { background: #143a14; }
  #srs td.block { background: #5a1414; }
  #srs td.tgt, #gal td.tgt { outline: 1px solid var(--y); outline-offset: -1px; }
  .clickable td.c, .clickable td.q { cursor: pointer; }
  .clickable td.c:hover, .clickable td.q:hover { background: #063; }
  .k { color: var(--r); font-weight: bold; }
  .b { color: #6cf; font-weight: bold; }
  .e { color: #fff; font-weight: bold; }
  #gal td.q { width: 34px; }
  #gal td.unk { color: #1a7a1a; }
  #gal td.cur { background: #1a5a1a; color: #fff; }
  #gal td.h, #srs td.h { color: var(--gd); font-size: 11px; }
  #status div { white-space: nowrap; }
  #status .v { color: #fff; }
  .red { color: var(--r) !important; font-weight: bold; }
  .yel { color: var(--y) !important; }

  #bottom { display: flex; min-height: 0; }
  #results { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 4px 8px; }
  #log { flex: 1; overflow-y: auto; white-space: pre-wrap; word-break: break-word; min-height: 0; line-height: 1.35; }
  #log .ech { color: var(--gl); }
  #log .bad { color: var(--r); }
  #inputline { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  #cmd { flex: 1; min-width: 0; border: none; outline: none; caret-color: var(--g); }
  #side { width: 400px; flex: none; border-left: 1px solid var(--gd); padding: 6px 8px; overflow-y: auto; }
  #cmdBtns button { margin: 0 3px 3px 0; padding: 3px 6px; font-size: 13px; }
  #form { border-top: 1px dotted var(--gd); margin-top: 4px; padding-top: 4px; }
  #form label { display: block; margin: 4px 0 1px; color: var(--gl); }
  #form input[type=range] { width: 100%; accent-color: var(--g); }
  #form input[type=number] { width: 90px; }
  #dial { display: grid; grid-template-columns: repeat(3, 36px); gap: 2px; margin: 2px 0; }
  #dial button { padding: 3px 0; }
  #dial span { text-align: center; color: var(--gd); line-height: 24px; }
  #formInfo { color: var(--gd); font-size: 12px; margin: 3px 0; white-space: pre-wrap; }
  #helper { margin-top: 4px; color: var(--y); font-size: 13px; white-space: pre-wrap; }
  #helper .row2 { color: var(--g); display: flex; justify-content: space-between; gap: 4px; align-items: center; margin: 1px 0; }
  #advice { color: var(--y); font-size: 13px; margin-bottom: 4px; white-space: pre-wrap; }
  #endBar { padding: 4px 8px; border-top: 1px solid var(--gd); background: #021; }
  .scanline { pointer-events: none; position: fixed; inset: 0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.15) 3px); }
  @media (max-width: 900px) {
    #side { width: 45%; }
    #top { flex-wrap: nowrap; }
  }
</style>
</head>
<body>

<div id="title">
  <div id="titleBox">
    <h1 id="tTitle"></h1>
    <div class="sub" id="tSub"></div>
    <div class="row"><span class="lab" id="lLang"></span>
      <button id="lang_ja" data-lang="ja">日本語</button>
      <button id="lang_en" data-lang="en">English</button>
    </div>
    <div class="row"><span class="lab" id="lMode"></span><div id="modeBtns"></div><div class="desc" id="modeDesc"></div></div>
    <div class="row"><span class="lab" id="lDiff"></span><div id="diffBtns"></div><div class="desc" id="diffDesc"></div></div>
    <button id="btnStart"></button>
    <a id="toTop" href="../index1.html"></a>
  </div>
</div>

<div id="crawl" class="hide">
  <div id="crawlBox"><div id="crawlText">Space: the final frontier.<br><br>These are the voyages of the starship Enterprise.<br><br>Its five-year mission: to explore strange new worlds, to seek out new life and new civilizations, to boldly go where no man has gone before.</div></div>
  <div id="crawlSkip"></div>
</div>

<div id="game" class="hide">
  <div id="top">
    <div class="pane" id="paneSrs"><h3 id="hSrs"></h3><div id="srs"></div><div class="note" id="legend"></div></div>
    <div class="pane" id="paneStatus"><h3 id="hStatus"></h3><div id="status"></div></div>
    <div class="pane" id="paneGal"><h3 id="hGal"></h3><div id="gal"></div><div class="note" id="legendG" style="max-width:440px"></div></div>
    <div class="pane" id="paneHelp"><h3 style="display:flex;justify-content:space-between;align-items:center"><span id="hHelp"></span><span><button id="zoomOut" style="padding:0 6px;font-size:12px">A−</button> <button id="zoomIn" style="padding:0 6px;font-size:12px">A＋</button></span></h3><div id="helpTabs"></div><div id="helpBody"></div></div>
  </div>
  <div id="bottom">
    <div id="results">
      <div id="log"></div>
      <div id="inputline"><span id="prompt"></span><input id="cmd" type="text" autocomplete="off" spellcheck="false"></div>
      <div id="endBar" class="hide"><button id="btnAgain"></button></div>
    </div>
    <div id="side">
      <div id="advice"></div>
      <div id="cmdBtns"></div>
      <div id="form"></div>
      <div id="helper"></div>
    </div>
  </div>
</div>
<div class="scanline"></div>

<script src="engine.js"></script>
<script src="i18n.js"></script>
<script src="ui.js"></script>
<script defer src="../game-analytics.js"></script>
</body>
</html>
