<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>独ソ電撃戦</title>
<!-- アクセス解析（GoatCounter） -->
<script defer src="../game-analytics.js"></script>
<style>
  * { box-sizing: border-box; }
  body { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh; height: 100dvh; margin: 0; background: #1b1d22; color: #e8e8e8; font-family: -apple-system, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif; font-size: 14px; overflow: hidden; -webkit-user-select: none; user-select: none; }
  #log { -webkit-user-select: text; user-select: text; }
  #top, #bottom {
    --map-olive: #575b49; --map-border: #777b65; --map-chip: #414736;
    --map-button: #474b39; --map-green: #345546; --map-river: #3f5963;
    --map-ink: #f7f3e3; --map-cream: #f0e3b8;
    color: var(--map-ink);
  }
  #top { grid-row: 1; min-height: 44px; display: flex; flex-wrap: wrap; align-items: center; gap: 5px 12px; padding: 5px 12px; background: var(--map-olive); border-bottom: 1px solid var(--map-border); white-space: nowrap; }
  #top .chip { background: var(--map-chip); border-radius: 4px; padding: 3px 8px; }
  #top .ger { color: var(--map-ink); } #top .sov { color: #ffd0be; }
  #top b.flash { animation: scoreFlash 1.2s ease-out; }
  @keyframes scoreFlash { 0% { background: #ffeb3b; color: #000; } 100% { background: transparent; } }
  #top button, #bottom button { background: var(--map-button); color: #fff; border: 1px solid #9a9d85; border-radius: 4px; padding: 3px 9px; cursor: pointer; }
  #turnBtns button { background: var(--map-green); border-color: #8ca88c; font-weight: bold; }
  #jumpBtns button { background: var(--map-river); border-color: #9fb7bf; }
  #jumpBtns button:disabled { background: var(--map-chip); border-color: var(--map-border); color: #c6c7b9; cursor: default; }
  #turnBtns button:disabled { background: var(--map-chip); border-color: var(--map-border); color: #c6c7b9; font-weight: normal; cursor: default; }
  #reportControls:not([hidden]) { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #reportControls select { color: var(--map-ink); background: var(--map-chip); border: 1px solid #9a9d85; border-radius: 4px; padding: 3px 5px; }
  #reportMapStatus { font-size: 12px; color: var(--map-cream); white-space: normal; }
  #bottom button.help { background: var(--map-river); border-color: #9fb7bf; font-weight: bold; }
  #main { position: relative; grid-row: 2; min-width: 0; min-height: 0; display: flex; }
  #bottom { grid-row: 3; min-height: 36px; display: flex; flex-wrap: wrap; align-items: center; gap: 5px 12px; padding: 5px 12px; background: var(--map-olive); border-top: 1px solid var(--map-border); white-space: nowrap; }
  #bottom .chip { background: var(--map-chip); border-radius: 4px; padding: 3px 8px; }
  #bottom .ger { color: var(--map-ink); } #bottom .sov { color: #ffd0be; }
  #top button:enabled:hover, #bottom button:enabled:hover { filter: brightness(1.16); }
  #bottom button:disabled { opacity: .4; cursor: default; }
  #bottom b.flash { animation: scoreFlash 1.2s ease-out; }
  #actBtns, #turnBtns, #jumpBtns { display: flex; flex-wrap: wrap; gap: 4px 6px; max-width: 100%; }
  #turnBtns[hidden], #jumpBtns[hidden] { display: none; }
  #actBtns button { background: var(--map-button); }
  #actBtns button.go { background: var(--map-green); border-color: #8ca88c; font-weight: bold; }
  #actBtns button.warn { background: #713d34; border-color: #b98470; }
  #actBtns button:disabled { opacity: .4; cursor: default; }
  #topActions { display: flex; flex: 1 0 100%; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-width: 0; }
  #topActions:has(#actBtns:empty):has(#actionMsg:empty) { display: none; }
  #actionMsg { color: var(--map-cream); font-size: 12px; white-space: normal; max-width: min(44rem, 100%); }
  #sideTab { width: 18px; flex: 0 0 18px; background: #2c313a; border-left: 1px solid #3a3f48; color: #cfd6e4; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; user-select: none; }
  #sideTab:hover { background: #3a4150; }
  #side.closed { display: none; }
  #mapWrap { flex: 1; overflow: auto; position: relative; background: #111; }
  #board { position: relative; transform-origin: 0 0; }
  #board img.map { display: block; user-select: none; -webkit-user-drag: none; }
  #overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
  #units { position: absolute; left: 0; top: 0; }
  #units[hidden] { display: none; }
  .unit { position: absolute; width: 40px; height: 40px; border-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.8); cursor: pointer; }
  .unit img { width: 40px; height: 40px; display: block; border-radius: 3px; }
  .unit.sel { outline: 3px solid #ffeb3b; outline-offset: 1px; z-index: 6 !important; }
  .unit.pick { outline: 3px solid #ff5252; outline-offset: 1px; z-index: 6 !important; }
  .unit.done img { filter: brightness(.6); }
  .unit.retreating { outline: 3px solid #ffdf43; outline-offset: 2px; z-index: 40 !important; }
  .unit.retreating img { filter: none; }
  .unit .retreat-mark { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); padding: 1px 4px; background: #ffdf43; color: #211a08; border: 1px solid #211a08; border-radius: 3px; font-size: 11px; font-weight: bold; white-space: nowrap; }
  .unit.edited { box-shadow: 0 0 0 2px #ffdf43, 0 0 0 4px #5a430b; }
  .unit .lbl { position: absolute; right: 1px; bottom: 1px; background: rgba(0,0,0,.75); color: #fff; font-size: 10px; padding: 0 2px; border-radius: 2px; }
  .unit .cnt { position: absolute; right: -7px; top: -7px; background: #ffeb3b; color: #000; font-size: 11px; font-weight: bold; width: 16px; height: 16px; border-radius: 8px; text-align: center; line-height: 16px; box-shadow: 0 0 2px #000; }
  .unit.fan { box-shadow: 0 0 0 2px #fff, 0 3px 10px rgba(0,0,0,.9); }
  .unit .brk { position: absolute; left: -4px; top: -6px; font-size: 12px; }
  .unit .mk { position: absolute; left: -5px; bottom: -5px; font-size: 10px; font-weight: bold; color: #fff; padding: 0 3px; border-radius: 3px; border: 1px solid #fff; line-height: 14px; }
  .unit .mk.moving { background: #1e88e5; }
  .unit .mk.done { background: #616161; }
  .unit .mk.hold { background: #8a2734; }
  .row .mk { font-size: 11px; font-weight: bold; color: #fff; padding: 0 4px; border-radius: 3px; margin-left: 4px; }
  .row .mk.moving { background: #1e88e5; } .row .mk.done { background: #616161; } .row .mk.fresh { background: #2e7d32; }
  .row button.on { background: #2e6b3a; border-color: #8bc34a; font-weight: bold; }
  #side { width: 280px; background: #22262d; border-left: 1px solid #3a3f48; display: flex; flex-direction: column; }
  #panel { padding: 8px 9px; overflow-y: auto; flex: 1 1 auto; }
  #panel h2 { font-size: 15px; margin: 2px 0 6px; color: #f0d070; }
  #panel h3 { font-size: 13px; margin: 12px 0 4px; color: #9fd3ff; border-bottom: 1px solid #3a3f48; padding-bottom: 2px; }
  .step { background: #2b3540; border-left: 4px solid #4fc3f7; padding: 5px 7px; margin: 3px 0 6px; line-height: 1.45; font-size: 12px; }
  .step.big { border-left-color: #69f0ae; background: #24392c; font-size: 13px; }
  .step.warn { border-left-color: #ffab40; background: #3b3024; }
  #panel button { background: #3d4452; color: #fff; border: 1px solid #5a6273; border-radius: 4px; padding: 5px 8px; cursor: pointer; margin: 2px 2px 2px 0; font-size: 12px; }
  #panel button.go { background: #2e6b3a; border-color: #5aa86a; font-weight: bold; }
  #panel button.warn { background: #7a3030; border-color: #b55; }
  #panel button:disabled { opacity: .4; cursor: default; }
  #setupTray { flex: 1 0 100%; min-width: 0; }
  #setupTray .tray { display: flex; gap: 14px; overflow-x: auto; padding: 4px; }
  #setupTray .tray-group { flex: 0 0 auto; }
  #setupTray .tray-units { display: flex; gap: 7px; padding: 5px 3px; }
  #setupTray .unit { position: relative; display: block; padding: 0; border: 0; background: none; }
  #saveStatus { font-size: 12px; color: var(--map-cream); }
  #saveStatus:not(:empty) { white-space: normal; overflow-wrap: anywhere; flex: 1 1 20rem; }
  #dokusoCode { width: 10em; max-width: 100%; font: inherit; padding: 5px; }
  #dokusoRoomBar { flex: 1 0 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 7px 12px; background: #242d24; border: 2px solid #e6c96c; border-radius: 6px; white-space: normal; }
  #dokusoRoomBar[hidden] { display: none; }
  #dokusoRoomBar label { font-size: 16px; font-weight: bold; }
  .dokuso-room-code { width: 10ch; max-width: 100%; border: 0; border-radius: 4px; background: #161c18; color: #ffdf77; font: bold 30px ui-monospace, monospace; letter-spacing: 2px; text-align: center; padding: 4px 8px; user-select: text; -webkit-user-select: text; }
  #dokusoRoomBar button { font-size: 14px; padding: 6px 10px; }
  .dokuso-code-status { font-size: 13px; color: #f0e3b8; white-space: normal; }
  .dokuso-lobby-code { text-align: center; margin: 18px 0; }
  .dokuso-lobby-code .dokuso-room-code { display: block; font-size: clamp(32px, 7vw, 48px); margin: 10px auto; }
  #dokusoOnlineTask { flex: 1 0 100%; white-space: normal; padding: 8px 12px; border: 2px solid #d6aa55; border-radius: 6px; background: #423422; }
  #dokusoOnlineTask[hidden], #dokusoOnlineResult[hidden] { display: none; }
  #dokusoOnlineTask.myturn { border-color: #88dda0; background: #24452e; }
  #dokusoOnlineTaskTitle { display: block; font-size: 18px; line-height: 1.4; }
  #dokusoOnlineTaskDetail { display: block; font-size: 15px; line-height: 1.5; }
  #dokusoOnlineTransition { display: block; font-size: 14px; color: #ffdf77; }
  #dokusoOnlineResult { position: absolute; top: 8px; left: 8px; z-index: 90; box-sizing: border-box; width: min(16rem, calc(100% - 16px)); max-height: calc(100% - 16px); overflow: auto; padding: 6px 8px; border: 1px solid #f0d070; border-radius: 5px; background: #1e2228; box-shadow: 0 2px 6px #0008; font-size: 12px; line-height: 1.35; user-select: text; }
  #dokusoOnlineResult strong { font-size: 13px; color: #ffdf77; }
  #dokusoOnlineResult p { margin: 3px 0 0; }
  #dokusoOnlineResult button { float: right; min-width: 24px; min-height: 22px; background: #414736; color: white; border: 1px solid #aaa; border-radius: 4px; font-size: 14px; cursor: pointer; }
  .dokuso-die-row { display: flex; align-items: center; gap: 6px; }
  #dokusoOnlineDie { flex: none; font-size: 24px; color: #fff; line-height: 1.15; }
  #dokusoOnlineDie.rolling { color: #ffdf77; }
  .dokuso-advance-choices { display: flex; flex-wrap: wrap; gap: 4px; }
  #dokusoOnlineParticipants { display: flex; gap: 3px; overflow-x: auto; }
  #dokusoOnlineParticipants img { flex: none; width: 22px; height: 22px; border-radius: 2px; }
  .group-h { font-size: 12px; color: #cdd; margin-top: 6px; }
  .row { display: flex; align-items: center; gap: 6px; background: #2c313a; border-radius: 4px; padding: 2px 4px; margin: 2px 0; cursor: pointer; font-size: 11px; line-height: 1.3; }
  .row.on { background: #3a4a2e; outline: 1px solid #8bc34a; }
  .row.retreating { outline: 2px solid #ffdf43; }
  .row img { width: 32px; height: 32px; border-radius: 3px; flex: 0 0 auto; }
  .row button { padding: 3px 6px !important; font-size: 11px !important; }
  .row .nm { flex: 1; }
  .row input { transform: scale(1.3); }
  .decl { background: #2c313a; border-radius: 4px; padding: 4px 6px; margin: 3px 0; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
  .decl button { padding: 1px 6px !important; }
  #log { height: 190px; flex: 0 0 auto; overflow-y: auto; border-top: 1px solid #3a3f48; padding: 6px 10px; font-size: 12px; line-height: 1.45; background: #1e2127; }
  #log .combat { color: #ffd180; } #log .loss { color: #ff8a80; } #log .control { color: #80d8ff; } #log .score { color: #b9f6ca; } #log .phase { color: #f0d070; font-weight: bold; margin-top: 4px; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; z-index: 100; }
  #modal .box { background: #262a31; border: 1px solid #5a6273; border-radius: 8px; padding: 20px 24px; min-width: 360px; max-width: 760px; max-height: 90vh; overflow-y: auto; line-height: 1.6; }
  #modal h2 { margin: 0 0 12px; color: #f0d070; }
  #modal h3 { margin: 14px 0 4px; color: #9fd3ff; font-size: 15px; }
  #modal label { display: block; margin: 6px 0; cursor: pointer; }
  #modal .mode-detail { display: block; margin-inline-start: 1.6em; color: #c9d1dd; font-size: .85rem; }
  #modal button { background: #2e6b3a; color: #fff; border: 1px solid #5aa86a; border-radius: 4px; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }
  #modal .mode-disabled, #modal button:disabled { opacity: .55; filter: grayscale(1); cursor: default; }
  #modal .warn { color: #ffcc80; font-size: 12px; margin-top: 10px; line-height: 1.5; }
  #modal ul { margin: 4px 0; padding-left: 20px; }
  #modal .box:has(.game-report) { padding: 14px 18px; }
  #modal .game-report h2 { margin-bottom: 5px; }
  .game-report { user-select: text; line-height: 1.4; }
  .game-report .outcome { font-size: 21px; font-weight: bold; color: #f0d070; margin: 0; }
  .game-report .report-table { width: 100%; border-collapse: collapse; }
  .game-report th, .game-report td { padding: 4px 8px; border-bottom: 1px solid #414956; vertical-align: top; }
  .game-report thead { background: #343b46; }
  .game-report th[scope=row] { text-align: left; white-space: nowrap; }
  .game-report .score { text-align: center; font-variant-numeric: tabular-nums; }
  #modal .report-table button { margin: 0; padding: 2px 8px; font-size: 12px; white-space: nowrap; }
  .game-report .report-note { color: #c7cdd6; font-size: 12px; margin: 7px 0 0; }
  #phaseBanner { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 95; display: none; text-align: center; padding: 18px 40px; border-radius: 12px; box-shadow: 0 6px 30px rgba(0,0,0,.85); cursor: pointer; transition: opacity .35s; }
  #phaseBanner .t1 { font-size: 18px; color: #eee; }
  #phaseBanner .t2 { font-size: 34px; font-weight: bold; margin: 4px 0; color: #fff; }
  #phaseBanner .t3 { font-size: 20px; font-weight: bold; }
  #phaseBanner.human { background: rgba(27,94,32,.95); border: 3px solid #69f0ae; }
  #phaseBanner.human .t3 { color: #b9f6ca; }
  #phaseBanner.ai { background: rgba(55,60,70,.95); border: 3px solid #9aa3b5; }
  #phaseBanner.ai .t3 { color: #cfd6e4; }
  #top .chip.myturn { background: var(--map-green); color: #fff; font-weight: bold; animation: myturn 1.6s ease-in-out infinite; }
  @keyframes myturn { 0%, 100% { box-shadow: 0 0 0 0 rgba(105,240,174,.0); } 50% { box-shadow: 0 0 0 4px rgba(105,240,174,.7); } }
  #hoverBox { position: fixed; z-index: 90; pointer-events: none; display: none; background: rgba(25,27,33,.95); border: 1px solid #8a93a6; border-radius: 6px; padding: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.8); }
  #hoverBox .hb { display: inline-block; vertical-align: top; text-align: center; margin: 0 3px; width: 124px; font-size: 11px; line-height: 1.35; color: #e8e8e8; }
  #hoverBox .hb img { width: 120px; height: 120px; border-radius: 5px; display: block; margin: 0 auto 3px; border: 2px solid transparent; }
  #hoverBox .hb.cur img { border-color: #ffeb3b; }
  #combatCard { position: absolute; top: 10px; left: 12px; z-index: 50; background: rgba(30,33,40,.96); border: 2px solid #f0d070; border-radius: 8px; padding: 10px 14px; width: 330px; box-shadow: 0 4px 16px rgba(0,0,0,.7); display: none; line-height: 1.5; }
  #combatCard h4 { margin: 0 0 6px; color: #f0d070; font-size: 15px; }
  #combatCard .side { font-size: 12px; color: #ccd; margin-top: 4px; }
  #combatCard .imgs { display: flex; gap: 4px; flex-wrap: wrap; margin: 2px 0; }
  #combatCard .imgs img { width: 40px; height: 40px; border-radius: 3px; }
  #combatCard .odds { font-size: 14px; margin-top: 6px; }
  #combatCard .dice { font-size: 54px; line-height: 1; text-align: center; margin: 4px 0; color: #fff; }
  #combatCard .dice.roll { animation: shake .12s infinite; color: #ffeb3b; }
  @keyframes shake { 0% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } 100% { transform: rotate(-12deg); } }
  #combatCard table { width: 100%; border-collapse: collapse; margin: 6px 0 2px; font-size: 12px; }
  #combatCard td { padding: 1px 6px; border-bottom: 1px solid #3a3f48; }
  #combatCard td:first-child { width: 28px; font-size: 18px; text-align: center; }
  #combatCard tr.hit td { background: #8a6d00; color: #fff; font-weight: bold; }
  #combatCard .result { font-size: 15px; font-weight: bold; text-align: center; color: #ffd180; min-height: 22px; }
  #combatCard .expl { font-size: 12px; color: #ccd; text-align: center; }
  #combatCard button { display: block; margin: 8px auto 0; background: #2e6b3a; color: #fff; border: 1px solid #5aa86a; border-radius: 4px; padding: 7px 26px; font-size: 15px; font-weight: bold; cursor: pointer; }
  .res { font-size: 13px; background: #2c313a; border-left: 4px solid #f0d070; padding: 6px 8px; margin: 6px 0; line-height: 1.5; }
</style>
</head>
<body>
<div id="top">
  <div id="dokusoRoomBar" hidden>
    <label for="dokusoRoomNumber">部屋番号</label>
    <input id="dokusoRoomNumber" class="dokuso-room-code" readonly inputmode="numeric" onclick="this.select()">
    <button type="button" onclick="copyDokusoRoomNumber('dokusoRoomNumber', 'dokusoRoomCopyStatus')">番号をコピー</button>
    <span id="dokusoRoomCopyStatus" class="dokuso-code-status" role="status"></span>
  </div>
  <div id="dokusoOnlineTask" hidden role="status" aria-live="polite">
    <span id="dokusoOnlineTransition"></span>
    <b id="dokusoOnlineTaskTitle"></b>
    <span id="dokusoOnlineTaskDetail"></span>
  </div>
  <span>拡大: <button onclick="zoomBy(-0.1)">−</button> <span id="zoomLbl">100%</span> <button onclick="zoomBy(0.1)">＋</button></span>
  <button id="toggleUnits" type="button" aria-controls="units" onclick="toggleMapUnits()">駒を隠す</button>
  <span class="chip" id="turnInfo">-</span>
  <span class="chip" id="phaseInfo">-</span>
  <span id="turnBtns">
    <button id="btnUndoMove" onclick="undoMoveBtn()" hidden disabled>1手戻す</button>
    <button id="btnEndMove" onclick="endMoveBtn()">移動終了</button>
    <button id="btnEndCombat" onclick="combatPhaseBtn()">戦闘終了</button>
    <button id="btnAiNext" onclick="aiMoveNext()" style="display:none">次へ進む</button>
  </span>
  <span id="jumpBtns">
    <button id="btnJumpMove" onclick="jumpNext('move')">未移動へ</button>
    <button id="btnJumpAtk" onclick="jumpNext('atk')">未攻撃へ</button>
  </span>
  <span id="reportControls" hidden>
    <button type="button" onclick="showEnd()">対局レポート</button>
    <label for="reportTurn">ドイツ軍の移動</label>
    <select id="reportTurn" onchange="showReportMap(Number(this.value))"></select>
    <span id="reportMapStatus" role="status"></span>
  </span>
  <div id="topActions">
    <span id="actBtns"></span>
    <span id="actionMsg"></span>
  </div>
</div>
<div id="bottom">
  <span class="chip"><span class="ger">ドイツ <b id="scGer">0</b></span> ／ <span class="sov">ソ連 <b id="scSov">0</b></span></span>
  <button class="help" onclick="showHelp()">遊び方</button>
  <button id="saveFileBtn" onclick="saveGameFile()" disabled>ファイルに保存</button>
  <button id="loadFileBtn" onclick="openGameFile()">ファイルを読み込む</button>
  <input id="saveFileInput" type="file" accept=".json,application/json" onchange="loadGameFile(this)" hidden>
  <span id="saveStatus" role="status"></span>
  <button id="dokusoRoomMenu" onclick="showDokusoRoomMenu()" hidden>接続</button>
  <div id="setupTray" hidden></div>
</div>
<div id="main">
  <div id="mapWrap"><div id="board">
    <img class="map" id="mapImg" src="images/Operation%20Barbarossa%20map.jpg" alt="地図">
    <canvas id="overlay"></canvas>
    <div id="units"></div>
  </div></div>
  <div id="sideTab" onclick="toggleSide()" title="右の欄を開く・閉じる">▶</div>
  <div id="side"><div id="panel"></div><div id="log"></div></div>
  <div id="combatCard"></div>
  <aside id="dokusoOnlineResult" hidden role="status" aria-live="polite">
    <button type="button" onclick="document.getElementById('dokusoOnlineResult').hidden=true" aria-label="閉じる">×</button>
    <strong>戦闘結果</strong>
    <p id="dokusoOnlineResultSummary"></p>
    <p class="dokuso-die-row"><span id="dokusoOnlineDie" role="img" aria-hidden="true"></span><b id="dokusoOnlineResultDetail"></b></p>
    <p id="dokusoOnlineParticipantsLabel"></p>
    <div id="dokusoOnlineParticipants"></div>
  </aside>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="hoverBox"></div>
<div id="phaseBanner" onclick="hideBanner()"></div>

<script src="images/mapdata.js"></script>
<script src="dokuso_units.js"></script>
<script src="dokuso_engine.js"></script>
<script src="dokuso_ai.js"></script>

const SIDE = D.SIDE_NAME;

const LOCAL_CONTROLS = {
  assisted: Object.freeze({ ger: 'human', sov: 'ai' }),

let trails = []; // 移動の経路の矢印 { side, path:[from, ..., to] }

const SAVE_FIELDS = ['turn', 'phase', 'units', 'control', 'breakScore', 'log', 'declared',

const INITIAL_UI = { ...ui, aiMoveDone: false, aiSetupReview: false, setupArea: null, fanHex: null, moveEdit: null, holdPick: null, germanPreview: null, reportTurn: null };

function startGame() {
  const mode = document.querySelector('input[name=mode]:checked:not(:disabled)')?.value;
  if (!Object.hasOwn(LOCAL_CONTROLS, mode)) return;
  ctrl = LOCAL_CONTROLS[mode];
  installGame(new D.Game(MD, DOKUSO_UNIT_IMAGES));
  game.addLog('ゲーム開始。ソ連が先に配置します（ソ連も自分の駒の戦闘力は分かりません）', 'phase');
  later(showPhaseBanner, 50);
  drive();
}

function installGame(nextGame, savedUI, savedTrails = []) {
  runToken++;
  aiBusy = false;
  hideCombatCard();
  hideBanner();
  hideHover();
  Object.assign(ui, INITIAL_UI, { moveSel: [], pick: [] }, savedUI);
  document.getElementById('modal').style.display = 'none';
  document.getElementById('saveFileBtn').disabled = false;
  document.getElementById('loadFileBtn').disabled = false;
  document.getElementById('saveStatus').textContent = '';
  game = nextGame;
  trails = savedTrails;
  game.on(ev => {
    if (ev.type === 'log') addLogLine(ev.entry);
    if (ev.type === 'undo') { renderLog(); trails = trails.filter(t => t.seq <= (game.undoStack ? game.undoStack.length : 0) || t.phase !== game.phase); }
    // 移動の経路を記録（同じ道を通った駒はまとめて1本）
    if (ev.type === 'move' && /_move$/.test(game.phase)) {
      const u = game.unit(ev.unit), path = [ev.from, ...(ev.path || [ev.to])];
      const key = game.phase + '|' + path.join('-') + '|' + (game.undoStack ? game.undoStack.length : 0);
      const trail = trails.find(t => t.key === key);
      if (trail) trail.units.push(u.id);
      else {
        const edited = reviewingSovietMove();
        trails.push({ key, side: u.side, path, phase: game.phase, turn: game.turn, seq: game.undoStack.length, units: [u.id], edited });
      }
    }
    // 移動フェイズが終わったら（次のフェイズに移ったら）矢印を消す
    if (ev.type === 'phase') { trails = []; ui.holdPick = null; ui.germanPreview = null; showPhaseBanner(); }
  });
  renderLog();
}

function serializeGame() {
  const view = document.getElementById('mapWrap');
  const state = Object.fromEntries(SAVE_FIELDS.map(key => [key, game[key]]));
  state.sovInitialAdjacentInfantry = [...(game.sovInitialAdjacentInfantry || [])];
  const savedUI = { ...ui };
  if (ui.adv?.paths) savedUI.adv = { ...ui.adv, paths: [...ui.adv.paths] };
  return JSON.stringify({
    version: 1, state, ui: savedUI, ctrl, trails, zoom,
    scroll: [view.scrollLeft, view.scrollTop],
  });
}

function saveGameFile() {
  if (isDokusoOnline() || !game) return;
  const url = URL.createObjectURL(new Blob([serializeGame()], {type: 'application/json'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = `dokuso-turn-${game.turn}.json`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function openGameFile() {
  if (!isDokusoOnline()) document.getElementById('saveFileInput').click();
}

async function loadGameFile(input) {
  const file = input.files[0];
  input.value = '';
  if (!file || isDokusoOnline()) return;
  try {
    const data = await file.text();
    if (!isDokusoOnline()) restoreGame(data);
  } catch {
    alert('保存した対局を読み込めませんでした。');
  }
}

function restoreGame(data) {
  let save, nextGame, savedUI, savedControls;
  try {
    save = JSON.parse(data);
    if (save?.version !== 1 || !Object.hasOwn(D.PHASE_NAME, save.state?.phase) ||
        !Array.isArray(save.state.units) || !save.ctrl ||
        !Array.isArray(save.trails) || !Number.isFinite(save.zoom) || !Array.isArray(save.scroll)) throw new Error('Invalid save');
    savedControls = Object.values(LOCAL_CONTROLS).find(mode => mode.ger === save.ctrl.ger && mode.sov === save.ctrl.sov);
    if (!savedControls) {
      alert('この対戦モードのセーブデータは現在読み込めません。');
      return;
    }
    nextGame = new D.Game(MD, DOKUSO_UNIT_IMAGES);
    for (const key of SAVE_FIELDS) if (Object.hasOwn(save.state, key)) nextGame[key] = save.state[key];
    nextGame.sovInitialAdjacentInfantry = new Set(save.state.sovInitialAdjacentInfantry);
    restoreZeroDefenders(nextGame);
    savedUI = { ...save.ui };
    if (savedUI.adv && nextGame.pending?.advance) {
      const snapshot = savedUI.adv.origin
        ? { paths: new Map(savedUI.adv.paths) }
        : advanceSnapshot(nextGame);
      Object.assign(savedUI.adv, snapshot);
    }
  } catch {
    alert('保存した対局を読み込めませんでした。');
    return;
  }
  const assisted = savedControls === LOCAL_CONTROLS.assisted;
  savedUI.aiSetupReview = assisted && nextGame.phase === 'setup_sov' && (savedUI.aiSetupReview || nextGame.setupDone('sov'));
  savedUI.aiMoveDone = assisted && nextGame.phase === 'sov_move' && !!savedUI.aiMoveDone;
  if (!savedUI.aiMoveDone || !nextGame.moveState?.[savedUI.moveEdit?.id] || nextGame.unit(savedUI.moveEdit?.id)?.holdTarget) savedUI.moveEdit = null;
  savedUI.holdPick = null;
  savedUI.germanPreview = null;
  const retreating = savedUI.mode === 'retreat' && savedUI.retreatUnit &&
    savedControls[nextGame.unit(savedUI.retreatUnit)?.side] === 'human' &&
    nextGame.pending?.retreat?.[0]?.unit === savedUI.retreatUnit && nextGame.retreatOptions(savedUI.retreatUnit).length;
  const advancing = savedUI.mode === 'advance' && nextGame.pending?.advance && Array.isArray(savedUI.adv?.sel) &&
    (savedUI.adv.review ? assisted : savedControls[nextGame.combatSide()] === 'human');
  if (!retreating) savedUI.retreatUnit = null;
  if (!advancing) savedUI.adv = null;
  if (!retreating && !advancing) savedUI.mode = null;
  ctrl = savedControls;
  zoom = save.zoom;
  installGame(nextGame, savedUI, save.trails);
  applyZoom();
  if (ui.mode) render();
  else drive();
  const view = document.getElementById('mapWrap');
  [view.scrollLeft, view.scrollTop] = save.scroll;
  document.getElementById('saveStatus').textContent = '保存した対局を読み込みました';
}

function restoreZeroDefenders(game) {
  if (game.phase !== 'ger_combat' || !game.combatQueue?.length) return;
  // 更新前に判定を始めて保存した対局では、まだ判定していない戦闘の守備隊を除去ログから戻す。
  const losses = new Set(game.log.filter(e => e.kind === 'loss' && e.turn === game.turn && e.phase === game.phase).map(e => e.text));
  for (const index of game.combatQueue) {
    const attack = game.declared[index];
    if (attack.zeroDefenders || game.enemyAt(attack.hex, 'ger')) continue;
    const removed = game.units.filter(u => u.side === 'sov' && !u.alive && u.str === 0 && u.hex === attack.hex &&
      u.killedTurn === game.turn && losses.has(`${game.unitName(u)}（${attack.hex}）が除去されました（戦闘力0）`));
    if (removed.length) attack.zeroDefenders = removed.map(u => u.id);
  }
}

const AI_DELAY = 900;
const later = (fn, ms) => { const tk = runToken; setTimeout(() => { if (tk === runToken) fn(); }, ms == null ? AI_DELAY : ms); };

// ===== 進行（AIの手番を動かす） =====
function drive() {
  if (isDokusoOnline()) { dokusoOnlineDrive(); return; }
  if (!game) return;
  render();
  if (ui.aiSetupReview || ui.aiMoveDone) return;
  if (game.phase === 'over') { showEnd(); return; }
  const side = game.activeSide();
  if (game.combatQueue && (game.pending || game.combatQueue.length || ctrl[side] === 'ai')) { stepResolve(); return; }
  if (ctrl[side] !== 'ai' || aiBusy) return;
  aiBusy = true;
  if (game.phase === 'setup_' + side) {
    later(() => {
      AI.setup(game, side);
      if (anyHuman()) {
        aiBusy = false;
        ui.aiSetupReview = true;
        ui.setupSel = null;
        ui.setupArea = null;
        ui.hex = null;
        render();
        return;
      }
      render();
      later(() => { game.finishSetup(side); aiBusy = false; drive(); });
    });
  } else if (game.phase === side + '_move') {
    const stepFn = () => {
      const a = AI.nextMove(game, side);
      if (!a) {
        AI.fixStacking(game, side);
        // 人間がいる対戦では、AI の移動を確認できるように止めて待つ
        if (anyHuman()) { aiBusy = false; ui.aiMoveDone = true; ui.hex = null; render(); return; }
        const r = game.endPhase();
        aiBusy = false;
        if (!r.ok) game.addLog('AI: ' + r.reason, 'loss');
        later(drive, 200); return;
      }
      AI.doAction(game, a);
      const u = game.unit(a.unit); ui.hex = u && u.hex; render();
      later(stepFn);
    };
    later(stepFn);
  } else if (game.phase === side + '_combat') {
    later(() => {
      for (const d of AI.planCombats(game, side)) game.declare(d.attackers, d.hex);
      render();
      later(() => { game.startResolve(); aiBusy = false; render(); later(stepResolve); }, AI_DELAY * 2);
    });
  } else aiBusy = false;
}
// 戦闘の判定を1つずつ。人間の駒の退却・人間側の戦闘後前進は画面で選ぶ
function stepResolve() {
  if (isDokusoOnline()) { dokusoOnlineDrive(); return; }
  if (ui.mode === 'advance') return;
  const p = game.pending;
  if (p) {
    if (p.retreat.length) {
      const x = p.retreat[0], u = game.unit(x.unit);
      const opts = game.retreatOptions(x.unit);
      if (ctrl[u.side] === 'human' && opts.length) { ui.mode = 'retreat'; ui.retreatUnit = x.unit; ui.hex = u.hex; render(); scrollToHex(u.hex); return; }
      game.applyRetreat(x.unit, opts.length ? AI.chooseRetreat(game, x.unit) : null);
      render(); later(stepResolve); return;
    }
    if (p.advance) {
      const side = game.combatSide();
      const review = side === 'sov' && ctrl.sov === 'ai' && ctrl.ger === 'human';
      if (ctrl[side] === 'human' || review) {
        openAdvance(review);
        return;
      }
      game.applyAdvance(AI.chooseAdvance(game));
      render(); later(stepResolve); return;
    }
  }
  const info = game.peekNext();
  if (info) {
    if (info.skip) { game.resolveNext(); render(); later(stepResolve, 100); return; }
    showCombatCard(info);
    return;
  }
  hideCombatCard();
  ui.mode = null;
  const side = game.combatSide();
  if (side && ctrl[side] === 'ai') { game.endPhase(); later(drive, 250); }
  render();
}

// ===== 戦闘の札（攻撃側・防御側・比・サイコロ・結果） =====

const RESULT_EXPL = {

let cardBusy = false;
function showCombatCard(info) {
  if (cardBusy) return;            // 見せている間は次を始めない

  const imgs = (ids, cls) => ids.map(id => { const u = game.unit(id); return `<img class="${cls}" data-id="${id}" src="${encodeURI(front(u))}" title="${u.side === 'sov' ? 'ソ連（裏返す前）' : game.unitName(u)}">`; }).join('');

    <div class="dice" id="ccDice" style="display:none">⚀</div><div class="result" id="ccRes"></div><div class="expl" id="ccExpl"></div><div id="ccBtn"></div>`;
  card.style.display = 'block';

  const gap = AI_DELAY;

  if (hasSov) steps.push(() => { card.querySelectorAll('img.ccU').forEach(im => { const u = game.unit(im.dataset.id); im.src = encodeURI(unitImg(u)); im.title = game.unitName(u); }); $('ccStage').textContent = ''; });

    steps.push(() => { $('ccOdds').style.display = 'block'; });

  }

  steps.push(() => {
    const dEl = $('ccDice');
    const resolve = () => {
      if (tk !== runToken) return;
      const r = game.resolveNext();
      if (!r) { cardBusy = false; return; }
      ui.lastResult = r;
      dEl.classList.remove('roll');
      dEl.textContent = fixed ? '－' : DICE[r.die];
      $('ccStage').textContent = '';
      if (!fixed) { const tr = card.querySelector(`#ccTable tr[data-d="${r.die}"]`); if (tr) tr.className = 'hit'; }
      $('ccRes').textContent = `${fixed ? '' : 'ダイス ' + r.die + ' → '}${D.RESULT_NAME[r.result]}`;
      $('ccExpl').textContent = info.zeroDefense ? ZERO_DEFENSE_TEXT + '。' + RESULT_EXPL.DE : RESULT_EXPL[r.result] || '';

}

function humanTurnSide() { if (isDokusoOnline() && !dokusoOnlineMyTurn()) return null; const sd = game && game.activeSide(); return (sd && ctrl[sd] === 'human' && !ui.mode && !ui.holdPick) ? sd : null; }

}

// ===== 見落とし防止: まだ動かしていない駒・まだ攻撃に入れていない駒のヘクスへ順番に移る =====
function jumpHexes(kind) { return jumpUnits(kind).hexes; }
function jumpUnits(kind) {
  const sd = humanTurnSide() || (kind === 'move' && reviewingSovietMove() ? 'sov' : null);
  if (!sd || ui.moveEdit) return { units: [], hexes: [] };
  let units = [];
  if (kind === 'move' && game.phase === sd + '_move') units = game.onMap(sd).filter(u => game.canMove(u) && !game.moveState[u.id].moved);
  if (kind === 'atk' && game.phase === sd + '_combat' && !game.combatQueue) {
    const used = game.usedAttackers();
    units = game.onMap(sd).filter(u => !used.has(u.id) && game.adjEnemy(u.hex, sd));
  }
  // 地図の左上から右下の順（列、行の順）
  const hexes = [...new Set(units.map(u => u.hex))].sort((a, b) => { const A = game.map.parse(a), B = game.map.parse(b); return (A.c - B.c) || (A.r - B.r); });
  return { units, hexes };
}
function jumpNext(kind) {
  const list = jumpHexes(kind);
  if (!list.length) return;
  const i = list.indexOf(ui.hex);
  const h = list[(i + 1) % list.length];
  ui.hex = h; ui.fanHex = null; ui.msg = '';
  if (kind === 'move') ui.moveSel = reviewingSovietMove() ? game.unitsAt(h).filter(u => u.side === 'sov').slice(0, 1).map(u => u.id) : defaultMoveSel(h, game.activeSide());
  render();
  scrollToHex(h);
}
function reviewingSovietMove() {
  return ui.aiMoveDone && game.phase === 'sov_move' && ctrl.sov === 'ai' && ctrl.ger === 'human';
}

// 確定するまでは盤面を変えず、駒の移動開始地点から行き先を選び直す。
function beginSovietMoveEdit(unit) {
  if (!reviewingSovietMove() || ui.moveEdit || unit.side !== 'sov' || unit.holdTarget || ui.holdPick) return;
  const from = game.moveState[unit.id]?.start;
  if (!from) return;
  ui.moveEdit = { id: unit.id, target: null };
  ui.germanPreview = null;
  ui.hex = from;
  ui.moveSel = [unit.id];
  ui.fanHex = null;
  ui.msg = '移動前の位置から、色のついた行き先を選んでください。';
  render();
  scrollToHex(from);
}
function cancelSovietMoveEdit() {
  const unit = game.unit(ui.moveEdit.id);
  ui.moveEdit = null;
  ui.hex = unit.hex;
  ui.msg = '';
  render();
}
function returnSovietMoveToStart(unit) {
  const from = game.moveState[unit.id].start;
  if (applySovietMoveEdit(unit, from)) scrollToHex(from);
}
function applySovietMoveEdit(u, target) {
  const id = u.id;
  const state = game.moveState[id];
  const from = state.start;
  const route = game.revisionTargets(u).get(target);
  if (!route) return false;
  const initial = game.undoStack[0]?.control || { ...game.control };
  const seq = Math.max(0, ...trails.map(t => t.seq)) + 1;
  trails = trails.map(t => ({ ...t, units: t.units.filter(unit => unit !== id) })).filter(t => t.units.length);
  if (route.path.length) trails.push({
    key: 'edit|' + seq, side: u.side, path: [from, ...route.path], phase: game.phase,
    turn: game.turn, seq, units: [id], edited: true,
  });
  u.hex = target;
  game.moveState[id] = {
    ...state, mp: u.mov - route.cost, moved: target !== from,
    stopped: target !== from && game.adjEnemy(target, u.side), group: null,
  };
  // 他の駒が通った都市は維持し、修正後の経路から今フェイズの支配を作り直す。
  game.control = { ...initial };
  game.log = game.log.filter(e => e.kind !== 'control' || e.phase !== game.phase || e.turn !== game.turn);
  for (const t of trails) {
    if (t.phase !== game.phase || t.turn !== game.turn) continue;
    const mover = game.unit(t.units[0]);
    for (const hex of t.path.slice(1)) game._pass(mover, hex);
  }
  renderLog();
  ui.moveEdit = null;
  ui.hex = target;
  ui.moveSel = [id];
  ui.fanHex = null;
  ui.msg = '';
  render();
  return true;
}

// 点数（変わった時は黄色く光らせる）
function setScore(id, v) {
  const el = document.getElementById(id);
  const sameGame = el.dataset.tok === String(runToken);   // ゲームを始めた直後の表示では光らせない
  if (el.textContent !== String(v)) {
    el.textContent = v;
    if (sameGame) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  }
  el.dataset.tok = String(runToken);
}
function hexPath(h, r) {
  const c = game.map.center(h), sz = (r || 1) * game.map.G.hexSize;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) { const a = Math.PI / 180 * (60 * i + 30); const x = c.x + sz * Math.cos(a), y = c.y + sz * Math.sin(a); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }

// ===== 対局終了後のレポートと移動の概略 =====
function reportArrows(turn) {
  const groups = new Map();
  const moves = game.turnReports?.[turn]?.moves;
  if (!Array.isArray(moves)) return [];
  for (const move of moves) {
    const { area, from, to } = move || {};
    if (!game.map.playable.has(from) || !game.map.playable.has(to)) continue;
    const a = game.map.center(from), b = game.map.center(to);
    const dx = b.x - a.x, dy = b.y - a.y;
    // 同じ初期配置の部隊を、大まかに同じ方向へ進んだ駒ごとにまとめる。
    const direction = Math.abs(dx) >= Math.abs(dy) ? (dx >= 0 ? 'e' : 'w') : (dy >= 0 ? 's' : 'n');
    const key = area + direction;
    if (!groups.has(key)) groups.set(key, { from: { x: 0, y: 0 }, to: { x: 0, y: 0 }, count: 0 });
    const group = groups.get(key);
    group.from.x += a.x; group.from.y += a.y;
    group.to.x += b.x; group.to.y += b.y;
    group.count++;
  }
  return [...groups.values()].map(({ from, to, count }) => [from, to].map(p => ({ x: p.x / count, y: p.y / count })));
}
function updateReportControls() {
  const controls = document.getElementById('reportControls');
  controls.hidden = game.phase !== 'over';
  document.getElementById('turnBtns').hidden = !controls.hidden;
  document.getElementById('jumpBtns').hidden = !controls.hidden;
  if (controls.hidden) return;

}
function showReportMap(turn) {
  if (game?.phase !== 'over') return;
  if (turn == null) {
    turn = ui.reportTurn ?? game.turn;
    if (ui.reportTurn == null) while (turn > 1 && !game.turnReports?.[turn]?.moves?.length) turn--;
  }
  ui.reportTurn = turn;
  document.getElementById('modal').style.display = 'none';
  const points = reportArrows(turn).flat();
  if (points.length) {
    const xs = points.map(p => p.x), ys = points.map(p => p.y);
    const left = Math.min(...xs), right = Math.max(...xs), top = Math.min(...ys), bottom = Math.max(...ys);
    const wrap = document.getElementById('mapWrap');
    if (wrap.clientWidth && wrap.clientHeight) {
      const fit = Math.min(wrap.clientWidth / (right - left + 160), wrap.clientHeight / (bottom - top + 160));
      zoom = Math.min(zoom, Math.max(0.1, Math.floor(fit * 100) / 100));
      applyZoom();
    }
    scrollToMapPoint({ x: (left + right) / 2, y: (top + bottom) / 2 });
  }
  render();
}
function showEnd() {
  if (game?.phase !== 'over') return;
  const score = game.scores();
  const captures = new Map();
  for (const entry of game.log) {
    const match = entry.kind === 'control' && /^(ドイツ|ソ連)が(大都市|都市)（(\d{4})）を支配$/.exec(entry.text);
    if (!match) continue;
    if (!captures.has(entry.turn)) captures.set(entry.turn, []);
    captures.get(entry.turn).push(`${match[2]}（${match[3]}）　${match[1]}軍が占領`);
  }
  const rows = [];
  let missingScores = false;
  for (let turn = 1; turn <= game.turn; turn++) {
    const record = game.turnReports?.[turn];
    const tally = turn === game.turn ? score : record?.score;
    const recorded = Number.isFinite(tally?.ger) && Number.isFinite(tally?.sov);
    if (!recorded) missingScores = true;
    const cityText = captures.get(turn)?.join('<br>') || '支配の変化なし';
    const mapButton = record?.moves?.length ? `<button type="button" onclick="showReportMap(${turn})">地図を見る</button>` : '';
    rows.push(`<tr><th scope="row">${turn}</th><td class="score">${recorded ? tally.ger : '—'}</td><td class="score">${recorded ? tally.sov : '—'}</td><td>${cityText}</td><td>${mapButton}</td></tr>`);
  }
  const box = document.getElementById('modalBox');
  box.innerHTML = `<section class="game-report">
    <h2>対局レポート</h2>
    <p class="outcome">${winnerText()}</p>

    <h3>ターン終了時の得点と都市の占領</h3>
    <table class="report-table"><thead><tr><th scope="col">ターン</th><th scope="col">ドイツ</th><th scope="col">ソ連</th><th scope="col">大都市・都市</th><th scope="col">移動</th></tr></thead>
    <tbody>${rows.join('')}</tbody></table>
    ${missingScores ? '<p class="report-note">— はそのターンの得点記録がありません。</p>' : ''}
    <button type="button" onclick="showReportMap()">地図を見る</button>
    ${isDokusoOnline() ? '' : '<button type="button" onclick="showStart()">もう一度</button>'}
    </section>`;
  document.getElementById('modal').style.display = 'flex';
  box.scrollTop = 0;
}

// ===== 移動の選択 =====
// 動かす駒（まとめて動かせない組み合わせは除く）
function moveUnits() {
  const list = ui.moveSel.map(id => game.unit(id)).filter(u => u && game.canMove(u));
  if (list.length <= 1) return list;
  const mates = game.stackMates(list[0]);
  return [list[0], ...list.slice(1).filter(v => mates.includes(v))];
}
// 選んでいる自分の駒（止まっている駒も含む。オーバーランは敵に隣接して止まった駒で行うため）
function selUnits() { const side = game.activeSide(); return ui.moveSel.map(id => game.unit(id)).filter(u => u && u.alive && u.side === side && u.hex); }
function overrunUnit() { const s = selUnits(); return s.find(u => game.overrunTargets(u).length) || null; }
// ヘクスを選んだ時の初めの「動かす駒」: 先頭の駒と、いっしょに動ける駒を全部。動ける駒がなければ、オーバーランできる駒
function defaultMoveSel(h, side) {
  const mine = game.unitsAt(h).filter(v => v.side === side && game.canMove(v));
  if (!mine.length) { const o = game.unitsAt(h).find(v => v.side === side && game.overrunTargets(v).length); return o ? [o.id] : []; }
  return [mine[0], ...game.stackMates(mine[0])].map(u => u.id);
}
function doOverrun(u, h) { if (isDokusoOnline()) { void dokusoOnlineSend('overrun', [u.id, h]); return; } game.overrun(u, h); ui.msg = ''; render(); }

// ===== 戦闘後前進（人間）: 移動と同じく地図で操作する =====
function advanceSnapshot(game) {
  const advance = game.pending.advance;
  return {
    origin: advance.units.map(id => [id, game.unit(id).hex]),
    control: { ...game.control },
    holdOrders: game.combatSide() === 'ger' ? game.holdOrders() : undefined,
    done: advance.done && { ...advance.done },
    logLen: game.log.length,
    paths: new Map(),
  };
}

function openAdvance(review) {
  const advance = game.pending.advance;
  ui.mode = 'advance';
  ui.msg = '';
  ui.adv = { sel: [], review, ...advanceSnapshot(game) };
  if (review) {
    ui.adv.plan = AI.chooseAdvance(game);
    restoreAdvance(true);
    return;
  }
  selectAdvanceGroup();
  ui.hex = advance.hex;
  render();
  scrollToHex(advance.hex);
}

function selectAdvanceGroup() {
  const byHex = {};
  for (const u of advEligible()) (byHex[u.hex] = byHex[u.hex] || []).push(u);
  const best = Object.values(byHex).sort((a, b) => b.reduce((n, u) => n + u.str, 0) - a.reduce((n, u) => n + u.str, 0))[0];
  ui.adv.sel = best ? best.map(u => u.id) : [];
}

function previewAdvanceStep(id, hex) {
  const unit = game.unit(id);
  const from = unit.hex;
  if (!game.advanceStep(id, hex)) return false;
  const path = ui.adv.paths.get(id) || [from];
  path.push(hex);
  ui.adv.paths.set(id, path);
  return true;
}

function restoreAdvance(usePlan) {
  const a = ui.adv;
  if (!a?.paths || !game.pending?.advance) return;
  for (const [id, hex] of a.origin) {
    if (a.paths.has(id)) game.unit(id).hex = hex;
  }
  game.control = { ...a.control };
  game.restoreHoldOrders(a.holdOrders);
  game.pending.advance.done = a.done && { ...a.done };
  game.log.length = a.logLen;
  a.paths.clear();
  renderLog();
  const hex = game.pending.advance.hex;
  if (usePlan) for (const move of a.plan) {
    if (previewAdvanceStep(move.unit, hex) && move.extra) previewAdvanceStep(move.unit, move.extra);
  }
  selectAdvanceGroup();
  ui.hex = hex;
  ui.fanHex = null;
  render();
  scrollToHex(hex);
}

// 前進できる駒（攻撃した駒で、まだ進める駒）
function advEligible() {
  const p = game.pending;
  if (!p || !p.advance) return [];
  return p.advance.units.map(id => game.unit(id)).filter(u => u.alive && game.advanceTargets(u.id).length);
}
// 選んでいる駒が次に入れるヘクス（1歩目は相手のいたヘクス、2歩目は移動力8以上の駒だけ隣の1ヘクス）
function advExtraHexes() {
  const a = ui.adv; if (!a) return [];
  const set = new Set();
  for (const id of a.sel) for (const h of game.advanceTargets(id)) set.add(h);
  return [...set];
}
function advancePanel() {
  const a = ui.adv;
  const sel = a.sel.map(id => game.unit(id)).filter(Boolean);
  if (a.review) {
    const proposed = a.paths.size ? [...a.paths].map(([id, path]) => `${game.unitName(game.unit(id))}（${path.join(' → ')}）`).join('、') : '前進なし';
    step(`<b>ソ連軍AIの戦闘後前進を確認</b><br>現在の案: ${proposed}<br>変更する場合は上の「戦闘後前進をやり直す」で駒を元に戻し、盤面で前進を選び直せます。「前進を確定」で続行します。`, 'big');
  }
  step(`<b>戦闘後前進</b><br>前進させる駒をクリック（重なりはまとめて、Shift＋クリックで1個ずつ）→ 緑のヘクスをクリック。<br>1歩目は敵のいたヘクス（緑の太枠）。移動力8以上の駒は続けてもう1ヘクス進めます。`, 'big');
  add(`<div class="group-h">選んでいる駒: ${sel.length ? sel.map(u => game.unitName(u)).join('、') : 'なし'}</div>`);

}
function advanceSelectAt(u, single) {
  const elig = advEligible();
  if (!elig.includes(u)) return false;
  ui.adv.sel = single ? [u.id] : elig.filter(v => v.hex === u.hex).map(v => v.id);
  return true;
}
function advanceClick(h) {
  if (isDokusoOnline() && advExtraHexes().includes(h)) { void dokusoOnlineSend('advanceGroup', [ui.adv.sel.slice(), h]); return; }
  const a = ui.adv;
  const targets = advExtraHexes();
  if (targets.includes(h)) {
    // 選んでいる駒のうち、そのヘクスへ入れる駒をまとめて進める（1ヘクス2個まで）
    for (const id of a.sel.slice()) previewAdvanceStep(id, h);
    ui.hex = h;
    // 進んだ駒がまだ進めるなら、そのまま選んでおく
    a.sel = a.sel.filter(id => game.advanceTargets(id).length);
    const left = advEligible();
    if (!a.sel.length && left.length) { const nx = left.filter(v => v.hex === left[0].hex); a.sel = nx.map(v => v.id); }
    render(); return;
  }
  // 前進できる駒のいるヘクスをクリック → その駒をまとめて選ぶ
  const here = advEligible().filter(v => v.hex === h);
  if (here.length) a.sel = here.map(v => v.id);
  ui.hex = h; render();
}
function finishAdvance() {
  if (isDokusoOnline()) { void dokusoOnlineSend('endAdvance'); return; }
  game.endAdvance();
  ui.mode = null; ui.adv = null; ui.fanHex = null;
  render(); later(stepResolve, 200);
}

// ===== クリック =====
// ふつうのクリック: 重なった駒をまとめて（スタックのまま）
// Shift＋クリック: 重なりを左右に開く。開いた駒をクリックすると、その1個だけを選ぶ
function onUnitClick(u, inTray, shift) {
  if (isDokusoOnline() && !dokusoOnlineMyTurn()) { ui.hex = u.hex; render(); return; }
  if (inTray) { if (canEditSetup()) selectSetupUnit(u); return; }
  if (ui.holdPick) { onHexClick(u.hex, u); return; }
  if (!isDokusoOnline() && game.phase === 'setup_ger' && u.side === 'sov') {
    ui.hex = u.hex;
    ui.msg = '';
    render();
    return;
  }
  const stackN = game.unitsAt(u.hex).length;
  if (shift && stackN > 1 && ui.fanHex !== u.hex) { ui.fanHex = u.hex; ui.hex = u.hex; render(); return; }
  const single = ui.fanHex === u.hex && stackN > 1;
  if (canEditSetup() && u.side === game.activeSide() && !ui.stackKey) {
    const selected = game.unit(ui.setupSel);
    if (!shift && !single && selected && selected.hex !== u.hex && game.canPlace(selected, u.hex)) {
      onHexClick(u.hex, u);
    } else {
      selectSetupUnit(u);
    }
    return;
  }
  if (ui.mode === 'advance') {
    if (advanceSelectAt(u, single)) { ui.hex = u.hex; render(); return; }
    advanceClick(u.hex); return;
  }
  const side = game.activeSide();
  const human = side && ctrl[side] === 'human';
  if (reviewingSovietMove() && !ui.moveEdit && u.side === side) {
    ui.hex = u.hex;
    ui.moveSel = [u.id];
    ui.msg = '';
    render();
    return;
  }
  if (single && human && !ui.mode && u.side === side) {
    if (game.phase === side + '_move') {
      // 開いた駒の1個だけを動かす駒にする（敵に隣接して止まった駒はオーバーラン用に選ぶ）
      if (game.canMove(u) || game.overrunTargets(u).length) { ui.moveSel = [u.id]; ui.fanHex = null; ui.msg = ''; }
      else ui.msg = 'この駒はもう動けません。';
      ui.hex = u.hex; render(); return;
    }
    if (game.phase === side + '_combat' && !game.combatQueue) {
      if (game.usedAttackers().has(u.id)) { ui.msg = 'この駒はもう攻撃が宣言されています（宣言を取り消せば選び直せます）。'; ui.hex = u.hex; render(); return; }
      ui.msg = '';
      ui.pick = ui.pick.includes(u.id) ? ui.pick.filter(x => x !== u.id) : [...ui.pick, u.id];
      ui.hex = u.hex; render(); return;
    }
  }
  if (shift && human && !ui.mode && game.phase === side + '_move' && u.side === side) {
    ui.moveSel = defaultMoveSel(u.hex, side); ui.hex = u.hex; ui.msg = ''; render(); return;
  }
  onHexClick(u.hex, u);
}
function declarableHexes() {
  const side = game.activeSide();
  const enemy = [...new Set(game.onMap(game.enemyOf(side)).map(u => u.hex))];
  return enemy.filter(h => game.canDeclare(ui.pick, h));
}
function inspectedGermanUnit() {
  if (ui.mode || ui.moveEdit || !['sov_move', 'sov_combat'].includes(game.phase)) return null;
  const u = game.unit(ui.germanPreview);
  return u?.alive && u.hex === ui.hex ? u : null;
}
function cancelHoldPick() {
  ui.holdPick = null;
  ui.msg = '';
  render();
}
function confirmHoldPick() {
  const pick = ui.holdPick;
  if (!pick?.target) return;
  const unit = game.unit(pick.unit);
  if (!game.setHoldTarget(unit, pick.target)) {
    onHexClick(pick.target);
    return;
  }
  ui.hex = unit.hex;
  cancelHoldPick();
}
function onHexClick(h, clickedUnit) {
  if (isDokusoOnline() && !dokusoOnlineMyTurn()) { ui.hex = h; render(); return; }
  const ph = game.phase, side = game.activeSide(), human = side && ctrl[side] === 'human';
  if (ui.holdPick) {
    const valid = game.canSetHoldTarget(game.unit(ui.holdPick.unit), h);
    ui.holdPick.target = valid ? h : null;
    ui.msg = valid ? '' : '通行できる、ドイツ軍のいないソ連側のヘクスを選んでください。';
    render();
    return;
  }
  ui.germanPreview = clickedUnit?.side === 'ger' ? clickedUnit.id : null;
  if (ui.fanHex && ui.fanHex !== h) ui.fanHex = null;
  if (ui.mode === 'retreat') {
    if (game.retreatOptions(ui.retreatUnit).includes(h)) {
      if (isDokusoOnline()) { void dokusoOnlineSend('applyRetreat', [ui.retreatUnit, h]); return; }
      game.applyRetreat(ui.retreatUnit, h); ui.mode = null; ui.retreatUnit = null; ui.hex = h; render(); later(stepResolve, 150); }
    else { ui.hex = h; render(); }
    return;
  }
  if (ui.mode === 'advance') { advanceClick(h); return; }
  if (!human && !reviewingSovietMove() && !canEditSetup()) { ui.hex = h; render(); return; }
  ui.msg = '';
  if (reviewingSovietMove()) {
    if (ui.moveEdit) {
      const unit = game.unit(ui.moveEdit.id);
      if (game.revisionTargets(unit).has(h)) ui.moveEdit.target = h;
    } else {
      const u = clickedUnit?.side === side ? clickedUnit : game.unitsAt(h).find(v => v.side === side);
      ui.moveSel = u ? [u.id] : [];
    }
    ui.hex = h;
    render();
    return;
  }
  if (ph.startsWith('setup')) {
    if (ui.setupSel) {
      const u = game.unit(ui.setupSel);
      if (isDokusoOnline()) {
        if (game.canPlace(u, h)) void dokusoOnlineSend('place', [u.id, h]);
        return;
      }
      if (game.place(u, h)) {
        const next = game.setupUnits(side).find(v => !v.hex && v.area === u.area);
        ui.setupSel = next ? next.id : null;
        ui.fanHex = null;
      } else ui.msg = 'そのヘクスには置けません（水色のヘクスに置いてください。1ヘクス2個まで）。';
    }
    ui.hex = h; render(); return;
  }
  if (ph.endsWith('_move')) {
    const mv = moveUnits();
    const ou = side === 'ger' ? overrunUnit() : null;
    if (ou && game.overrunTargets(ou).includes(h)) { doOverrun(ou, h); return; }
    const sameStack = mv.length && mv[0].hex === h;
    ui.stackKey = false;
    if (mv.length && !sameStack && game.reachableGroup(mv).has(h)) {
      if (isDokusoOnline()) { void dokusoOnlineSend('moveGroup', [mv.map(u => u.id), h]); return; }
      game.moveGroup(mv, h);
      ui.hex = h; ui.fanHex = null; render(); return;
    }
    ui.hex = h;
    const group = defaultMoveSel(h, side);
    const sameSelection = sameStack && mv.length === group.length && mv.every(u => group.includes(u.id));
    ui.moveSel = sameSelection ? [] : group;
    render(); return;
  }
  if (ph.endsWith('_combat') && !game.combatQueue) {
    if (ui.pick.length && game.canDeclare(ui.pick, h)) {
      if (isDokusoOnline()) { void dokusoOnlineSend('declare', [ui.pick.slice(), h]); return; }
      game.declare(ui.pick, h); ui.pick = []; ui.hex = h; ui.fanHex = null; render(); return; }
    // 自分の駒のヘクス: そのヘクスのまだ使っていない駒をまとめて選ぶ／外す
    const used = game.usedAttackers();
    const mine = game.unitsAt(h).filter(v => v.side === side && !used.has(v.id)).map(v => v.id);
    if (mine.length) {
      const allIn = mine.every(id => ui.pick.includes(id));
      ui.pick = allIn ? ui.pick.filter(id => !mine.includes(id)) : [...new Set([...ui.pick, ...mine])];
    } else if (ui.pick.length && game.unitsAt(h).some(v => v.side !== side)) ui.msg = 'そのヘクスには攻撃できません（選んだ駒の全部が隣接していないか、もう宣言されています）。';
    ui.hex = h; render(); return;
  }
  ui.hex = h; render();
}

// ===== 記録 =====
function addLogLine(e) {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  d.className = e.kind;
  d.textContent = e.text;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}
function renderLog() { document.getElementById('log').innerHTML = ''; for (const e of game.log) addLogLine(e); }

if (mapImg.complete && mapImg.naturalWidth) setupBoard(); else mapImg.addEventListener('load', setupBoard);
showStart();

// Shift＋クリックで文字が範囲選択されて画面が青くなるのを防ぐ
document.addEventListener('mousedown', e => { if (e.shiftKey) e.preventDefault(); });
// Esc で駒の選択をやめる
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !game) return;
  if (ui.holdPick) { cancelHoldPick(); return; }
  if (inspectedGermanUnit()) { ui.germanPreview = null; render(); return; }
  if (ui.moveEdit) { cancelSovietMoveEdit(); return; }
  if (ui.moveSel.length || ui.pick.length || ui.fanHex) { ui.moveSel = []; ui.pick = []; ui.fanHex = null; ui.msg = ''; render(); }
});
// ブラウザの戻るを無効にする
if (location.protocol !== 'file:') {
  history.pushState({ dokuso: 1 }, '', location.href);
  window.addEventListener('popstate', () => { history.pushState({ dokuso: 1 }, '', location.href); });
}
window.addEventListener('beforeunload', e => { if (game && game.phase !== 'over') { e.preventDefault(); e.returnValue = ''; } });
</script>
