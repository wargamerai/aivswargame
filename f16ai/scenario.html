<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../nobrowserback.js"></script>
<script src="../nv_i18n.js"></script>
<script src="../nv_lang.js"></script>
<!-- アクセス解析（GoatCounter） -->
<script data-goatcounter="https://shigerusuzuki.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#caeaff">
    <title>シナリオ選択 - Air Combat Game</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #173650;
            --muted: #415d72;
            --line: #9dbdd4;
            --accent: #175c92;
            --accent-hover: #114772;
            --sky-panel: #e7f5ff;
            --cloud: #fcfeff;
            --red-ink: #852a3d;
            --red-panel: #fff1f1;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(44px, 8vw, 92px) 16px 40px;
            color: var(--ink);
            font: 15px/1.55 Inter, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
            background:
                radial-gradient(ellipse at 0% 32%, #ffffffdf 0%, transparent 43%),
                radial-gradient(ellipse at 95% 55%, #ffffffeb 0%, transparent 41%),
                linear-gradient(170deg, #a9daf8 0%, #dcf2ff 55%, #f5fbff 100%);
        }
        button, select { font: inherit; }
        :is(button, select, input):focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }
        #tabs, #card { width: 100%; max-width: 680px; }

        #tabs { display: flex; gap: 8px; }
        .tab-btn {
            flex: 1;
            padding: 12px 6px;
            font-weight: 700;
            color: var(--accent);
            background: #edf8ff;
            border: 1px solid var(--line);
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            cursor: pointer;
        }
        .tab-btn:hover { background: #d3edff; }
        .tab-btn.active {
            color: #fff;
            background: var(--accent);
            border-color: var(--accent);
        }
        .tab-btn.active:hover { background: var(--accent-hover); }

        #card {
            display: flex;
            flex-direction: column;
            gap: 17px;
            padding: clamp(16px, 4vw, 27px);
            background: var(--cloud);
            border: 1px solid var(--line);
            border-radius: 0 0 13px 13px;
            box-shadow: 0 16px 42px #275f8a21;
        }

        .scenario-info { font-size: 13px; line-height: 1.7; }
        .scenario-info h2 {
            margin: 0 0 10px;
            padding-bottom: 7px;
            border-bottom: 1px solid var(--line);
            font-size: clamp(20px, 4vw, 24px);
            line-height: 1.35;
        }
        .scenario-info p { margin: 0 0 3px; }
        .map-warning { color: #89511a; font-size: 12px; }
        .team-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 13px;
        }
        .team-box {
            padding: 11px 14px;
            border-radius: 7px;
            font-size: 13px;
            line-height: 1.6;
        }
        .team-blue { color: var(--ink); background: var(--sky-panel); border-left: 4px solid #3b80b8; }
        .team-red { color: var(--red-ink); background: var(--red-panel); border-left: 4px solid #bc5266; }

        hr { width: 100%; margin: 0; border: none; border-top: 1px solid var(--line); }
        .mode-section h3 { margin: 0 0 8px; font-size: 14px; }
        .mode-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .mode-label {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 10px 12px;
            background: var(--cloud);
            border: 1px solid var(--line);
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
        }
        label.mode-label:hover { border-color: var(--accent); }
        .mode-label:has(input:checked) {
            background: var(--sky-panel);
            border-color: var(--accent);
        }
        .mode-label input { margin: 3px 0 0; flex-shrink: 0; accent-color: var(--accent); }
        .mode-name { display: block; margin-bottom: 2px; font-weight: 700; }
        .mode-desc { color: var(--muted); font-size: 12px; line-height: 1.4; }
        .cfg-row { margin: 6px 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        #red-count-input, .cfg-select {
            padding: 4px 8px;
            color: var(--ink);
            background: var(--cloud);
            border: 1px solid var(--line);
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            max-width: 100%;
        }
        #red-count-input { color: var(--red-ink); border-color: #bc5266; font-weight: 700; }

        #start-btn {
            width: 100%;
            padding: 13px;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 700;
        }
        #start-btn:hover, #start-btn:active { background: var(--accent-hover); }
        #start-btn:disabled { color: var(--muted); background: #dce7ef; cursor: not-allowed; }

        #nvLangAsk { background: rgba(186, 220, 242, 0.84) !important; }
        #nvLangAsk > div {
            color: var(--ink) !important;
            background: var(--cloud) !important;
            border: 1px solid var(--line) !important;
            box-shadow: 0 18px 44px #275f8a2b;
        }
        #nvLangAsk button {
            color: var(--accent) !important;
            background: var(--sky-panel) !important;
            border-color: var(--line) !important;
        }
        #nvLangAsk button:hover, #nvLangAsk button:focus-visible, #nvLangAsk button:active {
            color: #fff !important;
            background: var(--accent) !important;
        }

        @media (max-width: 520px) {
            .team-row, .mode-grid { grid-template-columns: 1fr; }
            body { padding-inline: 12px; }
        }
    </style>
</head>
<body>
    <!-- タブ -->
    <div id="tabs">
        <button class="tab-btn" onclick="selectTab(0, this)">🇰🇷 朝鮮半島上空</button>
        <button class="tab-btn" onclick="selectTab(1, this)">🆓 フリーシナリオ</button>
    </div>

    <!-- メインカード -->
    <div id="card">
        <!-- シナリオ詳細 -->
        <div class="scenario-info" id="scenario-info"></div>

        <hr>

        <!-- モード選択（機体数入力を2番目の枠に組み込み） -->
        <div class="mode-section">
            <h3>🎮 プレイモード</h3>
            <div class="mode-grid">
                <label class="mode-label">
                    <input type="radio" name="playMode" value="BLUE" checked>
                    <span>
                        <span class="mode-name">🟦 米軍をプレイ</span>
                        <span class="mode-desc">自機で米軍を操作。ソ連軍はAIが行動。</span>
                    </span>
                </label>
                <!-- ソ連機体数入力（朝鮮半島シナリオ用） -->
                <div id="red-count-box" class="mode-label" style="cursor:default; align-items:center;">
                    <span style="font-size:18px;">🟥</span>
                    <span style="flex:1;">
                        <span class="mode-name" style="margin-bottom:6px; display:block;">ソ連軍（AI）機体数</span>
                        <span style="display:flex; align-items:center; gap:8px;">
                            <select id="red-count-input">
                                <option value="2">2機</option>
                                <option value="3">3機</option>
                                <option value="4">4機</option>
                                <option value="5">5機</option>
                            </select>
                            <span class="mode-desc">2〜5機</span>
                        </span>
                    </span>
                </div>
            </div>
        </div>

        <!-- スタートボタン -->
        <button id="start-btn" onclick="startGame()">▶ 出撃 (START)</button>
    </div>

    <script>
        const scenarios = [
            {
                name:            "朝鮮半島上空",
                map:             "30 × 30 ヘクス（固定）",
                mapMaxC:         29,
                mapMaxR:         29,
                fixedMap:        true,
                turns:           15,
                firstMove:       "ソ連軍",
                victory:         "撃墜: 3点 / 損害付与: 1点　得点多い方の勝ち",
                defaultRedCount: 2,
                blueForce:  "F-86 × 2機<br><small>初期高度: 10+1D6（友軍同高度）／ 機関砲10発（eチャート）</small>",
                redForce:   "MiG-15 × <span id='red-preview-0'>2</span>機（AI）<br><small>初期高度: 10+1D6（友軍同高度）／ 機関砲4発（fチャート）</small>"
            },
            {
                name:            "フリーシナリオ",
                map:             "54 × 28 ヘクス",
                mapMaxC:         27,
                mapMaxR:         53,
                fixedMap:        false,
                turns:           25,
                firstMove:       "ソ連軍",
                victory:         "撃墜: 3点 / 損害付与: 1点　得点多い方の勝ち",
                defaultRedCount: 3,
                blueForce:  "F-4 × 2機<br><small>初期高度: 25（固定）／ 機関砲3発(a), HSミサイル×4, RHミサイル×4</small>",
                redForce:   "MiG-21 × <span id='red-preview-1'>3</span>機（AI）<br><small>初期高度: 20（固定）／ 機関砲5発(b), HSミサイル×2</small>"
            }
        ];

        const AIRCRAFT_LIST = ['F-86','Mig-15','F-4','F-105','Mig-17','Mig-21','F-15','F-14','F16'];
        const GUN_RANKS = ['A','B','C','E','F','G'];
        const MISSILE_TYPES = ['米国初期','米国発達','ソ連','フランス'];

        function buildSideConfig(prefix, def) {
            function sel(id, options, selected) {
                return '<select id="'+id+'" class="cfg-select">' + options.map(function(o) {
                    return '<option value="'+o+'"'+(o==selected?' selected':'')+'>'+o+'</option>';
                }).join('') + '</select>';
            }
            function num(id, selected) {
                let h = '<select id="'+id+'" class="cfg-select">';
                for (let i = 0; i <= 10; i++) h += '<option value="'+i+'"'+(i==selected?' selected':'')+'>'+i+'</option>';
                return h + '</select>';
            }
            return '<div class="cfg-row">機体: '+sel(prefix+'-aircraft', AIRCRAFT_LIST, def.aircraft)+'</div>'
                + '<div class="cfg-row">機体数: '+num(prefix+'-count', def.count)+'</div>'
                + '<div class="cfg-row">機関砲: '+sel(prefix+'-gun-rank', GUN_RANKS, def.gunRank)+' × '+num(prefix+'-gun-ammo', def.gunAmmo)+'発</div>'
                + '<div class="cfg-row">ミサイル: '+sel(prefix+'-missile-type', MISSILE_TYPES, def.missileType)+'</div>'
                + '<div class="cfg-row">HS: '+num(prefix+'-hs', def.hs)+'　RH: '+num(prefix+'-rh', def.rh)+'</div>';
        }

        let currentIndex = 0;

        function selectTab(index, btn) {
            currentIndex = index;
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                const active = i === index;
                b.classList.toggle('active', active);
                b.setAttribute('aria-pressed', String(active));
            });

            const sc = scenarios[index];
            const rcBox = document.getElementById('red-count-box');

            if (index === 1) {
                // フリーシナリオ：カスタム設定UI
                rcBox.style.display = 'none';
                document.getElementById('scenario-info').innerHTML =
                    '<h2>'+sc.name+'</h2>'
                    + '<p><strong>マップ:</strong> '+sc.map+'</p>'
                    + '<p><strong>制限ターン:</strong> '+sc.turns+'ターン　（先行: '+sc.firstMove+'）</p>'
                    + '<p><strong>勝利条件:</strong> '+sc.victory+'</p>'
                    + '<div class="team-row">'
                    + '<div class="team-box team-blue"><strong>【米軍 🟦】</strong>'
                    + buildSideConfig('blue', {aircraft:'F-4', count:2, gunRank:'A', gunAmmo:3, missileType:'米国初期', hs:4, rh:4})
                    + '</div>'
                    + '<div class="team-box team-red"><strong>【ソ連軍 🟥】</strong>'
                    + buildSideConfig('red', {aircraft:'Mig-21', count:3, gunRank:'B', gunAmmo:5, missileType:'ソ連', hs:2, rh:0})
                    + '</div></div>';
            } else {
                rcBox.style.display = '';
                document.getElementById('scenario-info').innerHTML = `
                    <h2>${sc.name}</h2>
                    <p><strong>マップ:</strong> ${sc.map}${sc.fixedMap ? '　<span class="map-warning">⚠ マップ外に出た機体は除去</span>' : ''}</p>
                    <p><strong>制限ターン:</strong> ${sc.turns}ターン　（先行: ${sc.firstMove}）</p>
                    <p><strong>勝利条件:</strong> ${sc.victory}</p>
                    <div class="team-row">
                        <div class="team-box team-blue"><strong>【米軍 🟦】</strong><br>${sc.blueForce}</div>
                        <div class="team-box team-red"><strong>【ソ連軍 🟥】</strong><br>${sc.redForce}</div>
                    </div>
                `;
                document.getElementById('red-count-input').value = String(sc.defaultRedCount);
            }
        }

        // 機体数変更 → 赤プレビュー更新（朝鮮半島シナリオ用）
        document.getElementById('red-count-input').addEventListener('change', function() {
            const el = document.getElementById(`red-preview-${currentIndex}`);
            if (el) el.textContent = this.value;
        });

        function startGame() {
            const sc = scenarios[currentIndex];
            const mode = document.querySelector('input[name="playMode"]:checked').value;

            let config = {
                scenario: sc.name,
                mode:     mode,
                mapMaxC:  sc.mapMaxC,
                mapMaxR:  sc.mapMaxR,
                fixedMap: sc.fixedMap
            };

            if (currentIndex === 1) {
                // フリーシナリオ：カスタム設定
                config.blueConfig = {
                    aircraft:    document.getElementById('blue-aircraft').value,
                    count:       parseInt(document.getElementById('blue-count').value),
                    gunRank:     document.getElementById('blue-gun-rank').value,
                    gunAmmo:     parseInt(document.getElementById('blue-gun-ammo').value),
                    missileType: document.getElementById('blue-missile-type').value,
                    hsCount:     parseInt(document.getElementById('blue-hs').value),
                    rhCount:     parseInt(document.getElementById('blue-rh').value)
                };
                config.redConfig = {
                    aircraft:    document.getElementById('red-aircraft').value,
                    count:       parseInt(document.getElementById('red-count').value),
                    gunRank:     document.getElementById('red-gun-rank').value,
                    gunAmmo:     parseInt(document.getElementById('red-gun-ammo').value),
                    missileType: document.getElementById('red-missile-type').value,
                    hsCount:     parseInt(document.getElementById('red-hs').value),
                    rhCount:     parseInt(document.getElementById('red-rh').value)
                };
            } else {
                let redCount = parseInt(document.getElementById('red-count-input').value) || sc.defaultRedCount;
                if (redCount < 2) redCount = 2;
                if (redCount > 5) redCount = 5;
                config.redCount = redCount;
            }

            sessionStorage.setItem('airCombatConfig', JSON.stringify(config));
            window.location.href = 'index.html';
        }

        // 初期表示：最初のタブを選択
        selectTab(0, document.querySelectorAll('.tab-btn')[0]);
    </script>
</body>
</html>
