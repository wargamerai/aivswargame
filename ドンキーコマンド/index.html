<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドンキーコマンド</title>
<!-- アクセス解析（GoatCounter） -->
<script data-goatcounter="https://shigerusuzuki.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
  :root { --bg:#16181a; --panel:#24272a; --line:#454a4f; --txt:#e6e6e0; --dim:#9aa0a0; --acc:#ffd98a; --btn:#34506e; --btnh:#45688e; --red:#e66; --grn:#7c7; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--txt);
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; font-size: 14px; line-height: 1.4; }
  h1 { font-size: 28px; color: var(--acc); margin: 0 0 4px; }
  h2 { font-size: 16px; color: var(--acc); margin: 0 0 6px; }
  h3 { font-size: 14px; color: var(--acc); margin: 0 0 4px; }
  button { font: inherit; padding: 4px 10px; color: #fff; background: var(--btn); border: 1px solid #6a8cb0; border-radius: 3px; cursor: pointer; margin: 2px; }
  button:hover:not(:disabled) { background: var(--btnh); }
  button:disabled { background: #33363a; color: #777; border-color: #444; cursor: not-allowed; }
  button.big { font-size: 16px; padding: 8px 18px; }
  button.warn { background: #7a3b3b; border-color: #b77; }
  button.go { background: #356a3b; border-color: #7b7; }
  button.on { background: #a8863a; border-color: #ffd98a; color: #000; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid var(--line); padding: 2px 6px; text-align: left; }
  th { background: #30343a; font-weight: normal; }
  a { color: #9cf; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; }
  .dim { color: var(--dim); font-size: 12px; }
  .err { color: var(--red); }
  .good { color: var(--grn); }
  .hide { display: none !important; }

  #setup { max-width: 860px; margin: 0 auto; padding: 16px; }
  #setupHead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .eqRow { display: grid; grid-template-columns: minmax(0, 250px) auto; justify-content: start; align-items: center; gap: 12px; padding: 3px 8px; border-left: 4px solid transparent; }
  .eqRow:nth-child(even) { background: rgba(255,255,255,.04); }
  .eqRow.gGun { border-left-color: #e08a5a; background: rgba(224,138,90,.10); }
  .eqRow.gSmall { border-left-color: #6fb3e0; background: rgba(111,179,224,.10); }
  .eqRow.gPack { border-left-color: #8fc97a; background: rgba(143,201,122,.10); }
  .num { display: inline-block; min-width: 22px; text-align: center; }
  .eqCtl button { padding: 0 8px; margin: 0 1px; }

  /* 地図は左、コマンドは右 */
  #game { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100%; }
  #mapSide { min-width: 0; display: flex; flex-direction: column; padding: 8px; }
  #mapWrap { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--line); background: #0d0e0f; }
  #mapTools { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 8px; flex-wrap: wrap; }
  #cmdSide { overflow-y: auto; padding: 8px; border-left: 1px solid var(--line); }
  #pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; max-width: 240px; margin: 0 auto; }
  #pad button { margin: 0; padding: 8px 0; }
  #msgs div { padding: 1px 0; border-bottom: 1px dotted #33383c; }
  .stat td, .stat th { font-size: 13px; }

  /* 戦闘は別窓 */
  #combat, #dialog { position: fixed; z-index: 20; background: #1f2226; border: 2px solid var(--acc); border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,.8);
    width: min(620px, calc(100vw - 16px)); max-height: calc(100vh - 16px); overflow: auto; left: 50%; top: 40px; transform: translateX(-50%); }
  .winHead { display: flex; justify-content: space-between; align-items: center; background: #3a3320; padding: 4px 10px; cursor: move; user-select: none; font-weight: bold; color: var(--acc); position: sticky; top: 0; }
  .winBody { padding: 8px 10px; }
  #cbCells { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 84px; gap: 3px; max-width: 480px; margin: 0 auto 8px; }
  .cbCell { background: #2a2e33; border: 1px solid var(--line); border-radius: 3px; text-align: center; font-size: 12px; padding: 2px; }
  .cbCell.has { background: #4a2b2b; border-color: var(--red); }
  .cbCell.me { background: #2d3b2d; }
  .cbCell.pick { outline: 2px solid var(--acc); cursor: pointer; }
  .cbCell b { display: block; font-size: 20px; color: #fff; line-height: 1.1; }
  .cbCell.has b { color: #ff8a8a; }
  .sil { display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; line-height: 0; }
  .sil svg { fill: #ff6b6b; }
  #cbActs button { min-width: 134px; text-align: left; }
  #cbMsgs { background: #111; border: 1px solid var(--line); padding: 4px 6px; height: 112px; overflow-y: auto; font-size: 13px; margin-top: 6px; }
  #ap { color: var(--acc); font-size: 18px; font-weight: bold; }
  @media (max-width: 800px) {
    #game { grid-template-columns: 1fr; height: auto; }
    #mapWrap { height: 60vh; }
    #cmdSide { border-left: none; }
  }
</style>
</head>
<body>

<div id="setup">
  <div id="setupHead">
    <div><h1 id="sTitle"></h1><div class="dim" id="sSub"></div></div>
    <div>
      <button id="lang_ja">日本語</button><button id="lang_en">English</button>
      <button id="btnRules1"></button>
      <a id="toTop" href="../index1.html"></a>
    </div>
  </div>
  <div class="panel"><h2 id="h0"></h2><div id="diffBtns"></div><div class="dim" id="diffDesc" style="margin-top:4px"></div></div>
  <div class="panel"><h2 id="h1"></h2><button id="btnRoll" class="big"></button><div id="abil" style="margin-top:6px"></div></div>
  <div class="panel hide" id="pEquip"><h2 id="h2"></h2><div style="margin-bottom:6px"><button id="btnAuto" class="go"></button> <span class="dim" id="autoNote"></span></div><div id="eqInfo" style="margin-bottom:6px"></div><div id="eqList"></div>
    <div style="margin-top:8px"><span id="lMain"></span> <select id="mainSel" style="font:inherit"></select></div>
  </div>
  <div class="panel hide" id="pStart"><button id="btnStart" class="big go"></button> <span id="startErr" class="err"></span></div>
</div>

<div id="game" class="hide">
  <div id="mapSide">
    <div id="mapTools">
      <span id="turnLab"></span>
      <span><button id="btnZm">−</button><button id="btnZp">＋</button><button id="langBtn"></button><button id="btnRules2"></button></span>
    </div>
    <div id="mapWrap"><div id="map"></div></div>
    <div class="dim" id="legend" style="margin-top:4px"></div>
  </div>
  <div id="cmdSide">
    <div class="panel"><h3 id="hMove"></h3>
      <div id="pad">
        <span></span><button id="mvN"></button><span></span>
        <button id="mvW"></button><span style="text-align:center;line-height:36px">★</span><button id="mvE"></button>
        <span></span><button id="mvS"></button><span></span>
      </div>
    </div>
    <div class="panel"><h3 id="hPhase"></h3><div id="phaseText"></div><div id="adjust" style="margin-top:4px"></div></div>
    <div class="panel"><h3 id="hMsgs"></h3><div id="msgs"></div></div>
    <div class="panel"><h3 id="hStat"></h3><div id="stat"></div></div>
    <div class="panel"><h3 id="hEq"></h3><div id="eqNow"></div></div>
  </div>
</div>

<div id="combat" class="hide">
  <div class="winHead" id="cbHead"><span id="cbTitle"></span><span id="cbInfo"></span></div>
  <div class="winBody">
    <div id="cbCells"></div>
    <div><span id="apLab"></span> <span id="ap"></span> <span id="cbStat" class="dim"></span></div>
    <div id="cbPrompt" style="color:var(--acc);min-height:20px"></div>
    <div id="cbActs"></div>
    <div id="cbMsgs"></div>
  </div>
</div>

<div id="dialog" class="hide">
  <div class="winHead" id="dlgHead"><span id="dlgTitle"></span><button id="dlgClose"></button></div>
  <div class="winBody" id="dlgBody"></div>
</div>

<script src="i18n.js"></script>
<script src="game.js"></script>
</body>
</html>
