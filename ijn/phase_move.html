<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../nv_i18n.js"></script>
<script src="../nv_lang.js"></script>
<meta charset="UTF-8">
<style>
body { background:#f5f5fa; color:#222; font-family:monospace; padding:12px; font-size:1.05em; }
h3 { color:#1a5a8a; margin-bottom:10px; font-size:1.15em; }
#info { background:#e8f0e8; border:1px solid #8a8; padding:8px; margin:8px 0; min-height:52px; line-height:1.6; border-radius:3px; }
#moveBar { color:#8a6a00; font-size:1.05em; font-weight:bold; margin:5px 0; min-height:20px; }
#shipList { margin:8px 0; }
.ship-cards { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
.card {
  background:#e0e8f4; border:2px solid #99b; padding:5px 10px;
  border-radius:4px; cursor:pointer; font-size:0.95em; transition: all 0.15s;
}
.card:hover { background:#c8d8f0; border-color:#77a; }
.card.selected { border-color:#2a8a2a; background:#d0f0d0; font-weight:bold; }
.card.done { opacity:0.4; cursor:default; }
.card.disabled { opacity:0.3; cursor:default; pointer-events:none; }
.card .c-name { font-weight:bold; }
.card .c-info { color:#666; font-size:0.88em; }
.card.jp .c-name { color:#cc3311; }
.card.us .c-name { color:#2255cc; }
button {
  background:#dde4f0; color:#334; border:1px solid #99a;
  padding:6px 10px; font-size:0.92em; cursor:pointer; border-radius:3px; margin:4px 3px 4px 0; font-weight:bold;
}
button:hover { background:#c8d4ee; }
button:disabled { background:#e8e8e8; color:#999; cursor:default; }
#keyHint { color:#666; font-size:0.88em; margin-top:10px; line-height:1.8; }
.phase-label { color:#2a8a2a; font-size:0.95em; font-weight:bold; margin:5px 0; }
button.undo-btn { background:#f0d0c0; color:#aa4400; border-color:#cc8866; }
button.undo-btn:hover { background:#ffd8c0; }
</style>
</head>
<body>
<h3 id="phTitle">移動フェーズ</h3>

<div id="info">localStorageからデータ読み込み中...</div>
<div id="moveBar"></div>

<div id="jpAIBar" style="text-align:right;margin:4px 0;">
  <input type="checkbox" id="jpAI" hidden>
</div>
<div id="manualControls" style="display:none">
  <button onclick="doUndo()" class="undo-btn" id="btnUndo" disabled>◀ やり直し</button>
  <button onclick="resetAllMoves()" class="undo-btn" id="btnResetAll">◀◀ 全リセット</button>
  <button onclick="allStraight()" id="btnAllStraight">全艦直進 ▶</button>
  <button onclick="undoAllStraight()" id="btnUndoAll" style="display:none">◀ 全艦直進やり直し</button>
</div>

<div id="shipList"></div>

<button onclick="donePhase()" id="btnDone" style="display:none">次フェーズへ</button>

<div id="keyHint" style="display:none">
  テンキー操作:<br>
  7=左上 　　 9=右上<br>
  4=左　 5=直進 6=右<br>
  1=左下 　　 3=右下<br>
  Tab=次の艦
</div>

<script src="captain.js"></script>
<script src="fog.js"></script>
<script>
let state = null;
let jpFleet = [];
let usFleet = [];
let moving = null;    // 現在操作中の艦
let remainMove = 0;
let turnedThisHex = false;
let movedShips = new Set();  // 移動済み艦のインデックス（移動力消費完了）
let undoStack = [];
let phaseStartBackup = null;  // フェーズ開始時の全艦状態バックアップ
let shipStates = {};  // 艦名→{col, row, dir, remainMove, undoStack, turnedThisHex} 一時保存

const COLS = 46;
const JP_LINE_COL = 14;
const US_LINE_COL = COLS - 15; // 31
const JP_WITHDRAW_COL = 0;           // JPの離脱: 地図の端（ユーザーの指示 2026-11-03）
const US_WITHDRAW_COL = COLS - 1;    // USの離脱: 地図の端（ユーザーの指示 2026-11-03）

// ルール 12-2 (3): 自分から地図の外へ出る艦は、第6ターン以降に自軍側の端からなら離脱。それ以外は沈没扱い
//   自動離脱（損害で離脱中の艦）には当てない。ターンはスタートから数える（ユーザーの指示 2026-11-03）
function exitStatus(ship, col) {
  if (ship.withdrawing) return 'exited';
  const own = ship.side === 'jp' ? col <= JP_WITHDRAW_COL : col >= US_WITHDRAW_COL;
  if (own && (state.combatTurn || 1) >= 6) return 'exited';
  pdbg(`${ship.name} ${own ? '第6ターンより前の離脱' : '自軍側以外への離脱'} → 沈没扱い`);
  return 'sunk';
}

const DIR_NAMES = {6:'→東', 3:'↘南東', 1:'↙南西', 4:'←西', 7:'↗北西', 9:'↖北東'};

// 今の移動フェーズは先攻 or 後攻？
function isFirstMove() {
  return state.phase === 'move1' || state.phase === 'move'; // 旧名互換
}

// このフェーズで日本軍が動くか？
function isJPMoving() {
  const jpFirst = (state.initiative === 'jp');
  return isFirstMove() ? jpFirst : !jpFirst;
}

// デバッグ用
function dumpFleet(label, fleet) {
  console.log(`[FLEET] ${label}:`);
  fleet.forEach(s => {
    const flags = [];
    if (s.withdrawing) flags.push('離脱中');
    if (s.status === 'sunk') flags.push('沈没');
    if (getSpeed(s) === 0) flags.push('航行不能');
    if (s.cannotTurn) flags.push('回頭不能');
    if (s.cannotShoot) flags.push('射撃不能');
    const dmgInfo = `spd=${getSpeed(s)} rm=${s.remainMove||0} dmgG=${s.dmgG||0}/${s.capG||0} dmgM=${s.dmgM||0}/${s.capM||0}`;
    console.log(`  ${s.name}(${s.type}) pos=(${s.col},${s.row}) dir=${s.dir} ${dmgInfo} ${flags.join(' ')}`);
  });
}

// === 艦が移動可能か ===
function canShipMove(s) {
  if (s.status === 'sunk' || s.col < 0) return false;
  if (s.withdrawing) return false;
  if (getSpeed(s) === 0) return false;  // 航行不能
  return true;
}

// hubデバッグパネルへログ送信
function pdbg(text) {
  parent.postMessage({type:'DBG_LOG', text}, '*');
  console.log('[MOVE-DBG]', text);
}

// Load state
function init() {
  const raw = localStorage.getItem('hubState');
  if (!raw) { setInfo('hubStateが見つかりません'); return; }
  state = JSON.parse(raw);
  jpFleet = state.jpFleet || [];
  usFleet = state.usFleet || [];

  // シナリオ特別ルール: 敵発見後に速力制限解放（baseSpd→speed）
  if (state.jpFreeMove) {
    jpFleet.forEach(s => {
      if (s.baseSpd && s.speed < s.baseSpd && !aiEngineHit(s)) {
        pdbg(`速力解放: ${s.name} ${s.speed}→${s.baseSpd}`);
        s.speed = s.baseSpd;
      }
    });
  }

  // 移動パスをリセット＋回頭カウントリセット＋残り移動力初期化
  [...jpFleet, ...usFleet].forEach(s => {
    s.path = []; s.turnCount = 0;
    if (s.status !== 'sunk' && s.col >= 0) {
      const spd = getSpeed(s);
      s.remainMove = s.dmgM >= s.capM / 2 ? Math.max(1, Math.ceil(spd/2)) : spd;
    } else {
      s.remainMove = 0;
    }
  });

  console.log(`=== 移動フェーズ開始 (${state.phase}) ターン${state.combatTurn} ===`);
  dumpFleet('JP移動前', jpFleet);
  dumpFleet('US移動前', usFleet);
  console.log(`[IJN-MOVE] phase=${state.phase} jpMoving=${isJPMoving()} jpFreeMove=${state.jpFreeMove} usFreeMove=${state.usFreeMove} jpDetected=${state.jpDetected} usDetected=${state.usDetected} contactMade=${state.contactMade}`);

  // デバッグ: 移動フェーズ開始時の状態をhubに送信
  pdbg(`=== 移動フェーズ開始 turn=${state.combatTurn} phase=${state.phase} ===`);
  pdbg(`jpMoving=${isJPMoving()} initiative=${state.initiative}`);
  pdbg(`contactMade=${state.contactMade} jpDetected=${state.jpDetected} usDetected=${state.usDetected}`);
  pdbg(`jpFreeMove=${state.jpFreeMove} usFreeMove=${state.usFreeMove}`);
  pdbg(`jpAutoAI=${localStorage.getItem('jpAutoAI')} fullAutoAI=${localStorage.getItem('fullAutoAI')}`);
  jpFleet.forEach(s => {
    const spd = getSpeed(s);
    const crits = (s.crits||[]).join(',') || 'なし';
    const flags = [];
    if (s.isLead) flags.push('旗艦');
    if (s.cannotTurn) flags.push('回頭不能');
    if (s.withdrawing) flags.push('離脱中');
    if (spd === 0) flags.push('航行不能');
    pdbg(`  JP ${s.name}(${s.type}) status=${s.status} spd=${spd} canMove=${canShipMove(s)} crits=[${crits}] flags=[${flags.join(',')}]`);
  });

  // 大破艦等 自動離脱
  autoWithdrawHeavy();

  // AI委任チェックボックス状態復元
  const cb = document.getElementById('jpAI');
  if (cb) cb.checked = isJPAutoAI();

  const jpMoving = isJPMoving();
  let modeChosen = '';

  if (jpMoving && !state.jpFreeMove) {
    modeChosen = 'JP直進モード(jpFreeMove=false)';
    startStraightMode();
  } else if (!jpMoving && !state.usFreeMove) {
    modeChosen = 'US直進モード(usFreeMove=false)';
    startStraightMode();
  } else if (!jpMoving) {
    modeChosen = 'US自動移動';
    startAutoUSMove();
  } else {
    const isFullAuto = localStorage.getItem('fullAutoAI') === '1';
    if (isJPAutoAI() && (isFullAuto || (!state.contactMade && !state.jpFreeMove))) {
      modeChosen = `JP AI自動(jpAutoAI=1, fullAutoAI=${isFullAuto})`;
      autoJPMove();       // 観戦モード or 接触前: AI委任継続
    } else {
      // 接触後（通常対戦）はAI委任を解除して手動に戻す
      if (isJPAutoAI() && (state.contactMade || state.jpFreeMove)) {
        localStorage.setItem('jpAutoAI', '0');
        const cb = document.getElementById('jpAI');
        if (cb) cb.checked = false;
        setInfo('敵発見 — AI委任を解除しました');
        modeChosen = 'JP手動(AI委任自動解除)';
      } else {
        modeChosen = 'JP手動(自由移動)';
      }
      startFreeMode();      // IJN: 日本軍(プレイヤー)手動移動
    }
  }
  pdbg(`→ 選択モード: ${modeChosen}`);
}

function isJPAutoAI() { return localStorage.getItem('jpAutoAI') === '1'; }

function toggleJPAI() {
  const checked = document.getElementById('jpAI').checked;
  localStorage.setItem('jpAutoAI', checked ? '1' : '0');
  pdbg(`toggleJPAI: checked=${checked} btnDone.display=${document.getElementById('btnDone').style.display}`);
  if (checked && document.getElementById('btnDone').style.display !== 'none') {
    pdbg('→ AI委任ON → autoJPMove() 呼び出し');
    autoJPMove();
  }
}

// ========== 直進モード（接触前）==========
function startStraightMode() {
  const label = isFirstMove() ? '先攻' : '後攻';
  const jpMoving = isJPMoving();
  const side = jpMoving ? '日本軍' : '米軍';
  document.getElementById('phTitle').textContent = `${label}移動 — ${side}直進`;
  setInfo(`接触前 — ${side}直進中...`);
  document.getElementById('keyHint').style.display = 'none';
  document.getElementById('manualControls').style.display = 'none';
  document.getElementById('btnDone').style.display = 'none';

  if (jpMoving) {
    advanceJPFleet();  // JP: 旗艦が進み後続が追随
    // 自動直進した艦をmovedShipsに登録（接触時のdonePhase未移動チェック対策）
    jpFleet.forEach((s, i) => { if (canShipMove(s)) movedShips.add(i); });
  } else {
    autoAdvanceColumn(usFleet);     // US: 旗艦+随伴グループ移動
  }

  pushState();

  // 接触チェック（非対称: 視認=両軍、レーダー=米軍のみ）
  const visual = checkVisualSpotting();
  const radar = checkRadar();

  if (visual) {
    state.jpDetected = true;
    state.usDetected = true;
    state.jpFreeMove = true;
    state.usFreeMove = true;
    state.contactMade = true;
    pushState();
    setInfo('敵艦発見！ 両軍自由移動可能');
  } else if (radar) {
    if (!state.usDetected) {
      state.usDetected = true;
      state.usFreeMove = true;
      state.contactMade = true;
      pushState();
    }
    setInfo('レーダー探知！ 米軍自由移動可能');
  } else if (!visual && !radar) {
    checkLineReach();
    setInfo(`${side}直進完了 — 敵未発見`);
  }

  renderList();
  dumpFleet('JP移動後', jpFleet);

  setTimeout(() => donePhase(true), 1500);
}

// ========== 大破艦・射撃不能艦 自動離脱 ==========
function autoWithdrawHeavy() {
  // この移動ターンの該当側のみ離脱処理（JP移動ターンならJP艦のみ）
  const jpMoving = isJPMoving();
  const allShips = jpMoving ? jpFleet : usFleet;
  for (const ship of allShips) {
    if (ship.col < 0 || ship.status === 'sunk') continue;
    // 既に離脱中の艦は自動離脱条件に関係なく退却移動を続ける
    if (ship.withdrawing) {
      if (getSpeed(ship) > 0) withdrawMove(ship);
      continue;
    }
    // 自動離脱は損害で決まる（ターンは関係ない。ユーザーの指示 2026-11-03）: 中破以上、砲撃不能
    //   航行不能=その場で停止 / 回頭不能=直進のみ / 速力半減=手動のまま（どれも離脱しない）
    //   慎重=損害15%以上 / 普通=中破以上 / 攻撃的=大破のみ（captain.js）
    const shouldWithdraw = captainShouldWithdraw(ship); // 損害の基準は艦長の性格で変わる
    if (!shouldWithdraw) continue;
    // 離脱開始
    ship.withdrawing = true;
    ship.retreatDir = ship.side === 'jp' ? 4 : 6;  // JP=西, US=東
    const reason = ship.status === 'heavy' ? '大破' : ship.status === 'medium' ? '中破' : '砲撃不能';
    setInfo(`${ship.name} ${reason}！ 離脱開始`);
    if (getSpeed(ship) > 0) withdrawMove(ship);
  }
  pushState();
}

// 60°ずつ最短回頭で退却方向を向きながら移動
const DIR_CW = [6,3,1,4,7,9];
function turnStep(curDir, targetDir) {
  if (curDir === targetDir) return curDir;
  const ci = DIR_CW.indexOf(curDir);
  const ti = DIR_CW.indexOf(targetDir);
  const cwDist = (ti - ci + 6) % 6;
  const ccwDist = (ci - ti + 6) % 6;
  if (cwDist <= ccwDist) return DIR_CW[(ci + 1) % 6];
  return DIR_CW[(ci + 5) % 6];
}

// 退却方向の動的計算（敵から離れつつ退却方向寄り）
function getRetreatDir(ship) {
  var retreatBase = ship.side === 'jp' ? 4 : 6;  // JP=西, US=東
  var enemyFleet = ship.side === 'jp' ? usFleet : jpFleet;
  var alive = enemyFleet.filter(function(s) { return s.status !== 'sunk' && s.col >= 0; });
  if (alive.length === 0) return retreatBase;

  // 敵の重心
  var ec = 0, er = 0;
  alive.forEach(function(s) { ec += s.col; er += s.row; });
  ec = Math.round(ec / alive.length);
  er = Math.round(er / alive.length);

  // 6方向を評価: 敵から離れる距離 + 退却方向への寄与
  var cw = [6,3,1,4,7,9];
  var baseIdx = cw.indexOf(retreatBase);
  var bestDir = retreatBase, bestScore = -999;
  for (var i = 0; i < 6; i++) {
    var d = cw[i];
    var n = hexNeighbor(ship.col, ship.row, d);
    if (!n) continue;
    // 敵から離れるスコア
    var distNow = hexDist(ship.col, ship.row, ec, er);
    var distNext = hexDist(n.col, n.row, ec, er);
    var awayScore = distNext - distNow;  // 正=敵から遠ざかる
    // 退却方向に近いほどボーナス（基本方向=3, ±60°=2, ±120°=1, 反対=0）
    var dirDiff = Math.abs(i - baseIdx);
    if (dirDiff > 3) dirDiff = 6 - dirDiff;
    var dirBonus = 3 - dirDiff;
    var score = awayScore * 2 + dirBonus;
    if (score > bestScore) { bestScore = score; bestDir = d; }
  }
  return bestDir;
}

function withdrawMove(ship) {
  let spd = getSpeed(ship);
  if (ship.dmgM >= ship.capM / 2) spd = Math.max(1, Math.ceil(spd / 2));  // M損害半分以上なら半速
  let remain = spd;

  // 退却の針路は移動の最初に1度だけ決める（途中で気を変えない）
  var target = ship.cannotTurn ? ship.dir : getRetreatDir(ship);
  ship.retreatDir = target;
  while (remain > 0) {

    if (ship.dir !== target && !ship.cannotTurn) {
      ship.dir = turnStep(ship.dir, target);
      remain--;
      if (remain <= 0) break;
    }
    const next = hexNeighbor(ship.col, ship.row, ship.dir);
    if (!next) { ship.col = -1; break; }
    if (next.col < 0 || next.col >= COLS || next.row < 0) { ship.col = -1; break; }
    // 離脱ゾーンチェック
    const jpZone = ship.side === 'jp' && ship.col > JP_WITHDRAW_COL && next.col <= JP_WITHDRAW_COL;
    const usZone = ship.side === 'us' && ship.col < US_WITHDRAW_COL && next.col >= US_WITHDRAW_COL;
    if (jpZone || usZone) {
      ship.col = -1;
      pdbg(`${ship.name} 自動離脱で離脱ゾーン到達 → 退場`);
      break;
    }
    if (hexBlocked(ship, next.col, next.row)) {
      // ぶつかる前に避ける。避けられなければ止まる（ぶつからないのが最優先）
      if (avoidByTurn(ship)) { target = ship.dir; ship.retreatDir = target; continue; }
      break;
    }
    ship.col = next.col;
    ship.row = next.row;
    remain--;
  }
  if (ship.col < 0) {
    ship.status = 'exited';
    setInfo(`${ship.name} マップから離脱`);
  }
}

// ========== JP: 各艦個別に直進（接触前） ==========
// 接触前の日本軍の直進。旗艦操作なら列で進む。列に入っていない艦と損傷で追随できない艦だけ個別に進む
function advanceJPFleet() {
  if (!isFlagshipMode()) { autoAdvanceIndividual(jpFleet); return; }
  aiEnsureLeads(jpFleet);
  const hasLead = s => s.isLead || jpFleet.some(l => l.isLead && l.colIndex === s.colIndex && s.colIndex >= 0 && l.status !== 'sunk' && l.col >= 0 && !l.withdrawing);
  const alone = jpFleet.filter(s => !s.isLead && (!hasLead(s) || isShipCrippled(s)));
  autoAdvanceColumn(jpFleet);
  if (alone.length) autoAdvanceIndividual(alone);
}
function autoAdvanceIndividual(fleet) {
  const ships = fleet.filter(s => s.status !== 'sunk' && s.col >= 0 && !s.withdrawing && getSpeed(s) > 0);
  // 移動順: 同グループ内はリード艦→followOrder順、異グループ間は火力大→速力遅い順
  ships.sort((a, b) => {
    // 同グループ内: リード艦→followOrder順
    if (a.colIndex === b.colIndex) {
      if (a.isLead && !b.isLead) return -1;
      if (!a.isLead && b.isLead) return 1;
      return (a.followOrder||0) - (b.followOrder||0);
    }
    // 異グループ間: 火力大きい方が先
    const capA = (a.capG||0) - (a.dmgG||0);
    const capB = (b.capG||0) - (b.dmgG||0);
    if (capA !== capB) return capB - capA;
    // 火力同じなら速力遅い方が先
    const spdA = a.speed || 4;
    const spdB = b.speed || 4;
    if (spdA !== spdB) return spdA - spdB;
    return 0;
  });

  // 直進モード統一速力: OBBがいたら3、なければ4
  const hasOBB = ships.some(s => s.type === 'OBB');
  const fleetSpeed = hasOBB ? 3 : 4;

  for (const ship of ships) {
    const spd = Math.min(getSpeed(ship), fleetSpeed);  // 統一速力で上限
    const moveCount = ship.dmgM >= ship.capM / 2 ? Math.max(1, Math.ceil(spd/2)) : spd;
    const minSpd = Math.min(getMinSpeed(ship), fleetSpeed);
    const minCount = ship.dmgM >= ship.capM / 2 ? Math.max(1, Math.ceil(minSpd/2)) : minSpd;
    for (let step = 0; step < moveCount; step++) {
      const next = hexNeighbor(ship.col, ship.row, ship.dir);
      if (!next) break;
      if (next.col < 0 || next.col >= COLS || next.row < 0) break;
      // 衝突回避: 最低速度以上なら前方占有時に停止
      if (occupied(next.col, next.row, ship) || getSunkShip(next.col, next.row, ship)) break;  // ぶつかるくらいなら最低速度を破って止まる
      ship.col = next.col;
      ship.row = next.row;
      var occ = getOccupant(next.col, next.row, ship);
      if (occ) collisionCheck(ship, occ);
      var sunkAt = getSunkShip(next.col, next.row, ship);
      if (sunkAt) collisionCheck(ship, sunkAt);
    }
    ship.remainMove = 0;
  }
}

// ========== US: 旗艦+随伴のグループ移動（直進モード） ==========
function autoAdvanceColumn(fleet) {
  const preMove = fleet.map(s => ({ name: s.name, colIndex: s.colIndex, col: s.col, row: s.row }));
  const leads = fleet.filter(s => s.isLead && s.status !== 'sunk' && s.col >= 0 && !s.withdrawing);

  // 敵(JP)に近い艦(col小=左)から移動
  leads.sort((a, b) => a.col - b.col);

  // 直進モード統一速力: OBBがいたら3、なければ4
  const activeShips = fleet.filter(s => s.status !== 'sunk' && s.col >= 0 && !s.withdrawing);
  const hasOBB = activeShips.some(s => s.type === 'OBB');
  const fleetSpeed = hasOBB ? 3 : 4;

  for (const lead of leads) {
    const spd = Math.min(getSpeed(lead), fleetSpeed);  // 統一速力で上限
    const moveCount = lead.dmgM >= lead.capM / 2 ? Math.max(1, Math.ceil(spd/2)) : spd;
    const minSpd = Math.min(getMinSpeed(lead), fleetSpeed);
    const minCount = lead.dmgM >= lead.capM / 2 ? Math.max(1, Math.ceil(minSpd/2)) : minSpd;

    for (let step = 0; step < moveCount; step++) {
      const next = hexNeighbor(lead.col, lead.row, lead.dir);
      if (!next) break;
      if (next.col < 0 || next.col >= COLS || next.row < 0) break;
      // 衝突回避: 最低速度以上なら前方占有時に停止
      if (occupied(next.col, next.row, lead) || getSunkShip(next.col, next.row, lead)) break;  // ぶつかるくらいなら最低速度を破って止まる

      lead.path = lead.path || [];
      lead.path.push({col: lead.col, row: lead.row, dir: lead.dir});
      lead.col = next.col;
      lead.row = next.row;
      var occ = getOccupant(next.col, next.row, lead);
      if (occ) collisionCheck(lead, occ);
      var sunkAt = getSunkShip(next.col, next.row, lead);
      if (sunkAt) collisionCheck(lead, sunkAt);

      moveFollowers(lead, fleet);
    }
    // リード＋随伴の残り移動力を0に
    lead.remainMove = 0;
    const ci = lead.colIndex;
    fleet.filter(s => !s.isLead && s.colIndex === ci).forEach(f => f.remainMove = 0);
  }

  // 整合性チェック
  for (let i = 0; i < fleet.length; i++) {
    const s = fleet[i];
    const pre = preMove[i];
    if (s.colIndex !== pre.colIndex) {
      console.error(`[BUG] ${s.name} colIndex変化: ${pre.colIndex} → ${s.colIndex}`);
    }
  }
}

// 視認距離内に敵がいるか
function checkVisualSpotting() {
  const sr = state.spotRange || 0;
  if (sr <= 0) return false;
  for (const jp of jpFleet) {
    if (jp.status === 'sunk' || jp.col < 0) continue;
    for (const us of usFleet) {
      if (us.status === 'sunk' || us.col < 0) continue;
      if (hexDist(jp.col, jp.row, us.col, us.row) <= sr) return true;
    }
  }
  return false;
}

// レーダー探知（米軍用。距離はシナリオの設定。通常20、サボ島沖とルンガ沖は16）
function checkRadar() {
  for (const us of usFleet) {
    if (us.status === 'sunk' || us.col < 0 || !us.radar) continue;
    for (const jp of jpFleet) {
      if (jp.status === 'sunk' || jp.col < 0) continue;
      if (hexDist(jp.col, jp.row, us.col, us.row) <= AI_RADAR_RANGE) return true;
    }
  }
  return false;
}

function checkSpotting() { return checkVisualSpotting() || checkRadar(); }

function checkLineReach() {
  if (!state.jpFreeMove && jpFleet.some(s => s.status !== 'sunk' && s.col >= US_LINE_COL)) {
    state.jpFreeMove = true;
  }
  if (!state.usFreeMove && usFleet.some(s => s.status !== 'sunk' && s.col <= JP_LINE_COL)) {
    state.usFreeMove = true;
  }
}

// ========== 米軍自動移動 ==========
function startAutoUSMove() {
  const label = isFirstMove() ? '先攻' : '後攻';
  document.getElementById('phTitle').textContent = `${label}移動 — 米軍（自動）`;
  setInfo('米軍移動中...');
  document.getElementById('keyHint').style.display = 'none';
  document.getElementById('manualControls').style.display = 'none';
  document.getElementById('btnDone').style.display = 'none';

  if (state.contactMade || state.usFreeMove) {
    aiUSMoveAnimated();  // 戦術AI移動（段階表示）
  } else {
    autoAdvanceColumn(usFleet);  // 接触前は直進
    markSharedHex();
    pushState();
    renderList();
    setTimeout(() => donePhase(), 2000);
  }
}

// ===== 米軍戦術AI移動（段階表示版） =====
function aiUSMoveAnimated() {
  aiEnsureLeads(usFleet);
  const jpc = jpCenter();
  const jpDir = jpMainDir();
  const sr = state.spotRange || 6;
  // リード艦が損傷なら健全な随伴艦にリードを委譲
  for (const lead of usFleet.filter(s => s.isLead && s.status !== 'sunk' && s.col >= 0)) {
    if (isShipCrippled(lead)) {
      const replacement = usFleet.find(s => !s.isLead && s.colIndex === lead.colIndex && s.status !== 'sunk' && s.col >= 0 && !isShipCrippled(s));
      if (replacement) {
        lead.isLead = false;
        replacement.isLead = true;
        console.log(`US旗艦交代: ${lead.name} → ${replacement.name} (損傷のため)`);
      }
    }
  }
  const leads = aiPrepareLeads(usFleet, jpFleet);

  // 各リード艦を順番に移動し、間にpushStateで画面更新
  let idx = 0;
  function moveNext() {
    if (idx >= leads.length) {
      markSharedHex();
      pushState();
      renderList();
      setTimeout(() => donePhase(), 1500);
      return;
    }
    const lead = leads[idx];
    // 列ごとに挟み撃ちの方向を分ける（colIndex 0=主力側, 1=DD側=反対側）
    const flankSide = (lead.colIndex === 0) ? 1 : -1;
    aiMoveOneLead(lead, jpc, jpDir, sr, flankSide);
    pushState();  // 画面に反映
    idx++;
    setTimeout(moveNext, 600);  // 0.6秒後に次のリード艦
  }
  moveNext();
}

// 1隻のリード艦を移動する（aiUSMoveから抽出）
// flankSide: +1=主力側, -1=DD側（反対から挟み撃ち）
function aiMoveOneLead(lead, jpc, jpDir, sr, flankSide) {
  const preCol = lead.col, preRow = lead.row;
  aiSteerAndMove(lead, usFleet, jpFleet, sr, !state.jpDetected && aiFleetHasRadar(usFleet));
  console.log(`aiUSMove: ${lead.name}: (${preCol},${preRow}) → (${lead.col},${lead.row}) dir=${lead.dir} 針路=${lead.aiCourse} ${lead.aiPattern}`);
}

// ===== AI の操艦（ユーザーの指示 2026-11-04）=====
// 基本は近づく。砲戦距離に入ったら旋回して敵に横を向けて走る。距離が開いたら、もう一度敵の方へ旋回する。
// 損害が大きくなったら逃げる。旋回は衝突を避ける時などを除いて1回。後ろの艦は先頭の航跡をなぞる
// ぶつからないことが最優先。そのためなら距離の制約も、旋回の回数も、最低速度も破ってよい
const AI_HOLD_TURNS = 3;     // 旋回のあと、この回数の間は針路を保つ（ぶつかる時と敵が近すぎる時は別）
const AI_GUN_RANGE = 6;       // 主力艦がここまで近づいたら、敵に横を向ける
const AI_TORPEDO_RANGE = 4;   // 魚雷の残る駆逐艦はここまで近づく
const AI_OPEN_MARGIN = 3;     // 距離がこれだけ開いたら、敵の方へ旋回する
const AI_OPEN_ANGLE = 120;    // 敵が斜め後ろに回ったら（このまま走ると距離が開く）、敵の方へ旋回する
const AI_FLEE_RATIO = 0.5;    // 艦隊の砲力の残りがこの割合を切ったら、全艦で逃げる

function aiPos(col, row) { return { x: col + ((row & 1) ? 0.5 : 0), y: row * 0.866 }; }
// 艦の向きと敵の方向の角度（0=敵が真正面、90=真横、180=真後ろ）
function aiOffAngle(dir, fc, fr, tc, tr) {
  const a = aiPos(fc, fr), n = hexNeighbor(fc, fr, dir), b = aiPos(n.col, n.row), t = aiPos(tc, tr);
  const c1 = Math.atan2(b.y - a.y, b.x - a.x), c2 = Math.atan2(t.y - a.y, t.x - a.x);
  let d = Math.abs(c1 - c2) * 180 / Math.PI;
  if (d > 180) d = 360 - d;
  return d;
}
function aiTurnGap(a, b) {
  const d = Math.abs(DIR_CW_AI.indexOf(a) - DIR_CW_AI.indexOf(b));
  return Math.min(d, 6 - d);
}
// そのマスに入れるか（地図の端の手前で止まる）
function aiHexFree(ship, col, row) {
  if (col <= JP_WITHDRAW_COL || col >= US_WITHDRAW_COL || row < 0) return false;
  return !occupied(col, row, ship) && !getSunkShip(col, row, ship);
}
// この針路で steps マス先まで、何マス進めるか
function aiClearRun(ship, dir, steps) {
  let c = ship.col, r = ship.row, n = 0;
  for (; n < steps; n++) {
    const h = hexNeighbor(c, r, dir);
    if (!h || !aiHexFree(ship, h.col, h.row)) break;
    c = h.col; r = h.row;
  }
  return n;
}
// 敵に横を向ける距離（レーダー持ちの米艦が見つかる前は、視認の外で止める）
function aiNearRange(lead, sr, preContact) {
  if (preContact) return sr + 1;
  return lead.type === 'DD' && aiHasTorpedo(lead) ? AI_TORPEDO_RANGE : AI_GUN_RANGE;
}
// 艦隊の損害が大きいか。一度逃げると決めたら戻らない。決めた内容は艦隊の最初の艦に書いておく
function aiFleetFlees(fleet) {
  const note = fleet[0];
  if (note.aiFlee) return true;
  const full = fleet.reduce((n, s) => n + (s.capG || 0), 0);
  const left = aiLiveLeadsAndFollowers(fleet).reduce((n, s) => n + Math.max(0, (s.capG || 0) - (s.dmgG || 0)), 0);
  if (full > 0 && left < full * AI_FLEE_RATIO) {
    note.aiFlee = true;
    pdbg(`${note.side}: 損害が大きいので全艦で逃げる`);
  }
  return !!note.aiFlee;
}
function aiLiveLeadsAndFollowers(fleet) { return fleet.filter(s => s.status !== 'sunk' && s.col >= 0 && !s.withdrawing); }
// 「近づく・直進・離れる」のどれか。近づき始めたら、砲戦距離に入るまで変えない
function aiPattern(lead, fleet, dist, near, off) {
  if (aiFleetFlees(fleet)) return 'away';
  if (dist > near + AI_OPEN_MARGIN) return 'close';
  if (dist > near && off > AI_OPEN_ANGLE) return 'close';
  if (lead.aiPattern === 'close' && dist > near) return 'close';
  return 'keep';
}
// 今の向きのままでよければそのまま。変える時は、いちばん少ない旋回で済む針路を選ぶ
function aiChooseCourse(lead, foe, pattern) {
  const off = d => aiOffAngle(d, lead.col, lead.row, foe.col, foe.row);
  const ok = pattern === 'close' ? (d => off(d) <= 75)
           : pattern === 'away' ? (d => off(d) >= 105)
           : (d => off(d) >= 55 && off(d) <= 125);   // keep: 舷側を向けている
  if (ok(lead.dir)) return lead.dir;
  const ideal = pattern === 'close' ? (lead.type === 'DD' ? 0 : 45) : pattern === 'away' ? 135 : 90;
  let best = lead.dir, bestScore = 1e9;
  for (const d of DIR_CW_AI) {
    if (!ok(d)) continue;
    const score = aiTurnGap(lead.dir, d) * 100 + Math.abs(off(d) - ideal);
    if (score < bestScore) { bestScore = score; best = d; }
  }
  return best;
}
// 旗艦を1隻にするか複数にするかを、状況で決める（ユーザーの指示 2026-11-04）
//   複数: 魚雷の残る駆逐隊がいて主力もいる時 / 列どうしが離れすぎた時 / 列ごとに相手にする敵が離れている時
//   1隻: それ以外（接触前・魚雷を撃ち終えた後など）。全部の列が1隻の旗艦と同じ針路で進む
//   一度決めたら3ターンは変えない。決めた内容は艦隊の最初の艦に書いておく（次の画面にも残る）
function aiLiveLeads(fleet) { return fleet.filter(s => s.isLead && s.status !== 'sunk' && s.col >= 0 && !s.withdrawing); }
function aiHasTorpedo(s) { return s.torpedo && s.torpedo !== '-' && !s.torpedoFired && !s.cannotTorpedo; }
function aiNearestFoe(s, enemies) {
  let foe = null, dist = 999;
  for (const e of enemies) {
    if (e.status === 'sunk' || e.col < 0) continue;
    const d = hexDist(s.col, s.row, e.col, e.row);
    if (d < dist) { dist = d; foe = e; }
  }
  return foe;
}
function aiWantsManyFlagships(leads, enemies) {
  const dds = leads.filter(l => l.type === 'DD'), heavy = leads.filter(l => l.type !== 'DD');
  if (dds.some(aiHasTorpedo) && heavy.length) return true;
  for (let i = 0; i < leads.length; i++) for (let j = i + 1; j < leads.length; j++) {
    if (hexDist(leads[i].col, leads[i].row, leads[j].col, leads[j].row) > 8) return true;
    const a = aiNearestFoe(leads[i], enemies), b = aiNearestFoe(leads[j], enemies);
    if (a && b && hexDist(a.col, a.row, b.col, b.row) > 8) return true;
  }
  return false;
}
// 旗艦（主力で火力の大きい艦）が先に動くように並べる。全体の旗艦を aiCommander に入れる。複数の時は null
let aiCommander = null;
function aiPrepareLeads(fleet, enemies) {
  aiEnsureLeads(fleet);
  const leads = aiLiveLeads(fleet);
  aiCommander = null;
  if (leads.length === 0) return leads;
  const note = fleet[0], turnNo = state.combatTurn || 1;
  if (note.aiManyAt == null || turnNo - note.aiManyAt >= 3) {
    const many = aiWantsManyFlagships(leads, enemies);
    if (many !== note.aiMany) pdbg(`${note.side}: 旗艦を${many ? '複数' : '1隻'}にする`);
    note.aiMany = many;
    note.aiManyAt = turnNo;
  }
  const rank = s => (s.type === 'DD' ? 0 : 1000) + (s.atk || 0) * 10 + (s.capG || 0) - (s.dmgG || 0);
  leads.sort((a, b) => rank(b) - rank(a));
  if (!note.aiMany && leads.length > 1) aiCommander = leads[0];
  return leads;
}
// 列の旗艦が沈むか離脱するか動けない時は、列の次の艦が継ぐ
function aiEnsureLeads(fleet) {
  const live = s => s.status !== 'sunk' && s.col >= 0 && !s.withdrawing && getSpeed(s) > 0;
  new Set(fleet.filter(s => s.colIndex >= 0).map(s => s.colIndex)).forEach(ci => {
    const inCol = fleet.filter(s => s.colIndex === ci).sort((a, b) => (a.followOrder || 0) - (b.followOrder || 0));
    if (inCol.some(s => s.isLead && live(s))) return;
    const next = inCol.find(live);
    if (!next) return;
    inCol.forEach(s => { s.isLead = false; });
    next.isLead = true;
  });
}
// ===== 旗艦の移動先を選ぶ（ユーザーの指示 2026-11-04）=====
// 交互移動なので、敵は今いる位置で見る。旗艦の動きは 直進・1回旋回・2回旋回 を全部試し、後続も航跡どおりに進めて比べる
// 選ぶ順: ぶつからない > 与える損害の見込み − 受ける損害の見込み > 旋回が少ない > 敵に近い
// 撃てる敵 = 見えていて（視認距離、レーダー艦はレーダーの範囲、火災などで露見）、砲の射程内（phase_gun の canSee と同じ）
// 旋回は1ターンに駆逐艦2回、その他1回まで。方向は左か右のどちらかだけ。ぶつかるのを避ける時だけは自由
const AI_GUN_MAX = 15;        // 砲の射程（phase_gun の getMaxRange と同じ）
const AI_RADAR_RANGE = (JSON.parse(localStorage.getItem('scenarioRules') || 'null') || {}).radarRange || 20;   // phase_gun と同じ
function aiArcDelta(fc, fr, tc, tr) {
  const fa = toAxial(fc, fr), ta = toAxial(tc, tr);
  const dq = ta.q - fa.q, dr = ta.r - fa.r;
  return { dq, dr, ds: -dq - dr };
}
// 射界の判定は phase_gun と同じ（舷側=火力そのまま、前後=火力1/2）
function aiIsBroadside(dir, a) {
  if (dir === 6 || dir === 4) return a.dq * a.ds >= 0;
  if (dir === 3 || dir === 7) return a.dr * a.ds >= 0;
  return a.dq * a.dr >= 0;
}
function aiIsForward(dir, a) {
  if (dir === 6) return a.dq > 0;
  if (dir === 4) return a.dq < 0;
  if (dir === 3) return a.dr > 0;
  if (dir === 7) return a.dr < 0;
  if (dir === 9) return a.ds < 0;
  if (dir === 1) return a.ds > 0;
  return true;
}
function aiCanHit(radar, col, row, e, d) {
  if (d > AI_GUN_MAX) return false;
  if (e.onFire || e.firedGun1 || e.radarDetected) return true;
  if (d <= (state.spotRange || 0)) return true;
  return !!radar && d <= AI_RADAR_RANGE;
}
// ルール: 1隻が発見すれば艦隊全部の移動制限が解ける。レーダーは艦隊で判定する
function aiFleetHasRadar(fleet) { return fleet.some(s => s.radar && s.status !== 'sunk' && s.col >= 0); }
// 日本軍は発見するまで直進するので、次の移動の後の位置がわかる
function aiStraightNext(enemies, times) {
  const live = enemies.filter(e => e.status !== 'sunk' && e.col >= 0);
  const step = live.some(e => e.type === 'OBB') ? 3 : 4;
  return live.map(e => {
    let col = e.col, row = e.row;
    for (let i = 0, n = Math.min(step, getSpeed(e)) * (times || 1); i < n; i++) {
      const h = hexNeighbor(col, row, e.dir);
      if (!h || h.col < 0 || h.col >= COLS || h.row < 0) break;
      col = h.col; row = h.row;
    }
    return { col, row, dir: e.dir };
  });
}
// 待ち伏せの点数: 見つからない > 視認距離のすぐ外で舷側を向ける艦が多い > 相手の正面に入る艦が多い（T字） > 目標の距離に近い・旋回が少ない
function aiAmbushScore(chains, enemies, plan, sr) {
  const now = enemies.filter(e => e.status !== 'sunk' && e.col >= 0);
  const next = aiStraightNext(enemies);
  // 先攻で動いた後は、日本軍が後攻で動き、次のターンも先攻なら2回続けて動く
  const twice = state.phase === 'move2' ? [] : aiStraightNext(enemies, 2);
  // 後攻の移動なら、この直後の砲撃は今の位置に撃つ。先攻なら、日本軍の移動の後の位置に撃つ
  const aim = state.phase === 'move2' ? now : next;
  const want = sr + 1;
  let spotted = 0, risk = 0, full = 0, front = 0, gap = 0;
  for (const chain of chains) for (const p of chain) {
    if ([...now, ...next].some(e => hexDist(p.col, p.row, e.col, e.row) <= sr)) spotted++;
    if (twice.some(e => hexDist(p.col, p.row, e.col, e.row) <= sr)) risk++;
    let foe = null, d = 999;
    for (const e of aim) {
      const q = hexDist(p.col, p.row, e.col, e.row);
      if (q < d) { d = q; foe = e; }
    }
    if (!foe) continue;
    gap += Math.abs(d - want);
    if (d >= want && d <= want + 1 && aiIsBroadside(p.dir, aiArcDelta(p.col, p.row, foe.col, foe.row))) {
      full++;
      const back = aiArcDelta(foe.col, foe.row, p.col, p.row);
      if (!aiIsBroadside(foe.dir, back) && aiIsForward(foe.dir, back)) front++;
    }
  }
  const turns = (plan.match(/[LR]/g) || []).length;
  return [-spotted, full, front, -risk, full ? 0 : -gap, -turns, -gap];
}
function aiColumnFollowers(lead, fleet) {
  return fleet.filter(s => !s.isLead && s.colIndex === lead.colIndex && s.status !== 'sunk' && s.col >= 0 && !s.withdrawing && !isShipCrippled(s))
    .sort((a, b) => (a.followOrder || 0) - (b.followOrder || 0));
}
function aiColumnMoves(lead, fleet) {
  const slowest = Math.min(getSpeed(lead), ...aiColumnFollowers(lead, fleet).map(getSpeed));
  return lead.dmgM >= lead.capM / 2 ? Math.max(1, Math.ceil(slowest / 2)) : slowest;
}
// 旗艦の動きの候補。F=1マス進む、L/R=60度旋回（どちらも移動力1）
function aiPlanCandidates(moves, maxTurns) {
  const out = [];
  const walk = (plan, turns, side) => {
    if (plan.length === moves) { out.push(plan); return; }
    walk(plan + 'F', turns, side);
    if (turns < maxTurns) for (const t of side ? [side] : ['L', 'R']) walk(plan + t, turns + 1, t);
  };
  if (moves > 0) walk('', 0, null);

}
// 1列を計画どおりに進めた結果。旗艦が進めなくなったら null（他の列は、そこで止まる）
function aiSimulateColumn(lead, fleet, plan, strict) {
  const followers = aiColumnFollowers(lead, fleet);
  const chain = [lead, ...followers].map(s => ({ col: s.col, row: s.row, dir: s.dir, radar: s.radar, ship: s, turns: 0 }));
  return aiAdvanceChain(chain, lead, plan, strict);
}
function aiAdvanceChain(chain, lead, plan, strict) {
  const head = chain[0];
  for (const a of plan) {

}

const DIR_CW_AI = [6,3,1,4,7,9];

// JP艦隊の重心
function jpCenter() {
  const alive = jpFleet.filter(s => s.status !== 'sunk' && s.col >= 0);
  if (alive.length === 0) return {col:0, row:10};
  const sc = alive.reduce((a,s) => a+s.col, 0) / alive.length;
  const sr = alive.reduce((a,s) => a+s.row, 0) / alive.length;
  return {col: Math.round(sc), row: Math.round(sr)};
}

// JP艦隊の主要進行方向
function jpMainDir() {
  const alive = jpFleet.filter(s => s.status !== 'sunk' && s.col >= 0);
  if (alive.length === 0) return 6;
  const counts = {};
  for (const s of alive) { counts[s.dir] = (counts[s.dir]||0)+1; }
  let best = 6, bv = 0;
  for (const [d,c] of Object.entries(counts)) { if (c > bv) { bv=c; best=parseInt(d); } }
  return best;
}

// from→targetへの最適方向
function bestDirToward(fc, fr, tc, tr) {
  let bestDir = 6, bestDist = 999;
  for (const d of DIR_CW_AI) {
    const n = hexNeighbor(fc, fr, d);
    if (!n) continue;
    const dist = hexDist(n.col, n.row, tc, tr);
    if (dist < bestDist) { bestDist = dist; bestDir = d; }
  }
  return bestDir;
}

// from→targetから離れる最適方向
function bestDirAway(fc, fr, tc, tr) {
  let bestDir = 6, bestDist = -1;
  for (const d of DIR_CW_AI) {
    const n = hexNeighbor(fc, fr, d);
    if (!n) continue;
    const dist = hexDist(n.col, n.row, tc, tr);
    if (dist > bestDist) { bestDist = dist; bestDir = d; }
  }
  return bestDir;
}

// JP進行方向に対して垂直な方向（T字用）
// flankSide: +1 → perp1側(CW+2), -1 → perp2側(CW+4), 0 → 距離ベース自動
function perpDirToJP(jpDir, usCol, usRow, jpCol, jpRow, flankSide) {
  const ci = DIR_CW_AI.indexOf(jpDir);
  const perp1 = DIR_CW_AI[(ci + 2) % 6];
  const perp2 = DIR_CW_AI[(ci + 4) % 6];
  if (flankSide > 0) return perp1;
  if (flankSide < 0) return perp2;
  const n1 = hexNeighbor(usCol, usRow, perp1);
  const n2 = hexNeighbor(usCol, usRow, perp2);
  if (!n1) return perp2;
  if (!n2) return perp1;
  const d1 = hexDist(n1.col, n1.row, jpCol, jpRow);
  const d2 = hexDist(n2.col, n2.row, jpCol, jpRow);
  const ideal = 12;
  return Math.abs(d1 - ideal) <= Math.abs(d2 - ideal) ? perp1 : perp2;
}

function aiTurnStep(curDir, targetDir) {
  if (curDir === targetDir) return curDir;
  const ci = DIR_CW_AI.indexOf(curDir);
  const ti = DIR_CW_AI.indexOf(targetDir);
  const cwDist = (ti - ci + 6) % 6;
  const ccwDist = (ci - ti + 6) % 6;
  if (cwDist <= ccwDist) return DIR_CW_AI[(ci + 1) % 6];
  return DIR_CW_AI[(ci + 5) % 6];
}

// US艦隊の重心
function usCenter() {
  const alive = usFleet.filter(s => s.status !== 'sunk' && s.col >= 0);
  if (alive.length === 0) return {col: COLS - 1, row: 10};
  const sc = alive.reduce((a,s) => a + s.col, 0) / alive.length;
  const sr2 = alive.reduce((a,s) => a + s.row, 0) / alive.length;
  return {col: Math.round(sc), row: Math.round(sr2)};
}

// US艦隊の主要進行方向
function usMainDir() {
  const alive = usFleet.filter(s => s.status !== 'sunk' && s.col >= 0);
  if (alive.length === 0) return 4;
  const counts = {};
  for (const s of alive) { counts[s.dir] = (counts[s.dir]||0)+1; }
  let best = 4, bv = 0;
  for (const [d,c] of Object.entries(counts)) { if (c > bv) { bv=c; best=parseInt(d); } }
  return best;
}

// US進行方向に対して垂直な方向（JP用T字）
function perpDirToUS(usDir, jpCol, jpRow, usCol, usRow) {
  const ci = DIR_CW_AI.indexOf(usDir);
  const perp1 = DIR_CW_AI[(ci + 2) % 6];
  const perp2 = DIR_CW_AI[(ci + 4) % 6];
  const n1 = hexNeighbor(jpCol, jpRow, perp1);
  const n2 = hexNeighbor(jpCol, jpRow, perp2);
  if (!n1) return perp2;
  if (!n2) return perp1;
  const d1 = hexDist(n1.col, n1.row, usCol, usRow);
  const d2 = hexDist(n2.col, n2.row, usCol, usRow);
  const ideal = 8;
  return Math.abs(d1 - ideal) <= Math.abs(d2 - ideal) ? perp1 : perp2;
}

// 日本軍戦術AI移動（段階表示版）
function aiJPMoveAnimated() {
  aiEnsureLeads(jpFleet);
  const usc = usCenter();
  const usDir = usMainDir();
  const sr = state.spotRange || 6;
  // リード艦が損傷なら健全な随伴艦にリードを委譲
  for (const lead of jpFleet.filter(s => s.isLead && s.status !== 'sunk' && s.col >= 0)) {
    if (isShipCrippled(lead)) {
      const replacement = jpFleet.find(s => !s.isLead && s.colIndex === lead.colIndex && s.status !== 'sunk' && s.col >= 0 && !isShipCrippled(s));
      if (replacement) {
        lead.isLead = false;
        replacement.isLead = true;
        console.log(`JP旗艦交代: ${lead.name} → ${replacement.name} (損傷のため)`);
      }
    }
  }
  const leads = aiPrepareLeads(jpFleet, usFleet);

  let idx = 0;
  function moveNext() {
    if (idx >= leads.length) {
      markSharedHex();
      pushState();
      renderList();
      setTimeout(() => donePhase(), 1500);
      return;
    }
    const lead = leads[idx];
    aiJPMoveOneLead(lead, usc, usDir, sr);
    pushState();
    idx++;
    setTimeout(moveNext, 600);
  }
  moveNext();
}

// 1隻のJPリード艦を移動する
function aiJPMoveOneLead(lead, usc, usDir, sr) {

// 全艦直進コマンド（やり直し可能）
let allStraightBackup = null;  // 全艦直進前の状態を保存
function allStraight() {
  // 現在操作中の艦を確定
  if (moving) finishMovingForAllStraight();

  // 一時保存中の艦を確定（位置を復元してmovedShipsに登録）
  for (const name in shipStates) {
    const saved = shipStates[name];
    const ship = jpFleet.find(s => s.name === name);
    if (ship && saved) {
      ship.col = saved.col;
      ship.row = saved.row;
      ship.dir = saved.dir;
      ship.remainMove = 0;
      const idx = jpFleet.indexOf(ship);
      movedShips.add(idx);
      parent.postMessage({type:'ACTION_DONE', shipIndex:idx}, '*');
    }
    delete shipStates[name];
  }

  // やり直し用に全状態を保存
  allStraightBackup = {
    fleet: jpFleet.map(s => ({...s, crits: [...(s.crits||[])]})),
    movedShips: new Set(movedShips)
  };
  if (isFlagshipMode()) { flagshipStraightAll(); return; }

  var count = 0;
  // 前方の艦から先に動かす
  var targets = [];
  jpFleet.forEach(function(s, i) {
    if (canShipMove(s) && !movedShips.has(i)) targets.push({ship:s, idx:i});
  });
  targets.sort(function(a, b) {
    var aE = [6,3,9].indexOf(a.ship.dir) >= 0;
    var bE = [6,3,9].indexOf(b.ship.dir) >= 0;
    if (aE && bE) return b.ship.col - a.ship.col;
    if (!aE && !bE) return a.ship.col - b.ship.col;
    return 0;
  });
  for (var t = 0; t < targets.length; t++) {
    var ship = targets[t].ship;
    var idx = targets[t].idx;
    var spd = getSpeed(ship);
    var moveCount = ship.dmgM >= ship.capM / 2 ? Math.max(1, Math.ceil(spd/2)) : spd;
    var minSpd = getMinSpeed(ship);
    var minCount = ship.dmgM >= ship.capM / 2 ? Math.max(1, Math.ceil(minSpd/2)) : minSpd;
    var exited = false;
    for (var step = 0; step < moveCount; step++) {
      var next = hexNeighbor(ship.col, ship.row, ship.dir);
      if (!next) break;
      if (next.col < 0 || next.col >= COLS || next.row < 0) break;
      // 離脱ゾーンチェック: ゾーン外→内に入ったら即離脱
      if (ship.col > JP_WITHDRAW_COL && next.col <= JP_WITHDRAW_COL) {
        ship.status = exitStatus(ship, next.col);
        ship.col = -1;
        ship.withdrawing = true;
        pdbg(`${ship.name} 全艦直進で離脱ゾーン到達 → 退場`);
        exited = true;
        break;
      }
      // ルール 11: 前方に艦か沈没船がいれば入らない。最低移動力までは回頭して避け、避けられない時だけ入って衝突チェック
      if (hexBlocked(ship, next.col, next.row)) {
        if (step >= minCount) break;
        if (!canForceEntry(ship)) {
          if (avoidByTurn(ship)) continue; // 回頭で移動力1を使う
          break;
        }
      }
      ship.col = next.col;
      ship.row = next.row;
      enterHexChecks(ship, next.col, next.row);
    }
    ship.remainMove = 0;
    movedShips.add(idx);
    parent.postMessage({type:'ACTION_DONE', shipIndex:idx}, '*');
    count++;
  }
  setInfo(count + '隻が直進しました（やり直し可能）');
  document.getElementById('btnUndoAll').style.display = '';
  document.getElementById('btnAllStraight').style.display = 'none';
  pushState();
  renderList();
  checkAllMoved();
}

function undoAllStraight() {
  if (!allStraightBackup) return;
  // 艦の状態を復元
  for (let i = 0; i < jpFleet.length; i++) {
    Object.assign(jpFleet[i], allStraightBackup.fleet[i]);
    jpFleet[i].path = [];
  }
  movedShips = allStraightBackup.movedShips;
  // ACTION_DONE を取り消す
  jpFleet.forEach((s, i) => {
    if (!movedShips.has(i)) {
      parent.postMessage({type:'ACTION_UNDO', shipIndex:i}, '*');
    }
  });
  allStraightBackup = null;
  setInfo('全艦直進を取り消しました');
  document.getElementById('btnUndoAll').style.display = 'none';
  document.getElementById('btnAllStraight').style.display = '';
  pushState();
  renderList();
}

function resetAllMoves() {
  if (!phaseStartBackup) return;
  // 現在の移動操作を終了
  moving = null;
  remainMove = 0;
  undoStack = [];
  turnedThisHex = false;
  shipStates = {};
  allStraightBackup = null;
  // 全艦を復元
  for (let i = 0; i < jpFleet.length; i++) {
    Object.assign(jpFleet[i], phaseStartBackup[i]);
  }
  // movedShipsクリア＋ACTION_UNDO送信
  const oldMoved = new Set(movedShips);
  movedShips = new Set();
  oldMoved.forEach(i => {
    parent.postMessage({type:'ACTION_UNDO', shipIndex:i}, '*');
  });
  // 移動不可の艦を再スキップ
  jpFleet.forEach((s, i) => {
    if (!canShipMove(s)) {
      movedShips.add(i);
      parent.postMessage({type:'ACTION_DONE', shipIndex:i}, '*');
    }
  });
  flagshipSetup(); // 旗艦操作モードの追随艦を操作済みに戻す
  document.getElementById('btnUndo').disabled = true;
  document.getElementById('btnUndoAll').style.display = 'none';
  document.getElementById('btnAllStraight').style.display = '';
  setInfo('全艦の移動をリセットしました\n艦をクリックかTabで選択');
  setMoveBar('');
  parent.postMessage({type:'HIGHLIGHT', firer:null, target:null}, '*');
  pushState();
  renderList();
  checkAllMoved();
}

function setInfo(t) { document.getElementById('info').textContent = t; }
function setMoveBar(t) { document.getElementById('moveBar').textContent = t; }

function statusJP(s) {
  return {light:'小破', medium:'中破', heavy:'大破', sunk:'沈没'}[s] || '';
}

function getShipStatusText(s) {
  if (fogHidden(s)) { // 霧: 損害は分からない。味方は操作できない理由だけ出す
    if (s.side !== FOG_PLAYER_SIDE) return '';
    const why = [];
    if (s.withdrawing) why.push('命令に従わず離脱中');
    if (getSpeed(s) === 0 && s.status !== 'sunk') why.push('航行不能');
    if (s.cannotTurn) why.push('回頭不能');
    return why.length > 0 ? ` [${why.join('/')}]` : '';
  }
  const parts = [];
  if (s.status !== 'ok') parts.push(statusJP(s.status));
  if (getSpeed(s) === 0 && s.status !== 'sunk') parts.push('航行不能');
  if (s.cannotTurn) parts.push('回頭不能');
  if ((s.crits || []).includes('速力半減')) parts.push('速力半減');
  if (s.cannotFire || s.cannotShoot) parts.push('砲撃不能');
  if (s.cannotTorpedo) parts.push('雷撃不能');
  if (s.withdrawing) parts.push('離脱中');
  return parts.length > 0 ? ` [${parts.join('/')}]` : '';
}

function renderList() {
  const el = document.getElementById('shipList');
  let html = '<div class="phase-label">▼ 日本軍</div><div class="ship-cards">';

  jpFleet.forEach((s, i) => {
    const statusText = getShipStatusText(s);
    const hasSaved = !!shipStates[s.name];
    const isFinished = movedShips.has(i) && moving !== s && !hasSaved;  // 確定済み
    const isPaused = hasSaved && moving !== s;  // 中断中（切替可能）
    const isActive = (moving === s);
    const isMoveable = canShipMove(s);

    let cls = 'card jp';
    if (isActive) cls += ' selected';
    else if (isFinished) cls += ' done';
    else if (!isMoveable) cls += ' disabled';

    const spd = getSpeed(s);
    const spdInfo = isMoveable ? ` 速:${spd}` : '';
    let label = '';
    if (flagLeadOf(s)) label = ' [追随]';
    else if (isFinished) label = ' [済]';
    else if (isFlagshipMode() && !s.isLead && isMoveable) label = ' [手動]';
    else if (!isMoveable) label = statusText;

    html += `<div class="${cls}" onclick="clickShip(${i})">
      <span class="c-name">${s.name}${label}</span>
      <span class="c-info">${s.type}${spdInfo}${statusText && isMoveable ? statusText : ''}</span>
    </div>`;
  });

  html += '</div><div class="phase-label" style="margin-top:4px">▼ 米軍</div><div class="ship-cards">';
  const fogActive = !!state.fogMode;
  html += usFleet.filter(s => fogEnemyShown(s)).map(s => {
    const statusText = getShipStatusText(s);
    const fogN = fogHidden(s) ? fogName(s) : s.name;
    const fogT = fogHidden(s) ? (s.onFire ? '🔥' : '') : s.type + statusText;
    return `<div class="card us disabled">
      <span class="c-name">${fogN}</span>
      <span class="c-info">${fogT}</span>
    </div>`;
  }).join('');
  html += '</div>';

  el.innerHTML = html;
}

function clickShip(i) {
  if (!state.jpFreeMove) return;
  let s = jpFleet[i];
  const flagLead = flagLeadOf(s);
  if (flagLead) { s = flagLead; i = jpFleet.indexOf(s); } // 追随する艦を選んだ時は、その旗艦を操作する
  if (!canShipMove(s)) return;
  if (moving === s) return;  // 既に選択中

  // 完了済みで保存状態もない → 再選択不可（確定済み）
  if (movedShips.has(i) && !shipStates[s.name]) return;

  // 現在の艦を一時保存（確定せず）— 最低移動力チェック
  if (moving) {
    const minSpd = moveMinimum(moving);
    const used = moveLimit(moving) - remainMove;
    if (used > 0 && used < minSpd) {
      alert(`${moving.name}: 最低移動力は${minSpd}です（現在${used}消費）。あと${minSpd - used}移動してください。`);
      return;
    }
    const curIdx = jpFleet.indexOf(moving);
    const isDone = remainMove <= 0;
    shipStates[moving.name] = {
      col: moving.col, row: moving.row, dir: moving.dir,
      remainMove, undoStack: undoStack.slice(), turnedThisHex,
      done: isDone
    };
    // 未完了の船のみmovedShipsから除外
    if (!isDone && movedShips.has(curIdx)) {
      movedShips.delete(curIdx);
      parent.postMessage({type:'ACTION_UNDO', shipIndex:curIdx}, '*');
    }
    // 完了済みの船はmovedShipsに残す
    moving = null;
  }

  // 保存状態があれば復元
  if (shipStates[s.name]) {
    const saved = shipStates[s.name];
    s.col = saved.col;
    s.row = saved.row;
    s.dir = saved.dir;
    remainMove = saved.remainMove;
    undoStack = saved.undoStack;
    turnedThisHex = saved.turnedThisHex;
    delete shipStates[s.name];

    moving = s;
    document.getElementById('btnUndo').disabled = (undoStack.length === 0);
    let restriction = s.cannotTurn ? '\n⚠ 回頭不能 — 直進(5)のみ' : '';
    setInfo(`移動中: ${s.name} 向き:${DIR_NAMES[s.dir]||'?'}${restriction}\n147963=方向転換 5=直進`);
    setMoveBar(remainMove > 0 ? `残り移動力: ${remainMove}` : '移動力なし');
    renderList();
    pushState();
  } else {
    startMove(s);
  }
}

function startMove(ship) {
  // 航行不能チェック（念のため）
  if (getSpeed(ship) === 0) {
    const idx = jpFleet.indexOf(ship);
    movedShips.add(idx);
    parent.postMessage({type:'ACTION_DONE', shipIndex:idx}, '*');
    setInfo(`${ship.name} 航行不能 — 移動スキップ`);
    renderList();
    checkAllMoved();
    return;
  }

  moving = ship;
  turnedThisHex = false;
  undoStack = [];
  remainMove = moveLimit(ship);
  ship.remainMove = remainMove;

  // 初期位置をundoスタックに保存（移動0の状態に戻せるように）
  undoStack.push({
    col: ship.col, row: ship.row, dir: ship.dir,
    remainMove, turnedThisHex,
    turnCount: ship.turnCount, path: (ship.path || []).slice(), followers: flagSnapshot(ship)
  });
  document.getElementById('btnUndo').disabled = false;

  let restriction = '';
  if (ship.cannotTurn) restriction = '\n⚠ 回頭不能 — 直進(5)のみ';
  setInfo(`移動中: ${ship.name} 向き:${DIR_NAMES[ship.dir]||'?'}${restriction}\n147963=方向転換 5=直進`);
  const flagN = followersOf(ship).length;
  setMoveBar(flagN > 0 ? `残り移動力: ${remainMove}（列の上限 ${remainMove}／追随 ${flagN}隻）` : `残り移動力: ${remainMove}`);
  renderList();
  pushState();
}

function getSpeed(s) {
  // クリティカルで速力変更済みならそちらを使用
  if (s.speed !== undefined && s.speed !== null) return s.speed;
  return s.spd || 4;
}

function getMinSpeed(s) {
  const spd = getSpeed(s);
  return spd >= 5 ? 4 : spd;
}

// Axial hex math (pointy-top offset)
function toAxial(c,r) { return {q:c-(r-(r&1))/2, r:r}; }
function hexDist(c1,r1,c2,r2) {
  const a=toAxial(c1,r1), b=toAxial(c2,r2);
  return Math.max(Math.abs(a.q-b.q),Math.abs(a.r-b.r),Math.abs((a.q+a.r)-(b.q+b.r)));
}

// Pointy-top hex neighbor (odd-row offset)
function hexNeighbor(col, row, dir) {
  const even = (row % 2 === 0);
  const neighbors = {
    6:  even ? [1,0]  : [1,0],
    4:  even ? [-1,0] : [-1,0],
    3:  even ? [0,1]  : [1,1],
    1:  even ? [-1,1] : [0,1],
    9:  even ? [0,-1] : [1,-1],
    7:  even ? [-1,-1]: [0,-1],
  };
  const d = neighbors[dir];
  if (!d) return null;
  return {col: col+d[0], row: row+d[1]};
}

function occupied(col, row, skipShip) {
  return [...(state.jpFleet||[]), ...(state.usFleet||[])].some(s =>
    s !== skipShip && s.col===col && s.row===row && s.status!=='sunk' && s.col >= 0
  );
}

// 占有ヘクスにいる艦を返す（生存艦）
function getOccupant(col, row, skipShip) {
  return [...(state.jpFleet||[]), ...(state.usFleet||[])].find(s =>
    s !== skipShip && s.col===col && s.row===row && s.status!=='sunk' && s.col >= 0
  );
}
// 沈没船を返す（沈没中の船体との衝突チェック用）
function getSunkShip(col, row, skipShip) {
  return [...(state.jpFleet||[]), ...(state.usFleet||[])].find(s =>
    s !== skipShip && s.col===col && s.row===row && s.status==='sunk' && s.col >= 0
  );
}

// ========== 衝突チェックシステム ==========
function roll() { return Math.ceil(Math.random()*6); }

// 雷撃ダメージチャート（衝突損害判定用）
var COLLISION_DMG_CHART = [
  ['4M','5MG','5MG','6MG','6MG','6M2G','6M2G','SINK','SINK','SINK','SINK'],
  ['3M','4MG','5M','6M','6M','6MG','5M2G','SINK','SINK','SINK','SINK'],
  ['2M','3MG','4MG','5M','5MG','6M','6MG','7M2G','SINK','SINK','SINK'],
  ['2M','3M','4M','5M','5M','5MG','6M','8M','SINK','SINK','SINK'],
  ['-','2M','3MG','4M','4MG','5M','5MG','6MG','7M2G','SINK','SINK'],
  ['-','2M','3M','3MG','5M','4MG','4M2G','5M2G','7MG','SINK','SINK'],
  ['-','2M','2M','3M','4MG','5M','5M','5MG','6MG','7M3G','SINK'],
  ['-','-','2M','2MG','4M','4MG','4MG','5MG','6M','7M2G','SINK'],
  ['-','-','2M','2M','4M','4M','3M2G','4MG','5MG','6M2G','7M3G'],
  ['-','-','-','2M','3MG','3MG','3MG','4M','5MG','6MG','7M2G'],
  ['-','-','-','M','2M','2MG','3M','3MG','4MG','6M','6M2G'],
];
var COLLISION_CRIT_CHART = {
  2:'弾薬庫被弾→轟沈',3:'弾薬庫被弾(BB:3G3M/他:轟沈)',4:'弾薬庫被弾(BB+CA:3G3M/他:轟沈)',
  5:'隔壁破壊(M損害+D1)',6:'火災発生',7:'艦橋被弾(攻撃力半減+火災)',
  8:'火災発生',9:'雷撃所被弾(雷撃不能)',10:'電路切断(砲撃不能)',
  11:'操舵室被弾(回頭不能)',12:'機関室被弾(BB:速力半減/他:航行不能)',
};

function collisionParseDmg(str) {
  if (!str || str==='-') return {g:0, m:0, sunk:false};
  if (str==='SINK') return {g:0, m:0, sunk:true};
  var g=0, m=0;
  var mg = str.match(/(\d*)G/); if(mg) g = parseInt(mg[1]) || 1;
  var mm = str.match(/(\d*)M/); if(mm) m = parseInt(mm[1]) || 1;
  if(str==='MG'||str==='GM') { g=1; m=1; }
  return {g, m, sunk:false};
}

function collisionApplyCritical(target, cd) {
  var result = {text: '', extraG:0, extraM:0, sunk:false};
  var tp = target.type;
  if (!target.crits) target.crits = [];
  switch(cd) {
    case 2:
      result.sunk = true;
      result.text = cd + ': 弾薬庫被弾 → 轟沈';
      target.crits.push('轟沈(弾薬庫)');
      break;
    case 3:
      if (tp==='BB'||tp==='OBB') {
        result.extraG=3; result.extraM=3;
        target.onFire = true; (target.crits = target.crits || []).push('火災'); // 表: 3G3M に火災マーカー
        result.text = cd + ': 弾薬庫被弾 → 大損害(3G3M)';
        target.crits.push('大損害(3G3M)');
      } else {
        result.sunk = true;
        result.text = cd + ': 弾薬庫被弾 → 轟沈';
        target.crits.push('轟沈');
      }
      break;
    case 4:
      if (tp==='BB'||tp==='OBB'||tp==='CA') {
        result.extraG=3; result.extraM=3;
        target.onFire = true; (target.crits = target.crits || []).push('火災'); // 表: 3G3M に火災マーカー
        result.text = cd + ': 弾薬庫被弾 → 大損害(3G3M)';
        target.crits.push('大損害(3G3M)');
      } else {
        result.sunk = true;
        result.text = cd + ': 弾薬庫被弾 → 轟沈';
        target.crits.push('轟沈');
      }
      break;
    case 5:
      var extraM = roll();
      result.extraM = extraM;
      result.text = cd + ': 隔壁破壊 → M+' + extraM;
      target.crits.push('隔壁破壊');
      break;
    case 6:
      target.onFire = true;
      result.text = cd + ': 火災発生';
      target.crits.push('火災');
      break;
    case 7:
      target.gunHalved = true; target.onFire = true;
      result.text = cd + ': 艦橋被弾 → 攻撃力半減+火災';
      target.crits.push('攻撃力半減'); target.crits.push('火災');
      break;
    case 8:
      target.onFire = true;
      result.text = cd + ': 火災発生';
      target.crits.push('火災');
      break;
    case 9:
      target.cannotTorpedo = true;
      result.text = cd + ': 雷撃所被弾 → 雷撃不能';
      target.crits.push('雷撃不能');
      break;
    case 10:
      target.cannotFire = true;
      result.text = cd + ': 電路切断 → 砲撃不能';
      target.crits.push('砲撃不能');
      break;
    case 11:
      target.cannotTurn = true;
      result.text = cd + ': 操舵室被弾 → 回頭不能';
      target.crits.push('回頭不能');
      break;
    case 12:
      if (tp==='BB'||tp==='OBB') {
        if (target.origSpeed === undefined) target.origSpeed = target.speed; // 修理で戻す速力
        target.speed = Math.ceil((target.speed||4)/2);
        result.text = cd + ': 機関室被弾 → 速力半減';
        target.crits.push('速力半減');
      } else {
        if (target.origSpeed === undefined) target.origSpeed = target.speed; // 修理で戻す速力
        target.speed = 0;
        result.text = cd + ': 機関室被弾 → 航行不能';
        target.crits.push('航行不能');
      }
      break;
    default:
      result.text = cd + ': 不明';
      break;
  }
  if (result.sunk) { target.status = 'sunk'; }
  return result;
}

function collisionApplyDamage(ship, dmg, isDouble) {
  var totalG = dmg.g;
  var totalM = dmg.m;
  var critText = '';
  if (dmg.sunk) {
    ship.status = 'sunk';
    return {g: 0, m: 0, sunk: true, critText: ''};
  }
  // ゾロ目 → クリティカル
  if (isDouble) {
    var cd = roll() + roll();
    var crit = collisionApplyCritical(ship, cd);
    totalG += crit.extraG;
    totalM += crit.extraM;
    critText = crit.text;
    if (crit.sunk) {
      return {g: totalG, m: totalM, sunk: true, critText: critText};
    }
  }
  // ダメージ適用
  ship.dmgG = (ship.dmgG || 0) + totalG;
  ship.dmgM = (ship.dmgM || 0) + totalM;
  if (ship.dmgG > ship.capG) {
    ship.dmgM += ship.dmgG - ship.capG;
    ship.dmgG = ship.capG;
  }
  var total = ship.dmgG + ship.dmgM;
  var cap = ship.capG + ship.capM;
  if (ship.dmgM >= ship.capM) { ship.status = 'sunk'; }
  else if (total >= cap * 0.5) { ship.status = 'heavy'; }
  else if (total >= cap * 0.25) { ship.status = 'medium'; }
  else { ship.status = total > 0 ? 'light' : 'ok'; }
  return {g: totalG, m: totalM, sunk: ship.status === 'sunk', critText: critText};
}

// 衝撃レーティング
function getCollisionRating(ship) {
  if (ship.type === 'BB' && ship.capG >= 20) return 8;  // 大和型
  if (ship.type === 'BB') return 6;  // 長門型・米BB
  if (ship.type === 'OBB') return 4;  // その他戦艦
  if (ship.type === 'CA') return 2;
  if (ship.side === 'us' && (ship.type === 'CL' || ship.type === 'CLAA')) return 2;
  return 1;  // DD, JP CL/CLAA
}

// ルール 11: 艦のいるヘクス・沈没船のヘクスには入らない。回頭不能か前方3ヘクスがふさがっている時だけ入り、衝突チェックをする
function hexBlocked(ship, col, row) {
  return occupied(col, row, ship) || !!getSunkShip(col, row, ship);
}
// 回頭して避ける（移動力1を使う）。避けられたら true
function avoidByTurn(ship) {
  if (ship.cannotTurn) return false;
  var idx = DIR_CW.indexOf(ship.dir);
  for (var offset of [1, 5]) {
    var d = DIR_CW[(idx + offset) % 6];
    var n = hexNeighbor(ship.col, ship.row, d);
    if (n && n.col >= 0 && n.col < COLS && n.row >= 0 && !hexBlocked(ship, n.col, n.row)) {
      ship.dir = d;
      ship.turnCount = (ship.turnCount || 0) + 1;
      return true;
    }
  }
  return false;
}
// 入った先の衝突チェック
function enterHexChecks(ship, col, row) {
  var occ = getOccupant(col, row, ship);
  if (occ) collisionCheck(ship, occ);
  var sunk = getSunkShip(col, row, ship);
  if (sunk) collisionCheck(ship, sunk);
}
// 全艦直進の前に、操作中の艦を最低移動力まで残りの分だけ進めて確定する
function finishMovingForAllStraight() {
  var s = moving;
  var guard = 8;
  while (guard-- > 0 && s.remainMove > 0 && s.status !== 'sunk') {
    var used = moveLimit(s) - s.remainMove;
    if (used === 0 || used >= moveMinimum(s)) break;
    var next = hexNeighbor(s.col, s.row, s.dir);
    if (!next || next.col < 0 || next.col >= COLS || next.row < 0) break;
    if (hexBlocked(s, next.col, next.row) && !canForceEntry(s)) {
      if (avoidByTurn(s)) { s.remainMove--; continue; }
      break;
    }
    var afterStep = flagBeforeStep(s);
    s.col = next.col; s.row = next.row; s.remainMove--;
    enterHexChecks(s, next.col, next.row);
    afterStep();
  }
  var used2 = moveLimit(s) - s.remainMove;
  if (used2 > 0 && used2 < moveMinimum(s)) s.remainMove = 0; // 進めない時は、そこで確定
  remainMove = s.remainMove;
  finishMove();
}

// 前方3ヘクスが全て塞がっているか
function allForwardBlocked(ship) {
  var cw = [6,3,1,4,7,9];
  var idx = cw.indexOf(ship.dir);
  if (idx < 0) return false;
  var dirs = [ship.dir, cw[(idx+1)%6], cw[(idx+5)%6]];
  return dirs.every(function(d) {
    var n = hexNeighbor(ship.col, ship.row, d);
    return !n || n.col < 0 || n.col >= COLS || n.row < 0 || hexBlocked(ship, n.col, n.row);
  });
}

// 占有ヘクスに強制進入可能か
function canForceEntry(ship) {
  return ship.cannotTurn || allForwardBlocked(ship);
}

// 霧モード下での表示用名前（IJN: 米軍艦を「大型N/小型N」に隠蔽）
function collisionDispName(s) {
  return fogShort(s);
}

// 衝突チェック実行
function collisionCheck(invader, occupant) {
  var isSunk = (occupant.status === 'sunk');
  var d1 = roll(), d2 = roll();
  var invName = collisionDispName(invader);
  var occName = collisionDispName(occupant);
  var msg = '--- 衝突チェック ---\n';
  msg += invName + ' → ' + occName + (isSunk ? '(沈没船)' : '') + '\n';
  msg += '判定ダイス: ' + d1 + ' + ' + d2 + ' = ' + (d1+d2) + '（7で衝突）\n';

  parent.postMessage({type:'HIGHLIGHT', firer:invader.name, target:occupant.name}, '*');

  if (d1 + d2 !== 7) {
    msg += '\n→ 回避成功';
    alert(msg);
    parent.postMessage({type:'HIGHLIGHT', firer:null, target:null}, '*');
    return [msg];
  }

  msg += '\n★ 衝突発生!\n';

  // 侵入側: 1:2 (rc=0)
  var dInv1 = roll(), dInv2 = roll();
  var invRow = Math.max(0, Math.min(10, dInv1 + dInv2 - 2));
  var invDmgStr = (COLLISION_DMG_CHART[invRow] && COLLISION_DMG_CHART[invRow][0]) || '-';
  var invDmg = collisionParseDmg(invDmgStr);
  var invResult = collisionApplyDamage(invader, invDmg, dInv1 === dInv2);
  msg += '\n【' + invName + '（侵入側 1:2）】\n';
  msg += fogCollisionText(invader, dInv1, dInv2, invDmgStr, invResult);

  if (isSunk) {
    msg += '\n【' + occName + '（沈没船）】\n  追加損害なし';
    alert(msg);
    parent.postMessage({type:'HIGHLIGHT', firer:null, target:null}, '*');
    return [msg];
  }

  // 被衝突側: レーティング比率
  var invRating = getCollisionRating(invader);
  var occRating = getCollisionRating(occupant);
  var ratio = invRating / occRating;
  var rc = ratio < 1 ? 0 : Math.min(10, Math.floor(ratio));
  if (rc < 1) rc = 1;
  var ratioLabels = ['1:2','1:1','2:1','3:1','4:1','5:1','6:1','7:1','8:1','9:1','10:1'];
  var dOcc1 = roll(), dOcc2 = roll();
  var occRow = Math.max(0, Math.min(10, dOcc1 + dOcc2 - 2));
  var occDmgStr = (COLLISION_DMG_CHART[occRow] && COLLISION_DMG_CHART[occRow][rc]) || '-';
  var occDmg = collisionParseDmg(occDmgStr);
  var occResult = collisionApplyDamage(occupant, occDmg, dOcc1 === dOcc2);
  msg += '\n【' + occName + '（被衝突' + (fogHidden(invader) || fogHidden(occupant) ? '' : ' ' + (ratioLabels[rc]||'?')) + '）】\n';
  msg += fogCollisionText(occupant, dOcc1, dOcc2, occDmgStr, occResult);

  alert(msg);
  parent.postMessage({type:'HIGHLIGHT', firer:null, target:null}, '*');
  return [msg];
}

// 同一ヘクス残留チェック（移動終了時に呼ぶ）
function markSharedHex() {
  var allShips = (state.jpFleet || []).concat(state.usFleet || []);
  // 全艦のsharedHexフラグをリセット
  allShips.forEach(function(s) { s.sharedHex = false; });
  // 同一ヘクスの艦を検出
  for (var i = 0; i < allShips.length; i++) {
    if (allShips[i].status === 'sunk' || allShips[i].col < 0) continue;
    for (var j = i + 1; j < allShips.length; j++) {
      if (allShips[j].status === 'sunk' || allShips[j].col < 0) continue;
      if (allShips[i].col === allShips[j].col && allShips[i].row === allShips[j].row) {
        allShips[i].sharedHex = true;
        allShips[j].sharedHex = true;
      }
    }
  }
}

// ========== やり直し ==========
function saveUndo() {
  undoStack.push({
    col: moving.col, row: moving.row, dir: moving.dir,
    remainMove,
    turnedThisHex,
    turnCount: moving.turnCount, path: (moving.path || []).slice(), followers: flagSnapshot(moving)
  });
  document.getElementById('btnUndo').disabled = false;
}

function doUndo() {
  if (undoStack.length === 0 || !moving) return;
  const snap = undoStack.pop();
  moving.col = snap.col;
  moving.row = snap.row;
  moving.dir = snap.dir;
  remainMove = snap.remainMove;
  moving.remainMove = remainMove;
  turnedThisHex = snap.turnedThisHex;
  moving.turnCount = snap.turnCount;
  moving.path = snap.path;
  flagRestore(snap.followers);
  // softFinishMoveで追加されていた場合は取り消す
  const idx = jpFleet.indexOf(moving);
  movedShips.delete(idx);
  parent.postMessage({type:'ACTION_UNDO', shipIndex:idx}, '*');
  let restriction = moving.cannotTurn ? '\n⚠ 回頭不能 — 直進(5)のみ' : '';
  setInfo(`やり直し — ${moving.name} 向き:${DIR_NAMES[moving.dir]||'?'}${restriction}\n147963=方向転換 5=直進`);
  setMoveBar(`残り移動力: ${remainMove}`);
  pushState();
  renderList();
  if (undoStack.length === 0) document.getElementById('btnUndo').disabled = true;
}

// ========== 方向転換（147963）==========
function turnTo(dir) {
  if (!moving || remainMove <= 0) return;
  if (moving.cannotTurn) {
    setInfo('回頭不能 — 直進(5)のみ可能！');
    return;
  }
  if (moving.dir === dir) {
    setInfo(`既に${DIR_NAMES[dir]}を向いています`);
    return;
  }
  if (turnedThisHex) {
    setInfo('同じヘックスで2回連続回頭不可！');
    return;
  }

  // 60度制限: 隣接方向のみ許可
  const ci = DIR_CW.indexOf(moving.dir);
  const adj1 = DIR_CW[(ci + 1) % 6];
  const adj2 = DIR_CW[(ci + 5) % 6];
  if (dir !== adj1 && dir !== adj2) {
    setInfo(`60度ずつしか回頭できません！（${DIR_NAMES[adj1]} or ${DIR_NAMES[adj2]}）`);
    return;
  }

  saveUndo();
  moving.dir = dir;
  moving.turnCount = (moving.turnCount || 0) + 1;  // 回頭数記録（砲撃修正用）
  remainMove--;
  moving.remainMove = remainMove;
  turnedThisHex = true;
  setInfo(`${moving.name} → ${DIR_NAMES[dir]} (回頭)\n5=直進`);
  setMoveBar(`残り移動力: ${remainMove}`);
  pushState();
  if (remainMove <= 0) {
    softFinishMove();
  }
}

// ========== 直進（5キー）==========
function moveForward() {
  if (!moving || remainMove <= 0) return;

  const next = hexNeighbor(moving.col, moving.row, moving.dir);
  if (!next) { setInfo('移動先なし'); return; }
  if (next.col < 0 || next.col >= COLS || next.row < 0) {
    setInfo('マップ外'); return;
  }
  // ルール 11 では入れないが、無理をしてでも進みたい時は、警告のうえで入れる（ユーザーの指示 2026-11-04）
  if (hexBlocked(moving, next.col, next.row) && !canForceEntry(moving)) {
    if (!confirm(`${moving.name}: 前方のヘクスに艦がいます。\n入ると衝突チェックをします（ダイスで7が出ると衝突）。\nそれでも進みますか？`)) {
      setInfo(`${moving.name}: 進入をやめました。回頭して避けるか、別の動きを選んでください`); return;
    }
  }
  saveUndo();

  const flagAfterStep = flagBeforeStep(moving);
  const prevCol = moving.col;
  moving.col = next.col;
  moving.row = next.row;
  turnedThisHex = false;
  remainMove--;
  moving.remainMove = remainMove;

  // 同一ヘクスに他の艦がいる場合 → 衝突チェック
  var occupant = getOccupant(next.col, next.row, moving);
  if (occupant) {
    collisionCheck(moving, occupant);
  }

  // 沈没船との衝突チェック（沈没中の船体に接触）
  var sunkOcc = getSunkShip(next.col, next.row, moving);
  if (sunkOcc) {
    collisionCheck(moving, sunkOcc);
  }
  flagAfterStep(); // 列が1ヘクスついてくる

  let restriction = moving.cannotTurn ? '\n⚠ 回頭不能 — 直進(5)のみ' : '';
  setInfo(`${moving.name} 前進 → (${next.col},${next.row})${restriction}\n147963=方向転換 5=直進`);
  setMoveBar(`残り移動力: ${remainMove}`);
  pushState();

  // 日本軍: ゾーン外→離脱ゾーン(col 0-6)に入った時だけ離脱確認
  if (!moving.withdrawing && prevCol > JP_WITHDRAW_COL && moving.col <= JP_WITHDRAW_COL && isJPMoving() && jpFleet.indexOf(moving) >= 0) {
    if (confirm(`${moving.name} は地図の端に到達しました。離脱しますか？${(state.combatTurn||1) < 6 ? '\n（第6ターンより前なので沈没扱いになります）' : ''}`)) {
      withdrawShipNow(moving);
      return;
    }
  }

  if (remainMove <= 0) {
    softFinishMove();
  }
}

// ========== 即時離脱（その場でゲームから除外）==========
function withdrawShipNow(ship) {
  ship.status = exitStatus(ship, ship.col);
  ship.withdrawing = true;
  ship.col = -1;
  ship.remainMove = 0;
  const idx = jpFleet.indexOf(ship);
  movedShips.add(idx);
  parent.postMessage({type:'ACTION_DONE', shipIndex:idx}, '*');
  pdbg(`${ship.name} 即時離脱 (exited)`);
  setInfo(`${ship.name} 離脱`);
  setMoveBar('');
  moving = null;
  undoStack = [];
  document.getElementById('btnUndo').disabled = true;
  pushState();
  renderList();

  // 全日本艦が離脱/沈没 → 戦闘終了
  const jpActive = jpFleet.filter(s => s.status !== 'sunk' && s.status !== 'exited' && s.col >= 0);
  if (jpActive.length === 0) {
    setInfo('日本艦隊 全艦離脱 — 戦闘終了');
    pdbg('全日本艦離脱 → PHASE_DONE(turn_end)');
    setTimeout(() => {
      parent.postMessage({type:'PHASE_DONE', nextPhase:'turn_end'}, '*');
    }, 1000);
    return;
  }
  checkAllMoved();
}

// ========== 移動力消費完了（undo可能な完了）==========
function softFinishMove() {
  const idx = jpFleet.indexOf(moving);
  movedShips.add(idx);  // checkAllMovedのためにマーク
  parent.postMessage({type:'ACTION_DONE', shipIndex:idx}, '*');
  setInfo(`${moving.name} 移動力消費完了 — やり直し可`);
  setMoveBar('移動力なし');
  renderList();
  checkAllMoved();
  // moving, undoStackはそのまま維持 → undo可能
}

// US列用の随伴艦追従（USのみ使用）
// ========== 旗艦操作モード（ユーザーの指示 2026-11-03）==========
// 旗艦を動かすと同じ列の艦が1ヘクスずつついてくる。追随できない艦は今までどおり個別に動かす
function isFlagshipMode() { return localStorage.getItem('flagshipMove') !== '0'; } // 旗艦が動いて後続が追随するのが基本（ユーザーの指示 2026-11-04）
function flagFleet() { return jpFleet; }
function flagCanLead(s) {
  return canShipMove(s) && !isShipCrippled(s) && s.dmgM < s.capM / 2;
}
function flagCanFollow(f, lead) {
  if (f === lead || f.isLead || f.colIndex !== lead.colIndex || f.colIndex < 0) return false;
  if (!flagCanLead(f)) return false;
  return (f.type === 'OBB') === (lead.type === 'OBB'); // 旧式戦艦は旧式戦艦だけで動く
}
// 旗艦から切れ目なく並ぶ艦だけが追随する。切れた艦は自動で手動になり、列の最後尾の隣に戻れば、また追随する
// 一度の移動の途中で変わらないよう、移動フェーズの最初に決める（ユーザーの指示 2026-11-04）
let flagLinks = null;
function flagLinkedFrom(lead) {
  const chain = [], rest = flagFleet().filter(f => flagCanFollow(f, lead)).sort((a, b) => (a.followOrder || 0) - (b.followOrder || 0));
  let tail = lead;
  for (;;) {
    const ahead = hexNeighbor(tail.col, tail.row, tail.dir);   // 最後尾の真正面の艦は、後ろにつけない
    const next = rest.find(f => !chain.includes(f) && hexDist(f.col, f.row, tail.col, tail.row) <= 1
      && !(ahead && ahead.col === f.col && ahead.row === f.row));
    if (!next) return chain;
    chain.push(next);
    tail = next;
  }
}
function followersOf(s) {
  if (!isFlagshipMode() || !s.isLead || !flagFleet().includes(s) || !canShipMove(s)) return [];
  if (flagLinks) return flagLinks.get(s.name) || [];
  return flagLinkedFrom(s);
}
function flagLeadOf(f) {
  if (!isFlagshipMode() || f.isLead) return null;
  const lead = flagFleet().find(s => s.isLead && s.colIndex === f.colIndex && canShipMove(s));
  return lead && followersOf(lead).includes(f) ? lead : null;
}
// 旗艦が沈むか動けない時は、列の次の艦が継ぐ
function flagEnsureLeads() {
  const cols = new Set(flagFleet().filter(s => s.colIndex >= 0 && s.status !== 'sunk' && s.col >= 0).map(s => s.colIndex));
  cols.forEach(ci => {
    const inCol = flagFleet().filter(s => s.colIndex === ci && s.status !== 'sunk' && s.col >= 0)
      .sort((a, b) => (a.followOrder || 0) - (b.followOrder || 0));
    const lead = inCol.find(s => s.isLead);
    if (lead && flagCanLead(lead)) return;
    const next = inCol.find(flagCanLead);
    if (!next) return;
    flagFleet().filter(s => s.colIndex === ci).forEach(s => { s.isLead = false; });
    next.isLead = true;
  });
}
function flagshipSetup() {
  if (!isFlagshipMode()) return;
  flagEnsureLeads();
  flagLinks = null;
  const links = new Map();
  flagFleet().filter(s => s.isLead && canShipMove(s)).forEach(l => links.set(l.name, flagLinkedFrom(l)));
  flagLinks = links;
  flagFleet().forEach((s, i) => {
    if (flagLeadOf(s)) {
      movedShips.add(i);
      s.remainMove = 0;
      parent.postMessage({type:'ACTION_DONE', shipIndex:i}, '*');
    }
  });
}
// この艦が動ける上限と最低（列なら一番遅い艦に合わせる。追随する艦に最低は適用しない）
function moveLimit(s) {
  let spd = getSpeed(s);
  if (s.dmgM >= s.capM / 2) spd = Math.max(1, Math.ceil(spd / 2));
  followersOf(s).forEach(f => { spd = Math.min(spd, getSpeed(f)); });
  return spd;
}
function moveMinimum(s) {
  const base = getMinSpeed(s);
  const m = s.dmgM >= s.capM / 2 ? Math.max(1, Math.ceil(base / 2)) : base;
  return Math.min(m, moveLimit(s));
}
function flagSnapshot(s) {
  return followersOf(s).map(f => ({ name: f.name, col: f.col, row: f.row, dir: f.dir, turnCount: f.turnCount, status: f.status,
    path: (f.path || []).slice() }));
}
function flagRestore(list) {
  (list || []).forEach(o => {
    const f = flagFleet().find(x => x.name === o.name);
    if (f) { f.col = o.col; f.row = o.row; f.dir = o.dir; f.turnCount = o.turnCount; f.path = o.path; }
  });
}
// 旗艦の1歩に列を追随させる（旗艦が進む前に呼び、進んだ後で返り値の関数を呼ぶ）
function flagBeforeStep(s) {
  const list = followersOf(s);
  if (list.length === 0) return () => {};
  s.path = s.path || [];
  s.path.push({ col: s.col, row: s.row, dir: s.dir });
  return () => moveFollowers(s, flagFleet(), list);
}
// 全艦直進（旗艦操作モード）: 旗艦と個別の艦が直進し、列はついてくる
function flagshipStraightAll() {
  let count = 0;
  flagFleet().forEach((ship, idx) => {
    if (!canShipMove(ship) || movedShips.has(idx)) return;
    const limit = moveLimit(ship), minCount = moveMinimum(ship);
    for (let step = 0; step < limit; step++) {
      const next = hexNeighbor(ship.col, ship.row, ship.dir);
      if (!next || next.col < 0 || next.col >= COLS || next.row < 0) break;
      if (ship.col > JP_WITHDRAW_COL && next.col <= JP_WITHDRAW_COL) {
        ship.status = exitStatus(ship, next.col);
        ship.col = -1;
        ship.withdrawing = true;
        break;
      }
      if (hexBlocked(ship, next.col, next.row)) {
        if (step >= minCount) break;
        if (!canForceEntry(ship)) {
          if (avoidByTurn(ship)) continue; // 回頭で移動力1を使う
          break;
        }
      }
      const after = flagBeforeStep(ship);
      ship.col = next.col;
      ship.row = next.row;
      enterHexChecks(ship, next.col, next.row);
      after();
    }
    ship.remainMove = 0;
    movedShips.add(idx);
    parent.postMessage({type:'ACTION_DONE', shipIndex:idx}, '*');
    count++;
  });
  setInfo(count + '隻（旗艦と個別の艦）が直進しました（やり直し可能）');
  document.getElementById('btnUndoAll').style.display = '';
  document.getElementById('btnAllStraight').style.display = 'none';
  pushState();
  renderList();
  checkAllMoved();
}

// 機関の損傷（航行不能・速力半減）は、シナリオの速力制限とは別なので戻さない
function aiEngineHit(s) { return (s.crits || []).some(c => c === '航行不能' || c === '速力半減'); }
function isShipCrippled(s) {
  // 速力0、大破、回頭不能、砲撃不能、速力半減 → 追従不能・旗艦不適格
  var hasCrit = (s.crits || []).includes('速力半減');
  return s.speed === 0 || captainShouldWithdraw(s) || s.cannotTurn || hasCrit;
}

// 随伴艦追従（ワープ禁止: 隣接hex移動のみ）
function moveFollowers(lead, fleet, chosen) {
  const ci = lead.colIndex;
  const followers = chosen || fleet
    .filter(s => !s.isLead && s.colIndex === ci && s.status !== 'sunk' && s.col >= 0 && !s.withdrawing && !isShipCrippled(s))
    .sort((a,b) => a.followOrder - b.followOrder);

  const chain = [lead, ...followers];
  for (let i = 1; i < chain.length; i++) {
    const ahead = chain[i-1];
    if (!ahead.path || ahead.path.length === 0) continue;
    const target = ahead.path[0];
    const fol = chain[i];
    const dist = hexDist(fol.col, fol.row, target.col, target.row);

    let newCol, newRow, newDir = fol.dir;
    if (dist <= 1) {
      newCol = target.col;
      newRow = target.row;
      newDir = target.dir;
    } else {
      const chaseDir = bestDirToward(fol.col, fol.row, target.col, target.row);
      const next = hexNeighbor(fol.col, fol.row, chaseDir);
      if (next && next.col >= 0 && next.col < COLS && next.row >= 0) {
        newCol = next.col;
        newRow = next.row;
        newDir = chaseDir;
      }
    }
    ahead.path.shift();
    // 入る先がふさがっていたら、ぶつからずにその場で待つ（次の移動で追いつく）
    if (newCol === undefined || hexBlocked(fol, newCol, newRow)) continue;
    fol.path = fol.path || [];
    fol.path.push({col: fol.col, row: fol.row, dir: fol.dir});
    if (!fol.cannotTurn && newDir !== fol.dir) {
      fol.dir = newDir;
      fol.turnCount = (fol.turnCount || 0) + 1; // 回頭数記録（砲撃修正用）
    }
    fol.col = newCol;
    fol.row = newRow;
  }
  if (chain.length > 1) {
    const last = chain[chain.length - 1];
    if (last.path && last.path.length > 0) last.path = [];
  }
}

function finishMove() {
  // 最低移動力チェック
  const minSpd = moveMinimum(moving);
  const used = moveLimit(moving) - moving.remainMove;
  if (used > 0 && used < minSpd) {
    alert(`${moving.name}: 最低移動力は${minSpd}です（現在${used}消費）。あと${minSpd - used}移動してください。`);
    return;
  }
  moving.remainMove = 0;
  const idx = jpFleet.indexOf(moving);
  movedShips.add(idx);
  parent.postMessage({type:'ACTION_DONE', shipIndex:idx}, '*');
  setInfo(`${moving.name} 移動完了`);
  setMoveBar('');
  moving = null;
  undoStack = [];
  document.getElementById('btnUndo').disabled = true;
  renderList();
  pushState();

  checkAllMoved();
}

// 全艦の移動完了チェック（自動donePhaseはしない — ユーザーがボタンで確定）
function checkAllMoved() {
  const allDone = jpFleet.every((s, i) => {
    if (!canShipMove(s)) return true;  // 移動不可は自動完了扱い
    return movedShips.has(i);
  });
  if (allDone) {
    setInfo('全艦の移動完了！ 「次フェーズへ」で確定');
  }
}

function pushState() {
  state.jpFleet = jpFleet;
  state.usFleet = usFleet;
  localStorage.setItem('hubState', JSON.stringify(state));
  parent.postMessage({ type:'STATE_UPDATE',
    jpFleet, usFleet,
    jpDetected:state.jpDetected, usDetected:state.usDetected,
    jpFreeMove:state.jpFreeMove, usFreeMove:state.usFreeMove,
    contactMade:state.contactMade,
    movedShips: Array.from(movedShips)
  }, '*');
}

// hub.htmlからのマップクリック選択を受信
window.addEventListener('message', function(e) {
  var msg = e.data;
  if (!msg) return;
  if (msg.type === 'MAP_SELECT_SHIP' && state && state.jpFreeMove) {
    var shipName = state.jpFleet[msg.index] && state.jpFleet[msg.index].name;
    var idx = jpFleet.findIndex(function(s) { return s.name === shipName; });
    if (idx >= 0) clickShip(idx);
  }
});

function donePhase(fromStraight) {
  pdbg(`donePhase呼び出し: fromStraight=${fromStraight} phase=${state.phase} movedShips=${movedShips.size}/${jpFleet.length}`);
  // 未移動艦チェック（日本軍手動移動モード時のみ、直進モードからは除外）
  if (!fromStraight && state.jpFreeMove && isJPMoving()) {
    // 現在操作中の艦を確定
    if (moving) {
      const idx = jpFleet.indexOf(moving);
      movedShips.add(idx);
      moving = null;
    }
    // 一時保存中の艦も確定（shipStatesに残っている分→位置を復元して確定）
    for (const name in shipStates) {
      const saved = shipStates[name];
      const ship = jpFleet.find(s => s.name === name);
      if (ship && saved) {
        ship.col = saved.col;
        ship.row = saved.row;
        ship.dir = saved.dir;
        const idx = jpFleet.indexOf(ship);
        movedShips.add(idx);
      }
      delete shipStates[name];
    }
    const unmoved = jpFleet.filter((s, i) => canShipMove(s) && !movedShips.has(i));
    if (unmoved.length > 0) {
      const names = unmoved.map(s => s.name).join(', ');
      if (!confirm(`${unmoved.length}隻が未移動です（${names}）。\n未移動艦は直進します。よろしいですか？`)) {
        return;
      }
      // 未移動艦を直進させる
      allStraight();
    }
  }
  if (moving) {
    const idx = jpFleet.indexOf(moving);
    movedShips.add(idx);
    moving = null;
  }
  // デバッグ: 最終状態
  dumpFleet('JP最終', jpFleet);
  dumpFleet('US最終', usFleet);
  // 同一ヘクス残留チェック
  markSharedHex();
  pushState();
  parent.postMessage({ type:'PHASE_DONE' }, '*');
}

// Keyboard
document.addEventListener('keydown', e => {
  if (!state || !state.jpFreeMove) return; // 直進モード中はキー無効

  // 方向転換キー（147963）
  const dirs = {'6':6,'4':4,'9':9,'3':3,'7':7,'1':1};
  if (dirs[e.key] !== undefined) {
    e.preventDefault();
    turnTo(dirs[e.key]);
    return;
  }

  // 直進キー（5）
  if (e.key === '5') {
    e.preventDefault();
    moveForward();
    return;
  }

  // やり直し（Backspace / z）
  if (e.key === 'Backspace' || e.key === 'z') {
    e.preventDefault();
    doUndo();
    return;
  }

  if (e.key === 'Tab') {
    e.preventDefault();
    const curIdx = moving ? jpFleet.indexOf(moving) : -1;
    // 次の未移動艦を探す
    const moveable = jpFleet
      .map((s, i) => ({ship: s, idx: i}))
      .filter(x => canShipMove(x.ship) && x.ship !== moving &&
        (!movedShips.has(x.idx) || shipStates[x.ship.name]));
    if (moveable.length === 0) return;
    let next = moveable.find(x => x.idx > curIdx);
    if (!next) next = moveable[0];
    clickShip(next.idx);  // clickShipで自動的に現在の艦を保存→次へ
  }
});

init();
</script>
