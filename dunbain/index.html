<!DOCTYPE html>
<html lang="ja">
<head>
<script defer src="../board-zoom.js"></script>
<meta charset="UTF-8">
<title>聖戦士ダンバイン - オーラバトラー</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; color:#eee; font-family:'Hiragino Sans','Meiryo',sans-serif; display:flex; flex-direction:column; height:100vh; overflow:hidden; }

/* 上部バー */
#topBar { display:flex; align-items:center; gap:12px; padding:6px 12px; background:#111; border-bottom:1px solid #333; font-size:13px; min-height:36px; flex-wrap:wrap; }
#topBar .label { color:#888; }
#topBar .val { color:#c8a020; font-weight:bold; }
.debug-log-btn {
  margin-left:4px; padding:4px 8px; font-size:10px; cursor:pointer;
  background:#2a2a38; color:#9ab; border:1px solid #444; border-radius:4px;
}
.debug-log-btn:hover { background:#333348; color:#ccc; }
#topBar .phase { color:#4c8; }
#topBar .unit-name { color:#eee; font-size:14px; }

/* メインレイアウト */
#main { display:flex; flex:1; overflow:hidden; }
#mapWrap { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; }
#mapArea { flex:1; position:relative; overflow:hidden; background:#102634; border:2px solid #555; border-radius:5px; }
#mapArea svg { width:100%; height:100%; }
.counter-name { text-anchor:middle; fill:#fff; stroke:#172335; stroke-width:2px; paint-order:stroke fill; font:700 7.5px system-ui,sans-serif; pointer-events:none; }
.counter-status { fill:#ffde7a; stroke:#172335; stroke-width:2.4px; paint-order:stroke fill; font:800 9px system-ui,sans-serif; }
#mapArea #fxSvg { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:8; overflow:visible; }

/* 右パネル上段の操作欄 */
.map-hud { flex:0 0 auto; max-height:52%; overflow:auto; border-bottom:1px solid #3a3a4f; }
.map-hud-panel { padding:10px 12px; }
.map-hud-title { color:#e3be68; font-size:13px; font-weight:700; margin-bottom:7px; }
.map-hud-actions { display:flex; flex-wrap:wrap; gap:5px; }
.map-hud-actions .action-btn { flex:1 1 95px; width:auto; margin:0; padding:6px 8px; text-align:left; }
.map-hud-panel .action-btn { font-size:11px; }
.map-hud-panel.ranged-pick-target { box-shadow:inset 3px 0 #60a5da; }
.move-input-row { display:flex; flex-wrap:wrap; align-items:center; gap:5px 8px; margin:7px 0; }
.move-input-row label { color:#d4dceb; font-size:11px; }
.move-input-row #moveInput { flex:1; width:80px; min-width:60px; margin:0; }
.map-hud .move-cross-grid { display:flex; gap:4px; max-width:none; }
.map-hud .move-cross-wrap { margin:6px 0; }
.map-hud .move-pad-btn { flex:1; min-height:26px; border-radius:5px; height:auto; }
.map-hud .move-pad-btn small { display:inline; margin-left:4px; }
.map-hud .move-btns button { margin:0; }

/* マップ内に戦闘結果を載せる */
.map-combat-anchored {
  position:absolute; left:0; right:0; top:0; bottom:0;
  pointer-events:none; z-index:14;
}
.map-combat-anchored #popupOverlay {
  display:none; position:absolute; inset:0; width:100%; height:100%;
  background:rgba(0,0,0,0.5); pointer-events:auto; z-index:1;
}
.map-combat-anchored #combatPopup {
  display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  background:#222; border:2px solid #c8a020; border-radius:8px; padding:14px 16px 16px;
  z-index:2; min-width:280px; max-width:min(480px, 94vw); max-height:min(72vh, 420px); overflow-y:auto;
  box-shadow:0 0 30px rgba(0,0,0,0.8); pointer-events:auto;
}

/* ズームバー */
.zoom-bar { display:flex; align-items:center; justify-content:center; flex:0 0 auto; min-height:24px; gap:4px; }
.zoom-bar button { width:30px; height:20px; background:#444; border:none; color:#eee; cursor:pointer; font-size:14px; border-radius:3px; }
.zoom-bar button:hover { background:#666; }
.zoom-bar span { color:#888; font-size:11px; width:40px; text-align:center; }

/* 右パネルは操作欄の下で味方・敵を縦にスクロール */
#rightPanel { width:320px; min-width:270px; max-width:44vw; display:flex; flex-direction:column; background:#181828; border-left:1px solid #333; overflow:hidden; }
#unitRoster { flex:1; min-height:0; overflow-y:auto; padding:0 8px 10px; }
.right-panel-banner { display:block; flex:none; width:min(216px, calc(100% - 16px)); margin:4px auto 8px; }
.right-panel-banner img { display:block; width:100%; height:auto; }
.roster-heading { position:sticky; top:0; z-index:1; margin:0; padding:6px 3px; font-size:12px; color:#cbd6ea; background:#181828; }
.roster-card { margin:0 0 5px; padding:5px 6px 6px; border:1px solid #394057; border-left:3px solid #6486af; border-radius:5px; background:#1e2333; }
.roster-card.drake { border-left-color:#d16b6f; }
.roster-card.given { border-left-color:#6daaf0; }
.roster-card.active { border-top-color:#c8a020; border-right-color:#c8a020; border-bottom-color:#c8a020; }
.roster-card.inspected { background:#27334a; }
.roster-title { display:flex; justify-content:space-between; gap:6px; align-items:baseline; }
.roster-title strong { font-size:12px; font-weight:700; }
.roster-title span { font-size:10px; color:#aebbd0; text-align:right; }
.roster-meta, .roster-weapons { margin-top:2px; color:#aebbd0; font-size:10px; line-height:1.25; }
.roster-weapons { color:#c1c9d8; overflow-wrap:anywhere; }
.roster-weapon-loss { color:#ffad9f; font-weight:700; }
.roster-state { color:#d9bb72; }
.roster-card.lost { opacity:.64; }
.roster-parts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:3px 7px; margin-top:5px; }
.roster-part { display:block; min-width:0; font-size:9px; }
.roster-part-label { display:flex; justify-content:space-between; gap:4px; white-space:nowrap; line-height:1.15; }
.roster-part-label span:first-child { overflow:hidden; text-overflow:ellipsis; }
.roster-part-track { display:block; height:3px; margin-top:2px; border-radius:2px; background:#373f52; }
.roster-part-fill { display:block; height:100%; border-radius:2px; background:#51bc90; }
.roster-part.damaged .roster-part-fill { background:#e4ad56; }
.roster-part.destroyed { color:#ff9696; }
.roster-part.destroyed .roster-part-track { background:#933f4c; }
.roster-empty { padding:5px 3px 9px; color:#9da7bb; font-size:11px; }

/* アクションパネル */
.action-btns { display:flex; flex-wrap:wrap; gap:4px; }
.action-btn { padding:6px 10px; background:#333; border:1px solid #555; border-radius:4px; color:#eee; cursor:pointer; font-size:12px; }
.action-btn:hover { background:#444; border-color:#888; }
.action-btn.selected { background:#3a3a2a; border-color:#c8a020; color:#c8a020; }
.action-btn:disabled { opacity:0.3; cursor:not-allowed; }

/* 移動入力 */
#moveInput { width:100%; padding:8px; background:#222; border:1px solid #555; border-radius:4px; color:#0f0; font-family:monospace; font-size:16px; text-transform:uppercase; }
#moveInput.preview { border-color:#4c8; }
#moveInfo { color:#888; font-size:11px; margin-top:4px; }
.move-btns { display:flex; gap:6px; margin-top:6px; }
.move-btns button { flex:1; padding:6px; border:none; border-radius:4px; cursor:pointer; font-size:12px; }
#moveConfirm { background:#4c8; color:#000; }
#moveCancel { background:#555; color:#eee; }
#moveSkip { background:#664; color:#eee; }

/* 移動十字パッド */
.move-cross-wrap { margin:10px 0 6px; user-select:none; }
.move-cross-hint { color:#888; font-size:10px; margin-bottom:6px; text-align:center; line-height:1.3; }
.move-cross-grid {
  display:grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 46px 46px 46px;
  gap:6px;
  max-width:186px;
  margin:0 auto;
}
.move-pad-btn {
  width:100%; height:100%; min-height:44px;
  padding:4px 2px;
  background:#2a3d48; border:1px solid #5a7a88; border-radius:8px;
  color:#dff8ff; font-size:12px; font-weight:bold; cursor:pointer;
  line-height:1.2;
}
.move-pad-btn:hover:not(:disabled) { background:#3a5565; border-color:#7ec8e0; color:#fff; }
.move-pad-btn:disabled { opacity:0.32; cursor:not-allowed; }
.move-pad-btn small { display:block; font-size:9px; font-weight:normal; opacity:0.8; margin-top:2px; }
.move-pad-f { grid-column:2; grid-row:1; }
.move-pad-l { grid-column:1; grid-row:2; }
.move-pad-r { grid-column:3; grid-row:2; }
.move-pad-b { grid-column:2; grid-row:3; }

/* 戦闘パネル */
.combat-title { color:#c8a020; font-size:12px; font-weight:bold; margin-bottom:6px; }
.target-btn { display:block; width:100%; padding:8px; margin:4px 0; background:#2a2a3e; border:1px solid #555; border-radius:4px; color:#eee; cursor:pointer; font-size:12px; text-align:left; }
.target-btn:hover { background:#3a3a4e; border-color:#888; }
.weapon-btn { display:inline-block; padding:4px 10px; margin:2px; background:#333; border:1px solid #555; border-radius:3px; color:#eee; cursor:pointer; font-size:11px; }
.weapon-btn:hover { background:#444; }
.weapon-btn.selected { border-color:#c8a020; color:#c8a020; }
.melee-zone-btn { padding:6px 12px; margin:2px; background:#333; border:1px solid #555; border-radius:4px; color:#eee; cursor:pointer; font-size:12px; }
.melee-zone-btn:hover { background:#444; }

/* 戦闘結果ポップアップ（実体は .map-combat-anchored 内。ここはタイポグラフィのみ） */
#combatPopup .popup-title { color:#c8a020; font-size:14px; font-weight:bold; margin-bottom:10px; }
.popup-line { margin:4px 0; font-size:12px; }
.popup-hit { color:#4c8; }
.popup-miss { color:#888; }
.popup-damage { color:#c44; }
.popup-defend { color:#48c; }
#combatPopup button { margin-top:12px; padding:8px 20px; background:#c8a020; color:#000; border:none; border-radius:4px; cursor:pointer; font-weight:bold; }
#popupOkBtn { display:block; }

/* 射撃ポップアップ：段階ダイス演出（1スロット入れ替え・縦占有を抑える） */
#rangedSeqSlot { min-height:108px; }
.ranged-seq-phase { margin:8px 0; padding:10px 8px; background:rgba(0,0,0,0.25); border-radius:6px; border:1px solid #333; }
.ranged-seq-label { color:#8cf; font-size:11px; font-weight:bold; margin-bottom:8px; letter-spacing:0.02em; }
.ranged-seq-outcome { margin-top:10px; min-height:1.2em; }
/* 結果テキストをダイスより大きく */
.ranged-seq-outcome .popup-line {
  font-size:17px; line-height:1.5; margin:8px 0;
}
.ranged-seq-outcome .popup-line b {
  font-size:19px; font-weight:800;
}
.ranged-seq-outcome .popup-hit { font-size:26px; font-weight:bold; letter-spacing:0.04em; }
.ranged-seq-outcome .popup-miss { font-size:26px; font-weight:bold; letter-spacing:0.04em; }
.ranged-seq-outcome .popup-damage { font-size:22px; font-weight:bold; }
.ranged-seq-weaponline { font-size:14px !important; margin-bottom:10px !important; color:#ccc; }
.combat-dice-pair, .combat-dice-single { display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; min-height:44px; }
.combat-die {
  display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px;
  background:linear-gradient(145deg,#2a2a38,#1a1a24); border:2px solid #555; border-radius:7px;
  font-size:17px; font-weight:bold; color:#ddd; box-shadow:0 2px 6px rgba(0,0,0,0.4);
  transition:transform 0.12s ease, border-color 0.2s;
}
.combat-die-lg { width:40px; height:40px; font-size:21px; }
.combat-die-settled { border-color:#c8a020; color:#ffd76a; transform:scale(1.05); box-shadow:0 0 12px rgba(200,160,32,0.3); }
.combat-dice-plus, .combat-dice-eq { color:#666; font-size:14px; font-weight:bold; }
.combat-dice-sum { font-size:16px; font-weight:bold; color:#b96; min-width:2ch; }
.ranged-seq-summary { margin-top:14px; padding-top:10px; border-top:1px solid #444; font-size:13px; color:#bbb; line-height:1.55; }
.ranged-seq-summary b { font-size:15px; color:#eee; }
.ranged-seq-summary .popup-line { font-size:16px; line-height:1.5; margin:6px 0; color:#ccc; }
.ranged-seq-summary .popup-line b { font-size:17px; }
.ranged-seq-summary .popup-hit { font-size:20px; }
.ranged-seq-summary .popup-miss { font-size:20px; }
.ranged-seq-summary .popup-damage { font-size:18px; }

/* 受け選択 */
.defense-btns { display:flex; gap:10px; margin-top:12px; }
.defense-btns button { flex:1; padding:10px; border:none; border-radius:4px; cursor:pointer; font-size:13px; }

/* 勝敗オーバーレイ */
#victoryOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:25000; justify-content:center; align-items:center; flex-direction:column; }
#victoryOverlay.show { display:flex; }
#victoryOverlay .result { font-size:3em; font-weight:bold; color:#c8a020; text-shadow:0 0 20px rgba(200,160,32,0.5); }
#victoryOverlay .detail { color:#aaa; font-size:1.2em; margin-top:10px; }
#victoryOverlay button { margin-top:30px; padding:12px 30px; background:#c8a020; color:#000; border:none; border-radius:6px; font-size:1.1em; cursor:pointer; }

/* オーラ力フェイズ表示（要約用・通常は非表示） */
#auraPhasePanel { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#222; border:2px solid #c8a020; border-radius:8px; padding:20px; z-index:1000; min-width:400px; }
.aura-result { margin:6px 0; font-size:13px; }

/* ターン開始のオーラ判定 */
#turnStartDiceOverlay {
  display:none; position:fixed; inset:0; z-index:1500;
  align-items:center; justify-content:center; padding:8px;
  background:rgba(0,0,0,0.82);
}
#turnStartDiceOverlay.show { display:flex; }
.tsd-panel {
  display:flex; flex-direction:column; gap:6px;
  width:min(720px,100%); max-height:78vh; max-height:min(78dvh,520px); min-height:0;
  padding:8px 10px; border:1px solid #b99644; border-radius:8px;
  background:#222; box-shadow:0 8px 28px rgba(0,0,0,.5);
}
.tsd-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 12px; flex:0 0 auto; }
.tsd-title { font-size:14px; color:#e9c36f; font-weight:700; }
.tsd-phase-hint { color:#8bcfab; font-size:11px; min-height:1.4em; }
#tsdTableWrap { flex:0 1 auto; min-height:0; overflow:auto; border:1px solid #444; border-radius:4px; }
#tsdTableWrap:focus-visible { outline:2px solid #dfba67; outline-offset:1px; }
.tsd-actions { display:flex; flex:0 0 auto; gap:6px; justify-content:flex-end; }
.tsd-actions button {
  padding:4px 12px; min-height:28px; border:none; border-radius:4px;
  cursor:pointer; font-size:12px; font-weight:700;
}
#tsdNext { background:#c8a020; color:#000; }
#tsdSkip { background:#444; color:#eee; }
.aura-table { width:100%; min-width:400px; border-collapse:separate; border-spacing:0; color:#eee; font-size:11px; }
.aura-cell { padding:3px 7px; height:34px; vertical-align:middle; border-bottom:1px solid #373743; }
.aura-table thead th {
  position:sticky; top:0; z-index:1; height:24px;
  background:#33313a; color:#ddd; font-weight:600;
}
.aura-name { width:30%; color:#ddd; text-align:left; font-weight:700; line-height:1.2; }
.aura-name small { display:block; color:#aeb4c0; font-size:10px; font-weight:400; }
.aura-step { text-align:center; white-space:nowrap; }
.aura-final { text-align:center; white-space:nowrap; }
.aura-row:last-child .aura-cell { border-bottom:0; }
.tsd-cell-out, .tsd-final-block { display:inline-flex; align-items:baseline; gap:4px; }
.tsd-cell-value, .tsd-mini-flicker, .tsd-mini-settled, .aura-final-num { color:#ffdd75; font-size:15px; font-weight:800; }
.tsd-mini-flicker { display:inline-block; animation:tsdMiniShake .09s infinite; }
@keyframes tsdMiniShake {
  0%,100% { transform:rotate(-5deg); }
  50% { transform:rotate(5deg); }
}
.tsd-cell-note, .tsd-aura-prev { color:#aeb4c0; font-size:10px; }
.tsd-cell-muted { color:#888; }
.tsd-final-up { color:#83df9f; }
.tsd-final-down { color:#ff9898; }
.tsd-rank-badge { padding:0 5px; border-radius:3px; font-size:11px; font-weight:800; }
.tsd-rank-a { background:rgba(148,0,211,0.45); color:#f0d8ff; border:1px solid #a020f0; }
.tsd-rank-b { background:rgba(30,60,220,0.45); color:#d0dcff; border:1px solid #5555ff; }
.tsd-rank-c { background:rgba(0,160,220,0.45); color:#dff8ff; border:1px solid #00bfff; }
.tsd-rank-d { background:rgba(0,170,90,0.45); color:#e0ffe8; border:1px solid #22cc66; }
.tsd-rank-e { background:rgba(200,170,0,0.45); color:#fff8c8; border:1px solid #ddc000; }
.tsd-rank-f { background:rgba(220,100,0,0.45); color:#ffe8d0; border:1px solid #ff8c00; }
.tsd-rank-g { background:rgba(200,40,40,0.45); color:#ffe0e0; border:1px solid #ff4444; }
.tsd-row-liberation .aura-name, .tsd-row-liberation .aura-final { background:#253d3d; }
.tsd-row-liberation .aura-final-num { color:#96ede0; }
.success-text { color:#83df9f; font-weight:700; }
.fail-text { color:#ff9898; font-weight:700; }
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="9941d848-0f49-4aac-a8b1-adaa766abfcd"></script>
</head>
<body>

<div id="topBar">
  <span class="label">ターン</span><span class="val" id="turnNum">1</span>
  <span class="label">フェイズ</span><span class="phase" id="phaseName">-</span>
  <span class="label">ユニット</span><span class="unit-name" id="activeUnitName">-</span>
  <span style="flex:1"></span>
  <span class="label" id="actionLabel"></span>
    <div class="zoom-bar">
      <button onclick="zoomMap(-1)">&#8722;</button>
      <span id="zoomLabel">100%</span>
      <button onclick="zoomMap(1)">&#43;</button>
      <button type="button" onclick="fitBoardOnScreen()" style="width:48px;">全体</button>
    </div>
  <a class="debug-log-btn" href="scenario.html" id="scenarioBackLink" style="text-decoration:none;">シナリオ</a>
  <button type="button" class="debug-log-btn" id="debugLogSaveBtn" title="デバッグ用・全ログをJSONでダウンロード">ログ保存</button>
  <button type="button" class="debug-log-btn" id="debugLogClearBtn" title="メモリ上のログバッファを空にする">ログ消去</button>
</div>

<div id="main">
  <div id="mapWrap">
    <div id="mapArea">
      <svg id="mapSvg"></svg>
      <svg id="fxSvg" aria-hidden="true"></svg>
    </div>
    <div id="mapCombatAnchored" class="map-combat-anchored">
      <div id="popupOverlay" onclick="closePopup()"></div>
      <div id="combatPopup">
        <div class="popup-title" id="popupTitle"></div>
        <div id="popupContent"></div>
        <button type="button" id="popupOkBtn" onclick="closePopup()">OK</button>
      </div>
    </div>

  </div>
  <div id="rightPanel">
    <section id="mapHud" class="map-hud" aria-label="行動操作"><div id="mapHudPanel" class="map-hud-panel"></div></section>
    <section id="unitRoster" aria-label="味方と敵の機体一覧"></section>
    <a class="right-panel-banner" href="https://peasant-homepage.savorymedal9.chatgpt.site/?lang=ja" target="_blank" rel="noopener">
      <img src="../peasant/banner-ja-compact.webp" width="216" height="72" alt="Pe@sant — ブラウザで楽しむクラシック・ボードウォーゲーム">
    </a>
  </div>
</div>



<div id="auraPhasePanel">
  <div style="color:#c8a020;font-weight:bold;font-size:14px;margin-bottom:10px;">オーラ力フェイズ（要約）</div>
  <div id="auraResults"></div>
  <button style="margin-top:12px;padding:8px 20px;background:#c8a020;color:#000;border:none;border-radius:4px;cursor:pointer;" onclick="endAuraPhase()">OK</button>
</div>

<div id="turnStartDiceOverlay">
  <div class="tsd-panel">
    <div class="tsd-header">
      <div class="tsd-title" id="tsdTitle">オーラ力判定</div>
      <div class="tsd-phase-hint" id="tsdPhaseHint" aria-live="polite"></div>
    </div>
    <div id="tsdTableWrap" tabindex="0" aria-label="機体ごとの判定結果"></div>
    <div class="tsd-actions">
      <button type="button" id="tsdNext" onclick="turnStartConfirmFinish()">OK</button>
      <button type="button" id="tsdSkip" onclick="turnStartSkipAll()">演出スキップ</button>
    </div>
  </div>
</div>

<div id="victoryOverlay">
  <div class="result" id="victoryResult"></div>
  <div class="detail" id="victoryDetail"></div>
  <div id="victoryRedirectHint" style="display:none;color:#888;font-size:13px;margin-top:14px;">まもなくキャンペーン画面に戻ります…</div>
  <button type="button" id="victoryBackBtn">シナリオ選択に戻る</button>
</div>

<script src="data.js"></script>
<script src="シナリオ.js?v=sho-drumlo"></script>
<script src="qlearning.js"></script>
<script>
// ===== ゲーム状態 =====
let units = [];
let gameTurn = 1;
let turnOrder = [];
let currentOrderIndex = 0;
let currentPhase = 'INIT'; // AURA_POWER, ACTION_SELECT, MOVE, RANGED, MELEE, PLAN_READY …
let turnSubPhase = 'planning'; // planning | resolving | review
let resolutionIndex = 0;
let planSnapshot = null;
/** 同時移動解決直後に描く全員分の経路 [{ unitId, team, hexes, canceled }] */
let moveRevealPaths = null;
let playerSide = 'given';
let scenario = null;
let gameOver = false;
/** true のとき両軍とも AI。オーラ表・戦闘・勝利のモーダルは出さずログとマップのみ */
let spectatorMode = false;
/** 観戦: 計画完了後、移動解決までの間隔（オーバーレイは出さない） */
const SPECTATOR_EXECUTE_DELAY_MS = 800;
let spectatorExecuteDelayMs = SPECTATOR_EXECUTE_DELAY_MS;
let spectatorAutoExecuteTimer = null;
/** URL ?trainEpisodes=1000 など：観戦で連続対戦（Q学習は ql=1 と併用） */
let qlTrainEpisodesTarget = 0;
let qlTrainEpisodesDone = 0;
let qlTrainStats = { given: 0, drake: 0, draw: 0 };

// マップ状態（F16と同じ方式）
const hexSize = 25;
const hStep = 1.5 * hexSize;
const vStep = Math.sqrt(3) * hexSize;
let cameraX = 0, cameraY = 0;
let zoomLevel = 1;
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let mapFitted = true;
let mapListenersInstalled = false;

const ART_DIRECTORY = 'images/vassal/';
const BOARD_ARTWORK = {
  wing: { file: 'board-wing.png', width: 3200, height: 2762, dx: 133.65, dy: 154.15, x0: 135, y0: 69 },
  battler: { file: 'board-battler.png', width: 3236, height: 2762, dx: 134.32, dy: 155, x0: 143, y0: 59 },
};
let boardArtwork = 'wing';
const nativeBoards = Object.values(BOARD_ARTWORK);
const mapCols = Math.min(...nativeBoards.map(board => Math.ceil((board.width - board.x0) / board.dx)));
const mapRows = Math.min(...nativeBoards.map(board => Math.ceil((board.height - board.y0) / board.dy)));

function isPlayableBoardHex(col, row) {
  if (col < 0 || col >= mapCols || row < 0 || row >= mapRows) return false;
  // 最下段の奇数列は半マス下がり、どちらの原図でも中心が紙面の外になる。
  return row < mapRows - 1 || col % 2 === 0;
}

function fitStartingFormation(definitions, dimensions) {
  if (!definitions.length || (dimensions.mapCols <= mapCols && dimensions.mapRows <= mapRows)) {
    return definitions;
  }
  function shiftToBoard(axis, oldSize, lastIndex, parityStep) {
    if (oldSize - 1 <= lastIndex) return 0;
    const coordinates = definitions.map(unit => unit[axis]);
    const first = Math.min(...coordinates);
    const last = Math.max(...coordinates);
    const midpoint = (first + last) / 2;
    const target = midpoint * lastIndex / (oldSize - 1);
    const shift = Math.round((target - midpoint) / parityStep) * parityStep;
    const low = Math.ceil(-first / parityStep) * parityStep;
    const high = Math.floor((lastIndex - last) / parityStep) * parityStep;
    return Math.max(low, Math.min(high, shift));
  }
  // 編隊全体を移動して機体同士の間隔を保つ。列は偶数刻みでずらす。
  const dx = shiftToBoard('x', dimensions.mapCols, mapCols - 1, 2);
  const dy = shiftToBoard('y', dimensions.mapRows, mapRows - 2, 1);
  return definitions.map(unit => ({ ...unit, x: unit.x + dx, y: unit.y + dy }));
}

// ファイル名の機種番号と、モジュールに収録されている駒の枚数。
const COUNTER_ARTWORK = {
  'ダンバイン A': ['01', 5], 'ダンバイン B': ['02', 5],
  'ビルバイン': ['03A', 2],
  'ダーナオシー A': ['04', 3], 'ダーナオシー B': ['05', 1],
  'ボゾン A': ['06', 8], 'ボゾン B': ['07', 8],
  'ボチューン A': ['08', 7], 'ボチューン B': ['09', 8], 'ゲド': ['10', 7],
  'ドラムロ A': ['11', 8], 'ドラムロ B': ['12', 8], 'ビランビー': ['13', 7],
  'バストール A': ['14', 4], 'バストール B': ['15', 4], 'レプラカーン': ['16', 4],
  'ビアレス': ['17', 7], 'ライネック': ['18', 7], 'ズワース': ['19', 7], 'ガラバ': ['20', 7],
  'フォウ': ['21', 6], 'バラウ': ['22', 10], 'ズロン': ['23', 10], 'グナン': ['24', 12],
  'ドロ': ['25', 12], 'タンギー': ['26', 12], 'ブブリィ': ['27', 3], 'ゼラーナ': ['28', 1],
};

function counterArtworkPath(unit) {
  if (unit.machine === 'ボゾン(マーベル用)') return ART_DIRECTORY + 'U_06_00.png';
  const family = COUNTER_ARTWORK[unit.machine];
  if (!family) return null;
  const [code, count] = family;
  const variant = unit.machine === 'ビルバイン' && unit.type === 'WC' ? '03W' : code;
  const number = String((unit.counterIndex || 0) % count + 1).padStart(2, '0');
  return ART_DIRECTORY + `U_${variant}_${number}.png`;
}

// 移動プレビュー
let previewPath = [];
let previewStepStates = []; // [{x,y,dir}] コマンド各段階後（地図の矢印用）
let moveCost = 0;
let reachableHexes = []; // { x, y, dir, cost, path } 全到達状態（同マスで複数向きあり）
let selectedMoveTarget = null; // クリック選択された移動先
let dirChoices = []; // 移動先での向き候補

// 戦闘状態
let selectedWeapon = null;
let rangedAwaitingTarget = false; // 射撃：武器選択後、敵ユニットクリックで発射
let rangedShotInProgress = false; // 射撃：1ターン1発・連打防止
let selectedTarget = null;
let selectedMeleeMethod = null;
let selectedMeleeTier = null; // 'high'|'mid'|'low' ＝ 上中下段
let selectedMeleeAttackPart = null; // 段内の攻撃箇所（頭・手・胴…）受け率表の同異判定に使用
let selectedSwordSide = null; // 'left'|'right' 格闘＋剣系武装時のみ
let popupAutoCloseTimer = null;
/** キャンペーン終了後の自動戻り */
let victoryRedirectTimer = null;
/** 参照パネルに表示中のユニット id（耐久・状態を戦闘後すぐ再描画） */
let inspectTargetUnitId = null;

/** デバッグ用：後から追える行動ログ（addLog がすべて蓄積） */
const DEBUG_LOG_MAX = 10000;
let debugLogBuffer = [];

// ターン開始オーバーレイ（全員テーブル・段階表示／123.html イメージ）
let turnStartTableRows = null;
let turnStartTableAbort = false;

// 方向定義（flat-top hex, F16と同じ）
// 0=上(N), 1=右上(NE), 2=右下(SE), 3=下(S), 4=左下(SW), 5=左上(NW)
const DIR_DX = [0, 1, 1, 0, -1, -1];
const DIR_DY_EVEN = [-1, -1, 0, 1, 0, -1]; // 偶数列(c%2==0)
const DIR_DY_ODD = [-1, 0, 1, 1, 1, 0];   // 奇数列(c%2==1)

// ===== 初期化 =====
let simultaneousDamage = [];

function initGame() {
  simultaneousDamage = [];
  moveRevealPaths = null;
  if (victoryRedirectTimer) {
    clearTimeout(victoryRedirectTimer);
    victoryRedirectTimer = null;
  }
  if (spectatorAutoExecuteTimer) {
    clearTimeout(spectatorAutoExecuteTimer);
    spectatorAutoExecuteTimer = null;
  }
  const cfg = JSON.parse(sessionStorage.getItem('dunbineConfig') || '{}');
  const duel = new URLSearchParams(window.location.search).get('scenarioId') === 'duel_sho_drumlo';
  playerSide = duel ? 'given' : cfg.playerSide || 'given';
  spectatorMode = !duel && !!cfg.spectatorMode;
  try {
    const sp = new URLSearchParams(window.location.search || '');
    if (!duel && (sp.get('spectator') === '1' || sp.get('watch') === '1')) spectatorMode = true;
    if (sp.get('ql') === '1') localStorage.setItem('dunbain_ql', '1');
    if (sp.get('ql') === '0') localStorage.setItem('dunbain_ql', '0');
    const sid = sp.get('scenarioId');
    if (sid && typeof SCENARIOS !== 'undefined' && SCENARIOS[sid]) cfg.scenarioId = sid;
    const mc = sp.get('musouEnemyCount');
    if (mc != null && mc !== '') cfg.musouEnemyCount = parseInt(mc, 10) || cfg.musouEnemyCount || 20;
    const teRaw = sp.get('trainEpisodes') || sp.get('qlTrain');
    const te = teRaw != null && teRaw !== '' ? parseInt(teRaw, 10) : 0;
    if (spectatorMode && te > 0) {
      spectatorExecuteDelayMs = 0;
      if (sp.get('ql') !== '0') localStorage.setItem('dunbain_ql', '1');
      if (qlTrainEpisodesTarget === 0) {
        qlTrainEpisodesTarget = Math.min(50000, Math.max(1, te));
        qlTrainEpisodesDone = 0;
        qlTrainStats = { given: 0, drake: 0, draw: 0 };
      }
    } else {
      spectatorExecuteDelayMs = SPECTATOR_EXECUTE_DELAY_MS;
      if (!spectatorMode) {
        qlTrainEpisodesTarget = 0;
        qlTrainEpisodesDone = 0;
      }
    }
  } catch (e) { /* ignore */ }
  const scenarioIds = { campaign1:'campaign1', campaign_musou:'campaign1', campaign_gauntlet:'campaign1' };
  const configuredScenario = Object.hasOwn(scenarioIds, cfg.scenarioId) ? scenarioIds[cfg.scenarioId] : 'practice';
  scenario = getScenario(duel ? 'duel_sho_drumlo' : configuredScenario);
  boardArtwork = duel ? 'battler' : Object.hasOwn(BOARD_ARTWORK, cfg.boardArtwork) ? cfg.boardArtwork : 'wing';
  if (duel) document.getElementById('scenarioBackLink').href = 'sho-vs-drumlo.html';
  if (typeof window !== 'undefined') window.scenario = scenario;
  if (!duel && !scenario.gauntlet && sessionStorage.getItem('campaignGauntletActive') === '1') {
    clearGauntletSession();
  }
  if (!duel && !scenario.musou && sessionStorage.getItem('musouRunWins') != null) {
    sessionStorage.removeItem('musouRunWins');
  }
  units = [];
  let id = 0;
  let givenDefs = scenario.id === 'practice' ? buildPracticeFormation('given', cfg.practiceForces?.given) : [...(scenario.given || [])];
  let drakeDefs = scenario.id === 'practice' ? buildPracticeFormation('drake', cfg.practiceForces?.drake) : [...(scenario.drake || [])];
  if (duel) {
    const eligiblePilots = ['バーン・バニングス', 'トッド・ギネス', 'ガラリア・ニャムヒー'];
    const pilot = eligiblePilots[Math.floor(Math.random() * eligiblePilots.length)];
    drakeDefs = [{ ...drakeDefs[0], pilot }];
  }
  if (scenario.gauntlet && scenario.gauntletBosses && scenario.gauntletBosses.length) {
    if (sessionStorage.getItem('campaignGauntletActive') !== '1') {
      sessionStorage.setItem('campaignGauntletActive', '1');
      sessionStorage.setItem('campaignGauntletRound', '0');
    }
    const maxI = scenario.gauntletBosses.length - 1;
    const ri = Math.max(0, Math.min(maxI, parseInt(sessionStorage.getItem('campaignGauntletRound') || '0', 10)));
    const boss = scenario.gauntletBosses[ri];
    const sho = {
      pilot: 'ショウ・ザマ', machine: 'ダンバイン A', weapons: ['オーラソード', 'オーラショット'],
      x: Math.floor(scenario.mapCols / 2), y: scenario.mapRows - 3, dir: 0,
    };
    const ex = Math.floor(scenario.mapCols / 2);
    const ey = 2;
    givenDefs = [{ ...sho }];
    drakeDefs = [{ pilot: boss.pilot, machine: boss.machine, weapons: boss.weapons.slice(), x: ex, y: ey, dir: 3 }];
  }
  for (const u of fitStartingFormation(givenDefs, scenario)) {
    units.push(createUnit(id++, u, 'given'));
  }
  if (scenario.musou && typeof buildMusouDrakeDefinitions === 'function') {
    let n = 1;
    try {
      const sp = new URLSearchParams(window.location.search || '');
      const urlMc = sp.get('musouEnemyCount');
      if (urlMc != null && urlMc !== '') {
        n = Math.max(1, Math.min(100, parseInt(urlMc, 10) || 1));
      } else {
        let runWins = parseInt(sessionStorage.getItem('musouRunWins') || '0', 10);
        if (!Number.isFinite(runWins) || runWins < 0) runWins = 0;
        n = Math.min(100, runWins + 1);
      }
    } catch (e) {
      n = 1;
    }
    const playerY = units[0]?.y;
    drakeDefs = buildMusouDrakeDefinitions(n, mapCols, mapRows, playerY);
  }
  for (const u of scenario.musou ? drakeDefs : fitStartingFormation(drakeDefs, scenario)) {
    units.push(createUnit(id++, u, 'drake'));
  }

  if (typeof DunbainQL !== 'undefined') units.forEach(u => DunbainQL.resetUnitLearningScratch(u));

  gameTurn = 1;
  gameOver = false;
  currentPhase = 'INIT';
  turnSubPhase = 'planning';
  buildTurnOrder();
  currentOrderIndex = 0;

  debugLogBuffer.length = 0;
  addLog('debug', `[SESSION_START] scenario="${scenario.name}" id=${scenario.id} spectator=${spectatorMode} side=${playerSide} units=${units.length}`);

  clearInspectPanel();
  initMap();
  syncRightPanelUnitStats();
  if (scenario.gauntlet && scenario.gauntletBosses && sessionStorage.getItem('campaignGauntletActive') === '1') {
    const ri = Math.max(0, Math.min(scenario.gauntletBosses.length - 1, parseInt(sessionStorage.getItem('campaignGauntletRound') || '0', 10)));
    const boss = scenario.gauntletBosses[ri];
    addLog('system', `[ガントレット] 第 ${ri + 1} / ${scenario.gauntletBosses.length} 戦 — 対 ${boss.pilot}（${boss.machine}）`);
  }
  if (scenario.musou && units.filter(u => u.team === 'drake').length) {
    const ec = units.filter(u => u.team === 'drake').length;
    const rw = parseInt(sessionStorage.getItem('musouRunWins') || '0', 10) || 0;
    addLog('system', `[無双] 敵 ${ec}機（連続${rw}波までクリア済み・ベスト記録 ${getMusouBestStreak()}波）`);
  }
  if (spectatorMode) addLog('system', `[観戦] ${scenario.name}（両軍AI）`);
  startAuraPhase();
}

function buildPracticeFormation(team, selections) {
  const defaults = scenario[team];
  if (!Array.isArray(selections) || !selections.length ||
      !selections.every(unit => unit && Object.hasOwn(PILOTS, unit.pilot) &&
        (Object.hasOwn(AURA_BATTLERS, unit.machine) || Object.hasOwn(WING_CALIBERS, unit.machine)))) {
    return defaults;
  }
  const starts = defaults.map(({ x, y, dir }) => ({ x, y, dir }));
  const used = new Set(starts.map(({ x, y }) => `${x},${y}`));
  const { x:anchorX, y:anchorY, dir } = starts[0];
  const extras = [];
  const mid = Math.floor(mapRows / 2);
  const firstRow = team === 'given' ? mid : 0;
  const endRow = team === 'given' ? mapRows - 1 : mid;
  for (let y = firstRow; y < endRow; y++) {
    for (let x = 0; x < mapCols; x++) {
      if (isPlayableBoardHex(x, y) && !used.has(`${x},${y}`)) extras.push({ x, y, dir });
    }
  }
  extras.sort((a, b) => Math.abs(a.y - anchorY) - Math.abs(b.y - anchorY) ||
    Math.abs(a.x - anchorX) - Math.abs(b.x - anchorX));
  starts.push(...extras);
  return selections.slice(0, starts.length).map(({ pilot, machine }, index) => {
    const standard = defaults.find(unit => unit.pilot === pilot && unit.machine === machine);
    const base = getBaseMachineName(machine);
    const weapons = standard?.weapons || Object.keys(MACHINE_RANGED_WEAPONS[base] || {});
    const swords = !standard && AURA_BATTLERS[machine] && machine !== 'ガラバ' && machine !== 'ブブリィ';
    return { ...starts[index], pilot, machine, fixedMachine:true,
      weapons:swords ? ['オーラソード', ...weapons] : [...weapons] };
  });
}

function createUnit(id, def, team) {
  const pilot = PILOTS[def.pilot] || { aura: 3, auraMax: 3 };
  const resolvedMachine = !def.fixedMachine && typeof resolveMachineVariant === 'function'
    ? resolveMachineVariant(def.machine, def.pilot) : def.machine;
  def = Object.assign({}, def, { machine: resolvedMachine });
  const machine = AURA_BATTLERS[def.machine] || WING_CALIBERS[def.machine] || { power: 'e', type: 'AB' };
  const baseName = getBaseMachineName(def.machine);
  const typeKey = machine.type || 'AB';
  const dur = JSON.parse(JSON.stringify(DURABILITY[typeKey] || DURABILITY['AB']));
  if (def.machine === 'ビルバイン' || def.machine === 'ブブリィ') dur['ウイング'] = 4;
  if (def.machine === 'ガラバ' || def.machine === 'ブブリィ') delete dur['頭'];
  if (typeKey === 'AB' && typeof machineBaseHasShield === 'function' && !machineBaseHasShield(baseName)) {
    delete dur['盾'];
  }
  const startAura = pilot.auraBoarding != null ? pilot.auraBoarding : pilot.aura;

  return {
    id, pilot: def.pilot, machine: def.machine, team,
    counterIndex: units.filter(other => other.machine === def.machine).length,
    x: def.x, y: def.y, dir: def.dir || 0,
    currentAura: startAura,
    maxAura: pilot.auraMax,
    pilotCumulativeDamage: 0,
    temporaryPowerAura: null,
    auraLiberated: false,
    basePower: machine.power,
    effectivePower: getEffectivePower(def.machine, startAura),
    weapons: [...(def.weapons || [])],
    ammo: {},
    selectedAction: null,
    previousDeclaredAction: null, // 直前に完了したターンで選んだ行動（射撃の連続選択制限用）
    movementRemaining: 0,
    hasActed: false,
    durability: dur,
    maxDurability: JSON.parse(JSON.stringify(dur)),
    destroyed: {},
    status: 'alive',
    type: typeKey,
    weaponHands: def.weaponHands ? { ...def.weaponHands } : undefined,
    collisionInactiveTurn: null,
    droppedWeaponCount: 0,
  };
}

function canOperateWeapon(unit, weaponName) {
  if (!unit || !weaponName) return false;
  return typeof canOperateWeaponWithHands === 'function'
    ? canOperateWeaponWithHands(unit.destroyed, weaponName, unit.weaponHands, rangedWeaponData(unit, weaponName)?.mount)
    : true;
}

function buildUnitCompactEffects(unit) {
  if (!unit || unit.status !== 'alive') return '';
  const bits = [];
  if (unit.destroyed['頭']) bits.push('頭→前方視界のみ');
  if (unit.destroyed['翼']) bits.push('翼→旋回×2');
  if (unit.destroyed['右手']) bits.push('右腕武器不可');
  if (unit.destroyed['左手']) bits.push('左腕武器不可');
  return bits.join(' · ');
}

// ===== ターン管理 =====
function buildTurnOrder() {
  const alive = units.filter(u => u.status === 'alive');
  // 交互: given→drake→given→drake...
  const givenUnits = alive.filter(u => u.team === 'given');
  const drakeUnits = alive.filter(u => u.team === 'drake');
  turnOrder = [];
  const maxLen = Math.max(givenUnits.length, drakeUnits.length);
  for (let i = 0; i < maxLen; i++) {
    if (i < givenUnits.length) turnOrder.push(givenUnits[i]);
    if (i < drakeUnits.length) turnOrder.push(drakeUnits[i]);
  }
}

function getActiveUnit() {
  if (currentOrderIndex >= turnOrder.length) return null;
  return turnOrder[currentOrderIndex];
}

function isPlayerUnit(unit) {
  if (spectatorMode) return false;
  return unit && unit.team === playerSide;
}

/** 右パネル・トップバー「ユニット」用：自機操作中はその機体、敵処理中は自陣の先頭生存機（観戦・無双でダンバイン耐久が見えるようにする） */
function getRightPanelUnit() {
  const active = getActiveUnit();
  if (active && isPlayerUnit(active)) return active;
  const team = playerSide === 'drake' ? 'drake' : 'given';
  const firstAlive = units.find(u => u.team === team && u.status === 'alive');
  return firstAlive || active || null;
}

function syncRightPanelUnitStats() {
  const roster = document.getElementById('unitRoster');
  if (!roster) return;
  const active = getActiveUnit();
  const ownTeam = playerSide === 'drake' ? 'drake' : 'given';
  const sections = [
    ['味方', units.filter(unit => unit.team === ownTeam)],
    ['敵', units.filter(unit => unit.team !== ownTeam)],
  ];
  const scroll = roster.scrollTop;
  roster.innerHTML = sections.map(([label, side]) => `
    <section aria-label="${label}">
      <h2 class="roster-heading">${label}</h2>
      ${side.length ? side.map(unit => buildRosterCard(unit, active)).join('') : '<div class="roster-empty">機体なし</div>'}
    </section>
  `).join('');
  roster.scrollTop = scroll;
}

function buildRosterCard(unit, active) {
  const live = unit.status === 'alive';
  const status = live ? unit.selectedAction : '撃墜';
  const effects = live ? buildUnitCompactEffects(unit) : '';
  let swordLoss = '';
  if (unit.swordDisarmed) swordLoss = '剣を落とした';
  else if (unit.destroyed['剣']) swordLoss = '剣破壊';
  const weapons = swordLoss
    ? unit.weapons.filter(name => name !== 'ソード' && name !== 'オーラソード')
    : unit.weapons;
  const weaponLine = [
    escapeHtml(weapons.join('、')),
    swordLoss && `<span class="roster-weapon-loss">${swordLoss}</span>`,
  ].filter(Boolean).join(' · ');
  return `<article id="roster-unit-${unit.id}" class="roster-card ${unit.team}${unit.id === active?.id ? ' active' : ''}${unit.id === inspectTargetUnitId ? ' inspected' : ''}${live ? '' : ' lost'}">
    <div class="roster-title"><strong>${escapeHtml(unit.pilot)}</strong><span>${escapeHtml(unit.machine)}</span></div>
    <div class="roster-meta">オーラ ${unit.currentAura} · パワー ${String(unit.effectivePower).toUpperCase()} · (${unit.x}, ${unit.y})
      ${status ? `<span class="roster-state"> · ${escapeHtml(status)}</span>` : ''}</div>
    ${weaponLine ? `<div class="roster-weapons">${weaponLine}</div>` : ''}
    ${effects ? `<div class="roster-meta">${escapeHtml(effects)}</div>` : ''}
    ${buildRosterParts(unit, Boolean(swordLoss))}
  </article>`;
}

function buildRosterParts(unit, hideSword) {
  const pairs = [
    ['頭','胴'], ['コクピット','オーラコンバーター'],
    ['右手','左手'], ['右足','左足'],
    ['翼','ウイング'], ['剣','盾'], ['武器'],
  ];
  const listed = new Set(pairs.flat());
  const columns = [...pairs.flatMap(pair => pair.filter(part => unit.maxDurability[part] != null)),
    ...Object.keys(unit.maxDurability).filter(part => !listed.has(part))]
    .filter(part => part !== '剣' || !hideSword);
  // 並びがずれないよう、手・足はそれぞれ新しい行の先頭から置く。
  return '<div class="roster-parts" aria-label="耐久力">' + columns.map(part => {
    const max = unit.maxDurability[part];
    const hp = unit.durability[part] ?? 0;
    const pct = max ? 100 * hp / max : 0;
    const state = hp === 0 ? ' destroyed' : hp < max ? ' damaged' : '';
    const label = part === 'オーラコンバーター' ? 'コンバーター' : part;
    const newRow = part === '右手' || part === '右足' ? ' style="grid-column-start:1"' : '';
    return `<div class="roster-part${state}"${newRow} title="${part} ${hp}/${max}">
      <div class="roster-part-label"><span>${label}</span><span>${hp}/${max}</span></div>
      <span class="roster-part-track"><span class="roster-part-fill" style="width:${pct}%"></span></span>
    </div>`;
  }).join('') + '</div>';
}

function getAuraForPower(unit) {
  if (unit.temporaryPowerAura != null) return unit.temporaryPowerAura;
  return unit.currentAura;
}

function refreshEffectivePower(unit) {
  unit.effectivePower = getEffectivePower(unit.machine, getAuraForPower(unit));
}

function clampUnitAuraValue(u, pilot, rawAura) {
  const m = AURA_BATTLERS[u.machine] || WING_CALIBERS[u.machine] || {};
  const lim = m.limitAura === Infinity ? 99 : (m.limitAura != null ? m.limitAura : 10);
  return Math.max(2, Math.min(rawAura, lim));
}

function simulateTurnStartRows() {
  const alive = units.filter(u => u.status === 'alive' && u.collisionInactiveTurn !== gameTurn);
  const rows = [];
  for (const u of alive) {
    const p = PILOTS[u.pilot] || {};
    let colA = '';
    let tempAura = null;
    let logBracket = '';
    if (p.auraBoarding != null) {
      if (u.auraLiberated) {
        colA = `<span class="success-text">解放済</span> <span class="tsd-cell-note">表${p.aura}</span>`;
        logBracket = `${u.pilot}: 搭乗オーラ解放 — 解放済（以後${p.aura}）`;
      } else {
        const eff = getEffectivePower(u.machine, u.currentAura);
        if (!isEffectiveRankAtLeastB(eff)) {
          colA = `<span class="tsd-cell-muted">対象外</span> <span class="tsd-cell-note">パワー${eff.toUpperCase()}</span>`;
          logBracket = `${u.pilot}: 搭乗オーラ解放 — 対象外（パワー${eff.toUpperCase()}）`;
        } else {
          const roll = roll1d6();
          const cd = u.pilotCumulativeDamage || 0;
          const ok = roll <= cd;
          colA = `<span class="${ok ? 'success-text' : 'fail-text'}">${ok ? '成功' : '失敗'}</span>
            <span class="tsd-cell-note">出目${roll} / 累積${cd}</span>`;
          if (ok) tempAura = p.aura;
          logBracket = `${u.pilot}: 搭乗オーラ解放 1d6=${roll} 累積${cd} → ${ok ? '成功' : '失敗'}`;
        }
      }
    } else {
      colA = `<span style="color:#555">—</span>`;
      logBracket = '';
    }
    rows.push({ unit: u, colA, tempAura, logBracket });
  }
  for (const r of rows) {
    const u = r.unit;
    const p = PILOTS[u.pilot] || {};
    const chartAura = (u.auraLiberated && p.aura != null)
      ? p.aura
      : (p.auraBoarding != null ? p.auraBoarding : (p.aura != null ? p.aura : 5));
    const oldA = u.currentAura;
    let newA = oldA;
    let dResolve = null;
    let dFluct = null;
    let skipAuraDiceRolls = false;
    if (u.auraLiberated) {
      skipAuraDiceRolls = true;
      newA = clampUnitAuraValue(u, p, p.aura);
      r.logAura = `${u.pilot}: オーラ力 ${newA}（搭乗オーラ解放済）`;
      r.finalHtmlB1 = '<span class="tsd-cell-muted">解放済</span>';
      r.finalHtmlB2 = `<span class="tsd-cell-note">固定</span> <b class="tsd-cell-value">${newA}</b>`;
    } else if (r.tempAura != null) {
      skipAuraDiceRolls = true;
      newA = clampUnitAuraValue(u, p, p.aura);
      r.logAura = `${u.pilot}: 搭乗オーラ解放成功 オーラ力 ${oldA}→${newA}`;
      r.finalHtmlB1 = '<span class="tsd-cell-muted">解放で固定</span>';
      r.finalHtmlB2 = `<span class="tsd-cell-note">固定</span> <b class="tsd-cell-value">${newA}</b>`;
    } else {
      dFluct = roll1d6();
      if (dFluct >= 3) {
        r.logAura = `${u.pilot}: オーラ力継続 ${newA}（変動1d6=${dFluct}）`;
        r.finalHtmlB1 = `<span class="tsd-cell-out"><b class="tsd-cell-value">${dFluct}</b><span>継続</span></span>`;
        r.finalHtmlB2 = '<span class="tsd-cell-muted">—</span>';
      } else {
        dResolve = roll1d6();
        const raw = resolveAuraFromPilotRollTable(chartAura, dResolve);
        newA = clampUnitAuraValue(u, p, raw);
        r.logAura =
          `${u.pilot}: オーラ力 ${oldA}→${newA}（変動${dFluct}・判定${dResolve}・基本オーラ${chartAura}）`;
        r.finalHtmlB1 = `<span class="tsd-cell-out"><b class="tsd-cell-value">${dFluct}</b><span>変化</span></span>`;
        r.finalHtmlB2 = `<span class="tsd-cell-out" title="基本オーラ${chartAura}・出目${dResolve}">
          <span>出目${dResolve} →</span><b class="tsd-cell-value">${newA}</b></span>`;
      }
    }
    const pow = getEffectivePower(u.machine, newA);
    r.skipAuraDiceRolls = skipAuraDiceRolls;
    r.dFluct = dFluct;
    r.dResolve = dResolve;
    r.oldAura = oldA;
    r.finalAura = newA;
    r.finalTemp = r.tempAura;
    r.finalPower = pow;
    r.logAura += ` パワー${pow.toUpperCase()}`;
    const numClass = newA > oldA ? 'tsd-final-up' : newA < oldA ? 'tsd-final-down' : '';
    const pk = String(pow).toLowerCase();
    r.liberationSuccess = p.auraBoarding != null && (r.tempAura != null || u.auraLiberated);
    r.finalHtmlC = `<span class="tsd-final-block">
      <span class="tsd-aura-prev">${oldA} →</span><b class="aura-final-num ${numClass}">${newA}</b>
      <span class="tsd-rank-badge tsd-rank-${pk}">${pow.toUpperCase()}</span></span>`;
  }
  return rows;
}

function mountTurnStartTable(rows) {
  const wrap = document.getElementById('tsdTableWrap');
  if (!rows.length) {
    wrap.innerHTML = '<p style="color:#888;padding:16px;">生存ユニットなし</p>';
    return;
  }
  let html = '<table class="aura-table"><thead><tr>';
  html += '<th class="aura-cell aura-name">機体 / パイロット</th>';
  html += '<th class="aura-cell aura-step">搭乗オーラ解放</th>';
  html += '<th class="aura-cell aura-step">変動（1d6）</th>';
  html += '<th class="aura-cell aura-step">再判定（1d6）</th>';
  html += '<th class="aura-cell aura-final">確定 / パワー</th></tr></thead><tbody>';
  rows.forEach((r, i) => {
    const u = r.unit;
    const rowCls = r.liberationSuccess ? 'aura-row tsd-row-liberation' : 'aura-row';
    html += `<tr class="${rowCls}">
      <th scope="row" class="aura-cell aura-name">${escapeHtml(u.machine)}<small>${escapeHtml(u.pilot)}</small></th>
      <td class="aura-cell aura-step" id="tsd-a-${i}"></td>
      <td class="aura-cell aura-step" id="tsd-b1-${i}"></td>
      <td class="aura-cell aura-step" id="tsd-b2-${i}"></td>
      <td class="aura-cell aura-final" id="tsd-c-${i}"></td>
    </tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  wrap.scrollTop = 0;
}

function applyTurnStartRowState(r) {
  const u = r.unit;
  if (r.finalTemp != null) u.auraLiberated = true;
  u.temporaryPowerAura = null;
  u.currentAura = r.finalAura;
  refreshEffectivePower(u);
}

function fillTurnStartTableAll(rows) {
  rows.forEach((r, i) => {
    document.getElementById(`tsd-a-${i}`).innerHTML = r.colA;
    document.getElementById(`tsd-b1-${i}`).innerHTML = r.finalHtmlB1;
    document.getElementById(`tsd-b2-${i}`).innerHTML = r.finalHtmlB2;
    applyTurnStartRowState(r);
    document.getElementById(`tsd-c-${i}`).innerHTML = r.finalHtmlC;
  });
}

function turnStartAnimateMiniDice(container, finalValue, duration) {
  duration = duration == null ? 520 : duration;
  return new Promise(resolve => {
    if (!container) {
      resolve();
      return;
    }
    container.innerHTML = '<span class="tsd-mini-flicker"> </span>';
    const span = container.querySelector('.tsd-mini-flicker');
    if (!span) {
      resolve();
      return;
    }
    const t0 = performance.now();
    function tick(now) {
      if (turnStartTableAbort) {
        span.textContent = String(finalValue);
        span.className = 'tsd-mini-settled';
        resolve();
        return;
      }
      if (now - t0 < duration) {
        span.textContent = String(Math.floor(Math.random() * 6) + 1);
        requestAnimationFrame(tick);
      } else {
        span.textContent = String(finalValue);
        span.className = 'tsd-mini-settled';
        resolve();
      }
    }
    requestAnimationFrame(tick);
  });
}

function showTurnStartTableCompleteUI() {
  document.getElementById('tsdPhaseHint').textContent = '完了 — OKで手番へ';
  document.getElementById('tsdSkip').style.display = 'none';
  document.getElementById('tsdSkip').disabled = false;
  document.getElementById('tsdNext').style.display = 'inline-block';
}

function turnStartConfirmFinish() {
  document.getElementById('tsdSkip').style.display = 'inline-block';
  finishTurnStartOverlay();
}

function turnStartWait(ms) {
  return new Promise(res => setTimeout(res, ms));
}

async function runTurnStartTableAnimation(rows) {
  const wait = turnStartWait;
  if (!rows.length) return;

  document.getElementById('tsdPhaseHint').textContent = '段階1: 搭乗オーラ解放（全員同時）';
  await wait(600);
  if (turnStartTableAbort) return;
  rows.forEach((r, i) => {
    document.getElementById(`tsd-a-${i}`).innerHTML = r.colA;
    if (r.logBracket) addLog('system', r.logBracket);
  });
  await wait(450);
  if (turnStartTableAbort) return;

  document.getElementById('tsdPhaseHint').textContent = '段階2: 変動1d6（全員同時）';
  await wait(650);
  await Promise.all(rows.map((r, i) => {
    const el = document.getElementById(`tsd-b1-${i}`);
    if (r.skipAuraDiceRolls) {
      el.innerHTML = r.finalHtmlB1;
      return Promise.resolve();
    }
    return turnStartAnimateMiniDice(el, r.dFluct);
  }));
  if (turnStartTableAbort) return;
  await wait(180);
  rows.forEach((r, i) => { document.getElementById(`tsd-b1-${i}`).innerHTML = r.finalHtmlB1; });
  await wait(380);
  if (turnStartTableAbort) return;

  document.getElementById('tsdPhaseHint').textContent = '段階3: オーラ力判定（全員同時）';
  await wait(650);
  await Promise.all(rows.map((r, i) => {
    const el = document.getElementById(`tsd-b2-${i}`);
    if (r.skipAuraDiceRolls) {
      el.innerHTML = r.finalHtmlB2;
      return Promise.resolve();
    }
    if (r.dResolve == null) {
      el.innerHTML = r.finalHtmlB2;
      return Promise.resolve();
    }
    return turnStartAnimateMiniDice(el, r.dResolve);
  }));
  if (turnStartTableAbort) return;
  await wait(180);
  rows.forEach((r, i) => { document.getElementById(`tsd-b2-${i}`).innerHTML = r.finalHtmlB2; });
  rows.forEach(r => addLog('system', r.logAura));
  await wait(380);
  if (turnStartTableAbort) return;

  document.getElementById('tsdPhaseHint').textContent = '段階4: 確定（全員同時）';
  await wait(650);
  if (turnStartTableAbort) return;
  rows.forEach((r, i) => {
    applyTurnStartRowState(r);
    document.getElementById(`tsd-c-${i}`).innerHTML = r.finalHtmlC;
  });
  drawMap();
  await wait(450);
}

function turnStartSkipAll() {
  turnStartTableAbort = true;
  const rows = turnStartTableRows;
  if (rows && rows.length) {
    fillTurnStartTableAll(rows);
    rows.forEach(r => {
      if (r.logBracket) addLog('system', r.logBracket);
      addLog('system', r.logAura);
    });
    drawMap();
  }
  document.getElementById('tsdPhaseHint').textContent = '演出スキップで確定しました';
  showTurnStartTableCompleteUI();
}

function finishTurnStartOverlay() {
  document.getElementById('turnStartDiceOverlay').classList.remove('show');
  document.getElementById('tsdSkip').disabled = false;
  endAuraPhase();
}

// ===== オーラ力フェイズ =====
function startAuraPhase() {
  currentPhase = 'AURA_POWER';
  updateTopBar();
  units.forEach(u => { u.temporaryPowerAura = null; });
  units.filter(u => u.status === 'alive').forEach(refreshEffectivePower);

  turnStartTableRows = simulateTurnStartRows();
  turnStartTableAbort = false;

  document.getElementById('auraPhasePanel').style.display = 'none';

  if (spectatorMode) {
    if (turnStartTableRows.length) {
      turnStartTableRows.forEach(r => {
        if (r.logBracket) addLog('system', r.logBracket);
        applyTurnStartRowState(r);
        addLog('system', r.logAura);
      });
    }
    drawMap();
    document.getElementById('turnStartDiceOverlay').classList.remove('show');
    addLog('system', '[観戦] オーラ力判定を即時適用');
    syncRightPanelUnitStats();
    beginTurnPlanning();
    return;
  }

  document.getElementById('tsdTitle').textContent = `ターン ${gameTurn} · オーラ力判定`;
  document.getElementById('tsdPhaseHint').textContent = '';
  mountTurnStartTable(turnStartTableRows);
  document.getElementById('tsdNext').style.display = 'none';
  document.getElementById('tsdSkip').style.display = 'inline-block';
  document.getElementById('tsdSkip').disabled = false;
  document.getElementById('turnStartDiceOverlay').classList.add('show');

  if (!turnStartTableRows.length) {
    showTurnStartTableCompleteUI();
    return;
  }
  runTurnStartTableAnimation(turnStartTableRows).finally(() => {
    if (!turnStartTableAbort) showTurnStartTableCompleteUI();
  });
}

function endAuraPhase() {
  document.getElementById('auraPhasePanel').style.display = 'none';
  document.getElementById('turnStartDiceOverlay').classList.remove('show');
  beginTurnPlanning();
}

// ===== 同時計画ターン（移動プラン→一括実行→射撃・格闘を順解決）=====
function beginTurnPlanning() {
  moveRevealPaths = null;
  if (gameTurn === 1) lastCollisionPairs.clear();
  buildTurnOrder();
  if (!turnOrder.length) {
    endTurnFromEmptyOrder();
    return;
  }
  addLog('system', spectatorMode
    ? '[観戦] 両軍AIが行動・移動を計画し、自動で進みます。'
    : '同時計画：操作側ユニットは全員「行動→移動」を入力し、準備ができたら「同時実行」で移動を一括解決します。');
  planSnapshot = {};
  turnSubPhase = 'planning';
  resolutionIndex = 0;
  currentOrderIndex = 0;
  turnOrder.forEach(u => {
    if (u.status !== 'alive') return;
    planSnapshot[u.id] = { x: u.x, y: u.y, dir: u.dir };
    u.meleeParryStance = null;
    u.parryRow = null;
    u.parrySide = null;
    if (unitCannotAct(u)) {
      u.selectedAction = '行動不能';
      u.planComplete = true;
      u.planEndState = { x: u.x, y: u.y, dir: u.dir };
      addLog('system', `${u.pilot}: 行動不能`);
    } else if (isPlayerUnit(u)) {
      u.planComplete = false;
    } else {
      aiCreatePlan(u);
    }
  });
  if (typeof DunbainQL !== 'undefined' && scenario && scenario.qlLearnPlayerSide && DunbainQL.isEnabled()) {
    turnOrder.forEach(u => {
      if (u.status !== 'alive' || !isPlayerUnit(u)) return;
      const legal = unitCannotAct(u) ? [] : availableActions(u);
      DunbainQL.onAiPlanStart(u, legal);
    });
  }
  advanceToNextHumanPlan();
}

function advanceToNextHumanPlan() {
  hideMapHud();
  for (let i = 0; i < turnOrder.length; i++) {
    const u = turnOrder[i];
    if (u.status !== 'alive') continue;
    if (!isPlayerUnit(u)) continue;
    if (u.planComplete) continue;
    currentOrderIndex = i;
    u.hasActed = false;
    updateTopBar();
    syncRightPanelUnitStats();
    centerMapOnUnit(u);
    showActionSelect(u);
    return;
  }
  showPlanReadyUI();
}

/** 現在のカメラ中心に最も近い味方（命令完了HUDを画面中央付近に留める用） */
function showPlanReadyUI() {
  currentPhase = 'PLAN_READY';
  currentOrderIndex = 0;
  updateTopBar();
  syncRightPanelUnitStats();

  if (typeof DunbainQL !== 'undefined' && scenario && scenario.qlLearnPlayerSide && DunbainQL.isEnabled() && !spectatorMode && planSnapshot) {
    turnOrder.forEach(u => {
      if (u.status !== 'alive' || !isPlayerUnit(u) || !u.planComplete || !u.selectedAction) return;
      const s = planSnapshot[u.id];
      if (!s) return;
      const ghost = Object.assign({}, u, { x: s.x, y: s.y, dir: s.dir });
      let nearest = null;
      let bestD = Infinity;
      for (let i = 0; i < units.length; i++) {
        const e = units[i];
        if (!e || e.team === u.team || e.status !== 'alive') continue;
        const d = hexDistance(ghost.x, ghost.y, e.x, e.y);
        if (d < bestD) {
          bestD = d;
          nearest = e;
        }
      }
      const sk = DunbainQL.encodeState(ghost, nearest);
      DunbainQL.setPending(u, sk, u.selectedAction);
    });
  }

  if (spectatorMode) {
    hideMapHud();
    if (spectatorAutoExecuteTimer) {
      clearTimeout(spectatorAutoExecuteTimer);
      spectatorAutoExecuteTimer = null;
    }
    spectatorAutoExecuteTimer = setTimeout(() => {
      spectatorAutoExecuteTimer = null;
      if (gameOver || currentPhase !== 'PLAN_READY') return;
      executeSimultaneousTurn();
    }, spectatorExecuteDelayMs);
    drawMap();
    return;
  }

  const mapHudPanel = document.getElementById('mapHudPanel');
  mapHudPanel.classList.remove('map-hud-ranged-phase');
  mapHudPanel.innerHTML = `
    <div class="map-hud-title">全員の命令入力済み</div>
    <div style="color:#aaa;font-size:11px;line-height:1.45;margin-bottom:10px;">移動はまだ反映されていません。「同時実行」で全機の移動を一度に解決し、その後ターン順に射撃・格闘を処理します。<br>移動終了時に同じマスにいる機体は、双方が衝突を判定し、オーラ力が低い方が隣の空きヘクスに押し出されます。</div>
    <button type="button" class="action-btn" id="executeSimultaneousBtn" style="width:100%;">同時実行</button>
  `;
  showMapHud();
  document.getElementById('executeSimultaneousBtn').addEventListener('click', ev => {
    ev.stopPropagation();
    executeSimultaneousTurn();
  });
  drawMap();

}

let lastCollisionPairs = new Set();

function collisionMaybeDropWeapon(unit) {
  const external = (MACHINE_EXTERNAL_WEAPONS[getBaseMachineName(unit.machine)] || []);
  for (const label of [...unit.weapons]) {
    const sword = label === 'ソード' || label === 'オーラソード';
    if (!sword && !external.includes(label)) continue;
    const roll = roll1d6();
    if (roll > (sword ? 3 : 1)) continue;
    unit.weapons.splice(unit.weapons.indexOf(label), 1);
    if (!sword || (!unit.swordDisarmed && !unit.destroyed['剣'])) unit.droppedWeaponCount++;
    if (sword) unit.swordDisarmed = true;
    addLog(unit.team, `${unit.pilot}: 衝突で${label}を失う（1d6=${roll}）`);
  }
}

function resolveCollisionTableOutcome(unit, other) {
  const diff = powerRankToCollisionNum(unit.effectivePower) - powerRankToCollisionNum(other.effectivePower);
  const roll = roll1d6();
  const outcome = COLLISION_TABLE[roll - 1][collisionTableColumnIndex(diff)];
  addLog('system', `衝突判定 ${unit.pilot}／${other.pilot} パワー差${diff} 1d6=${roll} → ${outcome || '効果なし'}`);
  if (outcome === 'd') unit.collisionInactiveTurn = gameTurn + 1;
  if (outcome && unit.type === 'AB') collisionMaybeDropWeapon(unit);
}

function completeAiMovementPlan(unit) {
  unit.planComplete = true;
}

function pushCollisionUnit(weaker, stronger) {
  const strongerEntry = stronger.planPathHexes?.at(-2);
  const weakerEntry = weaker.planPathHexes?.at(-2);
  let direction = stronger.dir;
  if (strongerEntry) {
    direction = (bestFaceDirToward(weaker.x, weaker.y, strongerEntry.x, strongerEntry.y) + 3) % 6;
  } else if (weakerEntry) {
    direction = bestFaceDirToward(weaker.x, weaker.y, weakerEntry.x, weakerEntry.y);
  }
  for (const offset of [0, -1, 1, -2, 2, 3]) {
    const { x, y } = hexNeighbor(weaker.x, weaker.y, (direction + offset + 6) % 6);
    if (!isPlayableBoardHex(x, y) || units.some(u => u.status === 'alive' && u.x === x && u.y === y)) continue;
    weaker.x = x;
    weaker.y = y;
    addLog('system', `${weaker.pilot}: ${stronger.pilot}との衝突で1ヘクス押し出し → (${x},${y})`);
    return;
  }
  addLog('system', `${weaker.pilot}: 衝突で押し出せるヘクスがない`);
}

function executePlannedMovesWithConflicts() {
  const destinations = new Map();
  for (const unit of turnOrder) {
    if (unit.status !== 'alive') continue;
    const destination = unit.planEndState || unit;
    unit.x = destination.x;
    unit.y = destination.y;
    unit.dir = destination.dir;
    const key = `${unit.x},${unit.y}`;
    if (!destinations.has(key)) destinations.set(key, []);
    destinations.get(key).push(unit);
    addLog(unit.team, `${unit.pilot}: 移動 → (${unit.x},${unit.y}) 向き${unit.dir}`);
  }
  const collisions = [];
  const pushes = new Map();
  for (const [hex, group] of destinations) {
    // 同じヘクスの判定をすべて終えてから押し出す。1機につき最大1ヘクス。
    for (let i = 0; i < group.length; i++) {
      const unit = group[i];
      for (const other of group.slice(i + 1)) {
        const pair = [unit.id, other.id].sort().join(',');
        const key = `${hex}:${pair}`;
        collisions.push({ key, unit, other });
        if (lastCollisionPairs.has(key)) continue;
        resolveCollisionTableOutcome(unit, other);
        resolveCollisionTableOutcome(other, unit);
        const auraDifference = getAuraForPower(unit) - getAuraForPower(other);
        if (auraDifference === 0) continue;
        const [weaker, stronger] = auraDifference < 0 ? [unit, other] : [other, unit];
        const previous = pushes.get(weaker);
        if (!previous || getAuraForPower(stronger) > getAuraForPower(previous)) pushes.set(weaker, stronger);
      }
    }
  }
  for (const [weaker, stronger] of pushes) pushCollisionUnit(weaker, stronger);
  lastCollisionPairs = new Set(collisions
    .filter(({ unit, other }) => unit.x === other.x && unit.y === other.y)
    .map(({ key }) => key));
}

function executeSimultaneousTurn() {
  if (gameOver || currentPhase !== 'PLAN_READY' || turnSubPhase !== 'planning') return;
  if (spectatorAutoExecuteTimer) {
    clearTimeout(spectatorAutoExecuteTimer);
    spectatorAutoExecuteTimer = null;
  }
  hideMapHud();
  addLog('system', spectatorMode ? '--- 移動を解決 ---' : '--- 移動を同時解決 ---');
  moveRevealPaths = [];
  executePlannedMovesWithConflicts();
  if (planSnapshot) {
    for (const u of turnOrder) {
      if (u.status !== 'alive' || !planSnapshot[u.id]) continue;
      const hexes = u.planPathHexes?.length ? u.planPathHexes.slice() : [planSnapshot[u.id]];
      const last = hexes.at(-1);
      if (last.x !== u.x || last.y !== u.y) hexes.push({ x: u.x, y: u.y });
      if (hexes.length >= 2) moveRevealPaths.push({ unitId: u.id, team: u.team, hexes });
    }
  }
  for (const u of turnOrder) {
    if (u.selectedAction === '変形' && u.status === 'alive' && u.machine === 'ビルバイン') {
      u.type = u.type === 'WC' ? 'AB' : 'WC';
      addLog(u.team, `${u.pilot}: ${u.type === 'WC' ? 'ウィングキャリバー' : 'オーラバトラー'}に変形`);
    }
  }
  drawMap();
  if (checkVictory()) return;
  turnSubPhase = 'resolving';
  resolutionIndex = 0;
  runNextResolution();
}

function aiPickRangedWeaponAndTarget(unit) {
  const enemies = units.filter(e => e.team !== unit.team && e.status === 'alive');
  let pick = null;
  let bestScore = -Infinity;
  for (const target of enemies) {
    const blind = !canSeeTarget(target, unit);
    for (const weapon of unit.weapons) {
      const shot = getRangedHitPreviewVsEnemy(unit, target, weapon);
      if (!shot || shot.finalHit < 2) continue;
      const score = (blind ? 100 : 0) + 10 * aiProbability2d6Leq(shot.finalHit) - shot.range * 0.01;
      if (score > bestScore) {
        pick = { weapon, target };
        bestScore = score;
      }
    }
  }
  return { pick, reason: pick ? 'ok' : enemies.length ? 'noLine' : 'none' };
}

/** AI 射撃：弾道＋ダイス演出は人間と同じ。終了後 autoCloseMs 経過でターン進行 */
async function aiPresentRangedResolution(unit) {
  try {
    const { pick, reason } = aiPickRangedWeaponAndTarget(unit);
    if (!pick) {
      if (reason === 'none') addLog('system', `${unit.pilot}: 射撃なし(AI)`);
      else addLog('system', `${unit.pilot}: 射撃できず(AI)`);
      if (typeof DunbainQL !== 'undefined') DunbainQL.registerNoShot(unit);
      finishUnitTurn();
      return;
    }
    selectedWeapon = pick.weapon;
    rangedShotInProgress = true;
    hideMapHud();
    centerMapOnUnit(unit);
    drawMap();

    const targetId = pick.target.id;
    await new Promise(resolve => {
      playProjectileShotAnimation(unit, pick.target, resolve);
    });

    const u = units.find(x => x.id === unit.id);
    const t = units.find(x => x.id === targetId);
    if (!u || !t || u.status !== 'alive') {
      drawMap();
      if (spectatorMode) {
        addLog('system', `${unit.pilot}: 射撃スキップ（攻撃者／標的が無効）`);
        finishUnitTurn();
        return;
      }
      showPopup(
        '射撃',
        '<div class="popup-line">攻撃者または対象が無効のため処理をスキップしました。</div>',
        2200
      );
      return;
    }

    await runRangedCombatDiceSequence(u, t, { autoCloseMs: spectatorMode ? 0 : 2200 });
  } catch (e) {
    try { console.error('aiPresentRangedResolution', e); } catch (_) { /* ignore */ }
    addLog('system', `${unit.pilot}: 射撃処理で内部エラー — 次へ進みます`);
    hideMapHud();
    rangedShotInProgress = false;
    finishUnitTurn();
  }
}

async function aiResolveSimpleMelee(unit) {
  return aiResolveSimpleMeleeNoDefense(unit);
}

// ===== 相互格闘（両者が格闘を選んだ場合の先攻/後攻ルール）=====

/** 隣接する敵で格闘を選んでいて未行動のユニットを探す */
function findMutualMeleeOpponent(unit) {
  for (let i = 0; i < turnOrder.length; i++) {
    const e = turnOrder[i];
    if (e.team === unit.team || e.status !== 'alive' || e.hasActed) continue;
    if (!isMeleeAction(e.selectedAction)) continue;
    if (e.id === unit.id) continue;
    if (aiCanMeleeFromPosition(unit, e) || aiCanMeleeFromPosition(e, unit)) return e;
  }
  return null;
}

/** 先攻/後攻ダイス（1d6同士、同値は振り直し） */
function rollMeleeInitiative(unitA, unitB) {
  let a, b;
  let tries = 0;
  do {
    a = roll1d6();
    b = roll1d6();
    tries++;
  } while (a === b && tries < 20);
  if (a === b) a = a + 1; // 安全弁
  return { aRoll: a, bRoll: b, aFirst: a > b };
}

let pendingMutualMeleeResolve = null;
let meleeExchange = null;

async function executeMeleeExchangeAttack(attacker, target) {
  if (!aiCanMeleeFromPosition(attacker, target)) return;
  currentOrderIndex = turnOrder.indexOf(attacker);
  attacker.hasActed = false;
  centerMapOnUnit(attacker);
  await new Promise(resolve => {
    pendingMutualMeleeResolve = resolve;
    if (isPlayerUnit(attacker)) {
      startMeleePhase(attacker);
    } else {
      aiResolveSimpleMeleeNoDefense(attacker, target);
    }
  });
}

async function resolveMutualMelee(unitA, unitB) {
  const init = rollMeleeInitiative(unitA, unitB);
  const first = init.aFirst ? unitA : unitB;
  const second = init.aFirst ? unitB : unitA;
  addLog('system', `剣・格闘の先攻: ${first.pilot} ／ 後攻: ${second.pilot}`);
  try {
    meleeExchange = { target: second, mayParry: true, initiative: init };
    await executeMeleeExchangeAttack(first, second);
    if (second.status === 'alive' && second.meleeParryStance !== 'defense_only') {
      meleeExchange = { target: first, mayParry: false, initiative: init };
      await executeMeleeExchangeAttack(second, first);
    }
  } finally {
    meleeExchange = null;
  }
  unitA.hasActed = true;
  unitB.hasActed = true;
  unitA._mutualMeleeResolved = true;
  unitB._mutualMeleeResolved = true;
  if (checkVictory()) return;
  resolutionIndex++;
  runNextResolution();
}

function meleeMethodsForUnit(unit) {
  if (meleeUsesSwordArc(unit)) return ['斬る', '突く'];
  return unit.machine === 'ブブリィ' ? ['殴る', '武器で殴る'] : ['殴る', '蹴る', '武器で殴る'];
}

function meleePartsForMethod(method, tier) {
  if (method === '斬る' || method === '突く') return MELEE_TIER_PARTS[tier];
  if (method === '蹴る') return ['手', '胴', 'コクピット', '足'];
  return ['頭', '手', '胴', 'コクピット'];
}

function swordStances(unit) {
  const tiers = ['high', 'mid', 'low'];
  const previous = tiers.indexOf(unit.swordTier);
  return tiers.filter((tier, i) => previous < 0 || Math.abs(i - previous) <= 1);
}

function aiSetupMeleeParams(attacker, target) {
  const choices = ['left', 'right'].flatMap(side =>
    meleeMethodsForUnit(attacker)
      .filter(method => canMeleeTarget(attacker, target, side, method))
      .map(method => ({ side, method })));
  if (!choices.length) return false;
  choices.sort((a,b) => {
    const merit = ({ side, method }) => (MELEE_HIT[method]?.[attacker.effectivePower] || 0) +
      meleePositionMod(attacker, target, side);
    return merit(b) - merit(a);
  });
  const choice = choices[0];
  selectedSwordSide = choice.side;
  selectedMeleeMethod = choice.method;
  const tiers = meleeUsesSwordArc(attacker) ? swordStances(attacker) : ['mid'];
  selectedMeleeTier = tiers[Math.floor(Math.random() * tiers.length)];
  if (meleeUsesSwordArc(attacker)) attacker.swordTier = selectedMeleeTier;
  const parts = meleePartsForMethod(choice.method, selectedMeleeTier);
  selectedMeleeAttackPart = parts[Math.floor(Math.random() * parts.length)];
  return true;
}
