// 向きを正面に戻した相対ヘクス。縦は半マスを1と数える。
function relativeHex(origin, target) {
  const from = offsetToCube(origin.x, origin.y);
  const to = offsetToCube(target.x, target.y);
  let q = to.q - from.q;
  let r = to.r - from.r;
  for (let step = 0; step < origin.dir; step++) {
    [q, r] = [q + r, -q];
  }
  return { q, y: 2 * r + q };
}

function getAttackDirection(attacker, target) {
  const { q, y } = relativeHex(target, attacker);
  if (y < -Math.abs(q)) return '正面';
  if (y > Math.abs(q)) return '後面';
  return q > 0 ? '右側面' : '左側面';
}

function hexNeighbor(col, row, dir) {
  return {
    x: col + DIR_DX[dir],
    y: row + (col % 2 === 0 ? DIR_DY_EVEN[dir] : DIR_DY_ODD[dir]),
  };
}

// 13-6・14-52 の図を、機体を原点、正面を上にした相対ヘクスで持つ。
const SWORD_LEFT_HEX_MOD = {
  '0,-4': 0, '0,-2': 0, '1,-3': -1, '1,-1': -1,
  '-1,-3': 0, '-1,-1': 0, '-1,1': -1, '-2,-2': 0, '-2,0': -1,
};
const PUNCH_KICK_LEFT_HEX_MOD = {
  '0,-2': 0, '1,-1': -1, '1,1': -2, '-1,-1': 0, '-1,1': -1,
};
const BUBURY_LEFT_HEX_MOD = {
  '0,-4': -1, '-1,-3': 0, '-1,-1': 0, '-1,1': 0,
};

function getCombatPositionMod(attacker, target, side, positions) {
  const { q, y } = relativeHex(attacker, target);
  return positions[`${side === 'right' ? -q : q},${y}`];
}

function isInSwordRange(attacker, target, side) {
  return getSwordHexHitMod(attacker, target, side) != null;
}

function getSwordHexHitMod(attacker, target, side) {
  return getCombatPositionMod(attacker, target, side, SWORD_LEFT_HEX_MOD);
}

function getPunchKickHexHitMod(attacker, target, side) {
  const positions = attacker.machine === 'ブブリィ' ? BUBURY_LEFT_HEX_MOD : PUNCH_KICK_LEFT_HEX_MOD;
  return getCombatPositionMod(attacker, target, side, positions);
}

function isMeleeAction(action) {
  return action === '剣' || action === '格闘';
}

function unitHasMeleeSwordWeapon(unit) {
  return !!(unit && !unit.swordDisarmed && !unit.destroyed?.['剣'] &&
    (!unit.destroyed?.['左手'] || !unit.destroyed?.['右手']) &&
    unit.weapons?.some(w => w === 'オーラソード' || w === 'ソード'));
}

function meleeUsesSwordArc(unit) {
  return unit.selectedAction === '剣' && unitHasMeleeSwordWeapon(unit);
}

function canSeeTarget(attacker, target) {
  if (attacker.x === target.x && attacker.y === target.y) return false;
  if (attacker.type === 'OB') return true;
  const direction = getAttackDirection(target, attacker);
  if (direction === '後面') return false;
  const front = direction === '正面';
  const parts = attacker.destroyed || {};
  return front ? !attacker.canopyCracked || attacker.canopyOpen : !parts['頭'];
}

function meleePositionMod(attacker, target, side) {
  if (!side || !canSeeTarget(attacker, target)) return undefined;
  if (attacker.selectedAction === '剣') {
    if (!unitHasMeleeSwordWeapon(attacker)) return undefined;
    return getSwordHexHitMod(attacker, target, side);
  }
  return getPunchKickHexHitMod(attacker, target, side);
}

function canMeleeTarget(unit, target, side, method) {
  if (meleePositionMod(unit, target, side) == null) return false;
  const parts = unit.destroyed || {};
  if (unit.selectedAction === '剣') {
    return !parts[(side === 'left' ? '左' : '右') + '手'] && (!method || method === '斬る' || method === '突く');
  }
  const limb = (side === 'left' ? '左' : '右') + (method === '蹴る' ? '足' : '手');
  if (!method) return meleeMethodsForUnit(unit).some(choice => canMeleeTarget(unit, target, side, choice));
  if (parts[limb]) return false;
  if (unit.machine === 'ブブリィ' && method === '蹴る') return false;
  if (method === '武器で殴る') {
    const hand = side === 'left' ? '左' : '右';
    if (side === 'left' && unitHasOperationalShield(unit)) return true;
    const external = MACHINE_EXTERNAL_WEAPONS[getBaseMachineName(unit.machine)] || [];
    return unit.weapons.some(w => {
      const mount = rangedWeaponData(unit, w)?.mount;
      return external.includes(w) && (mount === hand || mount === '両') && canOperateWeapon(unit, w);
    });
  }
  return method === '殴る' || method === '蹴る';
}

function hasAnyMeleeTarget(unit) {
  return units.some(t => t.team !== unit.team && t.status === 'alive' &&
    (canMeleeTarget(unit, t, 'left') || canMeleeTarget(unit, t, 'right')));
}

function isInEffectiveRangedArc(attacker, target, placement) {
  if (!canSeeTarget(attacker, target)) return false;
  if (attacker.type === 'OB') return true;
  const { q, y } = relativeHex(attacker, target);
  if (attacker.type === 'WC' || placement === '胴') return y <= -Math.abs(q);
  return (placement !== '右' && y <= -q) || (placement !== '左' && y <= q);
}

function rangedShotAt(shooter, target, weaponLabel) {
  if (!canOperateWeapon(shooter, weaponLabel)) return null;
  const weapon = rangedWeaponData(shooter, weaponLabel);
  if (!weapon || (shooter.ammo?.[weaponLabel] ?? weapon.shots) <= 0) return null;
  const range = hexDistance(shooter.x, shooter.y, target.x, target.y);
  const column = Math.min(range, 8) - 1;
  if (range < 1 || range > weapon.range || weapon.hit[column] == null) return null;
  const parts = shooter.destroyed || {};
  let placement = weapon.mount;
  if (placement === '両' && (parts['左手'] || parts['右手'])) placement = parts['左手'] ? '右' : '左';
  if (placement === '足') placement = '胴';
  if (!isInEffectiveRangedArc(shooter, target, placement)) return null;
  return { range, baseHit: weapon.hit[column], basePower: weapon.power[column], weapon };
}

function getRangedHitPreviewVsEnemy(shooter, enemy, weaponLabel) {
  const shot = rangedShotAt(shooter, enemy, weaponLabel);
  if (!shot) return null;
  const wcMod = enemy.type === 'WC' && enemy.machine !== 'ビルバイン' ? -2 : 0;
  const mod = (SHOOTER_POWER_MOD[shooter.effectivePower] || 0) +
    (TARGET_EVADE_MOD[enemy.effectivePower] || 0) +
    (TARGET_ACTION_MOD[enemy.selectedAction] || 0) + wcMod;
  return { ...shot, mod, finalHit: shot.baseHit + mod };
}

function drawRangedProbabilityBubbles(svg, shooter, viewX, viewY, viewW, viewH) {
  const NS = 'http://www.w3.org/2000/svg';
  const wl = selectedWeapon;
  if (!wl || !shooter) return;

  const margin = hexSize * 4;
  for (let i = 0; i < units.length; i++) {
    const enemy = units[i];
    if (enemy.status !== 'alive' || enemy.team === shooter.team) continue;
    const info = getRangedHitPreviewVsEnemy(shooter, enemy, wl);
    if (!info) continue;

    const c = hexCenter(enemy.x, enemy.y);
    const bx = c.x + hexSize * 1.12;
    const by = c.y - hexSize * 0.2;
    if (bx < viewX - margin || bx > viewX + viewW + margin || by < viewY - margin || by > viewY + viewH + margin) continue;

    const g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', `translate(${bx},${by})`);
    g.setAttribute('pointer-events', 'none');

    const rw = 52;
    const rh = 30;
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', String(-rw / 2 + 6));
    rect.setAttribute('y', String(-rh / 2));
    rect.setAttribute('width', String(rw - 6));
    rect.setAttribute('height', String(rh));
    rect.setAttribute('rx', '8');
    rect.setAttribute('fill', 'rgba(18,16,28,0.95)');
    rect.setAttribute('stroke', 'rgba(255,200,140,0.92)');
    rect.setAttribute('stroke-width', '1.25');

    const tail = document.createElementNS(NS, 'path');
    tail.setAttribute('d', `M ${-rw / 2 + 6} ${-5} L ${-rw / 2 - 5} 0 L ${-rw / 2 + 6} ${5} Z`);
    tail.setAttribute('fill', 'rgba(18,16,28,0.95)');
    tail.setAttribute('stroke', 'rgba(255,200,140,0.92)');
    tail.setAttribute('stroke-width', '1');
    tail.setAttribute('stroke-linejoin', 'round');

    g.appendChild(rect);
    g.appendChild(tail);

    const tPct = document.createElementNS(NS, 'text');
    tPct.setAttribute('x', String(5));
    tPct.setAttribute('y', String(-4));
    tPct.setAttribute('text-anchor', 'middle');
    tPct.setAttribute('fill', '#ffe8cc');
    tPct.setAttribute('font-size', '12');
    tPct.setAttribute('font-weight', 'bold');
    tPct.setAttribute('font-family', 'system-ui,sans-serif');
    const needBelow = Math.round(Number(info.finalHit));
    tPct.textContent = `${needBelow}以下`;

    const tSub = document.createElementNS(NS, 'text');
    tSub.setAttribute('x', String(5));
    tSub.setAttribute('y', String(10));
    tSub.setAttribute('text-anchor', 'middle');
    tSub.setAttribute('fill', '#8ab');
    tSub.setAttribute('font-size', '7');
    tSub.setAttribute('font-family', 'system-ui,sans-serif');
    tSub.textContent = `距${info.range}`;

    g.appendChild(tPct);
    g.appendChild(tSub);
    svg.appendChild(g);
  }
}

// ===== マップ描画 =====
function initMap() {
  fitBoardOnScreen();
  if (mapListenersInstalled) return;
  mapListenersInstalled = true;

  const area = document.getElementById('mapArea');
  let clickStartX = 0, clickStartY = 0;
  area.addEventListener('mousedown', e => {
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    clickStartX = e.clientX;
    clickStartY = e.clientY;
    area.style.cursor = 'grabbing';
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    if (!mapFitted) {
      cameraX -= (e.clientX - dragStartX) / zoomLevel;
      cameraY -= (e.clientY - dragStartY) / zoomLevel;
    }
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    drawMap();
  });
  window.addEventListener('mouseup', e => {
    if (isDragging) {
      const moved = Math.abs(e.clientX - clickStartX) + Math.abs(e.clientY - clickStartY);
      isDragging = false;
      document.getElementById('mapArea').style.cursor = 'grab';
      if (moved < 5) handleMapPointerClick(e);
    }
  });

  drawMap();
}

function boardImageBounds() {
  const board = BOARD_ARTWORK[boardArtwork];
  const scale = hStep / board.dx;
  return {
    x: -board.x0 * scale, y: -board.y0 * scale,
    width: board.width * scale, height: board.height * scale,
  };
}

function fitBoardOnScreen() {
  mapFitted = true;
  drawMap();
}

function boardFitZoom(width, height, bounds) {
  return Math.min(Math.max(1, width - 12) / bounds.width, Math.max(1, height - 12) / bounds.height);
}

function zoomMap(dir) {
  if (dir < 0) {
    const rect = document.getElementById('mapSvg').getBoundingClientRect();
    const fit = boardFitZoom(rect.width, rect.height, boardImageBounds());
    if (zoomLevel / 1.2 <= fit) {
      fitBoardOnScreen();
      return;
    }
  }
  mapFitted = false;
  zoomLevel = dir > 0 ? Math.min(zoomLevel * 1.2, 4) : zoomLevel / 1.2;
  drawMap();
}

function clampMapAxis(center, start, length, viewLength) {
  if (viewLength >= length) return start + length / 2;
  return Math.max(start + viewLength / 2, Math.min(center, start + length - viewLength / 2));
}


function drawMap() {
  const svg = document.getElementById('mapSvg');
  const svgRect = svg.getBoundingClientRect();
  const svgW = svgRect.width || 800;
  const svgH = svgRect.height || 600;
  const bounds = boardImageBounds();
  if (mapFitted) {
    zoomLevel = boardFitZoom(svgW, svgH, bounds);
  }
  const viewW = svgW / zoomLevel;
  const viewH = svgH / zoomLevel;
  cameraX = clampMapAxis(cameraX, bounds.x, bounds.width, viewW);
  cameraY = clampMapAxis(cameraY, bounds.y, bounds.height, viewH);
  const viewX = cameraX - viewW / 2;
  const viewY = cameraY - viewH / 2;
  svg.setAttribute('viewBox', `${viewX} ${viewY} ${viewW} ${viewH}`);
  document.getElementById('zoomLabel').textContent = Math.round(zoomLevel * 100) + '%';
  svg.innerHTML = '';

  const ns = 'http://www.w3.org/2000/svg';
  const boardImage = document.createElementNS(ns, 'image');
  boardImage.setAttribute('href', ART_DIRECTORY + BOARD_ARTWORK[boardArtwork].file);
  for (const [key, value] of Object.entries(bounds)) boardImage.setAttribute(key, value);
  boardImage.setAttribute('pointer-events', 'none');
  svg.appendChild(boardImage);

  const actor = getActiveUnit();
  const showingShot = currentPhase === 'RANGED' && actor && selectedWeapon && isPlayerUnit(actor);
  const showingMelee = currentPhase === 'MELEE' && actor && selectedSwordSide && isPlayerUnit(actor);

  // 地図・移動範囲・攻撃範囲を同じヘックス座標に描画。
  for (let c = 0; c < mapCols; c++) {
    for (let r = 0; r < mapRows; r++) {
      if (!isPlayableBoardHex(c, r)) continue;
      const absX = c * hStep;
      const absY = r * vStep + (c % 2) * (vStep / 2);
      if (absX < viewX - hexSize*2 || absX > viewX + viewW + hexSize*2 ||
          absY < viewY - hexSize*2 || absY > viewY + viewH + hexSize*2) continue;
      const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      polygon.setAttribute('points', hexPoints(absX, absY));
      const isReachable = reachableHexes.some(rh => rh.x === c && rh.y === r);
      const isSelected = selectedMoveTarget && selectedMoveTarget.x === c && selectedMoveTarget.y === r;
      const occupant = units.find(un => un.status === 'alive' && un.x === c && un.y === r);
      const wreckHere = units.some(un => un.status === 'destroyed' && un.x === c && un.y === r);
      const hex = { x: c, y: r };
      const attackable = (showingShot && rangedShotAt(actor, hex, selectedWeapon)) ||
        (showingMelee && canMeleeTarget(actor, hex, selectedSwordSide, selectedMeleeMethod));
      if (isSelected) {
        polygon.setAttribute('fill', 'rgba(50,205,50,0.5)');
        polygon.setAttribute('stroke', 'rgba(255,255,255,0.5)');
        polygon.setAttribute('stroke-width', '0.5');
      } else if (isReachable) {
        polygon.setAttribute('fill', 'rgba(50,205,50,0.32)');
        polygon.setAttribute('stroke', 'rgba(180,255,190,0.65)');
        polygon.setAttribute('stroke-width', '0.85');
      } else if (attackable) {
        polygon.setAttribute('fill', 'rgba(233,130,50,0.28)');
        polygon.setAttribute('stroke', 'rgba(255,179,100,0.85)');
        polygon.setAttribute('stroke-width', '0.9');
      } else if (occupant) {
        const st = rankRainbowStyle(occupant.effectivePower);
        polygon.setAttribute('fill', st.fill);
        polygon.setAttribute('stroke', st.stroke);
        polygon.setAttribute('stroke-width', String(st.sw));
      } else if (wreckHere) {
        polygon.setAttribute('fill', 'rgba(40,40,48,0.55)');
        polygon.setAttribute('stroke', 'rgba(180,140,80,0.55)');
        polygon.setAttribute('stroke-width', '0.6');
      } else {
        continue;
      }
      svg.appendChild(polygon);
    }
  }

  drawRevealedMovePaths(svg);

  // テキスト／十字パッドの進路プレビュー（水色矢印）
  if (currentPhase === 'MOVE' && previewStepStates && previewStepStates.length > 1) {
    drawPreviewMoveTrajectory(svg, previewStepStates, viewX, viewY, viewW, viewH);
  } else if (previewPath.length > 1) {
    const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    const pts = previewPath.map(p => {
      const c = hexCenter(p.x, p.y);
      return `${c.x},${c.y}`;
    }).join(' ');
    polyline.setAttribute('points', pts);
    polyline.setAttribute('stroke', '#32cd32');
    polyline.setAttribute('stroke-width', '4');
    polyline.setAttribute('stroke-dasharray', '6,4');
    polyline.setAttribute('fill', 'none');
    svg.appendChild(polyline);
  }

  // 同じマスに止まった駒も、重ねず並べて表示する。
  const NSU = ns;
  const stacks = new Map();
  for (const unit of units) {
    if (unit.status !== 'alive') continue;
    const key = `${unit.x},${unit.y}`;
    if (!stacks.has(key)) stacks.set(key, []);
    stacks.get(key).push(unit);
  }
  for (const stack of stacks.values()) {
    const center = hexCenter(stack[0].x, stack[0].y);
    const size = stack.length === 1 ? 29 : stack.length === 2 ? 20 : 15;
    stack.slice(0, 4).forEach((unit, i) => {
      const x = center.x + (stack.length === 1 ? 0 : (i % 2 ? 1 : -1) * (size / 2 + 1));
      const y = center.y + (stack.length <= 2 ? 0 : (i < 2 ? -1 : 1) * (size / 2 + 1));
      drawUnitCounter(svg, unit, x, y, size, stack.length === 1);
    });
    if (stack.length > 4) {
      const count = document.createElementNS(ns, 'text');
      count.setAttribute('x', center.x);
      count.setAttribute('y', center.y + 22);
      count.setAttribute('class', 'counter-name');
      count.textContent = `+${stack.length - 4}`;
      svg.appendChild(count);
    }
  }

  // 撃墜：マップ上は 💥 のみ（文言は出さない）
  units.forEach(u => {
    if (u.status !== 'destroyed') return;
    const absX = u.x * hStep;
    const absY = u.y * vStep + (u.x % 2) * (vStep / 2);
    const boom = document.createElementNS(NSU, 'text');
    boom.setAttribute('x', absX);
    boom.setAttribute('y', absY + 6);
    boom.setAttribute('text-anchor', 'middle');
    boom.setAttribute('font-size', '26px');
    boom.setAttribute('pointer-events', 'none');
    boom.textContent = '\u{1F4A5}';
    svg.appendChild(boom);
  });

  if (currentPhase === 'RANGED' && rangedAwaitingTarget && selectedWeapon) {
    const ru = getActiveUnit();
    if (ru && ru.status === 'alive' && isPlayerUnit(ru)) {
      drawRangedProbabilityBubbles(svg, ru, viewX, viewY, viewW, viewH);
    }
  }
}

function drawRevealedMovePaths(svg) {
  const ns = 'http://www.w3.org/2000/svg';
  const edge = '#111e2b';
  for (const route of moveRevealPaths || []) {
    if (!route.hexes || route.hexes.length < 2) continue;
    const points = route.hexes.map(hex => hexCenter(hex.x, hex.y));
    const last = points[points.length - 1];
    const before = points[points.length - 2];
    const length = Math.hypot(last.x - before.x, last.y - before.y);
    if (!length) continue;
    const dx = (last.x - before.x) / length;
    const dy = (last.y - before.y) / length;
    const tip = { x:last.x - dx * 18, y:last.y - dy * 18 };
    const base = { x:tip.x - dx * 12, y:tip.y - dy * 12 };
    const color = route.team === 'given' ? '#75caff' : '#ff786e';
    points[points.length - 1] = base;
    const geometry = points.map(p => `${p.x},${p.y}`).join(' ');
    const group = document.createElementNS(ns, 'g');
    group.setAttribute('pointer-events', 'none');
    group.setAttribute('data-move-route', route.unitId);
    for (const [stroke, width] of [[edge, 9], [color, 5]]) {
      const line = document.createElementNS(ns, 'polyline');
      line.setAttribute('points', geometry);
      line.setAttribute('stroke', stroke);
      line.setAttribute('stroke-width', width);
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke-linecap', 'round');
      line.setAttribute('stroke-linejoin', 'round');
      line.setAttribute('vector-effect', 'non-scaling-stroke');
      group.appendChild(line);
    }
    const arrow = document.createElementNS(ns, 'polygon');
    arrow.setAttribute('points', `${tip.x},${tip.y} ${base.x - dy*7},${base.y + dx*7} ${base.x + dy*7},${base.y - dx*7}`);
    arrow.setAttribute('fill', color);
    arrow.setAttribute('stroke', edge);
    arrow.setAttribute('stroke-width', '2.5');
    arrow.setAttribute('stroke-linejoin', 'round');
    arrow.setAttribute('vector-effect', 'non-scaling-stroke');
    group.appendChild(arrow);
    svg.appendChild(group);
  }
}

function drawUnitCounter(svg, unit, x, y, size, showPilot) {
  const ns = 'http://www.w3.org/2000/svg';
  const teamColor = unit.team === 'given' ? '#68bcff' : '#ff7272';
  const angle = (HEX_VIEW_DIR_DEG[unit.dir] ?? -90) + 90;
  const radians = angle * Math.PI / 180;
  // Keep rotated counters within their original footprint when units share a hex.
  const scale = 1 / Math.max(1, Math.abs(Math.cos(radians)) + Math.abs(Math.sin(radians)));
  const group = document.createElementNS(ns, 'g');
  group.setAttribute('transform', `translate(${x},${y})`);
  group.setAttribute('pointer-events', 'none');
  group.setAttribute('data-unit-id', unit.id);
  const counter = document.createElementNS(ns, 'g');
  counter.setAttribute('class', 'unit-counter-face');
  counter.setAttribute('transform', `rotate(${angle}) scale(${scale})`);
  group.appendChild(counter);

  const frame = document.createElementNS(ns, 'rect');
  frame.setAttribute('x', -size / 2);
  frame.setAttribute('y', -size / 2);
  frame.setAttribute('width', size);
  frame.setAttribute('height', size);
  frame.setAttribute('rx', '1.5');
  frame.setAttribute('fill', '#202a36');
  frame.setAttribute('stroke', teamColor);
  frame.setAttribute('stroke-width', '2.3');
  counter.appendChild(frame);

  const artPath = counterArtworkPath(unit);
  if (artPath) {
    const sprite = document.createElementNS(ns, 'image');
    sprite.setAttribute('href', artPath);
    sprite.setAttribute('x', 1 - size / 2);
    sprite.setAttribute('y', 1 - size / 2);
    sprite.setAttribute('width', size - 2);
    sprite.setAttribute('height', size - 2);
    counter.appendChild(sprite);
  } else {
    const initials = document.createElementNS(ns, 'text');
    initials.setAttribute('class', 'counter-name');
    initials.setAttribute('y', '3');
    initials.textContent = unit.machine.slice(0, 3);
    group.appendChild(initials);
  }

  const front = document.createElementNS(ns, 'line');
  front.setAttribute('class', 'unit-counter-front');
  front.setAttribute('x1', -size * 0.32);
  front.setAttribute('x2', size * 0.32);
  front.setAttribute('y1', -size / 2);
  front.setAttribute('y2', -size / 2);
  front.setAttribute('stroke', '#fff5ca');
  front.setAttribute('stroke-width', '2.5');
  front.setAttribute('stroke-linecap', 'round');
  counter.appendChild(front);

  const marks = [];
  if (unitCannotAct(unit)) {
    marks.push({ text: 'D', label: '行動不能', x: size / 2 - 2, y: 7 - size / 2, align: 'end' });
  }
  const losses = unit.droppedWeaponCount;
  if (losses > 0) {
    marks.push({ text: 'W'.repeat(losses), label: `武器${losses}個喪失`, x: 0, y: size / 2 - 1, align: 'middle' });
  }
  for (const { text, label, x, y, align } of marks) {
    const marker = document.createElementNS(ns, 'text');
    marker.setAttribute('class', 'counter-status');
    marker.setAttribute('x', x);
    marker.setAttribute('y', y);
    marker.setAttribute('text-anchor', align);
    marker.setAttribute('aria-label', label);
    if (text.length * 9 > size - 2) {
      marker.setAttribute('textLength', size - 2);
      marker.setAttribute('lengthAdjust', 'spacingAndGlyphs');
    }
    marker.textContent = text;
    group.appendChild(marker);
  }
  if (showPilot) {
    const pilot = document.createElementNS(ns, 'text');
    pilot.setAttribute('class', 'counter-name');
    pilot.setAttribute('y', size / 2 + 7);
    pilot.textContent = unit.pilot.slice(0, 4);
    group.appendChild(pilot);
  }
  svg.appendChild(group);
}

function centerMapOnUnit(unit) {
  if (!mapFitted) {
    ({ x: cameraX, y: cameraY } = hexCenter(unit.x, unit.y));
  }
  drawMap();
}

/** 移動フェイズ用：到達可能 (x,y,dir) を列挙。実際の描画は drawMap が reachableHexes を参照して行う */
function highlightReachable(unit) {
  if (!unit || unit.movementRemaining <= 0) {
    reachableHexes = [];
    return;
  }
  reachableHexes = calcReachable(unit);
}

// ===== UI更新 =====
function updateTopBar() {
  document.getElementById('turnNum').textContent = gameTurn;
  const phaseNames = { INIT:'初期化', AURA_POWER:'オーラ力', ACTION_SELECT:'行動選択', MOVE:'移動', RANGED:'射撃', MELEE:'格闘', PLAN_READY:'命令完了', RESOLVE:'判定', TURN_REVIEW:'終了確認' };
  const phaseBase = phaseNames[currentPhase] || currentPhase;
  document.getElementById('phaseName').textContent = spectatorMode ? `${phaseBase} · 観戦` : phaseBase;
  const active = getActiveUnit();
  const rp = getRightPanelUnit();
  document.getElementById('activeUnitName').textContent = rp ? `${rp.pilot}(${rp.machine})` : '-';
  let act = '';
  if (active && active.selectedAction) {
    act = rp && active.id === rp.id ? `行動: ${active.selectedAction}` : `進行: ${active.pilot} … ${active.selectedAction}`;
  }
  document.getElementById('actionLabel').textContent = act;
}

// ===== ポップアップ =====
function showPopup(title, content, autoCloseMs) {
  if (spectatorMode) {
    addLog('system', `[観戦] ${title}`);
    const ms = Number(autoCloseMs) || 0;
    if (popupAutoCloseTimer) {
      clearTimeout(popupAutoCloseTimer);
      popupAutoCloseTimer = null;
    }
    if (ms > 0 && !gameOver) {
      popupAutoCloseTimer = setTimeout(() => {
        popupAutoCloseTimer = null;
        if (!gameOver) {
          if (checkVictory()) return;
          finishUnitTurn();
        }
      }, ms);
    }
    return;
  }
  if (popupAutoCloseTimer) {
    clearTimeout(popupAutoCloseTimer);
    popupAutoCloseTimer = null;
  }
  const popOv = document.getElementById('popupOverlay');
  const okBtn = document.getElementById('popupOkBtn');
  if (popOv) popOv.style.pointerEvents = 'auto';
  if (okBtn) okBtn.style.display = 'block';
  document.getElementById('popupTitle').textContent = title;
  document.getElementById('popupContent').innerHTML = content;
  document.getElementById('combatPopup').style.display = 'block';
  document.getElementById('popupOverlay').style.display = 'block';
  const ms = Number(autoCloseMs) || 0;
  if (ms > 0) {
    popupAutoCloseTimer = setTimeout(() => {
      popupAutoCloseTimer = null;
      const pop = document.getElementById('combatPopup');
      if (pop && pop.style.display === 'block') closePopup();
    }, ms);
  }
}

function closePopup() {
  if (popupAutoCloseTimer) {
    clearTimeout(popupAutoCloseTimer);
    popupAutoCloseTimer = null;
  }
  document.getElementById('combatPopup').style.display = 'none';
  document.getElementById('popupOverlay').style.display = 'none';
  // ポップアップ後にターン進行
  if (!gameOver) {
    if (checkVictory()) return;
    finishUnitTurn();
  }
}

// ===== ログ（コンソール＋デバッグ用バッファ。後から「ログ保存」でJSON出力） =====
function addLog(type, text) {
  const line = `[T${gameTurn}][${currentPhase}][${type}] ${text}`;
  if (typeof console !== 'undefined' && console.debug) console.debug(line);
  try {
    const u = typeof getActiveUnit === 'function' ? getActiveUnit() : null;
    debugLogBuffer.push({
      t: Date.now(),
      iso: new Date().toISOString(),
      turn: gameTurn,
      phase: currentPhase,
      turnSub: turnSubPhase,
      orderIdx: currentOrderIndex,
      type: String(type),
      text: String(text),
      activePilot: u && u.pilot ? u.pilot : null,
    });
    if (debugLogBuffer.length > DEBUG_LOG_MAX) {
      debugLogBuffer.splice(0, debugLogBuffer.length - DEBUG_LOG_MAX);
    }
  } catch (e) { /* ignore */ }
}

function clearDebugLogBuffer() {
  debugLogBuffer.length = 0;
  addLog('debug', '[LOG_CLEARED]');
}

function exportDebugLogDownload() {
  const payload = {
    exportedAt: new Date().toISOString(),
    gameTurn,
    currentPhase,
    turnSubPhase,
    entries: debugLogBuffer,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `dunbain-debug-${new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  addLog('debug', `[LOG_EXPORT] entries=${debugLogBuffer.length}`);
}

// ===== ゲーム開始 =====
window.onload = () => {
  clearInspectPanel();
  const saveBtn = document.getElementById('debugLogSaveBtn');
  const clearBtn = document.getElementById('debugLogClearBtn');
  if (saveBtn) saveBtn.addEventListener('click', () => exportDebugLogDownload());
  if (clearBtn) clearBtn.addEventListener('click', () => clearDebugLogBuffer());
  initGame();
};

window.getDunbainDebugLog = () => debugLogBuffer.slice();
window.addEventListener('resize', () => drawMap());
</script>
