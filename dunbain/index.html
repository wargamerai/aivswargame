/** 非相互格闘用: 受けなしのAI格闘 */
async function aiResolveSimpleMeleeNoDefense(unit, exchangeTarget) {
  try {
    const candidates = exchangeTarget ? [exchangeTarget] : units.filter(t => t.team !== unit.team && t.status === 'alive');
    candidates.sort((a, b) => Number(canSeeTarget(a, unit)) - Number(canSeeTarget(b, unit)) ||
      hexDistance(unit.x, unit.y, a.x, a.y) - hexDistance(unit.x, unit.y, b.x, b.y));
    const target = candidates.find(t => aiSetupMeleeParams(unit, t));
    if (!target) {
      addLog('system', `${unit.pilot}: 格闘目標なし(AI)`);
      finishUnitTurn();
      return;
    }
    unit.meleeParryStance = 'attacked';
    hideMapHud();
    centerMapOnUnit(unit);
    drawMap();
    if (!spectatorMode) await new Promise(resolve => playMeleeClashAnimation(unit, target, resolve));
    await runMeleeCombatDiceSequence(unit, target, { autoCloseMs: spectatorMode ? 0 : 2800 });
  } catch (e) {
    console.error('AI 格闘', e);
    addLog('system', `${unit.pilot}: 格闘処理で内部エラー`);
    finishUnitTurn();
  }
}

function runNextResolution() {
  if (resolutionIndex >= turnOrder.length) {
    finishWholeTurnAfterBatch();
    return;
  }
  const u = turnOrder[resolutionIndex];
  if (u.status !== 'alive') {
    resolutionIndex++;
    runNextResolution();
    return;
  }
  // 相互格闘で既に処理済み（受けを選んだ等）のユニットはスキップ
  if (u._mutualMeleeResolved) {
    delete u._mutualMeleeResolved;
    resolutionIndex++;
    runNextResolution();
    return;
  }
  currentOrderIndex = resolutionIndex;
  u.hasActed = false;
  updateTopBar();
  syncRightPanelUnitStats();
  centerMapOnUnit(u);
  if (u.selectedAction === '射撃') {
    if (isPlayerUnit(u)) {
      startRangedPhase(u);
      return;
    }
    void aiPresentRangedResolution(u);
    return;
  }
  if (isMeleeAction(u.selectedAction)) {
    // 相互格闘検出: 隣接する敵が格闘を選んでいてまだ未行動なら相互格闘
    const mutualFoe = findMutualMeleeOpponent(u);
    if (mutualFoe) {
      void (async () => {
        await resolveMutualMelee(u, mutualFoe);
      })();
      return;
    }
    // 片方だけ格闘 — 受けなし、そのまま攻撃
    if (isPlayerUnit(u)) {
      startMeleePhase(u);
      return;
    }
    void (async () => {
      await aiResolveSimpleMeleeNoDefense(u);
    })();
    return;
  }
  u.hasActed = true;
  resolutionIndex++;
  runNextResolution();
}

function finishWholeTurnAfterBatch() {
  if (turnSubPhase === 'review') return;
  const damage = simultaneousDamage;
  simultaneousDamage = [];
  for (const { target, part, result } of damage) applyDamage(target, part, result);
  if (damage.length) {
    addLog('damage', '同時攻撃の被害を適用');
    drawMap();
    syncRightPanelUnitStats();
    if (checkVictory()) return;
  }
  planSnapshot = null;
  for (const unit of units) {
    if (unit.status === 'alive') unit.previousDeclaredAction = unit.selectedAction;
    delete unit.planComplete;
    delete unit.planEndState;
    delete unit.planMoveCmd;
    delete unit.planPathHexes;
    delete unit.meleeParryStance;
  }
  if (checkVictory()) return;
  if (gameTurn >= scenario.maxTurn) {
    if (typeof DunbainQL !== 'undefined') DunbainQL.terminalUpdates(null);
    showVictory('引き分け', `${scenario.maxTurn}ターン経過`);
    return;
  }
  turnSubPhase = 'review';
  currentPhase = 'TURN_REVIEW';
  updateTopBar();
  syncRightPanelUnitStats();
  drawMap();
  if (spectatorMode && qlTrainEpisodesTarget > 0) {
    confirmNextTurn();
    return;
  }

  const panel = document.getElementById('mapHudPanel');
  panel.classList.remove('map-hud-ranged-phase', 'ranged-pick-target');
  panel.innerHTML = `
    <div class="map-hud-title">ターン ${gameTurn} の行動終了</div>
    ${moveRevealPaths?.length ? '<p class="roster-meta">盤面の矢印で移動経路を確認できます。</p>' : ''}
    <button type="button" class="action-btn" id="confirmNextTurnBtn" onclick="confirmNextTurn()">次のターンへ</button>
  `;
  showMapHud();
}

function confirmNextTurn() {
  if (gameOver || turnSubPhase !== 'review') return;
  hideMapHud();
  turnSubPhase = 'planning';
  moveRevealPaths = [];
  gameTurn++;
  addLog('system', `===== ターン${gameTurn} =====`);
  buildTurnOrder();
  currentOrderIndex = 0;
  resolutionIndex = 0;
  drawMap();
  startAuraPhase();
}

function endTurnFromEmptyOrder() {
  if (!checkVictory()) finishWholeTurnAfterBatch();
}

function findBestDirectionAt(x, y, dir, target) {
  let bestDir = null, bestDist = Infinity;
  for (let d = 0; d < 6; d++) {
    const nx = x + DIR_DX[d];
    const ny = y + (x % 2 === 0 ? DIR_DY_EVEN[d] : DIR_DY_ODD[d]);
    if (!isPlayableBoardHex(nx, ny)) continue;
    const dist = hexDistance(nx, ny, target.x, target.y);
    if (dist < bestDist) { bestDist = dist; bestDir = d; }
  }
  return bestDir;
}

function bestFaceDirToward(col, row, tcol, trow) {
  const c0 = hexCenter(col, row);
  const cT = hexCenter(tcol, trow);
  const wantA = Math.atan2(cT.y - c0.y, cT.x - c0.x);
  let bestD = 0, bestDiff = Infinity;
  for (let d = 0; d < 6; d++) {
    const n = getForwardHex(col, row, d);
    const c1 = hexCenter(n.x, n.y);
    const da = Math.atan2(c1.y - c0.y, c1.x - c0.x);
    let diff = wantA - da;
    while (diff > Math.PI) diff -= 2 * Math.PI;
    while (diff <= -Math.PI) diff += 2 * Math.PI;
    const ad = Math.abs(diff);
    if (ad < bestDiff) { bestDiff = ad; bestD = d; }
  }
  return bestD;
}

function aiGhostUnit(unit, x, y, dir) {
  return Object.assign({}, unit, { x, y, dir });
}

function aiCanRangedHitFrom(attacker, enemy) {
  return !!enemy && (attacker.weapons || []).some(weapon => rangedShotAt(attacker, enemy, weapon));
}

function aiCanMeleeFromPosition(attacker, enemy) {
  if (!enemy) return false;
  const actions = isMeleeAction(attacker.selectedAction)
    ? [attacker.selectedAction]
    : ['剣', '格闘'];
  return actions.some(action => {
    const unit = { ...attacker, selectedAction: action };
    return canMeleeTarget(unit, enemy, 'left') || canMeleeTarget(unit, enemy, 'right');
  });
}



/** 2d6 の出目合計が T 以下となる確率（36分のカウント） */
function aiProbability2d6Leq(T) {
  const t = Math.round(Number(T));
  if (!Number.isFinite(t)) return 0;
  let c = 0;
  for (let d1 = 1; d1 <= 6; d1++) {
    for (let d2 = 1; d2 <= 6; d2++) {
      if (d1 + d2 <= t) c++;
    }
  }
  return c / 36;
}

function aiCalcReachableForActionTemplate(unit, actionName) {
  return calcReachable({ ...unit, selectedAction: actionName, movementRemaining: movementAllowance(unit, actionName) });
}

function aiBestRangedHitProbForPosition(unit, x, y, dir, enemies) {
  const ghost = aiGhostUnit(unit, x, y, dir);
  let best = 0;
  const weapons = unit.weapons || [];
  for (let ei = 0; ei < enemies.length; ei++) {
    const e = enemies[ei];
    for (let wi = 0; wi < weapons.length; wi++) {
      const w = weapons[wi];
      if (w === 'ソード' || w === 'オーラソード' || w === 'ガッシュ') continue;
      const info = getRangedHitPreviewVsEnemy(ghost, e, w);
      if (!info) continue;
      const p = aiProbability2d6Leq(info.finalHit);
      if (p > best) best = p;
    }
  }
  return best;
}

function aiBestMeleeFirstRollProb(unit, x, y, dir, enemies, action) {
  const actions = isMeleeAction(action) ? [action] : ['剣', '格闘'];
  let best = 0;
  for (const selectedAction of actions) {
    const ghost = { ...aiGhostUnit(unit, x, y, dir), selectedAction };
    for (const enemy of enemies) {
      const evade = TARGET_EVADE_MOD[enemy.effectivePower] || 0;
      const actionMod = TARGET_ACTION_MOD[enemy.selectedAction] || 0;
      for (const side of ['left', 'right']) {
        for (const method of meleeMethodsForUnit(ghost)) {
          if (!canMeleeTarget(ghost, enemy, side, method)) continue;
          const base = MELEE_HIT[method]?.[ghost.effectivePower] || 0;
          const position = meleePositionMod(ghost, enemy, side);
          const aim = method === '斬る' || method === '突く' ? 1 : 0;
          best = Math.max(best, aiProbability2d6Leq(base + position + aim + evade + actionMod));
        }
      }
    }
  }
  return best;
}

function aiPlanStateTieBreak(a, b) {
  if (!b) return -1;
  if (!a) return 1;
  if (a.cost !== b.cost) return a.cost - b.cost;
  if (a.x !== b.x) return a.x - b.x;
  if (a.y !== b.y) return a.y - b.y;
  return a.dir - b.dir;
}

function aiMinHexDistanceToEnemies(x, y, enemies) {
  let d = Infinity;
  for (let i = 0; i < enemies.length; i++) {
    const h = hexDistance(x, y, enemies[i].x, enemies[i].y);
    if (h < d) d = h;
  }
  return d === Infinity ? 0 : d;
}

/**
 * 行動ごとの移動力で到達可能な (マス,向き) を総当たりし、射撃・格闘の理論命中確率（2d6 1回目）が高い位置を選ぶ。
 * 射程・射界・格闘届きが取れないときは、最寄り敵へのヘクス距離を縮める（接近）を優先する。
 */
function aiCombatStyle(unit) {
  const fighter = unit.type === 'WC' || unit.type === 'OB' || unit.machine === 'ガラバ' || unit.machine === 'ブブリィ';
  const hasShots = unit.weapons.some(label => {
    const weapon = rangedWeaponData(unit, label);
    return weapon && canOperateWeapon(unit, label) && (unit.ammo[label] ?? weapon.shots) > 0;
  });
  if (fighter && hasShots) return '射撃';
  if (unitHasMeleeSwordWeapon(unit)) return '剣';
  if (!fighter || unit.machine === 'ガラバ' || unit.machine === 'ブブリィ') return '格闘';
  return '離脱';
}

function aiScoreReachableState(unit, actionName, st, enemies, preferred) {
  if (!enemies.length) {
    return -hexDistance(st.x, st.y, Math.floor(mapCols / 2), Math.floor(mapRows / 2)) - st.cost * 0.01;
  }
  const ghost = { ...aiGhostUnit(unit, st.x, st.y, st.dir), selectedAction: actionName };
  const gunnery = preferred === '射撃';
  let best = -Infinity;
  for (const enemy of enemies) {
    const d = hexDistance(st.x, st.y, enemy.x, enemy.y);
    if (!d) continue;
    const blind = !canSeeTarget(enemy, ghost);
    const side = getAttackDirection(ghost, enemy);
    const lateral = side === '左側面' || side === '右側面';
    const ranged = actionName === '射撃' ? aiBestRangedHitProbForPosition(ghost, st.x, st.y, st.dir, [enemy]) : 0;
    const melee = isMeleeAction(actionName) ? aiBestMeleeFirstRollProb(ghost, st.x, st.y, st.dir, [enemy], actionName) : 0;
    const hitChance = Math.max(ranged, melee);
    const inAttackDistance = gunnery ? d <= 8 : d <= 3;
    const desiredRange = gunnery ? 4 : 1;
    const canSee = canSeeTarget(ghost, enemy);
    let score = blind ? (inAttackDistance ? 110 : 32) : lateral ? 12 : 0;
    if (hitChance > 0) {
      score += (actionName === preferred ? 120 : 47) + hitChance * 17;
    }
    if (preferred === '離脱') {
      score += Math.min(d, 12) * 8;
    } else {
      score -= Math.abs(d - desiredRange) * (gunnery ? 5 : 9);
      if (!canSee) score -= 12;
      if (gunnery && d === 1) score -= 15;
    }
    if (actionName === '射撃' && hitChance === 0) score -= 12;
    if (actionName === '突撃') score -= 1;
    best = Math.max(best, score);
  }
  return best - st.cost * 0.01;
}

// 両陣営とも機種の戦法と、相手の死角から攻撃できる位置を優先する。
function aiCreatePlan(unit) {
  const enemies = units.filter(e => e.team !== unit.team && e.status === 'alive')
    .sort((a, b) => hexDistance(unit.x, unit.y, a.x, a.y) - hexDistance(unit.x, unit.y, b.x, b.y));
  const threats = enemies.slice(0, 6);
  const preferred = aiCombatStyle(unit);
  const actionSet = availableActions(unit);

  const nearest = enemies[0] || null;

  const bestByAction = {};
  let globalBest = null;

  for (let ai = 0; ai < actionSet.length; ai++) {
    const actionName = actionSet[ai];
    const flat = aiCalcReachableForActionTemplate(unit, actionName);
    bestByAction[actionName] = { score: -Infinity, st: null };
    for (let fi = 0; fi < flat.length; fi++) {
      const st = flat[fi];
      const sc = aiScoreReachableState(unit, actionName, st, threats, preferred);
      const curA = bestByAction[actionName];
      if (sc > curA.score || (sc === curA.score && aiPlanStateTieBreak(st, curA.st) < 0)) {
        bestByAction[actionName] = { score: sc, st };
      }
      if (!globalBest || sc > globalBest.score ||
        (sc === globalBest.score && aiPlanStateTieBreak(st, globalBest.st) < 0)) {
        globalBest = { score: sc, action: actionName, st };
      }
    }
  }

  if (!globalBest || !globalBest.st) {
    unit.selectedAction = '通常移動';
    unit.movementRemaining = movementAllowance(unit, '通常移動');
    unit.planEndState = { x: unit.x, y: unit.y, dir: unit.dir };
    unit.planMoveCmd = null;
    unit.planPathHexes = [{ x: unit.x, y: unit.y }];
    completeAiMovementPlan(unit);
    addLog(unit.team, `${unit.pilot}: 行動「通常移動」プラン（フォールバック）(AI)`);
    return;
  }

  // 学習で選ぶ場合も、機種の戦法や死角優先から外れない候補に絞る。
  const candidates = actionSet.flatMap(actionName => {
    const { score, st } = bestByAction[actionName];
    if (!st || score + 8 < globalBest.score) return [];
    return [{ action:actionName, end:{ x:st.x, y:st.y, dir:st.dir, pathHexes:st.path } }];
  });

  const legalNames = candidates.map(c => c.action);
  if (typeof DunbainQL !== 'undefined') DunbainQL.onAiPlanStart(unit, legalNames);

  let chosen = globalBest.action;
  let end = candidates.find(c => c.action === chosen).end;

  if (typeof DunbainQL !== 'undefined' && !isPlayerUnit(unit) && nearest) {
    const sk = DunbainQL.encodeState(unit, nearest);
    let policyChoice = chosen;
    if (DunbainQL.isBlendEnabled()) {
      const eps = DunbainQL.isEnabled() ? DunbainQL.getEpsilon() : DunbainQL.getPlayEpsilon();
      policyChoice = DunbainQL.pickActionBlended(sk, legalNames, chosen, eps);
    } else if (DunbainQL.isEnabled()) {
      policyChoice = DunbainQL.pickAction(sk, legalNames, DunbainQL.getEpsilon());
    }
    const found = candidates.find(c => c.action === policyChoice);
    if (found) {
      chosen = found.action;
      end = found.end;
    }
    if (DunbainQL.isEnabled()) DunbainQL.setPending(unit, sk, chosen);
  }

  unit.selectedAction = chosen;
  unit.movementRemaining = movementAllowance(unit, chosen);
  unit.planEndState = { x: end.x, y: end.y, dir: end.dir };
  unit.planMoveCmd = null;
  unit.planPathHexes = end.pathHexes ? end.pathHexes.slice() : [{ x: unit.x, y: unit.y }];
  completeAiMovementPlan(unit);
  const position = aiGhostUnit(unit, end.x, end.y, end.dir);
  const blind = nearest && !canSeeTarget(nearest, position);
  addLog(unit.team, `${unit.pilot}: ${preferred}を優先 → ${chosen}${blind ? '（最寄りの敵の死角）' : ''} (AI)`);
}



function movementType(unit) {
  return unit.machine === 'ガラバ' || unit.machine === 'ブブリィ' ? 'WC' : unit.type || 'AB';
}

function unitCannotAct(unit) {
  const machine = AURA_BATTLERS[unit.machine] || WING_CALIBERS[unit.machine];
  return unit.collisionInactiveTurn === gameTurn || getAuraForPower(unit) < (machine?.reqAura || 0);
}

function movementAllowance(unit, action) {
  const type = movementType(unit);
  if (action === '変形') return getMovement('変形・合体', unit.effectivePower);
  if (type === 'AB') return getMovement(action, unit.effectivePower);
  const points = VEHICLE_MOVEMENT[unit.machine]?.[action];
  if (points == null) return 0;
  const wingDamage = Math.max(0, (unit.maxDurability?.['ウイング'] || 0) - (unit.durability?.['ウイング'] || 0));
  return Math.max(0, points + (VEHICLE_POWER_MOVE_MOD[unit.effectivePower] || 0) - wingDamage);
}

function availableActions(unit) {
  const type = movementType(unit);
  const actions = ['射撃', '回避', '通常移動', '高速移動'];
  if (type === 'AB' || unit.machine === 'ガラバ' || unit.machine === 'ブブリィ') actions.push('格闘');
  if (type === 'AB' && unitHasMeleeSwordWeapon(unit)) actions.push('剣');
  if (unit.machine === 'ビルバイン') actions.push('変形');
  if (type === 'AB' && calcReachable({ ...unit, selectedAction: '突撃', movementRemaining: movementAllowance(unit, '突撃') }).length) {
    actions.push('突撃');
  }
  return actions.filter(action => action !== '射撃' ||
    (unit.previousDeclaredAction !== '射撃' && unit.weapons.some(label => {
      const weapon = rangedWeaponData(unit, label);
      return weapon && canOperateWeapon(unit, label) && (unit.ammo[label] ?? weapon.shots) > 0;
    })));
}

function showActionSelect(unit) {
  currentPhase = 'ACTION_SELECT';
  updateTopBar();

  const actions = availableActions(unit);
  const rangedBlocked = unit.previousDeclaredAction === '射撃';
  let html = '<div class="map-hud-title">行動パターン</div>';
  if (rangedBlocked) {
    html += '<div style="color:#c96;font-size:11px;line-height:1.4;margin:0 0 8px;">前ターンに射撃を選んだため、今ターンは射撃を選べません。</div>';
  }
  html += '<div class="action-btns map-hud-actions">';
  actions.forEach(a => {
    const mp = movementAllowance(unit, a);
    const dis = a === '射撃' && rangedBlocked;
    html += `<button type="button" class="action-btn" data-hud-action="${a}"${dis ? ' disabled title="前ターン射撃のため連続不可"' : ''}>${a} (移動力${mp})</button>`;
  });
  html += '</div>';
  if (unit.canopyCracked || unit.canopyOpen) {
    html += `<button type="button" class="action-btn" onclick="toggleCanopy()">キャノピーを${unit.canopyOpen ? '閉じる' : '開ける'}</button>`;
  }
  const mapHudPanel = document.getElementById('mapHudPanel');
  mapHudPanel.classList.remove('map-hud-ranged-phase');
  mapHudPanel.innerHTML = html;
  showMapHud();
  mapHudPanel.querySelectorAll('[data-hud-action]').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      selectAction(btn.getAttribute('data-hud-action'));
    });
  });
  drawMap();

}

function toggleCanopy() {
  const unit = getActiveUnit();
  if (!unit || (!unit.canopyCracked && !unit.canopyOpen) || currentPhase !== 'ACTION_SELECT') return;
  unit.canopyOpen = !unit.canopyOpen;
  addLog(unit.team, `${unit.pilot}: キャノピーを${unit.canopyOpen ? '開ける' : '閉じる'}`);
  showActionSelect(unit);
}

function selectAction(action) {
  const unit = getActiveUnit();
  if (!unit || currentPhase !== 'ACTION_SELECT') return;
  if (action === '射撃' && unit.previousDeclaredAction === '射撃') {
    addLog('system', `${unit.pilot}: 前ターンに射撃を選んでいるため、射撃は選べません`);
    return;
  }
  if (unitCannotAct(unit) || !availableActions(unit).includes(action)) return;
  unit.selectedAction = action;
  unit.movementRemaining = movementAllowance(unit, action);
  addLog(unit.team, `${unit.pilot}: 行動「${action}」選択 (移動力${unit.movementRemaining})`);
  syncRightPanelUnitStats();
  hideMapHud();
  startMovePhase(unit);
}

// ===== 移動フェイズ =====

      <button type="button" class="action-btn" onclick="cancelMove()" style="flex:1;">クリア</button>
      <button type="button" class="action-btn" onclick="returnToActionSelection()" style="flex:1;">もとに戻る</button>
      <button onclick="skipMove()" ${unit.selectedAction === '突撃' ? 'disabled' : ''} style="flex:1;padding:6px;border:none;border-radius:4px;cursor:pointer;white-space:nowrap;font-size:12px;background:#664;color:#eee;">移動しない</button>
    </div>

  input.onkeydown = (e) => {

function moveAppendStep(ch) {
  const unit = getActiveUnit();
  if (!unit || currentPhase !== 'MOVE') return;
  const input = document.getElementById('moveInput');
  if (!input) return;
  const cur = input.value.toUpperCase().replace(/[^FBLREQZC]/g, '');
  const next = cur + ch;
  const result = simulateMove(unit, next);
  if (!result.valid) return;
  input.value = next;
  previewMove(unit);
}

function updateMovePadButtons(unit) {
  if (!unit || currentPhase !== 'MOVE') return;
  const input = document.getElementById('moveInput');
  const cur = input ? input.value.toUpperCase().replace(/[^FBLREQZC]/g, '') : '';
  const confirm = document.querySelector('#mapHudPanel #moveConfirm');
  const current = simulateMove(unit, cur);
  if (confirm) confirm.disabled = !current.valid || !isCompleteMovement(unit, current.cost);
  for (const ch of ['F', 'B', 'L', 'R']) {
    const btn = document.getElementById('movePad' + ch);
    if (!btn) continue;
    btn.disabled = !simulateMove(unit, cur + ch).valid;
  }
}

const MOVE_COMMANDS = { F: 0, E: 1, C: 2, B: 3, Z: 4, Q: 5 };

function meleeRotateMoveCost(unit) {
  if (movementType(unit) === 'OB') return 0;
  return unit.destroyed?.['翼'] ? 2 : 1;
}

function moveCommands(unit) {
  if (unit.selectedAction === '突撃') return ['F'];
  if (movementType(unit) === 'WC') return ['F', 'L', 'R'];
  if (movementType(unit) === 'OB') return ['F', 'E', 'C', 'B', 'Z', 'Q', 'L', 'R'];
  return ['F', 'B', 'L', 'R'];
}

function initialMoveState(unit) {
  return { x: unit.x, y: unit.y, dir: unit.dir, cost: 0, turns: 0, turnedHere: false, path: [{ x: unit.x, y: unit.y }] };
}

function advanceMovement(unit, state, command) {
  const commands = moveCommands(unit);
  if (!commands.includes(command)) return null;
  if (command === 'L' || command === 'R') {
    const limited = movementType(unit) === 'WC';
    const turnLimit = unit.machine === 'バラウ' || unit.machine === 'ズロン' ? 2 : 3;
    if (limited && (state.turnedHere || state.turns >= turnLimit)) return null;
    const cost = state.cost + meleeRotateMoveCost(unit);
    if (cost > unit.movementRemaining) return null;
    return { ...state, dir: (state.dir + (command === 'R' ? 1 : 5)) % 6, cost,
      turns: limited ? state.turns + 1 : 0, turnedHere: limited };
  }
  const next = hexNeighbor(state.x, state.y, (state.dir + MOVE_COMMANDS[command]) % 6);
  const cost = state.cost + 1;
  if (cost > unit.movementRemaining || !isPlayableBoardHex(next.x, next.y)) return null;
  return { ...state, ...next, cost, turnedHere: false, path: [...state.path, next] };
}

function isCompleteMovement(unit, cost) {
  return unit.selectedAction !== '突撃' || cost === unit.movementRemaining;
}

function calcReachable(unit) {
  const start = initialMoveState(unit);
  const states = new Map();
  const key = state => [state.x, state.y, state.dir, state.turns, state.turnedHere].join(',');
  const commands = moveCommands(unit);
  states.set(key(start), start);
  const queue = [start];
  for (let i = 0; i < queue.length; i++) {
    const state = queue[i];
    if (states.get(key(state)) !== state) continue;
    for (const command of commands) {
      const next = advanceMovement(unit, state, command);
      if (!next) continue;
      const k = key(next);
      if (states.has(k) && states.get(k).cost <= next.cost) continue;
      states.set(k, next);
      queue.push(next);
    }
  }
  const destinations = new Map();
  for (const state of states.values()) {
    if (!isCompleteMovement(unit, state.cost)) continue;
    const k = [state.x, state.y, state.dir].join(',');
    if (!destinations.has(k) || destinations.get(k).cost > state.cost) destinations.set(k, state);
  }
  return [...destinations.values()];
}

function getForwardHex(x, y, dir) {
  return hexNeighbor(x, y, dir);
}

function angleRadTowardFacingDir(col, row, dir) {
  const n = getForwardHex(col, row, dir);
  const c0 = hexCenter(col, row);
  const c1 = hexCenter(n.x, n.y);
  return Math.atan2(c1.y - c0.y, c1.x - c0.x);
}

// クリックがヘクスの辺付近（正面＝その向きの隣マス側）なら、その向きを返す
function pickFacingDirFromHexSideClick(col, row, mx, my, allowedDirs) {
  if (!allowedDirs || !allowedDirs.length) return null;
  const c = hexCenter(col, row);
  const dist = Math.hypot(mx - c.x, my - c.y);
  if (dist < hexSize * 0.2) return null;
  const clickA = Math.atan2(my - c.y, mx - c.x);
  let bestD = null;
  let bestDiff = Infinity;
  for (const d of allowedDirs) {
    const dirA = angleRadTowardFacingDir(col, row, d);
    let diff = clickA - dirA;
    while (diff > Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    const ad = Math.abs(diff);
    if (ad < bestDiff) {
      bestDiff = ad;
      bestD = d;
    }
  }
  if (bestD == null || bestDiff > Math.PI / 6 + 0.12) return null;
  return bestD;
}

// ===== マップ上フロートHUD =====
function clientToMapSvgXY(e) {
  const svg = document.getElementById('mapSvg');
  const svgRect = svg.getBoundingClientRect();
  const viewW = svgRect.width / zoomLevel;
  const viewH = svgRect.height / zoomLevel;
  const viewX = cameraX - viewW / 2;
  const viewY = cameraY - viewH / 2;
  const mx = viewX + (e.clientX - svgRect.left) / zoomLevel;
  const my = viewY + (e.clientY - svgRect.top) / zoomLevel;
  return { mx, my };
}

function hideMapHud() {
  rangedAwaitingTarget = false;
  const hud = document.getElementById('mapHud');
  const panel = document.getElementById('mapHudPanel');
  if (panel) {
    panel.innerHTML = '';
    panel.classList.remove('ranged-pick-target', 'map-hud-ranged-phase');
  }
  if (hud) hud.style.display = 'none';
}

function showMapHud() {
  const hud = document.getElementById('mapHud');
  if (hud) hud.style.display = 'block';
}

function pickUnitAtMapPointer(e) {
  const { mx, my } = clientToMapSvgXY(e);
  let best = null;
  let bestScore = Infinity;
  for (const u of units) {
    if (u.status !== 'alive' && u.status !== 'destroyed') continue;
    const c = hexCenter(u.x, u.y);
    const d = Math.hypot(mx - c.x, my - c.y);
    if (d >= hexSize * 0.88) continue;
    const score = d + (u.status === 'alive' ? 0 : 0.15);
    if (score < bestScore) {
      bestScore = score;
      best = u;
    }
  }
  return best;
}

function clearInspectPanel() {
  if (inspectTargetUnitId == null) return;
  const prev = document.getElementById(`roster-unit-${inspectTargetUnitId}`);
  if (prev) prev.classList.remove('inspected');
  inspectTargetUnitId = null;
}

function showInspectPanelForUnit(unit) {
  if (!unit) return;
  clearInspectPanel();
  inspectTargetUnitId = unit.id;
  const card = document.getElementById(`roster-unit-${unit.id}`);
  if (card) {
    card.classList.add('inspected');
    card.scrollIntoView({ block:'nearest', inline:'nearest' });
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function handleMapPointerClick(e) {
  if (e.target.closest && e.target.closest('#mapHudPanel')) return;

  const hit = pickUnitAtMapPointer(e);
  const active = getActiveUnit();

  if (currentPhase === 'PLAN_READY') {
    if (hit) showInspectPanelForUnit(hit);
    else clearInspectPanel();
    return;
  }

  if (currentPhase === 'RANGED' && rangedAwaitingTarget && selectedWeapon && active && isPlayerUnit(active)) {
    if (tryRangedTargetClick(e)) return;
    if (hit && (!active || hit.id !== active.id)) showInspectPanelForUnit(hit);
    else clearInspectPanel();
    return;
  }

  if (currentPhase === 'MOVE' && active && isPlayerUnit(active)) {
    if (hit && hit.id !== active.id) {
      showInspectPanelForUnit(hit);
      return;
    }
    onMapClick(e);
    if (!hit || hit.id === active.id) clearInspectPanel();
    return;
  }

  if (currentPhase === 'ACTION_SELECT' && active && isPlayerUnit(active)) {
    if (hit && hit.id !== active.id) {
      showInspectPanelForUnit(hit);
      return;
    }
    if (hit) showInspectPanelForUnit(hit);
    return;
  }

  if (hit) showInspectPanelForUnit(hit);
  else clearInspectPanel();
}

function tryRangedTargetClick(e) {
  const unit = getActiveUnit();
  if (!unit || !selectedWeapon || !rangedAwaitingTarget) return false;
  const { mx, my } = clientToMapSvgXY(e);
  let best = null, bestD = Infinity;
  for (const u of units) {
    if (u.status !== 'alive' || u.team === unit.team) continue;
    const c = hexCenter(u.x, u.y);
    const d = Math.hypot(mx - c.x, my - c.y);
    if (d < hexSize * 0.88 && d < bestD) { bestD = d; best = u; }
  }
  if (!best) return false;
  if (!rangedShotAt(unit, best, selectedWeapon)) return false;
  rangedAwaitingTarget = false;
  const p = document.getElementById('mapHudPanel');
  if (p) p.classList.remove('ranged-pick-target');
  fireAt(best.id);
  return true;
}

// マップクリックで移動先選択
function onMapClick(e) {
  if (currentPhase === 'PLAN_READY') return;
  if (currentPhase !== 'MOVE') return;
  const unit = getActiveUnit();
  if (!unit || !isPlayerUnit(unit)) return;

  const { mx, my } = clientToMapSvgXY(e);

  const byHex = new Map();
  for (const rh of reachableHexes) {
    const key = `${rh.x},${rh.y}`;
    if (!byHex.has(key)) byHex.set(key, []);
    byHex.get(key).push(rh);
  }
  let bestKey = null, bestDist = Infinity;
  for (const key of byHex.keys()) {
    const [hx, hy] = key.split(',').map(Number);
    const c = hexCenter(hx, hy);
    const d = Math.sqrt((mx - c.x) ** 2 + (my - c.y) ** 2);
    if (d < hexSize && d < bestDist) {
      bestDist = d;
      bestKey = key;
    }
  }

  if (!bestKey) return;
  if (isDragging) return;

  const selKey = selectedMoveTarget ? `${selectedMoveTarget.x},${selectedMoveTarget.y}` : null;
  if (selectedMoveTarget && dirChoices.length > 1 && bestKey === selKey) {
    const picked = pickFacingDirFromHexSideClick(selectedMoveTarget.x, selectedMoveTarget.y, mx, my, dirChoices);
    if (picked != null) {
      confirmMoveWithDir(selectedMoveTarget.x, selectedMoveTarget.y, picked);
      return;
    }
    return;
  }

  const states = byHex.get(bestKey);
  const dirs = [...new Set(states.map(s => s.dir))].sort((a, b) => a - b);
  if (dirs.length === 1) {
    const s = states.find(st => st.dir === dirs[0]);
    confirmMoveWithDir(s.x, s.y, s.dir);
    return;
  }

  const [tx, ty] = bestKey.split(',').map(Number);
  const edgeNow = pickFacingDirFromHexSideClick(tx, ty, mx, my, dirs);
  if (edgeNow != null) {
    confirmMoveWithDir(tx, ty, edgeNow);
    return;
  }
  selectedMoveTarget = { x: tx, y: ty };
  previewPath = [];
  previewStepStates = [];
  dirChoices = dirs;
  showDirSelect(unit, selectedMoveTarget, dirs);
  drawMap();
}

function showDirSelect(unit, target, allowedDirs) {
  const panel = document.getElementById('mapHudPanel');
  showMapHud();
  const dirNames = ['↑N','↗NE','↘SE','↓S','↙SW','↖NW'];
  const isSameHex = target.x === unit.x && target.y === unit.y;
  const allow = allowedDirs != null && allowedDirs.length > 0 ? new Set(allowedDirs) : null;
  let html = `<div class="section-title" style="color:#c8a020;font-size:12px;font-weight:bold;margin-bottom:6px;">${isSameHex ? 'その場で旋回' : `移動先(${target.x},${target.y})`} — 向き選択</div>`;
  html += '<div style="color:#888;font-size:11px;margin-bottom:8px;line-height:1.35;">マップで<strong style="color:#f88;">同じマスのヘクス辺</strong>（進みたい向きの外側の辺）をクリックしても確定できます。中央付近のクリックは無視されます。</div>';
  html += '<div class="action-btns">';
  for (let d = 0; d < 6; d++) {
    if (allow && !allow.has(d)) continue;
    const current = (d === unit.dir && isSameHex) ? ' (現在)' : '';
    html += `<button class="action-btn" onclick="confirmMoveWithDir(${target.x},${target.y},${d})">${dirNames[d]}${current}</button>`;
  }
  html += '</div>';
  html += '<div style="margin-top:8px;display:flex;gap:6px;">';
  html += '<button class="action-btn" onclick="cancelMoveSelect()">移動入力へ</button>';
  html += '<button class="action-btn" onclick="returnToActionSelection()">もとに戻る</button>';
  if (isSameHex) html += '<button class="action-btn" onclick="skipMove()">移動しない</button>';
  html += '</div>';
  panel.innerHTML = html;

}

function previewMove(unit) {
  const input = document.getElementById('moveInput');
  const raw = input.value.toUpperCase();
  const cmd = raw.replace(/[^FBLREQZC]/g, '');
  if (raw !== cmd) input.value = cmd;
  const result = simulateMove(unit, cmd);
  previewPath = result.path;
  previewStepStates = result.stepStates || [];
  moveCost = result.cost;
  input.className = result.valid ? 'preview' : '';
  const remainEl = document.getElementById('moveRemain');
  if (remainEl) remainEl.textContent = unit.movementRemaining - moveCost;
  updateMovePadButtons(unit);
  drawMap();
}

function simulateMove(unit, cmd) {
  let state = initialMoveState(unit);
  const stepStates = [{ x: state.x, y: state.y, dir: state.dir }];
  let valid = true;
  for (const command of cmd) {
    const next = advanceMovement(unit, state, command);
    if (!next) { valid = false; break; }
    state = next;
    stepStates.push({ x: state.x, y: state.y, dir: state.dir });
  }
  return { path: state.path, cost: state.cost, valid, endX: state.x, endY: state.y, endDir: state.dir, stepStates };
}

function confirmMoveWithDir(x, y, dir) {
  const unit = getActiveUnit();
  const rh = reachableHexes.find(r => r.x === x && r.y === y && r.dir === dir);
  if (!unit || !rh) return;
  if (turnSubPhase === 'planning') {
    unit.planEndState = { x, y, dir };
    unit.planMoveCmd = null;
    if (rh.path.length) {
      unit.planPathHexes = rh.path.map(h => ({ x: h.x, y: h.y }));
    } else {
      unit.planPathHexes = [{ x: unit.x, y: unit.y }];
      if (x !== unit.x || y !== unit.y) unit.planPathHexes.push({ x, y });
    }
    previewPath = [];
    previewStepStates = [];
    reachableHexes = [];
    selectedMoveTarget = null;
    dirChoices = [];
    const dirNames = ['N','NE','SE','S','SW','NW'];
    addLog(unit.team, `${unit.pilot}: 移動プラン → (${x},${y}) 向き${dirNames[dir]}`);
    hideMapHud();
    endMovePhase(unit);
    return;
  }
  unit.x = x;
  unit.y = y;
  unit.dir = dir;
  previewPath = [];
  previewStepStates = [];
  reachableHexes = [];
  selectedMoveTarget = null;
  dirChoices = [];
  const dirNames = ['N','NE','SE','S','SW','NW'];
  addLog(unit.team, `${unit.pilot}: 移動 → (${x},${y}) 向き${dirNames[dir]}`);
  hideMapHud();
  endMovePhase(unit);
}

function returnToActionSelection() {
  const unit = getActiveUnit();
  if (!unit || currentPhase !== 'MOVE' || turnSubPhase !== 'planning' || unit.planComplete) return;
  unit.selectedAction = null;
  unit.movementRemaining = 0;
  previewPath = [];
  previewStepStates = [];
  moveCost = 0;
  reachableHexes = [];
  selectedMoveTarget = null;
  dirChoices = [];
  addLog(unit.team, `${unit.pilot}: 行動パターンを選び直す`);
  syncRightPanelUnitStats();
  showActionSelect(unit);
}

function cancelMoveSelect() {
  selectedMoveTarget = null;
  previewPath = [];
  previewStepStates = [];
  const unit = getActiveUnit();
  if (unit) startMovePhase(unit);
}

function confirmMove() {
  const unit = getActiveUnit();
  if (!unit) return;
  const cmd = document.getElementById('moveInput').value.toUpperCase().replace(/[^FBLREQZC]/g, '');
  if (!cmd) { skipMove(); return; }
  const result = simulateMove(unit, cmd);
  if (!result.valid || !isCompleteMovement(unit, result.cost)) return;

  if (turnSubPhase === 'planning') {
    unit.planMoveCmd = cmd;
    unit.planEndState = { x: result.endX, y: result.endY, dir: result.endDir };
    unit.planPathHexes = result.path.map(h => ({ x: h.x, y: h.y }));
    previewPath = [];
    previewStepStates = [];
    reachableHexes = [];
    addLog(unit.team, `${unit.pilot}: 移動プラン → (${result.endX},${result.endY}) 向き${result.endDir}`);
    hideMapHud();
    endMovePhase(unit);
    return;
  }

  unit.x = result.endX;
  unit.y = result.endY;
  unit.dir = result.endDir;
  previewPath = [];
  previewStepStates = [];
  reachableHexes = [];
  addLog(unit.team, `${unit.pilot}: 移動 → (${unit.x},${unit.y}) 向き${unit.dir}`);
  hideMapHud();
  endMovePhase(unit);
}

function cancelMove() {
  previewPath = [];
  previewStepStates = [];
  moveCost = 0;
  const input = document.getElementById('moveInput');
  if (input) {
    input.value = '';
    input.className = '';
  }
  const unit = getActiveUnit();
  const remainEl = document.getElementById('moveRemain');
  if (remainEl && unit) remainEl.textContent = unit.movementRemaining;
  updateMovePadButtons(unit);
  drawMap();
}

function skipMove() {
  const unit = getActiveUnit();
  if (!unit || !isCompleteMovement(unit, 0)) return;
  previewPath = [];
  previewStepStates = [];
  reachableHexes = [];
  if (turnSubPhase === 'planning') {
    unit.planEndState = { x: unit.x, y: unit.y, dir: unit.dir };
    unit.planMoveCmd = '';
    unit.planPathHexes = [{ x: unit.x, y: unit.y }];
    addLog(unit.team, `${unit.pilot}: 移動なし（プラン）`);
    hideMapHud();
    endMovePhase(unit);
    return;
  }
  addLog(unit.team, `${unit.pilot}: 移動なし`);
  hideMapHud();
  endMovePhase(unit);
}

function endMovePhase(unit) {
  drawMap();
  if (turnSubPhase === 'planning') {
    if (!unit.planEndState) {
      unit.planEndState = { x: unit.x, y: unit.y, dir: unit.dir };
    }
    unit.planComplete = true;
    advanceToNextHumanPlan();
    return;
  }
  if (unit.selectedAction === '射撃') {
    startRangedPhase(unit);
  } else if (isMeleeAction(unit.selectedAction)) {
    startMeleePhase(unit);
  } else {
    finishUnitTurn();
  }
}

// ===== 射撃フェイズ =====
function startRangedPhase(unit) {
  currentPhase = 'RANGED';
  updateTopBar();
  rangedAwaitingTarget = false;
  rangedShotInProgress = false;
  selectedWeapon = null;

  const enemies = units.filter(u => u.team !== unit.team && u.status === 'alive');
  if (enemies.length === 0 || unit.weapons.length === 0) {
    addLog('system', `${unit.pilot}: 射撃対象なし`);
    hideMapHud();
    finishUnitTurn();
    return;
  }

  let html = '<div class="combat-title">武器選択 → 敵機をクリック</div>';
  html += '<div id="rangedWeaponRow" style="margin-bottom:6px;">';
  unit.weapons.forEach(w => {
    const weapon = rangedWeaponData(unit, w);
    if (!weapon || !canOperateWeapon(unit, w)) return;
    const remaining = unit.ammo?.[w] ?? weapon.shots;
    const quantity = Number.isFinite(remaining) ? `（${remaining}）` : '';
    html += `<button type="button" class="weapon-btn ranged-wpick" data-weapon="${encodeURIComponent(w)}"${remaining > 0 ? '' : ' disabled'}>${w}${quantity}</button>`;
  });
  html += '</div>';
  html += '<div id="rangedHudHint" style="display:none;color:#8cf;font-size:11px;line-height:1.35;margin:6px 0;"></div>';
  html += '<button type="button" class="action-btn" style="margin-top:6px;" id="rangedSkipBtn">射撃しない</button>';
  const mapHudPanel = document.getElementById('mapHudPanel');
  mapHudPanel.innerHTML = html;
  mapHudPanel.classList.remove('ranged-pick-target');
  mapHudPanel.classList.add('map-hud-ranged-phase');
  mapHudPanel.querySelectorAll('.ranged-wpick').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      selectWeapon(decodeURIComponent(btn.getAttribute('data-weapon')), ev);
    });
  });
  document.getElementById('rangedSkipBtn').addEventListener('click', ev => {
    ev.stopPropagation();
    skipRanged();
  });
  showMapHud();
  drawMap();

}

function selectWeapon(weapon, ev) {
  selectedWeapon = weapon;
  const unit = getActiveUnit();
  if (!canOperateWeapon(unit, weapon)) return;
  const any = units.some(e => e.team !== unit.team && e.status === 'alive' && rangedShotAt(unit, e, weapon));
  const hint = document.getElementById('rangedHudHint');
  if (!any) {
    rangedAwaitingTarget = false;
    if (hint) {
      hint.style.display = 'block';
      hint.textContent = 'この武器の射界・射程内に敵がいません。';
    }
    document.getElementById('mapHudPanel').classList.remove('ranged-pick-target');
  } else {
    rangedAwaitingTarget = true;
    if (hint) {
      hint.style.display = 'block';
      hint.textContent = '武器の射界・射程内の敵をクリックして射撃。';
    }
    document.getElementById('mapHudPanel').classList.add('ranged-pick-target');
  }

  document.querySelectorAll('#mapHudPanel .weapon-btn').forEach(b => b.classList.remove('selected'));
  const t = ev && ev.target;
  if (t) t.classList.add('selected');

  drawMap();

}

function roll2d6Detailed() {
  const d1 = roll1d6();
  const d2 = roll1d6();
  return { sum: d1 + d2, d1, d2 };
}

function combatSequenceWait(ms) {
  return new Promise(res => setTimeout(res, ms));
}

/**
 * 命中箇所表の読替：破壊済みの手足は飛ばす（足・手で同じ扱い）。
 * 右足／右手が破壊なら同名表出目→左足／左手。左足／左手も破壊なら→胴。
 */
function remapHitPartForLimbDestruction(target, tablePart) {
  const d = (target && target.destroyed) || {};
  let p = tablePart;
  if (p === '右足' && d['右足']) p = '左足';
  if (p === '左足' && d['左足']) p = '胴';
  if (p === '右手' && d['右手']) p = '左手';
  if (p === '左手' && d['左手']) p = '胴';
  if (p === '左手' && unitHasOperationalShield(target)) p = '盾';
  return p;
}

/** ポップアップ用：表の箇所と実効箇所が異なるときの注記HTML */
function appendHitPartLimbRemapHtml(hitPart, hitPartRaw) {
  if (!hitPartRaw || hitPartRaw === hitPart) return '';
  return ` <span style="color:#8ac;font-size:11px;">（表:${escapeHtml(hitPartRaw)}→${escapeHtml(hitPart)}）</span>`;
}

/** 射撃解決の出目を先にすべて決定（演出後に apply のみ） */
function rolledHitLocation(target, direction, roll) {
  const lookup = target.type === 'WC' && target.machine !== 'ビルバイン' ? 'ウイングキャリバー'
    : target.type === 'OB' ? 'オーラボム' : null;
  const locTable = lookup ? HIT_LOCATION_WC[lookup] : HIT_LOCATION_AB[direction];
  let rawLocPart = locTable[roll - 2];
  if ((target.machine === 'ガラバ' || target.machine === 'ブブリィ') && rawLocPart === '頭') rawLocPart = 'コクピット';
  if (target.machine === 'ブブリィ' && ['右手', '左手'].includes(rawLocPart)) rawLocPart = '胴';
  if (target.machine === 'ブブリィ' && rawLocPart === '翼') rawLocPart = 'ウイング';
  if (target.machine === 'ブブリィ' && roll === 12) rawLocPart = '武器';
  return rawLocPart;
}

function computeRangedResolution(unit, target) {
  const weaponLabel = selectedWeapon;
  const shot = getRangedHitPreviewVsEnemy(unit, target, weaponLabel);
  if (!shot) return { kind: 'outOfArc' };
  const { range, baseHit, mod, finalHit, basePower, weapon } = shot;
  const wKey = weapon.key;
  unit.ammo ??= {};
  unit.ammo[weaponLabel] = (unit.ammo[weaponLabel] ?? weapon.shots) - 1;
  const hr = roll2d6Detailed();
  const hit = hr.sum <= finalHit;
  if (!hit) {
    return {
      kind: 'miss',
      weaponLabel, wKey, range, baseHit, mod, finalHit,
      hitRoll: hr.sum, hitD1: hr.d1, hitD2: hr.d2,
    };
  }
  const direction = getAttackDirection(unit, target);
  const lr = roll2d6Detailed();
  const rawLocPart = rolledHitLocation(target, direction, lr.sum);
  const hitPart = remapHitPartForLimbDestruction(target, rawLocPart);
  const powerMod = unit.type === 'AB' ? POWER_DAMAGE_MOD[unit.effectivePower] || 0 : 0;
  const weaponPower = (basePower || 0) + powerMod;
  const armor = getArmor(target.machine, hitPart);
  const diff = weaponPower - armor;
  const dmgRoll = roll1d6();
  const dmgKey = getDamageKey(diff);
  const dmgResult = hitPart === 'コクピット' && target.canopyOpen ? 'e' : DAMAGE_TABLE[dmgKey][dmgRoll - 1];
  return {
    kind: 'hit',
    weaponLabel, wKey, range, baseHit, mod, finalHit,
    hitRoll: hr.sum, hitD1: hr.d1, hitD2: hr.d2,
    direction,
    locRoll: lr.sum, locD1: lr.d1, locD2: lr.d2, hitPart,
    hitPartRaw: rawLocPart !== hitPart ? rawLocPart : undefined,
    basePower, powerMod, weaponPower, armor, diff,
    dmgRoll, dmgKey, dmgResult,
  };
}

function formatRangedDmgHtml(dmgRoll, dmgResult) {
  const inner = dmgResult === 'n' ? '効果なし' : dmgResult === 'e' ? '<span class="popup-damage">命中部位を破壊</span>' : `<span class="popup-damage">${dmgResult}ダメージ</span>`;
  return `被害判定(1d6=${dmgRoll}): ${inner}`;
}

function meleeHitPart(unit, target, declaredPart) {
  if (declaredPart !== '手' && declaredPart !== '足') return declaredPart;
  const direction = getAttackDirection(unit, target);
  return (direction === '左側面' ? '左' : direction === '右側面' ? '右'
    : (selectedSwordSide === 'left' ? '左' : '右')) + declaredPart;
}

function formatMeleeDmgExplain(dmgResult) {
  if (dmgResult === 'n') return '<div class="popup-line">効果なし</div>';
  if (dmgResult === 'e') {
    return '<div class="popup-line"><span class="popup-damage">命中部位を破壊</span></div>' +
      '<div class="popup-line" style="color:#888;font-size:11px;line-height:1.45;"></div>';
  }
  return `<div class="popup-line"><span class="popup-damage">${dmgResult}ダメージ</span></div>`;
}

function computeMeleeHitMods(unit, target) {
  const pw = unit.effectivePower || 'g';
  const actionMod = TARGET_ACTION_MOD[target.selectedAction] || 0;
  const posMod = meleePositionMod(unit, target, selectedSwordSide) || 0;
  const aimMod = getMeleeLocationPowerMod(selectedMeleeMethod, selectedMeleeAttackPart);
  const evadeMod = TARGET_EVADE_MOD[target.effectivePower] || 0;
  return { pw, actionMod, posMod, aimMod, evadeMod, mod: actionMod + posMod + aimMod + evadeMod };
}

async function rollMeleeHit(unit, target) {
  const roll = roll2d6Detailed();
  const { pw, mod } = computeMeleeHitMods(unit, target);
  const need = (MELEE_HIT[selectedMeleeMethod]?.[pw] || 0) + mod;
  if (roll.sum <= need && meleeExchange?.mayParry && meleeExchange.target === target) {
    let parry = null;
    if (isPlayerUnit(target)) {
      parry = await showMutualMeleeSecondChoiceUI(unit, target, meleeExchange.initiative);
    } else if (Math.random() < 0.5) {
      const choices = ['left', 'right'].flatMap(side => {
        const hand = side === 'left' ? '左' : '右';
        const rows = ['手', '足'].filter(row => !target.destroyed[hand + row] && target.durability[hand + row] > 0);
        if (defenderCanWeaponParry(target)) rows.push('武器・盾');
        return rows.map(row => ({ side, row }));
      });
      parry = choices[Math.floor(Math.random() * choices.length)];
    }
    target.meleeParryStance = parry ? 'defense_only' : 'attacked';
    target.parrySide = parry?.side;
    target.parryRow = parry?.row;
  }
  return roll;
}

function computeMeleeResolutionVsAI(unit, target, hr = roll2d6Detailed()) {
  const method = selectedMeleeMethod;
  const atkTier = selectedMeleeTier;
  const atkPartDeclared = selectedMeleeAttackPart || '';
  const { pw, mod } = computeMeleeHitMods(unit, target);
  const baseHit = MELEE_HIT[method] ? MELEE_HIT[method][pw] : 0;
  const finalHit = baseHit + mod;
  const hit = hr.sum <= finalHit;
  const swExtra = selectedSwordSide ? (selectedSwordSide === 'left' ? '・左' : '・右') : '';
  if (!hit) {
    return {
      kind: 'miss', method, atkTier, atkPartDeclared, baseHit, mod, finalHit,
      hitRoll: hr.sum, hitD1: hr.d1, hitD2: hr.d2, swExtra,
    };
  }
  let dt = null, dp = null, rowKey = null;
  let defBaseRate = 0, defParryAdj = 0, defRate = 0;
  let dr = { sum: 0, d1: 0, d2: 0 };
  let defSuccess = false;
  if (meleeExchange?.mayParry && meleeExchange.target === target && target.meleeParryStance === 'defense_only') {
    rowKey = target.parryRow;
    const useWS = rowKey === '武器・盾';
    dt = useWS ? 'ws' : 'mid';
    dp = rowKey;
    defBaseRate = defenseRateForRow(unit, rowKey);
    defParryAdj = meleeParryStanceMod(target, unit);
    defRate = effectiveMeleeDefenseNeed(target, rowKey, unit);
    dr = roll2d6Detailed();
    defSuccess = dr.sum <= defRate;
    if (defSuccess) {
      const parryPart = useWS ? parryAbsorbingEquipmentPart(target) : (target.parrySide === 'left' ? '左' : '右') + rowKey;
      const parryStress = rollParryEquipmentStress(unit, target, method, parryPart);
      return {
        kind: 'defended',
        method, atkTier, atkPartDeclared, baseHit, mod, finalHit,
        hitRoll: hr.sum, hitD1: hr.d1, hitD2: hr.d2, swExtra,
        defenseTier: dt, defensePart: dp, rowKey, defRate, defBaseRate, defParryAdj,
        defRoll: dr.sum, defD1: dr.d1, defD2: dr.d2,
        weaponShieldParry: useWS,
        parryStress,
        attackerParryStress: parryStress?.part === '剣' && meleeUsesSwordArc(unit)
          ? rollParryEquipmentStress(unit, unit, method, '剣') : null,
      };
    }
  }
  const direction = getAttackDirection(unit, target);
  // 命中箇所: 1d6で1-4→狙い通り、5-6→命中箇所判定表で決定
  const locAimRoll = roll1d6();
  let rawLocPart;
  let lr = null;
  let ab2Roll = null;
  if (locAimRoll <= 4) {
    // 狙い通り
    rawLocPart = meleeHitPart(unit, target, atkPartDeclared || '胴');
  } else {
    // 命中箇所判定表で決定
    lr = roll2d6Detailed();
    rawLocPart = rolledHitLocation(target, direction, lr.sum);
  }
  if (rawLocPart === 'コクピット' && direction !== '正面' && target.type === 'AB') {
    ab2Roll = roll1d6();
    const ab2Key = direction === '後面' ? '後面' : '側面';
    rawLocPart = HIT_LOCATION_AB2[ab2Key][ab2Roll - 1];
  }
  const hitPart = remapHitPartForLimbDestruction(target, rawLocPart);
  const basePower = MELEE_POWER[method] ? MELEE_POWER[method][unit.effectivePower] : 0;
  const powerMod = 0;
  const locPowMod = 0;
  const totalPower = basePower;
  const armor = getArmor(target.machine, hitPart);
  const diff = totalPower - armor;
  const dmgR = roll1d6();
  const dmgKey = getDamageKey(diff);
  const dmgResult = hitPart === 'コクピット' && target.canopyOpen ? 'e' : DAMAGE_TABLE[dmgKey][dmgR - 1];
  return {
    kind: 'hit',
    method, atkTier, atkPartDeclared, baseHit, mod, finalHit,
    hitRoll: hr.sum, hitD1: hr.d1, hitD2: hr.d2, swExtra,
    defenseTier: dt, defensePart: dp, rowKey, defRate, defBaseRate, defParryAdj,
    defRoll: dr.sum, defD1: dr.d1, defD2: dr.d2,
    direction, locAimRoll, ab2Roll,
    locRoll: lr ? lr.sum : null, locD1: lr ? lr.d1 : null, locD2: lr ? lr.d2 : null, hitPart,
    hitPartRaw: rawLocPart !== hitPart ? rawLocPart : undefined,
    basePower, powerMod, locPowMod, totalPower, armor, diff,
    dmgRoll: dmgR, dmgResult,
  };
}

function applyMeleeResolutionData(unit, target, data) {
  if (!data || data.kind === 'miss') {
    if (data && data.method) {
      addLog(unit.team, `${unit.pilot}→${target.pilot}: ${data.method} 外れ`);
    }
    return;
  }
  if (data.kind === 'defended') {
    addLog('defend', `${target.pilot}: 受け成功${data.weaponShieldParry ? '（武器・盾）' : ''}`);
    if (data.parryStress) applyParryEquipmentStressAfterRoll(target, data.parryStress);
    if (data.attackerParryStress) applyParryEquipmentStressAfterRoll(unit, data.attackerParryStress);
    return;
  }
  applyAttackDamage('格闘', target, data.hitPart, data.dmgResult);
  if (typeof DunbainQL !== 'undefined') DunbainQL.registerCombatOutcome(unit, target, data.dmgResult);
  addLog('damage', `${unit.pilot}→${target.pilot}: ${data.method} ${data.hitPart}に${data.dmgResult === 'n' ? '効果なし' : data.dmgResult === 'e' ? '部位破壊' : data.dmgResult + 'ダメージ'}`);
}

function animateCombatDicePair(container, d1, d2, duration) {
  duration = duration == null ? 760 : duration;
  return new Promise(resolve => {
    if (!container) {
      resolve();
      return;
    }
    container.innerHTML = '<div class="combat-dice-pair"><span class="combat-die">1</span><span class="combat-dice-plus">+</span><span class="combat-die">1</span><span class="combat-dice-eq">=</span><span class="combat-dice-sum">?</span></div>';
    const dies = container.querySelectorAll('.combat-die');
    const sumEl = container.querySelector('.combat-dice-sum');
    const t0 = performance.now();
    function tick(now) {
      if (now - t0 < duration) {
        dies[0].textContent = String(Math.floor(Math.random() * 6) + 1);
        dies[1].textContent = String(Math.floor(Math.random() * 6) + 1);
        sumEl.textContent = '?';
        requestAnimationFrame(tick);
      } else {
        dies[0].textContent = String(d1);
        dies[1].textContent = String(d2);
        dies[0].classList.add('combat-die-settled');
        dies[1].classList.add('combat-die-settled');
        sumEl.textContent = String(d1 + d2);
        resolve();
      }
    }
    requestAnimationFrame(tick);
  });
}

function animateCombatDieSingle(container, d, duration) {
  duration = duration == null ? 680 : duration;
  return new Promise(resolve => {
    if (!container) {
      resolve();
      return;
    }
    container.innerHTML = '<div class="combat-dice-single"><span class="combat-die combat-die-lg">1</span></div>';
    const span = container.querySelector('.combat-die');
    const t0 = performance.now();
    function tick(now) {
      if (now - t0 < duration) {
        span.textContent = String(Math.floor(Math.random() * 6) + 1);
        requestAnimationFrame(tick);
      } else {
        span.textContent = String(d);
        span.classList.add('combat-die-settled');
        resolve();
      }
    }
    requestAnimationFrame(tick);
  });
}

function buildRangedSummaryHtml(data) {
  if (data.kind === 'outOfArc') {
    return '<div class="popup-line">射界・射程外、または射撃不可</div>';
  }
  if (data.kind === 'invalid') {
    return '<div class="popup-line">射撃を処理できません（射程・武器）</div>';
  }
  let h = `<div class="popup-line">武器: ${escapeHtml(data.weaponLabel)} 射程: ${data.range}</div>`;
  h += `<div class="popup-line">① 命中 2d6=${data.hitRoll}（${data.hitD1}+${data.hitD2}） 必要≤${data.finalHit} → ${data.kind === 'miss' ? '<span class="popup-miss">外れ</span>' : '<span class="popup-hit">命中</span>'}</div>`;
  if (data.kind === 'miss' || data.kind === 'invalid') return h;
  h += `<div class="popup-line">② 命中箇所 ${data.direction} 2d6=${data.locRoll}（${data.locD1}+${data.locD2}）→ <b>${data.hitPart}</b>${appendHitPartLimbRemapHtml(data.hitPart, data.hitPartRaw)}</div>`;
  h += `<div class="popup-line">威力: ${data.basePower}+${data.powerMod}=${data.weaponPower} 装甲: ${data.armor} 差: ${data.diff}</div>`;
  h += `<div class="popup-line">${formatRangedDmgHtml(data.dmgRoll, data.dmgResult)}</div>`;
  return h;
}

/** 観戦用：格闘の出目をテキスト一括（ダイスウィジェットは出さない） */
function buildMeleeSpectatorSummaryBody(data) {
  const modStr = `${data.mod >= 0 ? '+' : ''}${data.mod}`;
  let h =
    `<div class="popup-line">命中 2d6=<b>${data.hitRoll}</b>（${data.hitD1}+${data.hitD2}） 表${data.baseHit}${modStr} 必要≤<b>${data.finalHit}</b> → ${
      data.kind === 'miss' ? '<span class="popup-miss">外れ</span>' : '<span class="popup-hit">命中</span>'
    }</div>`;
  if (data.kind === 'miss') return h;
  const defPosLabel = data.defensePart;
  const adjNote = data.defParryAdj ? ` 態勢${data.defParryAdj > 0 ? '+' : ''}${data.defParryAdj}` : '';
  h += `<div class="popup-line">受け 2d6=<b>${data.defRoll}</b>（${data.defD1}+${data.defD2}） <b>${defPosLabel}</b>（${data.rowKey}）表<b>${data.defBaseRate}</b>${adjNote} 必要≤<b>${data.defRate}</b> → ${
    data.kind === 'defended' ? '<span class="popup-defend">成功</span>' : '失敗'
  }</div>`;
  if (data.kind === 'defended') {
    if (data.parryStress) h += formatParryEquipmentStressHtml(data.parryStress);

  }
  h += `<div class="popup-line">箇所 <b>${data.direction}</b> 2d6=<b>${data.locRoll}</b>（${data.locD1}+${data.locD2}）→ <b>${data.hitPart}</b>${appendHitPartLimbRemapHtml(data.hitPart, data.hitPartRaw)}</div>`;

  if (data.locPowMod) powLine += `${data.locPowMod > 0 ? '+' : ''}${data.locPowMod}(箇所)`;
  powLine += `=<b>${data.totalPower}</b> 装甲 ${data.armor} 差 ${data.diff}`;
  h += `<div class="popup-line">被害 1d6=<b>${data.dmgRoll}</b> ／ ${powLine}</div>`;

function playProjectileShotAnimation(shooter, target, onDone) {
  const fx = document.getElementById('fxSvg');
  const mapSvg = document.getElementById('mapSvg');
  if (!fx || !mapSvg || typeof onDone !== 'function') {
    if (typeof onDone === 'function') onDone();
    return;
  }
  const vb = mapSvg.getAttribute('viewBox');
  if (vb) fx.setAttribute('viewBox', vb);

  const c0 = hexCenter(shooter.x, shooter.y);
  const c1 = hexCenter(target.x, target.y);
  let dx = c1.x - c0.x;
  let dy = c1.y - c0.y;
  let len = Math.hypot(dx, dy);
  if (len < 0.5) len = 0.5;
  dx /= len;
  dy /= len;
  const pad0 = hexSize * 0.42;
  const pad1 = hexSize * 0.38;
  const x0 = c0.x + dx * pad0;
  const y0 = c0.y + dy * pad0;
  const x1 = c1.x - dx * pad1;
  const y1 = c1.y - dy * pad1;

  const NS = 'http://www.w3.org/2000/svg';
  fx.innerHTML = '';
  const defs = document.createElementNS(NS, 'defs');
  const fil = document.createElementNS(NS, 'filter');
  fil.setAttribute('id', 'projShotGlow');
  fil.setAttribute('x', '-80%');
  fil.setAttribute('y', '-80%');
  fil.setAttribute('width', '260%');
  fil.setAttribute('height', '260%');
  const blur = document.createElementNS(NS, 'feGaussianBlur');
  blur.setAttribute('stdDeviation', '2.2');
  blur.setAttribute('result', 'blur');
  const merge = document.createElementNS(NS, 'feMerge');
  const mn1 = document.createElementNS(NS, 'feMergeNode');
  mn1.setAttribute('in', 'blur');
  const mn2 = document.createElementNS(NS, 'feMergeNode');
  mn2.setAttribute('in', 'SourceGraphic');
  merge.appendChild(mn1);
  merge.appendChild(mn2);
  fil.appendChild(blur);
  fil.appendChild(merge);
  defs.appendChild(fil);
  fx.appendChild(defs);

  const trail = document.createElementNS(NS, 'line');
  trail.setAttribute('stroke', 'rgba(255, 210, 100, 0.55)');
  trail.setAttribute('stroke-width', '5');
  trail.setAttribute('stroke-linecap', 'round');
  const bullet = document.createElementNS(NS, 'circle');
  bullet.setAttribute('r', '7');
  bullet.setAttribute('fill', '#ffe566');
  bullet.setAttribute('stroke', '#cc5500');
  bullet.setAttribute('stroke-width', '1.5');
  bullet.setAttribute('filter', 'url(#projShotGlow)');
  fx.appendChild(trail);
  fx.appendChild(bullet);

  const dur = 520;
  const t0 = performance.now();
  function easeOutQuad(t) {
    return 1 - (1 - t) * (1 - t);
  }
  function tick(now) {
    const vbNow = mapSvg.getAttribute('viewBox');
    if (vbNow) fx.setAttribute('viewBox', vbNow);
    const t = Math.min(1, (now - t0) / dur);
    const u = easeOutQuad(t);
    const x = x0 + (x1 - x0) * u;
    const y = y0 + (y1 - y0) * u;
    bullet.setAttribute('cx', x);
    bullet.setAttribute('cy', y);
    trail.setAttribute('x1', x0);
    trail.setAttribute('y1', y0);
    trail.setAttribute('x2', x);
    trail.setAttribute('y2', y);
    if (t < 1) requestAnimationFrame(tick);
    else {
      fx.innerHTML = '';
      onDone();
    }
  }
  requestAnimationFrame(tick);
}

    return;
  }
  const vb = mapSvg.getAttribute('viewBox');
  if (vb) fx.setAttribute('viewBox', vb);

  const cA = hexCenter(attacker.x, attacker.y);
  const cT = hexCenter(target.x, target.y);
  const NS = 'http://www.w3.org/2000/svg';
  fx.innerHTML = '';

  const link = document.createElementNS(NS, 'line');
  link.setAttribute('x1', String(cA.x));
  link.setAttribute('y1', String(cA.y));
  link.setAttribute('x2', String(cT.x));
  link.setAttribute('y2', String(cT.y));
  link.setAttribute('stroke', 'rgba(255, 200, 120, 0.9)');
  link.setAttribute('stroke-width', '5');
  link.setAttribute('stroke-linecap', 'round');
  fx.appendChild(link);

  const sz = hexSize * 0.52;
  const xSlash1 = document.createElementNS(NS, 'line');
  xSlash1.setAttribute('x1', String(cT.x - sz));
  xSlash1.setAttribute('y1', String(cT.y - sz * 0.85));
  xSlash1.setAttribute('x2', String(cT.x + sz));
  xSlash1.setAttribute('y2', String(cT.y + sz * 0.85));
  xSlash1.setAttribute('stroke', '#fff8e6');
  xSlash1.setAttribute('stroke-width', '3.2');
  xSlash1.setAttribute('stroke-linecap', 'round');
  const xSlash2 = document.createElementNS(NS, 'line');
  xSlash2.setAttribute('x1', String(cT.x - sz));
  xSlash2.setAttribute('y1', String(cT.y + sz * 0.85));
  xSlash2.setAttribute('x2', String(cT.x + sz));
  xSlash2.setAttribute('y2', String(cT.y - sz * 0.85));
  xSlash2.setAttribute('stroke', 'rgba(255, 140, 50, 0.95)');
  xSlash2.setAttribute('stroke-width', '3.2');
  xSlash2.setAttribute('stroke-linecap', 'round');
  fx.appendChild(xSlash1);
  fx.appendChild(xSlash2);

  const dur = 400;
  const t0 = performance.now();
  function tick(now) {
    const vbNow = mapSvg.getAttribute('viewBox');
    if (vbNow) fx.setAttribute('viewBox', vbNow);
    const t = Math.min(1, (now - t0) / dur);
    const op = 1 - t;
    link.setAttribute('opacity', String(op));
    link.setAttribute('stroke-width', String(5 * (1 - t * 0.55)));
    xSlash1.setAttribute('opacity', String(op));
    xSlash2.setAttribute('opacity', String(op));
    if (t < 1) requestAnimationFrame(tick);
    else {
      fx.innerHTML = '';
      onDone();
    }
  }
  requestAnimationFrame(tick);
}

function fireAt(targetId) {
  const unit = getActiveUnit();
  const target = units.find(u => u.id === targetId);
  if (!unit || !target) return;

// ===== 格闘: 段→攻撃方法→目標（受けは DEFENSE_TABLE）=====
const MELEE_TIER_LABELS = { high: '上段', mid: '中段', low: '下段' };
const MELEE_TIER_PARTS = {
  high: ['頭', '手', '胴'],
  mid: ['胴', 'コクピット', '手'],
  low: ['胴', '手', '足'],
};

function getDefenseTableRowKey(attackTier, attackPart, defenseTier, defensePart) {
  const sameTier = attackTier === defenseTier;
  const noAtkPart = attackPart == null || attackPart === '';
  if (noAtkPart) {
    return sameTier ? '同位置異箇所' : '異位置異箇所';
  }
  const samePart = attackPart === defensePart;
  if (sameTier && samePart) return '同位置同箇所';
  if (sameTier && !samePart) return '同位置異箇所';
  if (!sameTier && samePart) return '異位置同箇所';
  return '異位置異箇所';
}

const PARRY_LEFT_HEX_MOD = {
  '-2,-2': 0, '-2,0': 0, '-2,2': -1, '-1,-3': 0, '-1,-1': 0, '-1,1': -1, '-1,3': -2,
  '0,-4': 0, '0,-2': 0, '0,2': -2, '0,4': -2, '1,-3': -1, '1,-1': -1, '1,1': -2, '1,3': -2,
  '2,-2': -1, '2,0': -2, '2,2': -2,
};

function meleeParryStanceMod(defender, attacker) {
  const stance = defender.meleeParryStance === 'defense_only' ? 3 : 0;
  if (!attacker) return stance;
  const side = defender.parrySide || 'right';
  const position = getCombatPositionMod(defender, attacker, side, PARRY_LEFT_HEX_MOD) || 0;
  return stance + position + (canSeeTarget(defender, attacker) ? 0 : -2);
}

function defenseRateForRow(defender, rowKey) {
  const row = DEFENSE_TABLE[rowKey];
  if (!row) return 6;
  const k = String(defender.effectivePower || 'g').toLowerCase();
  return row[k] != null ? row[k] : 6;
}

/** 受け率表に、姿勢・相手の位置・視界の修正を加える。 */
function effectiveMeleeDefenseNeed(defender, rowKey, attacker) {
  const base = defenseRateForRow(attacker || defender, rowKey);
  return base + meleeParryStanceMod(defender, attacker);
}

// 受けに成功したときは、受けに使った部位の装甲で被害を判定する。
function parryAbsorbingEquipmentPart(defender) {
  if (!defender) return null;
  if (unitHasMeleeSwordWeapon(defender)) return '剣';
  if (unitHasOperationalShield(defender)) return '盾';
  return null;
}

function rollParryEquipmentStress(attacker, defender, method, part = parryAbsorbingEquipmentPart(defender)) {
  if (!part || !defender.durability || defender.durability[part] === undefined) return null;
  const basePower = MELEE_POWER[method] ? MELEE_POWER[method][attacker.effectivePower] : 0;
  const powerMod = 0;
  const locPowMod = 0;
  const totalPower = basePower;
  const armor = getArmor(defender.machine, part);
  const rawDiff = totalPower - armor;
  const diff = rawDiff;
  const dmgRoll = roll1d6();
  const dmgKey = getDamageKey(diff);
  const dmgResult = DAMAGE_TABLE[dmgKey] ? DAMAGE_TABLE[dmgKey][dmgRoll - 1] : 'n';
  let dropRoll = null;
  if (part === '剣' && dmgResult !== 'n' && dmgResult !== 'e') {
    const nd = parseInt(dmgResult, 10);
    if (!isNaN(nd) && nd > 0) dropRoll = roll1d6();
  }
  const dropped = part === '剣' && dropRoll === 1;
  return {
    part, basePower, powerMod, locPowMod, totalPower, armor, diff, rawDiff,
    dmgRoll, dmgResult, dropRoll, dropped, pilot: defender.pilot,
  };
}

function applyParryEquipmentDamageResult(target, part, result) {
  if (!target || !part || result === 'n') return;
  if (target.durability[part] === undefined) return;
  if (result === 'e') {
    target.durability[part] = 0;
    target.destroyed[part] = true;
    addLog('damage', `${target.pilot}: ${part}が受けで大損（使用不能）`);
    syncRightPanelUnitStats();
    return;
  }
  const dmg = parseInt(result, 10) || 0;
  if (dmg <= 0) return;
  target.pilotCumulativeDamage = (target.pilotCumulativeDamage || 0) + dmg;
  target.durability[part] = Math.max(0, target.durability[part] - dmg);
  if (target.durability[part] <= 0) {
    target.destroyed[part] = true;
    addLog('damage', `${target.pilot}: ${part}破壊（受け）!`);
  }
  syncRightPanelUnitStats();
}

function applyParryEquipmentStressAfterRoll(defender, stress) {
  if (!stress || !defender) return;
  applyParryEquipmentDamageResult(defender, stress.part, stress.dmgResult);
  if (stress.dropped) {
    if (!defender.swordDisarmed) defender.droppedWeaponCount++;
    defender.swordDisarmed = true;
    addLog('system', `${defender.pilot}: 剣を落とした（落下判定1d6=${stress.dropRoll}）`);
  }
}

function formatParryEquipmentStressHtml(stress) {
  if (!stress) return '';
  let h = `<div class="popup-line">受け装備（<b>${stress.part}</b>）負担: 威力 ${stress.basePower}+${stress.powerMod}`;
  if (stress.locPowMod) h += `${stress.locPowMod > 0 ? '+' : ''}${stress.locPowMod}(箇所)`;
  h += `=<b>${stress.totalPower}</b> 装甲<b>${stress.armor}</b>（実差${stress.rawDiff}） 被害表の差<b>${stress.diff}</b> ／ 被害1d6=<b>${stress.dmgRoll}</b>→<b>${stress.dmgResult}</b></div>`;
  if (stress.part === '剣' && stress.dropRoll != null) {
    const result = stress.dropped
      ? ` → <span class="popup-damage">${escapeHtml(stress.pilot)}が剣を落とした</span>`
      : '（保持）';
    h += `<div class="popup-line">剣落下追加1d6=<b>${stress.dropRoll}</b>${result}</div>`;
  }
  return h;
}

function meleeAttack(targetId) {
  const unit = getActiveUnit();
  const target = units.find(u => u.id === targetId);
  if (!unit || !target || !selectedMeleeMethod || !selectedMeleeTier || !selectedMeleeAttackPart) return;
  if (target.status !== 'alive' || target.team === unit.team ||
      (meleeExchange && target !== meleeExchange.target) ||
      !canMeleeTarget(unit, target, selectedSwordSide, selectedMeleeMethod)) return;
  if (meleeUsesSwordArc(unit)) unit.swordTier = selectedMeleeTier;
  unit.meleeParryStance = 'attacked';
  hideMapHud();
  void (async () => {
    if (!spectatorMode) await new Promise(resolve => playMeleeClashAnimation(unit, target, resolve));
    await runMeleeCombatDiceSequence(unit, target, { autoCloseMs: 0 });
  })();
}

function defenderCanWeaponParry(u) {
  if (!u) return false;
  if (unitHasMeleeSwordWeapon(u)) return true;
  return unitHasOperationalShield(u);
}

function unitHasOperationalShield(u) {
  if (!u || !u.maxDurability || u.maxDurability['盾'] == null) return false;
  if (u.destroyed && u.destroyed['盾']) return false;
  return (u.durability && u.durability['盾'] || 0) > 0;
}

function skipMelee() {
  hideMapHud();
  const u = getActiveUnit();
  if (u) u.meleeParryStance = null;
  const lab = '格闘なし';
  addLog('system', `${u.pilot}: ${lab}`);
  finishUnitTurn();
}

// ===== ダメージ処理 =====
function applyAttackDamage(action, target, part, result) {
  if (result === 'n') return;
  if (turnSubPhase === 'resolving' && (action === '射撃' || target.selectedAction === '射撃')) {
    simultaneousDamage.push({ target, part, result });
  } else {
    applyDamage(target, part, result);
  }
}

function applyDamage(target, part, result) {
  if (target.status !== 'alive') return;
  if (result === 'n') return;
  if (target.durability[part] === undefined) return;
  const dmg = result === 'e' ? target.durability[part] : parseInt(result, 10) || 0;
  if (dmg <= 0) return;
  target.pilotCumulativeDamage = (target.pilotCumulativeDamage || 0) + dmg;

  const key = part;
  target.durability[key] = Math.max(0, target.durability[key] - dmg);
  if (key === 'コクピット' && target.type === 'AB' && target.durability[key] === 1) {
    target.canopyCracked = true;
    addLog('damage', `${target.pilot}: キャノピーひび割れ`);
  }
  if (target.durability[key] <= 0) {
    target.destroyed[key] = true;
    addLog('damage', `${target.pilot}: ${key}破壊!`);
      if (key === '胴' || key === 'コクピット' || key === 'オーラコンバーター' || key === 'ウイング') {
      target.status = 'destroyed';
      addLog('damage', `${target.pilot}(${target.machine}): 壊滅!`);
    }
  }
  syncRightPanelUnitStats();
}

// ===== ユニットターン終了 =====
function finishUnitTurn() {
  if (turnSubPhase === 'review') return;
  hideMapHud();
  rangedShotInProgress = false;
  const unit = getActiveUnit();
  if (unit) {
    unit.hasActed = true;
  }

  if (checkVictory()) {
    // 相互格闘中のPromiseも解決しておく
    if (pendingMutualMeleeResolve) {
      const r = pendingMutualMeleeResolve;
      pendingMutualMeleeResolve = null;
      r();
    }
    return;
  }

  // 相互格闘中はPromiseを解決して戻る（runNextResolutionはresolveMutualMeleeが管理）
  if (pendingMutualMeleeResolve) {
    const r = pendingMutualMeleeResolve;
    pendingMutualMeleeResolve = null;
    r();
    return;
  }

  // planning 中は移動・行動入力の誤進行を防ぐ。射撃/格闘UI中は turnSubPhase が不整合でも進める。
  if (turnSubPhase === 'planning' && currentPhase !== 'RANGED' && currentPhase !== 'MELEE') return;

  resolutionIndex++;
  runNextResolution();
}

function checkVictory() {
  const givenAlive = units.filter(u => u.team === 'given' && u.status === 'alive').length;
  const drakeAlive = units.filter(u => u.team === 'drake' && u.status === 'alive').length;
  if (givenAlive === 0 && drakeAlive === 0) {
    if (typeof DunbainQL !== 'undefined') DunbainQL.terminalUpdates(null);
    showVictory('引き分け', '両軍が同じイニングに全滅');
    return true;
  }
  if (givenAlive === 0) {
    if (typeof DunbainQL !== 'undefined') DunbainQL.terminalUpdates('drake');
    showVictory('ドレイク軍の勝利', 'ギブン軍全滅');
    return true;
  }
  if (drakeAlive === 0) {
    if (typeof DunbainQL !== 'undefined') DunbainQL.terminalUpdates('given');
    showVictory('ギブン軍の勝利', 'ドレイク軍全滅');
    return true;
  }
  return false;
}

function isCampaignScenario() {
  return !!(scenario && scenario.id && String(scenario.id).startsWith('campaign'));
}

function gauntletPlayerWonVictory(result) {
  if (!result || result.includes('引き分け')) return false;
  if (playerSide === 'given') return result.includes('ギブン軍の勝利');
  return result.includes('ドレイク軍の勝利');
}

function clearGauntletSession() {
  sessionStorage.removeItem('campaignGauntletActive');
  sessionStorage.removeItem('campaignGauntletRound');
}

const MUSOU_BEST_STREAK_KEY = 'dunbain_musou_best_streak';

function getMusouBestStreak() {
  const v = parseInt(localStorage.getItem(MUSOU_BEST_STREAK_KEY) || '0', 10);
  return Number.isFinite(v) && v >= 0 ? v : 0;
}

function updateMusouBestStreak(clearedWaves) {
  if (!Number.isFinite(clearedWaves) || clearedWaves < 1) return;
  const cur = getMusouBestStreak();
  if (clearedWaves > cur) localStorage.setItem(MUSOU_BEST_STREAK_KEY, String(clearedWaves));
}

function musouGivenVictory(result) {
  return !!(result && result.includes('ギブン軍の勝利'));
}

function resetMusouRunSession() {
  sessionStorage.setItem('musouRunWins', '0');
}

function finalizeMusouRunOnFailure() {
  const w = parseInt(sessionStorage.getItem('musouRunWins') || '0', 10) || 0;
  updateMusouBestStreak(w);
  resetMusouRunSession();
}

function applyMusouWaveWin() {
  const w = parseInt(sessionStorage.getItem('musouRunWins') || '0', 10) || 0;
  const next = w + 1;
  sessionStorage.setItem('musouRunWins', String(next));
  updateMusouBestStreak(next);
  return next;
}

function scheduleVictoryReturnToCampaign() {
  if (!isCampaignScenario()) return;
  if (scenario && scenario.id === 'campaign_musou' && !spectatorMode) return;
  if (victoryRedirectTimer) {
    clearTimeout(victoryRedirectTimer);
    victoryRedirectTimer = null;
  }
  victoryRedirectTimer = setTimeout(() => {
    victoryRedirectTimer = null;
    window.location.href = 'scenario.html?mode=campaign';
  }, 3200);
}

function dismissBlockingOverlaysForVictory() {
  if (popupAutoCloseTimer) {
    clearTimeout(popupAutoCloseTimer);
    popupAutoCloseTimer = null;
  }
  const combatPop = document.getElementById('combatPopup');
  const popOv = document.getElementById('popupOverlay');
  if (combatPop) combatPop.style.display = 'none';
  if (popOv) popOv.style.display = 'none';

  if (auraP) auraP.style.display = 'none';

// ===== ヘックスユーティリティ =====
function hexDistance(x1, y1, x2, y2) {
  // offset座標→cube座標に変換して距離計算
  const c1 = offsetToCube(x1, y1);
  const c2 = offsetToCube(x2, y2);
  return Math.max(Math.abs(c1.q - c2.q), Math.abs(c1.r - c2.r), Math.abs(c1.s - c2.s));
}

function offsetToCube(col, row) {
  const q = col;
  const r = row - Math.floor(col / 2);
  const s = -q - r;
  return { q, r, s };
}

function hexCenter(col, row) {
  // F16と同じ: pointy-top hex
  const x = col * hStep;
  const y = row * vStep + (col % 2) * (vStep / 2);
  return { x, y };
}

function hexPoints(cx, cy) {
  // F16と同じ: 角度0度スタート（pointy-top）
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 180 * (60 * i);
    pts.push(`${cx + hexSize * Math.cos(angle)},${cy + hexSize * Math.sin(angle)}`);
  }
  return pts.join(' ');
}

// マップ上の機体向きと同じ（drawMap の dirAngles と一致）
const HEX_VIEW_DIR_DEG = { 0: -90, 1: -30, 2: 30, 3: 90, 4: 150, 5: -150 };

function drawMovePreviewSegmentArrow(svg, x0, y0, x1, y1, color) {
  const NS = 'http://www.w3.org/2000/svg';
  const dx = x1 - x0, dy = y1 - y0;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  const pad0 = hexSize * 0.38, pad1 = hexSize * 0.34;
  const sx = x0 + ux * pad0, sy = y0 + uy * pad0;
  const ex = x1 - ux * pad1, ey = y1 - uy * pad1;
  const line = document.createElementNS(NS, 'line');
  line.setAttribute('x1', sx);
  line.setAttribute('y1', sy);
  line.setAttribute('x2', ex);
  line.setAttribute('y2', ey);
  line.setAttribute('stroke', color);
  line.setAttribute('stroke-width', '3.2');
  line.setAttribute('stroke-linecap', 'round');
  line.setAttribute('pointer-events', 'none');
  svg.appendChild(line);
  const ah = hexSize * 0.26;
  const bx = ex - ux * ah, by = ey - uy * ah;
  const px = -uy, py = ux;
  const tri = document.createElementNS(NS, 'polygon');
  tri.setAttribute('points', `${ex},${ey} ${bx + px * (ah * 0.5)},${by + py * (ah * 0.5)} ${bx - px * (ah * 0.5)},${by - py * (ah * 0.5)}`);
  tri.setAttribute('fill', color);
  tri.setAttribute('stroke', color);
  tri.setAttribute('pointer-events', 'none');
  svg.appendChild(tri);
}

function appendPreviewFacingArrow(svg, cx, cy, dir, color, scale) {
  const NS = 'http://www.w3.org/2000/svg';
  scale = scale == null ? 1 : scale;
  const rot = (HEX_VIEW_DIR_DEG[dir] || 0) + 90;
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('transform', `translate(${cx},${cy}) rotate(${rot}) scale(${scale})`);
  g.setAttribute('pointer-events', 'none');
  const line = document.createElementNS(NS, 'line');
  line.setAttribute('x1', '0');
  line.setAttribute('y1', '6');
  line.setAttribute('x2', '0');
  line.setAttribute('y2', '-13');
  line.setAttribute('stroke', color);
  line.setAttribute('stroke-width', '2.8');
  line.setAttribute('stroke-linecap', 'round');
  g.appendChild(line);
  const tri = document.createElementNS(NS, 'polygon');
  tri.setAttribute('points', '0,-15 -4.5,-9 4.5,-9');
  tri.setAttribute('fill', color);
  g.appendChild(tri);
  svg.appendChild(g);
}

function drawPreviewMoveTrajectory(svg, stepStates, viewX, viewY, viewW, viewH) {
  if (!stepStates || stepStates.length < 2) return;
  const margin = hexSize * 2.5;
  function inView(x, y) {
    return x >= viewX - margin && x <= viewX + viewW + margin && y >= viewY - margin && y <= viewY + viewH + margin;
  }
  const colMain = '#5ee9d4';
  const colEnd = '#c6fff5';
  for (let i = 0; i < stepStates.length - 1; i++) {
    const s0 = stepStates[i], s1 = stepStates[i + 1];
    const c0 = hexCenter(s0.x, s0.y);
    const c1 = hexCenter(s1.x, s1.y);
    if (!inView(c0.x, c0.y) && !inView(c1.x, c1.y)) continue;
    const moved = s0.x !== s1.x || s0.y !== s1.y;
    if (moved) {
      drawMovePreviewSegmentArrow(svg, c0.x, c0.y, c1.x, c1.y, colMain);
    } else {
      appendPreviewFacingArrow(svg, c1.x, c1.y, s1.dir, colMain, 0.9);
    }
  }
  const last = stepStates[stepStates.length - 1];
  const prev = stepStates[stepStates.length - 2];
  if (prev.x !== last.x || prev.y !== last.y) {
    const lc = hexCenter(last.x, last.y);
    if (inView(lc.x, lc.y)) appendPreviewFacingArrow(svg, lc.x, lc.y, last.dir, colEnd, 1.05);
  }
}
