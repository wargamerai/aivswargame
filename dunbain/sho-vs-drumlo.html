<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ショウのダンバイン 一騎打ち</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, "Hiragino Sans", "Meiryo", sans-serif; background: #171827; color: #f1f2f7; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: clamp(16px, 6vw, 56px) 16px; }
  main { max-width: 570px; margin: auto; padding: clamp(16px, 5vw, 28px); background: #202536; border: 1px solid #48546d; border-radius: 8px; }
  .banner { display: block; width: min(100%, 324px); margin: 0 auto 24px; }
  .banner img { display: block; width: 100%; height: auto; }
  h1 { margin: 0 0 10px; color: #efc980; font-size: clamp(22px, 5vw, 31px); }
  p { margin: 0 0 16px; line-height: 1.55; color: #ccd3e3; }
  button { padding: 9px 18px; border: 0; border-radius: 5px; background: #efc980; color: #211a0e; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  :focus-visible { outline: 2px solid #efc980; outline-offset: 3px; }
  #selectionStatus { display: block; min-height: 1.5em; margin-top: 8px; color: #efc980; }
</style>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="9941d848-0f49-4aac-a8b1-adaa766abfcd"></script>
</head>
<body>
<main>
  <a class="banner" href="https://peasant-homepage.savorymedal9.chatgpt.site/?lang=ja" target="_blank" rel="noopener"><img src="../peasant/banner-ja-compact.webp" width="648" height="216" alt="Pe@sant — ブラウザで楽しむクラシック・ボードウォーゲーム"></a>
  <h1>ショウのダンバイン 一騎打ち</h1>
  <p>相手はバーン（ドラムロ、まれにズワース）、トッド（ビアレス、まれにダンバイン）、ガラリア（バストール、まれにドロ）のいずれか。6ヘクス離れて始まり、10ターンで決着がつかなければ引き分けです。</p>
  <p><small>きゃめる様の作の画像を使用しております。</small></p>
  <button type="button" id="selectEnemy">敵を選択して開始</button>
  <span id="selectionStatus" role="status"></span>
</main>
<script>
  const selectEnemy = document.getElementById('selectEnemy');
  const selectionStatus = document.getElementById('selectionStatus');
  let selectionTimer;

  selectEnemy.addEventListener('click', () => {
    selectEnemy.disabled = true;
    selectionStatus.textContent = '選択中…';
    selectionTimer = setTimeout(() => {
      location.href = 'index.html?scenarioId=duel_sho_drumlo';
    }, 5000);
  });

  window.addEventListener('pageshow', () => {
    clearTimeout(selectionTimer);
    selectEnemy.disabled = false;
    selectionStatus.textContent = '';
  });
</script>
</body>
</html>
