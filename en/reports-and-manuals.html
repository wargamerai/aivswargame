* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 1rem;
    color: #252d1e;
    background: #788161;
    font: 1rem/1.5 'Helvetica Neue', Arial, sans-serif;
}
main {
    max-width: 56rem;
    margin: 1rem auto;
    padding: clamp(1rem, 4vw, 2rem);
    background: #efefdf;
    border: 1px solid #606c4d;
    border-radius: 4px;
}
h1 { margin: 0 0 1.2rem; font-size: clamp(1.6rem, 4vw, 2.2rem); }
section {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: .55rem 1rem;
    padding: .85rem 0;
    border-top: 1px solid #879173;
}
h2 { margin: 0; font-size: 1.05rem; }
.game-links { display: flex; flex-wrap: wrap; gap: .5rem; }
.game-links a {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .35rem;
    border-radius: 3px;
    padding: .35rem .75rem;
    background: #4e5a3a;
    color: #fffdf0;
    font-weight: bold;
    text-decoration: none;
}
.flags { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.flags svg { width: 16px; height: 11px; }
.game-links a:hover { background: #3f4c30; text-decoration: underline; }
a:focus-visible { outline: 2px solid #252d1e; outline-offset: 3px; }
footer { margin-top: .65rem; padding-top: .85rem; border-top: 1px solid #879173; }
footer a { color: #334028; }
