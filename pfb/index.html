const ROSTER_FIELD_GROUPS = [['C',FNAME.C],['1B',FNAME['1B']],['2B',FNAME['2B']],['3B',FNAME['3B']],
    ['SS',FNAME.SS],['OF','外野手'],['other','その他']];
const ROSTER_PITCH_GROUPS = [['starter','先発'],['reliever','中継ぎ'],['closer','抑え']];

function rosterDefense(row) {
    const ratings=FIELD_POSITIONS.map(pos=>({pos,...fieldCard(row,pos)})).filter(card=>card.rating>0);
    const best=[...ratings].sort((a,b)=>b.rating-a.rating || b.preference-a.preference)[0];
    const infield=ratings.filter(card=>!OUTFIELD.includes(card.pos));
    const outfield=ratings.filter(card=>OUTFIELD.includes(card.pos));
    const defense=infield.map(card=>FNAME[card.pos].slice(0,-1)+card.rating);
    if (outfield.length===3 && outfield.every(card=>card.rating===outfield[0].rating)) {
        const preferred=outfield.filter(card=>card.preference===3);
        const position=preferred.length===1 ? `（${FNAME[preferred[0].pos][0]}）` : '';
        defense.push(`外野${outfield[0].rating}${position}`);
    } else {
        defense.push(...outfield.map(card=>FNAME[card.pos].slice(0,-1)+card.rating));
    }
    const group=OUTFIELD.includes(best?.pos) ? 'OF' : best?.pos || 'other';
    return {group,details:defense.join('・') || '—'};
}

function rosterStatText(row,pitcher,records) {
    if (records) {
        const line=records[rowId(row)];
        if (pitcher) return line?.PG ? `${line.W}勝${line.L}敗 ${line.SV}S` : '—';
        return line?.PA ? `${line.AB ? PFBSeason.rateText(line.H/line.AB) : '—'}　${line.HR}本` : '—';
    }
    if (pitcher) {
        const {wins,losses,saves}=cardPitchingRecord(row);
        return wins==='—' ? '—' : `${wins}勝${losses}敗 ${saves}S`;
    }
    const {average,homers}=cardBattingRecord(row);
    return homers==='—' ? average : `${average}　${homers}本`;
}

function openRosterSetup(side=setup.humanSide,seasonRoster=null,onConfirm=null,onCancel=null) {
    const dialog = document.getElementById('roster-dialog');
    const team = side === 0 ? setup.away : setup.home;
    const rows=seasonRoster?.pool||players.filter(p=>p['チーム']===team);
    const preset=seasonRoster||defaultRoster(rows,team);
    const form = dialog.querySelector('form');
    dialog.querySelector('h2').textContent = `${side === 0 ? '先攻' : '後攻'}　${team}`;
    const list = dialog.querySelector('.roster-list');
    const search=dialog.querySelector('.roster-search');
    const filter=dialog.querySelector('.roster-filter');
    search.value='';
    filter.value='all';
    const fixedStarter=Boolean(seasonRoster?.fixedStarter);
    filter.querySelector('option[value="starter"]').hidden=fixedStarter;
    search.onkeydown=event=>{if (event.key==='Enter') event.preventDefault();};
    const starterCandidates=new Set(seasonRoster?.starterCandidates || rows.filter(row=>isPitcher(row) && PFBSeason.starterStamina(row)));
    const statsOption=dialog.querySelector('.roster-stat-source');
    const gameStatsOption=statsOption.querySelector('input[value="game"]');
    const message = dialog.querySelector('.roster-message');
    list.replaceChildren();
    message.textContent = '';
    const groups=new Map([...ROSTER_FIELD_GROUPS,...ROSTER_PITCH_GROUPS].map(([key])=>[key,[]]));
    const entries=rows.map(row=>{
        const pitcher=isPitcher(row);
        const stats=pitcher ? extractPitcherStats(row) : null;
        const defense=pitcher ? null : rosterDefense(row);
        const saves=pitcher ? Number(cardPitchingRecord(row).saves) : 0;
        const role=Number(stats?.S)>=4 ? 'starter' : saves>=5 ? 'closer' : 'reliever';
        const group=pitcher ? role : defense.group;
        const label = document.createElement('div');
        const check = document.createElement('input');
        const name=document.createElement('b');
        const card=document.createElement('span');
        const record=document.createElement('span');
        label.className='roster-candidate';
        record.className='roster-record';
        check.type = 'checkbox';
        check.checked = preset.selected.includes(row);
        check.disabled = fixedStarter && row===preset.starter;
        name.textContent=displayName(row);
        check.setAttribute('aria-label',name.textContent+'をベンチ入り');
        card.textContent=pitcher ? `${handedness(row,false) || '—'}　G${stats.G ?? '—'}　S${stats.S ?? '—'}` :
            [battingHand(row),defense.details].filter(Boolean).join('　');
        card.title=pitcher ? '利き腕・グレード・スタミナ' : '打ち方・守備力';
        record.title=pitcher ? '勝・敗・セーブ' : '打率・本塁打';
        label.append(check,name,card,record);
        groups.get(group).push(label);
        return {row,check,pitcher,record,element:label};
    });
    for (const [title,sections] of [['野手',ROSTER_FIELD_GROUPS],['投手',ROSTER_PITCH_GROUPS]]) {
        const column=document.createElement('section');
        const heading=document.createElement('h3');
        heading.textContent=title;
        column.append(heading);
        for (const [key,groupName] of sections) {
            const members=groups.get(key);
            if (!members.length) continue;
            const group=document.createElement('section');
            const groupHeading=document.createElement('h4');
            groupHeading.textContent=groupName;
            group.append(groupHeading,...members);
            column.append(group);
        }
        list.append(column);
    }
    function filterRows() {
        const normalize=name=>name.normalize('NFKC').replace(/\s/g,'').toLowerCase();
        const query=normalize(search.value);
        for (const {row,check,element} of entries) {
            const included=filter.value==='all' || (filter.value==='bench' ? check.checked : starterCandidates.has(row));
            element.hidden=!included || !normalize(displayName(row)).includes(query);
        }
        for (const group of list.querySelectorAll('section > section')) {
            group.hidden=!group.querySelector('.roster-candidate:not([hidden])');
        }
    }
    search.oninput=filterRows;
    filter.onchange=filterRows;
    statsOption.hidden=!seasonRoster?.records;
    function statsFor(row,pitcher) {
        return rosterStatText(row,pitcher,gameStatsOption.checked ? seasonRoster?.records : null);
    }
    function refreshStats() {
        for (const {row,pitcher,record} of entries) record.textContent=statsFor(row,pitcher);
    }
    refreshStats();
    const benchStage=dialog.querySelector('.roster-bench-stage');
    const boardStage=dialog.querySelector('.roster-board-stage');
    const diamond=dialog.querySelector('.roster-diamond');
    const order=dialog.querySelector('.roster-order');
    const picks=dialog.querySelector('.roster-picks');
    const pickNote=dialog.querySelector('.roster-pick-note');
    const swapTarget=dialog.querySelector('.roster-swap-target');
    const swapButton=dialog.querySelector('.roster-swap');
    const removeButton=dialog.querySelector('.roster-remove');
    const undoButton=dialog.querySelector('.roster-undo');
    const cancelButton=dialog.querySelector('.roster-cancel');
    const nextButton=dialog.querySelector('.roster-next');
    const domeInput=dialog.querySelector('.roster-dome input');
    dialog.querySelector('.roster-dome').hidden=Boolean(seasonRoster)||!setup.versusAI&&side===0;
    domeInput.checked=setup.dome;
    const chosenRows=()=>entries.filter(({check})=>check.checked).map(({row})=>row);
    function refreshBench() {
        dialog.querySelector('.roster-count').textContent=`ベンチ入り ${chosenRows().length}／25人`;
        filterRows();
    }
    const boardPositions=['LF','CF','RF','SS','2B','3B','P','1B','C','DH'];
    const positionName=pos=>pos==='DH' ? 'DH' : pos==='P' ? '先発投手' : FNAME[pos];
    let slots=Array(9).fill(null);
    let starter=fixedStarter ? preset.starter : null;
    let activeSlot=0;
    let activePosition=null;
    let boardOpen=false;
    let selected=[];
    const history=[];
    const back=onCancel||showTeamSelect;
    const gameButton=!setup.versusAI && side===0 ? '後攻の編成へ' : '試合開始';

    function remember() {
        history.push({slots:[...slots],starter,activeSlot,activePosition});
    }
    function suggested() {
        const bats=selected.filter(row=>!isPitcher(row));
        const lineup=[...new Set([...preset.lineup.filter(row=>bats.includes(row)),...bats])].slice(0,9);
        const fixed=Object.fromEntries(Object.entries(preset.positions||{}).filter(([,row])=>lineup.includes(row)));
        const field=assignFieldPositions(lineup,fixed);
        slots=lineup.map(row=>({row,pos:FIELD_POSITIONS.find(pos=>field[pos]===row)||'DH'}));
        starter=selected.includes(preset.starter)&&starterCandidates.has(preset.starter)
            ? preset.starter : selected.find(row=>starterCandidates.has(row));
        activeSlot=0;
        activePosition=null;
    }
    function button(label,action) {
        const control=document.createElement('button');
        control.type='button';
        control.textContent=label;
        control.onclick=action;
        return control;
    }
    function addStats(control,row,pitcher=false) {
        const record=document.createElement('span');
        record.className='roster-board-record';
        record.textContent=statsFor(row,pitcher);
        control.append(record);
        return control;
    }
    function selectSlot(index) {
        activeSlot=index;
        activePosition=slots[index]?.pos || null;
        renderBoard();
    }
    function advanceSlot() {
        const next=slots.findIndex(slot=>!slot);
        if (next>=0) activeSlot=next;
        activePosition=next<0&&!starter ? 'P' : null;
    }
    function renderBoard() {
        message.textContent='';
        diamond.replaceChildren();
        order.replaceChildren();
        picks.replaceChildren();
        const occupied=new Set(slots.filter(Boolean).map(({row})=>row));
        for (const pos of boardPositions) {
            const index=slots.findIndex(slot=>slot?.pos===pos);
            const row=pos==='P' ? starter : slots[index]?.row;
            const playerLabel=pos==='P' ? [displayName(row),handedness(row,false)].filter(Boolean).join('　') :
                `${index+1}番 ${displayName(row)}`;
            const control=button(row ? `${positionName(pos)}\n${playerLabel}` : positionName(pos),()=>{
                if (index>=0) activeSlot=index;
                activePosition=pos;
                renderBoard();
                (picks.firstElementChild || diamond.querySelector(`[data-position="${pos}"]`))?.focus();
            });
            control.dataset.position=pos;
            control.disabled=fixedStarter && pos==='P';
            if (!row) control.dataset.unassigned='';
            if (row && pos==='P') addStats(control,row,true);
            control.setAttribute('aria-pressed',String(activePosition===pos));
            diamond.append(control);
        }
        for (const [index,slot] of slots.entries()) {
            const label=slot ? [`${index+1}番`,positionName(slot.pos),displayName(slot.row),battingHand(slot.row)].filter(Boolean).join('　') : `${index+1}番　未選択`;
            const control=button(label,()=>{
                selectSlot(index);
                order.children[index].focus();
            });
            control.setAttribute('aria-pressed',String(index===activeSlot&&activePosition!=='P'));
            if (slot) addStats(control,slot.row);
            order.append(control);
        }
        const target=swapTarget.value;
        swapTarget.replaceChildren(new Option('選択',''));
        for (const [index,slot] of slots.entries()) {
            if (index!==activeSlot&&slot) swapTarget.add(new Option(`${index+1}番　${displayName(slot.row)}`,String(index)));
        }
        swapTarget.value=Array.from(swapTarget.options).some(option=>option.value===target) ? target : '';
        swapButton.disabled=activePosition==='P'||!slots[activeSlot]||swapTarget.value==='';
        swapTarget.disabled=activePosition==='P'||!slots[activeSlot]||swapTarget.options.length===1;
        removeButton.disabled=activePosition==='P' ? !starter : !slots[activeSlot];
        undoButton.disabled=!history.length;
        if (!activePosition) {
            pickNote.textContent=slots[activeSlot]&&starter ? '打順または守備位置を選んで編集できます。' :
                `${activeSlot+1}番の守備位置を選んでください。`;
            return;
        }
        const pos=activePosition;
        const candidates=selected.filter(row=>{
            if (pos==='P') return row!==starter&&starterCandidates.has(row);
            return !isPitcher(row)&&!occupied.has(row)&&(pos==='DH'||fieldCard(row,pos).rating>0);
        });
        if (pos!=='P'&&pos!=='DH') candidates.sort((a,b)=>fieldCard(b,pos).rating-fieldCard(a,pos).rating);
        const prefix=pos==='P' ? positionName(pos) : `${activeSlot+1}番・${positionName(pos)}`;
        pickNote.textContent=candidates.length ? `${prefix}の選手を選んでください（候補${candidates.length}人）。` : `${prefix}に選べる未配置の選手がいません。`;
        for (const row of candidates) {
            const detail=pos==='P' ? 'S'+extractPitcherStats(row).S : pos==='DH' ? '' : '守'+fieldCard(row,pos).rating;
            const hand=pos==='P' ? handedness(row,false) : battingHand(row);
            const control=button([displayName(row),hand,detail].filter(Boolean).join('　'),()=>{
                remember();
                if (pos==='P') {
                    starter=row;
                    activePosition=null;
                } else {
                    slots[activeSlot]={row,pos};
                    advanceSlot();
                }
                renderBoard();
                const nextControl=activePosition==='P' ? diamond.querySelector('[data-position="P"]') :
                    diamond.querySelector('[data-unassigned]:not([data-position="P"])');
                (nextControl || nextButton).focus();
            });
            picks.append(addStats(control,row,pos==='P'));
        }
    }
    swapTarget.onchange=()=>{swapButton.disabled=swapTarget.value==='';};
    swapButton.onclick=()=>{
        if (swapTarget.value==='') return;
        remember();
        const other=Number(swapTarget.value);
        [slots[activeSlot],slots[other]]=[slots[other],slots[activeSlot]];
        selectSlot(other);
    };
    removeButton.onclick=()=>{
        remember();
        if (activePosition==='P') starter=null;
        else {
            activePosition=slots[activeSlot].pos;
            slots[activeSlot]=null;
        }
        renderBoard();
    };
    undoButton.onclick=()=>{
        const previous=history.pop();
        if (!previous) return;
        ({slots,starter,activeSlot,activePosition}=previous);
        renderBoard();
    };
    dialog.querySelector('.roster-suggest').onclick=()=>{remember();suggested();renderBoard();};
    dialog.querySelector('.roster-clear').onclick=()=>{
        remember();
        slots.fill(null);
        activeSlot=0;
        activePosition=null;
        renderBoard();
    };
    function showStage(showBoard) {
        boardOpen=showBoard;
        benchStage.hidden=showBoard;
        boardStage.hidden=!showBoard;
        cancelButton.textContent=showBoard ? 'ベンチ選択に戻る' : 'チーム選択へ戻る';
        nextButton.textContent=showBoard ? gameButton : '25人を確定して打順・守備へ';
        message.textContent='';
    }
    statsOption.onchange=()=>{
        refreshStats();
        if (boardOpen) renderBoard();
    };
    list.onchange=refreshBench;
    form.onchange=()=>{message.textContent='';};
    refreshBench();
    showStage(false);
    cancelButton.onclick=()=>{
        if (boardOpen) {showStage(false);return;}
        dialog.close();
        back();
    };
    dialog.oncancel=event=>{
        if (boardOpen) {
            event.preventDefault();
            showStage(false);
        } else back();
    };
    form.onsubmit=event=>{
        event.preventDefault();
        if (!boardOpen) {
            const checked=chosenRows();
            const errors=[];
            if (checked.length!==25) errors.push(`ベンチ入りは25人必要です（現在${checked.length}人）。`);
            if (checked.filter(row=>!isPitcher(row)).length<9) errors.push('野手を9人以上選んでください。');
            if (!checked.some(row=>starterCandidates.has(row))) errors.push('登板可能でスタミナ4以上の投手をベンチ入りさせてください。');
            if (errors.length) {message.textContent=errors.join('\n');return;}
            if (!selected.length&&preset.restored) {
                selected=checked;
                suggested();
            } else {
                const eligible=new Set(checked);
                if (selected.some(row=>!eligible.has(row))) history.length=0;
                slots=slots.map(slot=>slot&&eligible.has(slot.row) ? slot : null);
                if (!eligible.has(starter)) starter=null;
                selected=checked;
                advanceSlot();
            }
            showStage(true);
            renderBoard();
            dialog.querySelector('.roster-board-title').focus();
            return;
        }
        const emptySlots=slots.flatMap((slot,index)=>slot ? [] : [index+1]);
        const errors=[];
        if (emptySlots.length) errors.push(`打順の${emptySlots.join('・')}番の選手を選んでください。`);
        if (!starter) errors.push('「先発投手」から投手を選んでください。');
        if (errors.length) {message.textContent=errors.join('\n');return;}
        const lineup=slots.map(({row})=>row);
        const positions=Object.fromEntries(slots.filter(({pos})=>pos!=='DH').map(({row,pos})=>[pos,row]));
        const choices={selected,lineup,starter,positions};
        if(onConfirm){
            try {
                onConfirm(choices);
                dialog.close();
            } catch (error) {
                message.textContent=`試合開始エラー：${error.message || error}`;
            }
            return;
        }
        setup.rosters[side]=choices;
        if (!setup.versusAI && side===0) { openRosterSetup(1); return; }
        setup.dome=domeInput.checked;
        if (setup.versusAI) setup.rosters[1-side]=cpuRoster(setup.opponent);
        dialog.close();
        newExhibition();
    };
    if (!dialog.open) dialog.showModal();
}

function laterCPU(g,work) {
    clearTimeout(cpuTimer);
    cpuTimer=setTimeout(() => {
        cpuTimer=null;
        if (gameInst===g && !g.gameOver) work();
    },350);
}
function applyCpuDefense(g) {
    if (!g.waitingForCpuDefense) return;
    g.waitingForCpuDefense=false;
    const close=Math.abs(g.scores[0]-g.scores[1])<=1;
    g.isForward=Boolean(g.bases[2] && g.outs<2 && close && g.inning>=6);
    g.isCautious=!g.isForward&&Boolean(g.bases[0] && !g.bases[1] && Number(g.bases[0].S2)>=80 && g.pitcher.G>0);
    const profile=g.profiles?.[g.defSide];
    const replace=g.pitcher.shock===2 || (g.pitcher.fatigued&&(!profile||g.inning>=profile.pen));
    if (g.canReplacePitcher() && replace) {
        const next=g.pitchers[g.defSide].find(p=>!p.isUsed);
        if (next) {
            g.replacePitcher(next);
            updateUI();
        }
    }
    if(profile?.lateDefense&&g.inning===8&&g.outs===0&&g.scores[g.defSide]>g.scores[g.batSide]&&g.fielderChangeInning!==g.inning){
        PFBSeason.improveDefense(g);g.fielderChangeInning=g.inning;updateUI();
    }
    announceDefense(g);
}
function announceDefense(g) {
    const label=g.isForward?'前進守備':g.isCautious?'盗塁警戒':'通常守備';
    g.logAdd(g.isSqueezeCautious?label+'・スクイズ警戒':label,'l-info',g.defSide);
    renderLog();
}
function cpuAttack(g) {
    const gap=g.scores[g.defSide]-g.scores[g.batSide];
    const profile=g.profiles?.[g.batSide];
    if(profile&&!g.offenseLocked&&g.inning>=profile.pinch&&gap>=0&&gap<=3){
        const current=getVal(g.batter['1H'],g.pitcher.G);
        const substitute=g.bench.findIndex(p=>getVal(p['1H'],g.pitcher.G)>=current+8);
        if(substitute>=0)g.substitute(g.batSide,g.batIdx[g.batSide],substitute);
    }
    if (g.canBunt(false) && !g.buntContinuation && g.outs===0 && g.inning>=7 && gap>=0 && gap<=1 && profile?.attack!==2) {
        execAtBat('bunt');
    } else {
        execAtBat('hit');
    }
}
function showOffenseMenu() {
    const g=gameInst;
    g.state='offense';
    if (g.versusAI && g.batSide!==g.humanSide && !g.isAuto) {
        renderButtons([],g.batSide,'相手が作戦を選択中');
        laterCPU(g,() => cpuAttack(g));
        return;
    }
    const btns=[ATTACK_ACTIONS[0]];
    if (g.bench.length && !g.offenseLocked) btns.push(ATTACK_ACTIONS[1]);
    if (g.canBunt(false) && !g.buntContinuation?.squeeze) btns.push(ATTACK_ACTIONS[2]);
    if (g.stealGroups().length) btns.push(ATTACK_ACTIONS[3]);
    if (g.canEndRun()) btns.push(ATTACK_ACTIONS[4]);
    if (g.canBunt(true) && (!g.buntContinuation || g.buntContinuation.squeeze)) btns.push(['スクイズ','squeeze','bw']);
    btns.push(['自動進行','auto','ba']);
    renderButtons(btns,g.batSide);
}
function showDefenseMenu() {
    const g=gameInst;
    g.state='defense';
    if (g.versusAI && g.defSide!==g.humanSide && !g.isAuto) {
        g.waitingForCpuDefense=true;
        showOffenseMenu();
        return;
    }
    const btns=[DEFENSE_ACTIONS[0],DEFENSE_ACTIONS[2]];
    const relief=Number(g.pitcher.isRelief && !g.pitcher.facedBatters);
    const leftMatch=Number(g.pitcher.arm.startsWith('左投') && g.batter['利き腕']?.endsWith('左打'));
    if (g.bases.some(Boolean) && g.pitcher.G+relief+leftMatch>0) btns.push(DEFENSE_ACTIONS[3]);
    if (g.bases[2]) {
        btns.push(DEFENSE_ACTIONS[1]);
        if (g.pitcher.C+relief+Number(g.bases.every(Boolean))>0) {
            btns.push(['スクイズ警戒','def_squeeze','bn'],['前進＋スクイズ警戒','def_forward_squeeze','bn']);
        }
    }
    if (g.pitchers[g.defSide].some(p=>!p.isUsed) && g.canReplacePitcher()) btns.push(DEFENSE_ACTIONS[4]);
    if (g.defBench.length) btns.push(DEFENSE_ACTIONS[5]);
    if (!g.versusAI && g.bench.length && !g.offenseLocked) btns.push(ATTACK_ACTIONS[1]);
    btns.push(['自動進行','auto','ba']);
    renderButtons(btns,g.defSide);
}
function showPending() {
    const g=gameInst;
    const {title,choices,side,defaultIndex}=g.pending;
    if (g.versusAI && side!==g.humanSide) {
        renderButtons([],side,title);
        laterCPU(g,() => doAction(`choice:${defaultIndex}`));
        return;
    }
    if (g.semiAuto && !g.semiAutoPause) pauseSemiAuto(g,'選択が必要なため停止');
    renderButtons(choices.map(([label],index)=>[label,`choice:${index}`,'bp']),side,title);
}
function showNext(label) {
    const g=gameInst;
    const side=g?.humanSide ?? g?.batSide;
    const nextLabel=label || g?.nextActionLabel || '次へ';
    if (g) g.nextActionLabel=nextLabel;
    const buttons=g?.isAuto ? [['停止','stop_auto','bw']] :
        autoPlayRunning(g) ? [] : [[nextLabel,'next','bp']];
    renderButtons(buttons,side,g?.semiAutoPause || '');
}

// ============================================================
// GAME FLOW
// ============================================================
function startAtBat(keepPlayResult=false) {
    const g = gameInst;
    g.preparePlate();
    g.autoPitChange(true);
    if (g.pending) { updateUI(keepPlayResult); showPending(); return; }
    if (g.called) { endGame(); return; }
    const pitcherWasFatigued=g.pitcher?.fatigued;
    g.beginPitchingInning();
    if (g.semiAuto && !pitcherWasFatigued && g.pitcher.fatigued) interruptSemiAuto(g);
    const b = g.batter, p = g.pitcher;
    if(!p) { g.logAdd('投手がいません！試合終了','l-rare'); g.gameOver=true; return; }
    const fat = (p.fatigued ? '【疲労】' : '') + (p.shock===2 ? '【回復不可ショック】' : p.shock===1 ? '【一時ショック】' : '');
    const inn = `${Math.floor(p.outsPitched / 3)}回${p.outsPitched % 3}/3`;
    g.logAdd('─────────────────────', 'l-sep');
    g.logAdd(`[${g.outStr()}] ${g.runnersStr()}  ${g.scores[0]}-${g.scores[1]}`, 'l-status');
    g.logAdd(`▼ ${fat}${p.name}(${p.arm}) ${inn} G:${p.G} C:${p.C} S:${p.S}`, 'l-pitch');
    g.logAdd(`【${g.batIdx[g.batSide] + 1}番 ${b['ポジション'] || ''}】${playerName(b)}  走:${b['走'] || '?'} バント:${b['バント'] || '?'}`, 'l-batter');
    updateUI(keepPlayResult);
    if (g.isAuto || g.semiAuto) {
        g.state='between';
        showNext('▶ 打席を続ける');
    } else {
        showDefenseMenu();
    }
}

function execAtBat(action) {
    const g=gameInst;
    applyCpuDefense(g);
    g.offenseLocked=true;
    const batter = g.batter;
    const batNum = g.batIdx[g.batSide] + 1;
    const logStart = g.log.length;
    const before=g.semiAuto && !g.semiAutoPause ? {runners:new Set(g.bases),homeRuns:g.hrEvents.length,fatigued:g.pitcher.fatigued} : null;
    if (action === 'hr') g.logAdd('ヒットエンドラン、走者スタート','l-steal');
    g.processAtBat(action,g.isForward,action === 'hr');
    const anim = determineAnim(g.log.slice(logStart),playerName(batter),batNum);
    finishPlay(anim,before);
}

function finishPlay(anim,before,keepPlayResult=false) {
    const g = gameInst;
    if (before && g.semiAuto && (
        g.outs<3 && g.bases.some(runner=>runner && !before.runners.has(runner)) ||
        !before.fatigued && g.pitcher.fatigued ||
        g.hrEvents.slice(before.homeRuns).some(event=>event.side!==(g.humanSide ?? 0))
    )) {
        interruptSemiAuto(g);
        before.returnToManual=true;
    }
    g.resolveRemovedFielders();
    if (!g.pending) {
        if (g.outs >= 3) g.bases = [null,null,null];
        for (const [runner,from] of g.stealBlocked) if (g.bases[from] !== runner) g.stealBlocked.delete(runner);
    }
    if (!g.pending && !g.gameOver && !g.called) {
        g.checkSecondBase();
        if (g.outs < 3 && g.pitcher.unavailable) g.autoPitChange();
    }
    updateUI(keepPlayResult);
    if (anim) playResultAnim(anim,keepPlayResult);
    if (g.gameOver || g.called) { endGame(); return; }
    if (g.pending) { g.pending.beforePlay=before; showPending(); return; }
    if (before?.returnToManual) {
        if (g.outs >= 3) endHalf(true);
        else if (g.plateComplete) startAtBat(true);
        else showDefenseMenu();
        return;
    }
    if (g.outs >= 3) { scheduleEndHalf(); return; }
    g.state = 'between';
    showNext(g.plateComplete ? '▶ 次の打席' : '▶ 打席を続ける');
}

function scheduleEndHalf() {
    const g = gameInst;
    console.log(`[DEBUG] scheduleEndHalf: ${g.inning}回${g.half===0?'表':'裏'} OUT:${g.outs} SCORE:${g.scores[0]}-${g.scores[1]}`);
    halfEndPending = true;
    showNext('▶ チェンジ');
    g.state = 'between';
}
function flushEndHalf() {
    console.log(`[DEBUG] flushEndHalf: pending=${halfEndPending}`);
    if (!halfEndPending) return;
    halfEndPending = false;
    endHalf();
}
function endHalf(openTactics=false) {
    const g = gameInst;
    console.log(`[DEBUG] endHalf: ${g.inning}回${g.half===0?'表':'裏'} SCORE:${g.scores[0]}-${g.scores[1]}`);
    const prev = g.innScores[g.batSide].reduce((a, b) => a + b, 0);
    g.innScores[g.batSide].push(g.scores[g.batSide] - prev);
    g.logAdd(`=== ${g.inning}回${g.half === 0 ? '表' : '裏'}終了  ${g.scores[0]}-${g.scores[1]} ===`, 'l-inning');
    // §9.2.3 イニング終了時に一時ショック回復
    g.endPitchingInning();
    const [awayScore,homeScore]=g.scores;
    const lastHalf=g.half===0 ? g.inning>=9 && homeScore>awayScore :
        (g.inning>=12 && !g.seasonMatch?.noDraw) || (g.inning>=9 && awayScore!==homeScore);
    if (lastHalf) { endGame(); return; }
    g.outs = 0; g.bases = [null, null, null];
    g.endRunUsed = false;
    g.stealBlocked.clear();
    g.responsible=Object.create(null);
    g.plateComplete = true;
    g.state = 'between';
    if (g.half === 0) { g.half = 1; }
    else { g.half = 0; g.inning++; }
    if (g.semiAuto && g.inning>=7 && g.inning<=9 && g.defSide===(g.humanSide ?? 0)) {
        interruptSemiAuto(g);
        openTactics=true;
    }
    const hstr = g.half === 0 ? '表' : '裏';
    const batting = g.half === 0 ? g.playerTeam : g.oppTeam;
    g.logAdd(`\n▶ ${g.inning}回${hstr} ${teamShort(batting)}の攻撃`, 'l-inning');
    updateUI();
    playInningFlash(g.inning, hstr, batting);
    if (openTactics) startAtBat(true);
    else showNext(`▶ ${g.inning}回${hstr}開始`);
}

function endGame() {
    const g=gameInst;
    clearTimeout(autoTimer);
    clearTimeout(cpuTimer);
    autoTimer=cpuTimer=null;
    g.isAuto=false;
    g.semiAuto=false;
    g.semiAutoPause='';
    const inningTotal = g.innScores[g.batSide].reduce((sum,runs) => sum + runs,0);
    if (g.innScores[g.batSide].length < g.inning && (g.outs || g.gameOver || g.called)) {
        g.innScores[g.batSide][g.inning-1] = g.scores[g.batSide] - inningTotal;
    }
    let winner = '引き分け';
    if (g.scores[0] > g.scores[1]) winner = g.playerTeam;
    else if (g.scores[1] > g.scores[0]) winner = g.oppTeam;
    g.logAdd('=' + '='.repeat(38), 'l-sep');
    if (g.called) g.logAdd(g.endReason || '試合打ち切り', 'l-inning');
    g.logAdd('【ゲームセット！】', 'l-inning');
    g.logAdd(`最終: ${teamShort(g.playerTeam)} ${g.scores[0]} - ${g.scores[1]} ${teamShort(g.oppTeam)}`, 'l-score');
    if (winner !== '引き分け') g.logAdd(`勝利: ${winner}`, 'l-score');
    if (g.homeRuns.length) g.logAdd(`本塁打: ${g.homeRuns.join(', ')}`, 'l-hit');
    g.gameOver=true;
    PFBResults.record(g,{season:Boolean(g.seasonMatch),online:Boolean(g.onlineMatch),date:g.seasonMatch?.date,label:g.seasonMatch?.label});
    if (g.seasonMatch) PFBSeasonUI.finish(g);
    showFinalPlay();
}
function showFinalPlay() {
    const g=gameInst;
    updateUI(true);
    renderButtons([['▶ 試合結果','final_report','bp']],g.humanSide ?? g.batSide,'ゲームセット');
}
function renderFinalResult(automaticDownload = false) {
    const g=gameInst;
    const report=PFBResults.record(g,{season:Boolean(g.seasonMatch),online:Boolean(g.onlineMatch)});
    updateUI();
    const field=document.getElementById('field-area');
    field.querySelectorAll('.game-over-overlay').forEach(el=>el.remove());
    const overlay=document.createElement('div');
    overlay.className='game-over-overlay report-overlay';
    const next=g.seasonMatch?'ペナントへ戻る':g.onlineMatch?'オンラインを終了':'もう一度';
    const standings=g.seasonMatch ? PFBSeasonUI.reportStandings() : '';
    overlay.innerHTML=PFBResults.reportHtml(report)+`<div class="report-actions">
        <button type="button" class="go-btn" onclick="doAction('restart')">${next}</button>
        <button type="button" class="go-btn report-download">HTMLを保存</button>
        </div>`+standings+PFBResults.reportCreditHtml;
    overlay.querySelector('.report-download').onclick=()=>PFBResults.downloadReport(report,standings);
    field.appendChild(overlay);
    renderButtons([],g.humanSide ?? g.batSide);
    if (automaticDownload) {
        try { PFBResults.downloadReport(report,standings,true); }
        catch (error) { console.warn('試合結果の自動保存に失敗しました',error); }
    }
}

// ============================================================
// ACTION DISPATCHER
// ============================================================
function doAction(action) {
    const g = gameInst;
    if (action==='pick_roster') { document.getElementById('file-input').click(); return; }
    if (action.startsWith('league:')) {
        setup.league=action.slice(7);
        const league=TEAM_LEAGUES[setup.league];
        if (!league) return;
        document.getElementById('game-log').textContent='担当球団を選択';
        renderButtons(rosterTeams().filter(team=>league.has(onwardTeam(team))).map(team=>[teamShort(team),`assign:${team}`,'bt']));
        return;
    }
    if (action.startsWith('assign:')) {
        setup.assigned=action.slice(7);
        document.getElementById('game-log').textContent=`${teamShort(setup.assigned)}のゲーム形式を選択`;
        const choices=[['ペナント（130試合）','season','bp'],['単発試合','exhibition','bn']];
        if(typeof PFBOnline!=='undefined')choices.push(['オンライン対戦','online','bn']);
        if(PFBSeasonUI.stored())choices.push(['前回のペナントを続ける','continue_season','bs']);
        renderButtons(choices);
        return;
    }
    if(action==='season'){PFBSeasonUI.start(setup.league,setup.assigned);return}
    if(action==='continue_season'){PFBSeasonUI.load(PFBSeasonUI.stored());return}
    if(action==='online'){PFBOnline.open();return}
    if(action==='exhibition'){
        document.getElementById('game-log').textContent='対戦相手を選択';
        renderButtons(rosterTeams().filter(team=>team!==setup.assigned).map(team=>[teamShort(team),`rival:${team}`,'bt']));
        return;
    }
    if (action.startsWith('rival:')) {
        setup.opponent=action.slice(6);
        document.getElementById('game-log').textContent='先攻・後攻を選択';
        renderButtons([['先攻で対AI','format:away','bp'],['後攻で対AI','format:home','bp'],['両球団を操作','format:both','bn']]);
        return;
    }
    if (action.startsWith('format:')) {
        const format=action.slice(7);
        setup.humanSide=format==='home'?1:0;
        setup.versusAI=format!=='both';
        setup.away=setup.humanSide===0?setup.assigned:setup.opponent;
        setup.home=setup.humanSide===1?setup.assigned:setup.opponent;
        openRosterSetup();
        return;
    }
    if (action==='restart') {
        document.getElementById('field-area').querySelectorAll('.game-over-overlay').forEach(el=>el.remove());
        gameInst=null;
        clearTimeout(cpuTimer);
        clearAutoTimer();
        document.getElementById('game-log').textContent='';
        if(g?.seasonMatch&&PFBSeasonUI.active()){updateUI();PFBSeasonUI.show('news')}
        else if(g?.onlineMatch){PFBOnline.leave();showTeamSelect()}
        else showTeamSelect();
        return;
    }
    if (action==='final_report' && g?.gameOver) { renderFinalResult(true); return; }
    if (!g || g.gameOver) return;
    if (g.pending) {
        if (!action.startsWith('choice:')) return;
        const {choices,beforePlate,beforePlay}=g.pending;
        const choice = choices[Number(action.slice(7))];
        if (!choice) return;
        const batter=playerName(g.batter);
        const batNum=g.batIdx[g.batSide]+1;
        const logStart=g.log.length;
        g.pending = null;
        choice[1]();
        if (beforePlate) startAtBat();
        else finishPlay(determineAnim(g.log.slice(logStart),batter,batNum),beforePlay,true);
        return;
    }
    if (action === 'resume_semi' && g.semiAutoInterrupted) { startAutoPlay(true); return; }
    if (action === 'auto') { startAutoPlay(); return; }
    if (action === 'stop_auto') { stopAutoPlay(); return; }
    if (action === 'next') {
        const resumeSemi=Boolean(g.semiAutoPause);
        if (resumeSemi) g.semiAutoPause='';
        if (halfEndPending) flushEndHalf();
        else if (g.state === 'between') {
            if (g.plateComplete) startAtBat();
            else {
                clearPlayResult();
                if (resumeSemi) showNext('▶ 打席を続ける');
                else showOffenseMenu();
            }
        }
        if (resumeSemi) queueAutoStep(g);
        return;
    }
    if (['hit','bunt','squeeze','hr'].includes(action)) {
        if (g.state !== 'offense' || action === 'hr' && !g.canEndRun()) return;
        execAtBat(action);
    } else if (action==='steal_menu') {
        if (g.state!=='offense') return;
        applyCpuDefense(g);
        const groups=g.stealGroups();
        renderButtons([...groups.map((group,i)=>[g.stealLabel(group),`steal:${i}`,'bp']),['戻る','cancel_offense','bn']],g.batSide,'盗塁する走者を選択');
    } else if (action.startsWith('steal:')) {
        if (g.state !== 'offense') return;
        const group = g.stealGroups()[Number(action.slice(6))];
        if (!group) return;
        applyCpuDefense(g);
        g.stealAttempted=true;
        g.offenseLocked=true;
        const logStart=g.log.length;
        g.runSteal(group);
        finishPlay(determineAnim(g.log.slice(logStart),playerName(g.batter),g.batIdx[g.batSide]+1));
    } else if (action === 'pinch') {
        const back=g.state==='defense'?'cancel':'cancel_offense';
        renderButtons([...g.bench.map((p,i)=>[displayName(p),`pinch:${i}`,'bs']),['戻る',back,'bn']],g.batSide,'代打を選択');
    } else if (action.startsWith('pinch:')) {
        if (g.offenseLocked) return;
        g.substitute(g.batSide,g.batIdx[g.batSide],Number(action.slice(6)));
        updateUI();
        if (g.state==='defense') showDefenseMenu();
        else showOffenseMenu();
    } else if (action==='cancel_offense') {
        showOffenseMenu();
    } else if (action==='cancel') {
        showDefenseMenu();
    } else if (['def_normal','def_forward','def_steal','def_squeeze','def_forward_squeeze'].includes(action)) {
        g.isForward = action.includes('forward');
        g.isCautious = action === 'def_steal';
        g.isSqueezeCautious=action.includes('squeeze');
        announceDefense(g);
        showOffenseMenu();
    } else if (action === 'def_ibb') {
        g.logAdd(`【敬遠】${playerName(g.batter)}`,'l-info');
        g.applyHitResult('BB',g.batter,'');
        g.nextBatter();
        finishPlay();
    } else if (action === 'def_pitcher') {
        if (!g.canReplacePitcher()) return;
        const avail = g.pitchers[g.defSide].filter(p => !p.isUsed);
        renderButtons([...avail.map((p,i)=>[pitcherChoiceLabel(p),`chpitch:${i}`,'bs']),['戻る','cancel','bn']],g.defSide,'登板する投手を選択');
    } else if (action.startsWith('chpitch:')) {
        const np = g.pitchers[g.defSide].filter(p => !p.isUsed)[Number(action.slice(8))];
        if (np && g.canReplacePitcher()) {
            g.replacePitcher(np);
        }
        updateUI();
        showDefenseMenu();
    } else if (action === 'def_fielder') {
        renderButtons([...g.defLineup.map((p,i) => [`${i+1}番 ${playerName(p)}`,`defout:${i}`,'bs']),['戻る','cancel','bn']],g.defSide,'交代する野手を選択');
    } else if (action.startsWith('defout:')) {
        const outgoing = Number(action.slice(7));
        renderButtons([...g.defBench.map((p,i) => [playerName(p),`defsub:${outgoing}:${i}`,'bs']),['戻る','cancel','bn']],g.defSide,'出場する野手を選択');
    } else if (action.startsWith('defsub:')) {
        const [,outgoing,incoming] = action.split(':');
        g.substitute(g.defSide,Number(outgoing),Number(incoming));
        updateUI();
        showDefenseMenu();
    }
}

// ============================================================
// AUTO-PLAY
// ============================================================
let autoTimer = null;
let halfEndPending = false;

function autoStep() {
    const g = gameInst;
    if (!autoPlayRunning(g) || g.gameOver || g.pending) return;
    if (halfEndPending) { flushEndHalf(); return; }
    if (g.state === 'between' && g.plateComplete) startAtBat();
    if (!g.gameOver && !g.pending && autoPlayRunning(g)) execAtBat('hit');
}

function autoPlayRunning(g) {
    return Boolean(g?.isAuto || g?.semiAuto && !g.semiAutoPause);
}

function updateAutoControls() {
    const g=gameInst;
    const auto=document.getElementById('dashboard-auto');
    const semi=document.getElementById('dashboard-semi-auto');
    const unavailable=!g || g.onlineMatch || g.gameOver || g.called || g.pending ||
        (g.state==='offense' && g.versusAI && g.batSide!==g.humanSide && !autoPlayRunning(g));
    auto.textContent=g?.isAuto?'自動停止':'自動進行';
    auto.disabled=Boolean(unavailable || g?.semiAuto);
    semi.hidden=Boolean(g?.semiAutoInterrupted);
    semi.textContent=g?.semiAutoPause?'半自動を解除':g?.semiAuto?'半自動中':'半自動進行';
    semi.setAttribute('aria-pressed',String(Boolean(g?.semiAuto)));
    semi.disabled=Boolean(unavailable || g?.isAuto);
}

function clearAutoTimer() {
    clearTimeout(autoTimer);
    autoTimer=null;
}

function interruptSemiAuto(g) {
    clearAutoTimer();
    g.semiAuto=false;
    g.semiAutoPause='';
    g.semiAutoInterrupted=true;
}

function pauseSemiAuto(g,reason) {
    g.semiAutoPause=reason;
    clearAutoTimer();
}

function queueAutoStep(g) {
    clearAutoTimer();
    if (g!==gameInst || g.gameOver || !autoPlayRunning(g)) return;
    autoTimer=setTimeout(()=>{
        autoTimer=null;
        if (g!==gameInst) return;
        autoStep();
        queueAutoStep(g);
    },g.semiAuto?3000:2000);
}

function toggleAutoPlay(semi=false) {
    const g=gameInst;
    if (!g || g.gameOver || g.called || g.pending || g.onlineMatch) return;
    if (g.isAuto || g.semiAuto) stopAutoPlay();
    else startAutoPlay(semi);
}

function startAutoPlay(semi=false) {
    const g=gameInst;
    if (!g || g.gameOver || g.called || g.pending || g.onlineMatch) return;
    g.isAuto=!semi;
    g.semiAuto=semi;
    g.semiAutoInterrupted=false;
    g.semiAutoPause='';
    clearTimeout(cpuTimer);
    cpuTimer=null;
    showNext();
    if (!semi) autoStep();
    queueAutoStep(g);
}

function stopAutoPlay() {
    clearAutoTimer();
    const g=gameInst;
    if (!g || g.gameOver || g.called) return;
    g.isAuto=false;
    g.semiAuto=false;
    g.semiAutoPause='';
    if (g.pending) showPending();
    else if (halfEndPending || g.state==='between') showNext();
    else if (g.state==='offense') showOffenseMenu();
    else showDefenseMenu();
}

const actionSplitter=document.getElementById('action-splitter');
const actionArea=document.getElementById('action-area');
let actionDrag=null;
function actionAreaLimit() {
    const limit=innerWidth<=680 ? .65 : .55;
    return Math.max(120,Math.floor(innerHeight*limit));
}
function announceActionAreaSize(size,maximum) {
    actionSplitter.setAttribute('aria-valuemin','120');
    actionSplitter.setAttribute('aria-valuemax',String(maximum));
    actionSplitter.setAttribute('aria-valuenow',String(size));
    actionSplitter.setAttribute('aria-valuetext',`高さ ${size} ピクセル`);
}
function resizeActionArea(height) {
    const maximum=actionAreaLimit();
    const size=Math.min(maximum,Math.max(120,Math.round(height)));
    actionArea.style.setProperty('--action-area-height',size+'px');
    announceActionAreaSize(size,maximum);
}
actionSplitter.addEventListener('focus',()=>announceActionAreaSize(
    Math.round(actionArea.getBoundingClientRect().height),actionAreaLimit()));
actionSplitter.addEventListener('pointerdown',event=>{
    if (!event.isPrimary || event.button!==0) return;
    actionDrag={y:event.clientY,height:actionArea.getBoundingClientRect().height};
    actionSplitter.setPointerCapture(event.pointerId);
});
actionSplitter.addEventListener('pointermove',event=>{
    if (actionDrag && actionSplitter.hasPointerCapture(event.pointerId)) {
        resizeActionArea(actionDrag.height+actionDrag.y-event.clientY);
    }
});
actionSplitter.addEventListener('lostpointercapture',()=>{actionDrag=null;});
actionSplitter.addEventListener('keydown',event=>{
    const height=actionArea.getBoundingClientRect().height;
    const keys={ArrowUp:height+24,ArrowDown:height-24,Home:0,End:innerHeight};
    if (!Object.hasOwn(keys,event.key)) return;
    event.preventDefault();
    resizeActionArea(keys[event.key]);
});

// ============================================================
// FILE LOADING
// ============================================================
let playerLoadRequest=0;

function loadPlayerData(bytes) {
    let text;
    try { text=new TextDecoder('utf-8',{fatal:true}).decode(bytes); }
    catch { text=new TextDecoder('shift-jis').decode(bytes); }
    const roster=parseCSV(text);
    if (roster.length<10) throw new Error('選手データの読み込みに失敗しました。');
    PFBSeasonUI.leave();
    gameInst=null;
    players=roster;
    showGameScreen();
    showTeamSelect();
}

function promptForCsv() {
    document.getElementById('csv-load-status').textContent='Data_25.csv を選択してゲームを開始';
    document.getElementById('csv-fallback').hidden=false;
}

async function loadDefaultRoster() {
    const request=playerLoadRequest;
    try {
        let bytes;
        if (location.protocol==='file:') {
            bytes=Uint8Array.from(atob(PFB_DEFAULT_CSV_BASE64),value=>value.charCodeAt(0));
        } else {
            const response=await fetch('Data_25.csv');
            if (!response.ok) throw new Error('選手データがありません。');
            bytes=await response.arrayBuffer();
        }
        if (request===playerLoadRequest && !players.length) loadPlayerData(bytes);
    } catch {
        if (request===playerLoadRequest && !players.length) promptForCsv();
    }
}

document.getElementById('file-input').addEventListener('change', function(e) {
    const file = e.target.files[0]; if (!file) return;
    const request=++playerLoadRequest;
    const reader = new FileReader();
    const failed=()=>{
        if (request!==playerLoadRequest) return;
        if (!players.length) promptForCsv();
        alert('選手データの読み込みに失敗しました。');
    };
    reader.onload = function(ev) {
        if (request!==playerLoadRequest) return;
        try { loadPlayerData(ev.target.result); }
        catch { failed(); }
    };
    reader.onerror=failed;
    reader.readAsArrayBuffer(file);
    e.target.value='';
});
