// 戦闘フェイズの進行: 未処理の戦闘を1つ実行（Uボート戦闘 → 連合LBA/空母 → 水上戦闘）
let axisLbaChecked = false; // ドイツ軍の航空攻撃で「終了」を選択済み（当ターン）
async function runNextCombat(){
  // 1) Uボート戦闘
  const ubSea = Object.keys(SEAS).find(seaKey =>
    !combatDone.uboat.has(seaKey)
    && SHIPS.some(s => s.location===seaKey && !s.sunk && s.side==='allies' && !s.returnPending)
    && SHIPS.some(s => s.location===seaKey && !s.sunk && s.type==='UBOAT' && !s.returnPending)
  );
  if(ubSea) return resolveUboatCombatPhase(ubSea);

  // 2) 連合LBA: 地中海を優先。いなければ攻撃可能な枢軸艦が最多のエリア（同数はランダム）
  const airTargetCount = area => SHIPS.filter(s =>
    s.location === area && !s.sunk && s.side === 'axis' && s.type !== 'UBOAT' && !s.disabledThisTurn
  ).length;
  if(!lbaUsed.allies){
    // 地中海に枢軸艦がいれば必ず地中海、いなければ攻撃可能な枢軸艦が最多のエリア
    if(airTargetCount('Mediterranean') > 0) return startLbaBombing('allies', 'Mediterranean');
    const areas = LBA_TARGETS.allies.filter(a => airTargetCount(a) > 0);
    if(areas.length){
      const max = Math.max(...areas.map(airTargetCount));
      const best = areas.filter(a => airTargetCount(a) === max);
      return startLbaBombing('allies', best[Math.floor(Math.random() * best.length)]);
    }
  }
  // 連合空母のみ（空母所在海域）
  const cvSea = Object.keys(SEAS).find(seaKey =>
    !combatDone.alliedAir.has(seaKey)
    && SHIPS.some(s => s.location===seaKey && !s.sunk && s.side==='allies' && s.type==='CV' && !s.disabledThisTurn)
    && airTargetCount(seaKey) > 0
  );
  if(cvSea) return startLbaBombing('allies', cvSea);

  // 3) ドイツ軍の航空攻撃（LBA・空母を1つの選択画面から）
  if(!axisLbaChecked){
    const options = axisAirOptions();
    if(options.length) return selectAxisAirStrike(options);
  }

  // 4) 水上戦闘
  const surfSea = Object.keys(SEAS).find(seaKey =>
    !combatDone.surface.has(seaKey)
    && SHIPS.some(s => s.location===seaKey && !s.sunk && s.side==='allies' && s.type!=='UBOAT' && !s.returnPending)
    && SHIPS.some(s => s.location===seaKey && !s.sunk && s.side==='axis'   && s.type!=='UBOAT' && !s.returnPending)
  );
  if(surfSea) return resolveSurfacePhase(surfSea);
  setPhaseLabel('━ 全戦闘 終了 ━');
  document.getElementById('combatCloseBtn').style.display = '';
}

// 戦闘画面の上部に選択ボタンを表示し、押されたボタンの値を返す
function chooseInPhaseLabel(title, choices){
  return new Promise(resolve => {
    const phaseEl = document.getElementById('phaseLabel');
    const btnStyle = 'color:#fff;border:none;padding:4px 12px;border-radius:3px;cursor:pointer;margin:2px 4px 0 0;';
    phaseEl.innerHTML = `<div style="font-weight:bold;color:#fc4;margin-bottom:4px;">${title}</div>`
      + choices.map((c, i) => `<button data-idx="${i}" style="${btnStyle}background:${c.bg||'#446'};">${c.label}</button>`).join('');
    phaseEl.querySelectorAll('button[data-idx]').forEach(b => {
      b.onclick = () => resolve(choices[Number(b.dataset.idx)].value);
    });
  });
}

// ドイツ軍の航空攻撃の選択肢: LBA攻撃エリア（同海域の空母と合計）＋ 空母のみの海域
function axisAirOptions(){
  const targetCount = area => SHIPS.filter(s =>
    s.location === area && !s.sunk && s.side === 'allies' && s.type !== 'UBOAT' && !s.disabledThisTurn
  ).length;
  // 未攻撃の空母がいる海域
  const hasCv = area => SEAS[area] && !combatDone.axisAir.has(area) && SHIPS.some(s =>
    s.location === area && !s.sunk && s.side === 'axis' && s.type === 'CV' && !s.disabledThisTurn
  );
  const label = a => SEA_LABEL[a] || PORT_LABEL[a] || a;
  const opts = [];
  if(!lbaUsed.axis){
    LBA_TARGETS.axis.forEach(a => {
      if(targetCount(a) === 0) return;
      const cv = !!hasCv(a);
      opts.push({ area: a, cvOnly: false, useCv: cv, label: `${cv ? 'LBA+空母' : 'LBA'} ${label(a)}` });
    });
  }
  Object.keys(SEAS).forEach(seaKey => {
    if(!hasCv(seaKey) || targetCount(seaKey) === 0) return;
    if(!lbaUsed.axis && LBA_TARGETS.axis.includes(seaKey)) return; // LBA+空母 として表示済み
    opts.push({ area: seaKey, cvOnly: true, useCv: true, label: `空母のみ ${label(seaKey)}` });
  });
  return opts;
}

// ドイツ軍の航空攻撃: 攻撃するエリアを1つの選択画面から選ぶ（終了も可）
async function selectAxisAirStrike(options){
  await openCombatModal(null, []);
  document.getElementById('combatTitle').textContent = 'ドイツ軍 航空攻撃';
  const choices = options.map(o => ({ label: o.label, value: o, bg: SEA_COLOR[o.area] || '#444' }));
  choices.push({ label: '終了', value: null, bg: '#666' });
  const opt = await chooseInPhaseLabel('ドイツ軍 航空攻撃：攻撃するエリアを選んでください', choices);
  if(!opt){
    axisLbaChecked = true;
    return runNextCombat();
  }
  return startLbaBombing('axis', opt.area, opt.cvOnly, opt.useCv);
}

function runFastCombat(){
  console.log('[DBG] runFastCombat 呼び出し');
  console.trace();
  const events = [];
  const start = performance.now();
  resolveAllCombat(events);
  const elapsed = performance.now() - start;
  let sunkAllies = 0, sunkAxis = 0, dmgAllies = 0, dmgAxis = 0;
  events.forEach(e => {
    const s = SHIPS.find(x => x.id === e.ship);
    if(!s) return;
    if(e.type === 'sunk'){
      if(s.side === 'allies') sunkAllies++; else sunkAxis++;
    } else if(e.type === 'damage'){
      if(s.side === 'allies') dmgAllies += (e.damage || 0); else dmgAxis += (e.damage || 0);
    }
  });
  placeAllShips();
  document.getElementById('phaseLabel').textContent =
    `高速戦闘完了 (${elapsed.toFixed(1)}ms) - 撃沈: 連合${sunkAllies}/枢軸${sunkAxis} 損害: 連合${dmgAllies}/枢軸${dmgAxis}`;
}

async function runAICombat(){
  console.log('[DBG] runAICombat 呼び出し');
  console.trace();
  aiMode = true;
  document.getElementById('combatModal').classList.add('show');
  try {
    // 水上戦闘のみ全海域で実行 (ASW/LBA/航空攻撃は個別ボタンで手動実行)
    for(const seaKey of Object.keys(SEAS)){
      const surfAllies = SHIPS.filter(s => s.location===seaKey && !s.sunk && s.side==='allies' && s.type!=='UBOAT');
      const surfAxis = SHIPS.filter(s => s.location===seaKey && !s.sunk && s.side==='axis' && s.type!=='UBOAT');
      if(!surfAllies.length || !surfAxis.length) continue;
      startCombatLogEntry(SEA_LABEL[seaKey]||seaKey, '水上戦闘 (AI)');
      await resolveSurfaceCombat(seaKey, false);
      endCombatLogEntry();
    }
  } finally {
    aiMode = false;
    placeAllShips();
    renderCombatPane();
  }
}

function endTurn(){
  lockOptionRules();
  const log = [];
  const wasAtLastTurn = currentTurn >= 8; // ターン8終了時のみ true（ゲーム終了表示用）
  // 海域支配は phase 7 で設定済み（前ターン維持ルール含む）、ここでは触らない
  // POC加算（5.8）: 海域支配POCはphase 9で加算済み、ここでは中立残留・船団上陸のみ
  let delta = 0;
  // 16. ドイツ艦の給油: phase 8 で自動判定するように移動済み（ここでは何もしない）

  // 17.2 中立港の残留ペナルティ（到着ターン以外、毎ターン1艦1POC損失）
  SHIPS.forEach(s => {
    if(s.location !== 'Neutral' || s.sunk || s.removed) return;
    if(s.arrivedNeutralTurn === currentTurn) return; // 到着ターンは免除
    if(s.side === 'allies'){
      delta -= 1; // 連合-1POC = カウンタ-1
      log.push(`${s.name} 中立港残留 → 連合 -1POC`);
    } else if(s.side === 'axis'){
      delta += 1; // 枢軸-1POC = カウンタ+1
      log.push(`${s.name} 中立港残留 → 枢軸 -1POC`);
    }
  });

  // 14. 船団の上陸（AI判断: 基本ロシアを目指すので英国は上陸しない）
  SHIPS.forEach(s => {
    if(s.type !== 'CONVOY' || s.sunk || s.removed) return;
    if(s.location === 'Barents'){
      // ロシア自動上陸 +3POC。上陸したロシアの港に置いたまま（以後動かない）
      s.removed = true; s.location = 'Russia'; s.landed = true;
      delta += 3;
      log.push(`船団 ${s.name} ロシア上陸 +3POC(連合)`);
      announceBig(`${s.name} ロシア上陸 ＋3 POC（連合）`);
    }
    // NA留まり: 次ターンBarentsへ進ませる（英国上陸はしない）
  });
  const pocBeforeEnd = poc;
  poc = Math.max(-10, Math.min(10, poc + delta));
  console.log(`[POC] endTurn delta=${delta} poc ${pocBeforeEnd} → ${poc} (中立港・コンボイ分)`);
  log.push(`POC変動: ${delta>=0?'+':''}${delta} → 累計${poc>=0?'+':''}${poc}`);
  // 前のターンに連合が得たPOC（連合AIの優勢判断に使用）
  lastTurnPocGain = poc - pocAtTurnStart;
  pocAtTurnStart = poc;
  log.push(`このターンの連合獲得POC: ${lastTurnPocGain>=0?'+':''}${lastTurnPocGain}`);

  // 3) フラグ解除と船団のターン経過カウント（帰還は phase 8 で完結）
  SHIPS.forEach(s => {
    s.failedMove = false;
    s.movedThisTurn = false;
    s.originThisTurn = null;
    s.disabledThisTurn = false;
    s.returnPending = false;
    s.forcedReturn = false;
    // 一度マルタに移動した UK 艦は homePort を Malta に固定
    if(s.country === 'UK' && s.location === 'Malta'){
      s.homePort = 'Malta';
    }
    // 船団のターン経過カウント
    if(s.type === 'CONVOY' && !s.removed){
      if(s.location && SEAS[s.location]) s.turnsAtSea = (s.turnsAtSea || 0) + 1;
      else s.turnsAtSea = 0;
    }
  });

  // LBA使用フラグリセット
  lbaUsed.allies = false;
  lbaUsed.axis = false;
  // 戦闘完了フラグリセット
  combatDone.uboat.clear();
  combatDone.surface.clear();
  combatDone.alliedAir.clear();
  combatDone.axisAir.clear();
  axisLbaChecked = false;
  // 撤退海域フラグリセット
  retreatedSeas.clear();

  // 4) 支配マーカー更新
  placeControlMarkers();

  // 5) ターン進行（5.9）
  if(currentTurn < 8){
    currentTurn++;
    document.getElementById('turnLabel').textContent = currentTurn;
  } else {
    log.push('ゲーム終了');
  }
  // 6) ターントラック処理 / US 戦闘艦は1回ロール統一（6で北大西洋直行、失敗で T+1。オプションでターンごとに緩和）
  //    ターン8終了時もここを実行 → T_n に残った艦に最終判定機会を与える
  const usResults = [];
  SHIPS.forEach(s => {
    if(s.location && s.location.startsWith('T')){
      const t = parseInt(s.location.slice(1));
      if(t <= currentTurn){
        if(s.country === 'US' && (s.type === 'BB' || s.type === 'CA')){
          const r = rollD6();
          if(r >= usEntryNeed()){
            s.location = 'NorthAtlantic';
            s.homePort = HOME_PORT[s.country] || 'USA';
            s.usEntered = true;
            const line = `${s.name}: 出撃ロール⚂${r} 成功 → 北大西洋`;
            log.push(line); usResults.push(line);
          } else if(currentTurn < 8){
            s.location = 'T' + (currentTurn + 1);
            const line = `${s.name}: 出撃ロール⚂${r} 失敗 → T${currentTurn + 1}`;
            log.push(line); usResults.push(line);
          } else {
            // ターン8の最終判定で失敗 → 出撃せず終了
            const line = `${s.name}: 出撃ロール⚂${r} 失敗 (最終判定)`;
            log.push(line); usResults.push(line);
          }
        } else {
          const home = HOME_PORT[s.country] || null;
          s.location = home;
          s.homePort = home;
        }
      }
    }
  });
  if(usResults.length){
    alert('US 出撃判定:\n' + usResults.join('\n'));
  }
  // 6.5) Uボート総数が8以上なら超過分を削除（enterTurnが新しい順）— ターン進行時のみ
  if(currentTurn < 8 || phaseIdx >= 1){
    const allUboats = SHIPS.filter(s => s.type === 'UBOAT' && !s.sunk && !s.removed);
    if(allUboats.length >= 8 && !optionRules.ubNoLimit){
      const sorted = allUboats.slice().sort((a,b) => (b.enterTurn || 0) - (a.enterTurn || 0));
      const excess = allUboats.length - 7;
      for(let i = 0; i < excess; i++){
        sorted[i].removed = true;
        sorted[i].location = null;
        log.push(`${sorted[i].name}: Uボート総数8隻以上のため削除`);
      }
    }
  }
  // 6.6) イタリア艦隊の接収（ターン8初め、地中海4ターン連続枢軸支配時）
  if(currentTurn === 8 && !wasAtLastTurn && italySeizurePending && !italySurrendered){
    executeItalySeizure(log);
  }

  // 7) 描画
  phaseIdx = 1;
  renderPhaseBar();
  placeAllShips();
  renderPortButtons(); renderLocShipList(); renderDestButtons();
  renderStatus(); renderSeaResetButtons(); updatePOC();
  document.getElementById('moveStatus').innerHTML = log.join('<br>');

  // ターン8終了 → ゲーム終了 → レポートの保存画面（ターン7終了時の currentTurn=8 では表示しない）
  if(wasAtLastTurn && typeof showReportSave === 'function'){
    setTimeout(() => showReportSave(), 200);
  }
}

function showStack(stackId){
  const st = stacks[stackId];
  if(!st) return;
  let html = `<h3>${st.label} (${st.ships.length}艦)</h3><div class="modal-grid">`;
  st.ships.forEach(s=>{
    const enter = s.enterTurn ? ` (T${s.enterTurn})` : '';
    let statusHtml = '';
    if(s.sunk) statusHtml = `<span style="color:#f44;font-weight:bold;">★撃沈</span>`;
    else if(s.damage > 0) statusHtml = `<span style="color:#fa8;">損害${s.damage}/${s.def}・速力${s.spd}</span>`;
    if(s.disabled) statusHtml += ` <span style="color:#fc4;">[即時帰還]</span>`;
    html += `<div class="modal-ship">
      <img src="images/${s.file}">
      <div class="info">
        <div class="nm">${s.name}${enter}</div>
        <div class="sp">${s.country} / ${s.atkOrig}-${s.def}-${s.spdOrig} ${s.type}</div>
        ${statusHtml ? `<div style="font-size:0.85em;">${statusHtml}</div>` : ''}
      </div>
    </div>`;
  });
  html += `</div><button class="modal-close" onclick="closeModal()">閉じる</button>`;
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}
