// 5.62 航空戦闘（連合 or 枢軸の片方ずつ実行）
async function playAirPhase(side, seaKey, modalAlreadyOpen){
  const enemyName = side==='allies' ? 'axis' : 'allies';
  const cvs = SHIPS.filter(s => s.location === seaKey && !s.sunk && s.side === side && s.type === 'CV');
  const lbaUsable = !lbaUsed[side] && LBA_TARGETS[side].includes(seaKey);
  // 攻撃手段なし
  if(!cvs.length && !lbaUsable) return modalAlreadyOpen;
  // 目標なし
  const targets = SHIPS.filter(s =>
    s.location === seaKey && !s.sunk && s.side === enemyName && s.type !== 'UBOAT' && !s.disabledThisTurn
  );
  if(!targets.length) return modalAlreadyOpen;

  // LBA使用確認
  let useLba = false;
  if(lbaUsable){
    useLba = confirm(`${side==='allies'?'連合':'枢軸'} LBAを ${SEA_LABEL[seaKey]} に使用しますか？`);
  }
  if(!useLba && !cvs.length) return modalAlreadyOpen;

  // モーダル準備
  if(!modalAlreadyOpen){
    await openCombatModal(seaKey, [{type:'phase', sea:seaKey, label:'航空戦闘'}], {excludeUboat: true});
    modalAlreadyOpen = true;
  }
  setPhaseLabel(`━ 航空戦闘 ${side==='allies'?'(連合)':'(枢軸)'} ━`);
  await new Promise(r=>setTimeout(r,500));

  // LBAマーカー挿入: ダイス数分の行
  const colId = side==='allies' ? 'alliesShipList' : 'axisShipList';
  const colEl = document.getElementById(colId);
  if(colEl.children.length === 1 && colEl.firstElementChild && colEl.firstElementChild.tagName === 'DIV' && colEl.firstElementChild.style.color){
    colEl.innerHTML = '';
  }
  if(useLba){
    const lbaImg = side==='allies' ? 'イギリス/allied_lba.gif' : 'ドイツ/axis_lba.gif';
    for(let i=LBA_VALUE-1; i>=0; i--){
      const rid = `lba-${side}-${i}`;
      const html = `<div class="cs-row" id="cs-${rid}">
        <div class="cs-img"><img src="images/${lbaImg}"></div>
        <div class="cs-name">陸上攻撃機 ${i+1}/${LBA_VALUE}</div>
        <div class="cs-status" id="cs-st-${rid}">空爆</div>
        <div class="cs-dice" id="cs-dc-${rid}"></div>
      </div>`;
      colEl.insertAdjacentHTML('afterbegin', html);
    }
  }
  // CV: 火力(def)分の射撃行を追加（元のCV行は触らない）
  for(const cv of cvs){
    for(let i=0; i<cv.def; i++){
      const rid = `${cv.id}-air-${i}`;
      const html = `<div class="cs-row" id="cs-${rid}">
        <div class="cs-img"><img src="images/${cv.file}"></div>
        <div class="cs-name">${cv.name} ${i+1}/${cv.def}</div>
        <div class="cs-status" id="cs-st-${rid}">空爆</div>
        <div class="cs-dice" id="cs-dc-${rid}"></div>
      </div>`;
      colEl.insertAdjacentHTML('beforeend', html);
    }
  }

  // 各敵艦は LBA+空母合計で1回のみ攻撃可
  const targetedIds = new Set();
  const fireOneShot = async (attackerId, attackerName, label, mode) => {
    const remaining = SHIPS.filter(s =>
      s.location === seaKey && !s.sunk && s.side === enemyName && s.type !== 'UBOAT' && !s.disabledThisTurn && !targetedIds.has(s.id)
    );
    if(!remaining.length){
      setPhaseLabel(`${label}: 攻撃可能な敵艦なし`);
      await new Promise(r => setTimeout(r, 400));
      return false;
    }
    setPhaseLabel(`${label}: 目標をクリック`);
    highlightShip(attackerId, 'firing');
    const target = await waitForTargetClickIn(enemyName, seaKey, targetedIds, mode);
    unhighlightShip(attackerId, 'firing');
    if(!target) return false;
    targetedIds.add(target.id);
    const events = [];
    airFireAt({id: attackerId, name: attackerName}, target, events);
    await playEvents(events);
    return true;
  };

  if(useLba){
    for(let i=0; i<LBA_VALUE; i++){
      const ok = await fireOneShot(`lba-${side}-${i}`, `LBA${i+1}`, `LBA ${i+1}/${LBA_VALUE}`, 'air');
      if(!ok) break;
    }
    lbaUsed[side] = true;
  }
  for(const cv of cvs){
    if(cv.sunk) continue;
    const dice = cv.def;
    for(let i=0; i<dice; i++){
      const ok = await fireOneShot(`${cv.id}-air-${i}`, `${cv.name}${i+1}`, `${cv.name} ${i+1}/${dice}`, 'cv');
      if(!ok) break;
    }
  }
  return modalAlreadyOpen;
}

// 11. 水上戦闘
async function resolveSurfaceCombat(seaKey, modalAlreadyOpen, oneRound = false){
  console.log('[DBG] resolveSurfaceCombat 呼び出し', seaKey, 'modalAlreadyOpen=', modalAlreadyOpen);
  console.trace();
  await flashCombatOverlay(`━ ${SEA_LABEL[seaKey]||seaKey} 海戦 ━`, 1500);
  clearRetreatGroups(); // 前の戦闘の撤退グループの印を消す
  SHIPS.forEach(s => { delete s._cvDeclared; }); // 空母の攻撃の宣言は戦闘ごと
  chooseAlliedFireStyle(seaKey); // 連合AIの割り振り方（この戦闘のあいだ同じ。画面には出さない）
  let cvAsked = false;
  let firstIter = true;
  while(true){
    const ships = SHIPS.filter(s => s.location === seaKey && !s.sunk && s.type !== 'UBOAT' && !s.returnPending);
    const allies = ships.filter(s => s.side === 'allies');
    const axis   = ships.filter(s => s.side === 'axis');
    if(!allies.length || !axis.length){
      SHIPS.forEach(s => { delete s._cvDeclared; }); // 戦闘が終わったら空母の扱いに戻す
      alliedTargetMode = 'normal'; // 戦闘の外（航空攻撃など）は今まで通り
      await flashCombatOverlay(`━ ${SEA_LABEL[seaKey]||seaKey} 海戦 終了 ━`, 1200);
      return;
    }

    if(!modalAlreadyOpen){
      await openCombatModal(seaKey, [{ type:'phase', sea:seaKey, label:'水上戦闘' }], {excludeUboat: true});
      modalAlreadyOpen = true;
      await playEvents([{ type:'phase', sea:seaKey, label:'水上戦闘' }]);
    } else {
      // 水上戦闘移行時: 前フェーズで撃沈/帰還した艦・Uボートを除外して再描画
      if(firstIter){
        document.getElementById('alliesShipList').innerHTML = allies.map(renderShipRow).join('') || '<div style="color:#aac;padding:6px;">―</div>';
        document.getElementById('axisShipList').innerHTML   = axis.map(renderShipRow).join('')   || '<div style="color:#aac;padding:6px;">―</div>';
      }
      setPhaseLabel(`━ 水上戦闘 (${SEA_LABEL[seaKey]}) ━`);
    }
    firstIter = false;

    // ラウンド開始時の枢軸艦リスト（11.3 撃沈/不能でも反撃可）
    const axisAtStart = axis.slice();
    // 損害保留（11.3 同時適用）
    const pending = { damage: {}, disabled: new Set(), firedAtBy: { allies: new Set(), axis: new Set() } };

    // === 空母の攻撃の宣言（戦闘の始まりに1回。以後この戦闘のあいだ続き、取り消せない）===
    // 攻撃力のある空母は、攻撃すると宣言すれば、通常の艦と同じ扱い（撃てる・保護なし・即時反撃なし）
    if(!cvAsked){ await declareCarrierAttacks(seaKey); cvAsked = true; }
    updateConvoyOpen(seaKey);
    startProtectedView(seaKey);
    // === 目標の宣言（両軍とも先に全艦の目標を決め、結果を見てからは変えられない）===
    const decl = [];
    const pendDecl = { allies: newDeclPending(), axis: newDeclPending() };
    // 連合の宣言
    setAiDecisionLabel('');
    setPhaseLabel('連合軍の攻撃ボタンを押してください');
    await waitForCombatFlowBtn('連合軍の攻撃');
    setPhaseLabel(`連合: 各艦の目標をクリック`);
    await declareSurfaceTargets(allies.filter(s => !s.sunk && !s.disabled), 'axis', seaKey, decl, pendDecl);
    // 枢軸の宣言（撃沈/不能でも反撃可）
    setPhaseLabel('ドイツ軍の攻撃ボタンを押してください');
    await waitForCombatFlowBtn('ドイツ軍の攻撃');
    setPhaseLabel(`枢軸: 各艦の目標をクリック`);
    await declareSurfaceTargets(axisAtStart, 'allies', seaKey, decl, pendDecl);
    // 判定: 宣言どおりに連合 → 枢軸の順にダイスを振る（損害は保留して同時に適用）
    if(decl.length && humanSide === 'axis'){
      setPhaseLabel('攻撃ボタンを押してください');
      await waitForAirAttackBtn();
    }
    await resolveDeclaredFire(decl, pending);

    // === 同時適用（11.3）===
    setPhaseLabel('━ 損害適用 ━');
    const applyEvents = [];
    for(const tid in pending.damage){
      const ship = SHIPS.find(s => s.id === tid);
      if(!ship) continue;
      applyDamage(ship, pending.damage[tid], applyEvents);
    }
    for(const tid of pending.disabled){
      const ship = SHIPS.find(s => s.id === tid);
      if(!ship || ship.sunk) continue;
      ship.disabled = true;
      logCombatLine(`${ship.name}: 即時帰還 (砲撃)`);
      applyEvents.push({ type:'disabled', ship: ship.id, name: ship.name });
    }
    await playEvents(applyEvents);
    placeAllShips();

    // 戦闘確認ボタン待ち（撃沈/帰還艦消去・ドック表示・ダイスクリア）
    setPhaseLabel('戦闘確認ボタンを押してください');
    await waitForCombatConfirm();

    // ラウンド終了ボタン待ち（撤退/追撃判定へ進む）
    setPhaseLabel('ラウンド終了ボタンで撤退/追撃判定へ');
    await waitForRoundEnd();
    endProtectedView();

    // 即時帰還した枢軸艦の行を戦闘モーダルから削除（後で帰還港UIで処理）
    for(const p of pendingAxisDisabledForUI){
      const row = document.getElementById(`cs-${p.shipId}`);
      if(row) row.remove();
    }

    // 片側が全滅（撃沈・帰還待ち）なら撤退/追撃判定は不要 → 次ループ冒頭で海戦終了
    const fightable = side => SHIPS.some(s => s.location === seaKey && !s.sunk && s.side === side && s.type !== 'UBOAT' && !s.returnPending);
    if(!fightable('allies') || !fightable('axis')){
      placeAllShips();
      continue;
    }

    // === 撤退判定（12.x）: 両軍とも相手の判断を知らないまま決め、そろってから同時に公開する ===
    const allyRetreat = await tryRetreat('allies', seaKey, { silent: true });
    const axisRetreat = await tryRetreat('axis', seaKey, { enemyRetreating: false, silent: true });
    const word = r => r ? `撤退（${r.length}グループ）` : '留まる';
    setPhaseLabel(`判断の公開 ─ 連合: ${word(allyRetreat)} ／ 枢軸: ${word(axisRetreat)}`);
    setAiDecisionLabel(`連合: ${word(allyRetreat)} ／ 枢軸: ${word(axisRetreat)}`);
    showRetreatGroupTags([...(allyRetreat || []), ...(axisRetreat || [])]);
    await new Promise(r => setTimeout(r, 1500));
    if(allyRetreat || axisRetreat){
      retreatedSeas.add(seaKey); // 12.4 POC獲得不可（双方撤退ならどちらも支配できない）
    }
    // 追撃できるのは、相手が撤退し、自分が止まったときだけ
    if(allyRetreat && !axisRetreat){
      // 枢軸（人間）は公開を見てから追撃するかを決める。AIの枢軸は tryPursuit 内で判断
      let pursue = true;
      if(humanSide === 'axis' && aiSide !== 'axis'){
        pursue = await chooseInPhaseLabel('枢軸: 連合が撤退します。追撃しますか？', [
          { label:'追撃する', value:true, bg:'#a55' },
          { label:'追撃しない', value:false, bg:'#446' }
        ]);
      }
      const pursuits = pursue ? await tryPursuit('axis', seaKey, allyRetreat) : null;
      if(pursuits){
        for(const p of pursuits){
          await runPursuitRound(p.pursuers, p.retreaters);
        }
      }
    }
    if(axisRetreat && !allyRetreat){
      const pursuits = await tryPursuit('allies', seaKey, axisRetreat);
      if(pursuits){
        for(const p of pursuits){
          await runPursuitRound(p.pursuers, p.retreaters);
        }
      }
    }
    for(const group of [...(allyRetreat || []), ...(axisRetreat || [])]){
      await retreatToPort(group);
    }
    clearRetreatGroups(); // 撤退・追撃が終わったら、グループの印を消す
    placeAllShips();
    // 11.4 両軍存続なら次ラウンド（次ループ冒頭の判定で終了オーバーレイ表示）
  }
}

// 追跡戦闘: 追跡側が諦めるか、片側が壊滅するか、速度不足になるまで継続
// ===== 目標の宣言（水上戦闘・追撃）=====
// 宣言の段階では結果が分からないので、連合AIは「見込みの損害」を足して、同じ艦に撃ちすぎないようにする
function newDeclPending(){ return { damage: {}, disabled: new Set(), firedAtBy: { allies: new Set(), axis: new Set() } }; }
function expectedHitDamage(ship){
  const p = (ship.country === 'DE' && ship.damage === 0) ? 2/6 : 1/6; // 無傷のドイツ艦は出目+1
  return (ship.atk || 0) * p * 3.5;
}
// 14.8 船団保護: 船団以外の味方の艦が全部損害を受けている（または残っていない）陣営の船団だけ、このラウンドから狙える
let convoyOpenSides = { allies: false, axis: false };
function updateConvoyOpen(seaKey){
  for(const side of ['allies', 'axis']){
    const others = SHIPS.filter(s => s.location === seaKey && s.side === side && !s.sunk && !s.returnPending && s.type !== 'UBOAT' && s.type !== 'CONVOY');
    convoyOpenSides[side] = others.every(s => s.damage > 0);
  }
}
// 保護されている艦の表示（水上戦闘の目標の宣言のあいだ）
//   船団: 船団以外の味方が全部損害を受けた次のラウンドまで保護（updateConvoyOpen）
//   空母（攻撃を宣言していない）: 通常の艦（と狙える船団）が全部目標に宣言されるまで保護
const protView = { sea: null, firedAt: { allies: new Set(), axis: new Set() } };
function startProtectedView(seaKey){
  protView.sea = seaKey;
  protView.firedAt = { allies: new Set(), axis: new Set() };
  updateProtectedRows();
}
function endProtectedView(){
  protView.sea = null;
  document.querySelectorAll('#combatModal .cs-row.protected').forEach(r => r.classList.remove('protected'));
}
function updateProtectedRows(){
  if(!protView.sea) return;
  for(const side of ['allies', 'axis']){
    const fired = protView.firedAt[side === 'allies' ? 'axis' : 'allies'];
    const ships = SHIPS.filter(s => s.location === protView.sea && !s.sunk && !s.returnPending && s.side === side && s.type !== 'UBOAT');
    const isCv = s => s.type === 'CV' && !s._cvDeclared;
    const normal = ships.filter(s => !isCv(s) && s.type !== 'CONVOY');
    const convoy = ships.filter(s => s.type === 'CONVOY');
    const open = convoyOpenSides[side];
    const allN = normal.every(s => fired.has(s.id));
    const allC = !open || convoy.every(s => fired.has(s.id));
    ships.forEach(s => {
      const row = document.getElementById(`cs-${s.id}`);
      if(row) row.classList.toggle('protected', (s.type === 'CONVOY' && !open) || (isCv(s) && !(allN && allC)));
    });
  }
}
// 宣言を記録し、戦闘画面の射撃側の欄に「→目標」を表示する
function addDeclared(decl, ship, target, pendDecl){
  pendDecl.firedAtBy[ship.side].add(target.id);
  if(protView.sea){ protView.firedAt[ship.side].add(target.id); updateProtectedRows(); }
  if(ship.side === aiSide) pendDecl.damage[target.id] = (pendDecl.damage[target.id] || 0) + expectedHitDamage(ship);
  decl.push({ ship, target });
  const el = document.getElementById(`cs-dc-${ship.id}`);
  if(el) el.innerHTML = `<span style="color:#aac;margin-right:4px;">→${target.name}</span>`;
}
// 水上戦闘の1陣営分の宣言。撃たれると宣言された空母（攻撃力1以上）は、判定の前に撃ち返す目標も宣言する
async function declareSurfaceTargets(shooters, enemySide, seaKey, decl, pendDecl){
  const canFire = ship => !(ship.type === 'CV' && !ship._cvDeclared) && ship.atk !== 0; // 空母は、攻撃を宣言したときだけ撃つ
  // 連合AI: 敵の全艦に割り振る計画を先に作る
  const firing = shooters.filter(canFire);
  const aiPlan = (firing.length && firing[0].side === 'allies' && aiSide === 'allies')
    ? planAlliedFire(firing, SHIPS.filter(s => s.location === seaKey && !s.sunk && !s.returnPending && s.side === enemySide && s.type !== 'UBOAT' && !s.disabledThisTurn))
    : null;
  for(const ship of shooters){
    if(!canFire(ship)) continue;
    highlightShip(ship.id, 'firing');
    const dispName = ship.sunk ? `${ship.name}[撃沈中]` : (ship.disabled ? `${ship.name}[即時帰還]` : ship.name);
    setPhaseLabel(`${dispName}(${ship.atk}発): 目標をクリック`);
    const target = aiPlan ? (aiPlan.get(ship.id) || null) : await waitForSurfaceTarget(enemySide, seaKey, ship, pendDecl[ship.side]);
    if(aiPlan) await new Promise(r => setTimeout(r, 150));
    unhighlightShip(ship.id, 'firing');
    if(!target) break;
    addDeclared(decl, ship, target, pendDecl[ship.side]);
    // CV 即時反撃（攻撃を宣言した空母は通常の艦の扱いなので反撃しない）
    if(target.type === 'CV' && !target._cvDeclared && target.atk >= 1 && !target.sunk && !target.disabled){
      highlightShip(target.id, 'firing');
      setPhaseLabel(`${target.name}(${target.atk}発) 即時反撃: 目標をクリック`);
      const counterTarget = await waitForSurfaceTarget(ship.side, seaKey, target, pendDecl[target.side]);
      unhighlightShip(target.id, 'firing');
      if(counterTarget) addDeclared(decl, target, counterTarget, pendDecl[target.side]);
    }
  }
}
// 空母の攻撃の宣言。人間側は選ぶ、AI側は保護と即時反撃を残すため自分からは攻撃しない
async function declareCarrierAttacks(seaKey){
  const cvs = SHIPS.filter(s => s.location === seaKey && !s.sunk && !s.returnPending && s.type === 'CV' && s.atk >= 1 && !s.disabled);
  for(const cv of cvs){
    if(cv.side === aiSide) continue;
    highlightShip(cv.id, 'firing');
    const go = await chooseInPhaseLabel(`${cv.name}: 攻撃しますか？（攻撃すると、この戦闘のあいだ通常の艦と同じ扱い。取り消せません）`, [
      { label:'攻撃しない', value:false, bg:'#446' },
      { label:'攻撃する', value:true, bg:'#a55' }
    ]);
    unhighlightShip(cv.id, 'firing');
    if(go) cv._cvDeclared = true;
  }
}
// 宣言どおりにダイスを振る（損害は pending に保留し、あとで同時に適用）
async function resolveDeclaredFire(decl, pending){
  for(const d of decl){
    highlightShip(d.ship.id, 'firing');
    const fireEvents = [];
    surfaceFireOne(d.ship, d.target, fireEvents, pending);
    await playEvents(fireEvents);
    unhighlightShip(d.ship.id, 'firing');
  }
}

async function runPursuitRound(pursuit, retreat){
  const sea = pursuit.length ? (pursuit[0].location || retreat[0]?.location || '') : (retreat[0]?.location || '');
  // 撤退側のグループ（どのグループへの追撃かを表示に入れる）
  const grps = [...new Set(retreat.map(s => s.group).filter(Boolean))].sort();
  const grpTxt = grps.length ? ` グループ${grps.join('・')}` : '';
  await flashCombatOverlay(`━ ${SEA_LABEL[sea]||sea} 追撃戦${grpTxt} ━`, 1500);
  startCombatLogEntry(SEA_LABEL[sea]||sea, `追撃戦闘${grpTxt}`);
  logCombatLine(`追跡側: ${pursuit.map(s=>s.name).join(', ') || '―'}`);
  logCombatLine(`撤退側: ${retreat.map(s=>s.name).join(', ') || '―'}`);
  // 撃沈艦の cs-row を一掃するヘルパー
  const sweepSunk = () => {
    SHIPS.forEach(s => {
      if(s.sunk){
        const row = document.getElementById(`cs-${s.id}`);
        if(row) row.remove();
      }
    });
  };
  try {
  sweepSunk(); // 開始時の掃除
  while(true){
    const alivePur = pursuit.filter(s => !s.sunk && !s.returnPending);
    const aliveRet = retreat.filter(s => !s.sunk && !s.returnPending);
    if(!alivePur.length || !aliveRet.length){
      setPhaseLabel('片側壊滅 → 追跡終了');
      break;
    }
    // 速度判定（撤退側最遅速力以上の追跡艦のみ追える）
    const minRetSpd = Math.min(...aliveRet.map(s => s.spd));
    const eligible = alivePur.filter(s => s.spd >= minRetSpd);
    if(!eligible.length){
      setPhaseLabel('追跡速度不足 → 追跡終了');
      await new Promise(r=>setTimeout(r,800));
      break;
    }
    setPhaseLabel('━ 追跡ラウンド ━');
    const pending = { damage: {}, disabled: new Set(), firedAtBy: { allies: new Set(), axis: new Set() } };
    // 目標の宣言（追う側 → 撤退する側。結果を見てからは変えられない）
    const decl = [];
    const pendPur = newDeclPending(), pendRet = newDeclPending();
    setPhaseLabel('追跡側 目標の宣言');
    const aiPlanOf = (shooters, targets) => (shooters.length && shooters[0].side === 'allies' && aiSide === 'allies')
      ? planAlliedFire(shooters.filter(x => x.atk !== 0), targets) : null;
    const planPur = aiPlanOf(eligible, aliveRet), planRet = aiPlanOf(aliveRet, eligible);
    for(const ship of eligible){
      if(ship.atk === 0) continue;
      highlightShip(ship.id, 'firing');
      setPhaseLabel(`${ship.name}(${ship.atk}発): 撤退艦から目標`);
      const target = planPur ? (planPur.get(ship.id) || null) : await waitForTargetClickFromList(aliveRet, ship, pendPur);
      unhighlightShip(ship.id, 'firing');
      if(!target) break;
      addDeclared(decl, ship, target, pendPur);
    }
    setPhaseLabel('撤退側 目標の宣言');
    for(const ship of aliveRet){
      if(ship.atk === 0) continue;
      highlightShip(ship.id, 'firing');
      setPhaseLabel(`${ship.name}(${ship.atk}発): 追跡艦から目標`);
      const target = planRet ? (planRet.get(ship.id) || null) : await waitForTargetClickFromList(eligible, ship, pendRet);
      unhighlightShip(ship.id, 'firing');
      if(!target) break;
      addDeclared(decl, ship, target, pendRet);
    }
    if(decl.length && humanSide === 'axis'){
      setPhaseLabel('攻撃ボタンを押してください');
      await waitForAirAttackBtn();
    }
    await resolveDeclaredFire(decl, pending);
    // 損害適用
    setPhaseLabel('━ 損害適用 ━');
    const applyEvents = [];
    for(const tid in pending.damage){
      const ship = SHIPS.find(s => s.id === tid);
      if(ship) applyDamage(ship, pending.damage[tid], applyEvents);
    }
    for(const tid of pending.disabled){
      const ship = SHIPS.find(s => s.id === tid);
      if(ship && !ship.sunk){
        ship.disabled = true;
        logCombatLine(`${ship.name}: 即時帰還 (追撃砲撃)`);
        applyEvents.push({ type:'disabled', ship: ship.id, name: ship.name });
      }
    }
    await playEvents(applyEvents);
    placeAllShips();
    // 結果を確認してから片づける（撃沈・帰還艦の行とダイスの表示を消す）
    setPhaseLabel('戦闘確認ボタンを押してください');
    await waitForCombatConfirm();

    // 12.5 追跡継続確認
    const stillPur = pursuit.filter(s => !s.sunk && !s.returnPending);
    const stillRet = retreat.filter(s => !s.sunk && !s.returnPending);
    if(!stillPur.length || !stillRet.length){ break; }
    const newMin = Math.min(...stillRet.map(s => s.spd));
    if(!stillPur.some(s => s.spd >= newMin)){
      setPhaseLabel('速度不足 → 追跡終了');
      await new Promise(r=>setTimeout(r,800));
      break;
    }
    // 追跡側が AI なら自動継続、人間側のみ確認
    const pursuerSide = pursuit[0]?.side;
    const cont = (pursuerSide === aiSide) ? true : await chooseInPhaseLabel('追跡を続けますか？', [
      { label:'追撃を続ける', value:true, bg:'#a55' },
      { label:'追撃をやめる（母港へ帰還）', value:false, bg:'#666' }
    ]);
    if(!cont){
      // 追撃中止 → 追跡側艦は帰還待ち（帰還フェイズで帰還）
      for(const ship of stillPur){
        if(ship.sunk || ship.removed) continue;
        markReturnPending(ship);
        logCombatLine(`${ship.name}: 追撃中止 → 帰還待ち`);
      }
      break;
    }
  }
  } finally {
    await flashCombatOverlay('━ 追撃戦 終了 ━', 1200);
    endCombatLogEntry();
  }
}

// 追跡対象（撤退艦）から選択
// 連合AIの目標選択: Bismarck・Tirpitz は後回し → 速力の高い艦から → 同速なら撃沈に近い艦から
//   順位が決まっているので、撃沈が確実になる（pending の損害で耐久超え）まで同じ艦に集中する
// 連合AIの目標の選び方（水上戦闘ごとにパターンを決める。戦闘の外では「今まで通り」）
//   normal: Bismarck・Tirpitz を後回しにして、速い艦、同じなら残りの耐久が少ない艦
//   big   : 攻撃力と防御力の合計が一番大きい艦に集中（沈むと見込まれたら次の艦へ）
//   spread: このラウンドでまだ誰も狙っていない艦からくじ。全部狙ったら損害の少ない艦からくじ
let alliedTargetMode = 'normal';
const alliedTargetModeLog = []; // { turn, sea, mode, ratio }（観戦ページ・レポート用）
const ALLIED_TARGET_WEIGHTS = {
  strong: { big: 50, normal: 30, spread: 20 }, // 連合が1.5倍以上
  even:   { big: 20, normal: 50, spread: 30 },
  weak:   { big: 10, normal: 40, spread: 50 }  // 連合が下回る
};
// 戦闘の始まりに、戦力の比べでくじの割合を変えてパターンを決める
function chooseAlliedTargetMode(seaKey){
  const ships = SHIPS.filter(s => s.location === seaKey && !s.sunk && !s.returnPending && s.type !== 'UBOAT');
  const e = battleEval(ships.filter(s => s.side === 'allies'), ships.filter(s => s.side === 'axis'));
  const ratio = e.theirs > 0 ? e.ours / e.theirs : Infinity;
  const w = ALLIED_TARGET_WEIGHTS[ratio >= 1.5 ? 'strong' : ratio >= 1 ? 'even' : 'weak'];
  let r = Math.random() * (w.big + w.normal + w.spread);
  alliedTargetMode = (r -= w.big) < 0 ? 'big' : (r -= w.normal) < 0 ? 'normal' : 'spread';
  alliedTargetModeLog.push({ turn: currentTurn, sea: seaKey, mode: alliedTargetMode, ratio: Math.round(ratio * 10) / 10 });
}
// 連合AIの水上戦闘の割り振り: 敵の全艦に少なくとも1隻ずつ割り振る（5の目で帰還させる機会を増やす）
//   割り振り方は戦闘ごとのくじ
//     pair   : strong=強い敵に強い艦をあてる / weak=弱い敵から順に強い艦をあてる
//     surplus: 余った艦を strong=強い敵へ / weak=弱い敵へ
//   空母（攻撃を宣言していない）と船団は保護があるので、通常の艦に全部割り振ったあと
let alliedFireStyle = { pair: 'strong', surplus: 'strong' };
function chooseAlliedFireStyle(seaKey){
  alliedFireStyle = { pair: Math.random() < 0.5 ? 'strong' : 'weak', surplus: Math.random() < 0.5 ? 'strong' : 'weak' };
  alliedTargetModeLog.push({ turn: currentTurn, sea: seaKey, mode: `${alliedFireStyle.pair}/${alliedFireStyle.surplus}`, ratio: null });
}
// 射撃する艦ごとの目標を先に決める（射撃艦ID → 目標の艦）
function planAlliedFire(shooters, enemies){
  const val = s => (s.atkOrig || s.atk || 0) + (s.def || 0);
  const normals = enemies.filter(s => (s.type !== 'CV' || s._cvDeclared) && s.type !== 'CONVOY').sort((a, b) => val(b) - val(a));
  const side = enemies.length ? enemies[0].side : null;
  const later = [...(convoyOpenSides[side] ? enemies.filter(s => s.type === 'CONVOY') : []), ...enemies.filter(s => s.type === 'CV' && !s._cvDeclared)];
  const sh = shooters.slice().sort((a, b) => (b.atk || 0) - (a.atk || 0));
  const cover = [...(alliedFireStyle.pair === 'strong' ? normals : normals.slice().reverse()), ...later];
  const surplusOrder = [...(alliedFireStyle.surplus === 'strong' ? normals : normals.slice().reverse()), ...later];
  const plan = new Map();
  sh.forEach((ship, i) => {
    if(i < cover.length) plan.set(ship.id, cover[i]);
    else if(surplusOrder.length) plan.set(ship.id, surplusOrder[(i - cover.length) % surplusOrder.length]);
  });
  return plan;
}
function alliedPickTarget(cands, pending){
  if(!cands.length) return null;
  const pd = s => (pending && pending.damage && pending.damage[s.id]) || 0;
  const left = s => (s.def || 0) - (s.damage || 0) - pd(s);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  if(alliedTargetMode === 'big'){
    const val = s => (s.atkOrig || s.atk || 0) + (s.def || 0);
    return cands.slice().sort((a, b) => (val(b) - val(a)) || (left(a) - left(b)))[0];
  }
  if(alliedTargetMode === 'spread'){
    const fired = (pending && pending.firedAtBy && pending.firedAtBy.allies) || new Set();
    const fresh = cands.filter(s => !fired.has(s.id));
    if(fresh.length) return pick(fresh);
    const minDmg = Math.min(...cands.map(s => (s.damage || 0) + pd(s)));
    return pick(cands.filter(s => (s.damage || 0) + pd(s) === minDmg));
  }
  const isBT = s => s.name === 'Bismarck' || s.name === 'Tirpitz';
  let pool = cands.filter(s => !isBT(s));
  if(!pool.length) pool = cands;
  return pool.slice().sort((a, b) => ((b.spd || 0) - (a.spd || 0)) || (left(a) - left(b)))[0] || null;
}

function waitForTargetClickFromList(targetList, attacker, pending){
  return new Promise(resolve => {
    const candidates = targetList.filter(s => !s.sunk && !s.returnPending);
    if(!candidates.length){ resolve(null); return; }
    // AI側の射撃のみ自動選択。人間側はクリック待ち
    const isAiAttacker = attacker && attacker.side === aiSide;
    if(isAiAttacker && attacker.side === 'allies'){
      // 連合AI: pending の損害で撃沈確定の艦は除外して選ぶ（全艦確定なら先頭）
      const willBeSunk = s => pending && ((s.damage + (pending.damage[s.id] || 0)) > s.def);
      const alive = candidates.filter(s => !willBeSunk(s));
      resolve(alliedPickTarget(alive.length ? alive : candidates, pending)); return;
    }
    if(isAiAttacker){ resolve(candidates[0]); return; }
    const handlers = {};
    candidates.forEach(s => {
      const row = ensureCombatRow(s);
      if(!row) return;
      row.classList.add('selectable');
      const onClick = () => {
        candidates.forEach(c => {
          const r = document.getElementById(`cs-${c.id}`);
          if(r){ r.classList.remove('selectable'); if(handlers[c.id]) r.removeEventListener('click', handlers[c.id]); }
        });
        resolve(s);
      };
      handlers[s.id] = onClick;
      row.addEventListener('click', onClick);
    });
  });
}

function decideRetreatPort(ship){
  // ドイツ艦: 損害艦は France3/Germany8、超過は均等。無傷は Germany
  if(ship.country === 'DE'){
    if(ship.damage === 0) return 'Germany';
    const inFrance = SHIPS.filter(s => s.country === 'DE' && s.location === 'France').length;
    const inGermany = SHIPS.filter(s => s.country === 'DE' && s.location === 'Germany').length;
    if(inFrance < 3) return 'France';
    if(inGermany < 8) return 'Germany';
    return inFrance <= inGermany ? 'France' : 'Germany';
  }
  // UK 艦: homePort=Malta なら基本 Malta、降伏後は Malta = 4 + DE接収伊艦数
  if(ship.country === 'UK'){
    if(ship.homePort === 'Malta'){
      if(italySurrendered){
        const deItalyCount = SHIPS.filter(s => s.country === 'IT' && s.controlledBy === 'DE').length;
        const cap = 4 + deItalyCount;
        const inMalta = SHIPS.filter(s => s.country === 'UK' && s.location === 'Malta').length;
        if(inMalta < cap) return 'Malta';
        return 'England';
      }
      return 'Malta';
    }
    return 'England';
  }
  // それ以外: homePort
  return ship.homePort;
}

// 水上戦闘の目標選択 (11.6 空母保護, 14.8 船団保護)
function waitForSurfaceTarget(side, focusSea, attacker, pending){
  return new Promise(resolve => {
    const isAiAttacker = attacker && attacker.side === aiSide;
    // pending damageで撃沈確定の艦を除外
    const willBeSunk = (s) => {
      if(!pending) return false;
      const pd = pending.damage[s.id] || 0;
      return (s.damage + pd) > s.def;
    };
    const enemies = SHIPS.filter(s =>
      s.side === side && !s.sunk && s.location === focusSea && s.type !== 'UBOAT' && !s.disabledThisTurn && !s.removed && !willBeSunk(s)
    );
    // 通常艦（CV/CONVOYでない）
    // 攻撃を宣言した空母は、このラウンドは通常の艦と同じ扱い
    const normal = enemies.filter(s => (s.type !== 'CV' || s._cvDeclared) && s.type !== 'CONVOY');
    const cv = enemies.filter(s => s.type === 'CV' && !s._cvDeclared);
    // 14.8 船団保護: 船団以外の味方が全部損害を受けた次のラウンドから狙える（ラウンドの始まりに判定）
    const convoy = convoyOpenSides[side] ? enemies.filter(s => s.type === 'CONVOY') : [];
    // 11.6 空母保護: 同ラウンドで攻撃側が通常の艦（と狙える船団）を全部砲撃対象にしたら空母も対象
    const attackerSide = attacker?.side || (side === 'allies' ? 'axis' : 'allies');
    const firedAt = (pending && pending.firedAtBy && pending.firedAtBy[attackerSide]) || new Set();
    const allNormalFired = normal.length === 0 || normal.every(s => firedAt.has(s.id));
    const allConvoyFired = convoy.length === 0 || convoy.every(s => firedAt.has(s.id));
    const candidates = [...normal, ...convoy];
    if(allNormalFired && allConvoyFired) candidates.push(...cv);
    if(!candidates.length){ resolve(null); return; }
    // デバックログ
    console.log('[waitForSurfaceTarget]', {
      side, focusSea, attacker: attacker?.name,
      enemiesCount: enemies.length, enemiesIds: enemies.map(s=>s.id+'('+s.type+')'),
      normalCount: normal.length, cvCount: cv.length, convoyCount: convoy.length,
      allNormalFired, allConvoyFired, candidatesCount: candidates.length, candidatesIds: candidates.map(s=>s.id+'('+s.type+')'),
      missingRows: candidates.filter(s => !document.getElementById(`cs-${s.id}`)).map(s=>s.id)
    });
    if(isAiAttacker && attacker.side === 'allies'){ resolve(alliedPickTarget(candidates, pending)); return; }
    if(isAiAttacker){
      const firedAt = (pending && pending.firedAtBy && pending.firedAtBy[attackerSide]) || new Set();
      const unfired = candidates.filter(c => !firedAt.has(c.id));
      if(unfired.length){
        const undamaged = unfired.filter(c => c.damage === 0);
        resolve(undamaged.length ? undamaged[0] : unfired[0]); return;
      }
      // 全艦攻撃済 → 無傷艦から
      const undamaged = candidates.filter(c => c.damage === 0);
      resolve(undamaged.length ? undamaged[0] : candidates[0]); return;
    }
    const handlers = {};
    candidates.forEach(s => {
      const row = ensureCombatRow(s);
      if(!row) return;
      row.classList.add('selectable');
      const onClick = () => {
        candidates.forEach(c => {
          const r = document.getElementById(`cs-${c.id}`);
          if(r){ r.classList.remove('selectable'); if(handlers[c.id]) r.removeEventListener('click', handlers[c.id]); }
        });
        resolve(s);
      };
      handlers[s.id] = onClick;
      row.addEventListener('click', onClick);
    });
  });
}

async function openCombatModal(focusSea, initialEvents, opts){
  opts = opts || {};
  const excludeUboat = !!opts.excludeUboat;
  const aswOnly = !!opts.aswOnly;
  const modal = document.getElementById('combatModal');
  modal.classList.add('show');
  // 戦闘中は閉じるボタンを隠す（全戦闘終了時に再表示）
  document.getElementById('combatCloseBtn').style.display = 'none';
  setAiDecisionLabel('');
  // 参加艦: 海域内の生存艦のみ（撃沈艦は表示しない）
  const ids = new Set();
  (initialEvents || []).forEach(e => {
    const checkId = (id) => {
      if(!id) return;
      const s = SHIPS.find(x => x.id === id);
      if(!s || s.sunk) return;
      ids.add(id);
    };
    checkId(e.attacker);
    checkId(e.target);
    checkId(e.ship);
  });
  if(focusSea){
    SHIPS.forEach(s => {
      if(s.location !== focusSea) return;
      if(s.sunk) return;
      if(s.returnPending) return; // 帰還待ちは戦闘に不参加
      if(excludeUboat && s.type === 'UBOAT') return;
      // ASW表示: 枢軸はUボートのみ（イタリア艦等の水上艦を除外）
      if(aswOnly && s.side === 'axis' && s.type !== 'UBOAT') return;
      ids.add(s.id);
    });
  }
  const inv = SHIPS.filter(s => ids.has(s.id) && !s.sunk);
  const allies = inv.filter(s => s.side === 'allies');
  const axis   = inv.filter(s => s.side === 'axis');

  setPhaseLabel('━ 開始 ━');

// 帰還可能港の取得（艦の現在の海域に隣接する友軍/中立で使用可能な港）
function getReturnPorts(ship){
  const sea = ship.location;
  if(!SEAS[sea]) return [];
  // 南大西洋のドイツ艦特例: 強制帰還(ダイス5)=中立のみ、それ以外は損害に関係なく France(使用可能時)・中立から選択
  if(sea === 'SouthAtlantic' && ship.country === 'DE'){
    if(ship.forcedReturn) return ['Neutral'];
    const franceUsable = PORTS.France.available.includes(currentTurn);
    return franceUsable ? ['France', 'Neutral'] : ['Neutral'];
  }
  // 地中海で強制帰還(ダイス5)を受けた連合艦は必ずマルタ
  if(sea === 'Mediterranean' && ship.side === 'allies' && ship.forcedReturn){
    return PORTS.Malta.available.includes(currentTurn) ? ['Malta'] : [];
  }
  let adjacent = Object.keys(PORT_SEAS).filter(p => PORT_SEAS[p].includes(sea));
  // 地図ルール特例
  // NorthAtlantic のドイツ艦は Germany・France 帰還可（特別ルール）
  if(sea === 'NorthAtlantic' && ship.country === 'DE'){
    if(!adjacent.includes('Germany')) adjacent.push('Germany');
    if(!adjacent.includes('France')) adjacent.push('France');
  }
  // Mediterranean の英国艦は England 帰還可（マルタの艦はマルタで完結するので除く）
  if(sea === 'Mediterranean' && ship.country === 'UK' && ship.homePort !== 'Malta'){
    if(!adjacent.includes('England')) adjacent.push('England');
  }
  return adjacent.filter(p => {
    const port = PORTS[p];
    if(!port.available.includes(currentTurn)) return false;
    if(port.side !== 'neutral' && port.side !== ship.side) return false;
    if(port.side === 'neutral' && ship.country === 'UK') return false; // UK艦は中立港使用不可
    if(p === 'Russia' && ship.country !== 'UK' && ship.country !== 'RU') return false; // ロシアへ帰還できるのは英国艦（ターン3〜8）とソ連艦
    return true;
  });
}

// 枢軸艦帰還UI: 縦に艦一覧、各行に到達可能港ボタン＋洋上補給ボタン＋やり直し
// options.autoDefault: 戦闘フェイズ即時帰還時のみ true（DE/IT 自動コミット＋港にいる艦フィルタ）
async function showAxisReturnUI(allShips, options){
  options = options || {};
  const autoDefault = !!options.autoDefault;
  const ships = autoDefault
    ? allShips.filter(s => s.location && SEAS[s.location]) // 戦闘時のみ港艦フィルタ
    : allShips; // 帰還フェイズは渡された全艦をそのまま表示
  if(!ships.length) return;
  return new Promise(resolve => {
    const modal = document.getElementById('axisReturnModal');
    const tbody = document.getElementById('axisReturnBody');
    // 元状態を保存（やり直し用）
    const orig = ships.map(s => ({
      shipId: s.id,
      location: s.location,
      atDock: s.atDock,
      arrivedNeutralTurn: s.arrivedNeutralTurn,
      refuelTurn: s.refuelTurn
    }));
    let remaining = ships.length;
    const decided = new Set(); // 既に選択した艦ID
    tbody.innerHTML = '';
    // 帰還フェイズ: 帰還ボタンで確定（全艦選択済みのときのみ押せる）。戦闘時は従来どおり自動で閉じる
    const okBtn = document.getElementById('axisReturnOkBtn');
    okBtn.style.display = autoDefault ? 'none' : '';
    const updateOkBtn = () => {
      okBtn.disabled = remaining > 0;
      okBtn.style.opacity = okBtn.disabled ? '0.4' : '1';
    };
    okBtn.onclick = () => {
      if(remaining > 0) return;
      modal.classList.remove('show');
      resolve();
    };

    function buildRow(ship){
      const o = orig.find(x => x.shipId === ship.id);
      const ports = getReturnPorts(ship);
      const tr = document.createElement('tr');
      tr.id = `axret-${ship.id}`;

      const tdName = document.createElement('td');
      const dmgText = ship.damage > 0 ? ` <span style="color:#fa8;">[損害${ship.damage}/${ship.def}]</span>` : '';
      tdName.innerHTML = ship.name + dmgText;
      tr.appendChild(tdName);

      const tdLoc = document.createElement('td');
      tdLoc.textContent = SEA_LABEL[o.location] || o.location;
      tr.appendChild(tdLoc);

      const tdBtn = document.createElement('td');

      const showResult = (resultHtml) => {
        tdBtn.innerHTML = '';
        const span = document.createElement('span');
        span.className = 'ret-result';
        span.innerHTML = resultHtml;
        tdBtn.appendChild(span);
        const redoBtn = document.createElement('button');
        redoBtn.className = 'ret-btn';
        redoBtn.textContent = 'やり直し';
        redoBtn.style.background = '#844';
        redoBtn.style.marginLeft = '8px';
        redoBtn.onclick = () => {
          // 状態を元に戻す
          ship.location = o.location;
          ship.atDock = o.atDock;
          ship.arrivedNeutralTurn = o.arrivedNeutralTurn;
          ship.refuelTurn = o.refuelTurn;
          decided.delete(ship.id);
          remaining++;
          updateOkBtn();
          placeAllShips();
          // 行を再構築
          const newTr = buildRow(ship);
          tr.parentNode.replaceChild(newTr, tr);
        };
        tdBtn.appendChild(redoBtn);
      };

      const commit = (resultHtml) => {
        if(!decided.has(ship.id)){
          decided.add(ship.id);
          remaining--;
        }
        showResult(resultHtml);
        placeAllShips();
        updateOkBtn();
        if(remaining === 0 && autoDefault){
          setTimeout(() => { modal.classList.remove('show'); resolve(); }, 600);
        }
      };

      ports.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'ret-btn';
        btn.textContent = PORT_LABEL[p] || p;
        btn.onclick = () => {
          ship.location = p;
          ship.atDock = false;
          if(p === 'Neutral') ship.arrivedNeutralTurn = currentTurn;
          commit(`→ ${PORT_LABEL[p]||p}`);
        };
        tdBtn.appendChild(btn);
      });

      const refuelBtn = document.createElement('button');
      refuelBtn.className = 'ret-btn refuel';
      refuelBtn.textContent = '洋上補給';
      const isRefuelable = (
        !ship.forcedReturn &&
        ship.country === 'DE' &&
        currentTurn <= 3 &&
        (o.location === 'NorthAtlantic' || o.location === 'SouthAtlantic')
      );
      if(!isRefuelable){
        refuelBtn.disabled = true;
      } else {
        refuelBtn.onclick = () => {
          const maxRoll = 6 - currentTurn;
          const r = rollD6();
          if(r <= maxRoll){
            ship.refuelTurn = currentTurn;
            ship.atDock = false;
            commit(`補給⚂${r}≤${maxRoll} 成功 → 海上残留`);
          } else {
            ship.location = 'Neutral';
            ship.arrivedNeutralTurn = currentTurn;
            ship.atDock = false;
            commit(`補給⚂${r}>${maxRoll} 失敗 → 中立港`);
          }
        };
      }
      tdBtn.appendChild(refuelBtn);

      tr.appendChild(tdBtn);
      return tr;
    }

    for(const ship of ships){
      const tr = buildRow(ship);
      tbody.appendChild(tr);
      // デフォルト選択: 戦闘フェイズ即時帰還時は DE → Germany, IT → Italy / 帰還フェイズは元いた港
      const defaultPort = autoDefault
        ? (ship.country === 'DE' ? 'Germany' : (ship.country === 'IT' ? 'Italy' : null))
        : (ship.forcedReturn && getReturnPorts(ship).length === 1 ? getReturnPorts(ship)[0] : (ship.originThisTurn || null));
      if(defaultPort){
        const ports = getReturnPorts(ship);
        if(ports.includes(defaultPort)){
          ship.location = defaultPort;
          ship.atDock = false;
          decided.add(ship.id);
          remaining--;
          // 既存行を再構築（やり直し付きの結果表示状態にする）
          const newTr = buildRow(ship);
          // 元状態は orig に保持済み、newTr は orig.location を使うので OK
          tr.parentNode.replaceChild(newTr, tr);
          // 結果表示に差し替え
          const tdBtnNew = newTr.querySelector('td:last-child');
          if(tdBtnNew){
            tdBtnNew.innerHTML = '';
            const span = document.createElement('span');
            span.className = 'ret-result';
            span.innerHTML = `→ ${PORT_LABEL[defaultPort]}`;
            tdBtnNew.appendChild(span);
            const redoBtn = document.createElement('button');
            redoBtn.className = 'ret-btn';
            redoBtn.textContent = 'やり直し';
            redoBtn.style.background = '#844';
            redoBtn.style.marginLeft = '8px';
            redoBtn.onclick = () => {
              const o = orig.find(x => x.shipId === ship.id);
              ship.location = o.location;
              ship.atDock = o.atDock;
              ship.arrivedNeutralTurn = o.arrivedNeutralTurn;
              ship.refuelTurn = o.refuelTurn;
              decided.delete(ship.id);
              remaining++;
              updateOkBtn();
              placeAllShips();
              const rebuiltTr = buildRow(ship);
              newTr.parentNode.replaceChild(rebuiltTr, newTr);
            };
            tdBtnNew.appendChild(redoBtn);
          }
        }
      }
    }
    placeAllShips();
    updateOkBtn();
    if(remaining === 0 && autoDefault){
      setTimeout(() => { modal.classList.remove('show'); resolve(); }, 600);
      return;
    }

    modal.classList.add('show');
  });
}

// 撤退判定（連合/枢軸別、ラウンド終了時）
// decision: 人間側の選択結果を受け取る（enemyRetreating=相手が撤退中 → 追撃を選択肢に追加、pursue=追撃を選んだか）
async function tryRetreat(side, seaKey, decision){
  const candidates = SHIPS.filter(s => s.location === seaKey && !s.sunk && s.side === side && s.type !== 'UBOAT' && !s.returnPending);
  if(!candidates.length) return null;
  const sideName = side === 'allies' ? '連合' : '枢軸';
  // AI 側は自動判断
  if(side === aiSide){
    const silent = decision && decision.silent; // 同時公開: 相手が決めるまで判断を見せない
    if(!aiShouldRetreat(candidates, seaKey)){
      if(silent) return null;
      setPhaseLabel(`${sideName}: AI判断で残留`);
      setAiDecisionLabel(`${sideName}: 留まる`);
      await new Promise(r => setTimeout(r, 800));
      return null;
    }
    const groups = aiSplitGroups(candidates, seaKey);
    if(silent){
      groups.flat().forEach(s => { const g = document.querySelector(`#cs-${s.id} .cs-group`); if(g) g.remove(); });
      return groups;
    }
    setPhaseLabel(`${sideName}: AI判断で撤退（${groups.length}グループ）`);
    setAiDecisionLabel(`${sideName}: 撤退（${groups.length}グループ）`);
    await new Promise(r => setTimeout(r, 800));
    return groups;
  }
  const choices = [];
  if(decision && decision.enemyRetreating) choices.push({ label:'追撃する', value:'pursue', bg:'#a55' });
  choices.push({ label:'留まる', value:'stay', bg:'#446' });
  choices.push({ label:'撤退する', value:'retreat', bg:'#666' });
  const choice = await chooseInPhaseLabel(`${sideName}: 行動を選んでください`, choices);
  if(decision) decision.pursue = (choice === 'pursue');
  if(choice !== 'retreat') return null;
  const groups = await splitIntoGroups(candidates, sideName);
  return groups; // Array of Array of ships
}

function aiShouldRetreat(candidates, seaKey){
  // 戦闘可能艦のみ（atk>=1, CV等は除外）
  const myFighters = candidates.filter(s => s.atk >= 1);
  const enemy = SHIPS.filter(s => s.location === seaKey && !s.sunk && s.side === humanSide && s.type !== 'UBOAT' && !s.returnPending);
  const enemyFighters = enemy.filter(s => s.atk >= 1);
  // 攻撃力合計で比較（損害艦も atk が落ちているので現状値で計算）
  const myStrength = myFighters.reduce((sum, s) => sum + (s.atk || 0), 0);
  const enemyStrength = enemyFighters.reduce((sum, s) => sum + (s.atk || 0), 0);
  // 自軍攻撃力 < 敵攻撃力 なら撤退
  return myStrength < enemyStrength;
}

function aiSplitGroups(candidates, seaKey){
  const enemy = SHIPS.filter(s => s.location === seaKey && !s.sunk && s.side === humanSide && s.type !== 'UBOAT' && !s.returnPending);
  // 船団も撤退のグループに入れる（撤退に成功すれば帰還のフェイズで米国に戻り、やり直せる）
  const targets = candidates;
  // 速力ごとに別のグループ（速い順）。グループごとに、その速力以上の敵だけが追撃できる
  const speeds = [...new Set(targets.map(s => s.spd))].sort((a, b) => b - a);
  const result = speeds.map(v => targets.filter(s => s.spd === v)).filter(g => g.length > 0);
  // 各艦にグループタグを割り当て、cs-row上に表示反映
  result.forEach((grp, i) => {
    const tag = String.fromCharCode(65 + i); // A, B, C...
    grp.forEach(s => {
      s.group = tag;
      const row = document.getElementById(`cs-${s.id}`);
      if(row){
        let grpEl = row.querySelector('.cs-group');
        if(!grpEl){
          grpEl = document.createElement('span');
          grpEl.className = 'cs-group';
          grpEl.style.cssText = 'color:#fc4;font-weight:bold;margin-left:8px;';
          const nameEl = row.querySelector('.cs-name');
          if(nameEl) nameEl.appendChild(grpEl);
        }
        grpEl.textContent = tag;
      }
    });
  });
  return result;
}

function splitIntoGroups(ships, sideName){
  return new Promise(resolve => {
    let activeGroup = 'A';
    const assignments = {};
    const groupNames = ['A','B','C'];
    const phaseEl = document.getElementById('phaseLabel');
    const grpBtnsHtml = groupNames.map(g =>
      `<button class="grpBtn" data-grp="${g}" style="padding:4px 10px;margin-right:4px;">${g}</button>`
    ).join('');
    phaseEl.innerHTML = `${sideName}: タグを選び艦をクリックでグループ分け ${grpBtnsHtml} <button id="_grpOk" style="background:#2266cc;color:#fff;padding:4px 10px;margin-left:8px;">確定</button>`;
    const updateBtns = () => {
      phaseEl.querySelectorAll('button[data-grp]').forEach(b => {
        b.style.background = (b.dataset.grp === activeGroup) ? '#fc4' : '#446';
        b.style.color = (b.dataset.grp === activeGroup) ? '#000' : '#fff';
      });
    };
    updateBtns();
    phaseEl.querySelectorAll('button[data-grp]').forEach(b => {
      b.onclick = () => { activeGroup = b.dataset.grp; updateBtns(); };
    });
    const handlers = {};
    const updateRowSort = () => {
      const lists = ['alliesShipList','axisShipList'];
      lists.forEach(lid => {
        const list = document.getElementById(lid);
        if(!list) return;
        const rows = Array.from(list.children);
        rows.sort((a,b) => {
          const sa = SHIPS.find(x => `cs-${x.id}` === a.id);
          const sb = SHIPS.find(x => `cs-${x.id}` === b.id);
          const ga = (sa && sa.group) || 'Z';
          const gb = (sb && sb.group) || 'Z';
          return ga.localeCompare(gb);
        });
        rows.forEach(r => list.appendChild(r));
      });
    };
    ships.forEach(s => {
      const row = document.getElementById(`cs-${s.id}`);
      if(!row) return;
      row.classList.add('selectable');
      const onClick = () => {
        assignments[s.id] = activeGroup;
        s.group = activeGroup;
        let grpEl = row.querySelector('.cs-group');
        if(!grpEl){
          grpEl = document.createElement('span');
          grpEl.className = 'cs-group';
          grpEl.style.cssText = 'color:#fc4;font-weight:bold;margin-left:8px;';
          row.appendChild(grpEl);
        }
        grpEl.textContent = activeGroup;
        updateRowSort();
      };
      handlers[s.id] = onClick;
      row.addEventListener('click', onClick);
    });
    document.getElementById('_grpOk').onclick = () => {
      ships.forEach(s => {
        const row = document.getElementById(`cs-${s.id}`);
        if(row){
          row.classList.remove('selectable');
          if(handlers[s.id]) row.removeEventListener('click', handlers[s.id]);
        }
      });
      const groups = [];
      groupNames.forEach(g => {
        const grpShips = ships.filter(s => assignments[s.id] === g);
        if(grpShips.length) groups.push(grpShips);
      });
      const unassigned = ships.filter(s => !assignments[s.id]);
      if(unassigned.length) groups.push(unassigned);
      resolve(groups.length ? groups : [ships]);
    };
  });
}

// 追跡判定（グループ別対応）
async function tryPursuit(pursuerSide, seaKey, retreatGroups){
  if(!retreatGroups || !retreatGroups.length) return null;
  const sideName = pursuerSide === 'allies' ? '連合' : '枢軸';
  const isAi = pursuerSide === aiSide;
  const pursuits = [];

  if(isAi){
    // AI: 追う艦も速力で振り分ける
    //   追う艦は、自分が追いつける中で一番速い撤退グループへ（1隻は1グループだけ）
    //   海域の支配を確実にするため1隻は残す（5の強制帰還で全艦いなくなるのを防ぐ）。追撃に加われない艦
    //   （攻撃を宣言していない空母、どのグループにも追いつけない艦）がいればそれでよく、いなければ一番役に立たない艦を残す
    //   追撃する価値がないグループに割り当てた艦は、次に遅いグループへ回す
    const groups = retreatGroups.filter(g => g.length).map(g => ({ g, min: Math.min(...g.map(s => s.spd)), ships: [] }))
      .sort((a, b) => b.min - a.min);
    const here = SHIPS.filter(s => s.location === seaKey && !s.sunk && s.side === pursuerSide && s.type !== 'UBOAT' && !s.returnPending);
    const slowest = groups.length ? groups[groups.length - 1].min : Infinity;
    let pool = here.filter(s => (s.type !== 'CV' || s._cvDeclared) && s.spd >= slowest);
    const staysAnyway = here.some(s => !pool.includes(s));
    if(!staysAnyway && pool.length){
      // 一番役に立たない艦（攻撃力が低い、同じなら残りの耐久が少ない）を残す
      const keep = pool.slice().sort((a, b) => (a.atk || 0) - (b.atk || 0) || ((a.def - a.damage) - (b.def - b.damage)))[0];
      pool = pool.filter(s => s !== keep);
    }
    pool.sort((a, b) => b.spd - a.spd);
    if(pool.length){
      for(const ship of pool){
        const grp = groups.find(x => x.min <= ship.spd);
        if(grp) grp.ships.push(ship);
      }
      groups.forEach((grp, gi) => {
        if(!grp.ships.length) return;
        if(aiPursuitWorth(grp.ships, grp.g)){ pursuits.push({ pursuers: grp.ships, retreaters: grp.g }); return; }
        const next = groups[gi + 1]; // 次に遅いグループ（速力が遅いので追いつける）
        if(next) next.ships.push(...grp.ships);
      });
    }
    if(pursuits.length){
      setPhaseLabel(`${sideName}: AI判断で追撃（${pursuits.length}グループ）`);
      setAiDecisionLabel(`${sideName}: 追撃する（${pursuits.length}グループ）`, true);
    } else {
      setPhaseLabel(`${sideName}: AI判断で追撃せず`);
      setAiDecisionLabel(`${sideName}: 追撃しない`, true);
    }
    await new Promise(r => setTimeout(r, 800));
  } else {
    // 人間側: 全グループを一覧表示してまとめて選択
    const result = await selectPursuitAssignments(retreatGroups, seaKey, pursuerSide, sideName);
    if(result){
      for(const [gidx, ships] of Object.entries(result)){
        if(ships && ships.length){
          pursuits.push({ pursuers: ships, retreaters: retreatGroups[Number(gidx)] });
        }
      }
    }
  }

  return pursuits.length ? pursuits : null;
}

// 人間側の追撃グループ一括選択UI
function selectPursuitAssignments(retreatGroups, seaKey, pursuerSide, sideName){
  return new Promise(resolve => {
    const groupsInfo = retreatGroups.map((group, i) => {
      const grpName = String.fromCharCode(65 + i);
      const minSpd = group.length ? Math.min(...group.map(s => s.spd)) : 0;
      const eligible = SHIPS.filter(s => s.location === seaKey && !s.sunk && s.side === pursuerSide && s.type !== 'UBOAT' && (s.type !== 'CV' || s._cvDeclared) && !s.returnPending && s.spd >= minSpd);
      return { idx: i, grpName, group, minSpd, eligible };
    }).filter(g => g.group.length);

    if(!groupsInfo.length){ resolve(null); return; }

    // 追撃可能な枢軸艦の和集合
    const allEligibleIds = new Set();
    groupsInfo.forEach(g => g.eligible.forEach(s => allEligibleIds.add(s.id)));
    const allEligible = SHIPS.filter(s => allEligibleIds.has(s.id));

    // shipId → groupIdx の割り当て
    const assignments = {};

    const phaseEl = document.getElementById('phaseLabel');
    let html = `<div style="display:flex;flex-direction:column;gap:4px;font-size:0.9em;">`;
    html += `<div style="font-weight:bold;color:#fc4;">${sideName}追撃選択 — 各グループ別に追撃艦を割当`
      + ` <button id="_purOk" style="background:#2266cc;color:#fff;padding:4px 14px;border:none;border-radius:3px;cursor:pointer;margin-left:10px;">確定</button>`
      + ` <button id="_purCancel" style="background:#666;color:#fff;padding:4px 14px;border:none;border-radius:3px;cursor:pointer;margin-left:6px;">追撃しない</button></div>`;
    groupsInfo.forEach(g => {
      const shipsList = g.group.map(s => `${s.name}(spd${s.spd})`).join(', ');
      const elNames = g.eligible.map(s => s.name).join(', ') || '該当なし';
      const tagColor = g.eligible.length ? '#fc4' : '#888';
      html += `<div style="border:1px solid #456;padding:4px 6px;background:#1a2a3a;">`;
      html += `<span style="color:${tagColor};font-weight:bold;">グループ${g.grpName}</span> (最遅spd${g.minSpd}): ${shipsList}<br>`;
      html += `<span style="font-size:0.85em;color:#aac;">追撃可能枢軸: ${elNames}</span>`;
      html += `</div>`;
    });
    html += `<div style="font-size:0.85em;color:#aac;">枢軸艦の右にあるグループボタンをクリックで割当 (- は不参加)</div>`;
    html += `</div>`;
    phaseEl.innerHTML = html;

    // 各枢軸艦のcs-rowにグループ割当ボタン群を追加
    allEligible.forEach(s => {
      const row = document.getElementById(`cs-${s.id}`);
      if(!row) return;
      row.classList.add('selectable');
      const eligibleGroups = groupsInfo.filter(g => g.eligible.some(e => e.id === s.id));
      const btnContainer = document.createElement('span');
      btnContainer.className = 'pur-btns';
      btnContainer.style.cssText = 'margin-left:8px;display:inline-flex;gap:2px;';
      let btnHtml = '';
      eligibleGroups.forEach(g => {
        btnHtml += `<button data-shipid="${s.id}" data-gidx="${g.idx}" class="purBtn" style="background:#446;color:#fff;padding:1px 7px;border:1px solid #678;border-radius:3px;cursor:pointer;font-size:0.85em;">${g.grpName}</button>`;
      });
      btnHtml += `<button data-shipid="${s.id}" data-gidx="-1" class="purBtn" style="background:#642;color:#fff;padding:1px 7px;border:1px solid #864;border-radius:3px;cursor:pointer;font-size:0.85em;">-</button>`;
      btnContainer.innerHTML = btnHtml;
      const nameEl = row.querySelector('.cs-name');
      if(nameEl) nameEl.appendChild(btnContainer);

      // 初期状態: 最初の追撃可能グループに自動割当 (確定で即追撃が始まるよう)
      const defaultGidx = eligibleGroups.length ? eligibleGroups[0].idx : -1;
      assignments[s.id] = defaultGidx;
      const updateBtnStyle = (gidx) => {
        btnContainer.querySelectorAll('.purBtn').forEach(bb => {
          const isActive = Number(bb.dataset.gidx) === gidx;
          bb.style.background = isActive ? '#fc4' : (Number(bb.dataset.gidx) === -1 ? '#642' : '#446');
          bb.style.color = isActive ? '#000' : '#fff';
        });
      };
      updateBtnStyle(defaultGidx);

      btnContainer.querySelectorAll('.purBtn').forEach(b => {
        b.onclick = (e) => {
          e.stopPropagation();
          const gidx = Number(b.dataset.gidx);
          assignments[s.id] = gidx;
          updateBtnStyle(gidx);
        };
      });
    });

    const cleanup = () => {
      allEligible.forEach(s => {
        const row = document.getElementById(`cs-${s.id}`);
        if(row){
          row.classList.remove('selectable');
          const btnEl = row.querySelector('.pur-btns');
          if(btnEl) btnEl.remove();
        }
      });
    };

    document.getElementById('_purOk').onclick = () => {
      cleanup();
      const result = {};
      for(const [shipId, gidx] of Object.entries(assignments)){
        if(gidx < 0) continue;
        const ship = SHIPS.find(s => s.id === shipId);
        if(!ship) continue;
        if(!result[gidx]) result[gidx] = [];
        result[gidx].push(ship);
      }
      resolve(result);
    };
    document.getElementById('_purCancel').onclick = () => {
      cleanup();
      resolve(null);
    };
  });
}

// 追撃する価値があるか: 追う側の攻撃力が撤退する側以上（撤退する側に空母がいれば1.5倍以上）
function aiPursuitWorth(pursuers, retreaters){
  const retCV = retreaters.some(s => s.type === 'CV' && !s.sunk);
  const retAtk = retreaters.filter(s => !s.sunk).reduce((sum, s) => sum + (s.atk || 0), 0);
  const purAtk = pursuers.filter(s => !s.sunk).reduce((sum, s) => sum + (s.atk || 0), 0);
  if(purAtk <= 0) return false;
  return retCV ? purAtk >= retAtk * 1.5 : purAtk >= retAtk;
}
function aiSelectPursuers(eligible, retreaters){
  // 1艦残して残り全艦で追撃（残すのは速い艦）
  if(eligible.length <= 1) return null;
  const sorted = [...eligible].sort((a, b) => b.spd - a.spd);
  const candidates = sorted.slice(1); // 最速1艦を残す
  if(!retreaters || !retreaters.length) return candidates;
  // 撤退側の戦力評価
  const retCV = retreaters.some(s => s.type === 'CV' && !s.sunk);
  const retAtk = retreaters.filter(s => !s.sunk).reduce((sum, s) => sum + (s.atk || 0), 0);
  const purAtk = candidates.filter(s => !s.sunk).reduce((sum, s) => sum + (s.atk || 0), 0);
  // 撤退側にCVがある場合: 追撃側攻撃力が撤退側の1.5倍未満なら追撃せず
  if(retCV && purAtk < retAtk * 1.5) return null;
  // CVなしでも追撃側攻撃力が撤退側未満なら追撃せず
  if(!retCV && purAtk < retAtk) return null;
  return candidates;
}

// プレイヤー目標選択
function waitForTargetClick(side, focusSea){
  return new Promise(resolve => {
    const candidates = SHIPS.filter(s =>
      s.side === side && !s.sunk && s.location === focusSea
    );
    if(!candidates.length){ resolve(null); return; }
    const handlers = [];
    candidates.forEach(s => {
      const row = ensureCombatRow(s);
      if(!row) return;
      row.classList.add('selectable');
      const onClick = () => {
        candidates.forEach(c => {
          const r = document.getElementById(`cs-${c.id}`);
          if(r){ r.classList.remove('selectable'); r.removeEventListener('click', handlers[c.id]); }
        });
        resolve(s);
      };
      handlers[s.id] = onClick;
      row.addEventListener('click', onClick);
    });
  });
}

// 1ダイスを「ロール（シェイク）→ 結果表示」で演出
async function rollAnimDice(diceEl, finalRoll, finalCls, durationMs=550){
  // ロール中: shake + ランダム数字
  diceEl.classList.add('rolling');
  diceEl.textContent = '?';
  const startTime = Date.now();
  while(Date.now() - startTime < durationMs){
    diceEl.textContent = (1 + Math.floor(Math.random()*6));
    await wait(70);
  }
  diceEl.classList.remove('rolling');
  diceEl.classList.add(finalCls);
  diceEl.textContent = finalRoll;
}

function diceClassByRoll(r){ return r===6 ? 'hit' : (r===5 ? 'dis' : 'miss'); }

async function playOneEvent(e){
  const phaseEl = document.getElementById('phaseLabel');
  switch(e.type){
    case 'phase':
      phaseEl.textContent = `━ ${e.label} (${SEA_LABEL[e.sea] || e.sea}) ━`;
      await wait(700);
      break;
    case 'asw_ship': {
      // 各連合艦が個別にASWダイスを振る
      const diceEl = document.getElementById(`cs-dc-${e.ship}`);
      const tgtRow = document.getElementById(`cs-${e.ship}`);
      if(tgtRow) tgtRow.classList.add('firing');
      if(diceEl){
        diceEl.innerHTML = '';
        for(const r of e.dice){
          const d = document.createElement('span');
          d.className = 'dice';
          diceEl.appendChild(d);
          await rollAnimDice(d, r, diceClassByRoll(r));

        const dis = e.dice.filter(r=>r===5).length;
