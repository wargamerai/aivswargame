// 修理 (13): AI側は自動、人間側は選択画面で修理量を指定
async function executeRepair(side){
  const log = [];
  console.log('[executeRepair]', { side, currentTurn });
  Object.keys(PORTS).forEach(portKey => {
    const port = PORTS[portKey];
    const portShipsAll = SHIPS.filter(s => s.location === portKey && !s.sunk && !s.landed);
    const damagedShipsAll = portShipsAll.filter(s => s.damage > 0);
    if(damagedShipsAll.length){
      console.log(`[executeRepair] ${portKey} (repair=${port.repair}, avail=${port.available}, side=${port.side}):`, damagedShipsAll.map(s => `${s.name}(${s.side},dmg${s.damage})`));
    }
    if(port.repair <= 0){ if(damagedShipsAll.length) console.log(`  → skip: repair<=0`); return; }
    if(!port.available.includes(currentTurn)){ if(damagedShipsAll.length) console.log(`  → skip: turn ${currentTurn} not in available`); return; }
    if(side && port.side !== 'neutral' && port.side !== side){ if(damagedShipsAll.length) console.log(`  → skip: side filter (${side} vs ${port.side})`); return; }
    const ships = SHIPS.filter(s =>
      s.location === portKey && !s.sunk && !s.landed && s.damage > 0 &&
      (!side || s.side === side) && s.side !== humanSide
    );
    if(!ships.length){ console.log(`  → no ships match filter`); return; }
    let budget = port.repair;
    const lines = [];
    for(const ship of ships){
      if(budget <= 0) break;
      const rep = Math.min(budget, ship.damage);
      ship.damage -= rep;
      budget -= rep;
      ship.spd = Math.max(1, ship.spdOrig - ship.damage);
      if(ship.damage < ship.def && ship.atkOrig > 0){
        ship.atk = ship.atkOrig;
      }
      lines.push(`${ship.name}: -${rep} → 残${ship.damage}/${ship.def}`);
    }
    if(lines.length){
      log.push(`<b>${PORT_LABEL[portKey]||portKey}(${port.repair})</b>: ${lines.join(' / ')}`);
    }
  });
  // 人間側は選択画面で修理量を指定
  if(!side || side === humanSide){
    const manualLog = await showRepairUI(humanSide);
    log.push(...manualLog);
  }
  document.getElementById('repairStatus').innerHTML = log.length ? log.join('<br>') : '修理対象艦なし';
  placeAllShips();
  renderLocShipList();
  return log;
}

// 人間側の修理: 港ごとに各艦の修理量を指定（途中までの修理可）
function showRepairUI(side){
  const entries = [];
  Object.keys(PORTS).forEach(portKey => {
    const port = PORTS[portKey];
    if(port.repair <= 0) return;
    if(!port.available.includes(currentTurn)) return;
    if(port.side !== 'neutral' && port.side !== side) return;
    const ships = SHIPS.filter(s => s.location === portKey && !s.sunk && !s.landed && s.damage > 0 && s.side === side);
    if(ships.length) entries.push({ portKey, port, ships });
  });
  if(!entries.length) return Promise.resolve([]);
  return new Promise(resolve => {
    const modal = document.getElementById('axisRepairModal');
    const tbody = document.getElementById('axisRepairBody');
    const amounts = {}; // shipId → 修理量
    const usedIn = entry => entry.ships.reduce((sum, s) => sum + (amounts[s.id] || 0), 0);

    function render(){
      tbody.innerHTML = '';
      for(const entry of entries){
        const left = entry.port.repair - usedIn(entry);
        const head = document.createElement('tr');
        head.innerHTML = `<td colspan="3" style="background:#1a2a3a;"><b>${PORT_LABEL[entry.portKey]||entry.portKey}</b> 修理量${entry.port.repair}（残り${left}）</td>`;
        tbody.appendChild(head);
        for(const ship of entry.ships){
          const amt = amounts[ship.id] || 0;
          const tr = document.createElement('tr');
          const tdName = document.createElement('td');
          tdName.textContent = ship.name;
          tr.appendChild(tdName);
          const tdDmg = document.createElement('td');
          tdDmg.style.whiteSpace = 'nowrap';
          tdDmg.innerHTML = `<span style="color:#fa8;">${ship.damage}/${ship.def}</span><span style="display:inline-block;min-width:5em;">${amt ? ` → 残${ship.damage - amt}` : ''}</span>`;
          tr.appendChild(tdDmg);
          const tdAmt = document.createElement('td');
          const minus = document.createElement('button');
          minus.className = 'ret-btn';
          minus.textContent = '－';
          minus.disabled = amt <= 0;
          minus.onclick = () => { amounts[ship.id] = amt - 1; render(); };
          const val = document.createElement('span');
          val.style.cssText = 'display:inline-block;min-width:2em;text-align:center;';
          val.textContent = amt;
          const plus = document.createElement('button');
          plus.className = 'ret-btn';
          plus.textContent = '＋';
          plus.disabled = amt >= ship.damage || left <= 0;
          plus.onclick = () => { amounts[ship.id] = amt + 1; render(); };
          tdAmt.appendChild(minus);
          tdAmt.appendChild(val);
          tdAmt.appendChild(plus);
          tr.appendChild(tdAmt);
          tbody.appendChild(tr);
        }
      }
    }

    document.getElementById('axisRepairOkBtn').onclick = () => {
      const log = [];
      for(const entry of entries){
        const lines = [];
        for(const ship of entry.ships){
          const rep = amounts[ship.id] || 0;
          if(rep <= 0) continue;
          ship.damage -= rep;
          ship.spd = Math.max(1, ship.spdOrig - ship.damage);
          if(ship.damage < ship.def && ship.atkOrig > 0){
            ship.atk = ship.atkOrig;
          }
          lines.push(`${ship.name}: -${rep} → 残${ship.damage}/${ship.def}`);
        }
        if(lines.length){
          log.push(`<b>${PORT_LABEL[entry.portKey]||entry.portKey}(${entry.port.repair})</b>: ${lines.join(' / ')}`);
        }
      }
      modal.classList.remove('show');
      resolve(log);
    };

    render();
    modal.classList.add('show');
  });
}

// シミュレーションモード（true=高速・アニメ無し）
let simMode = false;

// 連合軍AI移動 + 修理
// === 連合AI配分: 移動先を宣言する（実際の移動・ダイス判定は aiAlliedMove 側） ===
// 順序: 船団護衛(船団がバレンツ在泊時) → ターン1とターン2以降で分岐
//   ターン1: 空母を北海/バレンツに交互 → 北海(遅い艦でドイツ本国の戦力以上) → バレンツ(速い艦すべて)
//            → 北海不足ならバレンツの余剰を北海へ → 余りは北海/バレンツにランダム
//   ターン2以降: 地中海増援(連続支配3かつ南大西洋を連合支配) → 空母を対潜の手薄な海域へ1隻ずつ
//            → 北海(遅い艦で攻撃力) → バレンツ(速い艦で攻撃力) → 北海不足ならバレンツの余剰を北海へ
//            → 北/南大西洋に最低1隻 → バレンツ(余力で艦数も) → 余りは北大西洋→南大西洋（勝てるとき）、残りは北海
// 戦力の評価（両軍のAIで共通）
//   空母は航空攻撃が1回だけなので単純合計しない: 両軍の航空攻撃力を相殺し、残った側の 航空攻撃力×1/6（5の目）隻ぶん
//   相手の水上艦を平均の攻撃力で減らす。そのうえで水上艦の攻撃力（空母は水上戦闘で撃たない）を比べる
function battleEval(ours, theirs){
  const surfShips = arr => arr.filter(s => s.type !== 'CV' && s.type !== 'UBOAT');
  const surf = arr => surfShips(arr).reduce((t, s) => t + (s.atk || 0), 0);
  const air = arr => arr.filter(s => s.type === 'CV').reduce((t, s) => t + (s.air || 0), 0);
  let o = surf(ours), t = surf(theirs);
  const net = air(ours) - air(theirs);
  const oc = surfShips(ours).length, tc = surfShips(theirs).length;
  if(net > 0 && tc) t -= (net / 6) * (t / tc);
  if(net < 0 && oc) o -= (-net / 6) * (o / oc);
  return { ours: Math.max(0, o), theirs: Math.max(0, t) };
}
// 味方が相手以上か（相手がいなければ真）
function battleGeq(ours, theirs){
  if(!theirs.filter(s => s.type !== 'UBOAT').length) return true;
  const e = battleEval(ours, theirs);
  return e.ours >= e.theirs && e.ours > 0;
}

const alliedPostureLog = []; // { turn, posture }（観戦ページ・レポート用）
// イタリア艦隊の全戦力: 見えている艦だけでなく、修理中の艦とこれから登場する増援（Impero・Roma）も含める
function italianFullThreat(){
  return SHIPS.filter(s => s.side === 'axis' && s.country === 'IT' && !s.sunk && !s.removed && s.type !== 'UBOAT');
}
// 地中海で絶対に負けない: イタリアの全戦力に対して、戦力1.5倍以上かつ艦の数で上回る
function medNeverLose(arr){
  const it = italianFullThreat();
  if(!it.length) return arr.length > 0;
  const e = battleEval(arr, it);
  return e.ours > 0 && e.ours >= e.theirs * 1.5 && arr.length > it.length;
}
function planAlliedDeployment(aiLog){
  let posture = 'normal';
  const plan = {}; // shipId → 移動先
  const pw = s => (s.atk || 0) + (s.air || 0); // 攻撃力（空母は航空攻撃力を加算）
  const sumAtk = arr => arr.reduce((t, s) => t + pw(s), 0);
  const strength = s => pw(s) + (s.def || 0);
  // 港か海域にいる艦のみ（ターン表の未登場艦は除く）
  const axisReady = SHIPS.filter(s =>
    s.side === 'axis' && !s.sunk && !s.removed && s.type !== 'UBOAT' && !(s.damage > 0) &&
    s.location && (PORTS[s.location] || SEAS[s.location])
  );
  // ドイツ本国の戦力（北海・バレンツ海の必要量）
  const deHome = axisReady.filter(s => s.location === 'Germany');
  const deAtk = sumAtk(deHome);
  // 大西洋に来るドイツ艦: フランス・中立港・大西洋上・洋上補給成功艦
  //   + ドイツ本国の速力7の艦（北海かバレンツ海が連合の支配でないとき）
  //   + イタリアの重巡（地中海が連合の支配でないとき）
  const deHomeToAtl = seaControl['NorthSea'] !== 'allies' || seaControl['Barents'] !== 'allies';
  const atlThreat = axisReady.filter(s =>
    ['France', 'Neutral', 'NorthAtlantic', 'SouthAtlantic'].includes(s.location) ||
    s.refuelTurn === currentTurn - 1 ||
    (s.location === 'Germany' && s.spd >= 7 && deHomeToAtl) ||
    (s.country === 'IT' && s.type === 'CA' && seaControl['Mediterranean'] !== 'allies')
  );
  // 海域ごとの大西洋の脅威: このターンにその海域まで来られるドイツ艦だけ
  //   港から隣（1エリア）か、途中の海域が連合の支配でないときの2エリア移動。洋上補給の成功艦はどこでも
  //   ドイツ本国の艦は速力7のみ（今までどおり）。イタリアは重巡だけが地中海を通って南大西洋へ
  const reachesSea = (s, sea) => {
    if(s.refuelTurn === currentTurn - 1 && SEAS[s.location]) return true;
    if(SEAS[s.location]) return s.location === sea || (SEA_ADJ[s.location] || []).includes(sea);
    if(s.location === 'Germany' && s.spd < 7) return false;
    if(s.country === 'IT' && (s.type !== 'CA' || sea !== 'SouthAtlantic')) return false;
    const adj = PORT_SEAS[s.location] || [];
    if(adj.includes(sea)) return true;
    return adj.some(mid => seaControl[mid] !== 'allies' && (SEA_ADJ[mid] || []).includes(sea));
  };
  const atlThreatSea = {
    NorthAtlantic: atlThreat.filter(s => reachesSea(s, 'NorthAtlantic')),
    SouthAtlantic: atlThreat.filter(s => reachesSea(s, 'SouthAtlantic'))
  };
  const threat = {
    Barents: axisReady.filter(s => s.location === 'Germany' || (s.country === 'DE' && s.spd >= 7)),
    Mediterranean: axisReady.filter(s => s.location === 'Italy' || s.location === 'Mediterranean')
  };
  const candidates = SHIPS.filter(s =>
    s.side === 'allies' && !s.sunk && !s.removed && !s.movedThisTurn &&
    s.location && PORTS[s.location] && s.type !== 'CONVOY' && !(s.damage > 0) &&
    s.location !== 'Malta' && s.country !== 'RU' &&
    !(s.country === 'US' && currentTurn < 4)
  );
  // 投入前の米国艦は配分の計算に入れない（北大西洋へ投入ロールのみ宣言し、成功したら加わる）
  const usTry = candidates.filter(s => s.country === 'US' && !s.usEntered);
  const pool = candidates.filter(s => !usTry.includes(s));
  // 到達: 1=隣接（確実） / 2=2エリア移動（宣言後にダイス判定） / 0=不可。米国艦は北大西洋のみ
  const hop = (s, sea) => {
    if(s.country === 'US' && sea !== 'NorthAtlantic') return 0;
    const adj = PORT_SEAS[s.location] || [];
    if(adj.includes(sea)) return 1;
    // 2エリア移動: 最初のエリアが敵（枢軸）の支配でなければ可能
    if(adj.some(mid => seaControl[mid] !== 'axis' && (SEA_ADJ[mid] || []).includes(sea))) return 2;
    return 0;
  };
  const successRate = s => Math.min(Math.max((s.spd || 0) - 1, 0), 6) / 6; // 2エリア移動: ダイス<速力
  const placed = { NorthSea: [], NorthAtlantic: [], SouthAtlantic: [], Barents: [], Mediterranean: [] };
  const freeShips = () => pool.filter(s => !plan[s.id]);
  const assign = (s, sea) => { plan[s.id] = sea; placed[sea].push(s); };
  const unassign = s => {
    const sea = plan[s.id];
    if(!sea) return;
    delete plan[s.id];
    placed[sea] = placed[sea].filter(x => x !== s);
  };
  // 攻撃力が足りない間は攻撃力の高い艦から、艦数だけ足りない間は弱い艦から割り当て
  const fill = (sea, enemy, needCnt, ok) => {
    while(true){
      const atkShort = !battleGeq(placed[sea], enemy);
      const cntShort = placed[sea].length < needCnt;
      if(!atkShort && !cntShort) return;
      const cands = freeShips().filter(ok);
      if(!cands.length) return;
      cands.sort((a, b) => atkShort
        ? (pw(b) - pw(a)) || (strength(b) - strength(a))
        : strength(a) - strength(b));
      assign(cands[0], sea);
    }
  };
  const isFast = s => s.spd >= 5; // 速力5以上=速い艦（バレンツ海） / 4以下=遅い艦（北海）
  const nsOk = s => hop(s, 'NorthSea') === 1;
  const barOk = s => hop(s, 'Barents') > 0;
  // バレンツ海への移動の成功率（隣接=確実 / 2エリア移動=ダイス）
  const barRate = s => hop(s, 'Barents') === 1 ? 1 : successRate(s);

  // 投入済みの米国艦は北大西洋
  freeShips().filter(s => s.country === 'US' && hop(s, 'NorthAtlantic') > 0).forEach(s => assign(s, 'NorthAtlantic'));

  // 1) 船団がバレンツ海にいるターンは護衛を最優先（ロシア上陸+3は大西洋を失っても上回る）
  const convoyPhase = SHIPS.some(s => s.type === 'CONVOY' && s.location === 'Barents' && !s.sunk && !s.removed);
  if(convoyPhase){
    fill('Barents', threat.Barents, Math.max(1, threat.Barents.length), s => barOk(s) && (hop(s, 'Barents') === 1 || s.spd >= 7));
  }

  // 地中海の準備（マルタ艦・イタリアの脅威）
  const streak3 = medAxisStreak >= 3;
  const medThreat = threat.Mediterranean;
  // マルタの無傷艦のみ出撃（損害艦はマルタに残る）。連続支配3のときと最後のターンは損害艦も出撃
  const lastTurn = currentTurn >= 8; // 最後のターンはマルタに残っても意味がないので全艦出撃
  const maltaShips = SHIPS.filter(s =>
    s.location === 'Malta' && s.side === 'allies' && !s.sunk && !s.removed && !s.movedThisTurn && s.type !== 'CONVOY' &&
    (streak3 || lastTurn || !(s.damage > 0))
  );
  const medOk = s => hop(s, 'Mediterranean') > 0;
  let leftoverMode;

  if(currentTurn === 1){
    // ===== ターン1: 北海とバレンツ海に全力（大西洋は考えない） =====
    // 地中海のテコ入れ: 足の遅い戦艦（Malaya・Barham）0〜1隻と重巡0〜2隻を2エリア移動で地中海へ（数はくじ、成否はダイス）
    {
      const nBB = Math.floor(Math.random() * 2), nCA = Math.floor(Math.random() * 3);
      const medBB = freeShips().filter(s => (s.id === 'uk_malaya' || s.id === 'uk_barham') && medOk(s))
        .sort(() => Math.random() - 0.5).slice(0, nBB);
      const medCA = nCA ? freeShips().filter(s => s.country === 'UK' && s.type === 'CA' && medOk(s)).slice(-nCA) : [];
      [...medBB, ...medCA].forEach(s => assign(s, 'Mediterranean'));
    }
    // 空母: 航空攻撃力の大きい順に、バレンツ海・北海へ交互に振り分ける
    let toBarents = true;
    freeShips().filter(s => s.type === 'CV').sort((a, b) => (b.air || 0) - (a.air || 0)).forEach(s => {
      const first = toBarents ? 'Barents' : 'NorthSea';
      const second = toBarents ? 'NorthSea' : 'Barents';
      const ok = sea => sea === 'Barents' ? barOk(s) : nsOk(s);
      if(ok(first)){ assign(s, first); toBarents = !toBarents; }
      else if(ok(second)) assign(s, second);
    });
    // 北海: 遅い艦を攻撃力の高い順に、ドイツ本国の戦力以上になるまで
    while(!battleGeq(placed.NorthSea, deHome)){
      const cands = freeShips().filter(s => !isFast(s) && nsOk(s)).sort((a, b) => pw(b) - pw(a));
      if(!cands.length) break;
      assign(cands[0], 'NorthSea');
    }
    // バレンツ海: 速い艦を送り込む（2エリア移動）
    freeShips().filter(s => isFast(s) && barOk(s)).forEach(s => assign(s, 'Barents'));
    // 北海が届かないとき: バレンツ海の余剰の範囲で北海へ回す
    while(!battleGeq(placed.NorthSea, deHome)){
      // バレンツ海から抜いてもドイツ本国以上を保てる艦（余剰）を北海へ
      // バレンツ海への移動に失敗しうる艦から先に回す（確実に行ける艦はバレンツ海に残す）、同じなら攻撃力の高い艦
      const cands = placed.Barents.filter(s => nsOk(s) && (s.atk || 0) > 0 && battleGeq(placed.Barents.filter(x => x !== s), deHome)).sort((a, b) => barRate(a) - barRate(b) || pw(b) - pw(a));
      if(!cands.length) break;
      unassign(cands[0]);
      assign(cands[0], 'NorthSea');
    }
    // 余った艦: 北海とバレンツ海にランダム
    leftoverMode = 'ランダム(北海/バレンツ)';
    for(const s of freeShips()){
      const seas = [];
      if(nsOk(s)) seas.push('NorthSea');
      if(barOk(s)) seas.push('Barents');
      if(seas.length) assign(s, seas[Math.floor(Math.random() * seas.length)]);
    }
  } else {
    // ===== ターン2以降: ドイツの戦力に合わせて必要な分だけ置き、残りを広く薄く =====
    // 連合の構え（ターンごとのくじ）: 北海重視 40% / 今まで通り 40% / 大西洋重視 20%
    const pr = Math.random();
    posture = pr < 0.4 ? 'ns' : pr < 0.8 ? 'normal' : 'atl';
    alliedPostureLog.push({ turn: currentTurn, posture });
    // 1) 地中海の増援: 連続支配3かつ南大西洋を連合が支配しているときだけ、勝てる量まで（強い艦から）
    if(streak3 && seaControl['SouthAtlantic'] === 'allies'){
      const itFull = italianFullThreat();
      const medWins = () => battleGeq([...maltaShips, ...placed.Mediterranean], itFull)
        && (maltaShips.length + placed.Mediterranean.length) > itFull.length;
      while(!medWins()){
        const cands = freeShips().filter(medOk).sort((a, b) => pw(b) - pw(a));
        if(!cands.length) break;
        assign(cands[0], 'Mediterranean');
      }
    }
    // 2) 空母: 対潜の手薄な海域から1隻ずつ（船団がいる海域は対潜3個ありとして後回し）
    const aswSeas = ['Barents', 'NorthSea', 'NorthAtlantic', 'SouthAtlantic'];
    const aswDice = sea => 3 * (SHIPS.filter(s => s.type === 'CONVOY' && s.location === sea && !s.sunk && !s.removed).length
      + placed[sea].filter(s => s.type === 'CV').length);
    const cvOk = (s, sea) => sea === 'Barents' ? barOk(s) : hop(s, sea) === 1;
    freeShips().filter(s => s.type === 'CV').sort((a, b) => (b.air || 0) - (a.air || 0)).forEach(s => {
      const seas = aswSeas.filter(sea => cvOk(s, sea));
      if(!seas.length) return;
      seas.sort((a, b) => aswDice(a) - aswDice(b) || aswSeas.indexOf(a) - aswSeas.indexOf(b));
      assign(s, seas[0]);
    });
    // 2b) 参戦した米国艦は北大西洋へ（米国艦は北大西洋にしか行けない）。北大西洋は基本、米国に任せる
    freeShips().filter(s => s.country === 'US' && hop(s, 'NorthAtlantic') === 1).forEach(s => assign(s, 'NorthAtlantic'));
    // 3) 北海: 遅い艦を攻撃力の高い順に、ドイツ本国の戦力以上になるまで
    while(!battleGeq(placed.NorthSea, deHome)){
      const cands = freeShips().filter(s => !isFast(s) && nsOk(s)).sort((a, b) => pw(b) - pw(a));
      if(!cands.length) break;
      assign(cands[0], 'NorthSea');
    }
    // 4) バレンツ海（1段目）: 速い艦を攻撃力の高い順に、ドイツ本国の戦力以上になるまで
    while(!battleGeq(placed.Barents, deHome)){
      const cands = freeShips().filter(s => isFast(s) && barOk(s)).sort((a, b) => pw(b) - pw(a));
      if(!cands.length) break;
      assign(cands[0], 'Barents');
    }
    // 5) 北海が届かないとき: バレンツ海の余剰の範囲で北海へ回す
    while(!battleGeq(placed.NorthSea, deHome)){
      // バレンツ海から抜いてもドイツ本国以上を保てる艦（余剰）を北海へ
      const cands = placed.Barents.filter(s => nsOk(s) && (s.atk || 0) > 0 && battleGeq(placed.Barents.filter(x => x !== s), deHome)).sort((a, b) => pw(b) - pw(a));
      if(!cands.length) break;
      unassign(cands[0]);
      assign(cands[0], 'NorthSea');
    }
    // 6) バレンツ海（2段目）: 艦の数でもドイツ本国を上回るまで（弱い艦から）
    while(placed.Barents.length <= deHome.length){
      const cands = freeShips().filter(s => isFast(s) && barOk(s)).sort((a, b) => strength(a) - strength(b));
      if(!cands.length) break;
      assign(cands[0], 'Barents');
    }
    // 7) 北海（2段目）: 戦力と艦の数の両方でドイツ本国を上回るまで（遅い艦から）
    //    北海とバレンツ海の支配を取れれば北大西洋は取り返せるので、大西洋より先に固める
    while(!(battleGeq(placed.NorthSea, deHome) && placed.NorthSea.length > deHome.length)){
      const cands = freeShips().filter(nsOk).sort((a, b) => (isFast(a) ? 1 : 0) - (isFast(b) ? 1 : 0) || pw(b) - pw(a));
      if(!cands.length) break;
      assign(cands[0], 'NorthSea');
    }
    // 7b) 北大西洋・南大西洋: まだ1隻もいなければ、一番弱い艦を1隻（北大西洋は米国艦がいればそれでよい）
    for(const sea of ['NorthAtlantic', 'SouthAtlantic']){
      if(placed[sea].length) continue;
      const cand = freeShips().filter(s => hop(s, sea) === 1).sort((a, b) => strength(a) - strength(b))[0];
      if(cand) assign(cand, sea);
    }
    // 8) 余った艦の置き方: ターンごとにくじで決めた構えに従う
    //   北海重視  : 北海をドイツ本国の1.3倍の戦力まで厚くしてから、大西洋
    //   今まで通り: 大西洋（その海域まで来られるドイツ艦がいて、勝てるとき）、残りは北海
    //   大西洋重視: 大西洋に、来られるドイツ艦の1.3倍の戦力まで厚めに置く、残りは北海
    leftoverMode = { ns:'北海重視', normal:'今まで通り', atl:'大西洋重視' }[posture];
    if(posture === 'ns'){
      // 北海重視: 北海をドイツ本国の1.3倍の戦力まで、さらに厚くしてから大西洋
      const nsStrong = () => { const e = battleEval(placed.NorthSea, deHome); return e.ours >= e.theirs * 1.3 && e.ours > 0; };
      while(deHome.length && !nsStrong()){
        const cands = freeShips().filter(nsOk).sort((a, b) => (isFast(a) ? 1 : 0) - (isFast(b) ? 1 : 0) || pw(b) - pw(a));
        if(!cands.length) break;
        assign(cands[0], 'NorthSea');
      }
    }
    const margin = posture === 'atl' ? 1.3 : 1;
    const wins = (arr, th) => {
      const e = battleEval(arr, th);
      return e.ours >= e.theirs * margin && e.ours > 0 && arr.length > th.length;
    };
    for(const sea of ['NorthAtlantic', 'SouthAtlantic']){
      const th = atlThreatSea[sea];
      if(!th.length) continue; // 来られるドイツ艦がいない海域には、最低1隻（6）より多くは置かない
      const cands = freeShips().filter(s => hop(s, sea) === 1).sort((a, b) => pw(b) - pw(a));
      if(!wins([...placed[sea], ...cands], th)) continue;
      for(const s of cands){
        if(wins(placed[sea], th)) break;
        assign(s, sea);
      }
    }
    freeShips().filter(nsOk).forEach(s => assign(s, 'NorthSea'));
  }

  // 7) マルタ艦の出撃判断: イタリア以上=出撃 / 7割以上=比率の確率で出撃 / 7割未満=出撃しない / 連続支配3・最後のターン=必ず出撃
  const medEval = battleEval([...maltaShips, ...placed.Mediterranean], medThreat);
  const medAtk = medEval.ours;
  const itAtk = medEval.theirs;
  const ratio = itAtk > 0 ? medAtk / itAtk : Infinity;
  // マルタの艦はいつも地中海へ出撃する（マルタに残っても意味がない）
  const sortie = true;
  if(!sortie){
    // 出撃しない場合は地中海への増援も取りやめ、北海へ
    const back = placed.Mediterranean.slice();
    back.forEach(unassign);
    back.filter(nsOk).forEach(s => assign(s, 'NorthSea'));
  }
  // 投入前の米国艦: 北大西洋へ投入ロール（成功時のみ加わる）
  usTry.forEach(s => { plan[s.id] = 'NorthAtlantic'; });

  const dist = Object.keys(placed).map(k => `${SEA_LABEL[k]}${placed[k].length}`).join(' ');
  aiLog.push(`<b>配分: ${dist} / 余り=${leftoverMode} / マルタ出撃=${sortie ? 'する' : 'しない'}(連合${medAtk.toFixed(1)} vs 伊${itAtk.toFixed(1)})</b>`);
  aiLog.push(`ドイツ側: 本国${deHome.length}隻(攻${deAtk}) 北大西洋${atlThreatSea.NorthAtlantic.length}隻 南大西洋${atlThreatSea.SouthAtlantic.length}隻 地中海${medThreat.length}隻(攻${itAtk})`);
  // マルタの余力: イタリアの全戦力（修理中・増援を含む）に絶対に負けない量を強い艦から地中海に残し、
  //   超えた無傷艦のうち速力7の艦だけ南大西洋へ（地中海経由の2エリア移動。速力7ならダイスに必ず勝てる）
  //   速力7でない余りは地中海に出撃し、帰還のフェイズで英国へ帰る
  let maltaGo = sortie ? maltaShips : [];
  if(sortie){
    const keep = [];
    const medWins = () => medNeverLose([...keep, ...placed.Mediterranean]);
    for(const s of maltaShips.slice().sort((a, b) => pw(b) - pw(a))){
      if(medWins() && !(s.damage > 0) && s.spd >= 7 && hop(s, 'SouthAtlantic') > 0){
        plan[s.id] = 'SouthAtlantic';
        placed.SouthAtlantic.push(s);
      } else {
        keep.push(s);
      }
    }
    maltaGo = keep;
    if(maltaShips.length > keep.length) aiLog.push(`マルタの余力 ${maltaShips.length - keep.length}隻 → 南大西洋`);
  }
  return { plan, maltaSortie: maltaGo };
}

async function aiAlliedMove(bbTargetOverride){
  const aiLog = [];
  // ロシア艦出港判定（ターン3以降、毎ターン、ダイス5+で成功）
  if(currentTurn >= 3){
    const ruResults = [];
    SHIPS.filter(s => s.country === 'RU' && !s.sunk).forEach(s => {
      const r = rollD6();
      s.canMoveThisTurn = (r >= 5);
      aiLog.push(`${s.name}: ロシア出港⚂${r} ${s.canMoveThisTurn ? '成功' : '失敗'}`);
      ruResults.push(`${s.name}: ⚂${r} ${s.canMoveThisTurn ? '成功' : '失敗'}`);
    });
    if(ruResults.length){
      alert('ロシア艦出港判定:\n' + ruResults.join('\n'));
    }
  } else {
    SHIPS.filter(s => s.country === 'RU' && !s.sunk).forEach(s => {
      s.canMoveThisTurn = false;
    });
    aiLog.push(`ロシア艦: ターン${currentTurn}<3 - 出港判定スキップ`);
  }

  // === コンボイ移動を最優先で実施 ===
  const _convoyOccupiedEarly = new Set();
  SHIPS.forEach(s => {
    if(s.type === 'CONVOY' && SEAS[s.location] && !s.sunk && !s.removed) _convoyOccupiedEarly.add(s.location);
  });
  // 1a) 船団 NA→バレンツ海（海上2ターン目以降）。損害を受けていてもロシアを目指す
  for(const ship of SHIPS.filter(s => s.type === 'CONVOY' && s.side === 'allies' && !s.sunk && !s.removed && !s.movedThisTurn && s.location === 'NorthAtlantic' && (s.turnsAtSea||0) >= 1)){
    if(_convoyOccupiedEarly.has('Barents')) continue;
    ship.location = 'Barents';
    ship.movedThisTurn = true;
    _convoyOccupiedEarly.add('Barents');
    _convoyOccupiedEarly.delete('NorthAtlantic');
    aiLog.push(`<b>${ship.name} → バレンツ海(ロシア向)</b>`);
  }
  // 1b) 船団 USA→NA
  for(const ship of SHIPS.filter(s => s.type === 'CONVOY' && s.side === 'allies' && !s.sunk && !s.removed && !s.movedThisTurn && s.location === 'USA')){
    if(_convoyOccupiedEarly.has('NorthAtlantic')) continue;
    ship.location = 'NorthAtlantic';
    ship.movedThisTurn = true;
    _convoyOccupiedEarly.add('NorthAtlantic');
    aiLog.push(`${ship.name} → 北大西洋`);
  }
  if(!simMode) placeAllShips();

  // === 新しい配分: 全艦の移動先を先に宣言 → まとめて移動・2エリア移動のダイス判定 ===
  const deploy = planAlliedDeployment(aiLog);
  for(const shipId in deploy.plan){
    const ship = SHIPS.find(s => s.id === shipId);
    if(!ship || ship.movedThisTurn) continue;
    const dest = deploy.plan[shipId];
    // 米国艦は投入ロール (ダイス6で成功、永続。オプションでターンごとに緩和)
    if(ship.country === 'US' && !ship.usEntered){
      const v = rollD6();
      const success = v >= usEntryNeed();
      aiLog.push(`${ship.name}: 米投入⚂${v}${success?'成功(永続)':'失敗'}`);
      if(!simMode) alert(`${ship.name}: 米投入⚂${v} ${success ? '成功(永続)' : '失敗'}`);
      if(!success){
        ship.movedThisTurn = true;
        ship.failedMove = true;
        continue;
      }
      ship.usEntered = true;
    }
    // 2エリア移動: ダイス < 速力 で成功。失敗は、目的の海域に隣接する味方の港があればそこへ、なければ元の港に残る
    if(!(PORT_SEAS[ship.location] || []).includes(dest)){
      const v = rollD6();
      if(v >= ship.spd){
        ship.movedThisTurn = true;
        ship.failedMove = true;
        const alt = failMovePorts(ship, dest, ship.location)[0];
        if(alt) ship.location = alt;
        aiLog.push(`${ship.name}: ${SEA_LABEL[dest]||dest}へ2エリア移動 ⚂${v}≥${ship.spd} 失敗${alt ? ` → ${PORTS[alt].name}` : ''}`);
        continue;
      }
      aiLog.push(`${ship.name}: 2エリア移動 ⚂${v}<${ship.spd} 成功`);
    }
    ship.location = dest;
    ship.movedThisTurn = true;
    aiLog.push(`${ship.name} → ${SEA_LABEL[dest]||dest}`);
  }
  // マルタ艦の地中海出撃
  for(const s of deploy.maltaSortie){
    if(s.movedThisTurn) continue;
    s.location = 'Mediterranean';
    s.movedThisTurn = true;
    aiLog.push(`${s.name}: マルタ → 地中海`);
  }
  // 母港固定艦: レニングラード → バルト海、ロシア → バレンツ海（ロシア艦は出港判定成功時のみ）
  SHIPS.filter(s =>
    s.side === 'allies' && !s.sunk && !s.removed && !s.movedThisTurn && !(s.damage > 0) &&
    s.type !== 'CONVOY' && (s.location === 'Leningrad' || s.location === 'Russia')
  ).forEach(s => {
    if(s.country === 'RU' && !s.canMoveThisTurn) return;
    const dest = s.location === 'Leningrad' ? 'Baltic' : 'Barents';
    if(dest === 'Baltic' && s.country !== 'RU') return; // 6.6 バルト海はRU/DEのみ
    s.location = dest;
    s.movedThisTurn = true;
    aiLog.push(`${s.name} → ${SEA_LABEL[dest]}`);
  });
  if(!simMode){
    placeAllShips();
    document.getElementById('aiLog').innerHTML = aiLog.join('<br>');
    const ms = document.getElementById('moveStatus');
    if(ms) ms.innerHTML = aiLog.join('<br>');
  }
  return;
  // ※ 以下は旧配分処理（新しい配分に置き換えたため実行されない）

  // === 配置優先順序: コンボイ(上) → ロシア(出港判定済) → 北海 → 地中海 → バレンツ → 北大西洋 → 南大西洋 ===

  // 北海/SA/NA: computeAlliedConfig で計算（北海最優先）
  let bestConfig = null;
  if(!bbTargetOverride && !simMode){
    bestConfig = computeAlliedConfig();
  }
  const movable = SHIPS.filter(s =>
    s.side === 'allies' && !s.sunk && !s.removed && !s.movedThisTurn &&
    s.location && PORTS[s.location] &&
    s.damage === 0
  );

  // モンテカルロで決定した配置を適用（bestConfig がある場合、各艦を直接配置）
  if(bestConfig){
    for(const shipId in bestConfig){
      const ship = SHIPS.find(s => s.id === shipId);
      if(!ship || ship.movedThisTurn) continue;
      // 米国艦は投入ロール (ダイス6で成功、永続)
      if(ship.country === 'US' && ship.type !== 'CONVOY' && !ship.usEntered){
        const v = rollD6();
        const success = v === 6;
        aiLog.push(`${ship.name}: 米投入⚂${v}${success?'成功(永続)':'失敗'}`);
        alert(`${ship.name}: 米投入⚂${v} ${success ? '成功(永続)' : '失敗'}`);
        if(!success){
          ship.movedThisTurn = true;
          ship.failedMove = true;
          continue;
        }
        ship.usEntered = true;
      }
      ship.location = bestConfig[shipId];
      ship.movedThisTurn = true;
      aiLog.push(`${ship.name} → ${SEA_LABEL[bestConfig[shipId]]||bestConfig[shipId]} (MC)`);
    }
    if(!simMode) placeAllShips();
  }

  // === 地中海: 北海配置後に処理 ===
  // Malta 艦の地中海派遣判定: マルタ艦数 ≥ イタリア艦数（生存総数）なら出撃
  const itTotalAlive = SHIPS.filter(s => s.country === 'IT' && !s.sunk && !s.removed && s.type !== 'UBOAT').length;
  const maltaTotalAlive = SHIPS.filter(s => s.location === 'Malta' && s.side === 'allies' && !s.sunk && !s.removed && s.type !== 'CONVOY').length;
  if(maltaTotalAlive >= itTotalAlive){
    SHIPS.filter(s => s.location === 'Malta' && s.side === 'allies' && !s.sunk && !s.removed && s.type !== 'CONVOY' && !s.movedThisTurn).forEach(s => {
      s.location = 'Mediterranean';
      s.movedThisTurn = true;
    });
    aiLog.push(`Malta出撃: マルタ${maltaTotalAlive} ≥ IT${itTotalAlive}`);
  } else {
    aiLog.push(`Malta出撃控え（数劣勢）: マルタ${maltaTotalAlive} < IT${itTotalAlive}`);
  }
  // 戦力調整 (ターン2以降): マルタ系UK艦の攻撃力 ≥ イタリア攻撃力+1 を維持
  if(currentTurn >= 2){
    const italyAtk = SHIPS.filter(s =>
      s.country === 'IT' && !s.sunk && !s.removed && s.type !== 'UBOAT' &&
      !(s.location && typeof s.location === 'string' && s.location.startsWith('T'))
    ).reduce((sum, s) => sum + (s.atk || 0), 0);
    const maltaAlliedAtk = SHIPS.filter(s =>
      s.side === 'allies' && !s.sunk && !s.removed && s.type !== 'CONVOY' &&
      (s.location === 'Malta' || s.location === 'Mediterranean')
    ).reduce((sum, s) => sum + (s.atk || 0), 0);
    const targetAtk = italyAtk + 1;
    const medNeed = targetAtk - maltaAlliedAtk;
    if(medNeed > 0){
      const candidates = SHIPS.filter(s =>
        s.location === 'England' && s.side === 'allies' && !s.sunk && !s.removed &&
        s.type !== 'CONVOY' && !s.movedThisTurn && !(s.damage > 0)
      ).sort((a, b) => (b.atk || 0) - (a.atk || 0));
      let addedAtk = 0;
      for(const s of candidates){
        if(addedAtk >= medNeed) break;
        const roll = rollD6();
        if(roll < s.spd){
          s.location = 'Mediterranean';
          s.movedThisTurn = true;
          addedAtk += (s.atk || 0);
          aiLog.push(`${s.name}: England → 地中海 ⚂${roll}<${s.spd} 戦力補強+${s.atk} (累計+${addedAtk})`);
        } else {
          s.location = s.homePort || 'England';
          s.movedThisTurn = true;
          s.failedMove = true;
          aiLog.push(`${s.name}: England → 地中海 ⚂${roll}≥${s.spd} 失敗`);
        }
      }
      if((maltaAlliedAtk + addedAtk) < targetAtk){
        aiLog.push(`<b>地中海戦力不足: マルタ系${maltaAlliedAtk}+補強${addedAtk} < IT${italyAtk}+1</b>`);
      } else {
        aiLog.push(`地中海戦力: マルタ系${maltaAlliedAtk}+補強${addedAtk} ≥ IT${italyAtk}+1`);
      }
    } else if(medNeed < 0){
      // 過剰分: 地中海・マルタの弱い UK 艦を England へ戻す（+1 を下回らない範囲、Malta は最低2隻残す）
      const excess = -medNeed;
      const candidates = SHIPS.filter(s =>
        s.side === 'allies' && s.country === 'UK' && !s.sunk && !s.removed &&
        s.type !== 'CONVOY' && !s.movedThisTurn && !(s.damage > 0) &&
        (s.location === 'Mediterranean' || s.location === 'Malta')
      ).sort((a, b) => {
        if(a.location !== b.location) return a.location === 'Mediterranean' ? -1 : 1;
        return (a.atk || 0) - (b.atk || 0);
      });
      let removedAtk = 0;
      for(const s of candidates){
        if(removedAtk + (s.atk || 0) > excess) continue;
        if(s.location === 'Malta'){
          const remainingMalta = SHIPS.filter(x =>
            x !== s && x.location === 'Malta' && x.side === 'allies' && !x.sunk && !x.removed && x.type !== 'CONVOY'
          ).length;
          if(remainingMalta < 2) continue;
        }
        const fromLoc = s.location;
        s.location = 'England';
        s.movedThisTurn = true;
        removedAtk += (s.atk || 0);
        aiLog.push(`${s.name}: ${fromLoc === 'Malta' ? 'マルタ' : '地中海'} → England (戦力過剰 -${s.atk})`);
      }
      aiLog.push(`地中海戦力調整: マルタ系${maltaAlliedAtk}-過剰戻し${removedAtk} (目標 IT${italyAtk}+1)`);
    } else {
      aiLog.push(`地中海戦力ちょうど: マルタ系${maltaAlliedAtk} = IT${italyAtk}+1`);
    }
  }

  // === バレンツ配置: コンボイがバレンツにいる/到着予定の時のみ CV/CA 全派遣（地中海処理後の残り艦から） ===
  const convoysAtBarTotal = SHIPS.filter(s => s.type === 'CONVOY' && s.location === 'Barents' && !s.sunk && !s.removed).length;
  const convoysToBarTotal = SHIPS.filter(s => s.type === 'CONVOY' && s.location === 'NorthAtlantic' && !s.sunk && !s.removed && (s.turnsAtSea||0) >= 1).length;
  if(convoysAtBarTotal > 0 || convoysToBarTotal > 0){
    const barentsCandidates = SHIPS.filter(s =>
      s.side === 'allies' && !s.sunk && !s.removed && !s.movedThisTurn &&
      s.type !== 'CONVOY' && !(s.damage > 0) &&
      s.location && PORTS[s.location] && s.location !== 'Malta' &&
      (s.type === 'CV' || s.type === 'CA')
    );
    for(const s of barentsCandidates){
      // 2-hop到達判定: 隣接海域経由で Barents に届くか（spd>=7）
      const adjacent = PORT_SEAS[s.location] || [];
      const reachable1 = adjacent.includes('Barents');
      const reachable2 = s.spd >= 7 && adjacent.some(mid => (SEA_ADJ[mid] || []).includes('Barents'));
      if(!reachable1 && !reachable2) continue;
      s.location = 'Barents';
      s.movedThisTurn = true;
      aiLog.push(`${s.name}: ${s.homePort||'?'} → バレンツ海 (コンボイ護衛)`);
    }
  }

  // === 余艦分配: バレンツ配置後の残り艦を NA/SA へ均等配置 ===
  const _frenchDeCountLate = SHIPS.filter(s =>
    s.country === 'DE' && !s.sunk && !s.removed && s.type !== 'UBOAT' &&
    s.damage === 0 && s.location === 'France'
  ).length;
  const _saLimitLate = (seaControl['NorthSea'] === 'allies') ? (_frenchDeCountLate + 1) : Infinity;
  const _distCountsLate = { NorthAtlantic: 0, SouthAtlantic: 0 };
  SHIPS.forEach(s => {
    if(s.side === 'allies' && (s.location === 'NorthAtlantic' || s.location === 'SouthAtlantic')){
      _distCountsLate[s.location]++;
    }
  });
  const _surplus = SHIPS.filter(s =>
    s.side === 'allies' && !s.sunk && !s.removed && !s.movedThisTurn &&
    s.type !== 'CONVOY' && !(s.damage > 0) &&
    s.location && PORTS[s.location] && s.location !== 'Malta' &&
    !(s.country === 'US' && currentTurn < 4)
  );
  const _reachableLate = (ship, dest) => {
    if(ship.country === 'US' && ship.type !== 'CONVOY' && dest !== 'NorthAtlantic') return false;
    return (PORT_SEAS[ship.location] || []).includes(dest);
  };
  for(const ship of _surplus){
    const targets = ['NorthAtlantic', 'SouthAtlantic'].sort((a, b) => _distCountsLate[a] - _distCountsLate[b]);
    for(const t of targets){
      if(t === 'SouthAtlantic' && _distCountsLate.SouthAtlantic >= _saLimitLate) continue;
      if(_reachableLate(ship, t)){
        ship.location = t;
        ship.movedThisTurn = true;
        _distCountsLate[t]++;
        aiLog.push(`${ship.name} → ${SEA_LABEL[t]||t} (余艦)`);
        break;
      }
    }
  }

  if(!simMode) placeAllShips();

  // 枢軸数(Uボート除く)
  const axisCount = {};
  Object.keys(SEAS).forEach(k => {
    axisCount[k] = SHIPS.filter(s => s.side === 'axis' && s.location === k && !s.sunk && s.type !== 'UBOAT').length;
  });
  // 連合既配置数
  const allyCount = {};
  Object.keys(SEAS).forEach(k => {
    allyCount[k] = SHIPS.filter(s => s.side === 'allies' && s.location === k && !s.sunk).length;
  });
  // 不足数（枢軸 - 連合）
  const need = {};
  Object.keys(SEAS).forEach(k => need[k] = Math.max(0, axisCount[k] - allyCount[k]));
  // 14.1 船団の海域占有
  const convoyOccupied = new Set();
  SHIPS.forEach(s => {
    if(s.type === 'CONVOY' && SEAS[s.location] && !s.sunk && !s.removed) convoyOccupied.add(s.location);
  });
  // 既配置CV数
  const cvCount = {};
  Object.keys(SEAS).forEach(k => {
    cvCount[k] = SHIPS.filter(s => s.side === 'allies' && s.type === 'CV' && s.location === k && !s.sunk).length;
  });

  function reachable(ship, dest){
    // 6.6 バルト海はRU/DEのみ
    if(dest === 'Baltic' && ship.country !== 'RU' && ship.country !== 'DE') return null;
    // 15.1 ロシア艦はバルト海のみ
    if(ship.country === 'RU' && dest !== 'Baltic') return null;
    // 15.4 米国艦(船団除く)は北大西洋のみ
    if(ship.country === 'US' && ship.type !== 'CONVOY' && dest !== 'NorthAtlantic') return null;
    const adj = PORT_SEAS[ship.location] || [];
    if(adj.includes(dest)) return { adj:true, two:false };
    for(const s1 of adj){
      if((SEA_ADJ[s1] || []).includes(dest)) return { adj:false, two:true };
    }
    return null;
  }

  async function tryApply(ship, dest){
    // 既に移動済み（失敗含む）の艦は再試行しない
    if(ship.movedThisTurn) return false;
    const r = reachable(ship, dest);
    if(!r) return false;
    let success = true;
    if(ship.country === 'RU'){
      success = !!ship.canMoveThisTurn;
    }
    if(success && ship.country === 'US' && ship.type !== 'CONVOY'){
      if(currentTurn < 4){ aiLog.push(`${ship.name}: T4以降のみ`); success = false; }
      else if(!ship.usEntered){
        const v = rollD6();
        success = v === 6;
        aiLog.push(`${ship.name}: 米投入⚂${v}${success?'成功(永続)':'失敗'}`);
        alert(`${ship.name}: 米投入⚂${v} ${success ? '成功(永続)' : '失敗'}`);
        if(success) ship.usEntered = true;
      }
    }
    if(success && r.two){
      const v = rollD6();
      success = v < ship.spd;
      aiLog.push(`${ship.name}: 2海域⚂${v}<${ship.spd}=${success?'成功':'失敗'}`);
    }
    if(!success){
      ship.movedThisTurn = true;
      ship.failedMove = true;
      return false;
    }
    ship.location = dest;
    ship.movedThisTurn = true;
    allyCount[dest]++;
    if(need[dest] > 0) need[dest]--;
    if(ship.type === 'CV') cvCount[dest]++;
    aiLog.push(`${ship.name} → ${SEA_LABEL[dest]||dest}`);
    if(!simMode){
      placeAllShips();
      await new Promise(rs=>setTimeout(rs,180));
    }
    return true;
  }

  // 想定独最大戦力
  const deAlive = SHIPS.filter(s => s.country === 'DE' && !s.sunk && !s.removed && s.type !== 'UBOAT').length;
  const deDamaged = SHIPS.filter(s => s.country === 'DE' && !s.sunk && s.damage > 0 && s.type !== 'UBOAT').length;
  const deStrength = deAlive - deDamaged * 0.5; // 損害有り艦は半分換算
  const itAlive = SHIPS.filter(s => s.country === 'IT' && !s.sunk && !s.removed).length;
  const deNonUboat = deAlive + itAlive;
  const expectedThreat = Math.max(0, deNonUboat - 2);
  // Uボート数
  const uboatCount = {};
  Object.keys(SEAS).forEach(k => {
    uboatCount[k] = SHIPS.filter(s => s.type === 'UBOAT' && s.location === k && !s.sunk).length;
  });
  // コンボイ位置別カウント
  const convoysAtBarents = SHIPS.filter(s => s.type === 'CONVOY' && s.location === 'Barents' && !s.sunk && !s.removed).length;
  const convoysAtNA = SHIPS.filter(s => s.type === 'CONVOY' && s.location === 'NorthAtlantic' && !s.sunk && !s.removed).length;
  const convoysAtUSA = SHIPS.filter(s => s.type === 'CONVOY' && s.location === 'USA' && !s.sunk && !s.removed).length;

  // === 戦略総当たり評価 ===
  // 初期差分: axis 6 (NS+Bar+Bal) - allies 3 (NA+Med+SA) = -3
  const strategies = [];
  // ルート1: ロシア重点（コンボイ→Barents→ロシア +3、ロシア艦Bal +3スイング、Bar防衛）
  {
    let s = -3; // baseline
    s += 3 * convoysAtBarents; // 即時上陸
    s += 1.5 * convoysAtNA; // 50%確率で次T到達
    s += 3; // Bal制圧
    s += deStrength <= 6 ? 3 : 1; // Bar制圧（独弱なら高確率）
    strategies.push({ name:'Russia', score: s });
  }
  // ルート2: 大西洋・NS集中（コンボイ→英国 +1、NS制圧 +4スイング）
  {
    let s = -3;
    s += 1 * (convoysAtBarents + convoysAtNA + convoysAtUSA);
    s += deStrength <= 7 ? 4 : 2; // NS制圧（独強だと厳しい）
    strategies.push({ name:'England-NS', score: s });
  }
  // ルート3: NS総力決戦
  {
    let s = -3;
    s += deStrength <= 6 ? 5 : 1; // 決戦勝利でNS取れれば+1、+移動制限効果
    s += 1 * convoysAtUSA; // 英国上陸サブ
    strategies.push({ name:'NS-Decisive', score: s });
  }
  // ルート4: イタリア狩り（地中海集中、ITが地中海に居る時のみ有効）
  {
    let s = -3;
    s += axisCount['Mediterranean'] >= 3 ? 3 : 0; // IT地中海居れば殲滅で+3
    s += 1 * convoysAtUSA;
    strategies.push({ name:'Italy-Hunt', score: s });
  }
  // ルート5: バル/バレンツ封じ
  {
    let s = -3;
    s += 3; // Bar制圧
    s += 3; // Bal制圧
    s += 1 * convoysAtUSA;
    strategies.push({ name:'BarBal-Deny', score: s });
  }
  strategies.sort((a,b) => b.score - a.score);
  let chosenStrategy = strategies[0].name;
  // コンボイ無し時: 確率で「通常削り(70%) vs NS+BarBal積極(30%)」を選択
  const totalConvoys = convoysAtBarents + convoysAtNA + convoysAtUSA;
  if(totalConvoys === 0){
    chosenStrategy = Math.random() < 0.3 ? 'NoConvoy-Aggressive' : 'NoConvoy-Attrition';
  }
  aiLog.push(`<b>戦略選択: ${chosenStrategy}</b> | 候補スコア: ` + strategies.map(s=>`${s.name}=${s.score}`).join(', '));

  // 戦艦目標: 戦略により切り替え
  const bbTarget = {
    NorthAtlantic: 0, SouthAtlantic: 0, Mediterranean: 0, Barents: 0, NorthSea: 0
  };
  if(chosenStrategy === 'Russia'){
    bbTarget.Barents = convoyOccupied.has('Barents') ? Math.max(4, Math.ceil(deStrength * 0.6)) : 2;
    bbTarget.NorthAtlantic = Math.ceil(expectedThreat * 0.3);
    bbTarget.SouthAtlantic = Math.ceil(expectedThreat * 0.3);
    bbTarget.Mediterranean = Math.max(2, axisCount['Mediterranean']);
  } else if(chosenStrategy === 'England-NS'){
    bbTarget.NorthAtlantic = Math.ceil(expectedThreat * 0.4);
    bbTarget.SouthAtlantic = Math.ceil(expectedThreat * 0.4);
    bbTarget.NorthSea = Math.max(4, Math.ceil(deStrength * 0.5));
    bbTarget.Mediterranean = Math.max(2, axisCount['Mediterranean']);
  } else if(chosenStrategy === 'NS-Decisive'){
    bbTarget.NorthSea = Math.max(6, Math.ceil(deStrength * 0.8));
    bbTarget.NorthAtlantic = 1;
    bbTarget.SouthAtlantic = 1;
    bbTarget.Mediterranean = Math.max(2, axisCount['Mediterranean']);
  } else if(chosenStrategy === 'Italy-Hunt'){
    bbTarget.Mediterranean = Math.max(4, axisCount['Mediterranean'] + 1);
    bbTarget.NorthAtlantic = Math.ceil(expectedThreat * 0.3);
    bbTarget.SouthAtlantic = Math.ceil(expectedThreat * 0.3);
  } else if(chosenStrategy === 'BarBal-Deny'){
    bbTarget.Barents = Math.max(3, Math.ceil(deStrength * 0.4));
    bbTarget.NorthAtlantic = Math.ceil(expectedThreat * 0.3);
    bbTarget.SouthAtlantic = Math.ceil(expectedThreat * 0.3);
    bbTarget.Mediterranean = Math.max(2, axisCount['Mediterranean']);
  } else if(chosenStrategy === 'NoConvoy-Attrition'){
    // 削り重視・無理しない: 各海域に最低限、大西洋維持、Bar/NSに削り艦
    bbTarget.NorthAtlantic = Math.ceil(expectedThreat * 0.35);
    bbTarget.SouthAtlantic = Math.ceil(expectedThreat * 0.35);
    bbTarget.Mediterranean = Math.max(2, axisCount['Mediterranean']);
    bbTarget.Barents = 2; // spd7削り
    bbTarget.NorthSea = 0; // 嫌がらせ1隻のみ別処理
  } else if(chosenStrategy === 'NoConvoy-Aggressive'){
    // A+B: NS決戦 + Bar/Bal封じ
    bbTarget.NorthSea = Math.max(5, Math.ceil(deStrength * 0.5));
    bbTarget.Barents = Math.max(3, Math.ceil(deStrength * 0.3));
    bbTarget.NorthAtlantic = Math.ceil(expectedThreat * 0.2);
    bbTarget.SouthAtlantic = Math.ceil(expectedThreat * 0.2);
    bbTarget.Mediterranean = Math.max(2, axisCount['Mediterranean']);
  }
  // 地中海: Malta 艦で対抗できない不足分のみ他港から派遣
  const maltaAllyShips = SHIPS.filter(s => s.location === 'Malta' && s.side === 'allies' && !s.sunk && !s.removed && s.type !== 'CONVOY').length;
  bbTarget.Mediterranean = Math.max(0, axisCount['Mediterranean'] + 1 - maltaAllyShips);
  // 外部からの bbTarget 上書き（モンテカルロシミュレーション用）
  if(bbTargetOverride){
    Object.assign(bbTarget, bbTargetOverride);
  }
  const allyBB = {};
  Object.keys(SEAS).forEach(k => {
    allyBB[k] = SHIPS.filter(s => s.side === 'allies' && s.location === k && !s.sunk && (s.type === 'BB' || s.type === 'BC')).length;
  });
  // tryApplyラッパ: BB/CV配置時にカウンタ更新
  const origTryApply = tryApply;
  const tryApplyTracked = async (ship, dest) => {
    const ok = await origTryApply(ship, dest);
    if(ok && (ship.type === 'BB' || ship.type === 'BC')) allyBB[dest] = (allyBB[dest]||0) + 1;
    return ok;
  };

  // 1a-1) 損害コンボイ NA → England 上陸 (POC +1 連合)
  for(const ship of SHIPS.filter(s => s.type === 'CONVOY' && s.side === 'allies' && !s.sunk && !s.removed && !s.movedThisTurn && s.location === 'NorthAtlantic' && s.damage > 0)){
    ship.location = 'England';
    ship.removed = true;
    ship.movedThisTurn = true;
    convoyOccupied.delete('NorthAtlantic');
    poc = Math.max(-10, Math.min(10, poc + 1));
    aiLog.push(`<b>${ship.name}: 損害により England 上陸 +1POC(連合)</b>`);
    if(!simMode){
      placeAllShips();
      await new Promise(rs=>setTimeout(rs,180));
    }
  }
  // 1a-2) 無傷船団 NA→バレンツ海（海上2ターン目以降、ロシア向け）
  for(const ship of SHIPS.filter(s => s.type === 'CONVOY' && s.side === 'allies' && !s.sunk && !s.removed && !s.movedThisTurn && s.location === 'NorthAtlantic' && (s.turnsAtSea||0) >= 1 && s.damage === 0)){
    if(convoyOccupied.has('Barents')) continue;
    ship.location = 'Barents';
    ship.movedThisTurn = true;
    convoyOccupied.add('Barents');
    convoyOccupied.delete('NorthAtlantic');
    allyCount['Barents'] = (allyCount['Barents']||0) + 1;
    aiLog.push(`<b>${ship.name} → バレンツ海(ロシア向)</b>`);
    if(!simMode){
      placeAllShips();
      await new Promise(rs=>setTimeout(rs,180));
    }
  }
  // 1b) 船団 USA→NA
  for(const ship of movable.filter(s => s.type === 'CONVOY')){
    if(ship.location === 'USA' && !convoyOccupied.has('NorthAtlantic')){
      if(await tryApplyTracked(ship, 'NorthAtlantic')) convoyOccupied.add('NorthAtlantic');
    }
  }

  // 2) 母港固定艦 (Leningrad→Baltic, Russia→Barents)
  for(const ship of movable.filter(s => s.type !== 'CONVOY' && (s.location==='Leningrad'||s.location==='Russia'))){
    if(ship.movedThisTurn) continue;
    const dest = ship.location==='Leningrad'?'Baltic':'Barents';
    await tryApplyTracked(ship, dest);
  }

  // 3) Malta艦のBB/CA→地中海 (CVは後で)
  for(const ship of movable.filter(s => s.location==='Malta' && s.type !== 'CV' && s.type !== 'CONVOY' && !s.movedThisTurn)){
    await tryApplyTracked(ship, 'Mediterranean');
  }

  // 4) 戦艦割当（spd7+優先で先に処理、Barents/NSも目標あれば配置）
  const bbsAtPort = movable.filter(s => (s.type === 'BB' || s.type === 'BC') && !s.movedThisTurn);
  bbsAtPort.sort((a,b) => b.spd - a.spd); // 高速優先
  for(const bb of bbsAtPort){
    const targets = ['NorthAtlantic','SouthAtlantic','Mediterranean'];
    if((bbTarget.Barents||0) > 0 || convoyOccupied.has('Barents')) targets.unshift('Barents');
    if((bbTarget.NorthSea||0) > 0) targets.push('NorthSea');
    targets.sort((a,b) => {
      const nA = Math.max(0, (bbTarget[a]||0)-allyBB[a]);
      const nB = Math.max(0, (bbTarget[b]||0)-allyBB[b]);
      // 同需要なら spd<7 はBarents/NSを後回し
      if(nA === nB){
        const dangerA = (a==='Barents'||a==='NorthSea') ? 1 : 0;
        const dangerB = (b==='Barents'||b==='NorthSea') ? 1 : 0;
        if(bb.spd < 7) return dangerA - dangerB;
      }
      return nB - nA;
    });
    for(const target of targets){
      const need2 = Math.max(0, (bbTarget[target]||0) - allyBB[target]);
      if(need2 <= 0) continue;
      if(await tryApplyTracked(bb, target)) break;
    }
  }

  // 5) 空母配置: バレンツ海最優先、行けないなら北海・大西洋。護衛3隻以上必須
  const axisLbaSeas = ['Barents','Baltic','Mediterranean']; // 枢軸LBA射程
  const nonCvAllyCount = (k) => SHIPS.filter(s => s.side==='allies' && s.location===k && !s.sunk && s.type!=='CV' && s.type!=='CONVOY').length;
  const cvsAtPort = movable.filter(s => s.type === 'CV' && !s.movedThisTurn);
  for(const cv of cvsAtPort){
    const targets = ['Barents','NorthSea','NorthAtlantic'];
    for(const target of targets){
      // 護衛: 敵殴り込みに耐える数（敵艦数+1、最低3隻）
      const requiredEscort = Math.max(3, axisCount[target] + 1);
      if(nonCvAllyCount(target) < requiredEscort) continue;
      if(await tryApplyTracked(cv, target)) break;
    }
  }

  // 5.5) 重巡(CA)配置: バレンツ海最優先、行けないなら北海・大西洋
  const casAtPort = movable.filter(s => s.type === 'CA' && !s.movedThisTurn);
  for(const ca of casAtPort){
    const targets = ['Barents','NorthSea','NorthAtlantic'];
    for(const target of targets){
      if(await tryApplyTracked(ca, target)) break;
    }
  }

  // 6) 巡洋艦/その他: 戦艦のいる主要海域に随伴配置（バレンツは CV/CA 専用のため除外）
  const primary = ['NorthAtlantic','SouthAtlantic'];
  const others = movable.filter(s => s.type !== 'CV' && s.type !== 'CONVOY' && s.type !== 'BB' && s.type !== 'BC' && s.type !== 'CA' && !s.movedThisTurn);
  for(const ship of others){
    // この艦が選べる候補のみ（spd<7はBarents/NS除外）
    const myPrimary = primary.filter(p => ship.spd >= 7 || (p !== 'Barents' && p !== 'NorthSea'));
    myPrimary.sort((a,b) => {
      const aHas = allyBB[a] > 0 ? 1 : 0;
      const bHas = allyBB[b] > 0 ? 1 : 0;
      if(aHas !== bHas) return bHas - aHas;
      return allyCount[a] - allyCount[b];
    });
    let placed = false;
    for(const target of myPrimary){
      if(allyBB[target] === 0) continue;
      if(await tryApplyTracked(ship, target)){ placed = true; break; }
    }
    if(placed) continue;
    for(const target of myPrimary){
      if(await tryApplyTracked(ship, target)){ placed = true; break; }
    }
    if(placed) continue;
    // spd7+のみBarents追加投入
    if(ship.spd >= 7){
      if(await tryApplyTracked(ship, 'Barents')){ placed = true; }
    }
  }

  // 6.5) 北海への嫌がらせ: spd7+艦を1隻（追撃回避）
  const nsHasAlly = SHIPS.some(s => s.side === 'allies' && s.location === 'NorthSea' && !s.sunk);
  if(!nsHasAlly){
    const harassPool = SHIPS.filter(s => s.side === 'allies' && !s.sunk && !s.removed && !s.movedThisTurn && PORTS[s.location] && s.type !== 'CONVOY' && s.type !== 'CV' && s.country !== 'RU' && s.country !== 'US' && s.spd >= 7);
    harassPool.sort((a,b) => (a.atk + a.def) - (b.atk + b.def));
    for(const ship of harassPool){
      if(await tryApplyTracked(ship, 'NorthSea')) break;
    }
  }

  // 7) 余剰艦: spd7+のみBarents/NS、遅艦は安全海域へ
  const primaryFilled = primary.every(k => allyBB[k] >= (bbTarget[k]||0));
  if(primaryFilled){
    const surplus = SHIPS.filter(s => s.side === 'allies' && !s.sunk && !s.removed && !s.movedThisTurn && PORTS[s.location] && s.type !== 'CONVOY');
    for(const ship of surplus){
      if(ship.spd >= 7){
        if(await tryApplyTracked(ship, 'Barents')) continue;
        if(await tryApplyTracked(ship, 'NorthSea')) continue;
      } else {
        // 遅艦は安全海域へ（NA/SA/Med）
        const safe = ['NorthAtlantic','SouthAtlantic','Mediterranean'];
        for(const target of safe){
          if(await tryApplyTracked(ship, target)) break;
        }
      }
    }
  }

  // 修理: phase 4 で手動処理（AI自動修理なし）

  if(!simMode){
    document.getElementById('aiLog').innerHTML = aiLog.join('<br>');
    // moveStatus にも出して可視化（連合軍AIセクション非表示対応）
    const ms = document.getElementById('moveStatus');
    if(ms) ms.innerHTML = aiLog.join('<br>');
  }
}

// 枢軸軍AI移動 + 修理
async function aiAxisMove(){
  const aiLog = [];
  // 連合艦の海域別 (Uボート除く)
  const allyShips = {};
  const allyStr = {}; // 戦力 (atk + def 合計)
  Object.keys(SEAS).forEach(k => {
    allyShips[k] = SHIPS.filter(s => s.side === 'allies' && s.location === k && !s.sunk && s.type !== 'UBOAT');
    allyStr[k] = allyShips[k].reduce((sum, s) => sum + s.atk + s.def, 0);
  });
  const convoy = {};
  Object.keys(SEAS).forEach(k => {
    convoy[k] = SHIPS.filter(s => s.type === 'CONVOY' && s.side === 'allies' && s.location === k && !s.sunk).length;
  });
  // 移動可能枢軸艦 (港にいる + 海域に残っている給油成功艦も含む、損傷艦は除外)
  const movable = SHIPS.filter(s =>
    s.side === 'axis' && !s.sunk && !s.removed && !s.movedThisTurn && (PORTS[s.location] || SEAS[s.location]) &&
    !(s.damage > 0)
  );
  // ドイツ水上艦 / イタリア / Uボート 分類
  const deShips = movable.filter(s => s.country === 'DE' && s.type !== 'UBOAT');
  const itShips = movable.filter(s => s.country === 'IT');
  const uboats = movable.filter(s => s.type === 'UBOAT');
  // 既配置枢軸戦力 (海域別)
  const placedStr = {};
  Object.keys(SEAS).forEach(k => {
    placedStr[k] = SHIPS.filter(s => s.side === 'axis' && s.location === k && !s.sunk && s.type !== 'UBOAT').reduce((sum, s) => sum + s.atk + s.def, 0);
  });

  // === ドイツ水上艦配置 ===
  // 港別の到達可能海域
  const portToSeas = (port) => PORT_SEAS[port] || [];
  // 必勝マージン: 連合戦力 + 5
  const winThreshold = (sea) => allyStr[sea] + 5;

  // 配置優先度を決定
  // 1. 北海・バルト = 最優先 (必勝戦力まで)
  // 2. バレンツ・北大西洋・南大西洋 はコンボイ位置で優先決定
  const priorityList = ['NorthSea', 'Baltic'];
  // コンボイがいる海域を勝率順 (連合戦力低い順) でリスト化
  const convoySeas = ['Barents', 'NorthAtlantic', 'SouthAtlantic'].filter(k => convoy[k] > 0);
  convoySeas.sort((a, b) => allyStr[a] - allyStr[b]); // 連合戦力低い順 = 勝率高い順
  // コンボイあり海域を優先リストに追加
  priorityList.push(...convoySeas);
  // 残りバレンツ (コンボイ無し時) は最後
  if(!convoy.Barents && !priorityList.includes('Barents')) priorityList.push('Barents');

  // ドイツ艦を BB > BC > PB > CA > CV の順で大型から配置
  const typeOrder = { BB: 0, BC: 1, PB: 2, CA: 3, CV: 4 };
  const sortedDe = [...deShips].sort((a, b) => (typeOrder[a.type] ?? 5) - (typeOrder[b.type] ?? 5));

  for(const ship of sortedDe){
    const reachable = portToSeas(ship.location);
    // 優先度順で必勝戦力に未達の海域を探す
    let dest = null;
    for(const target of priorityList){
      if(!reachable.includes(target)) continue;
      if(placedStr[target] < winThreshold(target)){
        dest = target;
        break;
      }
    }
    // 優先海域全部が必勝達成済みなら、コンボイ無しバレンツに余裕配置
    if(!dest && reachable.includes('Barents') && placedStr.Barents < allyStr.Barents + 3){
      dest = 'Barents';
    }
    if(!dest) continue; // 配置先無し → 港待機
    ship.location = dest;
    ship.movedThisTurn = true;
    placedStr[dest] += ship.atk + ship.def;
    aiLog.push(`${ship.name} → ${SEA_LABEL[dest]}`);
  }

  // === イタリア配置 ===
  const itTotalStr = itShips.reduce((sum, s) => sum + s.atk + s.def, 0);
  const medAllyStr = allyStr.Mediterranean;
  // 攻撃判定: 1.1倍以上で出撃 / 2.0倍以上で積極攻撃 (CAも南大西洋等へ展開)
  if(itTotalStr >= medAllyStr * 1.1){
    const aggressive = itTotalStr >= medAllyStr * 2.0;
    for(const ship of itShips){
      if(!portToSeas(ship.location).includes('Mediterranean')) continue;
      // 積極攻撃: CAは南大西洋の連合艦が弱いなら派遣
      if(aggressive && ship.type === 'CA' && allyStr.SouthAtlantic < itShips.filter(s => s.type==='CA').reduce((sum, s)=>sum+s.atk+s.def,0)){
        // CAのみ南大西洋へ
        ship.location = 'SouthAtlantic';
        ship.movedThisTurn = true;
        aiLog.push(`${ship.name} → 南大西洋 (積極攻撃)`);
        continue;
      }
      ship.location = 'Mediterranean';
      ship.movedThisTurn = true;
      aiLog.push(`${ship.name} → 地中海 (出撃)`);
    }
    if(aggressive) aiLog.push(`イタリア: 積極攻撃モード (戦力${itTotalStr} vs 連合${medAllyStr})`);
  } else {
    aiLog.push(`イタリア: 出撃見送り (戦力${itTotalStr} vs 連合${medAllyStr})`);
  }

  // === Uボート配置 ===
  const uboatsInPortCount = SHIPS.filter(s => s.type === 'UBOAT' && s.location === 'Germany' && !s.sunk && !s.removed).length;
  // 連合のASW戦力推定: 連合艦数 (CV/CONVOY=3, 他=1) per sea
  const aswDice = (sea) => allyShips[sea].reduce((sum, s) => sum + ((s.type === 'CV' || s.type === 'CONVOY') ? 3 : 1), 0);
  // バレンツ海のコンボイ最優先
  let uTarget = null;
  if(convoy.Barents > 0){
    uTarget = 'Barents';
  } else if(uboatsInPortCount >= 7){
    // 7隻溜まったら他のコンボイ海域 or ドイツ攻撃エリア
    if(convoy.NorthAtlantic > 0) uTarget = 'NorthAtlantic';
    else if(convoy.SouthAtlantic > 0) uTarget = 'SouthAtlantic';
    else {
      // ドイツ艦の集中先を探す
      const deSeas = ['NorthSea', 'Baltic', 'Barents', 'NorthAtlantic'];
      const deTarget = deSeas.find(k => placedStr[k] > allyStr[k]);
      uTarget = deTarget;
    }
  }
  if(uTarget){
    // ASW期待損失を試算: aswDice * 1/6 = 撃沈期待数
    const expectedSunk = aswDice(uTarget) / 6;
    const uboatsAvail = uboats.filter(s => portToSeas(s.location).includes(uTarget));
    if(uboatsAvail.length > expectedSunk){
      // 攻撃可能性ある
      for(const u of uboatsAvail){
        u.location = uTarget;
        u.movedThisTurn = true;
        aiLog.push(`${u.name} → ${SEA_LABEL[uTarget]}`);
      }
    } else {
      aiLog.push(`Uボート: ${SEA_LABEL[uTarget]} 出撃見送り (ASW${aswDice(uTarget)}ダイス)`);
    }
  } else {
    aiLog.push(`Uボート: 温存 (港${uboatsInPortCount}隻)`);
  }

  // 修理: phase 4 で手動処理（AI自動修理なし）

  placeAllShips();
  if(!simMode){
    document.getElementById('moveStatus').innerHTML = aiLog.join('<br>');
  }
}

// 枢軸の簡易AI（シミュレーション用）
function simulateAxisMove(){
  const alliedBalCount = SHIPS.filter(s => s.side === 'allies' && s.location === 'Baltic' && !s.sunk).length;
  const alliedNSCount = SHIPS.filter(s => s.side === 'allies' && s.location === 'NorthSea' && !s.sunk).length;
  const dePool = SHIPS.filter(s => s.country === 'DE' && s.type !== 'UBOAT' && !s.sunk && !s.removed && PORTS[s.location]);
  // バルト: 連合と同数
  let toBal = 0;
  for(const s of dePool){
    if(toBal >= alliedBalCount) break;
    s.location = 'Baltic'; s.movedThisTurn = true; toBal++;
  }
  // 北海: 連合と同数
  let toNS = 0;
  for(const s of dePool){
    if(s.movedThisTurn) continue;
    if(toNS >= alliedNSCount) break;
    s.location = 'NorthSea'; s.movedThisTurn = true; toNS++;
  }
  // 残り: ランダムでNA/SA/Bar/NSに集中
  const concChoices = ['NorthAtlantic','SouthAtlantic','Barents','NorthSea'];
  const concentrate = concChoices[Math.floor(Math.random()*concChoices.length)];
  for(const s of dePool){
    if(s.movedThisTurn) continue;
    s.location = concentrate; s.movedThisTurn = true;
  }
  // Uボート: 集中先と同じ
  SHIPS.filter(s => s.type === 'UBOAT' && !s.sunk && !s.removed && s.location === 'Germany').forEach(s => {
    s.location = concentrate; s.movedThisTurn = true;
  });
  // IT: 地中海
  SHIPS.filter(s => s.country === 'IT' && !s.sunk && !s.removed && s.location === 'Italy').forEach(s => {
    s.location = 'Mediterranean'; s.movedThisTurn = true;
  });
  return concentrate;
}

// 100回シミュレーション
async function runSimulation100(){
  const N = 100;
  const results = [];
  const concDist = {};
  // 元の状態保存
  const savedShips = SHIPS.map(s => ({...s}));
  const savedPoc = poc;
  const savedTurn = currentTurn;
  const savedLba = {...lbaUsed};
  const savedSeaCtrl = {...seaControl};
  const savedRetreat = new Set(retreatedSeas);

  simMode = true;
  try {
    for(let i=0; i<N; i++){
      // ターン5・無傷・全艦母港にリセット
      SHIPS.forEach((s, idx) => {
        const o = savedShips[idx];
        Object.assign(s, o);
        s.location = s.homePort;
        s.damage = 0; s.sunk = false; s.removed = false; s.atDock = false;
        s.movedThisTurn = false; s.disabled = false; s.disabledThisTurn = false;
        s.atk = s.atkOrig; s.spd = s.spdOrig;
        s.turnsAtSea = 0; s.failedMove = false; s.usEntered = false;
        s.refuelTurn = undefined; s.arrivedNeutralTurn = undefined;
      });
      currentTurn = 5;
      Object.keys(seaControl).forEach(k => delete seaControl[k]);
      lbaUsed.allies = false; lbaUsed.axis = false;
      retreatedSeas.clear();

      // 連合AI移動
      await aiAlliedMove();
      // 枢軸移動
      const conc = simulateAxisMove();
      concDist[conc] = (concDist[conc]||0) + 1;
      // 戦闘解決
      const evs = [];
      resolveAllCombat(evs);
      // POC計算
      let pocChange = 0;
      Object.keys(SEAS).forEach(k => {
        const ships = SHIPS.filter(s => s.location === k && !s.sunk);
        const al = ships.some(s => s.side === 'allies' && s.type !== 'UBOAT');
        const ax = ships.some(s => s.side === 'axis' && s.type !== 'UBOAT');
        const ub = ships.some(s => s.type === 'UBOAT');
        if(al && !ax && !ub) pocChange += SEAS[k].allies;
        else if(ax && !al) pocChange -= SEAS[k].axis;
        else if(ub && !ax && !al) pocChange -= SEAS[k].axis;
      });
      results.push(pocChange);
    }
  } finally {
    simMode = false;
    // 状態復元
    SHIPS.forEach((s, idx) => {
      const o = savedShips[idx];
      Object.keys(s).forEach(k => delete s[k]);
      Object.assign(s, o);
    });
    poc = savedPoc; currentTurn = savedTurn;
    Object.keys(seaControl).forEach(k => delete seaControl[k]);
    Object.assign(seaControl, savedSeaCtrl);
    lbaUsed.allies = savedLba.allies; lbaUsed.axis = savedLba.axis;
    retreatedSeas.clear();
    savedRetreat.forEach(s => retreatedSeas.add(s));
    placeAllShips();
    updatePOC();
  }

  const avg = results.reduce((a,b)=>a+b,0) / results.length;
  const min = Math.min(...results);
  const max = Math.max(...results);
  const win = results.filter(r => r > 0).length;
  const lose = results.filter(r => r < 0).length;
  const draw = results.filter(r => r === 0).length;
  const distLog = Object.entries(concDist).map(([k,v]) => `${SEA_LABEL[k]||k}:${v}`).join(' / ');
  alert(`100回シミュレーション結果:\n平均POC: ${avg.toFixed(2)}\n最小: ${min}  最大: ${max}\n連合勝(POC>0): ${win}回\n引分: ${draw}回\n枢軸勝: ${lose}回\n枢軸集中先分布: ${distLog}`);
}

// === 連合配置 ルールベース ===
// コンボイあり: 北海=ドイツ艦数+1〜2(強い順), バレンツ=CV/CA全派遣, NA=余艦全派遣, SA=単独CA1隻
// コンボイなし: NA/Bar=単独CA1隻, SA=単独CA1隻, 北海=残艦
//   北海でドイツ艦数 > 連合艦数なら捨てる → 余艦 NA+Bar:SA = 7:3
function computeAlliedConfig(){
  const config = {};
  const movableShips = SHIPS.filter(s =>
    s.side === 'allies' && !s.sunk && !s.removed &&
    s.location && PORTS[s.location] && s.type !== 'CONVOY' &&
    s.location !== 'Malta' &&
    !(s.country === 'US' && currentTurn < 4) &&
    !(s.damage > 0)
  );
  const cvs = movableShips.filter(s => s.type === 'CV');
  const cas = movableShips.filter(s => s.type === 'CA');
  const bbs = movableShips.filter(s => s.type === 'BB' || s.type === 'BC');
  const sortByWeak = arr => [...arr].sort((a, b) => {
    const ta = (a.atk||0) + (a.def||0);
    const tb = (b.atk||0) + (b.def||0);
    if(ta !== tb) return ta - tb;
    return (a.spd||0) - (b.spd||0);
  });
  const sortByStrong = arr => [...arr].sort((a, b) => {
    const ta = (a.atk||0) + (a.def||0);
    const tb = (b.atk||0) + (b.def||0);
    if(tb !== ta) return tb - ta;
    return (b.spd||0) - (a.spd||0);
  });
  const casByWeak = sortByWeak(cas);
  const bbsByWeak = sortByWeak(bbs);
  const reachable = (s, sea) => {
    if(s.country === 'US' && s.type !== 'CONVOY' && sea !== 'NorthAtlantic') return false;
    return (PORT_SEAS[s.location] || []).includes(sea);
  };
  const reachableTwoHops = (s, dest) => {
    if(s.country === 'US' && s.type !== 'CONVOY' && dest !== 'NorthAtlantic') return false;
    if(reachable(s, dest)) return true;
    if(s.spd < 7) return false;
    const adjacent = PORT_SEAS[s.location] || [];
    return adjacent.some(mid => (SEA_ADJ[mid] || []).includes(dest));
  };

  // ドイツ艦数（ドイツ/フランス在泊・無傷）とコンボイ位置
  const deShipCount = SHIPS.filter(s =>
    s.country === 'DE' && !s.sunk && !s.removed && s.type !== 'UBOAT' &&
    s.damage === 0 && (s.location === 'Germany' || s.location === 'France')
  ).length;
  const convoysAtBar = SHIPS.filter(s => s.type === 'CONVOY' && s.location === 'Barents' && !s.sunk && !s.removed).length;
  const convoysAtNA = SHIPS.filter(s => s.type === 'CONVOY' && s.location === 'NorthAtlantic' && !s.sunk && !s.removed).length;
  const convoysToBar = SHIPS.filter(s => s.type === 'CONVOY' && s.location === 'NorthAtlantic' && !s.sunk && !s.removed && (s.turnsAtSea||0) >= 1).length;
  const hasBarConvoy = convoysAtBar > 0 || convoysToBar > 0;
  const hasConvoy = convoysAtBar > 0 || convoysAtNA > 0;

  // === 優先順序: 北海 → バレンツ(コンボイあれば) → 南大西洋 → 北大西洋 ===

  // 1) 北海最優先: ドイツ攻撃力(独/仏在泊・無傷DE艦)以上の攻撃力 + 1隻
  const deAtkSum = SHIPS.filter(s =>
    s.country === 'DE' && !s.sunk && !s.removed && s.type !== 'UBOAT' &&
    s.damage === 0 && (s.location === 'Germany' || s.location === 'France')
  ).reduce((sum, s) => sum + (s.atk||0), 0);
  const reachableForNS = (s) => !config[s.id] && reachable(s, 'NorthSea');
  let nsAtkSum = 0;
  for(const s of sortByStrong(bbs.filter(reachableForNS))){
    if(nsAtkSum >= deAtkSum) break;
    config[s.id] = 'NorthSea';
    nsAtkSum += (s.atk||0);
  }
  if(nsAtkSum < deAtkSum){
    for(const s of sortByStrong([...cvs, ...cas].filter(reachableForNS))){
      if(nsAtkSum >= deAtkSum) break;
      config[s.id] = 'NorthSea';
      nsAtkSum += (s.atk||0);
    }
  }
  const extra = sortByStrong([...bbs, ...cvs, ...cas].filter(reachableForNS))[0];
  if(extra) config[extra.id] = 'NorthSea';

  // 2) バレンツは aiAlliedMove で地中海の後に配置（順序: 北海 → 地中海 → バレンツ → NA → SA）

  // 3) 南大西洋: フランス/中立にいるドイツ艦と同数（弱い艦優先）
  const deAtFranceNeutral = SHIPS.filter(s =>
    s.country === 'DE' && !s.sunk && !s.removed && s.type !== 'UBOAT' &&
    (s.location === 'France' || s.location === 'Neutral')
  ).length;
  if(deAtFranceNeutral > 0){
    const saCandidates = sortByWeak([...cas, ...bbs]).filter(s => !config[s.id] && reachable(s, 'SouthAtlantic'));
    let saPlaced = 0;
    for(const s of saCandidates){
      if(saPlaced >= deAtFranceNeutral) break;
      config[s.id] = 'SouthAtlantic';
      saPlaced++;
    }
  }

  // 4) 北大西洋: コンボイなしの時は単独 CA 1隻
  if(!hasConvoy){
    let shipForNA = casByWeak.find(s => reachable(s, 'NorthAtlantic') && !config[s.id]);
    if(!shipForNA) shipForNA = bbsByWeak.find(s => reachable(s, 'NorthAtlantic') && !config[s.id]);
    if(shipForNA) config[shipForNA.id] = 'NorthAtlantic';
  }

  // アメリカ来訪時: NAに到着済みの US 戦闘艦と同数のUK艦を NS（barConvoyありなら Barents 可）へ追加配置
  const usCount = SHIPS.filter(s =>
    s.country === 'US' && s.type !== 'CONVOY' && !s.sunk && !s.removed && s.location === 'NorthAtlantic'
  ).length;
  if(usCount > 0){
    let placed = 0;
    const ukAvail = sortByStrong(movableShips.filter(s => s.country === 'UK' && !config[s.id]));
    for(const s of ukAvail){
      if(placed >= usCount) break;
      if(convoysAtBar > 0 && reachableTwoHops(s, 'Barents')){
        config[s.id] = 'Barents';
        placed++;
      } else if(reachable(s, 'NorthSea')){
        config[s.id] = 'NorthSea';
        placed++;
      }
    }
  }

  // 余艦分配は aiAlliedMove のバレンツ配置の後で実施（順序: 北海 → 地中海 → バレンツ → 余艦NA/SA）

  // ログ
  const dist = {};
  Object.values(config).forEach(sea => { dist[sea] = (dist[sea]||0) + 1; });
  console.log(`[配置決定] コンボイ=${hasConvoy?'あり':'なし'} ドイツ艦=${deShipCount} 配置=${JSON.stringify(dist)} 配置艦=${Object.keys(config).length}隻`);
  return config;
}

// === 連合配置 真のモンテカルロ（各艦を完全ランダム配置 N=500回試行） ===
// 戻り値: bestConfig = { shipId: 'NorthSea' | 'NorthAtlantic' | ... }
async function selectBestAlliedPattern(){
  const N = 500;
  // 状態保存
  const savedShips = SHIPS.map(s => ({...s}));
  const savedPoc = poc;
  const savedTurn = currentTurn;
  const savedLba = {...lbaUsed};
  const savedSeaCtrl = {...seaControl};
  const savedRetreat = new Set(retreatedSeas);

  // 配置候補艦と各艦の reachable 海域（コンボイ・Malta艦・Russia艦・US艦(T<4)は除外）
  const targetSeas = ['NorthSea', 'NorthAtlantic', 'SouthAtlantic', 'Barents'];
  const movableShips = SHIPS.filter(s =>
    s.side === 'allies' && !s.sunk && !s.removed &&
    s.location && PORTS[s.location] && s.type !== 'CONVOY' &&
    s.location !== 'Malta' &&
    !(s.country === 'US' && currentTurn < 4)
  );
  const shipReachable = movableShips.map(s => ({
    id: s.id,
    reachable: (PORT_SEAS[s.location] || []).filter(sea => targetSeas.includes(sea))
  })).filter(s => s.reachable.length > 0);

  let bestPoc = -Infinity;
  let bestConfig = null;
  simMode = true;
  try {
    for(let i = 0; i < N; i++){
      // 艦リセット
      SHIPS.forEach((s, idx) => {
        const o = savedShips[idx];
        Object.keys(s).forEach(k => delete s[k]);
        Object.assign(s, o);
      });
      Object.keys(seaControl).forEach(k => delete seaControl[k]);
      lbaUsed.allies = false; lbaUsed.axis = false;
      retreatedSeas.clear();

      // 各艦の配置先をランダム決定
      const config = {};
      for(const sr of shipReachable){
        config[sr.id] = sr.reachable[Math.floor(Math.random() * sr.reachable.length)];
      }

      // 配置適用
      for(const shipId in config){
        const ship = SHIPS.find(s => s.id === shipId);
        if(!ship) continue;
        ship.location = config[shipId];
        ship.movedThisTurn = true;
      }

      // 枢軸移動・戦闘
      simulateAxisMove();
      const evs = [];
      resolveAllCombat(evs);

      // POC計算
      let pocChange = 0;
      Object.keys(SEAS).forEach(k => {
        const ships = SHIPS.filter(s => s.location === k && !s.sunk);
        const al = ships.some(s => s.side === 'allies' && s.type !== 'UBOAT');
        const ax = ships.some(s => s.side === 'axis' && s.type !== 'UBOAT');
        const ub = ships.some(s => s.type === 'UBOAT');
        if(al && !ax && !ub) pocChange += SEAS[k].allies;
        else if(ax && !al) pocChange -= SEAS[k].axis;
        else if(ub && !ax && !al) pocChange -= SEAS[k].axis;
        else if(!al && !ax && !ub) pocChange -= SEAS[k].axis; // ガラ空きは枢軸支配扱い
      });

      if(pocChange > bestPoc){
        bestPoc = pocChange;
        bestConfig = {...config};
      }
    }
  } finally {
    simMode = false;
    // 状態復元
    SHIPS.forEach((s, idx) => {
      const o = savedShips[idx];
      Object.keys(s).forEach(k => delete s[k]);
      Object.assign(s, o);
    });
    poc = savedPoc;
    currentTurn = savedTurn;
    Object.keys(seaControl).forEach(k => delete seaControl[k]);
    Object.assign(seaControl, savedSeaCtrl);
    lbaUsed.allies = savedLba.allies;
    lbaUsed.axis = savedLba.axis;
    retreatedSeas.clear();
    savedRetreat.forEach(s => retreatedSeas.add(s));
  }
  // 配置数の集計（ログ用）
  const distLog = {};
  if(bestConfig) Object.values(bestConfig).forEach(sea => { distLog[sea] = (distLog[sea]||0) + 1; });
  console.log(`[モンテカルロ] N=${N}試行 最良POC=${bestPoc} 配置数=${JSON.stringify(distLog)} 配置艦=${Object.keys(bestConfig||{}).length}隻`);
  return bestConfig;
}

function executeMove(){
  if(!selectedShipIds.length || !selectedDest){
    alert('艦と移動先を選択してください');
    return;
  }
  const log = [];
  selectedShipIds.forEach(id=>{
    const s = SHIPS.find(x => x.id === id);
    if(!s) return;
    // 15.2 ロシア艦は5/6で出港
    if(s.country === 'RU'){
      const r = rollD6();
      if(r < 5){
        log.push(`${s.name}: 出港判定⚂${r}<5 失敗 → 移動不可`);
        s.movedThisTurn = true; // 試みたので移動済み扱い
        return;
      }
      log.push(`${s.name}: 出港判定⚂${r}≥5 成功`);
    }
    // 15.3 米国艦はターン4以降、6で永続投入
    if(s.country === 'US' && s.type !== 'CONVOY'){
      if(currentTurn < 4){
        log.push(`${s.name}: ターン4以降に出撃可`);
        s.movedThisTurn = true;
        return;
      }
      if(!s.usEntered){
        const r = rollD6();
        if(r !== 6){
          log.push(`${s.name}: 投入判定⚂${r}≠6 失敗`);
          s.movedThisTurn = true;
          return;
        }
        s.usEntered = true;
        log.push(`${s.name}: 投入判定⚂${r}=6 成功(永続)`);
      }
    }
    const origin = s.location;
    const dest = selectedDest;
    // 移動済みフラグ＆起点記憶
    if(!s.originThisTurn) s.originThisTurn = origin;
    s.movedThisTurn = true;
    // 隣接判定
    let adj = [];
    if(PORTS[origin]) adj = PORT_SEAS[origin] || [];
    else if(SEAS[origin]) adj = SEA_ADJ[origin] || [];
    const isAdjacent = adj.includes(dest);
    const isPortDest = !!PORTS[dest];
    if(s.type === 'UBOAT'){
      // 6.5 Uボートはどこでも自由配置、判定なし
      s.location = dest;
      if(dest === 'Neutral') s.arrivedNeutralTurn = currentTurn;
      log.push(`${s.name}: Uボート → ${locLabel(dest)}`);
    } else if(isAdjacent || isPortDest){
      // 1海域 or 港湾帰還: 判定なし
      s.location = dest;
      if(dest === 'Neutral') s.arrivedNeutralTurn = currentTurn;
      log.push(`${s.name}: → ${locLabel(dest)}`);
    } else {
      // 2海域: ダイス判定 (出目 < 速力 = 成功)
      const roll = rollD6();
      const ok = roll < s.spd;
      if(ok){
        s.location = dest;
        log.push(`${s.name}: 2海域 ⚂${roll}<${s.spd} 成功 → ${locLabel(dest)}`);
      } else {
        s.location = s.homePort || origin;
        s.failedMove = true; // このターンは再配置不可
        // 目的の海域に隣接する味方の港があれば、元の港の代わりにそこへ入れる
        for(const p of failMovePorts(s, dest, s.location)){
          if(confirm(`${s.name}: 2海域移動 ⚂${roll}≥${s.spd} 失敗。\n${PORTS[p].name}に入る（OK）／${locLabel(s.location)}に残る（キャンセル）`)){ s.location = p; break; }
        }
        log.push(`${s.name}: 2海域 ⚂${roll}≥${s.spd} 失敗 → ${locLabel(s.location)}へ帰還(配置不可)`);
      }
    }
  });
  selectedShipIds = [];
  selectedDest = null;
  placeAllShips();
  renderLocShipList(); renderDestButtons(); renderStatus(); renderSeaResetButtons();
  // ログ表示
  document.getElementById('moveStatus').innerHTML = log.join('<br>');
}

function placeStack(stackId, label, ships, x, y, w){
  if(!ships.length) return;
  stacks[stackId] = { label, ships };
  const inner = document.getElementById('mapInner');
  ships.forEach((s, i)=>{
    const dx = i * OFFSET_PER_SHIP;
    const dy = -i * OFFSET_PER_SHIP;

    div.className = 'tt-ship';
    div.style.left  = (x + dx) + '%';
    div.style.top   = (y + dy) + '%';
    div.style.width = w + '%';
    div.title = `${label}: ${s.name}${s.damage?` (損害${s.damage}/${s.def})`:''}${s.disabled?' [即時帰還]':''}${s.returnPending?' [帰還待ち]':''}`;
    div.dataset.stack = stackId;
    div.onclick = ()=> showStack(stackId);
    let html = `<img src="images/${s.file}" style="width:100%;height:auto;display:block;">`;
    if(s.damage > 0){
      // 損害バッジ（数字を赤い丸で）
      html += `<div style="position:absolute;bottom:-25%;right:-15%;background:#c00;color:#fff;font-weight:bold;font-size:1.4em;padding:0 6px;border-radius:50%;border:2px solid #fff;line-height:1.2;min-width:1.2em;text-align:center;box-shadow:0 0 4px #000;">${s.damage}</div>`;
    }
    if(s.disabled){
      html += `<div style="position:absolute;top:-15%;left:-15%;background:#fc4;color:#000;font-weight:bold;font-size:0.9em;padding:1px 6px;border-radius:3px;border:2px solid #fff;box-shadow:0 0 4px #000;">DIS</div>`;
    }
    if(s.returnPending){
      // 帰還待ちマーク（戦闘・支配判定に不参加）。言語に関係なく R（Return）
      html += `<div style="position:absolute;top:-15%;left:-15%;background:#f80;color:#000;font-weight:bold;font-size:0.9em;padding:1px 6px;border-radius:3px;border:2px solid #fff;box-shadow:0 0 4px #000;">R</div>`;
    }
    div.innerHTML = html;
    inner.appendChild(div);
  });
}

function getLocCoord(loc){
  if(!loc) return null;
  if(loc.startsWith('T')){
    const t = +loc.slice(1);
    return TURN_BOX[t] || null;
  }
  return PORT_COORDS[loc] || SEA_COORDS[loc] || null;
}

// 海域内では陣営/タイプ別の位置を返す
function getShipCoord(ship){
  const loc = ship.location;
  if(!loc) return null;
  if(SEAS[loc]){
    const positions = SEA_POSITIONS[loc];
    if(positions){
      let sub;
      if(ship.type === 'UBOAT')      sub = 'uboat';
      else if(ship.type === 'CONVOY') sub = 'convoy';
      else if(ship.side === 'allies') sub = 'allies';
      else                            sub = 'axis';
      if(positions[sub]) return positions[sub];
    }
    return SEA_COORDS[loc];
  }
  // 港: atDock なら修理ドック座標
  const portCoord = PORT_COORDS[loc];
  if(portCoord && ship.atDock && portCoord.repairX !== undefined){
    return { x: portCoord.repairX, y: portCoord.repairY };
  }
  return getLocCoord(loc);
}

// 陣営/タイプ別の配置キー（海域は陣営毎に分割）
function getPlaceKey(ship){
  const loc = ship.location;
  if(!loc) return null;
  if(SEAS[loc]){
    let sub;
    if(ship.type === 'UBOAT')      sub = 'uboat';
    else if(ship.type === 'CONVOY') sub = 'convoy';
    else if(ship.side === 'allies') sub = 'allies';
    else                            sub = 'axis';
    return `${loc}:${sub}`;
  }
  return loc;
}

    div.style.left = c.x + '%';
    div.style.top  = c.y + '%';
    div.style.width = '5%';
    div.innerHTML = `<img src="images/${img}" style="width:100%;height:auto;">`;
    inner.appendChild(div);
  });
}
