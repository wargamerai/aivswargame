<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>海の戦い - War at Sea</title>
<!-- アクセス解析（GoatCounter） -->
<script data-goatcounter="https://shigerusuzuki.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script src="lang.js"></script>
<script src="report.js"></script>
<script>
// ブラウザの「戻る」でゲームの画面を離れないようにする。離れる・再読み込みするときは確認を出す
//   ブラウザは操作の前の履歴の追加を無視することがあるので、最初の操作のときに追加する
window.addEventListener('pointerdown', () => {
  try { history.pushState(null, '', location.href); } catch(e){}
}, { once: true });
window.addEventListener('popstate', () => {
  try { history.pushState(null, '', location.href); } catch(e){}
});
window.addEventListener('beforeunload', e => { e.preventDefault(); e.returnValue = ''; });
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a1a2a; color:#fff; font-family:sans-serif; display:flex; flex-direction:column; height:100vh; overflow:hidden; }

#topbar {
  display:flex; align-items:center; gap:10px; padding:6px 10px;
  background:#13243a; border-bottom:2px solid #234; font-size:0.9em;
  flex-shrink:0;
}
#topbar h1 { font-size:1em; color:#88ccff; margin-right:6px; }

#main { flex:1; display:flex; min-height:0; }

#leftPane {
  width:260px; background:#13243a; border-right:1px solid #234;
  overflow-y:auto; overflow-x:hidden; font-size:0.85em; flex-shrink:0;
  transition:width 0.25s;
}
#leftPane > * { min-width:260px; }
#leftPane.collapsed { width:0; border-right:none; }
/* 艦一覧の開閉つまみ */
#leftPaneTab {
  flex-shrink:0; width:14px; background:#13243a; border-right:1px solid #234;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:#88ccff; font-size:0.7em; user-select:none;
}
#leftPaneTab:hover { background:#1a3a5a; }
#leftPane h3 {
  padding:4px 8px; background:#3a1a2a; color:#ff8888;
  border-bottom:1px solid #234; font-size:0.95em;
}

#rightPane {
  width:260px; background:#13243a; border-left:1px solid #234;
  overflow-y:auto; font-size:0.85em; flex-shrink:0;
}
#rightPane h3 {
  padding:4px 8px; background:#1a3a5a; color:#88ccff;
  border-bottom:1px solid #234; font-size:0.95em;
}

.ship-entry {
  padding:3px 6px; border-bottom:1px dotted #234;
  display:flex; align-items:center; gap:6px; cursor:pointer;
}
.ship-entry:hover { background:#1a3a5a; }
.ship-entry.sel {
  background:#2a4a7a;
  border-left:4px solid #ffcc44;
  padding-left:6px;
}
.ship-entry img { width:28px; height:28px; image-rendering:pixelated; }
.ship-entry .name { font-weight:bold; font-size:0.85em; }
.ship-entry .spec { font-size:0.75em; color:#aac; }
.ship-entry.sunk {
  opacity:0.5; background:#3a0a0a; border-left:3px solid #ff4444;
}
.ship-entry.sunk .name { text-decoration:line-through; color:#ff8888; }
.ship-entry.sunk img { filter:grayscale(80%); }

.locBtn {
  background:#234; color:#fff; border:1px solid #456;
  padding:3px 8px; border-radius:3px; cursor:pointer;
  font-size:0.8em;
}
.locBtn:hover { background:#2266cc; }
.locBtn.sel { background:#3377dd; border-color:#88ccff; font-weight:bold; }
.locBtn.port { border-color:#6a8; }
.locBtn.sea  { border-color:#68a; }

#mapArea {
  flex:1; overflow:auto; background:#051020; position:relative;
}
#mapInner { display:inline-block; position:relative; }
#mapInner img#mapImg { max-width:none; display:block; }
.tt-ship {
  position:absolute;
  transform:translate(-50%,-50%); /* 座標は駒の中心 */
  cursor:pointer;
}
.tt-ship img {
  display:block; image-rendering:pixelated;
}
body.hide-units .tt-ship { display:none; }
body.hide-units .control-marker { display:none; }

.control-marker {
  position:absolute;
  transform:translate(-50%,-50%);
  pointer-events:none; z-index:0;
}
.control-marker img { display:block; opacity:0.85; }

/* 拡大モーダル */
#modal {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.85); display:none;
  align-items:center; justify-content:center; z-index:1000;
}
#modal.show { display:flex; }
.modal-box {
  background:#13243a; border:2px solid #234; border-radius:8px;
  padding:16px 20px; max-width:80%; max-height:85%;
  overflow:auto; min-width:600px;
}
.modal-box h3 { color:#88ccff; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid #234; }
.modal-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:6px 20px;
}
.modal-ship {
  display:flex; align-items:center; gap:12px; padding:6px 4px;
  border-bottom:1px dotted #234;
}
.modal-ship img { width:64px; height:64px; image-rendering:pixelated; }
.modal-ship .info { flex:1; }
.modal-ship .info .nm { font-weight:bold; font-size:1em; color:#fff; }
.modal-ship .info .sp { font-size:0.85em; color:#aac; }
.modal-close {
  background:#2266cc; color:#fff; border:none; padding:6px 14px;
  border-radius:3px; cursor:pointer; font-weight:bold; margin-top:10px;
}

/* 戦闘モーダル */
#combatModal, #axisReturnModal, #axisRepairModal {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.9); display:none;
  align-items:center; justify-content:center; z-index:1000;
}
#combatModal.show, #axisReturnModal.show, #axisRepairModal.show { display:flex; }
/* 戦闘オーバーレイ（フェイズ切替時に大きく表示） */
#combatOverlayFlash {
  position:fixed; top:50%; left:50%; transform:translate(-50%, -50%);
  background:rgba(0,0,0,0.92); color:#ffcc44; padding:24px 60px;
  border:3px solid #ffcc44; border-radius:10px;
  font-size:2.4em; font-weight:bold; letter-spacing:0.1em;
  z-index:2000; pointer-events:none; opacity:0;
  transition:opacity 0.3s; text-shadow:0 0 8px rgba(255,204,68,0.6);
  white-space:nowrap;
}
#combatOverlayFlash.show { opacity:1; }
#axisReturnTable, #axisRepairTable { width:100%; border-collapse:collapse; color:#eee; font-size:0.9em; }
#axisReturnTable th, #axisRepairTable th { background:#234; color:#cde; padding:4px 8px; text-align:left; border-bottom:1px solid #456; }
#axisReturnTable td, #axisRepairTable td { padding:4px 8px; border-bottom:1px solid #234; vertical-align:middle; }
#axisReturnTable tr:hover td, #axisRepairTable tr:hover td { background:#1a2230; }
#axisReturnTable .ret-btn, #axisRepairTable .ret-btn { background:#345; color:#fff; border:1px solid #567; padding:3px 8px; margin:0 2px; border-radius:3px; cursor:pointer; font-size:0.85em; }
#axisReturnTable .ret-btn:hover:not(:disabled), #axisRepairTable .ret-btn:hover:not(:disabled) { background:#456; border-color:#789; }
#axisRepairTable .ret-btn:disabled { background:#222; color:#666; border-color:#333; cursor:not-allowed; }
#axisReturnTable .ret-btn.refuel { background:#643; border-color:#864; }
#axisReturnTable .ret-btn.refuel:hover:not(:disabled) { background:#754; }
#axisReturnTable .ret-btn:disabled { background:#222; color:#666; border-color:#333; cursor:not-allowed; }
#axisReturnTable .ret-result { color:#ffcc44; font-weight:bold; }
.combat-box {
  background:#1a2a3a; border:2px solid #ffcc44; border-radius:8px;
  padding:14px 18px; width:90vw; max-width:1100px; max-height:88vh;
  display:flex; flex-direction:column;
}
.combat-box h3 { color:#ffcc44; margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid #234; }
#phaseLabel {
  font-size:1.1em; color:#ffcc44; padding:6px 10px; margin:6px 0;
  background:rgba(255,204,68,0.1); border-radius:4px; min-height:1.5em;
  /* 長い説明やボタン（追撃の割り当てなど）でも縮めない。長すぎるときは欄の中で縦に動かす */
  flex-shrink:0; max-height:45vh; overflow-y:auto;
}
#combatModal .combat-box h3, #aiDecisionLabel { flex-shrink:0; }
.combat-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; flex:1; overflow-y:auto; min-height:0; }
.combat-col h4 {
  color:#fff; font-size:0.9em; padding:4px 8px; margin-bottom:6px;
  border-radius:3px;
}
.combat-col.allies h4 { background:#2a4a7a; }
.combat-col.axis h4   { background:#7a2a2a; }

.cs-row {
  display:grid;
  grid-template-columns:36px minmax(110px,auto) 1fr;
  grid-template-rows:auto auto;
  gap:1px 8px; align-items:center;
  padding:5px 6px; margin-bottom:4px;
  background:#0a1a2a; border-left:3px solid #234;
  font-size:0.85em; transition:all .3s;
}
.cs-row .cs-img { grid-column:1; grid-row:1/3; }
.cs-row img { width:36px; height:36px; image-rendering:pixelated; display:block; }
.cs-row .cs-name { grid-column:2; grid-row:1; font-weight:bold; white-space:nowrap; }
.cs-row .cs-status { grid-column:2; grid-row:2; font-size:0.85em; color:#cca; white-space:nowrap; }
.cs-row .cs-dice {
  grid-column:3; grid-row:1/3;
  display:flex; align-items:center; gap:3px; flex-wrap:wrap;
  min-width:0;
}
.cs-row .cs-dice:empty::before {
  content:''; display:inline-block;
}
.combat-col.allies .cs-row { margin-left:24px; }
.combat-col.axis .cs-row { margin-right:24px; }
/* 保護されている艦（攻撃を宣言していない空母・船団）は、敵の列から遠い側へずらす */
.combat-col.allies .cs-row.protected { margin-left:0; margin-right:24px; }
.combat-col.axis .cs-row.protected { margin-right:0; margin-left:24px; }
.cs-row.firing { background:#1a3a5a; border-left-color:#88ccff; }
.cs-row.target { background:#3a1a2a; border-left-color:#ff6666; }
.cs-row.sunk   { opacity:0.4; background:#3a0a0a; }
.cs-row.disabled { opacity:0.6; background:#3a3a1a; border-left-color:#ffcc44; }
.cs-row.selectable {
  cursor:pointer;
  outline:2px solid #ffcc44;
  background:#2a3a5a;
}
.cs-row.selectable:hover {
  background:#3a5a8a;
  outline-color:#ffff66;
}

/* PG風 ダイス */
.dice {
  display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; line-height:1;
  background:#111; border:2px solid #c8a020; border-radius:6px;
  font-size:1.3em; font-weight:bold; color:#ff0;
  margin:0 2px; transition:border-color .15s, color .15s;
}
.dice.hit  { color:#ff6666; border-color:#ff6666; box-shadow:0 0 8px rgba(255,102,102,0.5); }
.dice.dis  { color:#ffcc44; border-color:#ffcc44; }
.dice.miss { color:#888;    border-color:#666;    }
.dice.dmg  { color:#ff8844; border-color:#ff8844; box-shadow:0 0 6px rgba(255,136,68,0.5); }
.dice.rolling {
  animation: shake 0.08s infinite;
  border-color:#f44; color:#fff;
}
@keyframes shake {
  0%,100% { transform:rotate(0deg) scale(1); }
  25% { transform:rotate(-10deg) scale(1.1); }
  75% { transform:rotate(10deg) scale(1.1); }
}
@keyframes flashHit {
  0%, 100% { background:#3a1a2a; }
  50% { background:#aa3333; }
}
.cs-row.flash { animation:flashHit .4s; }
.result-label {
  display:inline-block; padding:3px 10px; border-radius:4px;
  font-weight:bold; font-size:0.95em; margin-left:6px;
}
.result-label.miss     { background:#333;     color:#888; }
.result-label.disabled { background:#6a5a20;  color:#fd8; }
.result-label.hit      { background:#6a2020;  color:#f88; }
.result-label.sunk     { background:#800;     color:#fff; }

.zbtn {
  background:#234; color:#fff; border:1px solid #456;
  width:28px; height:24px; border-radius:3px; cursor:pointer;
  font-weight:bold; font-size:1em;
}
.zbtn:hover { background:#2266cc; }

.ph-cell {
  padding:2px 7px; background:#1a2a3a; color:#aac;
  border:1px solid #345; border-radius:3px; white-space:nowrap;
  font-size:0.85em;
}
.ph-cell.current { background:#ffcc44; color:#000; font-weight:bold; border-color:#fff; }
.ph-cell.done { background:#1a3a1a; color:#8c8; border-color:#4a6a4a; }
</style>
</head>
<body>

<div id="topbar">
  <h1>⚓ War at Sea</h1>
  <button class="zbtn" id="langBtn" onclick="toggleLang()" style="width:auto;padding:0 10px;font-size:0.8em;">EN</button>
  <label style="font-size:0.85em;">
    ターン:
    <span id="turnLabel" style="display:inline-block;min-width:24px;text-align:center;font-weight:bold;color:#ffcc44;">1</span>
  </label>
  <div id="phaseBar" style="display:flex;gap:2px;flex-wrap:wrap;font-size:0.7em;margin-left:8px;"></div>
  <button class="zbtn" onclick="advancePhase()" style="width:auto;padding:0 8px;font-size:0.8em;">次フェイズ▶</button>
  <button class="zbtn" onclick="endTurn()" style="width:auto;padding:0 12px;background:#883;font-weight:bold;">ターン終了</button>
  <span style="font-size:0.85em;color:#ffcc44;">POC:<span id="pocVal" style="font-weight:bold;margin-left:4px;">0</span></span>
  <span style="flex:1;"></span>
  <label style="font-size:0.85em;">
    ズーム:
    <button class="zbtn" onclick="setZoom(-10)">−</button>
    <input type="range" id="zoomSlider" min="20" max="150" value="70" step="5" style="display:none;">
    <button class="zbtn" onclick="setZoom(10)">＋</button>
    <span id="zoomLabel">70%</span>
  </label>
  <button class="zbtn" id="toggleUnits" onclick="toggleUnits()" style="width:auto;padding:0 10px;font-size:0.85em;">駒表示</button>
  <button class="zbtn" onclick="showCombatLog()" style="width:auto;padding:0 10px;font-size:0.85em;background:#557;display:none;">戦闘ログ</button>
  <label style="font-size:0.85em;margin-left:8px;display:none;">プレイ陣営:
    <select id="humanSideSelect" onchange="setHumanSide(this.value)" style="font-size:0.85em;">
      <option value="axis">枢軸</option>
      <option value="allies" disabled>連合（準備中）</option>
    </select>
  </label>
</div>

<div id="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="modal-box" id="modalBox"></div></div>
<!-- ゲーム立ち上げ時のオプションルール選択 -->
<div id="optionStartModal" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:1100;">
  <div class="modal-box" style="min-width:320px;">
    <p style="color:#ffcc44;margin-bottom:10px;">あなたはドイツ軍（枢軸）を担当します。連合軍はAIが動かします。</p>
    <h3>オプションルール</h3>
    <div style="display:flex;flex-direction:column;gap:8px;color:#cde;margin:8px 0 14px;">
      <label><input type="checkbox" class="optRule" data-opt="ubNoLimit" onchange="setOptionRule(this)"> Uボート上限なし</label>
      <label><input type="checkbox" class="optRule" data-opt="bismarck7" onchange="setOptionRule(this)"> ビスマルク級 防御7</label>
      <label><input type="checkbox" class="optRule" data-opt="usEase" onchange="setOptionRule(this)"> 米国投入ダイス緩和</label>
    </div>
    <button class="locBtn" style="background:#2266cc;padding:6px 18px;" onclick="startWithOptions()">ゲーム開始</button>
  </div>
</div>
<div id="combatLogModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;">
  <div style="background:#0a1a2a;border:2px solid #456;border-radius:6px;width:80%;max-width:800px;max-height:80vh;display:flex;flex-direction:column;">
    <h3 style="margin:0;padding:8px 12px;background:#234;color:#cde;">戦闘ログ</h3>
    <div id="combatLogBody" style="overflow-y:auto;flex:1;padding:6px 8px;color:#eee;"></div>
    <div style="padding:6px 12px;text-align:right;background:#123;">
      <button onclick="hideCombatLog()" style="background:#456;color:#fff;border:none;padding:5px 14px;border-radius:4px;cursor:pointer;">閉じる</button>
    </div>
  </div>
</div>
<style>#combatLogModal.show{display:flex !important;}</style>
<div id="axisReturnModal">
  <div class="combat-box" style="max-width:900px;">
    <h3>枢軸艦 帰還フェイズ</h3>
    <div style="overflow-y:auto;flex:1;padding:6px 0;">
      <table id="axisReturnTable">
        <thead><tr><th>艦名</th><th>現在地</th><th>帰還先 / 洋上補給</th></tr></thead>
        <tbody id="axisReturnBody"></tbody>
      </table>
    </div>
    <div style="margin-top:8px;text-align:right;">
      <button id="axisReturnOkBtn" style="background:#585;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;">帰還</button>
    </div>
  </div>
</div>
<div id="axisRepairModal">
  <div class="combat-box" style="max-width:700px;">
    <h3>枢軸艦 修理フェイズ</h3>
    <div style="overflow-y:auto;flex:1;padding:6px 0;">
      <table id="axisRepairTable">
        <thead><tr><th>艦名</th><th>損害</th><th>修理量</th></tr></thead>
        <tbody id="axisRepairBody"></tbody>
      </table>
    </div>
    <div style="margin-top:8px;text-align:right;">
      <button id="axisRepairOkBtn" style="background:#585;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;">決定</button>
    </div>
  </div>
</div>
<div id="combatOverlayFlash"></div>
<div id="combatModal">
  <div class="combat-box">
    <h3 id="combatTitle">戦闘解決</h3>
    <div id="phaseLabel">―</div>
    <div id="aiDecisionLabel" style="color:#fc8;font-weight:bold;font-size:0.9em;min-height:1.2em;"></div>
    <div class="combat-grid">
      <div class="combat-col allies"><h4>連合軍</h4><div id="alliesShipList"></div></div>
      <div class="combat-col axis"><h4>枢軸軍</h4><div id="axisShipList"></div></div>
    </div>
    <div style="margin-top:8px;text-align:right;">
      <button onclick="runAICombat()" style="background:#a55;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;margin-right:8px;display:none;">AI戦闘実行</button>
      <button onclick="runFastCombat()" style="background:#a85;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;margin-right:8px;display:none;">高速戦闘</button>
      <button id="combatFlowBtn" onclick="onCombatFlowBtn()" style="background:#a55;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;margin-right:8px;display:none;">連合軍の攻撃</button>
      <button id="airAttackBtn" onclick="onAirAttackBtn()" style="background:#a55;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;margin-right:8px;display:none;">攻撃</button>
      <button id="combatConfirmBtn" onclick="onCombatConfirm()" style="background:#585;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;margin-right:8px;display:none;">戦闘確認</button>
      <button id="roundEndBtn" onclick="onRoundEnd()" style="background:#558;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;margin-right:8px;display:none;">ラウンド終了</button>
      <button id="combatCloseBtn" class="modal-close" onclick="closeCombatModal()">閉じる</button>
    </div>
  </div>
</div>

<div id="main">
  <div id="leftPane">
    <h3>枢軸軍 AXIS</h3>
    <div id="axisList"></div>
    <h3 style="margin-top:8px;">連合軍 ALLIES</h3>
    <div id="alliesList"></div>
  </div>
  <div id="leftPaneTab" onclick="toggleLeftPane()" title="艦一覧の表示/非表示">◀</div>
  <div id="mapArea">
    <div id="mapInner">
      <img id="mapImg" src="images/war_at_sea_board.gif" alt="War at Sea board">
    </div>
  </div>
  <div id="rightPane">
    <div id="phaseSwitcher" style="display:flex;padding:4px 6px;gap:4px;background:#0a1a2a;border-bottom:1px solid #234;">
      <button class="locBtn" id="phaseMoveBtn"   onclick="setPhase('move')"   style="flex:1;font-weight:bold;">移動</button>
      <button class="locBtn" id="phaseCombatBtn" onclick="setPhase('combat')" style="flex:1;font-weight:bold;">戦闘</button>
    </div>

    <!-- 移動フェイズ -->
    <div id="movePane">
      <h3>港湾</h3>
      <div id="portButtons" style="display:flex;flex-wrap:wrap;gap:3px;padding:4px 6px;"></div>
      <h3 id="locTitle" style="margin-top:6px;">艦船一覧</h3>
      <div style="padding:2px 6px;display:flex;gap:4px;">
        <button class="locBtn" onclick="selectAllShipsHere()" style="font-size:0.75em;">全艦選択</button>
      </div>
      <div id="locShipList" style="padding:0 4px;"></div>
      <h3 style="margin-top:6px;">移動先</h3>
      <div id="destButtons" style="display:flex;flex-wrap:wrap;gap:3px;padding:4px 6px;"></div>
      <div id="moveStatus" style="padding:4px 6px;font-size:0.8em;color:#ffcc88;"></div>
      <div style="padding:4px 6px;display:flex;gap:6px;">

<script src="data.js"></script>
<script src="battle.js"></script>
<script>
// === 初期配置（ship.location と ship.homePort をセット） ===
function initShipLocations(){
  SHIPS.forEach(s=>{
    if(s.country==='US' && s.enterTurn) s.location = 'T' + s.enterTurn;
    else if(s.country==='US') s.location = 'USA';
    else if(s.country==='UK' && !s.enterTurn) s.location = 'England';
    else if(s.country==='DE' && !s.enterTurn) s.location = 'Germany';
    else if(s.country==='IT' && !s.enterTurn) s.location = 'Italy';
    else if(s.enterTurn) s.location = 'T' + s.enterTurn;
    else s.location = null;
    s.homePort = s.location;
    // 戦闘ステータス
    s.damage = 0;
    s.disabled = false;
    s.sunk = false;
    s.atkOrig = s.atk;
    s.spdOrig = s.spd;
    if(s.country === 'US') s.usEntered = false;
  });
  // === マルタ初期配置: 速力3の戦艦7隻 ===
  const setMalta = s => { s.location = 'Malta'; s.homePort = 'Malta'; };
  SHIPS.filter(s => s.country === 'UK' && !s.enterTurn && s.type === 'BB' && s.spd === 3).forEach(setMalta);
}
initShipLocations();

// === 左パネル：艦船一覧（陣営別） ===
function renderSideList(side, elId){
  const el = document.getElementById(elId);
  if(!el) return;
  const ships = SHIPS.filter(s => s.side === side);
  const byCountry = {};
  ships.forEach(s => { (byCountry[s.country] ||= []).push(s); });
  let html = '';
  for(const country in byCountry){
    html += `<div style="padding:3px 6px;background:#1a2a3a;color:#cde;font-size:0.8em;">${country}</div>`;
    byCountry[country].forEach(s => {
      const enter = s.enterTurn ? ` (T${s.enterTurn})` : '';
      const cls = s.sunk ? ' sunk' : '';
      let status = '';
      if(s.sunk) status = ' <span style="color:#ff4444;font-weight:bold;">[撃沈]</span>';
      else if(s.landed) status = ` <span style="color:#8cf;">[上陸]</span>`;
      else if(s.damage > 0) status = ` <span style="color:#fa8;">[損害${s.damage}]</span>`;
      html += `<div class="ship-entry${cls}">
        <img src="images/${s.file}" alt="${s.name}">
        <div>
          <div class="name">${s.name}${enter}${status}</div>
          <div class="spec">${s.atk}-${s.def}-${s.spd} ${s.type}</div>
        </div>
      </div>`;
    });
  }
  el.innerHTML = html;
}
function renderAxisList(){ renderSideList('axis', 'axisList'); }
function renderAlliesList(){ renderSideList('allies', 'alliesList'); }
renderAxisList();
renderAlliesList();

// === 戦闘ログ ===
const combatLog = []; // [{turn, sea, type, lines:[]}]
let _curLog = null;
function startCombatLogEntry(sea, type){
  _curLog = { turn: currentTurn, sea: sea || '', type: type || '', lines: [] };
  combatLog.push(_curLog);
}
function logCombatLine(text){
  if(_curLog) _curLog.lines.push(text);
}
function endCombatLogEntry(){
  if(_curLog && !_curLog.lines.length){
    // 空エントリは破棄
    const idx = combatLog.indexOf(_curLog);
    if(idx >= 0) combatLog.splice(idx, 1);
  }
  _curLog = null;
}
function showCombatLog(){
  const modal = document.getElementById('combatLogModal');
  const body = document.getElementById('combatLogBody');
  if(!combatLog.length){
    body.innerHTML = '<div style="padding:10px;color:#aac;">戦闘ログなし</div>';
  } else {
    body.innerHTML = combatLog.map(entry => {
      const head = `<div style="background:#234;color:#cde;padding:4px 8px;font-weight:bold;margin-top:6px;">T${entry.turn} ${entry.sea} - ${entry.type}</div>`;
      const lines = entry.lines.map(l => `<div style="padding:2px 12px;font-size:0.9em;">${l}</div>`).join('');
      return head + lines;
    }).join('');
  }
  modal.classList.add('show');
}
function hideCombatLog(){ document.getElementById('combatLogModal').classList.remove('show'); }

// === ターン ===
let currentTurn = 1;
let aiMode = false; // AI戦闘実行中は目標選択を自動化
let humanSide = 'axis'; // 人間プレイヤーの陣営 ('axis' or 'allies')
let aiSide = 'allies'; // AI 陣営 (humanSide の反対)
function setHumanSide(side){
  humanSide = side;
  aiSide = (side === 'axis') ? 'allies' : 'axis';
  if(typeof renderPortButtons === 'function') renderPortButtons();
}
let italySurrendered = false; // ターン8初めの接収ダイス判定で確定
// === オプションルール ===
const optionRules = { ubNoLimit: false, bismarck7: false, usEase: false };
let optionRulesLocked = false;
function setOptionRule(el){
  if(optionRulesLocked){ el.checked = !!optionRules[el.dataset.opt]; return; }
  optionRules[el.dataset.opt] = el.checked;
  if(el.dataset.opt === 'bismarck7'){
    // Bismarck・Tirpitz の防御力 9 → 7
    SHIPS.filter(s => s.id === 'de_bismarck' || s.id === 'de_tirpitz').forEach(s => { s.def = el.checked ? 7 : 9; });
  }
}
// 立ち上げ画面の「ゲーム開始」: オプションを確定して閉じる
function startWithOptions(){
  lockOptionRules();
  document.getElementById('optionStartModal').style.display = 'none';
}
function lockOptionRules(){
  if(optionRulesLocked) return;
  optionRulesLocked = true;
  document.querySelectorAll('.optRule').forEach(cb => { cb.disabled = true; });
}
// 米国艦の投入ダイスの成功の目（オプション: ターン4は6、以降ターンごとに1ずつ広がる）
function usEntryNeed(){
  return optionRules.usEase ? Math.max(2, 6 - (currentTurn - 4)) : 6;
}
function changeTurn(d){
  currentTurn = Math.max(1, Math.min(8, currentTurn + d));
  document.getElementById('turnLabel').textContent = currentTurn;
  renderPortButtons(); renderDestButtons();
}

// === フェイズ ===
const PHASE_NAMES = [
  '1.増援配置','2.連合移動','3.枢軸移動','4.修理',
  '5.支配除去','6.戦闘','7.支配配置','8.帰還','9.POC'
];
let phaseIdx = 1; // 1〜9
let phaseBarExpanded = false; // クリックで全フェイズ表示と切り替え
function renderPhaseBar(){
  const el = document.getElementById('phaseBar');
  if(!el) return;
  el.style.cursor = 'pointer';
  el.title = 'クリックで全フェイズ表示／戻す';
  el.onclick = () => { phaseBarExpanded = !phaseBarExpanded; renderPhaseBar(); };
  // 通常は1つ前・現在・1つ後のフェイズだけを表示
  el.innerHTML = PHASE_NAMES.map((nm, i) => {
    const id = i + 1;
    if(!phaseBarExpanded && Math.abs(id - phaseIdx) > 1) return '';
    let cls = '';
    if(id === phaseIdx) cls = 'current';
    else if(id < phaseIdx) cls = 'done';
    return `<span class="ph-cell ${cls}">${nm}</span>`;
  }).join('');
}
async function advancePhase(){
  if(phaseIdx >= 9) return; // 9 (POC) で止まる、ターン終了ボタンで次ターンへ
  lockOptionRules();
  phaseIdx = phaseIdx + 1;
  renderPhaseBar();
  // フェイズ進行時の自動処理
  if(phaseIdx === 2){
    await aiAlliedMove();
  } else if(phaseIdx === 4){
    const log = await executeRepair();
    if(log && log.length){
      alert('修理結果:\n' + log.map(l => l.replace(/<[^>]+>/g,'')).join('\n'));
    } else {
      alert('修理対象艦なし');
    }
  } else if(phaseIdx === 5){
    // 支配除去: 全海域の支配マーカーを除去
    Object.keys(seaControl).forEach(k => delete seaControl[k]);
    placeControlMarkers();
  } else if(phaseIdx === 8){
    // マルタの艦はマルタで完結（英国へは帰さない）。マルタの余力は連合AIの配分で南大西洋へ送る
    // バレンツ海の UK・US 水上艦は England に直接帰還（Russia には行かない、コンボイは除外）
    const barUkUs = SHIPS.filter(s =>
      s.location === 'Barents' && !s.sunk && !s.removed &&
      s.type !== 'CONVOY' && (s.country === 'UK' || s.country === 'US')
    );
    // ターン3〜8（ロシアの港が使えるとき）は英国艦をロシアへ帰還させる（次のターンもバレンツ海へ1エリアで出られる）
    //   無傷の艦と、ロシアの修理量に収まる損害艦はロシア、収まらない損害艦は修理のため英国へ
    const russiaOpen = PORTS.Russia.available.includes(currentTurn);
    let russiaBudget = russiaOpen ? PORTS.Russia.repair - SHIPS.filter(s => s.location === 'Russia' && !s.sunk && !s.landed && s.damage > 0).reduce((t, s) => t + s.damage, 0) : 0;
    for(const s of barUkUs.slice().sort((a, b) => (a.damage || 0) - (b.damage || 0))){
      let dest = 'England';
      if(russiaOpen && s.country === 'UK'){
        if(!(s.damage > 0)) dest = 'Russia';
        else if(s.damage <= russiaBudget){ dest = 'Russia'; russiaBudget -= s.damage; }
      }
      s.location = dest;
      s.atDock = false;
      console.log(`[帰還] ${s.name}: バレンツ海 → ${dest} (${s.country})`);
    }
    // Uボートの帰還先は必ず Germany（中立港・France等に行かせない）
    const allUboats = SHIPS.filter(s =>
      s.type === 'UBOAT' && !s.sunk && !s.removed &&
      s.location && SEAS[s.location]
    );
    for(const u of allUboats){
      const from = u.location;
      u.location = 'Germany';
      u.atDock = false;
      console.log(`[帰還] ${u.name}: ${from} → Germany (Uボート専用)`);
    }
    // 帰還待ちの船団は米国へ（14.7）
    SHIPS.filter(s => s.type === 'CONVOY' && s.returnPending && !s.sunk && !s.removed && s.location && SEAS[s.location]).forEach(s => {
      s.location = 'USA';
      s.atDock = false;
      console.log(`[帰還] ${s.name}: 帰還待ち船団 → USA`);
    });
    // 帰還: 海域の艦を港湾へ
    const shipsToReturn = SHIPS.filter(s =>
      s.location && SEAS[s.location] && !s.sunk && !s.removed &&
      s.type !== 'CONVOY' && s.refuelTurn !== currentTurn
    );
    // 連合艦は既存の自動配置
    const alliesToReturn = shipsToReturn.filter(s => s.side === 'allies');
    // 地中海から帰還する損害英国艦: マルタの修理能力内に収まる艦（損害の小さい順）はマルタ、収まらない艦は英国
    const maltaPort = PORTS.Malta;
    let maltaBudget = maltaPort.available.includes(currentTurn) ? maltaPort.repair : 0;
    maltaBudget -= SHIPS.filter(s => s.location === 'Malta' && !s.sunk && s.damage > 0).reduce((sum, s) => sum + s.damage, 0);
    const damagedDest = {};
    // 強制帰還艦は必ずマルタ（修理枠を先に使う）
    alliesToReturn
      .filter(s => s.location === 'Mediterranean' && s.forcedReturn && s.damage > 0)
      .forEach(s => { maltaBudget -= s.damage; });
    // 英国から地中海へ2エリア移動できない（北大西洋・南大西洋とも枢軸支配）ときは損害艦もすべてマルタ
    const medCutOff = seaControl['NorthAtlantic'] === 'axis' && seaControl['SouthAtlantic'] === 'axis';
    alliesToReturn
      .filter(s => s.location === 'Mediterranean' && s.country === 'UK' && s.damage > 0 && !s.forcedReturn)
      .sort((a, b) => a.damage - b.damage)
      .forEach(s => {
        if(medCutOff || s.homePort === 'Malta'){
          damagedDest[s.id] = 'Malta';
        } else if(s.damage <= maltaBudget){
          damagedDest[s.id] = 'Malta';
          maltaBudget -= s.damage;
        } else {
          damagedDest[s.id] = 'England';
        }
      });
    // 地中海の無傷の英国艦: イタリアの全戦力に絶対に負けない分（マルタにいる艦と合わせて）を強い艦からマルタに残し、
    //   余りは英国へ帰す（英国から北海などで使う）
    const toEngland = new Set();
    {
      const keepMed = SHIPS.filter(s => s.location === 'Malta' && s.side === 'allies' && !s.sunk && !s.removed && !(s.damage > 0));
      alliesToReturn
        .filter(s => s.location === 'Mediterranean' && s.country === 'UK' && !(s.damage > 0) && !s.forcedReturn)
        .sort((a, b) => ((b.atk || 0) + (b.def || 0)) - ((a.atk || 0) + (a.def || 0)))
        .forEach(s => { if(medNeverLose(keepMed)) toEngland.add(s.id); else keepMed.push(s); });
    }
    for(const ship of alliesToReturn){
      if(toEngland.has(ship.id)){
        ship.location = 'England';
        ship.homePort = 'England';
        ship.atDock = false;
        console.log(`[帰還] ${ship.name}: 地中海の余力 → England`);
        continue;
      }
      const ports = getReturnPorts(ship);
      if(damagedDest[ship.id] && ports.includes(damagedDest[ship.id])){
        ship.location = damagedDest[ship.id];
        console.log(`[帰還] ${ship.name}: 損害${ship.damage} → ${ship.location} (マルタ修理能力配分)`);
      } else if(ports.length === 0){
        ship.location = ship.homePort || HOME_PORT[ship.country];
      } else {
        ship.location = ports.includes(ship.homePort) ? ship.homePort : ports[0];
      }
      ship.atDock = false;
    }
    // 枢軸艦は新UIで個別選択（港 or 洋上補給）
    const axisToReturn = shipsToReturn.filter(s => s.side === 'axis');
    if(axisToReturn.length){
      await showAxisReturnUI(axisToReturn);
    }
    // 帰還完了: 帰還待ちマークを外す
    SHIPS.forEach(s => { s.returnPending = false; s.forcedReturn = false; });
    placeAllShips();
    renderLocShipList(); renderSeaResetButtons();
  } else if(phaseIdx === 6){
    // 戦闘: 戦闘画面を開き、連合軍の攻撃ボタンから順に進行
    runNextCombat();
  } else if(phaseIdx === 7){
    // 支配配置: 各海域の支配を判定してマーカー配置
    // Uボートだけの海域は支配できない（ただし相手の支配は消す = 支配なし扱い）
    Object.keys(SEAS).forEach(seaKey => {
      const ships = SHIPS.filter(s => s.location === seaKey && !s.sunk && !s.returnPending); // 帰還待ちは支配判定に使えない
      const al = ships.some(s => s.side === 'allies' && s.type !== 'UBOAT');
      const ax = ships.some(s => s.side === 'axis' && s.type !== 'UBOAT');
      const ub = ships.some(s => s.type === 'UBOAT');
      if(al && !ax && !ub)       seaControl[seaKey] = 'allies';
      else if(ax && !al)         seaControl[seaKey] = 'axis';
      else                       seaControl[seaKey] = null; // Uボートのみ含む全ての残りケース
    });
    placeControlMarkers();
    // 地中海の枢軸連続支配: 4ターン連続でターン8初めにイタリア艦隊接収
    if(seaControl['Mediterranean'] === 'axis') medAxisStreak++;
    else medAxisStreak = 0;
    if(medAxisStreak >= 4) italySeizurePending = true;
    console.log(`[地中海] 枢軸連続支配 ${medAxisStreak}ターン${italySeizurePending ? '（ターン8に接収）' : ''}`);
  } else if(phaseIdx === 9){
    // POC計算: 各海域の支配側に加算
    const pocBefore = poc;
    console.log('[POC] phase 9 開始: poc=', poc, 'seaControl=', JSON.stringify(seaControl));
    let delta = 0;
    Object.keys(seaControl).forEach(seaKey => {
      const side = seaControl[seaKey];
      if(side === 'axis')        { delta -= SEAS[seaKey].axis;   console.log(`[POC]   ${seaKey} axis支配 → -${SEAS[seaKey].axis}`); }
      else if(side === 'allies') { delta += SEAS[seaKey].allies; console.log(`[POC]   ${seaKey} allies支配 → +${SEAS[seaKey].allies}`); }
      else                       { console.log(`[POC]   ${seaKey} 支配なし(${side}) → 0`); }
    });
    poc = Math.max(-10, Math.min(10, poc + delta));
    console.log(`[POC] phase 9 完了: delta=${delta} poc ${pocBefore} → ${poc}`);
    updatePOC();
  }
}
function setPhaseIdx(n){
  phaseIdx = Math.max(1, Math.min(9, n));
  renderPhaseBar();
}

// === 右パネル：港湾→艦一覧→移動先 ===
let selectedLoc = null;        // 一覧表示中の場所
let selectedShipIds = [];      // 移動対象艦（複数）
let selectedDest = null;       // 移動先

const PORT_LABEL = {
  USA:'米国', England:'英国', Malta:'マルタ', Russia:'ロシア',
  Leningrad:'レニングラード', Germany:'ドイツ', France:'フランス',
  Italy:'イタリア', Neutral:'中立港'
};
const SEA_LABEL = {
  NorthAtlantic:'北大西洋', Barents:'バレンツ海', NorthSea:'北海',
  Baltic:'バルト海', Mediterranean:'地中海', SouthAtlantic:'南大西洋'
};
const SEA_COLOR = {
  NorthAtlantic: '#3b6db5',
  Barents:       '#5aa5b8',
  NorthSea:      '#b58f3b',
  Baltic:        '#9a4f9a',
  Mediterranean: '#6fa53b',
  SouthAtlantic: '#a55f4f'
};

function locLabel(loc){
  if(!loc) return '';
  if(loc.startsWith('T')) return `ターン${loc.slice(1)}`;
  return PORT_LABEL[loc] || SEA_LABEL[loc] || loc;
}

function renderPortButtons(){
  const el = document.getElementById('portButtons');
  const hidePortsAxis = ['USA', 'England', 'Malta', 'Russia', 'Leningrad'];
  const hidePortsAllies = ['Germany', 'France', 'Italy'];
  const hideSeasAxis = ['Mediterranean', 'Baltic'];
  const hideSeasAllies = [];
  const hidePortList = humanSide === 'axis' ? hidePortsAxis : hidePortsAllies;
  const hideSeaList = humanSide === 'axis' ? hideSeasAxis : hideSeasAllies;
  const portBtns = Object.keys(PORT_LABEL)
    .filter(k => !hidePortList.includes(k))
    .map(k =>{
      const port = PORTS[k];
      const usable = port.available.includes(currentTurn);
      const cls = usable ? '' : ' style="opacity:0.4;"';
      const sel = selectedLoc===k ? ' sel' : '';
      return `<button class="locBtn port${sel}"${cls} onclick="selectLoc('${k}')">${PORT_LABEL[k]}</button>`;
    }).join('');
  const seaBtns = Object.keys(SEA_LABEL)
    .filter(k => !hideSeaList.includes(k))
    .map(k =>{
      const sel = selectedLoc===k ? ' sel' : '';
      return `<button class="locBtn sea${sel}" style="background:${SEA_COLOR[k]};border-color:${SEA_COLOR[k]};color:#fff;" onclick="selectLoc('${k}')">${SEA_LABEL[k]}</button>`;
    }).join('');
  el.innerHTML = `<div style="display:flex;gap:6px;width:100%;">
    <div style="display:flex;flex-direction:column;gap:3px;flex:1;">${portBtns}</div>
    <div style="display:flex;flex-direction:column;gap:3px;flex:1;">${seaBtns}</div>
  </div>`;
}

function renderLocShipList(){
  const title = document.getElementById('locTitle');
  const el = document.getElementById('locShipList');
  if(!selectedLoc){
    title.textContent = '艦船一覧';
    el.innerHTML = '<div style="padding:6px;color:#aac;font-size:0.8em;">港湾を選択してください</div>';
    return;
  }
  title.textContent = `${locLabel(selectedLoc)} の艦船 (複数選択可)`;
  // 現在ここにいる艦 + このターンここから出た艦（消さない）
  const ships = SHIPS.filter(s =>
    s.location === selectedLoc ||
    (s.movedThisTurn && s.originThisTurn === selectedLoc)
  );
  if(!ships.length){
    el.innerHTML = '<div style="padding:6px;color:#aac;font-size:0.8em;">なし</div>';
    return;
  }
  el.innerHTML = ships.map(s=>{
    const sel = selectedShipIds.includes(s.id) ? ' sel' : '';
    const dmgText = s.damage > 0 ? ` <span style="color:#fa8;">[損害${s.damage}]</span>` : '';
    if(s.failedMove){
      return `<div class="ship-entry" style="opacity:0.4;cursor:not-allowed;background:#3a2a2a;">
        <img src="images/${s.file}">
        <div>
          <div class="name">${s.name}${dmgText} <span style="color:#f88;">[移動失敗・配置不可]</span></div>
          <div class="spec">${s.atk}-${s.def}-${s.spd} ${s.type}</div>
        </div>
      </div>`;
    }
    if(s.movedThisTurn && s.location !== selectedLoc){
      // 移動済み: 移動先の海域色で表示
      const bg = SEA_COLOR[s.location] || '#1a3a2a';
      return `<div class="ship-entry" style="background:${bg};cursor:default;">
        <img src="images/${s.file}">
        <div>
          <div class="name" style="color:#fff;">${s.name}${dmgText} <span style="font-size:0.85em;">→ ${locLabel(s.location)}</span></div>
          <div class="spec" style="color:#eef;">${s.atk}-${s.def}-${s.spd} ${s.type}</div>
        </div>
      </div>`;
    }
    return `<div class="ship-entry${sel}" onclick="toggleShip('${s.id}')">
      <img src="images/${s.file}">
      <div>
        <div class="name">${s.name}${dmgText}</div>
        <div class="spec">${s.atk}-${s.def}-${s.spd} ${s.type}</div>
      </div>
    </div>`;
  }).join('');
}

function getValidDests(){
  if(!selectedLoc) return { seas:[], seas2:[], ports:[] };
  const firstShip = selectedShipIds.length ? SHIPS.find(s => s.id === selectedShipIds[0]) : null;
  const isUboat = firstShip && firstShip.type === 'UBOAT';

  // 6.5 Uボートはどこにでも配置可
  if(isUboat){
    return {
      seas: Object.keys(SEAS),
      seas2: [],
      ports: ['Germany']
    };
  }

  const isPort = !!PORTS[selectedLoc];
  const isSea  = !!SEAS[selectedLoc];
  let seas = [], seas2 = [], ports = [];
  if(isPort){
    seas = PORT_SEAS[selectedLoc] || [];
    // 2エリア移動: 最初のエリアが敵の支配でなければ可能
    const moveSide = firstShip ? firstShip.side
      : (PORTS[selectedLoc].side !== 'neutral' ? PORTS[selectedLoc].side : null);
    const enemySide = moveSide === 'allies' ? 'axis' : (moveSide === 'axis' ? 'allies' : null);
    seas.forEach(s1 => {
      if(enemySide && seaControl[s1] === enemySide) return;
      (SEA_ADJ[s1] || []).forEach(s2 => {
        if(s2 !== selectedLoc && !seas.includes(s2) && !seas2.includes(s2)){
          seas2.push(s2);
        }
      });
    });
  } else if(isSea){
    seas = SEA_ADJ[selectedLoc] || [];
    ports = Object.keys(PORT_SEAS).filter(p => PORT_SEAS[p].includes(selectedLoc));
  }
  // 6.6 バルト海はロシアとドイツの艦のみ（艦選択時のみ判定）
  if(firstShip){
    const country = firstShip.country;
    const allowBaltic = country === 'RU' || country === 'DE';
    if(!allowBaltic){
      seas  = seas.filter(s => s !== 'Baltic');
      seas2 = seas2.filter(s => s !== 'Baltic');
    }
  }
  // 14.3 船団は2海域同時移動不可、海上での2ターン目以降のみバレンツ海可
  if(firstShip && firstShip.type === 'CONVOY'){
    seas2 = []; // 2海域移動不可
    if(!firstShip.turnsAtSea || firstShip.turnsAtSea < 1){
      seas = seas.filter(s => s !== 'Barents');
    }
  }
  // 16.1 給油成功ドイツ艦は次ターン全海域配置可（海域→海域 直接）
  if(firstShip && firstShip.refuelTurn === currentTurn - 1){
    seas = Object.keys(SEAS);
    seas2 = [];
  }
  // 15.1 ロシア艦はバルト海のみ
  if(firstShip && firstShip.country === 'RU'){
    seas = seas.filter(s => s === 'Baltic');
    seas2 = seas2.filter(s => s === 'Baltic');
    ports = ports.filter(p => p === 'Leningrad');
  }
  // 15.4 米国艦は北大西洋と米国のみ（船団除く: 船団は欧州へ向かう）
  if(firstShip && firstShip.country === 'US' && firstShip.type !== 'CONVOY'){
    seas = seas.filter(s => s === 'NorthAtlantic');
    seas2 = [];
    ports = ports.filter(p => p === 'USA');
  }
  // イタリア艦はCAのみ南大西洋へ移動可
  if(firstShip && firstShip.country === 'IT' && firstShip.type !== 'CA'){
    seas = seas.filter(s => s !== 'SouthAtlantic');
    seas2 = seas2.filter(s => s !== 'SouthAtlantic');
  }
  // 14.1 同一海域に既に船団があれば船団は移動不可
  if(firstShip && firstShip.type === 'CONVOY'){
    seas = seas.filter(seaKey => {
      const existing = SHIPS.find(s => s !== firstShip && s.type === 'CONVOY' && s.location === seaKey && !s.sunk && !s.removed);
      return !existing;
    });
  }

  // 港のフィルタ: 使用可能ターン + 同陣営/中立のみ
  const side = firstShip ? firstShip.side : null;
  ports = ports.filter(p=>{
    const port = PORTS[p];
    if(!port.available.includes(currentTurn)) return false;
    if(side && port.side !== 'neutral' && port.side !== side) return false;
    return true;
  });
  return { seas, seas2, ports };
}

function renderDestButtons(){

  if(!selectedLoc){
    el.innerHTML = '<div style="font-size:0.8em;color:#aac;">港湾/海域を選択</div>';
    return;
  }
  const { seas, seas2, ports } = getValidDests();
  if(!seas.length && !seas2.length && !ports.length){
    el.innerHTML = '<div style="font-size:0.8em;color:#aac;">移動先なし</div>';
    return;
  }
  const seaBtns = seas.map(k =>
    `<button class="locBtn sea${selectedDest===k?' sel':''}" style="background:${SEA_COLOR[k]};border-color:${SEA_COLOR[k]};" onclick="selectDest('${k}')">${SEA_LABEL[k]}</button>`
  ).join('');
  const sea2Btns = seas2.map(k =>

    html += `<div style="width:100%;font-size:0.7em;color:#aac;">⚂=2海域(ダイス判定)</div>`;

}

function toggleShip(id){

  else selectedShipIds.push(id);
  refreshDestAfterSelect();
  renderLocShipList(); renderStatus();

function selectAllShipsHere(){
  if(!selectedLoc) return;
  selectedShipIds = SHIPS.filter(s => s.location === selectedLoc && !s.failedMove).map(s => s.id);
  refreshDestAfterSelect();
  renderLocShipList(); renderStatus();
}
// 選んだ艦で行き先が変わる（Uボートは地中海へも行ける、など）ので、移動先を作り直す
function refreshDestAfterSelect(){
  const { seas, seas2, ports } = getValidDests();
  if(selectedDest && ![...seas, ...seas2, ...ports].includes(selectedDest)) selectedDest = null;
  renderDestButtons();
}
function selectDest(loc){
  selectedDest = loc;
  renderDestButtons(); renderStatus();
}
function rollD6(){ return Math.floor(Math.random()*6) + 1; }

    const allies = SHIPS.filter(s => s.location===seaKey && !s.sunk && s.side==='allies' && !s.returnPending);

    const ax = SHIPS.filter(s => s.location===seaKey && !s.sunk && s.side==='axis'   && s.type!=='UBOAT' && !s.returnPending);

  });
  surfEl.innerHTML = surfSeas.length
    ? surfSeas.map(k => seaButton(k, 'resolveSurfacePhase', '水上戦闘')).join('')

function renderLbaButtons(){
  ['allies','axis'].forEach(side => {
    const el = document.getElementById(side==='allies' ? 'lbaAlliedButtons' : 'lbaAxisButtons');
    const enemyName = side==='allies' ? 'axis' : 'allies';
    // CV所在海域も対象に追加（空母のみ攻撃用）
    const cvSeas = new Set();
    SHIPS.filter(s => s.side === side && !s.sunk && s.type === 'CV' && !s.disabledThisTurn && s.location && SEAS[s.location]).forEach(s => cvSeas.add(s.location));
    // LBA使用済みなら CV所在海域のみ表示
    const candidateAreas = lbaUsed[side]
      ? [...cvSeas]
      : [...new Set([...LBA_TARGETS[side], ...cvSeas])];
    const targets = candidateAreas.filter(area => {
      const ships = SHIPS.filter(s =>
        s.location === area && !s.sunk && s.side === enemyName && s.type !== 'UBOAT' && !s.disabledThisTurn
      );
      return ships.length > 0;
    });
    if(!targets.length){
      el.innerHTML = '<div style="color:#888;font-size:0.8em;padding:3px;">攻撃可能なし</div>';
      return;
    }
    el.innerHTML = targets.map(area => {
      const isPort = !!PORTS[area];
      const label = isPort ? PORT_LABEL[area] : SEA_LABEL[area];
      const bg = isPort ? '#444' : SEA_COLOR[area];
      const lbaOk = LBA_TARGETS[side].includes(area);
      const cvHere = cvSeas.has(area);
      let prefix = '';
      if(lbaOk && cvHere) prefix = 'LBA+空母 ';
      else if(lbaOk) prefix = 'LBA ';
      else if(cvHere) prefix = '空母のみ ';
      return `<button class="locBtn" style="background:${bg};border-color:${bg};font-size:0.85em;padding:4px 8px;" onclick="startLbaBombing('${side}','${area}')">${prefix}${label}</button>`;
    }).join('');
  });
}

// 1発の空爆（5=即時帰還, 6=命中→損害ダイス）
function airFireAt(attacker, target, events){
  const r = rollD6();
  let dmgRoll = null;
  if(r === 6){
    dmgRoll = rollD6();
    events.push({ type:'fire', attacker: attacker.id, attackerName: attacker.name,
      target: target.id, targetName: target.name,
      dice:[{r, dmgRoll}], dmgTotal: dmgRoll, disabled: false });
    applyDamage(target, dmgRoll, events);
  } else if(r === 5){
    if(typeof logCombatLine === 'function') logCombatLine(`${target.name}: 即時帰還 (空爆)`);
    events.push({ type:'fire', attacker: attacker.id, attackerName: attacker.name,
      target: target.id, targetName: target.name,
      dice:[{r, dmgRoll:null}], dmgTotal: 0, disabled: true });
    // 'disabled' イベントで帰還港選択（UI or 自動）を行う
    events.push({ type:'disabled', ship: target.id, name: target.name });
  } else {
    events.push({ type:'fire', attacker: attacker.id, attackerName: attacker.name,
      target: target.id, targetName: target.name,
      dice:[{r, dmgRoll:null}], dmgTotal: 0, disabled: false });
  }
}

// LBA空爆 + 同海域の友軍空母合計
async function startLbaBombing(side, area, cvOnly = false, useCv = true){
  console.log('[DBG] startLbaBombing 呼び出し', side, area);
  console.trace();
  const lbaUsable = !cvOnly && LBA_TARGETS[side].includes(area) && !lbaUsed[side];
  const done = await runAirStrike(side, area, lbaUsable, side === 'allies' ? '連合軍の攻撃' : null, useCv);
  if(!done){
    document.getElementById('combatCloseBtn').style.display = '';
    return;
  }
  if(side === 'axis' && SEAS[area]) combatDone.axisAir.add(area);
  if(side === 'allies' && SEAS[area]){
    combatDone.alliedAir.add(area);
    // 同じ海域のドイツ軍空母は、ここでは撃ち返さない。ドイツ軍の航空攻撃の選択で、同じ海域のLBAとまとめて攻撃する
  }
  // 結果表示は次の戦闘へボタンまで残す
  await waitForCombatFlowBtn('次の戦闘へ');
  // 撃沈・即時帰還艦の表示クリア
  cleanupCombatModal();
  await flushPendingAxisDisabledUI();
  placeAllShips();
  runNextCombat();
}

// 空爆1回分: 目標を全弾宣言してから判定（flowLabel 指定時は戦闘進行ボタン待ち）
async function runAirStrike(side, area, lbaUsable, flowLabel, useCv = true){
  const enableAi = (side === aiSide);
  if(enableAi) aiMode = true;
  startCombatLogEntry(SEA_LABEL[area]||PORT_LABEL[area]||area, `LBA空爆 (${side==='allies'?'連合':'枢軸'})`);
  try {
  const enemyName = side==='allies' ? 'axis' : 'allies';
  // 9.5 即時帰還で当ターン帰還の艦は対象外
  const candidates = SHIPS.filter(s =>
    s.location === area && !s.sunk && s.side === enemyName && s.type !== 'UBOAT' && !s.disabledThisTurn
  );
  if(!candidates.length){ alert('対象艦なし'); return false; }
  // 友軍CV: 同海域のCVのみ（空母は海にいる船のみ攻撃可、港湾攻撃には参加しない）
  let cvs = [];
  if(SEAS[area] && useCv){
    cvs = SHIPS.filter(s => s.location === area && !s.sunk && s.side === side && s.type === 'CV' && !s.disabledThisTurn);
  }

  // 空母はLBA同等扱いで攻撃に参加（港湾攻撃には参加しない）
  const cvShots = cvs.reduce((sum, cv) => sum + (cv.air || 0), 0);
  const lbaShots = lbaUsable ? LBA_VALUE : 0;
  if(!lbaUsable && cvShots === 0){ alert('攻撃手段なし'); return false; }

  const initEvents = [{
    type:'phase', sea: area, phase:'lba',
    label: `空爆 ${side==='allies'?'(連合)':'(枢軸)'} - LBA${lbaShots} + 空母${cvShots}`
  }];
  await openCombatModal(area, initEvents, {excludeUboat: true});
  const lbaImg = side==='allies' ? 'イギリス/allied_lba.gif' : 'ドイツ/axis_lba.gif';
  const lbaCol = side==='allies' ? 'alliesShipList' : 'axisShipList';
  const colEl = document.getElementById(lbaCol);
  colEl.innerHTML = '';
  // LBA行: lbaShots 分（LBA_TARGETS該当海域のみ）
  for(let i=lbaShots-1; i>=0; i--){
    const rid = `lba-${i}`;
    const html = `<div class="cs-row" id="cs-${rid}">
      <div class="cs-img"><img src="images/${lbaImg}"></div>
      <div class="cs-name">陸上攻撃機 ${i+1}/${lbaShots}</div>
      <div class="cs-status" id="cs-st-${rid}">空爆</div>
      <div class="cs-dice" id="cs-dc-${rid}"></div>
    </div>`;
    colEl.insertAdjacentHTML('afterbegin', html);
  }
  // 空母行: 各空母を航空攻撃力(cv.air)の行数ずつ独立表示（船名・画像）
  for(const cv of cvs){
    const existing = document.getElementById(`cs-${cv.id}`);
    if(existing) existing.remove();
    for(let i=0; i<(cv.air || 0); i++){
      const rid = `${cv.id}-${i}`;
      const html = `<div class="cs-row" id="cs-${rid}">
        <div class="cs-img"><img src="images/${cv.file}"></div>
        <div class="cs-name">${cv.name} ${i+1}/${cv.air}</div>
        <div class="cs-status" id="cs-st-${rid}">空爆</div>
        <div class="cs-dice" id="cs-dc-${rid}"></div>
      </div>`;
      colEl.insertAdjacentHTML('beforeend', html);
    }
  }
  await playEvents(initEvents);

  if(flowLabel){
    setPhaseLabel(`${flowLabel}ボタンを押してください`);
    await waitForCombatFlowBtn(flowLabel);
  }

  const targetSide = enemyName;
  // 各敵艦は LBA+空母合計で1回のみ攻撃可（敵が少なければ余剰攻撃は失われる）
  const targetedIds = new Set();

  // 攻撃一覧: LBA lbaShots 発（LBA_TARGETS該当海域のみ）→ 各空母 航空攻撃力(cv.air) 発
  const shots = [];
  for(let i=0; i<lbaShots; i++){
    shots.push({ rid:`lba-${i}`, name:`LBA${i+1}`, mode:'air', label:`LBA ${i+1}/${lbaShots} 発` });
  }
  for(const cv of cvs){
    for(let i=0; i<(cv.air || 0); i++){
      shots.push({ rid:`${cv.id}-${i}`, name:`${cv.name}${i+1}`, mode:'cv', label:`${cv.name} 空爆 ${i+1}/${cv.air} 発` });
    }
  }

  // 1) 目標宣言（全弾の目標を先に決める）
  const declared = [];
  for(const shot of shots){
    const remaining = candidates.filter(s => !s.sunk && !targetedIds.has(s.id));
    if(!remaining.length){
      setPhaseLabel(`${shot.label}: 攻撃可能な敵艦なし`);
      await new Promise(r => setTimeout(r, 400));
      break;
    }
    setPhaseLabel(`目標を選択してください（${shot.label}）`);
    highlightShip(shot.rid, 'firing');
    const target = await waitForTargetClickIn(targetSide, area, targetedIds, shot.mode);
    unhighlightShip(shot.rid, 'firing');
    if(!target) break;
    targetedIds.add(target.id);
    declared.push({ shot, target });
    const dcEl = document.getElementById(`cs-dc-${shot.rid}`);
    if(dcEl) dcEl.innerHTML = `<span style="color:#aac;margin-right:4px;">→${target.name}</span>`;
  }

  // 人間側は攻撃ボタンで判定開始
  if(declared.length && !enableAi){
    setPhaseLabel('攻撃ボタンを押してください');
    await waitForAirAttackBtn();
  }

  // 2) 判定
  for(const { shot, target } of declared){
    highlightShip(shot.rid, 'firing');
    const fireEvents = [];
    airFireAt({id:shot.rid, name:shot.name}, target, fireEvents);
    await playEvents(fireEvents);
    unhighlightShip(shot.rid, 'firing');
    placeAllShips();
  }

  if(lbaUsable) lbaUsed[side] = true;
  setPhaseLabel('━ 空爆 終了 ━');
  placeAllShips();
  renderLocShipList(); renderSeaResetButtons(); renderCombatPane();
  return true;
  } finally {
    aiMode = false;
    endCombatLogEntry();
  }
}

// waitForTargetClick の拡張: 既ターゲット除外
function waitForTargetClickIn(side, focusSea, excludeIds, mode){
  return new Promise(resolve => {
    const candidates = SHIPS.filter(s =>
      s.side === side && !s.sunk && s.location === focusSea && (!excludeIds || !excludeIds.has(s.id)) && s.type !== 'UBOAT' && !s.disabledThisTurn
    );
    if(!candidates.length){ resolve(null); return; }
    if(aiMode && side === humanSide){
      // 連合の航空攻撃（空母・LBA）: 大物（攻撃力+防御力が最大）を狙う。5の目で帰還させると影響が大きい
      if(side === 'axis' && (mode === 'air' || mode === 'cv')){
        const val = c => (c.atkOrig || c.atk || 0) + (c.def || 0);
        // 味方の艦隊がいないとき: 大物を帰還させても意味がないので撃沈の確率が高い艦（防御力−損害が小さい艦）を狙う
        //   撃沈 = 6の目のあと損害ダイス > 防御力−損害。残りが6以上の艦は撃沈できない
        const fleet = SHIPS.some(s => s.side === 'allies' && !s.sunk && !s.removed && s.location === focusSea && s.type !== 'CONVOY');
        const left = c => (c.def || 0) - (c.damage || 0);
        const sinkable = candidates.filter(c => left(c) < 6);
        if(!fleet && sinkable.length){
          resolve(sinkable.slice().sort((a, b) => left(a) - left(b) || val(b) - val(a))[0]); return;
        }
        resolve(candidates.slice().sort((a, b) => val(b) - val(a) || (a.damage || 0) - (b.damage || 0))[0]); return;
      }
      if(mode === 'air'){
        // 航空攻撃: 第1巡 無傷で未攻撃の艦を def 低い順
        const undamagedUnhit = candidates.filter(c => c.damage === 0 && !c._aiAirHit1);
        if(undamagedUnhit.length){
          undamagedUnhit.sort((a,b) => (a.def||0) - (b.def||0));
          undamagedUnhit[0]._aiAirHit1 = true;
          undamagedUnhit[0]._aiAirHits = (undamagedUnhit[0]._aiAirHits || 0) + 1;
          resolve(undamagedUnhit[0]); return;
        }
        // 航空攻撃: 第2巡以降 hit数最小、damage少ない、def低い順
        const minAirHits = Math.min(...candidates.map(c => c._aiAirHits || 0));
        const airPool = candidates.filter(c => (c._aiAirHits || 0) === minAirHits);
        airPool.sort((a, b) => {
          if((a.damage||0) !== (b.damage||0)) return (a.damage||0) - (b.damage||0);
          return (a.def||0) - (b.def||0);
        });
        airPool[0]._aiAirHits = minAirHits + 1;
        resolve(airPool[0]); return;
      }
      if(mode === 'cv'){
        // 空母: 一番強い (atk高い) 無傷艦に集中、damage>0/即時帰還で次の無傷艦へ
        const undamaged = candidates.filter(c => c.damage === 0);
        if(undamaged.length){
          undamaged.sort((a,b) => (b.atk||0) - (a.atk||0));
          resolve(undamaged[0]); return;
        }
        // 全艦損害ありなら全艦から atk 高い順
        const sorted = [...candidates].sort((a,b) => (b.atk||0) - (a.atk||0));
        resolve(sorted[0]); return;
      }
      // 水上戦闘: 無傷艦があればモーダル順で先頭、なければモーダル順で先頭
      const undamaged = candidates.filter(c => c.damage === 0);
      resolve(undamaged.length ? undamaged[0] : candidates[0]); return;
    }
    const handlers = {};
    candidates.forEach(s => {
      const row = ensureCombatRow(s);
      if(!row) return;
      row.classList.add('selectable');
      const onClick = () => {
        candidates.forEach(c => {
          const r = document.getElementById(`cs-${c.id}`);
          if(r){ r.classList.remove('selectable'); if(handlers[c.id]) r.removeEventListener('click', handlers[c.id]); }
        });
        resolve(s);
      };
      handlers[s.id] = onClick;
      row.addEventListener('click', onClick);
    });
  });
}

// 1+2 統合: 同一海域でASW→Uボート反撃を連続実行（損害同時適用）
async function resolveUboatCombatPhase(seaKey){
  console.log('[DBG] resolveUboatCombatPhase 呼び出し', seaKey);
  console.trace();
  startCombatLogEntry(SEA_LABEL[seaKey]||seaKey, 'Uボート戦闘 (ASW+反撃)');
  // 同時適用用のpending: ASW結果(撃沈/帰還) + 反撃ダメージ/即時帰還
  const pending = {
    uboatSunk: new Set(), uboatReturn: new Set(),
    damage: {}, disabled: new Set()
  };
  await openCombatModal(seaKey, [], {aswOnly: true});
  // 連合軍の攻撃（ASW）
  setPhaseLabel('連合軍の攻撃ボタンを押してください');
  await waitForCombatFlowBtn('連合軍の攻撃');
  const aswEvents = [];
  resolveUboatASW(seaKey, aswEvents, pending);
  if(aswEvents.length){
    await playEvents(aswEvents);
  }
  // 反撃: ASWで撃沈/即時帰還となったUボートは反撃不可
  const uboats = SHIPS.filter(s =>
    s.type==='UBOAT' && s.side==='axis' && s.location===seaKey && !s.sunk && !s.returnPending
    && !pending.uboatSunk.has(s.id) && !pending.uboatReturn.has(s.id)
  );
  if(uboats.length){
    const allies = SHIPS.filter(s => s.location===seaKey && !s.sunk && s.side==='allies' && !s.returnPending);
    if(allies.length){
      // ドイツ軍の攻撃（Uボート反撃）
      setPhaseLabel('ドイツ軍の攻撃ボタンを押してください');
      await waitForCombatFlowBtn('ドイツ軍の攻撃');
      await playEvents([{type:'phase', sea:seaKey, label:'Uボート反撃'}]);
      // 1) 目標宣言（全Uボートの目標を先に決める。同じ艦を複数で狙える。結果を見ての変更不可）
      const declared = [];
      for(const u of uboats){
        highlightShip(u.id, 'firing');
        setPhaseLabel(`目標を選択してください（${u.name}）`);
        const target = await waitForTargetClickIn('allies', seaKey);
        unhighlightShip(u.id, 'firing');
        if(!target) break;
        declared.push({ u, target });
        const dcEl = document.getElementById(`cs-dc-${u.id}`);
        if(dcEl) dcEl.innerHTML = `<span style="color:#aac;margin-right:4px;">→${target.name}</span>`;
      }
      // 人間側は攻撃ボタンで判定開始
      if(declared.length && humanSide === 'axis'){
        setPhaseLabel('攻撃ボタンを押してください');
        await waitForAirAttackBtn();
      }
      // 2) 判定
      for(const { u, target } of declared){
        highlightShip(u.id, 'firing');
        const fireEvents = [];
        uboatFireAt(u, target, fireEvents, pending);
        await playEvents(fireEvents);
        unhighlightShip(u.id, 'firing');
      }
    }
  }
  // 同時適用
  setPhaseLabel('━ 損害適用 ━');
  const applyEvents = [];
  for(const tid in pending.damage){
    const ship = SHIPS.find(s => s.id === tid);
    if(ship) applyDamage(ship, pending.damage[tid], applyEvents);
  }
  for(const tid of pending.disabled){
    const ship = SHIPS.find(s => s.id === tid);
    if(ship && !ship.sunk){
      markReturnPending(ship, true);
      applyEvents.push({ type:'return_disabled', ship: ship.id, name: ship.name });
    }
  }
  for(const id of pending.uboatSunk){
    const u = SHIPS.find(s => s.id === id);
    if(u) u.sunk = true;
  }
  for(const id of pending.uboatReturn){
    const u = SHIPS.find(s => s.id === id);
    if(u && !u.sunk) markReturnPending(u, true);
  }
  await playEvents(applyEvents);
  combatDone.uboat.add(seaKey);
  setPhaseLabel('━ Uボート戦闘 終了 ━');
  endCombatLogEntry();
  placeAllShips();
  renderCombatPane();
  // 結果表示は次の戦闘へボタンまで残す
  await waitForCombatFlowBtn('次の戦闘へ');
  // 撃沈・即時帰還艦の表示クリア
  cleanupCombatModal();
  await flushPendingAxisDisabledUI();
  placeAllShips();
  runNextCombat();
}

// 撃沈艦は表示削除、帰還艦はatDock=true、ダイス/ラベルクリア
function cleanupCombatModal(){
  SHIPS.forEach(s => {
    if(s.sunk || s.returnPending){
      const row = document.getElementById(`cs-${s.id}`);
      if(row) row.remove();
    } else if(s.location && PORTS[s.location]){
      s.atDock = true;
      const row = document.getElementById(`cs-${s.id}`);
      if(row) row.remove();
    }
  });
  document.querySelectorAll('#combatModal [id^="cs-dc-"]').forEach(el => el.innerHTML = '');
  document.querySelectorAll('#combatModal .result-label').forEach(el => el.remove());
}
