<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ヴェストカペレ上陸を題材にした、同じ画面で遊べる二人用はがきウォーゲーム。">
<title>ヴァルヘレン1944 堤防突破</title>
<script data-goatcounter="https://shigerusuzuki.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<style>:root {
  color-scheme: light; --page:#f3efe2; --surface:#fbf8ed; --ink:#1b322c; --muted:#54655c;
  --line:#c6c8b6; --green:#285449; --green-pale:#e3ebd9; --rust:#8d3d2e; --rust-pale:#f2dfd2;
  --blue:#2b6070; --blue-pale:#d9e9e7; --heading:"Baskerville","YuMincho","Hiragino Mincho ProN",serif;
  font-family:"Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif; color:var(--ink); background:var(--page);
}
* { box-sizing:border-box; }
body { margin:0; line-height:1.55; }
button { font:inherit; font-weight:700; color:inherit; border:1px solid var(--line); padding:.48rem .78rem; border-radius:5px; background:var(--surface); cursor:pointer; }
button:hover { background:#e8ead8; }
button:focus-visible, summary:focus-visible { outline:3px solid #165f85; outline-offset:3px; }
button:disabled { cursor:default; opacity:.54; }
button.primary { color:white; background:var(--green); border-color:var(--green); }
button.primary:hover { background:#193e35; }
button.danger { color:white; background:var(--rust); border-color:var(--rust); }
button.danger:hover { background:#6e3026; }
.masthead { background:#ede7d4; border-bottom:1px solid #b7bca8; }
.masthead-inner, main { width:min(1280px,100% - 44px); margin-inline:auto; }
.masthead-inner { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:15px 0 17px; }
.date { color:var(--muted); font-size:.79rem; letter-spacing:.07em; }
h1 { font-family:var(--heading); font-size:clamp(1.55rem,3.3vw,2.7rem); line-height:1.12; letter-spacing:.012em; margin:.16rem 0 0; }
h1 span { display:inline-block; margin-inline-start:.15em; }
.top-actions,.actions { display:flex; flex-wrap:wrap; gap:.5rem; }
.top-actions { flex-shrink:0; }
main { padding:15px 0 25px; }
.turnbar,.card { border:1px solid var(--line); background:var(--surface); border-radius:7px; }
.turnbar { padding:.55rem .78rem; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:.7rem; }
#turn-number { font-weight:850; white-space:nowrap; font-size:clamp(.8rem,2vw,1.08rem); }
#turn-number small { color:var(--muted); font-weight:650; }
#steps { display:flex; gap:.24rem; margin:0; padding:0; list-style:none; }
#steps li { font-size:.85rem; font-weight:700; color:var(--muted); padding:.12rem .5rem; border:1px solid transparent; border-radius:4px; white-space:nowrap; }
#steps li.current { background:var(--green-pale); color:var(--green); border-color:#8ca186; }
#steps li.current.de { background:var(--rust-pale); color:var(--rust); border-color:#c39687; }
#steps li.done { color:#767a6e; text-decoration:line-through; }
#turn-side { font-weight:800; font-size:.91rem; white-space:nowrap; }
.layout { display:grid; grid-template-columns:minmax(0,1fr) clamp(265px,27%,350px); gap:14px; align-items:start; }
.map-panel { border:1px solid #98a79c; border-radius:8px; overflow:hidden; background:var(--surface); }
#board { position:relative; isolation:isolate; aspect-ratio:107 / 76; background-color:#cbdcdf; background-size:100% 100%; background-repeat:no-repeat; }
#routes, #zones { position:absolute; inset:0; width:100%; height:100%; }
#routes { pointer-events:none; }
.zone { position:absolute; transform:translate(-50%,-50%); width:11.5%; aspect-ratio:1; display:grid; place-items:center; padding:0; background:#f8f1da; border:1.5px solid #79775e; border-radius:7%; box-shadow:0 2px 3px #18251828; }
.zone:empty { background:#f8f1dae8; }
.zone:empty::after { content:""; width:22%; height:22%; border:1px solid #9b987c; border-radius:50%; }
.zone[data-type="beach"] { border-color:var(--green); }
.zone[data-type="fort"] { border-color:var(--rust); }
.zone.uk { background:var(--green-pale); color:var(--green); border-color:var(--green); }
.zone.de { background:var(--rust-pale); color:var(--rust); border-color:var(--rust); }
.zone[aria-pressed="true"] { outline:3px solid #266381; outline-offset:2px; z-index:2; }
.zone.target { box-shadow:0 0 0 3px #267591,0 2px 3px #18251845; z-index:1; }
.zone.target.attack { box-shadow:0 0 0 3px #b34c35,0 2px 3px #18251845; }
.zone.target.buffalo { box-shadow:0 0 0 3px #267591,0 0 0 6px #82bdb5; }
.zone.target:empty::after { background:#2c6e81; border-color:#2c6e81; }
.piece { display:grid; grid-template-rows:auto minmax(0,1fr) auto; align-items:center; justify-items:center; width:100%; height:100%; padding:2% 3%; overflow:hidden; line-height:1.04; }
.piece b { font-size:clamp(.55rem,1.4vw,.95rem); padding-top:2%; }
.piece img { width:92%; height:100%; min-height:0; object-fit:contain; mix-blend-mode:multiply; }
.piece small { display:flex; justify-content:space-around; width:90%; font-size:clamp(.54rem,1.1vw,.8rem); font-weight:750; padding-bottom:3%; }
.acted::before { content:"済"; position:absolute; top:-.37em; right:-.36em; font-size:clamp(.56rem,1.1vw,.74rem); font-weight:800; padding:.04em .25em; background:#4c5750; color:white; border-radius:3px; }
.zone-label { position:absolute; z-index:3; transform:translate(-50%,0); white-space:nowrap; border-radius:3px; padding:.04rem .34rem; color:#384034; background:#faf3deed; font-size:clamp(.58rem,1.18vw,.91rem); font-weight:800; pointer-events:none; }
.zone-label.above { transform:translate(-50%,-100%); }
.zone-label.fort { color:var(--rust); }
.legend { display:flex; gap:clamp(.55rem,2vw,1.5rem); padding:8px 11px; flex-wrap:wrap; font-size:.78rem; color:var(--muted); }
.legend i { width:22px; display:inline-block; vertical-align:middle; border-top:2px solid #4d5040; }
.legend i.blue { border-color:var(--blue); border-top-style:dashed; }
.legend b { color:var(--rust); }
.sidebar { display:grid; gap:11px; }
#status { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.resource { background:var(--blue-pale); border:1px solid #b3c9c4; padding:8px 10px; border-radius:5px; }
.resource span { display:block; font-size:.75rem; color:#3f5c60; }
.resource strong { font-size:.99rem; }
.card { padding:12px 14px; }
.card h2 { margin:0 0 .35rem; font-size:1.17rem; line-height:1.4; }
.card p { margin:.25rem 0 .7rem; }
.card p:last-child { margin-bottom:.1rem; }
.command { border-top:4px solid var(--green); }
.command.de { border-top-color:var(--rust); }
.command .actions { margin-top:.75rem; }
.command .hint { font-size:.9rem; color:var(--muted); }
.orders { display:grid; gap:.38rem; }
.orders button { text-align:left; }
.mission { font-size:.87rem; }
.objective { display:flex; justify-content:space-between; gap:.5rem; padding:.3rem 0; border-top:1px solid #dddccc; }
.objective b.uk { color:var(--green); }
.objective b.de { color:var(--rust); }
.dice { display:grid; grid-template-columns:1fr 1fr; gap:.45rem; margin:.5rem 0; font-size:.8rem; }
.dice div { padding:.45rem; border:1px solid var(--line); border-radius:4px; background:#f2efdf; }
.dice strong { display:block; font-size:1.1rem; }
.history { margin-top:14px; }
.history summary { cursor:pointer; font-weight:800; }
.history summary span { font-weight:500; color:var(--muted); margin-left:.3rem; font-size:.87rem; }
#log { margin:.45rem 0 0; padding:0; list-style:none; max-height:16rem; overflow:auto; }
#log li { border-top:1px solid #e2dfcf; padding:.38rem 0; }
#log small { color:var(--muted); margin-right:.55rem; white-space:nowrap; }
dialog { background:var(--surface); color:var(--ink); border:1px solid #91a395; border-radius:9px; padding:0; width:min(720px,100% - 24px); max-height:90dvh; box-shadow:0 12px 40px #132a3444; }
dialog::backdrop { background:#243d3669; }
#reset-dialog { width:min(430px,100% - 24px); }
.dialog-head { display:flex; align-items:center; justify-content:space-between; padding:.65rem 1.1rem; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:1; background:#ece8d7; }
.dialog-head h2 { margin:0; font-size:1.3rem; }
.dialog-body { padding:.65rem 1.1rem 1.15rem; font-size:.965rem; }
.dialog-body h3 { margin:1rem 0 .2rem; }
.dialog-body p { margin:.35rem 0; }
.inline-piece { white-space:nowrap; font-weight:750; }
.inline-piece img { width:1.7rem; height:1.45rem; object-fit:contain; vertical-align:-.27em; mix-blend-mode:multiply; margin:0 .12em; }
.unit-table { border-collapse:collapse; width:100%; }
.unit-table th,.unit-table td { border-bottom:1px solid var(--line); padding:.3rem .55rem; text-align:center; }
.unit-table th:first-child,.unit-table td:first-child { text-align:left; }
.unit-table img { width:35px; height:30px; object-fit:contain; vertical-align:middle; margin-right:.45rem; mix-blend-mode:multiply; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
@media (max-width:850px) {
  .layout { grid-template-columns:minmax(0,1fr); }
  .sidebar { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  .command { grid-column:1 / -1; grid-row:1; }
  .zone { width:11.5%; }
  .piece b { font-size:clamp(.55rem,2vw,1rem); }
  .piece small { font-size:clamp(.54rem,1.6vw,.85rem); }
  .zone-label { font-size:clamp(.56rem,1.85vw,.97rem); }
}
@media (max-width:540px) {
  .masthead-inner, main { width:calc(100% - 20px); }
  .masthead-inner { align-items:flex-start; flex-wrap:wrap; padding:10px 0; gap:.55rem; }
  .top-actions button { padding:.3rem .55rem; font-size:.83rem; }
  .turnbar { gap:.2rem; padding:.45rem .4rem; }
  #steps li { font-size:.73rem; padding:.08rem .21rem; }
  #turn-side { font-size:.75rem; }
  .zone { width:12.3%; }
  .zone-label { padding:.03rem .21rem; }
  .sidebar { grid-template-columns:1fr; }
  .mission { grid-row:auto; }
}
#board { container-type:inline-size; }
@media (max-width:400px) {
  .unit-table th,.unit-table td { padding:.28rem .24rem; }
  .unit-table img { width:28px; margin-right:.25rem; }
}

.identity { min-width:0; }
h1 b { font-weight:inherit; }
.tagline { color:var(--muted); margin:.34rem 0 0; font-size:.85rem; }
.top-actions { justify-content:flex-end; align-items:center; }
.language select {
  min-height:2.3rem; border:1px solid var(--line); border-radius:5px;
  background:var(--surface); color:var(--ink); font:inherit; padding:.28rem .42rem;
}
.language select:focus-visible { outline:3px solid #165f85; outline-offset:3px; }
.map-names { position:absolute; inset:0; pointer-events:none; color:#486a6b; }
.map-names span { position:absolute; font-weight:650; font-size:clamp(.47rem,2.05cqw,.95rem); line-height:1.13; }
.map-sea { left:3%; top:52%; max-width:18%; }
.map-breach { left:5.4%; top:43%; max-width:11.6%; }
.map-polder { left:53.5%; top:48.6%; max-width:27%; }
.map-north { right:3.1%; top:4.2%; max-width:26%; text-align:right; }
.map-south { right:2%; bottom:10%; max-width:31%; text-align:right; }
.map-names .map-compass { left:5.22%; top:3.8%; color:var(--green); transform:translateX(-50%); font-size:clamp(.52rem,2.7cqw,1.1rem); }
.acted::before { content:attr(data-badge); }
.zone-label { max-width:27%; white-space:normal; width:max-content; text-align:center; line-height:1.14; }
#turn-side { white-space:normal; text-align:right; }
.history summary .log-title { margin:0; color:inherit; font:inherit; }
.inline-piece { white-space:normal; }
@media (max-width:670px) {
  .masthead-inner { flex-wrap:wrap; }
  .top-actions { justify-content:flex-start; }
}
@media (max-width:540px) {
  .language select { min-height:1.95rem; font-size:.83rem; }
  .tagline { font-size:.78rem; }
  .zone-label { font-size:clamp(.48rem,2cqw,.77rem); }
}
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <div class="identity">
      <div class="date" data-text="date"></div>
      <h1><b data-text="title">ヴァルヘレン1944</b> <span data-text="subtitle">堤防突破</span></h1>
      <p class="tagline" data-text="tagline"></p>
    </div>
    <div class="top-actions">
      <label class="language"><span class="sr-only" data-text="language"></span><select id="language" translate="no"></select></label>
      <button id="open-rules" type="button" data-text="rules"></button>
      <button id="open-reset" type="button" data-text="newMatch"></button>
    </div>
  </div>
</header>
<main>
  <div class="turnbar"><div id="turn-number"></div><ol id="steps" data-label="stepsLabel"></ol><div id="turn-side"></div></div>
  <div class="layout">
    <section class="map-panel" data-label="boardLabel">
      <div id="board">
        <div class="map-names" aria-hidden="true">
          <span class="map-sea" data-text="mapSea"></span>
          <span class="map-breach" data-text="mapBreach"></span>
          <span class="map-polder" data-text="mapPolder"></span>
          <span class="map-north" data-text="mapNorth"></span>
          <span class="map-south" data-text="mapSouth"></span>
          <span class="map-compass" data-text="mapCompass"></span>
        </div>
        <canvas id="routes" aria-hidden="true"></canvas><div id="zones"></div>
      </div>
      <div class="legend"><span><i></i> <span data-text="bothSides"></span></span><span><i class="blue"></i> <span data-text="britishOnly"></span></span><span><b>★</b> <span data-text="fortsBonus"></span></span></div>
    </section>
    <aside class="sidebar" data-label="ordersLabel">
      <div id="status"></div>
      <section class="card command" id="command" aria-labelledby="command-title"></section>
      <section class="card mission"><h2 data-text="victory"></h2><p data-text="mission"></p><div id="objectives"></div></section>
    </aside>
  </div>
  <details class="card history" id="history"><summary><span class="log-title" data-text="log"></span> <span id="log-count"></span></summary><ol id="log"></ol></details>
  <div class="sr-only" id="announcement" aria-live="polite"></div>
</main>
<dialog id="rules-dialog" aria-labelledby="rules-title">
  <div class="dialog-head"><h2 id="rules-title" data-text="rules"></h2><form method="dialog"><button data-text="close"></button></form></div>
  <div class="dialog-body">
    <h3 data-text="rTurnHeading"></h3>
    <p data-text="rTurn"></p>
    <p data-rule="rActed"></p>
    <p data-rule="rReserve"></p>
    <h3 data-text="rMoveHeading"></h3>
    <p data-text="rMove"></p>
    <h3 data-text="buffalo"></h3>
    <p data-text="rBuffalo"></p>
    <h3 data-text="rCombatHeading"></h3>
    <p data-rule="rCombat"></p>
    <ul><li data-text="rAttacker"></li><li data-text="rDefender"></li><li data-text="rHold"></li></ul>
    <h3 data-text="victory"></h3>
    <p data-text="rWin"></p>
    <h3 data-text="rUnits"></h3>
    <table class="unit-table"><thead><tr><th scope="col" data-text="unit"></th><th scope="col" data-text="atk"></th><th scope="col" data-text="def"></th><th scope="col" data-text="mov"></th></tr></thead><tbody id="unit-rows"></tbody></table>
  </div>
</dialog>
<dialog id="reset-dialog" aria-labelledby="reset-title">
  <div class="dialog-head"><h2 id="reset-title" data-text="newMatch"></h2></div>
  <div class="dialog-body"><p data-text="resetBody"></p><div class="actions"><form method="dialog"><button data-text="back"></button></form><button type="button" class="primary" id="reset" data-text="start"></button></div></div>

const zones = {
  red:   {name: "赤浜", x: 30.2, y: 54, type: "beach"},
  town:  {name: "ヴェストカペレ", x: 51, y: 53.2},
  north: {name: "北砲台 W15", x: 59.7, y: 70.5, type: "fort", above: true},
  white: {name: "白浜", x: 36.1, y: 31.8, type: "beach"},
  radar: {name: "レーダー所", x: 58.6, y: 27.8},
  south: {name: "南砲台 W13", x: 84.5, y: 17.4, type: "fort", above: true},
  dyke:  {name: "内陸堤道", x: 93.2, y: 47, above: true},
};
const pieces = {
  "41": {name: "第41海兵コマンド", code: "41", side: "uk", attack: 2, defense: 1, move: 1},
  "48": {name: "第48海兵コマンド", code: "48", side: "uk", attack: 1, defense: 1, move: 1},
  "47": {name: "第47海兵コマンド", code: "47", side: "uk", attack: 1, defense: 2, move: 1},
  W15: {name: "北砲台守備隊", code: "W15", side: "de", attack: 1, defense: 1, move: 0},
  W13: {name: "南砲台守備隊", code: "W13", side: "de", attack: 1, defense: 2, move: 0},
  G: {name: "独第70歩兵師団分遣隊", code: "歩兵", side: "de", attack: 1, defense: 1, move: 1},
};
const solid = [
  ["red", "town"], ["town", "north"], ["white", "radar"], ["radar", "south"],
  ["town", "dyke"], ["radar", "dyke"], ["north", "dyke"], ["south", "dyke"],
];
const dashed = [["red", "white"], ["town", "radar"]];
const beaches = ["red", "white"];
const sides = {uk: "英軍", de: "独軍"};

function newGame() {
  return {
    version: 2, turn: 1, step: 0, support: 2, buffalo: true, reserve: true,
    positions: {"41": "red", "48": "white", W15: "north", W13: "south", G: "dyke"},
    acted: [], pending: null, winner: null, log: [],
  };
}

function actor(game) {
  if (game.pending?.type === "retreat") return pieces[game.pending.defender].side;
  return game.step % 2 === 0 ? "uk" : "de";
}

function occupant(game, zone) {
  return Object.keys(game.positions).find(id => game.positions[id] === zone);
}

function adjacent(zone, faction) {
  const links = faction === "uk" ? [...solid, ...dashed] : solid;
  return links.filter(pair => pair.includes(zone)).map(pair => pair.find(key => key !== zone));
}

function openBeaches(game) {
  return beaches.filter(zone => !occupant(game, zone));
}

function record(game, key, args = {}) {
  game.log.unshift({turn: game.turn, step: game.step, message: {key, args}});
}

function finishAction(game) {
  game.pending = null;
  if (game.step < 3) {
    game.step += 1;
    return;
  }
  if (game.turn === 6) {
    game.winner = ["north", "south"].every(zone => pieces[occupant(game, zone)]?.side === "uk") ? "uk" : "de";
    record(game, "logWin", {side: game.winner});
    return;
  }
  game.turn += 1;
  game.step = 0;
  game.acted = [];
  if (game.reserve && openBeaches(game).length) game.pending = {type: "landing"};
}

function land(game, zone) {
  if (game.pending?.type !== "landing" || !openBeaches(game).includes(zone)) return false;
  game.positions["47"] = zone;
  game.reserve = false;
  game.pending = null;
  record(game, "logLand", {unit: "47", zone});
  return true;
}

function options(game, id) {
  const from = game.positions[id];
  const unit = pieces[id];
  if (!from || unit.side !== actor(game) || game.winner || game.pending || game.acted.includes(id)) return [];
  const moves = adjacent(from, unit.side).flatMap(zone => {
    const target = occupant(game, zone);
    if (target && pieces[target].side !== unit.side) return [{zone, type: "attack", target}];
    return !target && unit.move ? [{zone, type: "move"}] : [];
  });
  if (unit.side === "uk" && game.buffalo && beaches.includes(from) && !occupant(game, "dyke")) {
    moves.push({zone: "dyke", type: "buffalo"});
  }
  return moves;
}

function takeOption(game, id, zone, type) {
  const option = options(game, id).find(move => move.zone === zone && move.type === type);
  if (!option) return false;
  if (type === "attack") {
    game.pending = {type: "attack", attacker: id, defender: option.target, zone};
    return true;
  }
  game.acted.push(id);
  game.positions[id] = zone;
  if (type === "buffalo") game.buffalo = false;
  record(game, type === "buffalo" ? "logBuffalo" : "logMove", {unit: id, zone});
  finishAction(game);
  return true;
}

function pass(game) {
  if (game.winner || game.pending) return false;
  record(game, "logPass", {side: actor(game)});
  finishAction(game);
  return true;
}

function randomDie() {
  return Math.floor(Math.random() * 6) + 1;
}

function fight(game, support, roll = randomDie) {
  if (game.pending?.type !== "attack") return false;
  const {attacker, defender, zone} = game.pending;
  const a = pieces[attacker];
  const d = pieces[defender];
  if (support && (a.side !== "uk" || game.support <= 0)) return false;
  if (support) game.support -= 1;
  game.acted.push(attacker);
  const fort = zones[zone].type === "fort" ? 1 : 0;
  const naval = support ? 2 : 0;
  const attackDie = roll();
  const defenseDie = roll();
  const attack = attackDie + a.attack + naval;
  const defense = defenseDie + d.defense + fort;
  const result = {attacker, defender, zone, attackDie, defenseDie, attack, defense, fort, naval};
  const margin = attack - defense;
  record(game, naval ? "logFightNaval" : "logFight", {attacker, defender, attack, defense});
  if (margin > 0) {
    const retreat = margin < 3 && d.move ? adjacent(zone, d.side).filter(dest => !occupant(game, dest)) : [];
    if (retreat.length) {
      game.pending = {type: "retreat", attacker, defender, zone, retreat, result};
      return true;
    }
    delete game.positions[defender];
    if (a.move) game.positions[attacker] = zone;
    result.outcome = {key: "logRemoved", args: {unit: defender}};
  } else if (margin <= -3) {
    delete game.positions[attacker];
    result.outcome = {key: "logRemoved", args: {unit: attacker}};
  } else {
    result.outcome = {key: "logHold", args: {}};
  }
  record(game, result.outcome.key, result.outcome.args);
  game.pending = {type: "report", result};
  return true;
}

function retreatTo(game, dest) {
  const pending = game.pending;
  if (pending?.type !== "retreat" || !pending.retreat.includes(dest)) return false;
  game.positions[pending.defender] = dest;
  if (pieces[pending.attacker].move) game.positions[pending.attacker] = pending.zone;
  pending.result.outcome = {key: "logRetreat", args: {unit: pending.defender, zone: dest}};
  record(game, pending.result.outcome.key, pending.result.outcome.args);
  game.pending = {type: "report", result: pending.result};
  return true;
}

function acknowledgeReport(game) {
  if (game.pending?.type !== "report") return false;
  finishAction(game);
  return true;
}

const byId = id => document.getElementById(id);
const storageKey = "walcheren-1944-v1";
const languageKey = "walcheren-1944-language";
const dieFaces = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
const pieceOrder = ["41", "48", "47", "W15", "W13", "G"];
const zoneKeys = {red: "zoneRed", white: "zoneWhite", town: "zoneTown", north: "zoneNorth",
  south: "zoneSouth", radar: "zoneRadar", dyke: "zoneDyke"};
const labelJoiner = {"ja": "、", "zh-Hans": "，"};
const controls = new Map();
const mapLabels = new Map();

const legacyNames = {
  unit: Object.fromEntries(Object.entries(pieces).map(([id, unit]) => [unit.name, id])),
  zone: Object.fromEntries(Object.entries(zones).map(([id, zone]) => [zone.name, id])),
  side: Object.fromEntries(Object.entries(sides).map(([id, name]) => [name, id])),
};
const legacyPatterns = [
  [/^(.+)の勝利。$/, "logWin", ["side"]],
  [/^(.+)はパス。$/, "logPass", ["side"]],
  [/^(.+)が(.+)に上陸。$/, "logLand", ["unit", "zone"]],
  [/^(.+)が(.+)へ移動。$/, "logMove", ["unit", "zone"]],
  [/^(.+)が(.+)へ渡河。$/, "logBuffalo", ["unit", "zone"]],
  [/^(.+)が(.+)に退却。$/, "logRetreat", ["unit", "zone"]],
  [/^(.+)を除去。$/, "logRemoved", ["unit"]],
  [/^双方その場にとどまる。$/, "logHold", []],
  [/^(.+) → (.+)　(\d+)対(\d+)（艦砲支援）。$/, "logFightNaval", ["attacker", "defender", "attack", "defense"]],
  [/^(.+) → (.+)　(\d+)対(\d+)。$/, "logFight", ["attacker", "defender", "attack", "defense"]],
];

let language = readLanguage();
let game = readGame();
let selected = null;
let boardHint = null;

function readLanguage() {
  const query = new URLSearchParams(location.search).get("lang");
  const requested = query === "zh" ? "zh-Hans" : query;
  if (Object.hasOwn(languageNames, requested)) return requested;
  try {
    const saved = localStorage.getItem(languageKey);
    if (Object.hasOwn(languageNames, saved)) return saved;
  } catch {
    // Locale selection remains available with storage disabled.
  }
  return "ja";
}

function t(key, args = {}) {
  return (locales[language][key] ?? locales.ja[key] ?? key)
    .replace(/\{(\w+)\}/g, (token, name) => Object.hasOwn(args, name) ? args[name] : token);
}

const nameOfZone = id => t(zoneKeys[id]);
const nameOfUnit = id => t("unit" + id);
const nameOfSide = side => t(side === "uk" ? "sideUk" : "sideDe");
const stepName = step => t(step % 2 === 0 ? "shortUk" : "shortDe")
  + (labelJoiner[language] ? "" : " ") + (step < 2 ? "①" : "②");
const actionName = (type, zone) => t(type + "To", {zone: nameOfZone(zone)});

function migrateMessage(text) {
  if (typeof text !== "string") return text;
  for (const [pattern, key, fields] of legacyPatterns) {
    const match = text.match(pattern);
    if (!match) continue;
    const args = Object.fromEntries(fields.map((field, i) => {
      const domain = ["attacker", "defender"].includes(field) ? "unit" : field;
      return [field, legacyNames[domain] ? legacyNames[domain][match[i + 1]] : Number(match[i + 1])];
    }));
    if (Object.values(args).every(value => value !== undefined)) return {key, args};
  }
  return text;
}

function messageText(message) {
  if (!message) return "";
  if (typeof message === "string") return message;
  const args = Object.fromEntries(Object.entries(message.args).map(([key, value]) => {
    if (["unit", "attacker", "defender"].includes(key)) return [key, nameOfUnit(value)];
    if (key === "side") return [key, nameOfSide(value)];
    if (key === "zone") return [key, nameOfZone(value)];
    return [key, value];
  }));
  return t(message.key, args);
}

function readGame() {
  try {
    const data = JSON.parse(localStorage.getItem(storageKey));
    if ([1, 2].includes(data?.version) && data.positions && Array.isArray(data.acted) && Array.isArray(data.log)) {
      if (data.version === 1) {
        data.log = data.log.map(({turn, step, text}) => ({turn, step, message: migrateMessage(text)}));
        if (data.pending?.result?.outcome) data.pending.result.outcome = migrateMessage(data.pending.result.outcome);
        data.version = 2;
      }
      return data;
    }
  } catch {
    // A local HTML file and private browsing can deny storage.
  }
  return newGame();
}

function saveGame() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(game));
  } catch {
    // The current game remains playable in memory.
  }
}

function safe(text) {
  return String(text).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[char]);
}

function counter(id) {
  const unit = pieces[id];
  return '<span class="piece"><b>' + (id === "G" ? t("unitGCode") : unit.code) + '</b><img src="' + images[id] + '" alt=""><small><span>' +
    unit.attack + '</span><span>' + unit.defense + '</span><span>' + unit.move + '</span></small></span>';
}

function position(zone) {
  return {x: (zone.x - 5) / 107, y: (82 - zone.y) / 76};
}

function buildBoard() {
  byId("board").style.backgroundImage = 'url("' + images.map + '")';
  for (const [id, zone] of Object.entries(zones)) {
    const p = position(zone);
    const control = document.createElement("button");
    control.type = "button";
    control.dataset.zone = id;
    control.style.left = p.x * 100 + "%";
    control.style.top = p.y * 100 + "%";
    if (zone.type) control.dataset.type = zone.type;
    control.addEventListener("click", () => chooseZone(id));
    const label = document.createElement("span");
    label.className = "zone-label" + (zone.above ? " above" : "") + (zone.type === "fort" ? " fort" : "");
    label.style.left = p.x * 100 + "%";
    label.style.top = "calc(" + p.y * 100 + "% " + (zone.above ? "- 6.3cqw)" : "+ 6.3cqw)");
    mapLabels.set(id, label);
    byId("zones").append(control, label);
    controls.set(id, control);
  }
  new ResizeObserver(drawRoutes).observe(byId("board"));
}

function drawRoutes() {
  const board = byId("board");
  const canvas = byId("routes");
  const {width, height} = board.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  const context = canvas.getContext("2d");
  context.scale(ratio, ratio);
  const lineWidth = Math.max(1.3, width / 355);
  const draw = (from, to, color, dash, curve) => {
    const a = position(zones[from]);
    const b = position(zones[to]);
    context.beginPath();
    context.moveTo(a.x * width, a.y * height);
    if (curve) {
      context.quadraticCurveTo((a.x + b.x) * width / 2, Math.max(a.y, b.y) * height + height * .07, b.x * width, b.y * height);
    } else {
      context.lineTo(b.x * width, b.y * height);
    }
    context.lineCap = "round";
    context.strokeStyle = "#f9f3dd";
    context.lineWidth = lineWidth + 2;
    context.setLineDash([]);
    context.stroke();
    context.strokeStyle = color;
    context.lineWidth = lineWidth;
    context.setLineDash(dash);
    context.stroke();
  };
  for (const [a, b] of solid) draw(a, b, "#53523d", []);
  for (const [a, b] of dashed) draw(a, b, "#2a6473", [6, 4]);
  if (selected && options(game, selected).some(move => move.type === "buffalo")) {
    draw(game.positions[selected], "dyke", "#267591", [2, 5], true);
  }
}

function allowedTargets() {
  if (game.pending?.type === "landing") return openBeaches(game).map(zone => ({zone, type: "landing"}));
  if (game.pending?.type === "retreat") return game.pending.retreat.map(zone => ({zone, type: "retreat"}));
  return selected ? options(game, selected) : [];
}

function renderBoard() {
  const targets = allowedTargets();
  for (const [id, control] of controls) {
    const unitId = occupant(game, id);
    const unit = pieces[unitId];
    const target = targets.find(option => option.zone === id);
    const active = (selected && unitId === selected) || game.pending?.attacker === unitId && Boolean(unitId);
    const used = unitId && game.acted.includes(unitId);
    const action = target ? t(target.type) : "";
    mapLabels.get(id).textContent = (zones[id].type === "fort" ? "★ " : "") + nameOfZone(id);
    control.dataset.badge = t("badge");
    control.className = ["zone", unit?.side, used && "acted", target && "target", target?.type].filter(Boolean).join(" ");
    control.setAttribute("aria-pressed", Boolean(active));
    const label = [nameOfZone(id), unitId && nameOfUnit(unitId), used && t("acted"), action]
      .filter(Boolean).join(labelJoiner[language] || ", ");
    control.setAttribute("aria-label", label);
    control.title = label;
    if (control.dataset.piece !== (unitId || "") || control.dataset.language !== language) {
      control.dataset.language = language;
      control.dataset.piece = unitId || "";
      control.innerHTML = unit ? counter(unitId) : "";
    }
  }
  drawRoutes();
}

function chooseZone(zone) {
  if (game.winner) return;
  if (game.pending?.type === "landing" || game.pending?.type === "retreat") {
    const accepted = game.pending.type === "landing" ? land(game, zone) : retreatTo(game, zone);
    if (accepted) changed();
    return;
  }
  if (game.pending) return;
  const move = selected && options(game, selected).find(item => item.zone === zone);
  if (move) {
    if (takeOption(game, selected, zone, move.type)) changed();
    return;
  }
  const id = occupant(game, zone);
  if (id && pieces[id].side === actor(game)) {
    if (selected === id) {
      selected = null;
      boardHint = null;
    } else if (game.acted.includes(id)) {
      selected = null;
      boardHint = {key: "actedHint", args: {unit: id}};
    } else {
      selected = id;
      boardHint = null;
    }
    render();
  } else {
    selected = null;
    boardHint = {key: "chooseOwn", args: {side: actor(game)}};
    render();
  }
}

function changed(shouldFocus = false) {
  selected = null;
  boardHint = null;
  saveGame();
  render();
  if (shouldFocus) byId("command-title").focus({preventScroll: true});
  byId("announcement").textContent = byId("command-title").textContent;
}

function controlsFor(zoneList, type) {
  return '<div class="orders">' + zoneList.map(zone => '<button type="button" data-zone="' +
    zone + '">' + safe(actionName(type, zone)) + '</button>').join("") + '</div>';
}

function results(result) {
  const a = pieces[result.attacker];
  const d = pieces[result.defender];
  return `<div class="dice"><div>${t("attack")} <strong>${result.attack}</strong>${dieFaces[result.attackDie]}
    ${result.attackDie} + ${t("atk")} ${a.attack}${result.naval ? ` + ${t("navalShort")} 2` : ""}
    </div><div>${t("defense")} <strong>${result.defense}</strong>${dieFaces[result.defenseDie]}
    ${result.defenseDie} + ${t("def")} ${d.defense}${result.fort ? ` + ${t("fort")} 1` : ""}</div></div>`;
}

function commandMarkup() {
  const title = text => `<h2 id="command-title" tabindex="-1">${safe(text)}</h2>`;
  const button = (action, key, cls = "") => `<button type="button" class="${cls}" data-act="${action}">${safe(t(key))}</button>`;
  const pending = game.pending;
  if (game.winner) {
    return title(t("win", {side: nameOfSide(game.winner)})) +
      `<p>${t("lastTurn")}</p>` + button("reset", "newMatch", "primary");
  }
  if (pending?.type === "landing") {
    return title(t("reinforcements")) + `<p>${t("chooseLanding", {unit: nameOfUnit("47")})}</p>` +
      controlsFor(openBeaches(game), "landing");
  }
  if (pending?.type === "retreat") {
    return title(t("sideRetreat", {side: nameOfSide(actor(game))})) + results(pending.result) +
      `<p>${t("chooseRetreat", {unit: nameOfUnit(pending.defender)})}</p>` + controlsFor(pending.retreat, "retreat");
  }
  if (pending?.type === "report") {
    return title(t("result")) + results(pending.result) + `<p>${safe(messageText(pending.result.outcome))}</p>` +
      button("continue", "continue", "primary");
  }
  if (pending?.type === "attack") {
    const a = pieces[pending.attacker];
    return title(t("attackTitle", {zone: nameOfZone(pending.zone)})) +
      `<p>${nameOfUnit(pending.attacker)} → ${nameOfUnit(pending.defender)}</p><div class="orders">` +
      (a.side === "uk" && game.support ? button("support", "useNaval", "primary") : "") +
      button("roll", "roll") + button("cancel", "back") + "</div>";
  }
  const passButton = button("pass", "pass");
  if (selected) {
    const choices = options(game, selected);
    const unit = pieces[selected];
    return title(nameOfUnit(selected)) +
      `<p class="hint">${t("atk")} ${unit.attack} · ${t("def")} ${unit.defense} · ${t("mov")} ${unit.move}</p>` +
      (choices.length ? '<div class="orders">' + choices.map(({zone, type}) =>
        `<button type="button" class="${type === "attack" ? "danger" : "primary"}" data-zone="${zone}">${safe(actionName(type, zone))}</button>`
      ).join("") + "</div>" : `<p>${t("noTargets")}</p>`) +
      '<div class="actions">' + button("clear", "clear") + passButton + "</div>";
  }
  return title(t("sideTurn", {side: nameOfSide(actor(game))})) +
    `<p>${safe(boardHint ? messageText(boardHint) : t("chooseUnit"))}</p>` + passButton;
}

function render() {
  renderBoard();
  byId("turn-number").innerHTML = `${safe(t("turn", {n: game.turn}))} <small>/ 6</small>`;
  byId("steps").innerHTML = [0, 1, 2, 3].map(i => '<li' +
    (!game.winner && i === game.step ? ' class="current' + (i % 2 ? ' de' : '') + '" aria-current="step"' :
      (i < game.step || game.winner ? ' class="done"' : '')) + '>' + stepName(i) + '</li>').join("");
  const statusKey = game.winner ? "ended" : game.pending?.type === "retreat" ? "sideRetreat" : "sideTurn";
  byId("turn-side").textContent = t(statusKey, {side: nameOfSide(actor(game))});
  byId("status").innerHTML = `<div class="resource"><span>${t("naval")}</span><strong>${t("left", {n: game.support})}</strong></div>
    <div class="resource"><span>${t("buffalo")}</span><strong>${t(game.buffalo ? "unused" : "used")}</strong></div>`;
  byId("command").classList.toggle("de", (game.winner || actor(game)) === "de");
  byId("command").innerHTML = commandMarkup();
  byId("objectives").innerHTML = ["north", "south"].map(zone => {
    const side = pieces[occupant(game, zone)]?.side;
    return `<div class="objective"><span>${nameOfZone(zone)}</span><b class="${side || ""}">${side ? nameOfSide(side) : t("empty")}</b></div>`;
  }).join("");
  byId("log-count").textContent = game.log.length ? `(${game.log.length})` : "";
  byId("log").innerHTML = game.log.length ? game.log.map(event =>
    `<li><small>${safe(t("turn", {n: event.turn}))} ${stepName(event.step)}</small>${safe(messageText(event.message))}</li>`
  ).join("") : `<li>${t("logStart")}</li>`;
}

byId("command").addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;
  if (button.dataset.zone) {
    chooseZone(button.dataset.zone);
    byId("command-title").focus({preventScroll: true});
    return;
  }
  switch (button.dataset.act) {
    case "pass": if (pass(game)) changed(true); break;
    case "roll": if (fight(game, false)) changed(true); break;
    case "support": if (fight(game, true)) changed(true); break;
    case "continue": if (acknowledgeReport(game)) changed(true); break;
    case "cancel":
      selected = game.pending.attacker;
      game.pending = null;
      saveGame();
      render();
      byId("command-title").focus({preventScroll: true});
      break;
    case "clear":
      selected = null;
      render();
      byId("command-title").focus({preventScroll: true});
      break;
    case "reset": byId("reset-dialog").showModal(); break;
  }
});
byId("open-rules").addEventListener("click", () => byId("rules-dialog").showModal());
byId("open-reset").addEventListener("click", () => byId("reset-dialog").showModal());
byId("reset").addEventListener("click", () => {
  game = newGame();
  byId("reset-dialog").close();
  changed(true);
});
function illustration(id) {
  return '<img src="' + images[id] + '" alt="">';
}
function renderLocale() {
  document.documentElement.lang = language;
  document.title = t("title") + " · " + t("subtitle");
  document.querySelector('meta[name="description"]').content = t("description");
  for (const element of document.querySelectorAll("[data-text]")) element.textContent = t(element.dataset.text);
  for (const element of document.querySelectorAll("[data-label]")) element.setAttribute("aria-label", t(element.dataset.label));
  for (const element of document.querySelectorAll("[data-rule]")) {
    element.innerHTML = safe(t(element.dataset.rule)).replace(/\{(41|47|W15|W13)\}/g, (_, id) =>
      '<span class="inline-piece">' + illustration(id) +
      safe(id.startsWith("W") ? pieces[id].code : nameOfUnit(id)) + "</span>");
  }
  byId("unit-rows").innerHTML = pieceOrder.map(id => {
    const unit = pieces[id];
    return `<tr><td>${illustration(id)}${safe(nameOfUnit(id))}</td><td>${unit.attack}</td>
      <td>${unit.defense}</td><td>${unit.move}</td></tr>`;
  }).join("");
  render();
}

const picker = byId("language");
for (const [code, name] of Object.entries(languageNames)) {
  const option = new Option(name, code);
  option.lang = code;
  picker.add(option);
}
picker.value = language;
picker.addEventListener("change", event => {
  language = event.target.value;
  try {
    localStorage.setItem(languageKey, language);
  } catch {
    // The selection still applies to the current page.
  }
  try {
    const url = new URL(location.href);
    url.searchParams.set("lang", language === "zh-Hans" ? "zh" : language);
    history.replaceState(null, "", url);
  } catch {
    // Some browsers disallow URL updates for local HTML files.
  }
  renderLocale();
});

buildBoard();
saveGame();
renderLocale();
</script>
